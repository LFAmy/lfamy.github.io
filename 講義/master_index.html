// ═══ Render ═══
function renderLectures(data) {
  var html = '';
  var grades = ['P3','P4','P5','P6'];
  for (var g = 0; g < grades.length; g++) {
    var grade = grades[g];
    var lectures = data[grade] || [];
    html += '<div class="grade-section" data-grade="' + grade + '">';
    html += '<div class="grade-header">';
    html += '<h2>' + grade + ' ' + (grade==='P3'?'小三':grade==='P4'?'小四':grade==='P5'?'小五':'小六') + '</h2>';
    html += '<span class="count">' + lectures.length + ' 堂</span>';
    html += '<a href="/practice.html?grade=' + grade + '" class="practice-link">練習此年級 →</a>';
    html += '</div>';
    html += '<div class="lecture-grid">';
    for (var i = 0; i < lectures.length; i++) {
      var l = lectures[i];
      var lecturePath = '/講義/' + grade + '/' + l.file;
      var akFile = l.file.replace('.html', '_AK.html');
      var akPath = '/講義/' + grade + '/' + akFile;
      var topicEncoded = encodeURIComponent(l.topic);
      html += '<div class="lecture-card" data-topic="' + l.topic + '">';
      html += '<span class="num">' + (l.num < 10 ? '0' : '') + l.num + '</span>';
      html += '<div class="info">';
      html += '<div class="topic">' + l.topic + '</div>';
      html += '<div class="meta">' + grade + ' · ' + (l.size||'?') + 'KB</div>';
      html += '</div>';
      html += '<div class="actions">';
      html += '<a href="' + lecturePath + '" class="act-btn act-practice" target="_blank">📖 講義</a>';
      html += '<a href="/practice.html?grade=' + grade + '&topic=' + topicEncoded + '" class="act-btn act-ak">📝 練習</a>';
      html += '</div>';
      html += '</div>';
    }
    html += '</div></div>';
  }
  document.getElementById('lectureContent').innerHTML = html;
}

// ═══ Search Filter ═══
function filterLectures() {
  var query = (document.getElementById('searchInput').value || '').toLowerCase();
  var cards = document.querySelectorAll('.lecture-card');
  var sections = document.querySelectorAll('.grade-section');
  
  sections.forEach(function(section) {
    var gradeCards = section.querySelectorAll('.lecture-card');
    var visible = 0;
    gradeCards.forEach(function(card) {
      var topic = (card.dataset.topic || '').toLowerCase();
      if (!query || topic.includes(query)) {
        card.style.display = '';
        visible++;
      } else {
        card.style.display = 'none';
      }
    });
    section.style.display = visible > 0 ? '' : 'none';
  });
  
  var totalVisible = document.querySelectorAll('.lecture-card[style=""]').length + 
    document.querySelectorAll('.lecture-card:not([style])').length;
  
  var noResults = document.getElementById('noResults');
  if (totalVisible === 0 && query) {
    if (!noResults) {
      noResults = document.createElement('div');
      noResults.id = 'noResults';
      noResults.className = 'no-results';
      noResults.textContent = '找不到匹配「' + query + '」的課題';
      document.getElementById('lectureContent').appendChild(noResults);
    }
  } else if (noResults) {
    noResults.remove();
  }
}

// ═══ Init ═══
