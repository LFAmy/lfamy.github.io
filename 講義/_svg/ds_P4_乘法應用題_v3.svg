<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#d6e4ff"/>
    </radialGradient>

    <!-- 主卡片漸變 - 3D光影效果 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>

    <!-- 盒子漸變 - 3D立體效果 -->
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="30%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#d32f2f"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="30%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#e64a19"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="30%" stop-color="#ffc107"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="30%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="30%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </linearGradient>
    <linearGradient id="boxGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e57c2"/>
      <stop offset="30%" stop-color="#673ab7"/>
      <stop offset="100%" stop-color="#4527a0"/>
    </linearGradient>
    <linearGradient id="boxGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec407a"/>
      <stop offset="30%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#ad1457"/>
    </linearGradient>
    <linearGradient id="boxGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="30%" stop-color="#607d8b"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>

    <!-- 盒子頂面漸變 -->
    <linearGradient id="boxTop1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8a8a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="boxTop2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffab91" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff8a65" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="boxTop3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="boxTop4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5d6a7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#81c784" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="boxTop5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80deea" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4dd0e1" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="boxTop6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9575cd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7e57c2" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="boxTop7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f06292" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec407a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="boxTop8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90a4ae" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#78909c" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 盒子陰影 -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000040"/>
    </filter>

    <!-- 主卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a237e30"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1a237e20"/>
    </filter>

    <!-- 發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 放射漸變 -->
    <radialGradient id="radialGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 數字標籤漸變 -->
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eaf6"/>
    </linearGradient>

    <!-- 分組區域漸變 -->
    <linearGradient id="groupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eaf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c5cae9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓 -->
  <circle cx="50" cy="50" r="80" fill="#ffffff" opacity="0.15"/>
  <circle cx="550" cy="350" r="100" fill="#ffffff" opacity="0.1"/>
  <circle cx="300" cy="200" r="150" fill="#ffffff" opacity="0.05"/>

  <!-- 主卡片 -->
  <rect x="15" y="15" width="570" height="370" rx="18" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="15" y="15" width="570" height="370" rx="18" fill="url(#radialGlow)"/>

  <!-- 頂部裝飾條 -->
  <rect x="15" y="15" width="570" height="6" rx="3" fill="url(#titleGrad)"/>

  <!-- 標題 -->
  <text x="300" y="52" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" filter="url(#glow)">📐 乘法應用：陣列與分組</text>

  <!-- 分隔線 -->
  <line x1="40" y1="65" x2="560" y2="65" stroke="#c5cae9" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== 左側：陣列模型（8盒×12支） ===== -->

  <!-- 左側區域標題 -->
  <rect x="30" y="78" width="260" height="28" rx="14" fill="#e8eaf6" opacity="0.7"/>
  <text x="160" y="97" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#283593">📦 陣列模型：8盒 × 12支</text>

  <!-- 盒子陣列 - 2行4列 -->
  <!-- 第1行 -->
  <g filter="url(#boxShadow)">
    <!-- 盒子1 -->
    <rect x="35" y="115" width="55" height="50" rx="6" fill="url(#boxGrad1)"/>
    <rect x="35" y="115" width="55" height="16" rx="6" fill="url(#boxTop1)"/>
    <rect x="35" y="125" width="55" height="6" fill="url(#boxTop1)"/>
    <text x="62" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff" font-weight="bold">12</text>

    <!-- 盒子2 -->
    <rect x="98" y="115" width="55" height="50" rx="6" fill="url(#boxGrad2)"/>
    <rect x="98" y="115" width="55" height="16" rx="6" fill="url(#boxTop2)"/>
    <rect x="98" y="125" width="55" height="6" fill="url(#boxTop2)"/>
    <text x="125" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff" font-weight="bold">12</text>

    <!-- 盒子3 -->
    <rect x="161" y="115" width="55" height="50" rx="6" fill="url(#boxGrad3)"/>
    <rect x="161" y="115" width="55" height="16" rx="6" fill="url(#boxTop3)"/>
    <rect x="161" y="125" width="55" height="6" fill="url(#boxTop3)"/>
    <text x="188" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff" font-weight="bold">12</text>

    <!-- 盒子4 -->
    <rect x="224" y="115" width="55" height="50" rx="6" fill="url(#boxGrad4)"/>
    <rect x="224" y="115" width="55" height="16" rx="6" fill="url(#boxTop4)"/>
    <rect x="224" y="125" width="55" height="6" fill="url(#boxTop4)"/>
    <text x="251" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff" font-weight="bold">12</text>
  </g>

  <!-- 第2行 -->
  <g filter="url(#boxShadow)">
    <!-- 盒子5 -->
    <rect x="35" y="175" width="55" height="50" rx="6" fill="url(#boxGrad5)"/>
    <rect x="35" y="175" width="55" height="16" rx="6" fill="url(#boxTop5)"/>
    <rect x="35" y="185" width="55" height="6" fill="url(#boxTop5)"/>
    <text x="62" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff" font-weight="bold">12</text>

    <!-- 盒子6 -->
    <rect x="98" y="175" width="55" height="50" rx="6" fill="url(#boxGrad6)"/>
    <rect x="98" y="175" width="55" height="16" rx="6" fill="url(#boxTop6)"/>
    <rect x="98" y="185" width="55" height="6" fill="url(#boxTop6)"/>
    <text x="125" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff" font-weight="bold">12</text>

    <!-- 盒子7 -->
    <rect x="161" y="175" width="55" height="50" rx="6" fill="url(#boxGrad7)"/>
    <rect x="161" y="175" width="55" height="16" rx="6" fill="url(#boxTop7)"/>
    <rect x="161" y="185" width="55" height="6" fill="url(#boxTop7)"/>
    <text x="188" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff" font-weight="bold">12</text>

    <!-- 盒子8 -->
    <rect x="224" y="175" width="55" height="50" rx="6" fill="url(#boxGrad8)"/>
    <rect x="224" y="175" width="55" height="16" rx="6" fill="url(#boxTop8)"/>
    <rect x="224" y="185" width="55" height="6" fill="url(#boxTop8)"/>
    <text x="251" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#fff" font-weight="bold">12</text>
  </g>

  <!-- 陣列標籤 -->
  <rect x="30" y="240" width="260" height="24" rx="12" fill="#283593" opacity="0.1"/>
  <text x="160" y="256" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#283593" font-weight="bold">8 盒 × 12 支 = 96 支</text>

  <!-- 陣列箭頭說明 -->
  <line x1="55" y1="235" x2="55" y2="245" stroke="#283593" stroke-width="1.5" marker-end="url(#arrowSmall)"/>
  <line x1="265" y1="235" x2="265" y2="245" stroke="#283593" stroke-width="1.5"/>

  <!-- ===== 右側：分組模型 ===== -->

  <!-- 右側區域標題 -->
  <rect x="310" y="78" width="260" height="28" rx="14" fill="#e8eaf6" opacity="0.7"/>
  <text x="440" y="97" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#283593">🔢 分組模型：8組 × 12個</text>

  <!-- 分組圓圈 - 8組，每組12個點 -->
  <!-- 第1組 -->
  <g>
    <circle cx="340" cy="125" r="18" fill="none" stroke="#ff5252" stroke-width="1.5" opacity="0.6"/>
    <text x="340" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#d32f2f" font-weight="bold">12</text>
  </g>

  <!-- 第2組 -->
  <g>
    <circle cx="400" cy="125" r="18" fill="none" stroke="#ff7043" stroke-width="1.5" opacity="0.6"/>
    <text x="400" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e64a19" font-weight="bold">12</text>
  </g>

  <!-- 第3組 -->
  <g>
    <circle cx="460" cy="125" r="18" fill="none" stroke="#ffc107" stroke-width="1.5" opacity="0.6"/>
    <text x="460" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#f9a825" font-weight="bold">12</text>
  </g>

  <!-- 第4組 -->
  <g>
    <circle cx="520" cy="125" r="18" fill="none" stroke="#66bb6a" stroke-width="1.5" opacity="0.6"/>
    <text x="520" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#388e3c" font-weight="bold">12</text>
  </g>

  <!-- 第5組 -->
  <g>
    <circle cx="340" cy="175" r="18" fill="none" stroke="#26c6da" stroke-width="1.5" opacity="0.6"/>
    <text x="340" y="179" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#0097a7" font-weight="bold">12</text>
  </g>

  <!-- 第6組 -->
  <g>
    <circle cx="400" cy="175" r="18" fill="none" stroke="#673ab7" stroke-width="1.5" opacity="0.6"/>
    <text x="400" y="179" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#4527a0" font-weight="bold">12</text>
  </g>

  <!-- 第7組 -->
  <g>
    <circle cx="460" cy="175" r="18" fill="none" stroke="#e91e63" stroke-width="1.5" opacity="0.6"/>
    <text x="460" y="179" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ad1457" font-weight="bold">12</text>
  </g>

  <!-- 第8組 -->
  <g>
    <circle cx="520" cy="175" r="18" fill="none" stroke="#607d8b" stroke-width="1.5" opacity="0.6"/>
    <text x="520" y="179" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#37474f" font-weight="bold">12</text>
  </g>

  <!-- 分組連接線 -->
  <line x1="358" y1="125" x2="382" y2="125" stroke="#c5cae9" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="418" y1="125" x2="442" y2="125" stroke="#c5cae9" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="478" y1="125" x2="502" y2="125" stroke="#c5cae9" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="358" y1="175" x2="382" y2="175" stroke="#c5cae9" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="418" y1="175" x2="442" y2="175" stroke="#c5cae9" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="478" y1="175" x2="502" y2="175" stroke="#c5cae9" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 分組標籤 -->
  <rect x="310" y="240" width="260" height="24" rx="12" fill="#283593" opacity="0.1"/>
  <text x="440" y="256" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#283593" font-weight="bold">8 組 × 12 個 = 96 個</text>

  <!-- ===== 底部結果區域 ===== -->

  <!-- 底部卡片 -->
  <rect x="30" y="278" width="540" height="90" rx="14" fill="#283593" opacity="0.06"/>
  <rect x="30" y="278" width="540" height="90" rx="14" fill="none" stroke="#283593" stroke-width="1" opacity="0.15"/>

  <!-- 結果文字 -->
  <text x="300" y="308" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#283593" font-weight="bold">✨ 乘法應用：每盒12支，買8盒，總共有多少支？</text>

  <!-- 計算過程 -->
  <text x="300" y="338" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" fill="#1a237e" font-weight="bold">12 × 8 = 96</text>

  <!-- 答案 -->
  <rect x="230" y="348" width="140" height="28" rx="14" fill="#1a237e"/>
  <text x="300" y="367" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#ffffff" font-weight="bold">✅ 答案：96 支</text>

  <!-- 裝飾小元素 -->
  <circle cx="45" cy="353" r="4" fill="#ff5252" opacity="0.4"/>
  <circle cx="555" cy="353" r="4" fill="#26c6da" opacity="0.4"/>
  <circle cx="45" cy="363" r="3" fill="#ffc107" opacity="0.4"/>
  <circle cx="555" cy="363" r="3" fill="#66bb6a" opacity="0.4"/>

  <!-- 底部裝飾點 -->
  <circle cx="280" cy="373" r="2" fill="#1a237e" opacity="0.2"/>
  <circle cx="300" cy="373" r="2" fill="#1a237e" opacity="0.2"/>
  <circle cx="320" cy="373" r="2" fill="#1a237e" opacity="0.2"/>
</svg>