<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="50%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>

    <!-- 卡片1：排水法 漸變 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E3F2FD"/>
      <stop offset="60%" stop-color="#BBDEFB"/>
      <stop offset="85%" stop-color="#90CAF9"/>
      <stop offset="100%" stop-color="#64B5F6"/>
    </linearGradient>

    <!-- 卡片2：截面法 漸變 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E8F5E9"/>
      <stop offset="60%" stop-color="#C8E6C9"/>
      <stop offset="85%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>

    <!-- 卡片3：單位階梯 漸變 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFF3E0"/>
      <stop offset="60%" stop-color="#FFE0B2"/>
      <stop offset="85%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>

    <!-- 水體漸變（排水法） -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#29B6F6" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#039BE5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0277BD" stop-opacity="0.9"/>
    </linearGradient>

    <!-- 水體放射漸變 -->
    <radialGradient id="waterRadial" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#B3E5FC" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#4FC3F7" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0288D1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#01579B" stop-opacity="0.8"/>
    </radialGradient>

    <!-- 石頭漸變 -->
    <radialGradient id="stoneGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9E9E9E"/>
      <stop offset="30%" stop-color="#757575"/>
      <stop offset="60%" stop-color="#616161"/>
      <stop offset="100%" stop-color="#424242"/>
    </radialGradient>

    <!-- 柱體漸變（截面法） -->
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="25%" stop-color="#81C784"/>
      <stop offset="50%" stop-color="#A5D6A7"/>
      <stop offset="75%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>

    <!-- 柱體頂部橢圓漸變 -->
    <radialGradient id="cylinderTopGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="50%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#81C784"/>
    </radialGradient>

    <!-- 單位階梯漸變 -->
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>

    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </linearGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- 輕陰影 -->
    <filter id="lightShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- 網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E0E6ED" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="gridLarge" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#D0D8E0" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E65100"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect width="600" height="400" fill="url(#gridLarge)"/>

  <!-- ==================== 卡片1：排水法（左） ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="15" y="15" width="185" height="175" rx="12" ry="12" fill="url(#card1Grad)" stroke="#90CAF9" stroke-width="1.5"/>

    <!-- 標題 -->
    <text x="107" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565C0">排水法</text>
    <text x="107" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1976D2">石入水升</text>

    <!-- 量杯（3D效果） -->
    <g transform="translate(55, 58)">
      <!-- 量杯本體 -->
      <path d="M8,0 L8,85 Q8,95 18,95 L57,95 Q67,95 67,85 L67,0 Z" fill="#E1F5FE" stroke="#0288D1" stroke-width="1.2" opacity="0.9"/>
      <!-- 量杯內水（放射漸變） -->
      <path d="M10,35 L10,83 Q10,93 18,93 L57,93 Q65,93 65,83 L65,35 Z" fill="url(#waterRadial)"/>
      <!-- 水面線 -->
      <line x1="10" y1="35" x2="65" y2="35" stroke="#0277BD" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- 刻度 -->
      <line x1="67" y1="20" x2="72" y2="20" stroke="#0288D1" stroke-width="0.8"/>
      <text x="74" y="23" font-family="Arial" font-size="6" fill="#0288D1">80</text>
      <line x1="67" y1="35" x2="72" y2="35" stroke="#0288D1" stroke-width="0.8"/>
      <text x="74" y="38" font-family="Arial" font-size="6" fill="#0288D1">60</text>
      <line x1="67" y1="50" x2="72" y2="50" stroke="#0288D1" stroke-width="0.8"/>
      <text x="74" y="53" font-family="Arial" font-size="6" fill="#0288D1">40</text>
      <line x1="67" y1="65" x2="72" y2="65" stroke="#0288D1" stroke-width="0.8"/>
      <text x="74" y="68" font-family="Arial" font-size="6" fill="#0288D1">20</text>
      <!-- 石頭 -->
      <ellipse cx="38" cy="72" rx="12" ry="8" fill="url(#stoneGrad)" stroke="#333" stroke-width="0.8"/>
      <!-- 水面上升箭頭 -->
      <line x1="30" y1="35" x2="30" y2="22" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
      <text x="22" y="20" font-family="Arial" font-size="6" fill="#1565C0" font-weight="bold">↑</text>
    </g>

    <!-- 說明文字 -->
    <text x="107" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#37474F">體積 = 水位上升</text>
    <text x="107" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#37474F">的容量</text>
  </g>

  <!-- ==================== 卡片2：截面法（中） ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="207" y="15" width="185" height="175" rx="12" ry="12" fill="url(#card2Grad)" stroke="#A5D6A7" stroke-width="1.5"/>

    <!-- 標題 -->
    <text x="299" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2E7D32">截面法</text>
    <text x="299" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#388E3C">柱體體積</text>

    <!-- 3D柱體 -->
    <g transform="translate(260, 58)">
      <!-- 柱體側面 -->
      <rect x="0" y="15" width="78" height="75" rx="2" fill="url(#cylinderGrad)" stroke="#4CAF50" stroke-width="1"/>
      <!-- 柱體頂部橢圓 -->
      <ellipse cx="39" cy="15" rx="39" ry="10" fill="url(#cylinderTopGrad)" stroke="#4CAF50" stroke-width="1"/>
      <!-- 柱體底部弧線 -->
      <ellipse cx="39" cy="90" rx="39" ry="10" fill="none" stroke="#4CAF50" stroke-width="0.8" opacity="0.5"/>
      <!-- 內部虛線（高度標示） -->
      <line x1="15" y1="15" x2="15" y2="90" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3,2"/>
      <line x1="63" y1="15" x2="63" y2="90" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3,2"/>
      <!-- 高度標籤 -->
      <text x="8" y="55" font-family="Arial" font-size="7" fill="#2E7D32" text-anchor="end">h</text>
      <!-- 底面積標示 -->
      <text x="39" y="107" text-anchor="middle" font-family="Arial" font-size="7" fill="#2E7D32">底面積 A</text>
      <!-- 截面示意 -->
      <ellipse cx="39" cy="50" rx="30" ry="7" fill="none" stroke="#FF6F00" stroke-width="0.8" stroke-dasharray="4,2" opacity="0.6"/>
      <text x="39" y="52" text-anchor="middle" font-family="Arial" font-size="6" fill="#FF6F00" opacity="0.7">截面</text>
    </g>

    <!-- 公式 -->
    <text x="299" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#37474F">體積 = 底面積 × 高</text>
    <text x="299" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#37474F">V = A × h</text>
  </g>

  <!-- ==================== 卡片3：單位階梯（右） ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="399" y="15" width="185" height="175" rx="12" ry="12" fill="url(#card3Grad)" stroke="#FFCC80" stroke-width="1.5"/>

    <!-- 標題 -->
    <text x="491" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E65100">單位階梯</text>
    <text x="491" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#EF6C00">cm³ ↔ mL ↔ L</text>

    <!-- 階梯圖示 -->
    <g transform="translate(425, 65)">
      <!-- 階梯1：cm³ -->
      <rect x="0" y="55" width="50" height="22" rx="4" fill="url(#step1Grad)" stroke="#E64A19" stroke-width="1"/>
      <text x="25" y="70" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#FFF">cm³</text>

      <!-- 階梯2：mL -->
      <rect x="25" y="33" width="50" height="22" rx="4" fill="url(#step2Grad)" stroke="#F57C00" stroke-width="1"/>
      <text x="50" y="48" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#FFF">mL</text>

      <!-- 階梯3：L -->
      <rect x="50" y="11" width="50" height="22" rx="4" fill="url(#step3Grad)" stroke="#F9A825" stroke-width="1"/>
      <text x="75" y="26" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#FFF">L</text>

      <!-- 連接箭頭 -->
      <line x1="50" y1="55" x2="50" y2="34" stroke="#E65100" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
      <line x1="75" y1="33" x2="75" y2="12" stroke="#E65100" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

      <!-- 等號標示 -->
      <text x="58" y="62" font-family="Arial" font-size="7" fill="#BF360C">=</text>
      <text x="83" y="40" font-family="Arial" font-size="7" fill="#BF360C">=</text>
    </g>

    <!-- 換算說明 -->
    <text x="491" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#37474F">1 cm³ = 1 mL</text>
    <text x="491" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#37474F">1000 mL = 1 L</text>
    <text x="491" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#37474F">1000 cm³ = 1 L</text>
  </g>

  <!-- ==================== 底部連接元素 ==================== -->
  <g filter="url(#lightShadow)">
    <!-- 連接卡片1和卡片2 -->
    <line x1="200" y1="100" x2="207" y2="100" stroke="#90CAF9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <!-- 連接卡片2和卡片3 -->
    <line x1="392" y1="100" x2="399" y2="100" stroke="#FFCC80" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  </g>

  <!-- ==================== 底部標題列 ==================== -->
  <g filter="url(#lightShadow)">
    <rect x="130" y="200" width="340" height="28" rx="14" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1" opacity="0.9"/>
    <text x="300" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#37474F">📐 容量與體積 — 三合一對比</text>
  </g>

  <!-- ==================== 底部資訊區 ==================== -->
  <g transform="translate(0, 240)">
    <!-- 實例區 -->
    <rect x="15" y="0" width="570" height="75" rx="10" fill="#FFFFFF" fill-opacity="0.7" stroke="#CFD8DC" stroke-width="1" filter="url(#lightShadow)"/>

    <text x="30" y="20" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#455A64">💡 生活實例：</text>

    <!-- 實例1 -->
    <rect x="30" y="28" width="120" height="38" rx="6" fill="#E3F2FD" stroke="#90CAF9" stroke-width="0.8"/>
    <text x="90" y="44" text-anchor="middle" font-family="Arial" font-size="8" fill="#1565C0">🏊 泳池水量</text>
    <text x="90" y="56" text-anchor="middle" font-family="Arial" font-size="7" fill="#37474F">用排水法計算</text>

    <!-- 實例2 -->
    <rect x="165" y="28" width="120" height="38" rx="6" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="0.8"/>
    <text x="225" y="44" text-anchor="middle" font-family="Arial" font-size="8" fill="#2E7D32">📦 紙箱容量</text>
    <text x="225" y="56" text-anchor="middle" font-family="Arial" font-size="7" fill="#37474F">用截面法計算</text>

    <!-- 實例3 -->
    <rect x="300" y="28" width="120" height="38" rx="6" fill="#FFF3E0" stroke="#FFCC80" stroke-width="0.8"/>
    <text x="360" y="44" text-anchor="middle" font-family="Arial" font-size="8" fill="#E65100">🥤 飲料容量</text>
    <text x="360" y="56" text-anchor="middle" font-family="Arial" font-size="7" fill="#37474F">mL 與 L 換算</text>

    <!-- 實例4 -->
    <rect x="435" y="28" width="135" height="38" rx="6" fill="#F3E5F5" stroke="#CE93D8" stroke-width="0.8"/>
    <text x="502" y="44" text-anchor="middle" font-family="Arial" font-size="8" fill="#6A1B9A">🧊 不規則物體</text>
    <text x="502" y="56" text-anchor="middle" font-family="Arial" font-size="7" fill="#37474F">排水法測體積</text>
  </g>

  <!-- ==================== 底部裝飾 ==================== -->
  <g transform="translate(0, 325)">
    <rect x="15" y="0" width="570" height="65" rx="10" fill="#FFFFFF" fill-opacity="0.5" stroke="#E0E6ED" stroke-width="0.8"/>

    <!-- 小提示 -->
    <text x="30" y="18" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#607D8B">📝 小提示：</text>
    <text x="30" y="33" font-family="Arial, sans-serif" font-size="8" fill="#546E7A">• 排水法：將物體放入水中，水位上升的容量 = 物體體積</text>
    <text x="30" y="46" font-family="Arial, sans-serif" font-size="8" fill="#546E7A">• 截面法：柱體體積 = 底面積 × 高（V = A × h）</text>
    <text x="30" y="59" font-family="Arial, sans-serif" font-size="8" fill="#546E7A">• 單位換算：1 cm³ = 1 mL，1000 mL = 1 L</text>
  </g>
</svg>