<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4F8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FAFBFC;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8EEF4;stop-opacity:1"/>
    </linearGradient>

    <!-- 卡片主漸變 - 藍色 -->
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#5BA0E8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#3A7BC8;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#2E6AB5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A5A9E;stop-opacity:1"/>
    </linearGradient>

    <!-- 卡片主漸變 - 綠色 -->
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#66BB6A;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#43A047;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#388E3C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1"/>
    </linearGradient>

    <!-- 卡片主漸變 - 橙色 -->
    <linearGradient id="cardOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#FFB74D;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#F57C00;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#EF6C00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1"/>
    </linearGradient>

    <!-- 卡片主漸變 - 紫色 -->
    <linearGradient id="cardPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#BA68C8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#8E24AA;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#7B1FA2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1"/>
    </linearGradient>

    <!-- 3D光影放射漸變 -->
    <radialGradient id="shineBlue" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15"/>
    </radialGradient>

    <radialGradient id="shineGreen" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15"/>
    </radialGradient>

    <radialGradient id="shineOrange" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15"/>
    </radialGradient>

    <radialGradient id="shinePurple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15"/>
    </radialGradient>

    <!-- 標尺漸變 -->
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E1;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#FFECB3;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#FFE082;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFD54F;stop-opacity:1"/>
    </linearGradient>

    <!-- 陰影過濾器 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A237E" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <filter id="cardShadowLight" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1A237E" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="rulerShadow" x="-5%" y="-10%" width="115%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- 物品圖示漸變 -->
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FFC107;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFB300;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8D6E63;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#6D4C41;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5D4037;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78909C;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#607D8B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#546E7A;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1A237E" letter-spacing="1">📏 長度比較 · 香港小學數學</text>
  <text x="300" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5C6BC0">mm · cm · m · km</text>

  <!-- ============ 比較尺區域 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="62" width="540" height="70" rx="14" fill="url(#cardBlue)"/>
    <rect x="30" y="62" width="540" height="70" rx="14" fill="url(#shineBlue)"/>
  </g>

  <!-- 尺子本體 -->
  <g filter="url(#rulerShadow)">
    <rect x="55" y="78" width="490" height="24" rx="4" fill="url(#rulerGrad)"/>
    <!-- 尺子刻度 -->
    <g stroke="#5D4037" stroke-width="1">
      <!-- mm 刻度（小刻度） -->
      <line x1="75" y1="78" x2="75" y2="86"/>
      <line x1="95" y1="78" x2="95" y2="86"/>
      <line x1="115" y1="78" x2="115" y2="86"/>
      <line x1="135" y1="78" x2="135" y2="86"/>
      <line x1="155" y1="78" x2="155" y2="86"/>
      <line x1="175" y1="78" x2="175" y2="86"/>
      <line x1="195" y1="78" x2="195" y2="86"/>
      <line x1="215" y1="78" x2="215" y2="86"/>
      <line x1="235" y1="78" x2="235" y2="86"/>
      <line x1="255" y1="78" x2="255" y2="86"/>
      <line x1="275" y1="78" x2="275" y2="86"/>
      <line x1="295" y1="78" x2="295" y2="86"/>
      <line x1="315" y1="78" x2="315" y2="86"/>
      <line x1="335" y1="78" x2="335" y2="86"/>
      <line x1="355" y1="78" x2="355" y2="86"/>
      <line x1="375" y1="78" x2="375" y2="86"/>
      <line x1="395" y1="78" x2="395" y2="86"/>
      <line x1="415" y1="78" x2="415" y2="86"/>
      <line x1="435" y1="78" x2="435" y2="86"/>
      <line x1="455" y1="78" x2="455" y2="86"/>
      <line x1="475" y1="78" x2="475" y2="86"/>
      <line x1="495" y1="78" x2="495" y2="86"/>
      <line x1="515" y1="78" x2="515" y2="86"/>
      <!-- cm 刻度（中刻度） -->
      <line x1="85" y1="78" x2="85" y2="92" stroke-width="1.5"/>
      <line x1="145" y1="78" x2="145" y2="92" stroke-width="1.5"/>
      <line x1="205" y1="78" x2="205" y2="92" stroke-width="1.5"/>
      <line x1="265" y1="78" x2="265" y2="92" stroke-width="1.5"/>
      <line x1="325" y1="78" x2="325" y2="92" stroke-width="1.5"/>
      <line x1="385" y1="78" x2="385" y2="92" stroke-width="1.5"/>
      <line x1="445" y1="78" x2="445" y2="92" stroke-width="1.5"/>
      <line x1="505" y1="78" x2="505" y2="92" stroke-width="1.5"/>
      <!-- 主要刻度（大刻度） -->
      <line x1="65" y1="78" x2="65" y2="98" stroke-width="2"/>
      <line x1="125" y1="78" x2="125" y2="98" stroke-width="2"/>
      <line x1="185" y1="78" x2="185" y2="98" stroke-width="2"/>
      <line x1="245" y1="78" x2="245" y2="98" stroke-width="2"/>
      <line x1="305" y1="78" x2="305" y2="98" stroke-width="2"/>
      <line x1="365" y1="78" x2="365" y2="98" stroke-width="2"/>
      <line x1="425" y1="78" x2="425" y2="98" stroke-width="2"/>
      <line x1="485" y1="78" x2="485" y2="98" stroke-width="2"/>
      <line x1="535" y1="78" x2="535" y2="98" stroke-width="2"/>
    </g>
    <!-- 尺子數字 -->
    <g font-family="Arial, sans-serif" font-size="8" fill="#5D4037" text-anchor="middle">
      <text x="65" y="106">0</text>
      <text x="125" y="106">1</text>
      <text x="185" y="106">2</text>
      <text x="245" y="106">3</text>
      <text x="305" y="106">4</text>
      <text x="365" y="106">5</text>
      <text x="425" y="106">6</text>
      <text x="485" y="106">7</text>
      <text x="535" y="106">8</text>
    </g>
  </g>

  <!-- 尺子單位標籤 -->
  <text x="300" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">cm</text>

  <!-- ============ 物品比較卡片 ============ -->

  <!-- 鉛筆 15cm -->
  <g filter="url(#cardShadowLight)">
    <rect x="30" y="148" width="170" height="110" rx="12" fill="url(#cardOrange)"/>
    <rect x="30" y="148" width="170" height="110" rx="12" fill="url(#shineOrange)"/>
  </g>
  <text x="115" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">✏️ 鉛筆</text>
  <!-- 鉛筆圖示 -->
  <g transform="translate(115, 200)">
    <rect x="-3" y="-20" width="6" height="40" rx="1" fill="url(#pencilGrad)"/>
    <polygon points="-3,-20 3,-20 0,-28" fill="#FF6F00"/>
    <rect x="-3" y="18" width="6" height="2" rx="1" fill="#795548"/>
  </g>
  <text x="115" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">15 cm</text>
  <text x="115" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFE0B2">0.15 m</text>

  <!-- 桌子 1m -->
  <g filter="url(#cardShadowLight)">
    <rect x="215" y="148" width="170" height="110" rx="12" fill="url(#cardGreen)"/>
    <rect x="215" y="148" width="170" height="110" rx="12" fill="url(#shineGreen)"/>
  </g>
  <text x="300" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">🪑 桌子</text>
  <!-- 桌子圖示 -->
  <g transform="translate(300, 200)">
    <rect x="-22" y="-8" width="44" height="5" rx="1" fill="url(#tableGrad)"/>
    <rect x="-15" y="-3" width="4" height="18" fill="#5D4037"/>
    <rect x="11" y="-3" width="4" height="18" fill="#5D4037"/>
  </g>
  <text x="300" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">1 m</text>
  <text x="300" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C8E6C9">100 cm</text>

  <!-- 道路 1km -->
  <g filter="url(#cardShadowLight)">
    <rect x="400" y="148" width="170" height="110" rx="12" fill="url(#cardPurple)"/>
    <rect x="400" y="148" width="170" height="110" rx="12" fill="url(#shinePurple)"/>
  </g>
  <text x="485" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">🛣️ 道路</text>
  <!-- 道路圖示 -->
  <g transform="translate(485, 200)">
    <rect x="-25" y="-6" width="50" height="12" rx="2" fill="url(#roadGrad)"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#FFD54F" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>
  <text x="485" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">1 km</text>
  <text x="485" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#CE93D8">1000 m</text>

  <!-- ============ 比較箭頭 ============ -->
  <g>
    <!-- 鉛筆 → 桌子 -->
    <line x1="200" y1="260" x2="215" y2="260" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <text x="207" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#FF9800">×6.7</text>

    <!-- 桌子 → 道路 -->
    <line x1="385" y1="260" x2="400" y2="260" stroke="#4CAF50" stroke-width="2"/>
    <text x="392" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4CAF50">×1000</text>
  </g>

  <!-- 箭頭標記 -->
  <defs>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#FF9800"/>
    </marker>
  </defs>

  <!-- ============ 底部換算表 ============ -->
  <g filter="url(#cardShadowLight)">
    <rect x="30" y="290" width="540" height="95" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <rect x="30" y="290" width="540" height="95" rx="12" fill="url(#shineBlue)" opacity="0.3"/>
  </g>

  <text x="300" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1A237E">📊 長度單位換算表</text>

  <!-- 換算項目 -->
  <g font-family="Arial, sans-serif" font-size="11">
    <!-- 1 km -->
    <rect x="50" y="322" width="110" height="28" rx="8" fill="#E8EAF6"/>
    <text x="105" y="341" text-anchor="middle" fill="#283593" font-weight="bold">1 km</text>
    <text x="160" y="341" fill="#5C6BC0">= 1000 m</text>

    <!-- 1 m -->
    <rect x="50" y="355" width="110" height="28" rx="8" fill="#E8F5E9"/>
    <text x="105" y="374" text-anchor="middle" fill="#2E7D32" font-weight="bold">1 m</text>
    <text x="160" y="374" fill="#43A047">= 100 cm</text>

    <!-- 1 cm -->
    <rect x="310" y="322" width="110" height="28" rx="8" fill="#FFF3E0"/>
    <text x="365" y="341" text-anchor="middle" fill="#E65100" font-weight="bold">1 cm</text>
    <text x="420" y="341" fill="#FF9800">= 10 mm</text>

    <!-- 1 m -->
    <rect x="310" y="355" width="110" height="28" rx="8" fill="#F3E5F5"/>
    <text x="365" y="374" text-anchor="middle" fill="#6A1B9A" font-weight="bold">1 m</text>
    <text x="420" y="374" fill="#9C27B0">= 0.001 km</text>
  </g>

  <!-- 裝飾小圖標 -->
  <g opacity="0.15">
    <circle cx="560" cy="370" r="20" fill="#4A90D9"/>
    <circle cx="570" cy="360" r="12" fill="#4CAF50"/>
    <circle cx="550" cy="355" r="8" fill="#FF9800"/>
  </g>
</svg>