<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-dot" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#D0D6DE"/>
    </pattern>

    <!-- 放射漸變圓面（多層） -->
    <radialGradient id="circleGrad" cx="38%" cy="35%" r="60%" fx="30%" fy="28%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FFF9E6"/>
      <stop offset="35%" stop-color="#FFD54F"/>
      <stop offset="65%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>

    <!-- 3D光影漸層（放射高光） -->
    <radialGradient id="circleHighlight" cx="28%" cy="25%" r="50%" fx="22%" fy="20%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>

    <!-- 陰影濾鏡（雙層） -->
    <filter id="shadowMain" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#1A2332" flood-opacity="0.20"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.30"/>
    </filter>

    <filter id="shadowCard" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#1A2332" flood-opacity="0.15"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.25"/>
    </filter>

    <filter id="shadowSoft" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1A2332" flood-opacity="0.12"/>
    </filter>

    <!-- 卡片漸層背景 -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
    </linearGradient>

    <linearGradient id="cardAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="50%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#grid-dot)"/>

  <!-- 頂部裝飾條 -->
  <rect x="0" y="0" width="600" height="4" fill="url(#cardAccent)" opacity="0.6"/>

  <!-- ===== 左側：圓形視覺化 ===== -->
  <g transform="translate(30, 20)">
    <!-- 圓形外框（輔助圓） -->
    <circle cx="170" cy="180" r="130" fill="none" stroke="#D0D6DE" stroke-width="0.5" stroke-dasharray="4,4"/>

    <!-- 主要圓形（放射漸變） -->
    <circle cx="170" cy="180" r="120" fill="url(#circleGrad)" filter="url(#shadowMain)"/>

    <!-- 3D光影疊層 -->
    <circle cx="170" cy="180" r="120" fill="url(#circleHighlight)"/>

    <!-- 圓形邊緣光暈 -->
    <circle cx="170" cy="180" r="120" fill="none" stroke="#FFB74D" stroke-width="1.5" opacity="0.6"/>
    <circle cx="170" cy="180" r="119" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>

    <!-- 半徑 r 標示線 -->
    <line x1="170" y1="180" x2="170" y2="60" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="170" y1="180" x2="170" y2="60" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <circle cx="170" cy="180" r="4" fill="#1565C0"/>
    <circle cx="170" cy="60" r="4" fill="#1565C0"/>
    <!-- r 標籤 -->
    <rect x="148" y="105" width="24" height="18" rx="4" fill="#1565C0" opacity="0.9"/>
    <text x="160" y="118" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="Arial, sans-serif">r</text>

    <!-- 直徑 d 標示線 -->
    <line x1="50" y1="180" x2="290" y2="180" stroke="#D32F2F" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="180" x2="290" y2="180" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
    <circle cx="50" cy="180" r="4" fill="#D32F2F"/>
    <circle cx="290" cy="180" r="4" fill="#D32F2F"/>
    <!-- d 標籤 -->
    <rect x="148" y="168" width="24" height="18" rx="4" fill="#D32F2F" opacity="0.9"/>
    <text x="160" y="181" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="Arial, sans-serif">d</text>

    <!-- 圓心標記 -->
    <circle cx="170" cy="180" r="6" fill="#1A2332" opacity="0.7"/>
    <circle cx="170" cy="180" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- ===== 右側：公式卡片 ===== -->
  <g transform="translate(340, 25)">
    <!-- 卡片1：半徑與直徑 -->
    <g filter="url(#shadowCard)">
      <rect x="0" y="0" width="230" height="72" rx="12" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="230" height="72" rx="12" fill="none" stroke="#E0E4E8" stroke-width="1"/>
      <rect x="0" y="0" width="230" height="72" rx="12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <!-- 左側裝飾條 -->
      <rect x="0" y="12" width="4" height="48" rx="2" fill="#1565C0" opacity="0.7"/>
      <!-- 公式內容 -->
      <text x="22" y="30" font-size="13" fill="#4A5568" font-family="Arial, sans-serif" font-weight="bold">半徑與直徑</text>
      <text x="22" y="55" font-size="18" fill="#1A2332" font-family="Arial, sans-serif" font-weight="bold">
        <tspan fill="#1565C0">d</tspan>
        <tspan fill="#4A5568"> = 2</tspan>
        <tspan fill="#D32F2F">r</tspan>
      </text>
      <text x="130" y="55" font-size="13" fill="#8896A6" font-family="Arial, sans-serif">直徑 = 2 × 半徑</text>
    </g>

    <!-- 卡片2：圓周 -->
    <g filter="url(#shadowCard)" transform="translate(0, 85)">
      <rect x="0" y="0" width="230" height="72" rx="12" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="230" height="72" rx="12" fill="none" stroke="#E0E4E8" stroke-width="1"/>
      <rect x="0" y="0" width="230" height="72" rx="12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <rect x="0" y="12" width="4" height="48" rx="2" fill="#7B1FA2" opacity="0.7"/>
      <text x="22" y="30" font-size="13" fill="#4A5568" font-family="Arial, sans-serif" font-weight="bold">圓周</text>
      <text x="22" y="55" font-size="18" fill="#1A2332" font-family="Arial, sans-serif" font-weight="bold">
        <tspan fill="#7B1FA2">C</tspan>
        <tspan fill="#4A5568"> = 2</tspan>
        <tspan fill="#FF9800">π</tspan>
        <tspan fill="#1565C0">r</tspan>
      </text>
      <text x="130" y="55" font-size="13" fill="#8896A6" font-family="Arial, sans-serif">圓周 = 2 × π × 半徑</text>
    </g>

    <!-- 卡片3：面積 -->
    <g filter="url(#shadowCard)" transform="translate(0, 170)">
      <rect x="0" y="0" width="230" height="72" rx="12" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="230" height="72" rx="12" fill="none" stroke="#E0E4E8" stroke-width="1"/>
      <rect x="0" y="0" width="230" height="72" rx="12" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <rect x="0" y="12" width="4" height="48" rx="2" fill="#2E7D32" opacity="0.7"/>
      <text x="22" y="30" font-size="13" fill="#4A5568" font-family="Arial, sans-serif" font-weight="bold">面積</text>
      <text x="22" y="55" font-size="18" fill="#1A2332" font-family="Arial, sans-serif" font-weight="bold">
        <tspan fill="#2E7D32">A</tspan>
        <tspan fill="#4A5568"> = </tspan>
        <tspan fill="#FF9800">π</tspan>
        <tspan fill="#4A5568"> </tspan>
        <tspan fill="#1565C0">r</tspan>
        <tspan font-size="12" dy="-4" fill="#1565C0">2</tspan>
      </text>
      <text x="130" y="55" font-size="13" fill="#8896A6" font-family="Arial, sans-serif">面積 = π × 半徑²</text>
    </g>

    <!-- 卡片4：π 小知識 -->
    <g filter="url(#shadowSoft)" transform="translate(0, 255)">
      <rect x="0" y="0" width="230" height="52" rx="10" fill="#FFF8E1"/>
      <rect x="0" y="0" width="230" height="52" rx="10" fill="none" stroke="#FFE082" stroke-width="1"/>
      <text x="16" y="22" font-size="12" fill="#E65100" font-family="Arial, sans-serif" font-weight="bold">π ≈ 3.14159</text>
      <text x="16" y="40" font-size="11" fill="#A06700" font-family="Arial, sans-serif">圓周 ÷ 直徑 = 常數 π</text>
    </g>
  </g>

  <!-- 底部標題 -->
  <g transform="translate(300, 378)">
    <text text-anchor="middle" font-size="11" fill="#A0ABB8" font-family="Arial, sans-serif" letter-spacing="2">
      ● 圓形 · 半徑 · 直徑 · 圓周 · 面積 ●
    </text>
  </g>
</svg>