<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>

    <!-- 圓錐主體漸變（3D光影） -->
    <radialGradient id="coneGrad" cx="35%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="85%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>

    <!-- 圓錐底部橢圓漸變 -->
    <radialGradient id="coneBaseGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="40%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </radialGradient>

    <!-- 斜高線漸變 -->
    <linearGradient id="slantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- 高度線漸變 -->
    <linearGradient id="heightGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- 半徑線漸變 -->
    <linearGradient id="radiusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>

    <filter id="coneShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.3"/>
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>

    <!-- 標籤背景 -->
    <linearGradient id="labelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- 公式卡片漸變 -->
    <linearGradient id="formulaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="50%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 圓角卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="16" fill="url(#cardGrad)" filter="url(#cardShadow)"/>

  <!-- 標題 -->
  <text x="300" y="48" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="20" font-weight="bold" fill="#1E293B">圓錐斜高關係</text>
  <text x="300" y="68" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#64748B">斜高 l、半徑 r、高度 h</text>

  <!-- 圓錐底部橢圓（底面） -->
  <ellipse cx="300" cy="310" rx="130" ry="35" fill="url(#coneBaseGrad)" opacity="0.8"/>

  <!-- 圓錐主體（三角形 + 底部弧線） -->
  <path d="M300 100 L170 310 Q170 345 300 345 Q430 345 430 310 Z" fill="url(#coneGrad)" filter="url(#coneShadow)" opacity="0.95"/>

  <!-- 底部橢圓邊緣線 -->
  <ellipse cx="300" cy="310" rx="130" ry="35" fill="none" stroke="#1E3A8A" stroke-width="1.5" opacity="0.4"/>

  <!-- 頂點高光 -->
  <ellipse cx="285" cy="120" rx="15" ry="8" fill="white" opacity="0.15"/>

  <!-- === 輔助線 === -->

  <!-- 高度線（垂直虛線） -->
  <line x1="300" y1="100" x2="300" y2="310" stroke="url(#heightGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- 半徑線（水平虛線） -->
  <line x1="300" y1="310" x2="430" y2="310" stroke="url(#radiusGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- 斜高線 -->
  <line x1="300" y1="100" x2="430" y2="310" stroke="url(#slantGrad)" stroke-width="3"/>

  <!-- 斜高線箭頭（頂點端） -->
  <polygon points="300,100 306,108 294,108" fill="#EF4444"/>

  <!-- 斜高線箭頭（底端） -->
  <polygon points="430,310 422,304 422,316" fill="#EF4444"/>

  <!-- 直角標記 -->
  <polyline points="300,290 310,290 310,300" fill="none" stroke="#64748B" stroke-width="1.5"/>

  <!-- === 標籤 === -->

  <!-- 斜高標籤 l -->
  <rect x="340" y="175" width="28" height="24" rx="6" fill="url(#labelBg)" stroke="#EF4444" stroke-width="1" opacity="0.9"/>
  <text x="354" y="193" text-anchor="middle" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" font-style="italic" fill="#DC2626">l</text>

  <!-- 高度標籤 h -->
  <rect x="270" y="190" width="28" height="24" rx="6" fill="url(#labelBg)" stroke="#10B981" stroke-width="1" opacity="0.9"/>
  <text x="284" y="208" text-anchor="middle" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" font-style="italic" fill="#059669">h</text>

  <!-- 半徑標籤 r -->
  <rect x="348" y="316" width="28" height="24" rx="6" fill="url(#labelBg)" stroke="#F59E0B" stroke-width="1" opacity="0.9"/>
  <text x="362" y="334" text-anchor="middle" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" font-style="italic" fill="#D97706">r</text>

  <!-- 頂點標籤 O -->
  <rect x="278" y="78" width="24" height="20" rx="6" fill="url(#labelBg)" stroke="#64748B" stroke-width="0.8" opacity="0.85"/>
  <text x="290" y="93" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#475569">O</text>

  <!-- 底部中心標籤 C -->
  <rect x="278" y="314" width="24" height="20" rx="6" fill="url(#labelBg)" stroke="#64748B" stroke-width="0.8" opacity="0.85"/>
  <text x="290" y="329" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#475569">C</text>

  <!-- 底部右端點標籤 A -->
  <rect x="432" y="312" width="24" height="20" rx="6" fill="url(#labelBg)" stroke="#64748B" stroke-width="0.8" opacity="0.85"/>
  <text x="444" y="327" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#475569">A</text>

  <!-- === 公式區域 === -->
  <rect x="100" y="348" width="400" height="30" rx="10" fill="url(#formulaGrad)" stroke="#FCA5A5" stroke-width="1" opacity="0.9"/>
  <text x="300" y="369" text-anchor="middle" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#B91C1C">
    l² = r² + h²
  </text>

  <!-- 裝飾小點 -->
  <circle cx="55" cy="55" r="3" fill="#3B82F6" opacity="0.3"/>
  <circle cx="545" cy="55" r="3" fill="#3B82F6" opacity="0.3"/>
  <circle cx="55" cy="345" r="3" fill="#3B82F6" opacity="0.3"/>
  <circle cx="545" cy="345" r="3" fill="#3B82F6" opacity="0.3"/>
</svg>