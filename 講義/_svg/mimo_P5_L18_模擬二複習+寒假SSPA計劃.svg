<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#F9FAFB" />
  <text x="300" y="40" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#4F46E5" font-weight="bold">SSPA複習路線圖</text>
  <rect x="30" y="100" width="120" height="80" rx="10" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="90" y="145" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="white">複習基礎</text>
  <text x="90" y="165" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="white">數學概念</text>
  <line x1="150" y1="140" x2="180" y2="140" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="180" y="100" width="120" height="80" rx="10" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="240" y="145" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="white">模擬測試</text>
  <text x="240" y="165" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="white">練習題目</text>
  <line x1="300" y1="140" x2="330" y2="140" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="330" y="100" width="120" height="80" rx="10" fill="#F59E0B" filter="url(#shadow)" />
  <text x="390" y="145" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="white">弱點分析</text>
  <text x="390" y="165" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="white">找出問題</text>
  <line x1="450" y1="140" x2="480" y2="140" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="480" y="100" width="120" height="80" rx="10" fill="url(#grad1)" filter="url(#shadow)" />
  <text x="540" y="145" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="white">寒假計劃</text>
  <text x="540" y="165" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="white">每日複習</text>
  <text x="300" y="220" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#10B981" font-weight="bold">目標階梯</text>
  <rect x="50" y="260" width="100" height="40" rx="5" fill="#10B981" filter="url(#shadow)" />
  <text x="100" y="285" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="white">基礎掌握</text>
  <path d="M150 280 L170 250" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-green)" />
  <rect x="170" y="230" width="100" height="40" rx="5" fill="#10B981" filter="url(#shadow)" />
  <text x="220" y="255" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="white">進階練習</text>
  <path d="M270 250 L290 220" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-green)" />
  <rect x="290" y="200" width="100" height="40" rx="5" fill="#10B981" filter="url(#shadow)" />
  <text x="340" y="225" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="white">熟練應用</text>
  <path d="M390 220 L410 190" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-green)" />
  <rect x="410" y="170" width="100" height="40" rx="5" fill="#10B981" filter="url(#shadow)" />
  <text x="460" y="195" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="white">精通考試</text>
  <text x="550" y="320" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#4F46E5">加油！達到SSPA目標！</text>
</svg>