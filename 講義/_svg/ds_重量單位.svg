<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0e6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f4f8;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片漸變 - g -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fad0c4;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片漸變 - kg -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a18cd1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbc2eb;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片漸變 - 公噸 -->
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>

    <!-- 3D 放射漸變 - 蘋果 -->
    <radialGradient id="appleGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ee5a24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </radialGradient>

    <!-- 3D 放射漸變 - 人 -->
    <radialGradient id="personGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0984e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0652DD;stop-opacity:1" />
    </radialGradient>

    <!-- 3D 放射漸變 - 車 -->
    <radialGradient id="carGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#ffd32a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f0932b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </radialGradient>

    <!-- 階梯箭頭漸變 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:0.4" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#00000033"/>
    </filter>

    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000033"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0000001a"/>
    </filter>

    <!-- 發光濾鏡 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 階梯背景漸變 -->
    <linearGradient id="stepBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="3" fill="#a29bfe" opacity="0.3"/>
  <circle cx="550" cy="60" r="4" fill="#fd79a8" opacity="0.3"/>
  <circle cx="30" cy="350" r="3" fill="#00cec9" opacity="0.3"/>
  <circle cx="570" cy="340" r="3" fill="#6c5ce7" opacity="0.3"/>
  <circle cx="300" cy="20" r="2" fill="#fdcb6e" opacity="0.4"/>
  <circle cx="100" cy="380" r="2" fill="#e17055" opacity="0.3"/>
  <circle cx="500" cy="380" r="2" fill="#00b894" opacity="0.3"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2d3436" filter="url(#glow)">📐 重量單位 · 階梯對比</text>
  <line x1="180" y1="48" x2="420" y2="48" stroke="#6c5ce7" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- ===== 重量階梯區 ===== -->
  <!-- 階梯背景卡片 -->
  <rect x="30" y="60" width="540" height="130" rx="16" fill="url(#stepBgGrad)" filter="url(#doubleShadow)" stroke="#dfe6e9" stroke-width="1"/>

  <!-- 階梯標題 -->
  <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#636e72" font-weight="bold">⬆ 重量階梯（由小到大）</text>

  <!-- 階梯 1 - g -->
  <rect x="60" y="100" width="120" height="70" rx="12" fill="url(#cardGrad1)" filter="url(#shadow1)"/>
  <text x="120" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff">g</text>
  <text x="120" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity="0.9">克</text>

  <!-- 階梯箭頭 1→2 -->
  <polygon points="190,135 210,120 210,130 230,130 230,140 210,140 210,150" fill="url(#arrowGrad)" filter="url(#shadow2)"/>

  <!-- 階梯 2 - kg -->
  <rect x="240" y="100" width="120" height="70" rx="12" fill="url(#cardGrad2)" filter="url(#shadow1)"/>
  <text x="300" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff">kg</text>
  <text x="300" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity="0.9">公斤</text>

  <!-- 階梯箭頭 2→3 -->
  <polygon points="370,135 390,120 390,130 410,130 410,140 390,140 390,150" fill="url(#arrowGrad)" filter="url(#shadow2)"/>

  <!-- 階梯 3 - 公噸 -->
  <rect x="420" y="100" width="120" height="70" rx="12" fill="url(#cardGrad3)" filter="url(#shadow1)"/>
  <text x="480" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff">公噸</text>
  <text x="480" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity="0.9">T</text>

  <!-- 換算公式 -->
  <text x="300" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c5ce7" font-weight="bold">1 kg = 1 000 g &nbsp;|&nbsp; 1 公噸 = 1 000 kg</text>

  <!-- ===== 物品重量對比區 ===== -->
  <rect x="30" y="205" width="540" height="175" rx="16" fill="#ffffffcc" filter="url(#doubleShadow)" stroke="#dfe6e9" stroke-width="1"/>

  <text x="300" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#636e72" font-weight="bold">🍎 物品重量對比</text>

  <!-- 蘋果 -->
  <g filter="url(#doubleShadow)">
    <rect x="55" y="245" width="150" height="115" rx="14" fill="#fff" stroke="#ff7675" stroke-width="2"/>
    <!-- 蘋果圖示 -->
    <circle cx="100" cy="280" r="22" fill="url(#appleGrad)"/>
    <ellipse cx="100" cy="278" rx="8" ry="6" fill="#ffcccc" opacity="0.4"/>
    <line x1="100" y1="258" x2="100" y2="250" stroke="#636e72" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="95" cy="250" rx="6" ry="3" fill="#00b894" opacity="0.7"/>
    <!-- 文字 -->
    <text x="130" y="275" font-family="Arial, sans-serif" font-size="13" fill="#2d3436" font-weight="bold">蘋果</text>
    <text x="130" y="295" font-family="Arial, sans-serif" font-size="11" fill="#636e72">約 200 g</text>
    <text x="130" y="315" font-family="Arial, sans-serif" font-size="10" fill="#b2bec3">0.2 kg</text>
    <!-- 小標籤 -->
    <rect x="60" y="330" width="60" height="20" rx="10" fill="#ff7675" opacity="0.8"/>
    <text x="90" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold">輕量級</text>
  </g>

  <!-- 人 -->
  <g filter="url(#doubleShadow)">
    <rect x="225" y="245" width="150" height="115" rx="14" fill="#fff" stroke="#74b9ff" stroke-width="2"/>
    <!-- 人圖示 -->
    <circle cx="270" cy="268" r="10" fill="url(#personGrad)"/>
    <ellipse cx="270" cy="268" rx="4" ry="3" fill="#a8d8ea" opacity="0.4"/>
    <rect x="260" y="278" width="20" height="25" rx="5" fill="url(#personGrad)"/>
    <rect x="258" y="303" width="8" height="15" rx="3" fill="url(#personGrad)"/>
    <rect x="274" y="303" width="8" height="15" rx="3" fill="url(#personGrad)"/>
    <!-- 文字 -->
    <text x="300" y="275" font-family="Arial, sans-serif" font-size="13" fill="#2d3436" font-weight="bold">小學生</text>
    <text x="300" y="295" font-family="Arial, sans-serif" font-size="11" fill="#636e72">約 60 kg</text>
    <text x="300" y="315" font-family="Arial, sans-serif" font-size="10" fill="#b2bec3">60 000 g</text>
    <!-- 小標籤 -->
    <rect x="230" y="330" width="60" height="20" rx="10" fill="#74b9ff" opacity="0.8"/>
    <text x="260" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold">中量級</text>
  </g>

  <!-- 車 -->
  <g filter="url(#doubleShadow)">
    <rect x="395" y="245" width="150" height="115" rx="14" fill="#fff" stroke="#fdcb6e" stroke-width="2"/>
    <!-- 車圖示 -->
    <rect x="415" y="275" width="40" height="18" rx="4" fill="url(#carGrad)"/>
    <rect x="420" y="265" width="25" height="12" rx="3" fill="url(#carGrad)"/>
    <circle cx="425" cy="295" r="6" fill="#2d3436"/>
    <circle cx="445" cy="295" r="6" fill="#2d3436"/>
    <circle cx="425" cy="295" r="3" fill="#636e72"/>
    <circle cx="445" cy="295" r="3" fill="#636e72"/>
    <rect x="430" y="268" width="8" height="6" rx="2" fill="#ffeaa7" opacity="0.6"/>
    <!-- 文字 -->
    <text x="470" y="275" font-family="Arial, sans-serif" font-size="13" fill="#2d3436" font-weight="bold">小汽車</text>
    <text x="470" y="295" font-family="Arial, sans-serif" font-size="11" fill="#636e72">約 2 公噸</text>
    <text x="470" y="315" font-family="Arial, sans-serif" font-size="10" fill="#b2bec3">2 000 kg</text>
    <!-- 小標籤 -->
    <rect x="400" y="330" width="60" height="20" rx="10" fill="#fdcb6e" opacity="0.8"/>
    <text x="430" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff" font-weight="bold">重量級</text>
  </g>

  <!-- 底部裝飾線 -->
  <line x1="100" y1="390" x2="500" y2="390" stroke="#dfe6e9" stroke-width="1" opacity="0.5"/>
</svg>