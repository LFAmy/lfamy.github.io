<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景放射漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="60%" stop-color="#d0eaf8"/>
      <stop offset="100%" stop-color="#b0d4f0"/>
    </radialGradient>

    <!-- 卡片1：讀 - 藍色漸變 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#3a8fd4"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>
    <linearGradient id="card1Shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <radialGradient id="card1Glow" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片2：找 - 綠色漸變 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="50%" stop-color="#38c16a"/>
      <stop offset="100%" stop-color="#2a9d52"/>
    </linearGradient>
    <linearGradient id="card2Shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <radialGradient id="card2Glow" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片3：選 - 橙色漸變 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6a832"/>
      <stop offset="50%" stop-color="#e8942a"/>
      <stop offset="100%" stop-color="#d47a1e"/>
    </linearGradient>
    <linearGradient id="card3Shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <radialGradient id="card3Glow" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片4：查 - 紫色漸變 -->
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1"/>
      <stop offset="50%" stop-color="#8b74c0"/>
      <stop offset="100%" stop-color="#6d5a9e"/>
    </linearGradient>
    <linearGradient id="card4Shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <radialGradient id="card4Glow" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="140%">
      <!-- 第一層陰影：深色大範圍 -->
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="rgba(0,0,0,0.25)"/>
      <!-- 第二層陰影：淺色小範圍 -->
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 標題陰影 -->
    <filter id="titleShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>

    <!-- 箭頭發光 -->
    <filter id="arrowGlow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 圖標陰影 -->
    <filter id="iconShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓 -->
  <circle cx="520" cy="60" r="80" fill="rgba(255,255,255,0.12)"/>
  <circle cx="80" cy="350" r="60" fill="rgba(255,255,255,0.10)"/>
  <circle cx="550" cy="340" r="45" fill="rgba(255,255,255,0.08)"/>

  <!-- 標題 -->
  <text x="300" y="42" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="#1a365d" filter="url(#titleShadow)">📐 應用題四步解題法</text>

  <!-- 卡片1：讀 -->
  <g filter="url(#doubleShadow)">
    <rect x="30" y="65" width="120" height="155" rx="16" fill="url(#card1Grad)"/>
    <!-- 3D光影層 -->
    <rect x="30" y="65" width="120" height="155" rx="16" fill="url(#card1Shine)"/>
    <rect x="30" y="65" width="120" height="155" rx="16" fill="url(#card1Glow)"/>
    <!-- 頂部高光條 -->
    <rect x="34" y="69" width="112" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
    <!-- 圖標 -->
    <text x="90" y="118" text-anchor="middle" font-size="36" filter="url(#iconShadow)">📖</text>
    <!-- 步驟數字 -->
    <circle cx="50" cy="80" r="12" fill="rgba(255,255,255,0.25)"/>
    <text x="50" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">1</text>
    <!-- 標題 -->
    <text x="90" y="155" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="white">讀</text>
    <!-- 說明 -->
    <text x="90" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">讀題目</text>
    <text x="90" y="196" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">理解意思</text>
  </g>

  <!-- 箭頭 1→2 -->
  <g filter="url(#arrowGlow)">
    <path d="M155 142 L175 142" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M170 135 L178 142 L170 149" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- 卡片2：找 -->
  <g filter="url(#doubleShadow)">
    <rect x="185" y="65" width="120" height="155" rx="16" fill="url(#card2Grad)"/>
    <rect x="185" y="65" width="120" height="155" rx="16" fill="url(#card2Shine)"/>
    <rect x="185" y="65" width="120" height="155" rx="16" fill="url(#card2Glow)"/>
    <rect x="189" y="69" width="112" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
    <text x="245" y="118" text-anchor="middle" font-size="36" filter="url(#iconShadow)">🔍</text>
    <circle cx="205" cy="80" r="12" fill="rgba(255,255,255,0.25)"/>
    <text x="205" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">2</text>
    <text x="245" y="155" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="white">找</text>
    <text x="245" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">找關鍵字</text>
    <text x="245" y="196" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">找數字</text>
  </g>

  <!-- 箭頭 2→3 -->
  <g filter="url(#arrowGlow)">
    <path d="M310 142 L330 142" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M325 135 L333 142 L325 149" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- 卡片3：選 -->
  <g filter="url(#doubleShadow)">
    <rect x="340" y="65" width="120" height="155" rx="16" fill="url(#card3Grad)"/>
    <rect x="340" y="65" width="120" height="155" rx="16" fill="url(#card3Shine)"/>
    <rect x="340" y="65" width="120" height="155" rx="16" fill="url(#card3Glow)"/>
    <rect x="344" y="69" width="112" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
    <text x="400" y="118" text-anchor="middle" font-size="36" filter="url(#iconShadow)">✏️</text>
    <circle cx="360" cy="80" r="12" fill="rgba(255,255,255,0.25)"/>
    <text x="360" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">3</text>
    <text x="400" y="155" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="white">選</text>
    <text x="400" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">選算式</text>
    <text x="400" y="196" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">列式計算</text>
  </g>

  <!-- 箭頭 3→4 -->
  <g filter="url(#arrowGlow)">
    <path d="M465 142 L485 142" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M480 135 L488 142 L480 149" stroke="#4a5568" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- 卡片4：查 -->
  <g filter="url(#doubleShadow)">
    <rect x="495" y="65" width="80" height="155" rx="16" fill="url(#card4Grad)"/>
    <rect x="495" y="65" width="80" height="155" rx="16" fill="url(#card4Shine)"/>
    <rect x="495" y="65" width="80" height="155" rx="16" fill="url(#card4Glow)"/>
    <rect x="499" y="69" width="72" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
    <text x="535" y="118" text-anchor="middle" font-size="36" filter="url(#iconShadow)">✅</text>
    <circle cx="510" cy="80" r="12" fill="rgba(255,255,255,0.25)"/>
    <text x="510" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">4</text>
    <text x="535" y="155" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" font-weight="bold" fill="white">查</text>
    <text x="535" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">檢查</text>
    <text x="535" y="196" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">驗算</text>
  </g>

  <!-- 底部提示條 -->
  <g filter="url(#doubleShadow)">
    <rect x="100" y="250" width="400" height="50" rx="25" fill="white" opacity="0.85"/>
    <rect x="100" y="250" width="400" height="50" rx="25" fill="rgba(255,255,255,0.3)"/>
    <text x="300" y="280" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#2d3748">
      💡 提示：先讀懂題目 → 找出關鍵數字 → 選擇正確算式 → 檢查答案
    </text>
  </g>

  <!-- 底部裝飾小點 -->
  <circle cx="160" cy="325" r="4" fill="rgba(79,172,254,0.4)"/>
  <circle cx="260" cy="335" r="3" fill="rgba(67,233,123,0.4)"/>
  <circle cx="360" cy="325" r="4" fill="rgba(246,168,50,0.4)"/>
  <circle cx="460" cy="335" r="3" fill="rgba(161,140,209,0.4)"/>

  <!-- 底部裝飾線 -->
  <line x1="130" y1="345" x2="200" y2="345" stroke="rgba(79,172,254,0.2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="230" y1="355" x2="300" y2="355" stroke="rgba(67,233,123,0.2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="330" y1="345" x2="400" y2="345" stroke="rgba(246,168,50,0.2)" stroke-width="2" stroke-linecap="round"/>
  <line x1="430" y1="355" x2="500" y2="355" stroke="rgba(161,140,209,0.2)" stroke-width="2" stroke-linecap="round"/>
</svg>