<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 多層漸變：讀題卡片（藍色） -->
    <linearGradient id="gradRead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="25%" stop-color="#5BA0E8"/>
      <stop offset="50%" stop-color="#6BB5F5"/>
      <stop offset="75%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#3A7BC8"/>
    </linearGradient>

    <!-- 放射漸變：讀題卡片3D光影 -->
    <radialGradient id="radialRead" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </radialGradient>

    <!-- 多層漸變：選運算卡片（綠色） -->
    <linearGradient id="gradOper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3CB371"/>
      <stop offset="25%" stop-color="#4ECB82"/>
      <stop offset="50%" stop-color="#5EDB92"/>
      <stop offset="75%" stop-color="#3CB371"/>
      <stop offset="100%" stop-color="#2E9E5E"/>
    </linearGradient>

    <!-- 放射漸變：選運算卡片3D光影 -->
    <radialGradient id="radialOper" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </radialGradient>

    <!-- 多層漸變：檢查卡片（橙色） -->
    <linearGradient id="gradCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="25%" stop-color="#FBB840"/>
      <stop offset="50%" stop-color="#FCCF5A"/>
      <stop offset="75%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E0931A"/>
    </linearGradient>

    <!-- 放射漸變：檢查卡片3D光影 -->
    <radialGradient id="radialCheck" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </radialGradient>

    <!-- 箭頭（在defs） -->
    <marker id="arrowBlue" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#4A90D9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#3CB371"/>
    </marker>

    <!-- 雙層陰影濾鏡 -->
    <filter id="shadowDouble" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.20)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.12)"/>
    </filter>

    <!-- 卡片內文字陰影 -->
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="rgba(0,0,0,0.20)"/>
    </filter>

    <!-- 例題框陰影 -->
    <filter id="shadowLight" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.10)"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="18" font-weight="bold" fill="#2C3E50" filter="url(#textShadow)">📐 分數應用三步框架</text>

  <!-- ========== 卡片 1：讀題 ========== -->
  <g filter="url(#shadowDouble)">
    <!-- 卡片主體 -->
    <rect x="25" y="55" width="155" height="155" rx="16" ry="16" fill="url(#gradRead)"/>
    <!-- 放射漸變3D光影 -->
    <rect x="25" y="55" width="155" height="155" rx="16" ry="16" fill="url(#radialRead)"/>
    <!-- 邊框高光 -->
    <rect x="25" y="55" width="155" height="155" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  </g>

  <!-- 步驟編號 -->
  <circle cx="45" cy="75" r="12" fill="rgba(255,255,255,0.30)"/>
  <text x="45" y="79" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFF">1</text>

  <!-- 圖標 -->
  <text x="102" y="100" text-anchor="middle" font-size="28">🔍</text>

  <!-- 標題 -->
  <text x="102" y="130" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="16" font-weight="bold" fill="#FFF" filter="url(#textShadow)">讀題</text>

  <!-- 說明文字 -->
  <text x="102" y="152" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="11" fill="rgba(255,255,255,0.90)">找出關鍵數字</text>
  <text x="102" y="170" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="11" fill="rgba(255,255,255,0.90)">與分數關係</text>

  <!-- ========== 箭頭 1→2 ========== -->
  <line x1="182" y1="132" x2="218" y2="132" stroke="#4A90D9" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- ========== 卡片 2：選運算 ========== -->
  <g filter="url(#shadowDouble)">
    <rect x="222" y="55" width="155" height="155" rx="16" ry="16" fill="url(#gradOper)"/>
    <rect x="222" y="55" width="155" height="155" rx="16" ry="16" fill="url(#radialOper)"/>
    <rect x="222" y="55" width="155" height="155" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  </g>

  <circle cx="242" cy="75" r="12" fill="rgba(255,255,255,0.30)"/>
  <text x="242" y="79" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFF">2</text>

  <text x="299" y="100" text-anchor="middle" font-size="28">✖️</text>

  <text x="299" y="130" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="16" font-weight="bold" fill="#FFF" filter="url(#textShadow)">選運算</text>

  <text x="299" y="152" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="11" fill="rgba(255,255,255,0.90)">選擇加減乘除</text>
  <text x="299" y="170" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="11" fill="rgba(255,255,255,0.90)">列出算式</text>

  <!-- ========== 箭頭 2→3 ========== -->
  <line x1="379" y1="132" x2="415" y2="132" stroke="#3CB371" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- ========== 卡片 3：檢查 ========== -->
  <g filter="url(#shadowDouble)">
    <rect x="419" y="55" width="155" height="155" rx="16" ry="16" fill="url(#gradCheck)"/>
    <rect x="419" y="55" width="155" height="155" rx="16" ry="16" fill="url(#radialCheck)"/>
    <rect x="419" y="55" width="155" height="155" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  </g>

  <circle cx="439" cy="75" r="12" fill="rgba(255,255,255,0.30)"/>
  <text x="439" y="79" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFF">3</text>

  <text x="496" y="100" text-anchor="middle" font-size="28">✅</text>

  <text x="496" y="130" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="16" font-weight="bold" fill="#FFF" filter="url(#textShadow)">檢查</text>

  <text x="496" y="152" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="11" fill="rgba(255,255,255,0.90)">驗算答案</text>
  <text x="496" y="170" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="11" fill="rgba(255,255,255,0.90)">檢查單位</text>

  <!-- ========== 例題區 ========== -->
  <g filter="url(#shadowLight)">
    <rect x="40" y="235" width="520" height="145" rx="14" ry="14" fill="#FFFFFF" stroke="#E0E6ED" stroke-width="1"/>
  </g>

  <!-- 例題標題 -->
  <rect x="40" y="235" width="520" height="35" rx="14" ry="14" fill="#F0F4F8"/>
  <rect x="40" y="255" width="520" height="15" fill="#F0F4F8"/>
  <text x="60" y="258" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">📝 例題：</text>

  <!-- 例題內容 -->
  <text x="60" y="290" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="13" fill="#34495E">
    小明有 <tspan fill="#E74C3C" font-weight="bold">24</tspan> 粒糖，他吃了全部的 <tspan fill="#E74C3C" font-weight="bold">3/4</tspan>。
  </text>
  <text x="60" y="312" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="13" fill="#34495E">
    問小明吃了多少粒糖？
  </text>

  <!-- 分隔線 -->
  <line x1="60" y1="325" x2="540" y2="325" stroke="#E8ECF0" stroke-width="1"/>

  <!-- 三步驟應用 -->
  <text x="60" y="348" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="12" fill="#7F8C8D">
    <tspan fill="#4A90D9" font-weight="bold">① 讀題：</tspan>關鍵數字 24 和 3/4
  </text>
  <text x="240" y="348" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="12" fill="#7F8C8D">
    <tspan fill="#3CB371" font-weight="bold">② 選運算：</tspan>24 × 3/4
  </text>
  <text x="420" y="348" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="12" fill="#7F8C8D">
    <tspan fill="#F5A623" font-weight="bold">③ 檢查：</tspan>18 粒 ✓
  </text>

  <!-- 底部裝飾 -->
  <rect x="0" y="390" width="600" height="10" fill="url(#gradRead)" opacity="0.3"/>
</svg>