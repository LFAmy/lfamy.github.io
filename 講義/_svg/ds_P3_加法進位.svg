<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="50%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>

    <!-- 個位階梯漸變（藍色系） -->
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="25%" stop-color="#29B6F6"/>
      <stop offset="50%" stop-color="#039BE5"/>
      <stop offset="75%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>

    <!-- 十位階梯漸變（綠色系） -->
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="25%" stop-color="#66BB6A"/>
      <stop offset="50%" stop-color="#43A047"/>
      <stop offset="75%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>

    <!-- 百位階梯漸變（紫色系） -->
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CE93D8"/>
      <stop offset="25%" stop-color="#AB47BC"/>
      <stop offset="50%" stop-color="#8E24AA"/>
      <stop offset="75%" stop-color="#6A1B9A"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>

    <!-- 放射漸變3D光影 -->
    <radialGradient id="shine1" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <radialGradient id="shine2" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <radialGradient id="shine3" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 頂面放射漸變 -->
    <radialGradient id="topShine1" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <radialGradient id="topShine2" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <radialGradient id="topShine3" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 雙層陰影 -->
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.1)"/>
    </filter>

    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.1)"/>
    </filter>

    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.1)"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.08)"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.05)"/>
    </filter>

    <!-- 網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D0D8E0" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0288D1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#388E3C"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 標題卡片 -->
  <rect x="140" y="12" width="320" height="44" rx="22" ry="22" fill="white" filter="url(#cardShadow)" opacity="0.95"/>
  <text x="300" y="40" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="20" font-weight="bold" fill="#37474F">🧮 加法進位 — 3D 階梯</text>

  <!-- ==================== 個位（第一階）==================== -->
  <g filter="url(#shadow1)">
    <!-- 階梯側面 -->
    <path d="M80,340 L80,280 L220,280 L220,340 Z" fill="url(#step1Grad)" opacity="0.85"/>
    <!-- 階梯頂面 -->
    <path d="M80,280 L130,250 L270,250 L220,280 Z" fill="url(#step1Grad)"/>
    <!-- 頂面光影 -->
    <path d="M80,280 L130,250 L270,250 L220,280 Z" fill="url(#topShine1)"/>
    <!-- 側面光影 -->
    <path d="M80,340 L80,280 L220,280 L220,340 Z" fill="url(#shine1)"/>
    <!-- 邊緣高光 -->
    <path d="M80,280 L130,250 L270,250" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  </g>

  <!-- 個位標籤 -->
  <rect x="110" y="290" width="80" height="28" rx="14" ry="14" fill="white" opacity="0.9"/>
  <text x="150" y="309" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" font-weight="bold" fill="#01579B">個位</text>

  <!-- 個位進位數 -->
  <circle cx="150" cy="265" r="18" fill="white" stroke="#0288D1" stroke-width="2.5" opacity="0.95"/>
  <text x="150" y="271" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="18" font-weight="bold" fill="#01579B">3</text>

  <!-- ==================== 十位（第二階）==================== -->
  <g filter="url(#shadow2)">
    <!-- 階梯側面 -->
    <path d="M200,280 L200,210 L360,210 L360,280 Z" fill="url(#step2Grad)" opacity="0.85"/>
    <!-- 階梯頂面 -->
    <path d="M200,210 L260,175 L420,175 L360,210 Z" fill="url(#step2Grad)"/>
    <!-- 頂面光影 -->
    <path d="M200,210 L260,175 L420,175 L360,210 Z" fill="url(#topShine2)"/>
    <!-- 側面光影 -->
    <path d="M200,280 L200,210 L360,210 L360,280 Z" fill="url(#shine2)"/>
    <!-- 邊緣高光 -->
    <path d="M200,210 L260,175 L420,175" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  </g>

  <!-- 十位標籤 -->
  <rect x="240" y="228" width="80" height="28" rx="14" ry="14" fill="white" opacity="0.9"/>
  <text x="280" y="247" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" font-weight="bold" fill="#1B5E20">十位</text>

  <!-- 十位進位數 -->
  <circle cx="280" cy="195" r="18" fill="white" stroke="#388E3C" stroke-width="2.5" opacity="0.95"/>
  <text x="280" y="201" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="18" font-weight="bold" fill="#1B5E20">1</text>

  <!-- ==================== 百位（第三階）==================== -->
  <g filter="url(#shadow3)">
    <!-- 階梯側面 -->
    <path d="M330,210 L330,130 L510,130 L510,210 Z" fill="url(#step3Grad)" opacity="0.85"/>
    <!-- 階梯頂面 -->
    <path d="M330,130 L400,90 L580,90 L510,130 Z" fill="url(#step3Grad)"/>
    <!-- 頂面光影 -->
    <path d="M330,130 L400,90 L580,90 L510,130 Z" fill="url(#topShine3)"/>
    <!-- 側面光影 -->
    <path d="M330,210 L330,130 L510,130 L510,210 Z" fill="url(#shine3)"/>
    <!-- 邊緣高光 -->
    <path d="M330,130 L400,90 L580,90" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  </g>

  <!-- 百位標籤 -->
  <rect x="380" y="148" width="80" height="28" rx="14" ry="14" fill="white" opacity="0.9"/>
  <text x="420" y="167" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" font-weight="bold" fill="#4A148C">百位</text>

  <!-- 百位進位數 -->
  <circle cx="420" cy="112" r="18" fill="white" stroke="#6A1B9A" stroke-width="2.5" opacity="0.95"/>
  <text x="420" y="118" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="18" font-weight="bold" fill="#4A148C">1</text>

  <!-- ==================== 進位箭頭 ==================== -->
  <!-- 個位 → 十位 -->
  <path d="M185,268 C195,268 200,260 205,250" fill="none" stroke="#0288D1" stroke-width="2.5" marker-end="url(#arrowBlue)" stroke-dasharray="6,3"/>
  <text x="192" y="258" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="10" fill="#0288D1" font-weight="bold">進位</text>

  <!-- 十位 → 百位 -->
  <path d="M315,198 C325,198 330,188 335,178" fill="none" stroke="#388E3C" stroke-width="2.5" marker-end="url(#arrowGreen)" stroke-dasharray="6,3"/>
  <text x="322" y="188" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="10" fill="#388E3C" font-weight="bold">進位</text>

  <!-- ==================== 裝飾元素 ==================== -->
  <!-- 底部說明卡片 -->
  <rect x="100" y="355" width="400" height="34" rx="17" ry="17" fill="white" filter="url(#cardShadow)" opacity="0.9"/>
  <text x="300" y="377" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" fill="#546E7A">
    ✏️ 個位滿 10 → 進 1 到十位　十位滿 10 → 進 1 到百位
  </text>

  <!-- 小星星裝飾 -->
  <text x="55" y="260" font-size="16" opacity="0.4">✦</text>
  <text x="555" y="170" font-size="16" opacity="0.4">✦</text>
  <text x="50" y="120" font-size="12" opacity="0.3">✦</text>
  <text x="560" y="350" font-size="12" opacity="0.3">✦</text>
</svg>