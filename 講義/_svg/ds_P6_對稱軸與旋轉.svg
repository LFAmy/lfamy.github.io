<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>

    <!-- 卡片1 漸變 - 軸對稱 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>

    <!-- 卡片2 漸變 - 旋轉對稱 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>

    <!-- 放射漸變 3D 光影效果 -->
    <radialGradient id="glow1" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#a8c0ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3f2b96;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#fccb90;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#d57eeb;stop-opacity:0"/>
    </radialGradient>

    <!-- 蝴蝶漸變 -->
    <linearGradient id="butterflyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e"/>
      <stop offset="100%" style="stop-color:#fecfef"/>
    </linearGradient>

    <linearGradient id="butterflyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a18cd1"/>
      <stop offset="100%" style="stop-color:#fbc2eb"/>
    </linearGradient>

    <!-- 旋轉花瓣漸變 -->
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff1eb"/>
      <stop offset="50%" style="stop-color:#ace0f9"/>
      <stop offset="100%" style="stop-color:#3b8dff"/>
    </radialGradient>

    <radialGradient id="petalGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fddb92"/>
      <stop offset="50%" style="stop-color:#d1fdff"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000" flood-opacity="0.2"/>
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <!-- 發光濾鏡 -->
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 軸對稱遮罩（左半） -->
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="60" height="120"/>
    </clipPath>

    <!-- 軸對稱遮罩（右半） -->
    <clipPath id="rightHalf">
      <rect x="60" y="0" width="60" height="120"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="2" fill="#fff" opacity="0.1"/>
  <circle cx="150" cy="30" r="1.5" fill="#fff" opacity="0.15"/>
  <circle cx="450" cy="60" r="2" fill="#fff" opacity="0.1"/>
  <circle cx="550" cy="40" r="1.5" fill="#fff" opacity="0.12"/>
  <circle cx="30" cy="350" r="1.5" fill="#fff" opacity="0.1"/>
  <circle cx="570" cy="370" r="2" fill="#fff" opacity="0.08"/>
  <circle cx="300" cy="20" r="1" fill="#fff" opacity="0.15"/>

  <!-- ============ 左側卡片：軸對稱 ============ -->
  <g filter="url(#cardShadow)">
    <!-- 圓角卡片背景 -->
    <rect x="25" y="30" width="260" height="340" rx="20" ry="20" fill="url(#card1Grad)" opacity="0.95"/>
    <!-- 卡片內發光 -->
    <rect x="25" y="30" width="260" height="340" rx="20" ry="20" fill="url(#glow1)"/>
    <!-- 卡片邊框 -->
    <rect x="25" y="30" width="260" height="340" rx="20" ry="20" fill="none" stroke="#a8c0ff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- 標題：軸對稱 -->
  <text x="155" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff" filter="url(#glowFilter)">軸對稱</text>
  <text x="155" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d0d0ff" opacity="0.9">軸對稱圖形</text>

  <!-- 軸對稱 - 蝴蝶圖案 -->
  <g transform="translate(155, 175)">
    <!-- 對稱軸（虛線） -->
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#fff" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>

    <!-- 左翅膀 -->
    <g opacity="0.95">
      <ellipse cx="-30" cy="-15" rx="35" ry="25" fill="url(#butterflyGrad)" transform="rotate(-15, -30, -15)"/>
      <ellipse cx="-25" cy="15" rx="25" ry="18" fill="url(#butterflyGrad2)" transform="rotate(10, -25, 15)"/>
      <!-- 翅膀紋路 -->
      <ellipse cx="-30" cy="-15" rx="20" ry="14" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4" transform="rotate(-15, -30, -15)"/>
      <ellipse cx="-25" cy="15" rx="14" ry="10" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4" transform="rotate(10, -25, 15)"/>
    </g>

    <!-- 右翅膀（鏡像） -->
    <g opacity="0.95">
      <ellipse cx="30" cy="-15" rx="35" ry="25" fill="url(#butterflyGrad)" transform="rotate(15, 30, -15)"/>
      <ellipse cx="25" cy="15" rx="25" ry="18" fill="url(#butterflyGrad2)" transform="rotate(-10, 25, 15)"/>
      <ellipse cx="30" cy="-15" rx="20" ry="14" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4" transform="rotate(15, 30, -15)"/>
      <ellipse cx="25" cy="15" rx="14" ry="10" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4" transform="rotate(-10, 25, 15)"/>
    </g>

    <!-- 身體 -->
    <ellipse cx="0" cy="0" rx="4" ry="18" fill="#2d1b69"/>
    <!-- 觸角 -->
    <path d="M-3,-18 Q-15,-35 -20,-40" stroke="#2d1b69" stroke-width="1.5" fill="none"/>
    <path d="M3,-18 Q15,-35 20,-40" stroke="#2d1b69" stroke-width="1.5" fill="none"/>
    <circle cx="-20" cy="-40" r="2.5" fill="#ff9a9e"/>
    <circle cx="20" cy="-40" r="2.5" fill="#ff9a9e"/>
  </g>

  <!-- 軸對稱說明文字 -->
  <text x="155" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e0e0ff" opacity="0.85">沿著對稱軸摺疊</text>
  <text x="155" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e0e0ff" opacity="0.85">兩側完全重合</text>

  <!-- 軸對稱標籤 -->
  <rect x="95" y="315" width="120" height="28" rx="14" fill="#fff" opacity="0.15"/>
  <text x="155" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">鏡像反射</text>

  <!-- ============ 右側卡片：旋轉對稱 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="315" y="30" width="260" height="340" rx="20" ry="20" fill="url(#card2Grad)" opacity="0.95"/>
    <rect x="315" y="30" width="260" height="340" rx="20" ry="20" fill="url(#glow2)"/>
    <rect x="315" y="30" width="260" height="340" rx="20" ry="20" fill="none" stroke="#fccb90" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- 標題：旋轉對稱 -->
  <text x="445" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff" filter="url(#glowFilter)">旋轉對稱</text>
  <text x="445" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffe0f0" opacity="0.9">旋轉對稱圖形</text>

  <!-- 旋轉對稱 - 四瓣花 -->
  <g transform="translate(445, 175)">
    <!-- 旋轉中心標記 -->
    <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.6"/>

    <!-- 花瓣 0° -->
    <ellipse cx="0" cy="-35" rx="14" ry="28" fill="url(#petalGrad)" opacity="0.9"/>
    <!-- 花瓣 90° -->
    <ellipse cx="35" cy="0" rx="14" ry="28" fill="url(#petalGrad2)" opacity="0.9" transform="rotate(90, 35, 0)"/>
    <!-- 花瓣 180° -->
    <ellipse cx="0" cy="35" rx="14" ry="28" fill="url(#petalGrad)" opacity="0.9" transform="rotate(180, 0, 35)"/>
    <!-- 花瓣 270° -->
    <ellipse cx="-35" cy="0" rx="14" ry="28" fill="url(#petalGrad2)" opacity="0.9" transform="rotate(270, -35, 0)"/>

    <!-- 花瓣高光 -->
    <ellipse cx="0" cy="-35" rx="6" ry="12" fill="#fff" opacity="0.2"/>
    <ellipse cx="35" cy="0" rx="6" ry="12" fill="#fff" opacity="0.2" transform="rotate(90, 35, 0)"/>
    <ellipse cx="0" cy="35" rx="6" ry="12" fill="#fff" opacity="0.2" transform="rotate(180, 0, 35)"/>
    <ellipse cx="-35" cy="0" rx="6" ry="12" fill="#fff" opacity="0.2" transform="rotate(270, -35, 0)"/>

    <!-- 花蕊 -->
    <circle cx="0" cy="0" r="10" fill="#ffd700" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#ffec8b"/>
    <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.5"/>

    <!-- 旋轉箭頭 -->
    <path d="M 20,-20 A 28,28 0 0,1 28,0" stroke="#fff" stroke-width="2" fill="none" opacity="0.6" marker-end="url(#arrowHead)"/>
  </g>

  <!-- 箭頭標記 -->
  <defs>
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fff" opacity="0.6"/>
    </marker>
  </defs>

  <!-- 旋轉對稱說明文字 -->
  <text x="445" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffe0f0" opacity="0.85">繞中心點旋轉 90°</text>
  <text x="445" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffe0f0" opacity="0.85">圖形與原圖完全重合</text>

  <!-- 旋轉對稱標籤 -->
  <rect x="385" y="315" width="120" height="28" rx="14" fill="#fff" opacity="0.15"/>
  <text x="445" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">旋轉 90°</text>

  <!-- 底部裝飾線 -->
  <line x1="100" y1="375" x2="500" y2="375" stroke="#fff" stroke-width="0.5" opacity="0.15"/>
</svg>