<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 1/2 紅色放射漸變（多層） -->
    <radialGradient id="redGrad" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="25%" stop-color="#FF4444"/>
      <stop offset="50%" stop-color="#EE2222"/>
      <stop offset="75%" stop-color="#CC1111"/>
      <stop offset="100%" stop-color="#990000"/>
    </radialGradient>

    <!-- 1/2 藍色放射漸變（多層） -->
    <radialGradient id="blueGrad" cx="65%" cy="65%" r="65%" fx="70%" fy="70%">
      <stop offset="0%" stop-color="#6BB5FF"/>
      <stop offset="25%" stop-color="#4499FF"/>
      <stop offset="50%" stop-color="#2277EE"/>
      <stop offset="75%" stop-color="#1155CC"/>
      <stop offset="100%" stop-color="#003399"/>
    </radialGradient>

    <!-- 3D 光影效果 - 上半部反光 -->
    <radialGradient id="shineTop" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D 光影效果 - 下半部陰影 -->
    <radialGradient id="shadowBottom" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="black" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="black" stop-opacity="0"/>
    </radialGradient>

    <!-- 圓餅圖外框陰影（雙層） -->
    <filter id="pieShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- 標籤圓角背景 -->
    <filter id="labelShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 剪裁路徑：半圓（左半：紅色） -->
    <clipPath id="halfLeft">
      <path d="M 300 200 L 300 50 A 150 150 0 0 0 300 350 Z"/>
    </clipPath>

    <!-- 剪裁路徑：半圓（右半：藍色） -->
    <clipPath id="halfRight">
      <path d="M 300 200 L 300 350 A 150 150 0 0 0 300 50 Z"/>
    </clipPath>

    <!-- 完整圓形剪裁 -->
    <clipPath id="fullCircle">
      <circle cx="300" cy="200" r="150"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 圓角卡片 -->
  <rect x="25" y="25" width="550" height="350" rx="20" ry="20" fill="white" filter="url(#cardShadow)"/>

  <!-- 標題 -->
  <text x="300" y="65" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">分數模型 — 1/2 + 1/2 = 1</text>

  <!-- ===== 圓餅圖（3D 效果） ===== -->
  <g filter="url(#pieShadow)">
    <!-- 底層陰影圓（3D 厚度效果） -->
    <circle cx="300" cy="205" r="150" fill="#1a1a2e" opacity="0.15"/>

    <!-- 完整圓形基底 -->
    <circle cx="300" cy="200" r="150" fill="#E0E0E0"/>

    <!-- 左半：紅色（使用剪裁） -->
    <g clip-path="url(#halfLeft)">
      <circle cx="300" cy="200" r="150" fill="url(#redGrad)"/>
    </g>

    <!-- 右半：藍色（使用剪裁） -->
    <g clip-path="url(#halfRight)">
      <circle cx="300" cy="200" r="150" fill="url(#blueGrad)"/>
    </g>

    <!-- 分隔線（白色，帶輕微陰影） -->
    <line x1="300" y1="50" x2="300" y2="350" stroke="white" stroke-width="2.5" opacity="0.8"/>

    <!-- 3D 上半部反光 -->
    <circle cx="300" cy="200" r="150" fill="url(#shineTop)" clip-path="url(#fullCircle)"/>

    <!-- 3D 下半部陰影 -->
    <circle cx="300" cy="200" r="150" fill="url(#shadowBottom)" clip-path="url(#fullCircle)"/>

    <!-- 邊緣光暈 -->
    <circle cx="300" cy="200" r="150" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>

    <!-- 3D 邊緣高光（左上） -->
    <path d="M 300 50 A 150 150 0 0 1 450 200" fill="none" stroke="white" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
  </g>

  <!-- ===== 分子分母標註 ===== -->

  <!-- 紅色區域標籤（左側） -->
  <g filter="url(#labelShadow)">
    <rect x="130" y="100" width="70" height="80" rx="12" ry="12" fill="white" opacity="0.92"/>
    <rect x="130" y="100" width="70" height="80" rx="12" ry="12" fill="none" stroke="#EE2222" stroke-width="1.5"/>
  </g>
  <text x="165" y="130" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="22" font-weight="bold" fill="#EE2222">1</text>
  <line x1="140" y1="142" x2="190" y2="142" stroke="#EE2222" stroke-width="2"/>
  <text x="165" y="168" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="22" font-weight="bold" fill="#EE2222">2</text>

  <!-- 藍色區域標籤（右側） -->
  <g filter="url(#labelShadow)">
    <rect x="400" y="100" width="70" height="80" rx="12" ry="12" fill="white" opacity="0.92"/>
    <rect x="400" y="100" width="70" height="80" rx="12" ry="12" fill="none" stroke="#2277EE" stroke-width="1.5"/>
  </g>
  <text x="435" y="130" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="22" font-weight="bold" fill="#2277EE">1</text>
  <line x1="410" y1="142" x2="460" y2="142" stroke="#2277EE" stroke-width="2"/>
  <text x="435" y="168" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="22" font-weight="bold" fill="#2277EE">2</text>

  <!-- 等號 + 結果 -->
  <text x="300" y="310" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">1/2 + 1/2 = 1</text>

  <!-- 底部裝飾線 -->
  <line x1="200" y1="330" x2="400" y2="330" stroke="#DDD" stroke-width="1"/>

  <!-- 百分比輔助文字 -->
  <text x="165" y="270" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="13" fill="#CC1111" opacity="0.7">50%</text>
  <text x="435" y="270" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="13" fill="#1155CC" opacity="0.7">50%</text>

  <!-- 小提示（左上角裝飾） -->
  <text x="50" y="355" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="11" fill="#999">分數模型 · 三年級</text>
</svg>