<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>

    <!-- 長方體頂面漸變 -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="40%" style="stop-color:#FF8E8E"/>
      <stop offset="100%" style="stop-color:#EE5A24"/>
    </linearGradient>

    <!-- 長方體正面漸變 -->
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="50%" style="stop-color:#44B3AB"/>
      <stop offset="100%" style="stop-color:#2E8B8B"/>
    </linearGradient>

    <!-- 長方體右側面漸變 -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45B7D1"/>
      <stop offset="50%" style="stop-color:#3A9DB5"/>
      <stop offset="100%" style="stop-color:#2C7A8C"/>
    </linearGradient>

    <!-- 放射漸變光影 -->
    <radialGradient id="glowTop" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glowFront" cx="20%" cy="20%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>

    <!-- 陰影濾鏡 -->
    <filter id="shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- 雙層陰影 -->
    <filter id="doubleShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="-1" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- 公式卡片漸變 -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>

    <!-- 邊框發光 -->
    <filter id="borderGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 標題文字漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="1.5" fill="#ffffff" opacity="0.15"/>
  <circle cx="150" cy="30" r="1" fill="#ffffff" opacity="0.1"/>
  <circle cx="550" cy="60" r="1.5" fill="#ffffff" opacity="0.12"/>
  <circle cx="480" cy="380" r="1" fill="#ffffff" opacity="0.1"/>
  <circle cx="30" cy="370" r="1.5" fill="#ffffff" opacity="0.12"/>
  <circle cx="570" cy="350" r="1" fill="#ffffff" opacity="0.08"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" filter="url(#borderGlow)">📐 長方體體積與表面積</text>

  <!-- ============ 長方體 3D ============ -->
  <g filter="url(#shadow3D)">
    <!-- 長方體 - 座標系：左側面可見，頂面可見，正面可見 -->
    <!-- 頂面 -->
    <polygon points="130,95 310,65 430,110 250,140" fill="url(#topFace)" stroke="#FF6B6B" stroke-width="1.5"/>
    <!-- 頂面光影 -->
    <polygon points="130,95 310,65 430,110 250,140" fill="url(#glowTop)"/>

    <!-- 正面 -->
    <polygon points="130,95 250,140 250,260 130,215" fill="url(#frontFace)" stroke="#4ECDC4" stroke-width="1.5"/>
    <!-- 正面光影 -->
    <polygon points="130,95 250,140 250,260 130,215" fill="url(#glowFront)"/>

    <!-- 右側面 -->
    <polygon points="250,140 430,110 430,230 250,260" fill="url(#rightFace)" stroke="#45B7D1" stroke-width="1.5"/>
    <!-- 右側面光影 -->
    <polygon points="250,140 430,110 430,230 250,260" fill="url(#glowRight)"/>

    <!-- 邊緣高光線 -->
    <line x1="130" y1="95" x2="310" y2="65" stroke="#FFB3B3" stroke-width="1" opacity="0.6"/>
    <line x1="130" y1="95" x2="250" y2="140" stroke="#7FE0D8" stroke-width="1" opacity="0.5"/>
    <line x1="250" y1="140" x2="430" y2="110" stroke="#7EC8E0" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- 尺寸標註 - 長 -->
  <line x1="130" y1="270" x2="250" y2="270" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="130" y1="265" x2="130" y2="275" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="250" y1="265" x2="250" y2="275" stroke="#FFD700" stroke-width="1.5"/>
  <text x="190" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFD700" font-weight="bold">l (長)</text>

  <!-- 尺寸標註 - 寬 -->
  <line x1="250" y1="268" x2="430" y2="238" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="250" y1="274" x2="258" y2="264" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="430" y1="244" x2="438" y2="234" stroke="#FFD700" stroke-width="1.5"/>
  <text x="345" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFD700" font-weight="bold">w (寬)</text>

  <!-- 尺寸標註 - 高 -->
  <line x1="115" y1="95" x2="115" y2="215" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="110" y1="95" x2="120" y2="95" stroke="#FFD700" stroke-width="1.5"/>
  <line x1="110" y1="215" x2="120" y2="215" stroke="#FFD700" stroke-width="1.5"/>
  <text x="105" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFD700" font-weight="bold" transform="rotate(-90,105,160)">h (高)</text>

  <!-- ============ 公式卡片 1：體積 ============ -->
  <g filter="url(#doubleShadow)">
    <rect x="30" y="300" width="255" height="85" rx="14" fill="url(#cardGrad1)" stroke="#4ECDC4" stroke-width="1.5" opacity="0.95"/>
    <!-- 卡片內光效 -->
    <rect x="30" y="300" width="255" height="85" rx="14" fill="url(#glowFront)" opacity="0.3"/>
  </g>

  <text x="157" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4ECDC4" font-weight="bold">📦 體積公式</text>
  <text x="157" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold">V = l × w × h</text>
  <text x="157" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#88DDDD" opacity="0.8">體積 = 長 × 寬 × 高</text>

  <!-- ============ 公式卡片 2：表面積 ============ -->
  <g filter="url(#doubleShadow)">
    <rect x="315" y="300" width="255" height="85" rx="14" fill="url(#cardGrad2)" stroke="#FF6B6B" stroke-width="1.5" opacity="0.95"/>
    <!-- 卡片內光效 -->
    <rect x="315" y="300" width="255" height="85" rx="14" fill="url(#glowTop)" opacity="0.25"/>
  </g>

  <text x="442" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#FF6B6B" font-weight="bold">📐 表面積公式</text>
  <text x="442" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold">SA = 2(lw + lh + wh)</text>
  <text x="442" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFAAAA" opacity="0.8">表面積 = 2×(長×寬 + 長×高 + 寬×高)</text>

  <!-- 裝飾連接線 -->
  <line x1="285" y1="342" x2="315" y2="342" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>
  <circle cx="300" cy="342" r="2" fill="#ffffff" opacity="0.3"/>

  <!-- 角落裝飾 -->
  <rect x="10" y="10" width="580" height="380" rx="12" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
</svg>