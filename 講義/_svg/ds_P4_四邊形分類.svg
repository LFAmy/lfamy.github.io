<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 卡片1：正方形 - 多層漸變 -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="25%" stop-color="#FF8E8E"/>
      <stop offset="50%" stop-color="#FF5252"/>
      <stop offset="75%" stop-color="#E04848"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <radialGradient id="shine1" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片2：長方形 - 多層漸變 -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="25%" stop-color="#81D4FA"/>
      <stop offset="50%" stop-color="#29B6F6"/>
      <stop offset="75%" stop-color="#039BE5"/>
      <stop offset="100%" stop-color="#0277BD"/>
    </linearGradient>
    <radialGradient id="shine2" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片3：菱形 - 多層漸變 -->
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AB47BC"/>
      <stop offset="25%" stop-color="#CE93D8"/>
      <stop offset="50%" stop-color="#9C27B0"/>
      <stop offset="75%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#6A1B9A"/>
    </linearGradient>
    <radialGradient id="shine3" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片4：平行四邊形 - 多層漸變 -->
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="25%" stop-color="#A5D6A7"/>
      <stop offset="50%" stop-color="#43A047"/>
      <stop offset="75%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <radialGradient id="shine4" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片5：梯形 - 多層漸變 -->
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="25%" stop-color="#FFCC80"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="75%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <radialGradient id="shine5" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="2" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 連接線箭頭標記 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8899AA"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 標題 -->
  <text x="300" y="30" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">📐 四邊形家族樹</text>
  <text x="300" y="48" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#7F8C8D">四邊形分類 ｜ 層級關係</text>

  <!-- 連接線（從上到下） -->
  <!-- 正方形 → 長方形 -->
  <line x1="300" y1="88" x2="300" y2="118" stroke="#8899AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 長方形 → 菱形 -->
  <line x1="300" y1="148" x2="300" y2="178" stroke="#8899AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 菱形 → 平行四邊形 -->
  <line x1="300" y1="208" x2="300" y2="238" stroke="#8899AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 平行四邊形 → 梯形 -->
  <line x1="300" y1="268" x2="300" y2="298" stroke="#8899AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 側邊標籤：包含關係 -->
  <text x="315" y="105" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="8" fill="#8899AA">包含</text>
  <text x="315" y="165" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="8" fill="#8899AA">包含</text>
  <text x="315" y="225" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="8" fill="#8899AA">包含</text>
  <text x="315" y="285" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="8" fill="#8899AA">包含</text>

  <!-- ===== 卡片1：正方形 ===== -->
  <g filter="url(#shadow)">
    <rect x="225" y="58" width="150" height="30" rx="8" ry="8" fill="url(#grad1)"/>
    <rect x="225" y="58" width="150" height="30" rx="8" ry="8" fill="url(#shine1)"/>
    <text x="300" y="78" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">正方形</text>
  </g>

  <!-- ===== 卡片2：長方形 ===== -->
  <g filter="url(#shadow)">
    <rect x="225" y="118" width="150" height="30" rx="8" ry="8" fill="url(#grad2)"/>
    <rect x="225" y="118" width="150" height="30" rx="8" ry="8" fill="url(#shine2)"/>
    <text x="300" y="138" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">長方形</text>
  </g>

  <!-- ===== 卡片3：菱形 ===== -->
  <g filter="url(#shadow)">
    <rect x="225" y="178" width="150" height="30" rx="8" ry="8" fill="url(#grad3)"/>
    <rect x="225" y="178" width="150" height="30" rx="8" ry="8" fill="url(#shine3)"/>
    <text x="300" y="198" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">菱形</text>
  </g>

  <!-- ===== 卡片4：平行四邊形 ===== -->
  <g filter="url(#shadow)">
    <rect x="225" y="238" width="150" height="30" rx="8" ry="8" fill="url(#grad4)"/>
    <rect x="225" y="238" width="150" height="30" rx="8" ry="8" fill="url(#shine4)"/>
    <text x="300" y="258" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">平行四邊形</text>
  </g>

  <!-- ===== 卡片5：梯形 ===== -->
  <g filter="url(#shadow)">
    <rect x="225" y="298" width="150" height="30" rx="8" ry="8" fill="url(#grad5)"/>
    <rect x="225" y="298" width="150" height="30" rx="8" ry="8" fill="url(#shine5)"/>
    <text x="300" y="318" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">梯形</text>
  </g>

  <!-- 底部說明 -->
  <text x="300" y="360" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#95A5A6">💡 箭頭表示「包含」關係：正方形是一種特殊的長方形</text>

  <!-- 裝飾小圖標 - 四邊形示意 -->
  <!-- 正方形小圖標 -->
  <rect x="195" y="63" width="20" height="20" rx="2" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

  <!-- 長方形小圖標 -->
  <rect x="195" y="123" width="20" height="20" rx="2" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

  <!-- 菱形小圖標 -->
  <polygon points="205,128 215,133 205,138 195,133" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

  <!-- 平行四邊形小圖標 -->
  <polygon points="195,243 205,243 215,253 205,253" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

  <!-- 梯形小圖標 -->
  <polygon points="198,303 212,303 215,313 195,313" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
</svg>