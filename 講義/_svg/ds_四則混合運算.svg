<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8f0fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dce8f5;stop-opacity:1" />
    </linearGradient>

    <!-- 頂層（括號）漸變 - 紅色 -->
    <radialGradient id="topGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ee4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc2222;stop-opacity:1" />
    </radialGradient>

    <!-- 中層（乘除）漸變 - 黃色 -->
    <radialGradient id="midGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffd93d;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f0c000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a800;stop-opacity:1" />
    </radialGradient>

    <!-- 底層（加減）漸變 - 綠色 -->
    <radialGradient id="botGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#51cf66;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#2fb344;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e8a33;stop-opacity:1" />
    </radialGradient>

    <!-- 頂層光澤 -->
    <radialGradient id="topShine" cx="35%" cy="25%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 中層光澤 -->
    <radialGradient id="midShine" cx="35%" cy="25%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 底層光澤 -->
    <radialGradient id="botShine" cx="35%" cy="25%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.45" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="shadowDouble" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- 文字陰影 -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowDown" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#666666"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="16" ry="16" fill="url(#bgGrad)"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="bold" fill="#2c3e50" filter="url(#textShadow)">🧮 四則混合運算 · 運算優先級金字塔</text>

  <!-- 裝飾線 -->
  <line x1="120" y1="50" x2="480" y2="50" stroke="#b0c4de" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- ============ 底層：加減（綠色） ============ -->
  <g filter="url(#shadowDouble)">
    <rect x="100" y="290" width="400" height="70" rx="18" ry="18" fill="url(#botGrad)"/>
    <rect x="100" y="290" width="400" height="70" rx="18" ry="18" fill="url(#botShine)"/>
  </g>

  <!-- 底層文字 -->
  <text x="300" y="318" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="bold" fill="#ffffff" filter="url(#textShadow)">➕ 加減法 ➖</text>
  <text x="300" y="342" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#f0fff0" opacity="0.9">最後計算 · 從左到右</text>

  <!-- 底層左側標籤 -->
  <rect x="70" y="305" width="28" height="40" rx="8" ry="8" fill="#1e8a33" filter="url(#cardShadow)"/>
  <text x="84" y="332" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3</text>

  <!-- 底層右側標籤 -->
  <rect x="502" y="305" width="28" height="40" rx="8" ry="8" fill="#1e8a33" filter="url(#cardShadow)"/>
  <text x="516" y="332" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3</text>

  <!-- ============ 中層：乘除（黃色） ============ -->
  <g filter="url(#shadowDouble)">
    <rect x="130" y="195" width="340" height="70" rx="18" ry="18" fill="url(#midGrad)"/>
    <rect x="130" y="195" width="340" height="70" rx="18" ry="18" fill="url(#midShine)"/>
  </g>

  <!-- 中層文字 -->
  <text x="300" y="223" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="bold" fill="#ffffff" filter="url(#textShadow)">✖️ 乘除法 ➗</text>
  <text x="300" y="247" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#fff8e0" opacity="0.9">其次計算 · 從左到右</text>

  <!-- 中層左側標籤 -->
  <rect x="100" y="210" width="28" height="40" rx="8" ry="8" fill="#d4a800" filter="url(#cardShadow)"/>
  <text x="114" y="237" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2</text>

  <!-- 中層右側標籤 -->
  <rect x="472" y="210" width="28" height="40" rx="8" ry="8" fill="#d4a800" filter="url(#cardShadow)"/>
  <text x="486" y="237" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2</text>

  <!-- ============ 頂層：括號（紅色） ============ -->
  <g filter="url(#shadowDouble)">
    <rect x="160" y="100" width="280" height="70" rx="18" ry="18" fill="url(#topGrad)"/>
    <rect x="160" y="100" width="280" height="70" rx="18" ry="18" fill="url(#topShine)"/>
  </g>

  <!-- 頂層文字 -->
  <text x="300" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="bold" fill="#ffffff" filter="url(#textShadow)">( ) 括號</text>
  <text x="300" y="152" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#ffe0e0" opacity="0.9">最優先計算 · 先算括號內</text>

  <!-- 頂層左側標籤 -->
  <rect x="130" y="115" width="28" height="40" rx="8" ry="8" fill="#cc2222" filter="url(#cardShadow)"/>
  <text x="144" y="142" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1</text>

  <!-- 頂層右側標籤 -->
  <rect x="442" y="115" width="28" height="40" rx="8" ry="8" fill="#cc2222" filter="url(#cardShadow)"/>
  <text x="456" y="142" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1</text>

  <!-- ============ 連接箭頭 ============ -->
  <!-- 頂 → 中 -->
  <line x1="300" y1="170" x2="300" y2="190" stroke="#888888" stroke-width="2.5" marker-end="url(#arrowDown)" opacity="0.6"/>

  <!-- 中 → 底 -->
  <line x1="300" y1="265" x2="300" y2="285" stroke="#888888" stroke-width="2.5" marker-end="url(#arrowDown)" opacity="0.6"/>

  <!-- ============ 紅綠燈指示 ============ -->
  <!-- 頂層紅燈 -->
  <circle cx="480" cy="135" r="12" fill="#ff2222" filter="url(#cardShadow)"/>
  <circle cx="480" cy="135" r="12" fill="url(#topShine)"/>
  <circle cx="480" cy="135" r="4" fill="#ffffff" opacity="0.4"/>

  <!-- 中層黃燈 -->
  <circle cx="480" cy="230" r="12" fill="#ffcc00" filter="url(#cardShadow)"/>
  <circle cx="480" cy="230" r="12" fill="url(#midShine)"/>
  <circle cx="480" cy="230" r="4" fill="#ffffff" opacity="0.4"/>

  <!-- 底層綠燈 -->
  <circle cx="480" cy="325" r="12" fill="#22cc44" filter="url(#cardShadow)"/>
  <circle cx="480" cy="325" r="12" fill="url(#botShine)"/>
  <circle cx="480" cy="325" r="4" fill="#ffffff" opacity="0.4"/>

  <!-- ============ 底部提示卡片 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="355" width="320" height="35" rx="10" ry="10" fill="#ffffff" opacity="0.85"/>
  </g>
  <text x="300" y="377" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#555555">💡 提示：先算括號 → 再算乘除 → 最後加減</text>

  <!-- 裝飾小星星 -->
  <text x="50" y="80" font-size="16" opacity="0.3">✦</text>
  <text x="540" y="85" font-size="12" opacity="0.3">✦</text>
  <text x="45" y="370" font-size="14" opacity="0.25">✦</text>
  <text x="555" y="360" font-size="10" opacity="0.25">✦</text>
</svg>