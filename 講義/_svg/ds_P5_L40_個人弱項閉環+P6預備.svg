<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </radialGradient>

    <!-- 主圓環漸變 - 多層 -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="50%" stop-color="#357ABD"/>
      <stop offset="100%" stop-color="#2C5F8A"/>
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#E8961E"/>
      <stop offset="100%" stop-color="#D4841A"/>
    </linearGradient>

    <linearGradient id="ringGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ED321"/>
      <stop offset="50%" stop-color="#6BBF1A"/>
      <stop offset="100%" stop-color="#5AA015"/>
    </linearGradient>

    <linearGradient id="ringGrad4" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D0021B"/>
      <stop offset="50%" stop-color="#B80016"/>
      <stop offset="100%" stop-color="#9A0012"/>
    </linearGradient>

    <!-- 3D光影放射漸變 -->
    <radialGradient id="shineGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片漸變 -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F9FC"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF9F0"/>
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2FAEC"/>
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F0"/>
    </linearGradient>

    <!-- 雙層陰影過濾器 -->
    <filter id="doubleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.06)"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.07)"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.05)"/>
    </filter>

    <filter id="arrowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#357ABD"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#E8961E"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#6BBF1A"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#B80016"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC" rx="12"/>
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#2C3E50" letter-spacing="2">
    數學弱項閉環系統
  </text>
  <line x1="220" y1="48" x2="380" y2="48" stroke="#4A90D9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- ===== 圓環路徑 ===== -->
  <!-- 圓環背景軌道 -->
  <circle cx="300" cy="215" r="105" fill="none" stroke="#E8ECF0" stroke-width="38" opacity="0.5"/>

  <!-- 4段圓弧 - 每段90度，從頂部順時針 -->
  <!-- 第1段：測試 (藍色) - 從-90度到0度 -->
  <path d="M300,110 A105,105 0 0,1 405,215" fill="none" stroke="url(#ringGrad1)" stroke-width="38" stroke-linecap="round"/>

  <!-- 第2段：分析 (橙色) - 從0度到90度 -->
  <path d="M405,215 A105,105 0 0,1 300,320" fill="none" stroke="url(#ringGrad2)" stroke-width="38" stroke-linecap="round"/>

  <!-- 第3段：補救 (綠色) - 從90度到180度 -->
  <path d="M300,320 A105,105 0 0,1 195,215" fill="none" stroke="url(#ringGrad3)" stroke-width="38" stroke-linecap="round"/>

  <!-- 第4段：再測試 (紅色) - 從180度到270度 -->
  <path d="M195,215 A105,105 0 0,1 300,110" fill="none" stroke="url(#ringGrad4)" stroke-width="38" stroke-linecap="round"/>

  <!-- 3D光影覆蓋層 -->
  <circle cx="300" cy="215" r="105" fill="url(#shineGrad)" opacity="0.6"/>

  <!-- 圓環內圈高光 -->
  <circle cx="300" cy="215" r="86" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- 圓環中心圓 -->
  <circle cx="300" cy="215" r="55" fill="#FAFBFC" filter="url(#doubleShadow)"/>
  <circle cx="300" cy="215" r="55" fill="url(#bgGrad)"/>
  <circle cx="300" cy="215" r="55" fill="none" stroke="#D0D7DE" stroke-width="1"/>

  <!-- 中心圖標：閉環符號 -->
  <circle cx="300" cy="215" r="22" fill="none" stroke="#4A90D9" stroke-width="2.5" opacity="0.3"/>
  <path d="M285,215 A15,15 0 1,1 300,200" fill="none" stroke="#4A90D9" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="300,196 296,203 304,203" fill="#4A90D9"/>
  <text x="300" y="250" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#7B8BA4" font-weight="500">閉環</text>

  <!-- ===== 4個圓角卡片 ===== -->
  <!-- 卡片1：測試 (頂部) -->
  <g filter="url(#cardShadow)">
    <rect x="248" y="58" width="104" height="44" rx="12" fill="url(#cardGrad1)" stroke="#E8ECF0" stroke-width="1"/>
    <rect x="248" y="58" width="104" height="44" rx="12" fill="url(#ringGrad1)" opacity="0.08"/>
    <circle cx="268" cy="80" r="12" fill="url(#ringGrad1)"/>
    <text x="268" y="85" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#FFFFFF" font-weight="700">1</text>
    <text x="290" y="86" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#2C5F8A" font-weight="700">測試</text>
  </g>

  <!-- 卡片2：分析 (右側) -->
  <g filter="url(#cardShadow)">
    <rect x="418" y="193" width="104" height="44" rx="12" fill="url(#cardGrad2)" stroke="#E8ECF0" stroke-width="1"/>
    <rect x="418" y="193" width="104" height="44" rx="12" fill="url(#ringGrad2)" opacity="0.08"/>
    <circle cx="438" cy="215" r="12" fill="url(#ringGrad2)"/>
    <text x="438" y="220" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#FFFFFF" font-weight="700">2</text>
    <text x="460" y="221" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#D4841A" font-weight="700">分析</text>
  </g>

  <!-- 卡片3：補救 (底部) -->
  <g filter="url(#cardShadow)">
    <rect x="248" y="328" width="104" height="44" rx="12" fill="url(#cardGrad3)" stroke="#E8ECF0" stroke-width="1"/>
    <rect x="248" y="328" width="104" height="44" rx="12" fill="url(#ringGrad3)" opacity="0.08"/>
    <circle cx="268" cy="350" r="12" fill="url(#ringGrad3)"/>
    <text x="268" y="355" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#FFFFFF" font-weight="700">3</text>
    <text x="290" y="356" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#5AA015" font-weight="700">補救</text>
  </g>

  <!-- 卡片4：再測試 (左側) -->
  <g filter="url(#cardShadow)">
    <rect x="78" y="193" width="104" height="44" rx="12" fill="url(#cardGrad4)" stroke="#E8ECF0" stroke-width="1"/>
    <rect x="78" y="193" width="104" height="44" rx="12" fill="url(#ringGrad4)" opacity="0.08"/>
    <circle cx="98" cy="215" r="12" fill="url(#ringGrad4)"/>
    <text x="98" y="220" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#FFFFFF" font-weight="700">4</text>
    <text x="120" y="221" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#9A0012" font-weight="700">再測試</text>
  </g>

  <!-- ===== 連接箭頭 (圓環上的箭頭) ===== -->
  <!-- 測試→分析 (頂部到右側，順時針) -->
  <g filter="url(#arrowShadow)">
    <line x1="352" y1="118" x2="395" y2="160" stroke="#357ABD" stroke-width="3" marker-end="url(#arrowBlue)" stroke-linecap="round"/>
  </g>

  <!-- 分析→補救 (右側到底部) -->
  <g filter="url(#arrowShadow)">
    <line x1="395" y1="270" x2="352" y2="312" stroke="#E8961E" stroke-width="3" marker-end="url(#arrowOrange)" stroke-linecap="round"/>
  </g>

  <!-- 補救→再測試 (底部到左側) -->
  <g filter="url(#arrowShadow)">
    <line x1="248" y1="312" x2="205" y2="270" stroke="#6BBF1A" stroke-width="3" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  </g>

  <!-- 再測試→測試 (左側到頂部) -->
  <g filter="url(#arrowShadow)">
    <line x1="205" y1="160" x2="248" y2="118" stroke="#B80016" stroke-width="3" marker-end="url(#arrowRed)" stroke-linecap="round"/>
  </g>

  <!-- ===== 裝飾元素 ===== -->
  <!-- 卡片上的小圖標 -->
  <!-- 測試圖標 (✓) -->
  <text x="340" y="86" font-family="sans-serif" font-size="16" fill="#357ABD" opacity="0.5">📝</text>

  <!-- 分析圖標 (📊) -->
  <text x="510" y="221" font-family="sans-serif" font-size="16" fill="#E8961E" opacity="0.5">📊</text>

  <!-- 補救圖標 (🔧) -->
  <text x="340" y="356" font-family="sans-serif" font-size="16" fill="#6BBF1A" opacity="0.5">🔧</text>

  <!-- 再測試圖標 (🔄) -->
  <text x="170" y="221" font-family="sans-serif" font-size="16" fill="#B80016" opacity="0.5">🔄</text>

  <!-- 底部說明 -->
  <text x="300" y="388" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#A0AEC0" letter-spacing="1">
    持續改進 · 針對性訓練 · 鞏固提升
  </text>

  <!-- 角落裝飾點 -->
  <circle cx="20" cy="20" r="3" fill="#4A90D9" opacity="0.15"/>
  <circle cx="580" cy="20" r="3" fill="#4A90D9" opacity="0.15"/>
  <circle cx="20" cy="380" r="3" fill="#4A90D9" opacity="0.15"/>
  <circle cx="580" cy="380" r="3" fill="#4A90D9" opacity="0.15"/>
</svg>