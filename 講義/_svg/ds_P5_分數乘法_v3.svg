<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#E2E8F0" opacity="0.6"/>
    </pattern>

    <!-- 主色多層漸變（藍色） -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <!-- 強調色多層漸變（橙色） -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- 單個長條漸變（垂直） -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="30%" stop-color="#6366F1"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="30%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- 放射漸變做3D光影效果 -->
    <radialGradient id="barLight1" cx="30%" cy="20%" r="70%" fx="25%" fy="15%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>

    <radialGradient id="barLight2" cx="30%" cy="20%" r="70%" fx="25%" fy="15%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </radialGradient>

    <radialGradient id="accentLight" cx="30%" cy="20%" r="70%" fx="25%" fy="15%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
    </radialGradient>

    <!-- 箭頭漸層色 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" blur="4" flood-color="#4F46E5" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" blur="12" flood-color="#4F46E5" flood-opacity="0.08"/>
    </filter>

    <filter id="barShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" blur="3" flood-color="#4F46E5" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="5" blur="10" flood-color="#4F46E5" flood-opacity="0.08"/>
    </filter>

    <filter id="accentShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" blur="3" flood-color="#F59E0B" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="5" blur="10" flood-color="#F59E0B" flood-opacity="0.08"/>
    </filter>

    <!-- 箭頭定義 -->
    <marker id="arrowMarker" viewBox="0 0 12 8" refX="10" refY="4" markerWidth="12" markerHeight="8" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="url(#arrowGrad)"/>
    </marker>

    <!-- 漸層邊框 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#dotGrid)"/>

  <!-- 主卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="14" ry="14" fill="#FFFFFF" stroke="url(#borderGrad)" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- 標題區域 -->
  <rect x="20" y="15" width="560" height="48" rx="14" ry="14" fill="url(#mainGrad)" opacity="0.08"/>
  <rect x="20" y="45" width="560" height="18" fill="url(#mainGrad)" opacity="0.06"/>

  <!-- 標題文字 -->
  <text x="40" y="46" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B">📐 分數乘法 — 面積模型：<tspan fill="#4F46E5">2/3</tspan> × 4 = <tspan fill="#F59E0B">8/3</tspan></text>

  <!-- 4個長條區域 -->
  <!-- 長條 1 -->
  <g filter="url(#barShadow)">
    <rect x="50" y="80" width="100" height="180" rx="12" ry="12" fill="url(#barGrad1)"/>
    <rect x="50" y="80" width="100" height="180" rx="12" ry="12" fill="url(#barLight1)"/>
    <!-- 分割線（三等份） -->
    <line x1="50" y1="140" x2="150" y2="140" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="50" y1="200" x2="150" y2="200" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- 標記2份（上方2份） -->
    <rect x="50" y="80" width="100" height="60" rx="12" ry="12" fill="#FFFFFF" fill-opacity="0.20"/>
    <rect x="50" y="140" width="100" height="60" rx="0" ry="0" fill="#FFFFFF" fill-opacity="0.20"/>
    <!-- 份數標註 -->
    <text x="100" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">1</text>
    <text x="100" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">2</text>
    <text x="100" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E0E7FF">3</text>
  </g>

  <!-- 長條 2 -->
  <g filter="url(#barShadow)">
    <rect x="175" y="80" width="100" height="180" rx="12" ry="12" fill="url(#barGrad2)"/>
    <rect x="175" y="80" width="100" height="180" rx="12" ry="12" fill="url(#barLight2)"/>
    <line x1="175" y1="140" x2="275" y2="140" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="175" y1="200" x2="275" y2="200" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="175" y="80" width="100" height="60" rx="12" ry="12" fill="#FFFFFF" fill-opacity="0.20"/>
    <rect x="175" y="140" width="100" height="60" rx="0" ry="0" fill="#FFFFFF" fill-opacity="0.20"/>
    <text x="225" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">1</text>
    <text x="225" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">2</text>
    <text x="225" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E0E7FF">3</text>
  </g>

  <!-- 長條 3 -->
  <g filter="url(#barShadow)">
    <rect x="300" y="80" width="100" height="180" rx="12" ry="12" fill="url(#barGrad1)"/>
    <rect x="300" y="80" width="100" height="180" rx="12" ry="12" fill="url(#barLight1)"/>
    <line x1="300" y1="140" x2="400" y2="140" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="300" y1="200" x2="400" y2="200" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="300" y="80" width="100" height="60" rx="12" ry="12" fill="#FFFFFF" fill-opacity="0.20"/>
    <rect x="300" y="140" width="100" height="60" rx="0" ry="0" fill="#FFFFFF" fill-opacity="0.20"/>
    <text x="350" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">1</text>
    <text x="350" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">2</text>
    <text x="350" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E0E7FF">3</text>
  </g>

  <!-- 長條 4 -->
  <g filter="url(#barShadow)">
    <rect x="425" y="80" width="100" height="180" rx="12" ry="12" fill="url(#barGrad2)"/>
    <rect x="425" y="80" width="100" height="180" rx="12" ry="12" fill="url(#barLight2)"/>
    <line x1="425" y1="140" x2="525" y2="140" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="425" y1="200" x2="525" y2="200" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="425" y="80" width="100" height="60" rx="12" ry="12" fill="#FFFFFF" fill-opacity="0.20"/>
    <rect x="425" y="140" width="100" height="60" rx="0" ry="0" fill="#FFFFFF" fill-opacity="0.20"/>
    <text x="475" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">1</text>
    <text x="475" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">2</text>
    <text x="475" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E0E7FF">3</text>
  </g>

  <!-- 底部標籤：每條代表1 -->
  <text x="100" y="280" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="13" fill="#4F46E5" font-weight="bold">1</text>
  <text x="225" y="280" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="13" fill="#6366F1" font-weight="bold">1</text>
  <text x="350" y="280" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="13" fill="#4F46E5" font-weight="bold">1</text>
  <text x="475" y="280" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="13" fill="#6366F1" font-weight="bold">1</text>

  <!-- 底部小標註：每條分3份 -->
  <text x="100" y="296" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="10" fill="#94A3B8">（每條分3份）</text>
  <text x="225" y="296" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="10" fill="#94A3B8">（每條分3份）</text>
  <text x="350" y="296" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="10" fill="#94A3B8">（每條分3份）</text>
  <text x="475" y="296" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="10" fill="#94A3B8">（每條分3份）</text>

  <!-- 總和箭頭與結果 -->
  <!-- 大括號或箭頭表示總和 -->
  <line x1="50" y1="320" x2="525" y2="320" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrowMarker)"/>
  <line x1="50" y1="320" x2="50" y2="315" stroke="url(#arrowGrad)" stroke-width="2"/>
  <line x1="525" y1="320" x2="525" y2="315" stroke="url(#arrowGrad)" stroke-width="2"/>

  <!-- 總和結果卡片 -->
  <g filter="url(#accentShadow)">
    <rect x="195" y="335" width="210" height="38" rx="12" ry="12" fill="url(#accentGrad)"/>
    <rect x="195" y="335" width="210" height="38" rx="12" ry="12" fill="url(#accentLight)"/>
    <text x="300" y="360" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="15" fill="#7C2D12" font-weight="bold">總和 = 2/3 × 4 = 8/3</text>
  </g>

  <!-- 右上角解說標籤 -->
  <g filter="url(#cardShadow)">
    <rect x="410" y="28" width="155" height="36" rx="10" ry="10" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="1.5"/>
    <text x="487" y="50" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="11" fill="#6366F1">取每條的 2 份（共 8 份）</text>
  </g>

  <!-- 每條2份的視覺提示 -->
  <text x="100" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#818CF8">2份</text>
  <text x="225" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#818CF8">2份</text>
  <text x="350" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#818CF8">2份</text>
  <text x="475" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#818CF8">2份</text>

  <!-- 裝飾性小標籤：分數乘法概念 -->
  <g opacity="0.5">
    <text x="540" y="370" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#A5B4FC">P5 數學 · 面積模型</text>
  </g>
</svg>