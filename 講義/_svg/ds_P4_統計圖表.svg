<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8ecf1"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8ecf1"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8ecf1"/>
    </linearGradient>

    <!-- 長條圖漸層 -->
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ffa502"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1e90ff"/>
      <stop offset="100%" style="stop-color:#00d2ff"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2ed573"/>
      <stop offset="100%" style="stop-color:#7bed9f"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#e056fd"/>
      <stop offset="100%" style="stop-color:#dda0dd"/>
    </linearGradient>

    <!-- 長條3D光影 -->
    <linearGradient id="barShine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.15)"/>
    </linearGradient>

    <!-- 折線圖漸層 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="50%" style="stop-color:#ffa502"/>
      <stop offset="100%" style="stop-color:#2ed573"/>
    </linearGradient>

    <!-- 折線區域填充漸層 -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,165,2,0.4)"/>
      <stop offset="100%" style="stop-color:rgba(255,165,2,0.02)"/>
    </linearGradient>

    <!-- 圓形圖漸層 -->
    <radialGradient id="pieGrad1" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ff9a9e"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </radialGradient>
    <radialGradient id="pieGrad2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#a8e6cf"/>
      <stop offset="100%" style="stop-color:#2ed573"/>
    </radialGradient>
    <radialGradient id="pieGrad3" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#87ceeb"/>
      <stop offset="100%" style="stop-color:#1e90ff"/>
    </radialGradient>
    <radialGradient id="pieGrad4" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#dda0dd"/>
      <stop offset="100%" style="stop-color:#e056fd"/>
    </radialGradient>

    <!-- 圓形圖3D光影 -->
    <radialGradient id="pieShine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.25)"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="rgba(255,255,255,0.3)"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(0,0,0,0.2)"/>
    </filter>

    <!-- 發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" filter="url(#glow)">📊 統計圖表對比</text>
  <text x="300" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">香港小學數學 · 三種圖表</text>

  <!-- ============ 卡片1：長條圖 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="12" y="58" width="185" height="155" rx="14" fill="url(#cardGrad1)"/>
    <!-- 卡片內邊框光澤 -->
    <rect x="12" y="58" width="185" height="155" rx="14" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
  </g>
  <text x="104" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">長條圖</text>

  <!-- 長條圖網格線 -->
  <line x1="35" y1="195" x2="175" y2="195" stroke="#ddd" stroke-width="0.5"/>
  <line x1="35" y1="175" x2="175" y2="175" stroke="#eee" stroke-width="0.3"/>
  <line x1="35" y1="155" x2="175" y2="155" stroke="#eee" stroke-width="0.3"/>
  <line x1="35" y1="135" x2="175" y2="135" stroke="#eee" stroke-width="0.3"/>
  <line x1="35" y1="115" x2="175" y2="115" stroke="#eee" stroke-width="0.3"/>

  <!-- Y軸標籤 -->
  <text x="32" y="198" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">0</text>
  <text x="32" y="178" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">25</text>
  <text x="32" y="158" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">50</text>
  <text x="32" y="138" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">75</text>
  <text x="32" y="118" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">100</text>

  <!-- 長條1 -->
  <rect x="45" y="130" width="22" height="65" rx="3" fill="url(#bar1)"/>
  <rect x="45" y="130" width="22" height="65" rx="3" fill="url(#barShine1)"/>
  <text x="56" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">小一</text>
  <text x="56" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ff6b6b">65</text>

  <!-- 長條2 -->
  <rect x="75" y="110" width="22" height="85" rx="3" fill="url(#bar2)"/>
  <rect x="75" y="110" width="22" height="85" rx="3" fill="url(#barShine1)"/>
  <text x="86" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">小二</text>
  <text x="86" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#1e90ff">85</text>

  <!-- 長條3 -->
  <rect x="105" y="95" width="22" height="100" rx="3" fill="url(#bar3)"/>
  <rect x="105" y="95" width="22" height="100" rx="3" fill="url(#barShine1)"/>
  <text x="116" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">小三</text>
  <text x="116" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#2ed573">100</text>

  <!-- 長條4 -->
  <rect x="135" y="120" width="22" height="75" rx="3" fill="url(#bar4)"/>
  <rect x="135" y="120" width="22" height="75" rx="3" fill="url(#barShine1)"/>
  <text x="146" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">小四</text>
  <text x="146" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#e056fd">75</text>

  <!-- ============ 卡片2：折線圖 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="207" y="58" width="185" height="155" rx="14" fill="url(#cardGrad2)"/>
    <rect x="207" y="58" width="185" height="155" rx="14" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
  </g>
  <text x="299" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">折線圖</text>

  <!-- 折線圖網格 -->
  <line x1="230" y1="195" x2="370" y2="195" stroke="#ddd" stroke-width="0.5"/>
  <line x1="230" y1="175" x2="370" y2="175" stroke="#eee" stroke-width="0.3"/>
  <line x1="230" y1="155" x2="370" y2="155" stroke="#eee" stroke-width="0.3"/>
  <line x1="230" y1="135" x2="370" y2="135" stroke="#eee" stroke-width="0.3"/>
  <line x1="230" y1="115" x2="370" y2="115" stroke="#eee" stroke-width="0.3"/>

  <!-- Y軸標籤 -->
  <text x="227" y="198" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">0</text>
  <text x="227" y="178" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">25</text>
  <text x="227" y="158" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">50</text>
  <text x="227" y="138" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">75</text>
  <text x="227" y="118" text-anchor="end" font-family="Arial, sans-serif" font-size="7" fill="#999">100</text>

  <!-- 區域填充 -->
  <polygon points="245,185 280,155 310,125 340,145 365,165 365,195 245,195" fill="url(#areaGrad)" opacity="0.6"/>

  <!-- 折線 -->
  <polyline points="245,185 280,155 310,125 340,145 365,165" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowShadow)"/>

  <!-- 數據點 -->
  <circle cx="245" cy="185" r="4" fill="#ff6b6b" stroke="#fff" stroke-width="1.5" filter="url(#glowShadow)"/>
  <circle cx="280" cy="155" r="4" fill="#ffa502" stroke="#fff" stroke-width="1.5" filter="url(#glowShadow)"/>
  <circle cx="310" cy="125" r="4" fill="#2ed573" stroke="#fff" stroke-width="1.5" filter="url(#glowShadow)"/>
  <circle cx="340" cy="145" r="4" fill="#1e90ff" stroke="#fff" stroke-width="1.5" filter="url(#glowShadow)"/>
  <circle cx="365" cy="165" r="4" fill="#e056fd" stroke="#fff" stroke-width="1.5" filter="url(#glowShadow)"/>

  <!-- 數據標籤 -->
  <text x="245" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#999">一</text>
  <text x="280" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#999">二</text>
  <text x="310" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#999">三</text>
  <text x="340" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#999">四</text>
  <text x="365" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#999">五</text>

  <!-- 數值 -->
  <text x="245" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#ff6b6b">15</text>
  <text x="280" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#ffa502">45</text>
  <text x="310" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#2ed573">75</text>
  <text x="340" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#1e90ff">55</text>
  <text x="365" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#e056fd">35</text>

  <!-- ============ 卡片3：圓形圖 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="402" y="58" width="185" height="155" rx="14" fill="url(#cardGrad3)"/>
    <rect x="402" y="58" width="185" height="155" rx="14" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
  </g>
  <text x="494" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">圓形圖</text>

  <!-- 圓形圖 - 使用扇形 -->
  <!-- 紅色扇形 40% -->
  <path d="M494,145 L494,105 A40,40 0 0,1 526.8,118.6 Z" fill="url(#pieGrad1)"/>
  <!-- 綠色扇形 25% -->
  <path d="M494,145 L526.8,118.6 A40,40 0 0,1 534,145 Z" fill="url(#pieGrad2)"/>
  <!-- 藍色扇形 20% -->
  <path d="M494,145 L534,145 A40,40 0 0,1 518.2,177.4 Z" fill="url(#pieGrad3)"/>
  <!-- 紫色扇形 15% -->
  <path d="M494,145 L518.2,177.4 A40,40 0 0,1 494,185 Z" fill="url(#pieGrad4)"/>

  <!-- 圓形圖光影 -->
  <circle cx="494" cy="145" r="40" fill="url(#pieShine)" opacity="0.5"/>

  <!-- 圓形圖邊框 -->
  <circle cx="494" cy="145" r="40" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

  <!-- 中心圓（甜甜圈效果） -->
  <circle cx="494" cy="145" r="16" fill="#fff" opacity="0.9"/>
  <circle cx="494" cy="145" r="16" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <text x="494" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#333">100%</text>

  <!-- 圖例 -->
  <rect x="420" y="192" width="8" height="8" rx="2" fill="url(#pieGrad1)"/>
  <text x="430" y="199" font-family="Arial, sans-serif" font-size="7" fill="#666">蘋果 40%</text>

  <rect x="470" y="192" width="8" height="8" rx="2" fill="url(#pieGrad2)"/>
  <text x="480" y="199" font-family="Arial, sans-serif" font-size="7" fill="#666">橙 25%</text>

  <rect x="420" y="204" width="8" height="8" rx="2" fill="url(#pieGrad3)"/>
  <text x="430" y="211" font-family="Arial, sans-serif" font-size="7" fill="#666">藍莓 20%</text>

  <rect x="470" y="204" width="8" height="8" rx="2" fill="url(#pieGrad4)"/>
  <text x="480" y="211" font-family="Arial, sans-serif" font-size="7" fill="#666">提子 15%</text>

  <!-- ============ 底部資訊卡 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="12" y="225" width="575" height="165" rx="14" fill="url(#cardGrad1)"/>
    <rect x="12" y="225" width="575" height="165" rx="14" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
  </g>

  <!-- 底部標題 -->
  <text x="300" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">📈 圖表特點對比</text>

  <!-- 三個圖表特點 -->
  <!-- 長條圖特點 -->
  <g>
    <rect x="30" y="260" width="170" height="115" rx="10" fill="#fff8f0" stroke="#ffa502" stroke-width="1"/>
    <rect x="30" y="260" width="170" height="24" rx="10" fill="url(#bar1)"/>
    <rect x="30" y="274" width="170" height="10" rx="0" fill="url(#bar1)"/>
    <text x="115" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">📊 長條圖</text>
    <text x="115" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 比較不同類別數據</text>
    <text x="115" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 高度代表數值大小</text>
    <text x="115" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 適合展示排名</text>
    <text x="115" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 易於比較高低</text>
    <text x="115" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#aaa">例：各班考試平均分</text>
  </g>

  <!-- 折線圖特點 -->
  <g>
    <rect x="215" y="260" width="170" height="115" rx="10" fill="#f0f8ff" stroke="#1e90ff" stroke-width="1"/>
    <rect x="215" y="260" width="170" height="24" rx="10" fill="url(#bar2)"/>
    <rect x="215" y="274" width="170" height="10" rx="0" fill="url(#bar2)"/>
    <text x="300" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">📈 折線圖</text>
    <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 顯示數據變化趨勢</text>
    <text x="300" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 點與點之間連線</text>
    <text x="300" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 適合時間序列數據</text>
    <text x="300" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 觀察上升或下降</text>
    <text x="300" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#aaa">例：每月溫度變化</text>
  </g>

  <!-- 圓形圖特點 -->
  <g>
    <rect x="400" y="260" width="170" height="115" rx="10" fill="#f0fff0" stroke="#2ed573" stroke-width="1"/>
    <rect x="400" y="260" width="170" height="24" rx="10" fill="url(#bar3)"/>
    <rect x="400" y="274" width="170" height="10" rx="0" fill="url(#bar3)"/>
    <text x="485" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">🥧 圓形圖</text>
    <text x="485" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 顯示部分佔整體比例</text>
    <text x="485" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 扇形大小代表百分比</text>
    <text x="485" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 總和為100%</text>
    <text x="485" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#555">• 適合展示分佈</text>
    <text x="485" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#aaa">例：最喜歡的水果</text>
  </g>

</svg>