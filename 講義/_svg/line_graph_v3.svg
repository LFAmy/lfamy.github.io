<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="50%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>

    <!-- 卡片主體漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7FAFC"/>
    </linearGradient>

    <!-- 卡片邊框漸變 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- 圖表區域背景 -->
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>

    <!-- 折線漸變 - 溫度上升 -->
    <linearGradient id="lineGradUp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- 折線漸變 - 溫度下降 -->
    <linearGradient id="lineGradDown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- 3D 光影效果 - 上升箭頭 -->
    <linearGradient id="arrowUpGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- 3D 光影效果 - 下降箭頭 -->
    <linearGradient id="arrowDownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>

    <!-- 數據點放射漸變 -->
    <radialGradient id="pointGrad1" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>

    <radialGradient id="pointGrad2" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <radialGradient id="pointGrad3" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </radialGradient>

    <radialGradient id="pointGrad4" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>

    <radialGradient id="pointGrad5" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </radialGradient>

    <!-- 數據點光暈 -->
    <radialGradient id="glowGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>

    <!-- 雙層陰影過濾器 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#94A3B8" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#64748B" flood-opacity="0.1"/>
    </filter>

    <filter id="pointShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <filter id="arrowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 網格線圖案 -->
    <pattern id="gridPattern" width="50" height="40" patternUnits="userSpaceOnUse">
      <line x1="50" y1="0" x2="50" y2="40" stroke="#E2E8F0" stroke-width="0.5"/>
      <line x1="0" y1="40" x2="50" y2="40" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>

    <!-- 面積填充漸變 -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.01"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- 主卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="16" ry="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- 標題區域 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#1E293B">🌡️ 香港某日溫度變化圖</text>
  <text x="300" y="78" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#94A3B8">2024年3月15日（上午6時至下午6時）</text>

  <!-- 圖表區域 -->
  <rect x="70" y="95" width="460" height="240" rx="8" ry="8" fill="url(#chartBg)" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- 網格 -->
  <rect x="70" y="95" width="460" height="240" fill="url(#gridPattern)" rx="8"/>

  <!-- Y軸標籤 -->
  <text x="65" y="105" text-anchor="end" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">32°C</text>
  <text x="65" y="145" text-anchor="end" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">30°C</text>
  <text x="65" y="185" text-anchor="end" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">28°C</text>
  <text x="65" y="225" text-anchor="end" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">26°C</text>
  <text x="65" y="265" text-anchor="end" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">24°C</text>
  <text x="65" y="305" text-anchor="end" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">22°C</text>
  <text x="65" y="340" text-anchor="end" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">20°C</text>

  <!-- X軸標籤 -->
  <text x="90" y="352" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">6am</text>
  <text x="166" y="352" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">8am</text>
  <text x="242" y="352" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">10am</text>
  <text x="318" y="352" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">12pm</text>
  <text x="394" y="352" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">2pm</text>
  <text x="470" y="352" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">4pm</text>
  <text x="510" y="352" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#94A3B8">6pm</text>

  <!-- 數據點座標 (x, y) 計算：
    6am: (90, 300) - 21°C
    8am: (166, 260) - 24°C
    10am: (242, 200) - 28°C
    12pm: (318, 140) - 31°C
    2pm: (394, 120) - 32°C
    4pm: (470, 180) - 26°C
    6pm: (510, 220) - 24°C
  -->

  <!-- 面積填充 -->
  <polygon points="90,300 90,335 510,335 510,220" fill="url(#areaGrad)" opacity="0.5"/>

  <!-- 折線 - 主線 -->
  <polyline points="90,300 166,260 242,200 318,140 394,120 470,180 510,220"
    fill="none" stroke="url(#lineGradUp)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 折線 - 發光效果 -->
  <polyline points="90,300 166,260 242,200 318,140 394,120 470,180 510,220"
    fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- 數據點光暈 -->
  <circle cx="90" cy="300" r="14" fill="url(#glowGrad1)"/>
  <circle cx="166" cy="260" r="14" fill="url(#glowGrad1)"/>
  <circle cx="242" cy="200" r="14" fill="url(#glowGrad2)"/>
  <circle cx="318" cy="140" r="14" fill="url(#glowGrad2)"/>
  <circle cx="394" cy="120" r="16" fill="url(#glowGrad3)"/>
  <circle cx="470" cy="180" r="14" fill="url(#glowGrad2)"/>
  <circle cx="510" cy="220" r="14" fill="url(#glowGrad1)"/>

  <!-- 數據點 - 外圈 -->
  <circle cx="90" cy="300" r="7" fill="url(#pointGrad1)" stroke="#FFFFFF" stroke-width="2" filter="url(#pointShadow)"/>
  <circle cx="166" cy="260" r="7" fill="url(#pointGrad1)" stroke="#FFFFFF" stroke-width="2" filter="url(#pointShadow)"/>
  <circle cx="242" cy="200" r="7" fill="url(#pointGrad2)" stroke="#FFFFFF" stroke-width="2" filter="url(#pointShadow)"/>
  <circle cx="318" cy="140" r="7" fill="url(#pointGrad2)" stroke="#FFFFFF" stroke-width="2" filter="url(#pointShadow)"/>
  <circle cx="394" cy="120" r="8" fill="url(#pointGrad3)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#pointShadow)"/>
  <circle cx="470" cy="180" r="7" fill="url(#pointGrad4)" stroke="#FFFFFF" stroke-width="2" filter="url(#pointShadow)"/>
  <circle cx="510" cy="220" r="7" fill="url(#pointGrad5)" stroke="#FFFFFF" stroke-width="2" filter="url(#pointShadow)"/>

  <!-- 數據點標註 - 溫度值 -->
  <rect x="76" y="278" width="28" height="18" rx="4" fill="#1E293B" opacity="0.8"/>
  <text x="90" y="291" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">21°</text>

  <rect x="152" y="238" width="28" height="18" rx="4" fill="#1E293B" opacity="0.8"/>
  <text x="166" y="251" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">24°</text>

  <rect x="228" y="178" width="28" height="18" rx="4" fill="#1E293B" opacity="0.8"/>
  <text x="242" y="191" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">28°</text>

  <rect x="304" y="118" width="28" height="18" rx="4" fill="#1E293B" opacity="0.8"/>
  <text x="318" y="131" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">31°</text>

  <rect x="380" y="96" width="28" height="18" rx="4" fill="#DC2626" opacity="0.9"/>
  <text x="394" y="109" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">32°</text>

  <rect x="456" y="158" width="28" height="18" rx="4" fill="#1E293B" opacity="0.8"/>
  <text x="470" y="171" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">26°</text>

  <rect x="496" y="198" width="28" height="18" rx="4" fill="#1E293B" opacity="0.8"/>
  <text x="510" y="211" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">24°</text>

  <!-- 上升箭頭 -->
  <g filter="url(#arrowShadow)">
    <polygon points="128,275 138,255 148,275" fill="url(#arrowUpGrad)" stroke="#059669" stroke-width="0.5"/>
    <polygon points="128,275 138,255 148,275" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  </g>

  <g filter="url(#arrowShadow)">
    <polygon points="204,215 214,195 224,215" fill="url(#arrowUpGrad)" stroke="#059669" stroke-width="0.5"/>
    <polygon points="204,215 214,195 224,215" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  </g>

  <g filter="url(#arrowShadow)">
    <polygon points="280,155 290,135 300,155" fill="url(#arrowUpGrad)" stroke="#059669" stroke-width="0.5"/>
    <polygon points="280,155 290,135 300,155" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  </g>

  <g filter="url(#arrowShadow)">
    <polygon points="356,125 366,105 376,125" fill="url(#arrowUpGrad)" stroke="#059669" stroke-width="0.5"/>
    <polygon points="356,125 366,105 376,125" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- 下降箭頭 -->
  <g filter="url(#arrowShadow)">
    <polygon points="432,145 442,165 452,145" fill="url(#arrowDownGrad)" stroke="#DC2626" stroke-width="0.5"/>
    <polygon points="432,145 442,165 452,145" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  </g>

  <g filter="url(#arrowShadow)">
    <polygon points="490,195 500,215 510,195" fill="url(#arrowDownGrad)" stroke="#DC2626" stroke-width="0.5"/>
    <polygon points="490,195 500,215 510,195" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- 圖例 -->
  <rect x="290" y="362" width="10" height="10" rx="2" fill="#3B82F6"/>
  <text x="304" y="372" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#64748B">溫度</text>

  <rect x="350" y="362" width="10" height="10" rx="2" fill="#059669"/>
  <text x="364" y="372" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#64748B">上升</text>

  <rect x="410" y="362" width="10" height="10" rx="2" fill="#DC2626"/>
  <text x="424" y="372" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#64748B">下降</text>

  <!-- 最高溫標示 -->
  <text x="394" y="108" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="8" fill="#FFFFFF" font-weight="700">最高</text>

  <!-- 裝飾性小圖標 -->
  <text x="80" y="375" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#CBD5E1">📊 折線圖</text>
</svg>