<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="60%" stop-color="#FFE4B5"/>
      <stop offset="100%" stop-color="#FFD699"/>
    </radialGradient>

    <!-- 地板漸變 -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C99B"/>
      <stop offset="100%" stop-color="#D4A86A"/>
    </linearGradient>

    <!-- 貨架主體漸變 -->
    <linearGradient id="shelfGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B6B4A"/>
      <stop offset="30%" stop-color="#A07850"/>
      <stop offset="70%" stop-color="#9A7248"/>
      <stop offset="100%" stop-color="#7A5A3A"/>
    </linearGradient>

    <!-- 貨架層板漸變 -->
    <linearGradient id="shelfLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C49A6C"/>
      <stop offset="50%" stop-color="#B8895A"/>
      <stop offset="100%" stop-color="#A07848"/>
    </linearGradient>

    <!-- 購物車漸變 -->
    <linearGradient id="cartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="40%" stop-color="#D0D0D0"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>

    <!-- 購物車金屬光澤 -->
    <linearGradient id="cartMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="50%" stop-color="#C8C8C8"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>

    <!-- 收銀機主體 -->
    <linearGradient id="cashierGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90B8"/>
      <stop offset="40%" stop-color="#3A7AA0"/>
      <stop offset="100%" stop-color="#2A5A78"/>
    </linearGradient>

    <!-- 收銀機螢幕 -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="100%" stop-color="#4A9AB8"/>
    </linearGradient>

    <!-- 價格標籤漸變 -->
    <linearGradient id="priceTagGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E84545"/>
    </linearGradient>

    <!-- 放射陰影 -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- 商品顏色 -->
    <linearGradient id="product1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#E0643A"/>
    </linearGradient>
    <linearGradient id="product2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <linearGradient id="product3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
    <linearGradient id="product4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.25)"/>
      <feDropShadow dx="-1" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
    </filter>

    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.3)"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
    </filter>

    <!-- 圓角卡片裁剪 -->
    <clipPath id="roundedCard">
      <rect x="0" y="0" width="600" height="400" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- 主背景圓角卡片 -->
  <g clip-path="url(#roundedCard)">
    <rect x="0" y="0" width="600" height="400" fill="url(#bgGrad)"/>

    <!-- 地板 -->
    <rect x="0" y="280" width="600" height="120" fill="url(#floorGrad)"/>
    <line x1="0" y1="280" x2="600" y2="280" stroke="#C49A6C" stroke-width="2"/>

    <!-- 地板瓷磚紋理 -->
    <g opacity="0.15">
      <line x1="0" y1="310" x2="600" y2="310" stroke="#8B6B4A" stroke-width="0.5"/>
      <line x1="0" y1="340" x2="600" y2="340" stroke="#8B6B4A" stroke-width="0.5"/>
      <line x1="0" y1="370" x2="600" y2="370" stroke="#8B6B4A" stroke-width="0.5"/>
      <line x1="100" y1="280" x2="100" y2="400" stroke="#8B6B4A" stroke-width="0.5"/>
      <line x1="200" y1="280" x2="200" y2="400" stroke="#8B6B4A" stroke-width="0.5"/>
      <line x1="300" y1="280" x2="300" y2="400" stroke="#8B6B4A" stroke-width="0.5"/>
      <line x1="400" y1="280" x2="400" y2="400" stroke="#8B6B4A" stroke-width="0.5"/>
      <line x1="500" y1="280" x2="500" y2="400" stroke="#8B6B4A" stroke-width="0.5"/>
    </g>

    <!-- 背景牆壁裝飾 -->
    <rect x="0" y="0" width="600" height="280" fill="none"/>
    <rect x="20" y="20" width="560" height="260" rx="8" fill="rgba(255,255,255,0.15)"/>

    <!-- 牆上裝飾線 -->
    <line x1="30" y1="60" x2="570" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="30" y1="240" x2="570" y2="240" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- ============ 貨架 ============ -->
    <g filter="url(#glowShadow)">
      <!-- 貨架主體 -->
      <rect x="30" y="80" width="180" height="200" rx="4" fill="url(#shelfGrad)"/>

      <!-- 貨架層板 -->
      <rect x="30" y="130" width="180" height="6" rx="2" fill="url(#shelfLayer)"/>
      <rect x="30" y="180" width="180" height="6" rx="2" fill="url(#shelfLayer)"/>
      <rect x="30" y="230" width="180" height="6" rx="2" fill="url(#shelfLayer)"/>

      <!-- 貨架頂部裝飾 -->
      <rect x="25" y="75" width="190" height="10" rx="3" fill="#B8895A"/>

      <!-- 貨架商品 - 上層 -->
      <rect x="45" y="100" width="35" height="28" rx="4" fill="url(#product1)" filter="url(#softShadow)"/>
      <rect x="88" y="105" width="35" height="23" rx="4" fill="url(#product2)" filter="url(#softShadow)"/>
      <rect x="130" y="100" width="35" height="28" rx="4" fill="url(#product3)" filter="url(#softShadow)"/>
      <rect x="170" y="108" width="30" height="20" rx="3" fill="url(#product4)" filter="url(#softShadow)"/>

      <!-- 貨架商品 - 中層 -->
      <rect x="45" y="148" width="40" height="30" rx="5" fill="url(#product4)" filter="url(#softShadow)"/>
      <rect x="92" y="152" width="38" height="26" rx="4" fill="url(#product1)" filter="url(#softShadow)"/>
      <rect x="138" y="148" width="35" height="30" rx="5" fill="url(#product2)" filter="url(#softShadow)"/>
      <rect x="178" y="155" width="25" height="23" rx="3" fill="url(#product3)" filter="url(#softShadow)"/>

      <!-- 貨架商品 - 下層 -->
      <rect x="45" y="198" width="45" height="30" rx="5" fill="url(#product3)" filter="url(#softShadow)"/>
      <rect x="98" y="200" width="40" height="28" rx="4" fill="url(#product4)" filter="url(#softShadow)"/>
      <rect x="145" y="198" width="40" height="30" rx="5" fill="url(#product1)" filter="url(#softShadow)"/>

      <!-- 價格標籤 -->
      <g filter="url(#doubleShadow)">
        <rect x="50" y="132" width="28" height="14" rx="3" fill="url(#priceTagGrad)"/>
        <text x="64" y="142" font-size="7" fill="white" text-anchor="middle" font-weight="bold">$8</text>
      </g>
      <g filter="url(#doubleShadow)">
        <rect x="95" y="182" width="28" height="14" rx="3" fill="url(#priceTagGrad)"/>
        <text x="109" y="192" font-size="7" fill="white" text-anchor="middle" font-weight="bold">$5</text>
      </g>
      <g filter="url(#doubleShadow)">
        <rect x="50" y="232" width="28" height="14" rx="3" fill="url(#priceTagGrad)"/>
        <text x="64" y="242" font-size="7" fill="white" text-anchor="middle" font-weight="bold">$12</text>
      </g>
    </g>

    <!-- ============ 第二個貨架 ============ -->
    <g filter="url(#glowShadow)">
      <rect x="390" y="80" width="180" height="200" rx="4" fill="url(#shelfGrad)"/>
      <rect x="390" y="130" width="180" height="6" rx="2" fill="url(#shelfLayer)"/>
      <rect x="390" y="180" width="180" height="6" rx="2" fill="url(#shelfLayer)"/>
      <rect x="390" y="230" width="180" height="6" rx="2" fill="url(#shelfLayer)"/>
      <rect x="385" y="75" width="190" height="10" rx="3" fill="#B8895A"/>

      <!-- 商品 -->
      <rect x="405" y="100" width="35" height="28" rx="4" fill="url(#product2)" filter="url(#softShadow)"/>
      <rect x="448" y="105" width="35" height="23" rx="4" fill="url(#product4)" filter="url(#softShadow)"/>
      <rect x="490" y="100" width="35" height="28" rx="4" fill="url(#product1)" filter="url(#softShadow)"/>
      <rect x="530" y="108" width="30" height="20" rx="3" fill="url(#product3)" filter="url(#softShadow)"/>

      <rect x="405" y="148" width="40" height="30" rx="5" fill="url(#product3)" filter="url(#softShadow)"/>
      <rect x="452" y="152" width="38" height="26" rx="4" fill="url(#product2)" filter="url(#softShadow)"/>
      <rect x="498" y="148" width="35" height="30" rx="5" fill="url(#product4)" filter="url(#softShadow)"/>
      <rect x="538" y="155" width="25" height="23" rx="3" fill="url(#product1)" filter="url(#softShadow)"/>

      <rect x="405" y="198" width="45" height="30" rx="5" fill="url(#product1)" filter="url(#softShadow)"/>
      <rect x="458" y="200" width="40" height="28" rx="4" fill="url(#product3)" filter="url(#softShadow)"/>
      <rect x="505" y="198" width="40" height="30" rx="5" fill="url(#product2)" filter="url(#softShadow)"/>

      <!-- 價格標籤 -->
      <g filter="url(#doubleShadow)">
        <rect x="410" y="132" width="28" height="14" rx="3" fill="url(#priceTagGrad)"/>
        <text x="424" y="142" font-size="7" fill="white" text-anchor="middle" font-weight="bold">$10</text>
      </g>
      <g filter="url(#doubleShadow)">
        <rect x="455" y="182" width="28" height="14" rx="3" fill="url(#priceTagGrad)"/>
        <text x="469" y="192" font-size="7" fill="white" text-anchor="middle" font-weight="bold">$7</text>
      </g>
      <g filter="url(#doubleShadow)">
        <rect x="410" y="232" width="28" height="14" rx="3" fill="url(#priceTagGrad)"/>
        <text x="424" y="242" font-size="7" fill="white" text-anchor="middle" font-weight="bold">$15</text>
      </g>
    </g>

    <!-- ============ 購物車 ============ -->
    <g filter="url(#glowShadow)">
      <!-- 購物車陰影 -->
      <ellipse cx="290" cy="370" rx="55" ry="10" fill="rgba(0,0,0,0.2)"/>

      <!-- 購物車輪子 -->
      <circle cx="260" cy="365" r="8" fill="#555" stroke="#333" stroke-width="1.5"/>
      <circle cx="260" cy="365" r="3" fill="#888"/>
      <circle cx="320" cy="365" r="8" fill="#555" stroke="#333" stroke-width="1.5"/>
      <circle cx="320" cy="365" r="3" fill="#888"/>

      <!-- 購物車籃子主體 -->
      <path d="M240 280 L250 360 L330 360 L340 280 Z" fill="url(#cartGrad)" stroke="#999" stroke-width="1.5"/>

      <!-- 購物車籃子內部 -->
      <path d="M245 285 L252 355 L328 355 L335 285 Z" fill="rgba(255,255,255,0.15)"/>

      <!-- 購物車金屬網格紋理 -->
      <g stroke="#B0B0B0" stroke-width="0.8" opacity="0.5">
        <line x1="245" y1="300" x2="335" y2="300"/>
        <line x1="247" y1="320" x2="333" y2="320"/>
        <line x1="249" y1="340" x2="331" y2="340"/>
        <line x1="260" y1="280" x2="262" y2="360"/>
        <line x1="280" y1="280" x2="280" y2="360"/>
        <line x1="300" y1="280" x2="300" y2="360"/>
        <line x1="320" y1="280" x2="318" y2="360"/>
      </g>

      <!-- 購物車把手 -->
      <path d="M238 280 Q238 260 250 255 L330 255 Q342 260 342 280" fill="none" stroke="url(#cartMetal)" stroke-width="5" stroke-linecap="round"/>
      <path d="M238 280 Q238 260 250 255 L330 255 Q342 260 342 280" fill="none" stroke="#D0D0D0" stroke-width="3" stroke-linecap="round"/>

      <!-- 購物車內商品 -->
      <rect x="260" y="290" width="20" height="25" rx="3" fill="url(#product1)" filter="url(#softShadow)"/>
      <rect x="285" y="295" width="18" height="20" rx="3" fill="url(#product2)" filter="url(#softShadow)"/>
      <rect x="308" y="292" width="16" height="23" rx="3" fill="url(#product4)" filter="url(#softShadow)"/>

      <!-- 購物車高光 -->
      <path d="M245 285 L248 350" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none"/>
    </g>

    <!-- ============ 收銀機 ============ -->
    <g filter="url(#glowShadow)">
      <!-- 收銀機陰影 -->
      <ellipse cx="290" cy="370" rx="45" ry="8" fill="rgba(0,0,0,0.15)"/>

      <!-- 收銀機底座 -->
      <rect x="255" y="320" width="70" height="45" rx="5" fill="url(#cashierGrad)"/>

      <!-- 收銀機抽屜 -->
      <rect x="260" y="340" width="60" height="20" rx="3" fill="#3A6A88"/>
      <rect x="275" y="345" width="30" height="10" rx="2" fill="#5A8AA8"/>
      <circle cx="290" cy="350" r="2" fill="#FFD700"/>

      <!-- 收銀機主體 -->
      <rect x="258" y="280" width="64" height="45" rx="4" fill="url(#cashierGrad)"/>

      <!-- 收銀機螢幕 -->
      <rect x="263" y="285" width="54" height="25" rx="3" fill="url(#screenGrad)"/>
      <text x="290" y="300" font-size="8" fill="white" text-anchor="middle" font-weight="bold">$ 128.50</text>

      <!-- 收銀機按鈕 -->
      <circle cx="270" cy="316" r="3" fill="#FF6B6B"/>
      <circle cx="280" cy="316" r="3" fill="#81C784"/>
      <circle cx="290" cy="316" r="3" fill="#64B5F6"/>
      <circle cx="300" cy="316" r="3" fill="#FFD54F"/>
      <circle cx="310" cy="316" r="3" fill="#CE93D8"/>

      <!-- 收銀機頂部裝飾 -->
      <rect x="260" y="275" width="60" height="8" rx="3" fill="#5A9AB8"/>

      <!-- 收銀機高光 -->
      <rect x="260" y="282" width="15" height="40" rx="2" fill="rgba(255,255,255,0.1)"/>
    </g>

    <!-- ============ 中間價格促銷標籤 ============ -->
    <g filter="url(#doubleShadow)">
      <rect x="225" y="100" width="130" height="35" rx="8" fill="#FF6B6B"/>
      <rect x="227" y="102" width="126" height="31" rx="7" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="290" y="118" font-size="11" fill="white" text-anchor="middle" font-weight="bold">🔥 限時特價</text>
      <text x="290" y="130" font-size="8" fill="rgba(255,255,255,0.9)" text-anchor="middle">全場8折</text>
    </g>

    <!-- ============ 裝飾元素 ============ -->

    <!-- 天花板燈光 -->
    <ellipse cx="290" cy="15" rx="80" ry="12" fill="rgba(255,255,200,0.3)"/>
    <rect x="270" y="0" width="40" height="15" rx="3" fill="#DDD"/>
    <rect x="275" y="2" width="30" height="5" rx="2" fill="#FFE082"/>

    <!-- 燈光光暈 -->
    <ellipse cx="290" cy="30" rx="100" ry="20" fill="rgba(255,255,200,0.08)"/>

    <!-- 購物籃（地上） -->
    <g filter="url(#softShadow)">
      <path d="M140 340 L145 365 L175 365 L180 340 Z" fill="#C49A6C" stroke="#A07848" stroke-width="1"/>
      <path d="M138 340 Q138 335 145 332 L175 332 Q182 335 182 340" fill="#D4AA7C" stroke="#A07848" stroke-width="1"/>
      <!-- 購物籃把手 -->
      <path d="M145 332 Q160 320 175 332" fill="none" stroke="#A07848" stroke-width="2"/>
    </g>

    <!-- 地上散落的商品 -->
    <g filter="url(#softShadow)">
      <rect x="195" y="350" width="15" height="12" rx="2" fill="url(#product4)"/>
      <rect x="350" y="355" width="12" height="10" rx="2" fill="url(#product1)"/>
    </g>

    <!-- 牆上海報 -->
    <g filter="url(#doubleShadow)">
      <rect x="230" y="40" width="120" height="45" rx="5" fill="#FFF8E1"/>
      <rect x="233" y="43" width="114" height="39" rx="4" fill="none" stroke="#FFD54F" stroke-width="1.5"/>
      <text x="290" y="58" font-size="9" fill="#E65100" text-anchor="middle" font-weight="bold">本週精選</text>
      <text x="290" y="72" font-size="7" fill="#BF360C" text-anchor="middle">新鮮蔬果 健康生活</text>
    </g>

    <!-- 笑臉裝飾 -->
    <g transform="translate(545, 55)">
      <circle cx="0" cy="0" r="12" fill="#FFD54F" filter="url(#softShadow)"/>
      <circle cx="-4" cy="-3" r="2" fill="#333"/>
      <circle cx="4" cy="-3" r="2" fill="#333"/>
      <path d="M-5 3 Q0 8 5 3" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- 標題文字 -->
    <text x="290" y="395" font-size="10" fill="#8B6B4A" text-anchor="middle" font-weight="bold" opacity="0.6">🛒 香港超市 · 數學購物樂</text>
  </g>
</svg>