<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F2F5"/>
    </radialGradient>

    <!-- 梯形主體漸變（上底→下底） -->
    <linearGradient id="trapGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="40%" stop-color="#5BA0E8"/>
      <stop offset="100%" stop-color="#2D6FB0"/>
    </linearGradient>

    <!-- 梯形主體漸變2（複製旋轉後） -->
    <linearGradient id="trapGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8734A"/>
      <stop offset="40%" stop-color="#F0845A"/>
      <stop offset="100%" stop-color="#CC5A2D"/>
    </linearGradient>

    <!-- 平行四邊形漸變 -->
    <linearGradient id="paraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BBF59"/>
      <stop offset="50%" stop-color="#7DD06A"/>
      <stop offset="100%" stop-color="#4A9F38"/>
    </linearGradient>

    <!-- 3D 光影放射漸變（梯形1） -->
    <radialGradient id="shine1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </radialGradient>

    <!-- 3D 光影放射漸變（梯形2） -->
    <radialGradient id="shine2" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.40)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
    </radialGradient>

    <!-- 3D 光影放射漸變（平行四邊形） -->
    <radialGradient id="shine3" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.40)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.12)"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="shadowLayer" x="-5%" y="-5%" width="115%" height="120%">
      <!-- 第一層陰影（深色外擴） -->
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.20)"/>
      <!-- 第二層陰影（淺色柔和） -->
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.10)"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-3%" y="-3%" width="108%" height="112%">
      <feDropShadow dx="1" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.12)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.06)"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#4A90D9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#6BBF59"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#E8734A"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC" rx="0"/>
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- ============ 第一區：原始梯形（左上） ============ -->
  <g filter="url(#cardShadow)">
    <!-- 圓角卡片背景 -->
    <rect x="15" y="15" width="175" height="170" rx="12" fill="white" opacity="0.85"/>
    <rect x="15" y="15" width="175" height="170" rx="12" fill="none" stroke="#E0E4E8" stroke-width="1"/>
  </g>

  <!-- 標籤 -->
  <text x="102" y="40" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#333">① 梯形</text>

  <!-- 梯形（上底40，下底80，高60） -->
  <g filter="url(#shadowLayer)">
    <polygon points="50,70 150,70 180,130 20,130" fill="url(#trapGrad1)"/>
    <polygon points="50,70 150,70 180,130 20,130" fill="url(#shine1)"/>
    <polygon points="50,70 150,70 180,130 20,130" fill="none" stroke="#2D6FB0" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- 標註：上底 -->
  <line x1="50" y1="65" x2="150" y2="65" stroke="#4A90D9" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="100" y="60" text-anchor="middle" font-family="'Times New Roman',serif" font-size="12" fill="#4A90D9" font-weight="bold">上底</text>

  <!-- 標註：下底 -->
  <line x1="20" y1="138" x2="180" y2="138" stroke="#4A90D9" stroke-width="1.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="100" y="153" text-anchor="middle" font-family="'Times New Roman',serif" font-size="12" fill="#4A90D9" font-weight="bold">下底</text>

  <!-- 標註：高 -->
  <line x1="185" y1="70" x2="185" y2="130" stroke="#E8734A" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="198" y="103" text-anchor="middle" font-family="'Times New Roman',serif" font-size="12" fill="#E8734A" font-weight="bold">高</text>

  <!-- ============ 第二區：複製旋轉（右上） ============ -->
  <g filter="url(#cardShadow)">
    <rect x="210" y="15" width="175" height="170" rx="12" fill="white" opacity="0.85"/>
    <rect x="210" y="15" width="175" height="170" rx="12" fill="none" stroke="#E0E4E8" stroke-width="1"/>
  </g>

  <text x="297" y="40" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#333">② 複製＋旋轉</text>

  <!-- 原始梯形（半透明） -->
  <polygon points="245,70 345,70 375,130 215,130" fill="url(#trapGrad1)" opacity="0.35"/>
  <polygon points="245,70 345,70 375,130 215,130" fill="none" stroke="#2D6FB0" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- 旋轉複製的梯形（180度翻轉，拼合） -->
  <g filter="url(#shadowLayer)">
    <polygon points="245,130 345,130 375,70 215,70" fill="url(#trapGrad2)"/>
    <polygon points="245,130 345,130 375,70 215,70" fill="url(#shine2)"/>
    <polygon points="245,130 345,130 375,70 215,70" fill="none" stroke="#CC5A2D" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- 旋轉箭頭 -->
  <path d="M380,60 Q400,60 400,80 Q400,95 390,100" fill="none" stroke="#E8734A" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="408" y="78" font-family="'Times New Roman',serif" font-size="11" fill="#E8734A" font-weight="bold">旋轉</text>

  <!-- ============ 第三區：平行四邊形（左下） ============ -->
  <g filter="url(#cardShadow)">
    <rect x="15" y="205" width="270" height="170" rx="12" fill="white" opacity="0.85"/>
    <rect x="15" y="205" width="270" height="170" rx="12" fill="none" stroke="#E0E4E8" stroke-width="1"/>
  </g>

  <text x="150" y="230" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#333">③ 拼成平行四邊形</text>

  <!-- 平行四邊形（由兩個梯形拼成） -->
  <g filter="url(#shadowLayer)">
    <polygon points="40,260 230,260 280,330 90,330" fill="url(#paraGrad)"/>
    <polygon points="40,260 230,260 280,330 90,330" fill="url(#shine3)"/>
    <polygon points="40,260 230,260 280,330 90,330" fill="none" stroke="#4A9F38" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- 顯示拼合線 -->
  <line x1="160" y1="260" x2="160" y2="330" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 標註：底 -->
  <line x1="40" y1="338" x2="280" y2="338" stroke="#6BBF59" stroke-width="1.8" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <text x="160" y="353" text-anchor="middle" font-family="'Times New Roman',serif" font-size="13" fill="#4A9F38" font-weight="bold">底 = 上底 + 下底</text>

  <!-- 標註：高 -->
  <line x1="285" y1="260" x2="285" y2="330" stroke="#E8734A" stroke-width="1.5" stroke-dasharray="4,3" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="298" y="298" text-anchor="middle" font-family="'Times New Roman',serif" font-size="12" fill="#E8734A" font-weight="bold">高</text>

  <!-- ============ 第四區：公式推導（右下） ============ -->
  <g filter="url(#cardShadow)">
    <rect x="305" y="205" width="275" height="170" rx="12" fill="white" opacity="0.9"/>
    <rect x="305" y="205" width="275" height="170" rx="12" fill="none" stroke="#E0E4E8" stroke-width="1"/>
  </g>

  <text x="442" y="230" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="700" fill="#333">④ 公式推導</text>

  <!-- 推導步驟 -->
  <text x="320" y="258" font-family="'Times New Roman',serif" font-size="14" fill="#555">平行四邊形面積</text>
  <text x="320" y="280" font-family="'Times New Roman',serif" font-size="14" fill="#4A9F38" font-weight="bold">= 底 × 高</text>
  <text x="320" y="302" font-family="'Times New Roman',serif" font-size="14" fill="#4A9F38" font-weight="bold">= (上底 + 下底) × 高</text>

  <line x1="320" y1="312" x2="560" y2="312" stroke="#DDD" stroke-width="1"/>

  <text x="320" y="332" font-family="'Times New Roman',serif" font-size="14" fill="#555">梯形面積</text>
  <text x="320" y="354" font-family="'Times New Roman',serif" font-size="16" fill="#E8734A" font-weight="bold">= (上底 + 下底) × 高 ÷ 2</text>

  <!-- 連接箭頭（區塊之間） -->
  <!-- ①→② -->
  <path d="M190,100 L210,100" stroke="#999" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <!-- ②→③ -->
  <path d="M297,185 L297,205" stroke="#999" stroke-width="1.8" marker-end="url(#arrowGray)"/>
  <!-- ③→④ -->
  <path d="M285,295 L305,295" stroke="#999" stroke-width="1.8" marker-end="url(#arrowGray)"/>

  <!-- 裝飾小圖標：÷2 -->
  <circle cx="540" cy="348" r="14" fill="#E8734A" opacity="0.15"/>
  <text x="540" y="353" text-anchor="middle" font-family="'Times New Roman',serif" font-size="16" fill="#E8734A" font-weight="bold">÷2</text>

  <!-- 標題 -->
  <text x="300" y="8" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="0" fill="transparent">梯形面積推導</text>
</svg>