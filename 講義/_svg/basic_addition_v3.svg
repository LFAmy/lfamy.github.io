<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </radialGradient>

    <!-- 主卡片漸變 - 3D光影效果 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F0F7FF"/>
      <stop offset="70%" stop-color="#E8F0FE"/>
      <stop offset="100%" stop-color="#DCE8FA"/>
    </linearGradient>

    <!-- 卡片邊框漸變 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B0C4DE"/>
      <stop offset="50%" stop-color="#8AB4F8"/>
      <stop offset="100%" stop-color="#669DF6"/>
    </linearGradient>

    <!-- 數字圓圈漸變 - 8 -->
    <radialGradient id="circle8" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF7B89"/>
      <stop offset="40%" stop-color="#FF5A6E"/>
      <stop offset="100%" stop-color="#D9384E"/>
    </radialGradient>

    <!-- 數字圓圈漸變 - 5 -->
    <radialGradient id="circle5" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7BC67E"/>
      <stop offset="40%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>

    <!-- 數字圓圈漸變 - 2 -->
    <radialGradient id="circle2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="40%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>

    <!-- 數字圓圈漸變 - 3 -->
    <radialGradient id="circle3" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="40%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </radialGradient>

    <!-- 數字圓圈漸變 - 13 -->
    <radialGradient id="circle13" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#CE93D8"/>
      <stop offset="40%" stop-color="#9C27B0"/>
      <stop offset="100%" stop-color="#6A1B9A"/>
    </radialGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A237E" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1A237E" flood-opacity="0.08"/>
    </filter>

    <filter id="circleShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <filter id="smallCircleShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>

    <!-- 數線箭頭 -->
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E91E63"/>
    </marker>

    <marker id="arrowHeadBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196F3"/>
    </marker>

    <!-- 跳躍弧線漸變 -->
    <linearGradient id="jumpGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>

    <linearGradient id="jumpGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <linearGradient id="jumpGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>

    <!-- 放射光暈 -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 裝飾性放射光暈 -->
  <circle cx="300" cy="200" r="180" fill="url(#glowGrad)" opacity="0.4"/>

  <!-- 主卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="20" ry="20" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- 標題 -->
  <text x="300" y="52" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" letter-spacing="2">
    🧮 加法湊十法 — 數線跳躍
  </text>

  <!-- 裝飾線 -->
  <line x1="80" y1="65" x2="520" y2="65" stroke="#C5CAE9" stroke-width="1" opacity="0.6"/>

  <!-- ===== 算式區域 ===== -->
  <!-- 8 + 5 = 8 + 2 + 3 = 13 -->
  <g transform="translate(0, 85)">
    <!-- 8 -->
    <circle cx="80" cy="30" r="22" fill="url(#circle8)" filter="url(#circleShadow)"/>
    <text x="80" y="36" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">8</text>

    <!-- + -->
    <text x="115" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#5C6BC0">+</text>

    <!-- 5 -->
    <circle cx="150" cy="30" r="22" fill="url(#circle5)" filter="url(#circleShadow)"/>
    <text x="150" y="36" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">5</text>

    <!-- = -->
    <text x="188" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#5C6BC0">=</text>

    <!-- 8 -->
    <circle cx="225" cy="30" r="22" fill="url(#circle8)" filter="url(#circleShadow)"/>
    <text x="225" y="36" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">8</text>

    <!-- + -->
    <text x="260" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#5C6BC0">+</text>

    <!-- 2 -->
    <circle cx="295" cy="30" r="22" fill="url(#circle2)" filter="url(#circleShadow)"/>
    <text x="295" y="36" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">2</text>

    <!-- + -->
    <text x="330" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#5C6BC0">+</text>

    <!-- 3 -->
    <circle cx="365" cy="30" r="22" fill="url(#circle3)" filter="url(#circleShadow)"/>
    <text x="365" y="36" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">3</text>

    <!-- = -->
    <text x="403" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="22" font-weight="bold" fill="#5C6BC0">=</text>

    <!-- 13 -->
    <circle cx="445" cy="30" r="24" fill="url(#circle13)" filter="url(#circleShadow)"/>
    <text x="445" y="37" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">13</text>
  </g>

  <!-- ===== 數線區域 ===== -->
  <g transform="translate(0, 155)">
    <!-- 數線背景 -->
    <rect x="50" y="40" width="500" height="90" rx="12" fill="#FFFFFF" fill-opacity="0.6" stroke="#E8EAF6" stroke-width="1"/>

    <!-- 數線主線 -->
    <line x1="70" y1="85" x2="530" y2="85" stroke="#7986CB" stroke-width="3" stroke-linecap="round"/>

    <!-- 刻度標記 -->
    <!-- 0 -->
    <line x1="70" y1="75" x2="70" y2="95" stroke="#7986CB" stroke-width="2"/>
    <text x="70" y="115" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#5C6BC0">0</text>

    <!-- 2 -->
    <line x1="130" y1="75" x2="130" y2="95" stroke="#7986CB" stroke-width="2"/>
    <text x="130" y="115" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#5C6BC0">2</text>

    <!-- 4 -->
    <line x1="190" y1="75" x2="190" y2="95" stroke="#7986CB" stroke-width="2"/>
    <text x="190" y="115" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#5C6BC0">4</text>

    <!-- 6 -->
    <line x1="250" y1="75" x2="250" y2="95" stroke="#7986CB" stroke-width="2"/>
    <text x="250" y="115" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#5C6BC0">6</text>

    <!-- 8 - 起點 -->
    <line x1="310" y1="70" x2="310" y2="95" stroke="#E91E63" stroke-width="3"/>
    <text x="310" y="118" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="16" font-weight="bold" fill="#E91E63">8</text>

    <!-- 10 -->
    <line x1="370" y1="75" x2="370" y2="95" stroke="#7986CB" stroke-width="2"/>
    <text x="370" y="115" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#5C6BC0">10</text>

    <!-- 12 -->
    <line x1="430" y1="75" x2="430" y2="95" stroke="#7986CB" stroke-width="2"/>
    <text x="430" y="115" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#5C6BC0">12</text>

    <!-- 13 - 終點 -->
    <line x1="460" y1="70" x2="460" y2="95" stroke="#9C27B0" stroke-width="3"/>
    <text x="460" y="118" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="16" font-weight="bold" fill="#9C27B0">13</text>

    <!-- 14 -->
    <line x1="490" y1="75" x2="490" y2="95" stroke="#7986CB" stroke-width="2"/>
    <text x="490" y="115" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" fill="#5C6BC0">14</text>

    <!-- 跳躍弧線 1: 8→10 (跳2) -->
    <path d="M 310 78 Q 340 45 370 78" fill="none" stroke="url(#jumpGrad1)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHead)"/>
    <text x="340" y="52" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#E91E63">+2</text>

    <!-- 跳躍弧線 2: 10→13 (跳3) -->
    <path d="M 370 78 Q 415 35 460 78" fill="none" stroke="url(#jumpGrad3)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHeadBlue)"/>
    <text x="415" y="42" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#4CAF50">+3</text>

    <!-- 起點標記 -->
    <circle cx="310" cy="85" r="6" fill="#E91E63" filter="url(#smallCircleShadow)"/>
    <!-- 終點標記 -->
    <circle cx="460" cy="85" r="6" fill="#9C27B0" filter="url(#smallCircleShadow)"/>

    <!-- 中間點 10 -->
    <circle cx="370" cy="85" r="5" fill="#2196F3" filter="url(#smallCircleShadow)"/>

    <!-- 湊十說明 -->
    <g transform="translate(0, 0)">
      <!-- 先湊十 -->
      <rect x="55" y="5" width="130" height="28" rx="14" fill="#E91E63" fill-opacity="0.12"/>
      <text x="120" y="24" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="13" font-weight="bold" fill="#E91E63">
        ① 先湊十
      </text>

      <!-- 再計算 -->
      <rect x="195" y="5" width="130" height="28" rx="14" fill="#4CAF50" fill-opacity="0.12"/>
      <text x="260" y="24" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="13" font-weight="bold" fill="#4CAF50">
        ② 再加 3
      </text>
    </g>
  </g>

  <!-- ===== 底部視覺提示 ===== -->
  <g transform="translate(0, 340)">
    <!-- 8 + 2 = 10 提示 -->
    <rect x="100" y="0" width="120" height="26" rx="13" fill="#FFEBEE"/>
    <text x="160" y="18" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="12" font-weight="bold" fill="#D32F2F">
      8 + 2 = 10
    </text>

    <!-- 10 + 3 = 13 提示 -->
    <rect x="260" y="0" width="120" height="26" rx="13" fill="#E8F5E9"/>
    <text x="320" y="18" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
      10 + 3 = 13
    </text>

    <!-- 裝飾小圖標 -->
    <text x="480" y="18" text-anchor="middle" font-size="16" opacity="0.5">✨</text>
  </g>
</svg>