<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0e6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe6f0;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8f4ff;stop-opacity:0.95" />
    </linearGradient>

    <!-- 長條漸變 - 藍色 -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8ab4ff;stop-opacity:1" />
    </linearGradient>

    <!-- 長條漸變 - 綠色 -->
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0d8b4a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81c995;stop-opacity:1" />
    </linearGradient>

    <!-- 長條漸變 - 橙色 -->
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#e8710a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f9ab00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdd663;stop-opacity:1" />
    </linearGradient>

    <!-- 長條漸變 - 紫色 -->
    <linearGradient id="barGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#7c1fa0;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>

    <!-- 長條漸變 - 紅色 -->
    <linearGradient id="barGrad5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#c5221f;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ea4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f28b82;stop-opacity:1" />
    </linearGradient>

    <!-- 長條3D光影效果 - 放射漸變 -->
    <radialGradient id="barShine1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="barShine2" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="barShine3" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="barShine4" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="barShine5" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 平均線漸變 -->
    <linearGradient id="avgLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ee5a24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>

    <!-- 平均線光暈 -->
    <radialGradient id="avgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0" />
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="barShadow" x="-10%" y="-5%" width="130%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- 標題文字漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c1fa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8710a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" ry="20" fill="url(#bgGrad)" />

  <!-- 圓角卡片 -->
  <rect x="20" y="20" width="560" height="360" rx="16" ry="16" fill="url(#cardGrad)" filter="url(#cardShadow)" />

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)">📊 平均數 — 長條圖</text>

  <!-- 圖表區域 -->
  <g transform="translate(70, 80)">
    <!-- Y軸刻度線 -->
    <line x1="0" y1="0" x2="0" y2="240" stroke="#ccc" stroke-width="1.5" />
    <line x1="0" y1="240" x2="460" y2="240" stroke="#ccc" stroke-width="1.5" />

    <!-- Y軸刻度標籤 -->
    <text x="-10" y="245" text-anchor="end" font-family="Arial" font-size="11" fill="#888">0</text>
    <text x="-10" y="185" text-anchor="end" font-family="Arial" font-size="11" fill="#888">2</text>
    <line x1="-3" y1="185" x2="0" y2="185" stroke="#ccc" stroke-width="1" />
    <text x="-10" y="125" text-anchor="end" font-family="Arial" font-size="11" fill="#888">4</text>
    <line x1="-3" y1="125" x2="0" y2="125" stroke="#ccc" stroke-width="1" />
    <text x="-10" y="65" text-anchor="end" font-family="Arial" font-size="11" fill="#888">6</text>
    <line x1="-3" y1="65" x2="0" y2="65" stroke="#ccc" stroke-width="1" />
    <text x="-10" y="5" text-anchor="end" font-family="Arial" font-size="11" fill="#888">8</text>
    <line x1="-3" y1="5" x2="0" y2="5" stroke="#ccc" stroke-width="1" />

    <!-- 水平輔助線 -->
    <line x1="0" y1="185" x2="460" y2="185" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="4,4" />
    <line x1="0" y1="125" x2="460" y2="125" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="4,4" />
    <line x1="0" y1="65" x2="460" y2="65" stroke="#e0e0e0" stroke-width="0.8" stroke-dasharray="4,4" />

    <!-- 長條圖數據：小明 7, 小華 5, 小美 8, 小強 4, 小莉 6 -->
    <!-- 長條寬度60，間距30，起始x=15 -->

    <!-- 長條1：小明 7 (高度=7/8*240=210) -->
    <g filter="url(#barShadow)">
      <rect x="15" y="30" width="60" height="210" rx="6" ry="6" fill="url(#barGrad1)" />
      <rect x="15" y="30" width="60" height="210" rx="6" ry="6" fill="url(#barShine1)" />
    </g>
    <text x="45" y="260" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#333" font-weight="bold">小明</text>
    <text x="45" y="22" text-anchor="middle" font-family="Arial" font-size="14" fill="#1a73e8" font-weight="bold">7</text>

    <!-- 長條2：小華 5 (高度=5/8*240=150) -->
    <g filter="url(#barShadow)">
      <rect x="105" y="90" width="60" height="150" rx="6" ry="6" fill="url(#barGrad2)" />
      <rect x="105" y="90" width="60" height="150" rx="6" ry="6" fill="url(#barShine2)" />
    </g>
    <text x="135" y="260" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#333" font-weight="bold">小華</text>
    <text x="135" y="82" text-anchor="middle" font-family="Arial" font-size="14" fill="#0d8b4a" font-weight="bold">5</text>

    <!-- 長條3：小美 8 (高度=8/8*240=240) -->
    <g filter="url(#barShadow)">
      <rect x="195" y="0" width="60" height="240" rx="6" ry="6" fill="url(#barGrad3)" />
      <rect x="195" y="0" width="60" height="240" rx="6" ry="6" fill="url(#barShine3)" />
    </g>
    <text x="225" y="260" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#333" font-weight="bold">小美</text>
    <text x="225" y="-8" text-anchor="middle" font-family="Arial" font-size="14" fill="#e8710a" font-weight="bold">8</text>

    <!-- 長條4：小強 4 (高度=4/8*240=120) -->
    <g filter="url(#barShadow)">
      <rect x="285" y="120" width="60" height="120" rx="6" ry="6" fill="url(#barGrad4)" />
      <rect x="285" y="120" width="60" height="120" rx="6" ry="6" fill="url(#barShine4)" />
    </g>
    <text x="315" y="260" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#333" font-weight="bold">小強</text>
    <text x="315" y="112" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c1fa0" font-weight="bold">4</text>

    <!-- 長條5：小莉 6 (高度=6/8*240=180) -->
    <g filter="url(#barShadow)">
      <rect x="375" y="60" width="60" height="180" rx="6" ry="6" fill="url(#barGrad5)" />
      <rect x="375" y="60" width="60" height="180" rx="6" ry="6" fill="url(#barShine5)" />
    </g>
    <text x="405" y="260" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#333" font-weight="bold">小莉</text>
    <text x="405" y="52" text-anchor="middle" font-family="Arial" font-size="14" fill="#c5221f" font-weight="bold">6</text>

    <!-- 平均線：平均數 = (7+5+8+4+6)/5 = 30/5 = 6 -->
    <!-- 6/8*240 = 180 -->
    <line x1="0" y1="180" x2="460" y2="180" stroke="url(#avgLineGrad)" stroke-width="3" stroke-dasharray="8,4" stroke-linecap="round" />

    <!-- 平均線光暈 -->
    <ellipse cx="230" cy="180" rx="230" ry="8" fill="url(#avgGlow)" />

    <!-- 平均數標籤 -->
    <rect x="380" y="170" width="75" height="24" rx="12" ry="12" fill="#ee5a24" opacity="0.9" />
    <text x="417" y="187" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold">平均 = 6</text>
  </g>

  <!-- 底部說明 -->
  <text x="300" y="375" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#999">
    平均數 = (7 + 5 + 8 + 4 + 6) ÷ 5 = 6
  </text>
</svg>