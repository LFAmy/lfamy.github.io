<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d1ecf1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4e3ed;stop-opacity:1" />
    </linearGradient>

    <!-- 容器主體漸變（3D圓柱效果） -->
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5a7a8a;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#7a9aaa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8aacbe;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#6a8a9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a6a7a;stop-opacity:1" />
    </linearGradient>

    <!-- 容器內部漸變 -->
    <linearGradient id="containerInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d0e4ed;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#eaf4f9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#b8d4e0;stop-opacity:0.6" />
    </linearGradient>

    <!-- 水位漸變（多層藍色） -->
    <linearGradient id="waterGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.7" />
      <stop offset="40%" style="stop-color:#29b6f6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="waterGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81d4fa;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#4fc3f7;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#039be5;stop-opacity:0.7" />
    </linearGradient>

    <linearGradient id="waterGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b3e5fc;stop-opacity:0.5" />
      <stop offset="60%" style="stop-color:#81d4fa;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#29b6f6;stop-opacity:0.6" />
    </linearGradient>

    <!-- 水面光澤 -->
    <radialGradient id="waterShine" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 3D光影效果 -->
    <radialGradient id="lightEffect" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 陰影 -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#2c3e50" flood-opacity="0.3"/>
    </filter>

    <filter id="innerShadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1a2a3a" flood-opacity="0.2"/>
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="#2c3e50" flood-opacity="0.25"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.3"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 物體漸變 -->
    <linearGradient id="objectGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8a65;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff7043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e64a19;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="objectGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ab47bc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8e24aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a1b9a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="objectGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#43a047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>

    <!-- 箭頭漸變 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>

    <!-- 水位線波紋 -->
    <filter id="ripple">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="600" height="400" rx="20" ry="20" fill="url(#bgGrad)"/>

  <!-- 裝飾性背景圓點 -->
  <circle cx="50" cy="50" r="30" fill="#ffffff" opacity="0.1"/>
  <circle cx="550" cy="60" r="40" fill="#ffffff" opacity="0.08"/>
  <circle cx="520" cy="350" r="25" fill="#ffffff" opacity="0.12"/>
  <circle cx="80" cy="360" r="20" fill="#ffffff" opacity="0.1"/>

  <!-- 標題卡片 -->
  <rect x="150" y="12" width="300" height="38" rx="19" ry="19" fill="#ffffff" opacity="0.85" filter="url(#cardShadow)"/>
  <text x="300" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">📐 排水法應用 — 水位變化</text>

  <!-- ============ 容器1：放入物體 ============ -->
  <g transform="translate(40, 65)">
    <!-- 容器陰影 -->
    <ellipse cx="85" cy="225" rx="95" ry="12" fill="#1a2a3a" opacity="0.15"/>

    <!-- 容器主體（圓柱） -->
    <rect x="10" y="50" width="150" height="170" rx="8" ry="8" fill="url(#containerGrad)" filter="url(#shadowFilter)"/>

    <!-- 容器內部 -->
    <rect x="18" y="58" width="134" height="154" rx="5" ry="5" fill="url(#containerInner)"/>

    <!-- 水位1（放入後水位上升） -->
    <rect x="18" y="100" width="134" height="112" rx="0" ry="0" fill="url(#waterGrad1)" opacity="0.85"/>
    <!-- 水面光澤 -->
    <rect x="18" y="100" width="134" height="15" rx="0" ry="0" fill="url(#waterShine)" opacity="0.6"/>

    <!-- 物體1（橙色石頭） -->
    <ellipse cx="85" cy="155" rx="28" ry="22" fill="url(#objectGrad1)" filter="url(#innerShadow)"/>
    <ellipse cx="78" cy="148" rx="12" ry="8" fill="#ffffff" opacity="0.2"/>

    <!-- 容器頂部邊緣 -->
    <ellipse cx="85" cy="50" rx="75" ry="10" fill="#8aacbe" stroke="#6a8a9a" stroke-width="1.5"/>
    <ellipse cx="85" cy="50" rx="75" ry="10" fill="url(#lightEffect)" opacity="0.3"/>

    <!-- 容器底部邊緣 -->
    <ellipse cx="85" cy="220" rx="75" ry="10" fill="#4a6a7a" opacity="0.5"/>

    <!-- 水位標記線 -->
    <line x1="18" y1="100" x2="152" y2="100" stroke="#ffeb3b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
    <line x1="18" y1="170" x2="152" y2="170" stroke="#ffeb3b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- 標籤 -->
    <text x="85" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">① 放入物體</text>
    <text x="85" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">水位上升</text>

    <!-- 水位高度標示 -->
    <text x="160" y="104" font-family="Arial, sans-serif" font-size="9" fill="#0288d1" font-weight="bold">h₁</text>
  </g>

  <!-- 箭頭1→2 -->
  <g transform="translate(190, 155)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#arrowHead)"/>
    <text x="20" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">取出</text>
  </g>

  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- ============ 容器2：取出物體 ============ -->
  <g transform="translate(230, 65)">
    <!-- 容器陰影 -->
    <ellipse cx="85" cy="225" rx="95" ry="12" fill="#1a2a3a" opacity="0.15"/>

    <!-- 容器主體 -->
    <rect x="10" y="50" width="150" height="170" rx="8" ry="8" fill="url(#containerGrad)" filter="url(#shadowFilter)"/>

    <!-- 容器內部 -->
    <rect x="18" y="58" width="134" height="154" rx="5" ry="5" fill="url(#containerInner)"/>

    <!-- 水位2（取出後水位下降） -->
    <rect x="18" y="140" width="134" height="72" rx="0" ry="0" fill="url(#waterGrad2)" opacity="0.75"/>
    <!-- 水面光澤 -->
    <rect x="18" y="140" width="134" height="12" rx="0" ry="0" fill="url(#waterShine)" opacity="0.5"/>

    <!-- 容器頂部邊緣 -->
    <ellipse cx="85" cy="50" rx="75" ry="10" fill="#8aacbe" stroke="#6a8a9a" stroke-width="1.5"/>
    <ellipse cx="85" cy="50" rx="75" ry="10" fill="url(#lightEffect)" opacity="0.3"/>

    <!-- 容器底部邊緣 -->
    <ellipse cx="85" cy="220" rx="75" ry="10" fill="#4a6a7a" opacity="0.5"/>

    <!-- 水位標記線 -->
    <line x1="18" y1="140" x2="152" y2="140" stroke="#ffeb3b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
    <line x1="18" y1="100" x2="152" y2="100" stroke="#ffeb3b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- 標籤 -->
    <text x="85" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">② 取出物體</text>
    <text x="85" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">水位下降</text>

    <!-- 水位高度標示 -->
    <text x="160" y="144" font-family="Arial, sans-serif" font-size="9" fill="#039be5" font-weight="bold">h₂</text>
  </g>

  <!-- 箭頭2→3 -->
  <g transform="translate(380, 155)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2ecc71" stroke-width="2.5"/>
    <polygon points="40,-4 48,0 40,4" fill="#2ecc71"/>
    <text x="20" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2ecc71" font-weight="bold">再放入</text>
  </g>

  <!-- ============ 容器3：再放入物體 ============ -->
  <g transform="translate(420, 65)">
    <!-- 容器陰影 -->
    <ellipse cx="85" cy="225" rx="95" ry="12" fill="#1a2a3a" opacity="0.15"/>

    <!-- 容器主體 -->
    <rect x="10" y="50" width="150" height="170" rx="8" ry="8" fill="url(#containerGrad)" filter="url(#shadowFilter)"/>

    <!-- 容器內部 -->
    <rect x="18" y="58" width="134" height="154" rx="5" ry="5" fill="url(#containerInner)"/>

    <!-- 水位3（再放入後水位再次上升，比第一次更高） -->
    <rect x="18" y="80" width="134" height="132" rx="0" ry="0" fill="url(#waterGrad3)" opacity="0.8"/>
    <!-- 水面光澤 -->
    <rect x="18" y="80" width="134" height="15" rx="0" ry="0" fill="url(#waterShine)" opacity="0.55"/>

    <!-- 物體3（綠色物體，更大） -->
    <ellipse cx="85" cy="145" rx="32" ry="25" fill="url(#objectGrad3)" filter="url(#innerShadow)"/>
    <ellipse cx="77" cy="137" rx="14" ry="9" fill="#ffffff" opacity="0.2"/>

    <!-- 容器頂部邊緣 -->
    <ellipse cx="85" cy="50" rx="75" ry="10" fill="#8aacbe" stroke="#6a8a9a" stroke-width="1.5"/>
    <ellipse cx="85" cy="50" rx="75" ry="10" fill="url(#lightEffect)" opacity="0.3"/>

    <!-- 容器底部邊緣 -->
    <ellipse cx="85" cy="220" rx="75" ry="10" fill="#4a6a7a" opacity="0.5"/>

    <!-- 水位標記線 -->
    <line x1="18" y1="80" x2="152" y2="80" stroke="#ffeb3b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
    <line x1="18" y1="140" x2="152" y2="140" stroke="#ffeb3b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- 標籤 -->
    <text x="85" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">③ 再放入物體</text>
    <text x="85" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">水位再次上升</text>

    <!-- 水位高度標示 -->
    <text x="160" y="84" font-family="Arial, sans-serif" font-size="9" fill="#29b6f6" font-weight="bold">h₃</text>
  </g>

  <!-- ============ 底部解說卡片 ============ -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="540" height="75" rx="12" ry="12" fill="#ffffff" opacity="0.9" filter="url(#cardShadow)"/>

    <!-- 解說圖示 -->
    <circle cx="25" cy="37" r="16" fill="#e8f4f8"/>
    <text x="25" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">💡</text>

    <!-- 解說文字 -->
    <text x="55" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50" font-weight="bold">排水法原理：</text>
    <text x="55" y="43" font-family="Arial, sans-serif" font-size="11" fill="#34495e">放入物體 → 水位上升（排水量 = 物體體積）</text>
    <text x="55" y="60" font-family="Arial, sans-serif" font-size="11" fill="#34495e">取出物體 → 水位下降 &nbsp;|&nbsp; 再放入 → 水位再次上升</text>

    <!-- 裝飾分隔線 -->
    <line x1="280" y1="15" x2="280" y2="65" stroke="#ecf0f1" stroke-width="1.5"/>

    <!-- 公式 -->
    <text x="300" y="30" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c" font-weight="bold">V物 = S × Δh</text>
    <text x="300" y="50" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">S：容器底面積 &nbsp; Δh：水位變化高度</text>
  </g>

  <!-- 裝飾性水位變化圖示（右上角） -->
  <g transform="translate(520, 18)" opacity="0.6">
    <rect x="0" y="0" width="60" height="30" rx="6" ry="6" fill="#ffffff" opacity="0.5"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">📊 水位</text>
  </g>

  <!-- 裝飾性小波紋 -->
  <g transform="translate(55, 195)" opacity="0.3">
    <path d="M0,0 Q5,-3 10,0 Q15,3 20,0" fill="none" stroke="#ffffff" stroke-width="1"/>
    <path d="M25,0 Q30,-3 35,0 Q40,3 45,0" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>
  <g transform="translate(245, 230)" opacity="0.25">
    <path d="M0,0 Q5,-3 10,0 Q15,3 20,0" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>
  <g transform="translate(435, 175)" opacity="0.3">
    <path d="M0,0 Q5,-3 10,0 Q15,3 20,0" fill="none" stroke="#ffffff" stroke-width="1"/>
    <path d="M25,0 Q30,-3 35,0 Q40,3 45,0" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>