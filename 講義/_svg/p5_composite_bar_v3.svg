<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8f0fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dce8f5;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f8ff;stop-opacity:1" />
    </linearGradient>

    <!-- 3D 柱狀漸變 - 藍色系列 -->
    <linearGradient id="barBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#2b7be8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5fc7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6bb3ff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#3d8cf0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2568c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barBlue3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ec0ff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#5a9cf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3478d6;stop-opacity:1" />
    </linearGradient>

    <!-- 3D 柱狀漸變 - 橙色系列 -->
    <linearGradient id="barOrange1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8a4a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#e86a2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c74f1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barOrange2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa06b;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f0803d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c95f25;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barOrange3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb07e;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f5945a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d67434;stop-opacity:1" />
    </linearGradient>

    <!-- 3D 柱狀漸變 - 綠色系列 -->
    <linearGradient id="barGreen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4adf8a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#2bc46e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1aa354;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGreen2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6be8a0;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#3dd07a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#25ad5e;stop-opacity:1" />
    </linearGradient>

    <!-- 3D 柱狀漸變 - 紫色系列 -->
    <linearGradient id="barPurple1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a67cff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#855ae8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#683cc7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barPurple2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b892ff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#9970f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a4cc9;stop-opacity:1" />
    </linearGradient>

    <!-- 放射漸變 3D 光影效果 -->
    <radialGradient id="shineBlue" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>
    <radialGradient id="shineOrange" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>
    <radialGradient id="shineGreen" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>
    <radialGradient id="shinePurple" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
      <feDropShadow dx="-1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="#1a3a6a" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3a6a" flood-opacity="0.06" />
    </filter>

    <!-- 圖例圓點漸變 -->
    <radialGradient id="legendBlue" cx="40%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#6bb3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5fc7;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="legendOrange" cx="40%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#ffa06b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c74f1a;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="legendGreen" cx="40%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#6be8a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1aa354;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="legendPurple" cx="40%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#b892ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#683cc7;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="600" height="400" fill="url(#bgGrad)" rx="0" />

  <!-- 圓角卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)" />

  <!-- 標題 -->
  <text x="300" y="52" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="20" font-weight="bold" fill="#2c3e6a" letter-spacing="1">
    香港小學圖書借閱統計（四年級）
  </text>
  <line x1="180" y1="62" x2="420" y2="62" stroke="#4a9eff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Y 軸標籤 -->
  <text x="55" y="95" text-anchor="end" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#5a6a8a">80</text>
  <text x="55" y="135" text-anchor="end" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#5a6a8a">60</text>
  <text x="55" y="175" text-anchor="end" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#5a6a8a">40</text>
  <text x="55" y="215" text-anchor="end" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#5a6a8a">20</text>
  <text x="55" y="255" text-anchor="end" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#5a6a8a">0</text>

  <!-- Y 軸刻度線 -->
  <line x1="65" y1="90" x2="560" y2="90" stroke="#d0d8e8" stroke-width="0.5" stroke-dasharray="4,4" />
  <line x1="65" y1="130" x2="560" y2="130" stroke="#d0d8e8" stroke-width="0.5" stroke-dasharray="4,4" />
  <line x1="65" y1="170" x2="560" y2="170" stroke="#d0d8e8" stroke-width="0.5" stroke-dasharray="4,4" />
  <line x1="65" y1="210" x2="560" y2="210" stroke="#d0d8e8" stroke-width="0.5" stroke-dasharray="4,4" />
  <line x1="65" y1="250" x2="560" y2="250" stroke="#d0d8e8" stroke-width="0.5" />

  <!-- Y 軸主線 -->
  <line x1="65" y1="85" x2="65" y2="255" stroke="#8a9abb" stroke-width="1.5" />

  <!-- X 軸主線 -->
  <line x1="65" y1="255" x2="560" y2="255" stroke="#8a9abb" stroke-width="1.5" />

  <!-- ===== 第一組：中文科 ===== -->
  <!-- 中文科 - 甲班（藍色） -->
  <rect x="95" y="105" width="42" height="150" rx="4" ry="4" fill="url(#barBlue1)" filter="url(#doubleShadow)" />
  <rect x="95" y="105" width="42" height="150" rx="4" ry="4" fill="url(#shineBlue)" />

  <!-- 中文科 - 乙班（橙色） -->
  <rect x="145" y="125" width="42" height="130" rx="4" ry="4" fill="url(#barOrange1)" filter="url(#doubleShadow)" />
  <rect x="145" y="125" width="42" height="130" rx="4" ry="4" fill="url(#shineOrange)" />

  <!-- 中文科標籤 -->
  <text x="141" y="278" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" font-weight="bold" fill="#3a4a6a">中文科</text>

  <!-- 數值標籤 - 中文科 -->
  <text x="116" y="98" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" font-weight="bold" fill="#2b7be8">60</text>
  <text x="166" y="118" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" font-weight="bold" fill="#e86a2b">50</text>

  <!-- ===== 第二組：英文科 ===== -->
  <!-- 英文科 - 甲班（綠色） -->
  <rect x="225" y="115" width="42" height="140" rx="4" ry="4" fill="url(#barGreen1)" filter="url(#doubleShadow)" />
  <rect x="225" y="115" width="42" height="140" rx="4" ry="4" fill="url(#shineGreen)" />

  <!-- 英文科 - 乙班（紫色） -->
  <rect x="275" y="95" width="42" height="160" rx="4" ry="4" fill="url(#barPurple1)" filter="url(#doubleShadow)" />
  <rect x="275" y="95" width="42" height="160" rx="4" ry="4" fill="url(#shinePurple)" />

  <!-- 英文科標籤 -->
  <text x="271" y="278" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" font-weight="bold" fill="#3a4a6a">英文科</text>

  <!-- 數值標籤 - 英文科 -->
  <text x="246" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" font-weight="bold" fill="#2bc46e">55</text>
  <text x="296" y="88" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" font-weight="bold" fill="#855ae8">65</text>

  <!-- ===== 第三組：數學科 ===== -->
  <!-- 數學科 - 甲班（藍色） -->
  <rect x="355" y="85" width="42" height="170" rx="4" ry="4" fill="url(#barBlue2)" filter="url(#doubleShadow)" />
  <rect x="355" y="85" width="42" height="170" rx="4" ry="4" fill="url(#shineBlue)" />

  <!-- 數學科 - 乙班（橙色） -->
  <rect x="405" y="105" width="42" height="150" rx="4" ry="4" fill="url(#barOrange2)" filter="url(#doubleShadow)" />
  <rect x="405" y="105" width="42" height="150" rx="4" ry="4" fill="url(#shineOrange)" />

  <!-- 數學科標籤 -->
  <text x="401" y="278" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" font-weight="bold" fill="#3a4a6a">數學科</text>

  <!-- 數值標籤 - 數學科 -->
  <text x="376" y="78" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" font-weight="bold" fill="#3d8cf0">70</text>
  <text x="426" y="98" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" font-weight="bold" fill="#f0803d">60</text>

  <!-- ===== 第四組：常識科 ===== -->
  <!-- 常識科 - 甲班（綠色） -->
  <rect x="475" y="135" width="42" height="120" rx="4" ry="4" fill="url(#barGreen2)" filter="url(#doubleShadow)" />
  <rect x="475" y="135" width="42" height="120" rx="4" ry="4" fill="url(#shineGreen)" />

  <!-- 常識科 - 乙班（紫色） -->
  <rect x="525" y="145" width="42" height="110" rx="4" ry="4" fill="url(#barPurple2)" filter="url(#doubleShadow)" />
  <rect x="525" y="145" width="42" height="110" rx="4" ry="4" fill="url(#shinePurple)" />

  <!-- 常識科標籤 -->
  <text x="521" y="278" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" font-weight="bold" fill="#3a4a6a">常識科</text>

  <!-- 數值標籤 - 常識科 -->
  <text x="496" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" font-weight="bold" fill="#3dd07a">45</text>
  <text x="546" y="138" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" font-weight="bold" fill="#9970f0">40</text>

  <!-- ===== 圖例 ===== -->
  <!-- 圖例背景 -->
  <rect x="70" y="295" width="490" height="75" rx="12" ry="12" fill="#f8faff" stroke="#d8e2f5" stroke-width="1" stroke-opacity="0.8" />

  <!-- 圖例標題 -->
  <text x="300" y="318" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#3a4a6a">圖例</text>

  <!-- 甲班（藍色） -->
  <circle cx="110" cy="342" r="8" fill="url(#legendBlue)" />
  <text x="125" y="346" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="#3a4a6a">甲班</text>

  <!-- 乙班（橙色） -->
  <circle cx="210" cy="342" r="8" fill="url(#legendOrange)" />
  <text x="225" y="346" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="#3a4a6a">乙班</text>

  <!-- 丙班（綠色） -->
  <circle cx="310" cy="342" r="8" fill="url(#legendGreen)" />
  <text x="325" y="346" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="#3a4a6a">丙班</text>

  <!-- 丁班（紫色） -->
  <circle cx="410" cy="342" r="8" fill="url(#legendPurple)" />
  <text x="425" y="346" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="#3a4a6a">丁班</text>

  <!-- 裝飾性底部高光線 -->
  <line x1="70" y1="375" x2="530" y2="375" stroke="#4a9eff" stroke-width="1.5" stroke-opacity="0.15" rx="2" />
</svg>