<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4F8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FAFBFC;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8EEF4;stop-opacity:1"/>
    </linearGradient>

    <!-- 三角形1 - 基本高度（藍色）多層漸變 -->
    <linearGradient id="tri1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#5BA0E8;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#3A7BC8;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#2E6AB0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E5A9E;stop-opacity:1"/>
    </linearGradient>

    <!-- 三角形1 - 放射漸變3D光影 -->
    <radialGradient id="tri1Shine" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.12"/>
      <stop offset="70%" style="stop-color:#000000;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.18"/>
    </radialGradient>

    <!-- 三角形2 - 高度加倍（橙色）多層漸變 -->
    <linearGradient id="tri2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#FFB840;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#E8961A;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#D4850E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C07000;stop-opacity:1"/>
    </linearGradient>

    <!-- 三角形2 - 放射漸變3D光影 -->
    <radialGradient id="tri2Shine" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.12"/>
      <stop offset="70%" style="stop-color:#000000;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.18"/>
    </radialGradient>

    <!-- 三角形3 - 高度三倍（綠色）多層漸變 -->
    <linearGradient id="tri3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#3DDB80;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#27AE60;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#1E9E54;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#168B48;stop-opacity:1"/>
    </linearGradient>

    <!-- 三角形3 - 放射漸變3D光影 -->
    <radialGradient id="tri3Shine" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.12"/>
      <stop offset="70%" style="stop-color:#000000;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.18"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <filter id="triShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <filter id="triShadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F5A623"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2ECC71"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="bold" fill="#2C3E50" letter-spacing="1">三角形高變化 · 面積變化</text>
  <text x="300" y="52" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#7F8C8D">同底三角形 · 高加倍 → 面積加倍</text>

  <!-- ==================== 卡片1：基本高度 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="72" width="170" height="310" rx="14" ry="14" fill="#FFFFFF" stroke="#E8ECF0" stroke-width="1"/>
  </g>
  <!-- 卡片1 頂部裝飾條 -->
  <rect x="25" y="72" width="170" height="6" rx="3" ry="3" fill="#4A90D9"/>

  <text x="110" y="102" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#4A90D9">高度 = 1 倍</text>

  <!-- 三角形1 底邊 -->
  <line x1="45" y1="350" x2="175" y2="350" stroke="#4A90D9" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- 三角形1 本體 -->
  <g filter="url(#triShadow)">
    <polygon points="110,350 45,350 110,210" fill="url(#tri1Grad)"/>
    <polygon points="110,350 45,350 110,210" fill="url(#tri1Shine)"/>
  </g>

  <!-- 三角形1 邊框 -->
  <polygon points="110,350 45,350 110,210" fill="none" stroke="#2E6AB0" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 高度標示線（虛線） -->
  <line x1="110" y1="210" x2="110" y2="350" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- 高度箭頭 -->
  <line x1="120" y1="350" x2="120" y2="210" stroke="#4A90D9" stroke-width="1.8" marker-end="url(#arrowBlue)" opacity="0.8"/>
  <line x1="120" y1="350" x2="120" y2="350" stroke="#4A90D9" stroke-width="1.8" opacity="0.8"/>

  <!-- 高度文字 -->
  <text x="132" y="285" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#4A90D9" font-weight="bold">h</text>

  <!-- 底邊文字 -->
  <text x="100" y="368" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#4A90D9" font-weight="bold">底邊 (相同)</text>

  <!-- 面積標籤 -->
  <rect x="55" y="220" width="50" height="20" rx="10" ry="10" fill="#4A90D9" opacity="0.15"/>
  <text x="80" y="234" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#2E6AB0" font-weight="bold">面積 = 1</text>

  <!-- ==================== 卡片2：高度加倍 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="215" y="72" width="170" height="310" rx="14" ry="14" fill="#FFFFFF" stroke="#E8ECF0" stroke-width="1"/>
  </g>
  <rect x="215" y="72" width="170" height="6" rx="3" ry="3" fill="#F5A623"/>

  <text x="300" y="102" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#F5A623">高度 = 2 倍</text>

  <!-- 三角形2 底邊 -->
  <line x1="235" y1="350" x2="365" y2="350" stroke="#F5A623" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- 三角形2 本體 -->
  <g filter="url(#triShadow)">
    <polygon points="300,350 235,350 300,70" fill="url(#tri2Grad)"/>
    <polygon points="300,350 235,350 300,70" fill="url(#tri2Shine)"/>
  </g>

  <polygon points="300,350 235,350 300,70" fill="none" stroke="#D4850E" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 高度標示線 -->
  <line x1="300" y1="70" x2="300" y2="350" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- 高度箭頭 -->
  <line x1="310" y1="350" x2="310" y2="70" stroke="#F5A623" stroke-width="1.8" marker-end="url(#arrowOrange)" opacity="0.8"/>

  <!-- 高度文字 -->
  <text x="322" y="215" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#F5A623" font-weight="bold">2h</text>

  <!-- 底邊文字 -->
  <text x="290" y="368" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#F5A623" font-weight="bold">底邊 (相同)</text>

  <!-- 面積標籤 -->
  <rect x="245" y="80" width="50" height="20" rx="10" ry="10" fill="#F5A623" opacity="0.15"/>
  <text x="270" y="94" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#D4850E" font-weight="bold">面積 = 2</text>

  <!-- 加倍箭頭（從卡片1到卡片2） -->
  <path d="M195,240 C205,240 205,240 215,240" stroke="#95A5A6" stroke-width="1.5" fill="none" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="205" y="232" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#95A5A6">×2</text>

  <!-- ==================== 卡片3：高度三倍 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="405" y="72" width="170" height="310" rx="14" ry="14" fill="#FFFFFF" stroke="#E8ECF0" stroke-width="1"/>
  </g>
  <rect x="405" y="72" width="170" height="6" rx="3" ry="3" fill="#2ECC71"/>

  <text x="490" y="102" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#2ECC71">高度 = 3 倍</text>

  <!-- 三角形3 底邊 -->
  <line x1="425" y1="350" x2="555" y2="350" stroke="#2ECC71" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- 三角形3 本體 -->
  <g filter="url(#triShadowLight)">
    <polygon points="490,350 425,350 490,210" fill="url(#tri3Grad)"/>
    <polygon points="490,350 425,350 490,210" fill="url(#tri3Shine)"/>
  </g>

  <polygon points="490,350 425,350 490,210" fill="none" stroke="#1E9E54" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 高度標示線 -->
  <line x1="490" y1="210" x2="490" y2="350" stroke="#2ECC71" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- 高度箭頭 -->
  <line x1="500" y1="350" x2="500" y2="210" stroke="#2ECC71" stroke-width="1.8" marker-end="url(#arrowGreen)" opacity="0.8"/>

  <!-- 高度文字 -->
  <text x="512" y="285" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#2ECC71" font-weight="bold">3h</text>

  <!-- 底邊文字 -->
  <text x="480" y="368" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#2ECC71" font-weight="bold">底邊 (相同)</text>

  <!-- 面積標籤 -->
  <rect x="445" y="220" width="50" height="20" rx="10" ry="10" fill="#2ECC71" opacity="0.15"/>
  <text x="470" y="234" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#1E9E54" font-weight="bold">面積 = 3</text>

  <!-- 加倍箭頭（從卡片2到卡片3） -->
  <path d="M385,240 C395,240 395,240 405,240" stroke="#95A5A6" stroke-width="1.5" fill="none" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="395" y="232" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#95A5A6">×3</text>

  <!-- 底部公式提示 -->
  <g transform="translate(300, 388)">
    <text x="0" y="0" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#95A5A6">公式：面積 = (底 × 高) ÷ 2</text>
  </g>
</svg>