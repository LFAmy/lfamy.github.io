<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4F8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FAFBFC;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8EDF2;stop-opacity:1"/>
    </linearGradient>

    <!-- 卡片1：估算 - 藍色系多層漸變 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#5BA0E8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#3A7BC8;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#2E6AB0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1E5799;stop-opacity:1"/>
    </linearGradient>

    <!-- 卡片1：放射漸變3D光影 -->
    <radialGradient id="card1Shine" cx="30%" cy="20%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15"/>
    </radialGradient>

    <!-- 卡片2：速算 - 綠色系多層漸變 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38B27A;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#4CC48E;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#2EA06A;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#25905D;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1B7A4E;stop-opacity:1"/>
    </linearGradient>

    <!-- 卡片2：放射漸變3D光影 -->
    <radialGradient id="card2Shine" cx="30%" cy="20%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15"/>
    </radialGradient>

    <!-- 卡片3：驗算 - 橙色系多層漸變 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8853A;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#F0984F;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#D9772E;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#C96A24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#B85C1A;stop-opacity:1"/>
    </linearGradient>

    <!-- 卡片3：放射漸變3D光影 -->
    <radialGradient id="card3Shine" cx="30%" cy="20%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <!-- 第一層陰影：深色大範圍 -->
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A2A3A" flood-opacity="0.25"/>
      <!-- 第二層陰影：淺色小範圍 -->
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 標題陰影 -->
    <filter id="titleShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1A2A3A" flood-opacity="0.20"/>
    </filter>

    <!-- 圖標發光 -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 箭頭漸變 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8899AA;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#AABBCC;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#8899AA;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="80" fill="#4A90D9" opacity="0.03"/>
  <circle cx="550" cy="350" r="100" fill="#38B27A" opacity="0.03"/>
  <circle cx="520" cy="60" r="60" fill="#E8853A" opacity="0.03"/>
  <circle cx="80" cy="350" r="70" fill="#4A90D9" opacity="0.02"/>

  <!-- 主標題 -->
  <text x="300" y="48" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="bold" fill="#2C3E50" filter="url(#titleShadow)">
    🧮 SSPA 計算衝刺 · 提速三策略
  </text>

  <!-- 裝飾線 -->
  <line x1="120" y1="62" x2="480" y2="62" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- ==================== 卡片1：估算 ==================== -->
  <g filter="url(#doubleShadow)">
    <!-- 卡片主體 -->
    <rect x="25" y="85" width="170" height="270" rx="18" ry="18" fill="url(#card1Grad)"/>
    <!-- 3D光影覆蓋 -->
    <rect x="25" y="85" width="170" height="270" rx="18" ry="18" fill="url(#card1Shine)"/>
    <!-- 邊框高光 -->
    <rect x="25" y="85" width="170" height="270" rx="18" ry="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>

  <!-- 卡片1：圖標 -->
  <g filter="url(#iconGlow)">
    <circle cx="110" cy="130" r="24" fill="#FFFFFF" opacity="0.2"/>
    <text x="110" y="140" text-anchor="middle" font-size="28" fill="#FFFFFF">🔍</text>
  </g>

  <!-- 卡片1：標題 -->
  <text x="110" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">
    估算
  </text>

  <!-- 卡片1：英文 -->
  <text x="110" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7">
    Estimation
  </text>

  <!-- 卡片1：分隔線 -->
  <line x1="45" y1="212" x2="175" y2="212" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 卡片1：技巧列表 -->
  <text x="110" y="238" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    四捨五入
  </text>
  <text x="110" y="260" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    取整計算
  </text>
  <text x="110" y="282" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    範圍判斷
  </text>
  <text x="110" y="304" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    排除極端
  </text>

  <!-- 卡片1：底部標籤 -->
  <rect x="55" y="320" width="110" height="22" rx="11" fill="#FFFFFF" opacity="0.15"/>
  <text x="110" y="335" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#FFFFFF" opacity="0.9">
    ⏱ 節省 30% 時間
  </text>

  <!-- ==================== 箭頭 1→2 ==================== -->
  <g>
    <line x1="200" y1="220" x2="215" y2="220" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="218,220 210,215 210,225" fill="#AABBCC" opacity="0.6"/>
  </g>

  <!-- ==================== 卡片2：速算 ==================== -->
  <g filter="url(#doubleShadow)">
    <!-- 卡片主體 -->
    <rect x="215" y="85" width="170" height="270" rx="18" ry="18" fill="url(#card2Grad)"/>
    <!-- 3D光影覆蓋 -->
    <rect x="215" y="85" width="170" height="270" rx="18" ry="18" fill="url(#card2Shine)"/>
    <!-- 邊框高光 -->
    <rect x="215" y="85" width="170" height="270" rx="18" ry="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>

  <!-- 卡片2：圖標 -->
  <g filter="url(#iconGlow)">
    <circle cx="300" cy="130" r="24" fill="#FFFFFF" opacity="0.2"/>
    <text x="300" y="140" text-anchor="middle" font-size="28" fill="#FFFFFF">⚡</text>
  </g>

  <!-- 卡片2：標題 -->
  <text x="300" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">
    速算
  </text>

  <!-- 卡片2：英文 -->
  <text x="300" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7">
    Quick Calculation
  </text>

  <!-- 卡片2：分隔線 -->
  <line x1="235" y1="212" x2="365" y2="212" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 卡片2：技巧列表 -->
  <text x="300" y="238" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    湊整法
  </text>
  <text x="300" y="260" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    乘法分配律
  </text>
  <text x="300" y="282" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    特殊數組合
  </text>
  <text x="300" y="304" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    口算技巧
  </text>

  <!-- 卡片2：底部標籤 -->
  <rect x="245" y="320" width="110" height="22" rx="11" fill="#FFFFFF" opacity="0.15"/>
  <text x="300" y="335" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#FFFFFF" opacity="0.9">
    🚀 提升 2 倍速度
  </text>

  <!-- ==================== 箭頭 2→3 ==================== -->
  <g>
    <line x1="390" y1="220" x2="405" y2="220" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="408,220 400,215 400,225" fill="#AABBCC" opacity="0.6"/>
  </g>

  <!-- ==================== 卡片3：驗算 ==================== -->
  <g filter="url(#doubleShadow)">
    <!-- 卡片主體 -->
    <rect x="405" y="85" width="170" height="270" rx="18" ry="18" fill="url(#card3Grad)"/>
    <!-- 3D光影覆蓋 -->
    <rect x="405" y="85" width="170" height="270" rx="18" ry="18" fill="url(#card3Shine)"/>
    <!-- 邊框高光 -->
    <rect x="405" y="85" width="170" height="270" rx="18" ry="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
  </g>

  <!-- 卡片3：圖標 -->
  <g filter="url(#iconGlow)">
    <circle cx="490" cy="130" r="24" fill="#FFFFFF" opacity="0.2"/>
    <text x="490" y="140" text-anchor="middle" font-size="28" fill="#FFFFFF">✅</text>
  </g>

  <!-- 卡片3：標題 -->
  <text x="490" y="178" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">
    驗算
  </text>

  <!-- 卡片3：英文 -->
  <text x="490" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#FFFFFF" opacity="0.7">
    Verification
  </text>

  <!-- 卡片3：分隔線 -->
  <line x1="425" y1="212" x2="555" y2="212" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 卡片3：技巧列表 -->
  <text x="490" y="238" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    逆運算檢查
  </text>
  <text x="490" y="260" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    尾數核對
  </text>
  <text x="490" y="282" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    代入驗證
  </text>
  <text x="490" y="304" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#FFFFFF" opacity="0.95">
    估算比對
  </text>

  <!-- 卡片3：底部標籤 -->
  <rect x="435" y="320" width="110" height="22" rx="11" fill="#FFFFFF" opacity="0.15"/>
  <text x="490" y="335" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#FFFFFF" opacity="0.9">
    🎯 正確率 99%
  </text>

  <!-- ==================== 底部提示 ==================== -->
  <rect x="150" y="370" width="300" height="20" rx="10" fill="#2C3E50" opacity="0.06"/>
  <text x="300" y="384" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#7F8C9B" opacity="0.8">
    💡 先估算 → 再速算 → 後驗算，三步提升計算效率！
  </text>
</svg>