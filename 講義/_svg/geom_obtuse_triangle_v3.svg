<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="50%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>

    <!-- 卡片外陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1A2A3A" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2A3A" flood-opacity="0.08"/>
    </filter>

    <!-- 三角形主體漸變（多層） -->
    <linearGradient id="triangleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="25%" stop-color="#FF8E53"/>
      <stop offset="50%" stop-color="#FFB347"/>
      <stop offset="75%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#EE5A24"/>
    </linearGradient>

    <!-- 三角形3D光影（放射漸變） -->
    <radialGradient id="triangleLight" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </radialGradient>

    <!-- 高輔助線漸變 -->
    <linearGradient id="heightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ED573"/>
      <stop offset="50%" stop-color="#7BED9F"/>
      <stop offset="100%" stop-color="#2ED573"/>
    </linearGradient>

    <!-- 底邊輔助線漸變 -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="50%" stop-color="#54A0FF"/>
      <stop offset="100%" stop-color="#1E90FF"/>
    </linearGradient>

    <!-- 延長線漸變 -->
    <linearGradient id="extGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9FF3"/>
      <stop offset="50%" stop-color="#F368E0"/>
      <stop offset="100%" stop-color="#FF9FF3"/>
    </linearGradient>

    <!-- 虛線濾鏡 -->
    <filter id="dashGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 頂點圓點光暈 -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFD93D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>

    <!-- 標籤陰影 -->
    <filter id="labelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 圓角卡片 -->
  <rect x="20" y="20" width="560" height="360" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 卡片內背景 -->
  <rect x="20" y="20" width="560" height="360" rx="20" fill="#FFFFFF" opacity="0.95"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="bold" fill="#2C3E50" filter="url(#labelShadow)">🔺 鈍角三角形面積</text>
  <text x="300" y="82" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#7F8C8D">面積 = 底 × 高 ÷ 2（高在底邊延長線上）</text>

  <!-- 繪圖區域 -->
  <g transform="translate(60, 30)">

    <!-- 底邊延長線（虛線） -->
    <line x1="80" y1="260" x2="460" y2="260" stroke="url(#extGrad)" stroke-width="2.5" stroke-dasharray="8,6" stroke-linecap="round" filter="url(#dashGlow)"/>

    <!-- 底邊（實線） -->
    <line x1="120" y1="260" x2="400" y2="260" stroke="url(#baseGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- 高（虛線，從頂點到底邊延長線的垂直線） -->
    <line x1="400" y1="260" x2="400" y2="80" stroke="url(#heightGrad)" stroke-width="3" stroke-dasharray="6,5" stroke-linecap="round" filter="url(#dashGlow)"/>

    <!-- 三角形主體（鈍角三角形） -->
    <!-- 頂點A(400,80)，頂點B(120,260)，頂點C(400,260) -->
    <polygon points="400,80 120,260 400,260" fill="url(#triangleGrad)" stroke="#EE5A24" stroke-width="2.5" stroke-linejoin="round" opacity="0.92"/>

    <!-- 三角形3D光影層 -->
    <polygon points="400,80 120,260 400,260" fill="url(#triangleLight)" stroke="none"/>

    <!-- 頂點圓點 -->
    <circle cx="400" cy="80" r="8" fill="url(#dotGlow)"/>
    <circle cx="400" cy="80" r="5" fill="#FF6B6B" stroke="#FFFFFF" stroke-width="2"/>

    <circle cx="120" cy="260" r="8" fill="url(#dotGlow)"/>
    <circle cx="120" cy="260" r="5" fill="#1E90FF" stroke="#FFFFFF" stroke-width="2"/>

    <circle cx="400" cy="260" r="8" fill="url(#dotGlow)"/>
    <circle cx="400" cy="260" r="5" fill="#1E90FF" stroke="#FFFFFF" stroke-width="2"/>

    <!-- 直角標記（高與底邊延長線的交點） -->
    <polyline points="390,260 390,250 400,250" fill="none" stroke="#2ED573" stroke-width="2" stroke-linecap="round"/>

    <!-- 標籤 -->
    <!-- 頂點A -->
    <text x="410" y="72" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#FF6B6B" filter="url(#labelShadow)">A</text>

    <!-- 頂點B -->
    <text x="100" y="278" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1E90FF" filter="url(#labelShadow)">B</text>

    <!-- 頂點C -->
    <text x="410" y="278" font-family="'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1E90FF" filter="url(#labelShadow)">C</text>

    <!-- 高標記 H -->
    <text x="410" y="255" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#2ED573" filter="url(#labelShadow)">H</text>

    <!-- 底邊標籤 -->
    <text x="250" y="290" text-anchor="middle" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#1E90FF" filter="url(#labelShadow)">底 (BC)</text>

    <!-- 高標籤 -->
    <text x="420" y="175" text-anchor="start" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#2ED573" filter="url(#labelShadow)">高 (AH)</text>

    <!-- 延長線標籤 -->
    <text x="200" y="250" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#F368E0" font-style="italic">底邊延長線</text>

    <!-- 面積公式 -->
    <rect x="130" y="110" width="170" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFB347" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="215" y="132" text-anchor="middle" font-family="'Times New Roman', serif" font-size="15" fill="#2C3E50" font-weight="bold">面積 = 底 × 高 ÷ 2</text>
    <text x="215" y="152" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" fill="#7F8C8D">= BC × AH ÷ 2</text>

    <!-- 鈍角標記 -->
    <path d="M 120,260 Q 135,245 150,260" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
    <text x="145" y="240" font-family="'Times New Roman', serif" font-size="14" fill="#FF6B6B" font-weight="bold">鈍角</text>

    <!-- 3D裝飾元素 - 底部光暈 -->
    <ellipse cx="260" cy="310" rx="140" ry="8" fill="#FF6B6B" opacity="0.08"/>

    <!-- 小裝飾：三角形面積公式圖標 -->
    <g transform="translate(420, 100)">
      <rect x="0" y="0" width="70" height="60" rx="10" fill="#F8F9FA" stroke="#E0E6ED" stroke-width="1"/>
      <text x="35" y="22" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#7F8C8D">公式</text>
      <text x="35" y="42" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" fill="#FF6B6B" font-weight="bold">½ × b × h</text>
    </g>

  </g>

  <!-- 底部裝飾文字 -->
  <text x="300" y="385" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" fill="#BDC3C7">香港小學數學 · 鈍角三角形面積 · 高在底邊延長線上</text>
</svg>