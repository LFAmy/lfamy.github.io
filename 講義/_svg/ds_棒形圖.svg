<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f0fe;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片背景 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8faff;stop-opacity:0.95" />
    </linearGradient>

    <!-- 長條 1 漸變（藍色） -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9" />
      <stop offset="40%" style="stop-color:#357abd" />
      <stop offset="100%" style="stop-color:#2a6cb5" />
    </linearGradient>
    <radialGradient id="bar1Shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 長條 2 漸變（綠色） -->
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5cb85c" />
      <stop offset="40%" style="stop-color:#4a9e4a" />
      <stop offset="100%" style="stop-color:#3d8b3d" />
    </linearGradient>
    <radialGradient id="bar2Shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 長條 3 漸變（橙色） -->
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0ad4e" />
      <stop offset="40%" style="stop-color:#e89a3a" />
      <stop offset="100%" style="stop-color:#d9882e" />
    </linearGradient>
    <radialGradient id="bar3Shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 長條 4 漸變（紫色） -->
    <linearGradient id="bar4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6" />
      <stop offset="40%" style="stop-color:#8e44ad" />
      <stop offset="100%" style="stop-color:#7d3c98" />
    </linearGradient>
    <radialGradient id="bar4Shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 長條頂部橢圓漸變 -->
    <linearGradient id="topGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5ba0e8" />
      <stop offset="100%" style="stop-color:#4a90d9" />
    </linearGradient>
    <linearGradient id="topGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6cc86c" />
      <stop offset="100%" style="stop-color:#5cb85c" />
    </linearGradient>
    <linearGradient id="topGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5bd5e" />
      <stop offset="100%" style="stop-color:#f0ad4e" />
    </linearGradient>
    <linearGradient id="topGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ab69c6" />
      <stop offset="100%" style="stop-color:#9b59b6" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="barShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <filter id="barShadowInner" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- 網格線圖案 -->
    <pattern id="gridPattern" width="50" height="25" patternUnits="userSpaceOnUse">
      <line x1="0" y1="25" x2="50" y2="25" stroke="#e0e7f0" stroke-width="0.5" stroke-dasharray="3,3"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 圓角卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="16" ry="16" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- 標題 -->
  <text x="300" y="55" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50" letter-spacing="2">香港小學四年級各班人數</text>

  <!-- 圖表區域 -->
  <g transform="translate(70, 75)">
    <!-- 網格線 -->
    <rect x="0" y="0" width="460" height="260" fill="url(#gridPattern)" opacity="0.5"/>

    <!-- Y軸刻度線 -->
    <line x1="0" y1="0" x2="460" y2="0" stroke="#d0d8e5" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="52" x2="460" y2="52" stroke="#d0d8e5" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="104" x2="460" y2="104" stroke="#d0d8e5" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="156" x2="460" y2="156" stroke="#d0d8e5" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="208" x2="460" y2="208" stroke="#d0d8e5" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="260" x2="460" y2="260" stroke="#c0c8d8" stroke-width="0.8"/>

    <!-- Y軸標籤 -->
    <text x="-10" y="264" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7f8c9b">0</text>
    <text x="-10" y="212" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7f8c9b">10</text>
    <text x="-10" y="160" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7f8c9b">20</text>
    <text x="-10" y="108" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7f8c9b">30</text>
    <text x="-10" y="56" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7f8c9b">40</text>
    <text x="-10" y="6" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7f8c9b">50</text>

    <!-- Y軸標題 -->
    <text x="-50" y="130" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#5a6a7a" transform="rotate(-90, -50, 130)">人數（人）</text>

    <!-- X軸 -->
    <line x1="0" y1="260" x2="460" y2="260" stroke="#8899aa" stroke-width="1.5"/>

    <!-- ===== 長條 1：一班（35人）===== -->
    <g filter="url(#barShadow)">
      <!-- 3D 側面（右側） -->
      <polygon points="72,260 72,100 92,95 92,255" fill="#1e5a9e" opacity="0.5"/>
      <!-- 3D 正面 -->
      <rect x="30" y="105" width="42" height="155" rx="3" ry="3" fill="url(#bar1Grad)"/>
      <!-- 光影覆蓋 -->
      <rect x="30" y="105" width="42" height="155" rx="3" ry="3" fill="url(#bar1Shine)"/>
      <!-- 頂部橢圓（3D 頂面） -->
      <ellipse cx="51" cy="105" rx="21" ry="6" fill="url(#topGrad1)" stroke="#4a90d9" stroke-width="0.5"/>
      <!-- 頂部高光 -->
      <ellipse cx="51" cy="104" rx="14" ry="3.5" fill="#ffffff" opacity="0.25"/>
    </g>
    <!-- 數值標籤 -->
    <text x="51" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2a6cb5">35</text>

    <!-- ===== 長條 2：二班（42人）===== -->
    <g filter="url(#barShadow)">
      <polygon points="182,260 182,50 202,45 202,255" fill="#2d7a2d" opacity="0.5"/>
      <rect x="140" y="55" width="42" height="205" rx="3" ry="3" fill="url(#bar2Grad)"/>
      <rect x="140" y="55" width="42" height="205" rx="3" ry="3" fill="url(#bar2Shine)"/>
      <ellipse cx="161" cy="55" rx="21" ry="6" fill="url(#topGrad2)" stroke="#5cb85c" stroke-width="0.5"/>
      <ellipse cx="161" cy="54" rx="14" ry="3.5" fill="#ffffff" opacity="0.25"/>
    </g>
    <text x="161" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3d8b3d">42</text>

    <!-- ===== 長條 3：三班（28人）===== -->
    <g filter="url(#barShadow)">
      <polygon points="292,260 292,155 312,150 312,255" fill="#b87020" opacity="0.5"/>
      <rect x="250" y="160" width="42" height="100" rx="3" ry="3" fill="url(#bar3Grad)"/>
      <rect x="250" y="160" width="42" height="100" rx="3" ry="3" fill="url(#bar3Shine)"/>
      <ellipse cx="271" cy="160" rx="21" ry="6" fill="url(#topGrad3)" stroke="#f0ad4e" stroke-width="0.5"/>
      <ellipse cx="271" cy="159" rx="14" ry="3.5" fill="#ffffff" opacity="0.25"/>
    </g>
    <text x="271" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d9882e">28</text>

    <!-- ===== 長條 4：四班（38人）===== -->
    <g filter="url(#barShadow)">
      <polygon points="402,260 402,80 422,75 422,255" fill="#5e2d75" opacity="0.5"/>
      <rect x="360" y="85" width="42" height="175" rx="3" ry="3" fill="url(#bar4Grad)"/>
      <rect x="360" y="85" width="42" height="175" rx="3" ry="3" fill="url(#bar4Shine)"/>
      <ellipse cx="381" cy="85" rx="21" ry="6" fill="url(#topGrad4)" stroke="#9b59b6" stroke-width="0.5"/>
      <ellipse cx="381" cy="84" rx="14" ry="3.5" fill="#ffffff" opacity="0.25"/>
    </g>
    <text x="381" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7d3c98">38</text>

    <!-- X軸標籤（班級名稱） -->
    <text x="51" y="282" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">一班</text>
    <text x="161" y="282" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">二班</text>
    <text x="271" y="282" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">三班</text>
    <text x="381" y="282" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495e">四班</text>

    <!-- X軸標題 -->
    <text x="230" y="305" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#5a6a7a">班級</text>
  </g>

  <!-- 圖例 -->
  <g transform="translate(130, 350)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#4a90d9"/>
    <text x="16" y="11" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#5a6a7a">一班</text>
    <rect x="70" y="0" width="12" height="12" rx="2" fill="#5cb85c"/>
    <text x="86" y="11" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#5a6a7a">二班</text>
    <rect x="140" y="0" width="12" height="12" rx="2" fill="#f0ad4e"/>
    <text x="156" y="11" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#5a6a7a">三班</text>
    <rect x="210" y="0" width="12" height="12" rx="2" fill="#9b59b6"/>
    <text x="226" y="11" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="11" fill="#5a6a7a">四班</text>
  </g>
</svg>