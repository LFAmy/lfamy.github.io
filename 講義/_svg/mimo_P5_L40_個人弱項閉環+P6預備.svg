<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Microsoft YaHei, SimHei, sans-serif">
    <defs>
        <!-- 定义渐变色 -->
        <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
        </linearGradient>
        
        <!-- 定义阴影滤镜 -->
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
        </filter>
        
        <!-- 定义箭头标记 -->
        <marker id="arrowMain" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5"/>
        </marker>
        <marker id="arrowAccent" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
        </marker>
        <marker id="arrowSuccess" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
        </marker>
    </defs>
    
    <!-- 背景 -->
    <rect width="600" height="400" fill="#F9FAFB" rx="12"/>
    
    <!-- 标题区 -->
    <rect x="30" y="20" width="540" height="60" rx="12" fill="url(#mainGrad)" filter="url(#shadow)"/>
    <text x="300" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="white">P5 数学个人弱项闭环 & 升P6预备路线</text>
    
    <!-- 左侧：弱项闭环区域 -->
    <rect x="30" y="90" width="260" height="260" rx="12" fill="white" filter="url(#shadow)" stroke="#E5E7EB" stroke-width="1"/>
    <text x="160" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#4F46E5">我的弱项改进闭环</text>
    
    <!-- 闭环步骤卡片 -->
    <g transform="translate(45, 130)">
        <rect width="230" height="40" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="15" y="27" font-size="14" fill="#1E40AF">1. 识别弱项：找出常错题目类型</text>
    </g>
    
    <g transform="translate(45, 180)">
        <rect width="230" height="40" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
        <text x="15" y="27" font-size="14" fill="#92400E">2. 分析原因：为什么总在这里出错？</text>
    </g>
    
    <g transform="translate(45, 230)">
        <rect width="230" height="40" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
        <text x="15" y="27" font-size="14" fill="#065F46">3. 练习巩固：针对弱项做练习题</text>
    </g>
    
    <g transform="translate(45, 280)">
        <rect width="230" height="40" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
        <text x="15" y="27" font-size="14" fill="#5B21B6">4. 掌握确认：同类题目连续做对！</text>
    </g>
    
    <!-- 闭环箭头（圆形循环示意） -->
    <path d="M 275,200 C 290,220 290,260 275,280" stroke="#4F46E5" stroke-width="2" fill="none" marker-end="url(#arrowMain)" stroke-dasharray="5,3"/>
    <text x="295" y="245" font-size="10" fill="#4F46E5" transform="rotate(90, 295, 245)">循环改进</text>
    
    <!-- 右侧：升P6预备路线 -->
    <rect x="310" y="90" width="260" height="260" rx="12" fill="white" filter="url(#shadow)" stroke="#E5E7EB" stroke-width="1"/>
    <text x="440" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#F59E0B">升读P6预备路线</text>
    
    <!-- 预习知识点 -->
    <g transform="translate(325, 135)">
        <rect width="230" height="45" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
        <circle cx="20" cy="22.5" r="10" fill="#F59E0B"/>
        <text x="20" y="27" text-anchor="middle" font-size="12" fill="white" font-weight="bold">1</text>
        <text x="40" y="20" font-size="14" font-weight="bold" fill="#92400E">分数与小数</text>
        <text x="40" y="38" font-size="12" fill="#B45309">复习P5基础，预习P6进阶运算</text>
    </g>
    
    <g transform="translate(325, 190)">
        <rect width="230" height="45" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
        <circle cx="20" cy="22.5" r="10" fill="#3B82F6"/>
        <text x="20" y="27" text-anchor="middle" font-size="12" fill="white" font-weight="bold">2</text>
        <text x="40" y="20" font-size="14" font-weight="bold" fill="#1E40AF">几何与图形</text>
        <text x="40" y="38" font-size="12" fill="#2563EB">面积、体积公式复习与预习</text>
    </g>
    
    <g transform="translate(325, 245)">
        <rect width="230" height="45" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
        <circle cx="20" cy="22.5" r="10" fill="#10B981"/>
        <text x="20" y="27" text-anchor="middle" font-size="12" fill="white" font-weight="bold">3</text>
        <text x="40" y="20" font-size="14" font-weight="bold" fill="#065F46">应用题策略</text>
        <text x="40" y="38" font-size="12" fill="#047857">学习分析复杂数量关系的方法</text>
    </g>
    
    <g transform="translate(325, 300)">
        <rect width="230" height="45" rx="8" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1"/>
        <circle cx="20" cy="22.5" r="10" fill="#8B5CF6"/>
        <text x="20" y="27" text-anchor="middle" font-size="12" fill="white" font-weight="bold">4</text>
        <text x="40" y="20" font-size="14" font-weight="bold" fill="#5B21B6">代数初步</text>
        <text x="40" y="38" font-size="12" fill="#7C3AED">用字母表示数，简单方程概念</text>
    </g>
    
    <!-- 连接箭头 -->
    <line x1="555" y1="158" x2="555" y2="190" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAccent)"/>
    <line x1="555" y1="213" x2="555" y2="245" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowMain)"/>
    <line x1="555" y1="268" x2="555" y2="300" stroke="#10B981" stroke-width="2" marker-end="url(#arrowSuccess)"/>
    
    <!-- 底部学习建议 -->
    <rect x="30" y="360" width="540" height="30" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="300" y="380" text-anchor="middle" font-size="14" fill="#065F46">💡 每日20分钟练习 + 每周1次弱项测试 = 数学能力稳步提升！</text>
    
    <!-- 小装饰元素 -->
    <circle cx="565" cy="145" r="6" fill="#F59E0B" opacity="0.3"/>
    <circle cx="565" cy="230" r="6" fill="#3B82F6" opacity="0.3"/>
    <circle cx="565" cy="315" r="6" fill="#8B5CF6" opacity="0.3"/>
</svg>