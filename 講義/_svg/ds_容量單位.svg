<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1ecf1;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#2c3e50" flood-opacity="0.25"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.5"/>
    </filter>

    <!-- 量杯3D陰影 -->
    <filter id="beakerShadow" x="-10%" y="-5%" width="130%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#1a252f" flood-opacity="0.35"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.3"/>
    </filter>

    <!-- 內部陰影 -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- 量杯玻璃漸變 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8d4e3;stop-opacity:0.7" />
      <stop offset="15%" style="stop-color:#e8f4f8;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="85%" style="stop-color:#d4e9f0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a0c4d6;stop-opacity:0.6" />
    </linearGradient>

    <!-- 液體漸變（水） -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5dade2;stop-opacity:0.85" />
      <stop offset="40%" style="stop-color:#2e86c1;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1b4f72;stop-opacity:0.95" />
    </linearGradient>

    <!-- 液體表面放射漸變 -->
    <radialGradient id="waterSurface" cx="45%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#85c1e9;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#5dade2;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#2e86c1;stop-opacity:0.5" />
    </radialGradient>

    <!-- 高光漸變 -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- 階梯卡片漸變 -->
    <linearGradient id="stepCardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="stepCardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f4fd;stop-opacity:1" />
    </linearGradient>

    <!-- 箭頭漸變 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>

    <!-- 刻度線標記 -->
    <linearGradient id="scaleLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:0.4" />
    </linearGradient>

    <!-- 發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="600" height="400" rx="20" ry="20" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="30" fill="#ffffff" opacity="0.15"/>
  <circle cx="550" cy="350" r="40" fill="#ffffff" opacity="0.1"/>
  <circle cx="520" cy="60" r="20" fill="#ffffff" opacity="0.12"/>

  <!-- 主標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50" letter-spacing="2">
    📐 容量單位 · 階梯關係
  </text>
  <line x1="180" y1="48" x2="420" y2="48" stroke="#3498db" stroke-width="2" opacity="0.5"/>

  <!-- ========== 量杯區域（左側） ========== -->
  <g transform="translate(55, 65)" filter="url(#beakerShadow)">
    <!-- 量杯主體（梯形） -->
    <path d="M15,20 L25,220 L135,220 L145,20 Z" fill="url(#glassGrad)" stroke="#7fb3d3" stroke-width="2"/>

    <!-- 量杯底部 -->
    <rect x="22" y="218" width="116" height="8" rx="2" fill="#a0c4d6" opacity="0.6"/>

    <!-- 量杯邊緣 -->
    <path d="M10,20 L15,20 L25,220 L135,220 L145,20 L150,20" fill="none" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 液體 -->
    <path d="M25,160 L135,160 L135,218 L25,218 Z" fill="url(#waterGrad)" opacity="0.85"/>

    <!-- 液體表面 -->
    <ellipse cx="80" cy="160" rx="55" ry="6" fill="url(#waterSurface)" opacity="0.9"/>

    <!-- 液體表面高光 -->
    <ellipse cx="70" cy="159" rx="30" ry="3" fill="#ffffff" opacity="0.3"/>

    <!-- 量杯高光條 -->
    <path d="M35,30 L40,200" stroke="url(#highlight)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

    <!-- 小高光 -->
    <path d="M120,40 L122,100" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25"/>

    <!-- 刻度線 -->
    <g stroke="url(#scaleLineGrad)" stroke-width="1.5">
      <!-- 1000mL (1L) -->
      <line x1="140" y1="160" x2="155" y2="160" stroke-width="2.5"/>
      <text x="158" y="164" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">1000 mL</text>

      <!-- 750mL -->
      <line x1="140" y1="175" x2="152" y2="175"/>
      <text x="155" y="179" font-family="Arial, sans-serif" font-size="9" fill="#5d6d7e">750 mL</text>

      <!-- 500mL -->
      <line x1="140" y1="190" x2="152" y2="190" stroke-width="2"/>
      <text x="155" y="194" font-family="Arial, sans-serif" font-size="9" fill="#5d6d7e">500 mL</text>

      <!-- 250mL -->
      <line x1="140" y1="205" x2="152" y2="205"/>
      <text x="155" y="209" font-family="Arial, sans-serif" font-size="9" fill="#5d6d7e">250 mL</text>
    </g>

    <!-- 刻度裝飾點 -->
    <circle cx="140" cy="160" r="3" fill="#2e86c1"/>
    <circle cx="140" cy="190" r="2.5" fill="#3498db"/>
    <circle cx="140" cy="175" r="2" fill="#5dade2"/>
    <circle cx="140" cy="205" r="2" fill="#5dade2"/>

    <!-- 量杯標籤 -->
    <text x="80" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50" font-weight="bold">
      量杯
    </text>
    <text x="80" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">
      1 L = 1000 mL
    </text>
  </g>

  <!-- ========== 階梯關係卡片（右側） ========== -->
  <g transform="translate(230, 60)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="345" height="310" rx="16" ry="16" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>

    <!-- 卡片頂部裝飾條 -->
    <rect x="0" y="0" width="345" height="8" rx="4" fill="url(#arrowGrad)"/>

    <!-- 階梯標題 -->
    <text x="172" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
      容量階梯
    </text>

    <!-- ===== 階梯 1: mL ===== -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="120" height="45" rx="10" ry="10" fill="url(#stepCardGrad1)" stroke="#3498db" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">毫升</text>
      <text x="60" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5d6d7e">milliliter (mL)</text>
    </g>

    <!-- 向下箭頭 1 -->
    <g transform="translate(85, 100)">
      <polygon points="0,0 15,12 30,0" fill="url(#arrowGrad)" opacity="0.8"/>
      <text x="15" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c" font-weight="bold">×1000</text>
    </g>

    <!-- ===== 階梯 2: L ===== -->
    <g transform="translate(30, 130)">
      <rect x="0" y="0" width="120" height="45" rx="10" ry="10" fill="url(#stepCardGrad2)" stroke="#e67e22" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">升</text>
      <text x="60" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5d6d7e">liter (L)</text>
    </g>

    <!-- 向上箭頭 2 -->
    <g transform="translate(85, 175)">
      <polygon points="30,0 15,12 0,0" fill="#27ae60" opacity="0.8"/>
      <text x="15" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60" font-weight="bold">÷1000</text>
    </g>

    <!-- ===== 換算公式卡片 ===== -->
    <g transform="translate(175, 60)">
      <rect x="0" y="0" width="145" height="100" rx="12" ry="12" fill="#f0f8ff" stroke="#5dade2" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="72" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">換算公式</text>
      <line x1="20" y1="38" x2="125" y2="38" stroke="#5dade2" stroke-width="1" opacity="0.5"/>
      <text x="72" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e74c3c">1 L</text>
      <text x="72" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">=</text>
      <text x="72" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2980b9">1000 mL</text>
    </g>

    <!-- ===== 實例卡片 ===== -->
    <g transform="translate(175, 175)">
      <rect x="0" y="0" width="145" height="115" rx="12" ry="12" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="72" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">生活實例</text>
      <line x1="20" y1="35" x2="125" y2="35" stroke="#f39c12" stroke-width="1" opacity="0.5"/>

      <!-- 牛奶盒圖示 -->
      <rect x="20" y="45" width="18" height="24" rx="3" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
      <text x="29" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#e74c3c" font-weight="bold">奶</text>
      <text x="55" y="60" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">1 L 牛奶</text>

      <!-- 水樽圖示 -->
      <rect x="20" y="78" width="14" height="22" rx="4" fill="#ffffff" stroke="#3498db" stroke-width="1.5"/>
      <rect x="23" y="75" width="8" height="5" rx="2" fill="#3498db"/>
      <text x="55" y="93" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">500 mL 水</text>
    </g>

    <!-- ===== 小提示 ===== -->
    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="290" height="50" rx="10" ry="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text x="15" y="22" font-family="Arial, sans-serif" font-size="11" fill="#1e8449" font-weight="bold">💡 小提示：</text>
      <text x="15" y="40" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">由 L 換算至 mL 要 ×1000，由 mL 換算至 L 要 ÷1000</text>
    </g>
  </g>

  <!-- 底部裝飾 -->
  <text x="300" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#95a5a6" opacity="0.7">
    香港小學數學 · 容量單位 · 1L = 1000mL
  </text>
</svg>