<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </radialGradient>

    <!-- 卡片主體漸變（多層） -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFE"/>
      <stop offset="100%" stop-color="#E8EDF5"/>
    </linearGradient>

    <!-- 卡片3D光影效果 -->
    <linearGradient id="cardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.05)"/>
    </linearGradient>

    <!-- 數線漸變 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#357ABD"/>
    </linearGradient>

    <!-- 數字標記漸變 -->
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A9AE0"/>
      <stop offset="100%" stop-color="#2E6DA4"/>
    </linearGradient>

    <!-- 跳躍箭頭漸變（8→13） -->
    <linearGradient id="arrowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E85D2C"/>
    </linearGradient>

    <!-- 跳躍箭頭漸變（0→8） -->
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#36B5AD"/>
    </linearGradient>

    <!-- 放射漸變光暈 -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,107,53,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,107,53,0)"/>
    </radialGradient>

    <!-- 雙層陰影過濾器 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.12)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 輕微陰影 -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowhead1" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#E85D2C"/>
    </marker>
    <marker id="arrowhead2" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#36B5AD"/>
    </marker>

    <!-- 跳躍圓點漸變 -->
    <radialGradient id="dotGrad1" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#E85D2C"/>
    </radialGradient>
    <radialGradient id="dotGrad2" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#6EDDD6"/>
      <stop offset="100%" stop-color="#36B5AD"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- 主卡片 -->
  <rect x="25" y="25" width="550" height="350" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="25" y="25" width="550" height="350" rx="20" ry="20" fill="url(#cardShine)"/>

  <!-- 標題 -->
  <text x="300" y="65" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="22" font-weight="bold" fill="#2C3E50" letter-spacing="2">
    數線跳躍加法：8 + 5 = 13
  </text>

  <!-- 裝飾線 -->
  <line x1="100" y1="80" x2="500" y2="80" stroke="url(#lineGrad)" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

  <!-- 數線主體 -->
  <g transform="translate(50, 180)">
    <!-- 數線背景條 -->
    <rect x="0" y="-6" width="500" height="12" rx="6" fill="#E8EDF5" opacity="0.5"/>

    <!-- 數線主線 -->
    <line x1="0" y1="0" x2="500" y2="0" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- 刻度標記和數字 -->
    <!-- 0 -->
    <line x1="0" y1="-12" x2="0" y2="12" stroke="url(#markGrad)" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="32" text-anchor="middle" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" fill="#4A90D9">0</text>

    <!-- 5 -->
    <line x1="125" y1="-8" x2="125" y2="8" stroke="#A0C4E8" stroke-width="2" stroke-linecap="round"/>
    <text x="125" y="28" text-anchor="middle" font-family="'Arial', sans-serif" font-size="13" fill="#7FB3E0">5</text>

    <!-- 8（起點） -->
    <line x1="200" y1="-14" x2="200" y2="14" stroke="#4ECDC4" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="200" cy="0" r="6" fill="url(#dotGrad2)" filter="url(#softShadow)"/>
    <text x="200" y="34" text-anchor="middle" font-family="'Arial', sans-serif" font-size="17" font-weight="bold" fill="#36B5AD">8</text>

    <!-- 10 -->
    <line x1="250" y1="-8" x2="250" y2="8" stroke="#A0C4E8" stroke-width="2" stroke-linecap="round"/>
    <text x="250" y="28" text-anchor="middle" font-family="'Arial', sans-serif" font-size="13" fill="#7FB3E0">10</text>

    <!-- 13（終點） -->
    <line x1="325" y1="-14" x2="325" y2="14" stroke="#FF6B35" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="325" cy="0" r="6" fill="url(#dotGrad1)" filter="url(#softShadow)"/>
    <text x="325" y="34" text-anchor="middle" font-family="'Arial', sans-serif" font-size="17" font-weight="bold" fill="#E85D2C">13</text>

    <!-- 15 -->
    <line x1="375" y1="-8" x2="375" y2="8" stroke="#A0C4E8" stroke-width="2" stroke-linecap="round"/>
    <text x="375" y="28" text-anchor="middle" font-family="'Arial', sans-serif" font-size="13" fill="#7FB3E0">15</text>

    <!-- 20 -->
    <line x1="500" y1="-12" x2="500" y2="12" stroke="url(#markGrad)" stroke-width="3" stroke-linecap="round"/>
    <text x="500" y="32" text-anchor="middle" font-family="'Arial', sans-serif" font-size="16" font-weight="bold" fill="#4A90D9">20</text>

    <!-- 跳躍箭頭 8→13（+5） -->
    <g filter="url(#softShadow)">
      <!-- 箭頭弧線 -->
      <path d="M210,-25 Q270,-55 315,-30" stroke="url(#arrowGrad1)" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#arrowhead1)"/>
    </g>

    <!-- 跳躍箭頭 0→8（+8） -->
    <g filter="url(#softShadow)">
      <path d="M10,-50 Q105,-80 190,-55" stroke="url(#arrowGrad2)" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#arrowhead2)"/>
    </g>

    <!-- 放射光暈在13位置 -->
    <circle cx="325" cy="0" r="30" fill="url(#glowGrad)" opacity="0.6"/>
  </g>

  <!-- 標籤：+5 -->
  <rect x="248" y="108" width="50" height="28" rx="14" fill="#FF6B35" opacity="0.15"/>
  <text x="273" y="127" text-anchor="middle" font-family="'Arial', sans-serif" font-size="18" font-weight="bold" fill="#E85D2C">+5</text>

  <!-- 標籤：+8 -->
  <rect x="108" y="83" width="50" height="28" rx="14" fill="#4ECDC4" opacity="0.15"/>
  <text x="133" y="102" text-anchor="middle" font-family="'Arial', sans-serif" font-size="18" font-weight="bold" fill="#36B5AD">+8</text>

  <!-- 底部算式卡片 -->
  <g transform="translate(175, 290)">
    <rect x="0" y="0" width="250" height="55" rx="15" fill="#2C3E50" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="250" height="55" rx="15" fill="url(#cardShine)" opacity="0.1"/>

    <text x="125" y="35" text-anchor="middle" font-family="'Arial', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" letter-spacing="3">
      8 + 5 = 13
    </text>
  </g>

  <!-- 裝飾小圓點 -->
  <circle cx="45" cy="45" r="4" fill="#4ECDC4" opacity="0.3"/>
  <circle cx="555" cy="45" r="4" fill="#FF6B35" opacity="0.3"/>
  <circle cx="45" cy="355" r="4" fill="#FF6B35" opacity="0.3"/>
  <circle cx="555" cy="355" r="4" fill="#4ECDC4" opacity="0.3"/>
</svg>