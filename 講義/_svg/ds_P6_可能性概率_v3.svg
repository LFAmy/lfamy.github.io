<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="50%" stop-color="#dce6f5"/>
      <stop offset="100%" stop-color="#b8cce0"/>
    </radialGradient>

    <!-- 卡片漸變 - 第一層分支 -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>

    <!-- 卡片漸變 - 第二層分支左 -->
    <linearGradient id="cardGrad2L" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>

    <!-- 卡片漸變 - 第二層分支右 -->
    <linearGradient id="cardGrad2R" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- 結果節點漸變 -->
    <linearGradient id="resultGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>

    <!-- 3D 光影效果 - 高光 -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000040"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00000020"/>
    </filter>

    <!-- 雙層陰影 - 內陰影 -->
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff60" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>

    <!-- 節點光暈 -->
    <radialGradient id="nodeGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff80"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </radialGradient>

    <!-- 連接線漸變 -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>

    <linearGradient id="lineGrad2L" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>

    <linearGradient id="lineGrad2R" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" ry="20" fill="url(#bgGrad)"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50" letter-spacing="2">
    概率樹狀圖
  </text>
  <text x="300" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    擲兩次硬幣的結果
  </text>

  <!-- ===== 連接線 ===== -->

  <!-- 根節點到左分支 (第一層) -->
  <path d="M 300 95 C 250 130, 200 140, 180 160" stroke="url(#lineGrad1)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 根節點到右分支 (第一層) -->
  <path d="M 300 95 C 350 130, 400 140, 420 160" stroke="url(#lineGrad1)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 左節點到左左 (第二層) -->
  <path d="M 155 195 C 130 230, 110 250, 100 270" stroke="url(#lineGrad2L)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 左節點到左右 (第二層) -->
  <path d="M 185 195 C 200 230, 210 250, 220 270" stroke="url(#lineGrad2L)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 右節點到右左 (第二層) -->
  <path d="M 415 195 C 390 230, 380 250, 370 270" stroke="url(#lineGrad2R)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 右節點到右右 (第二層) -->
  <path d="M 445 195 C 470 230, 490 250, 500 270" stroke="url(#lineGrad2R)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- ===== 概率標籤 ===== -->
  <text x="230" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#764ba2">P = ½</text>
  <text x="370" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#764ba2">P = ½</text>

  <text x="120" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f5576c">P = ½</text>
  <text x="210" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f5576c">P = ½</text>
  <text x="390" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4facfe">P = ½</text>
  <text x="490" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4facfe">P = ½</text>

  <!-- ===== 節點卡片 ===== -->

  <!-- 根節點 (圓形) -->
  <g filter="url(#cardShadow)">
    <circle cx="300" cy="80" r="28" fill="url(#cardGrad1)"/>
    <circle cx="300" cy="80" r="28" fill="url(#nodeGlow)"/>
    <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">開始</text>
  </g>

  <!-- 第一層左節點 -->
  <g filter="url(#cardShadow)">
    <rect x="130" y="155" width="50" height="40" rx="12" ry="12" fill="url(#cardGrad2L)"/>
    <rect x="130" y="155" width="50" height="40" rx="12" ry="12" fill="url(#nodeGlow)"/>
    <text x="155" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">正</text>
  </g>

  <!-- 第一層右節點 -->
  <g filter="url(#cardShadow)">
    <rect x="420" y="155" width="50" height="40" rx="12" ry="12" fill="url(#cardGrad2R)"/>
    <rect x="420" y="155" width="50" height="40" rx="12" ry="12" fill="url(#nodeGlow)"/>
    <text x="445" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">反</text>
  </g>

  <!-- ===== 結果節點 (第二層) ===== -->

  <!-- 正正 -->
  <g filter="url(#innerGlow)">
    <rect x="70" y="268" width="60" height="45" rx="10" ry="10" fill="url(#resultGrad)"/>
    <rect x="70" y="268" width="60" height="45" rx="10" ry="10" fill="url(#nodeGlow)"/>
    <text x="100" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a5a3a">正正</text>
    <text x="100" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a5a3a">P = ¼</text>
  </g>

  <!-- 正反 -->
  <g filter="url(#innerGlow)">
    <rect x="190" y="268" width="60" height="45" rx="10" ry="10" fill="url(#resultGrad)"/>
    <rect x="190" y="268" width="60" height="45" rx="10" ry="10" fill="url(#nodeGlow)"/>
    <text x="220" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a5a3a">正反</text>
    <text x="220" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a5a3a">P = ¼</text>
  </g>

  <!-- 反正 -->
  <g filter="url(#innerGlow)">
    <rect x="340" y="268" width="60" height="45" rx="10" ry="10" fill="url(#resultGrad)"/>
    <rect x="340" y="268" width="60" height="45" rx="10" ry="10" fill="url(#nodeGlow)"/>
    <text x="370" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a5a3a">反正</text>
    <text x="370" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a5a3a">P = ¼</text>
  </g>

  <!-- 反反 -->
  <g filter="url(#innerGlow)">
    <rect x="470" y="268" width="60" height="45" rx="10" ry="10" fill="url(#resultGrad)"/>
    <rect x="470" y="268" width="60" height="45" rx="10" ry="10" fill="url(#nodeGlow)"/>
    <text x="500" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a5a3a">反反</text>
    <text x="500" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1a5a3a">P = ¼</text>
  </g>

  <!-- ===== 底部總結卡片 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="140" y="340" width="320" height="45" rx="14" ry="14" fill="#2c3e50" opacity="0.85"/>
    <rect x="140" y="340" width="320" height="45" rx="14" ry="14" fill="url(#nodeGlow)"/>
    <text x="300" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
      所有結果概率總和：¼ + ¼ + ¼ + ¼ = 1
    </text>
    <text x="300" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a0b4c8">
      每個結果的機率相等
    </text>
  </g>

  <!-- 裝飾性小點 -->
  <circle cx="48" cy="30" r="4" fill="#667eea" opacity="0.3"/>
  <circle cx="555" cy="28" r="3" fill="#f093fb" opacity="0.3"/>
  <circle cx="40" cy="370" r="3.5" fill="#4facfe" opacity="0.25"/>
  <circle cx="565" cy="375" r="3" fill="#43e97b" opacity="0.25"/>
</svg>