<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1ecf1;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>

    <!-- 頂面漸變（黃色） -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD93D" />
      <stop offset="40%" style="stop-color:#FFC107" />
      <stop offset="100%" style="stop-color:#FFB300" />
    </linearGradient>

    <!-- 正面漸變（橙色） -->
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A65" />
      <stop offset="50%" style="stop-color:#FF7043" />
      <stop offset="100%" style="stop-color:#F4511E" />
    </linearGradient>

    <!-- 側面漸變（深橙色） -->
    <linearGradient id="sideFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E64A19" />
      <stop offset="100%" style="stop-color:#BF360C" />
    </linearGradient>

    <!-- 單位立方體頂面漸變 -->
    <linearGradient id="unitTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE082" />
      <stop offset="100%" style="stop-color:#FFD54F" />
    </linearGradient>

    <!-- 單位立方體正面漸變 -->
    <linearGradient id="unitFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFAB91" />
      <stop offset="100%" style="stop-color:#FF8A65" />
    </linearGradient>

    <!-- 單位立方體側面漸變 -->
    <linearGradient id="unitSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043" />
      <stop offset="100%" style="stop-color:#E64A19" />
    </linearGradient>

    <!-- 放射漸變光暈 -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <filter id="innerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <filter id="cubeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- 雙層陰影 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
      <feDropShadow dx="-1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 裝飾背景圓點 -->
  <circle cx="50" cy="50" r="3" fill="#b8d4e3" opacity="0.5"/>
  <circle cx="150" cy="30" r="2" fill="#b8d4e3" opacity="0.4"/>
  <circle cx="500" cy="60" r="4" fill="#b8d4e3" opacity="0.3"/>
  <circle cx="550" cy="350" r="3" fill="#b8d4e3" opacity="0.4"/>
  <circle cx="80" cy="370" r="2" fill="#b8d4e3" opacity="0.5"/>
  <circle cx="450" cy="380" r="3" fill="#b8d4e3" opacity="0.3"/>

  <!-- 主卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="url(#glow)"/>

  <!-- 標題區域 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="#2c3e50" letter-spacing="2">📐 長方體體積 — 單位立方體分解</text>
  <line x1="100" y1="70" x2="500" y2="70" stroke="#FFB300" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- ==================== 3D 長方體 ==================== -->
  <!-- 座標設定：長方體左下角在 (120, 320)，長=4格，寬=3格，高=2格，每格大小=35px -->
  <!-- 等角投影：dx=20, dy=-10 -->

  <!-- 底層 (第1層) 單位立方體 -->
  <!-- 第1層：z=0，4列×3行 -->

  <!-- 底層：先繪製遠端到近端 -->

  <!-- 行0 (最遠行) -->
  <!-- 列0 -->
  <polygon points="120,320 140,310 175,310 155,320" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="120,320 155,320 155,355 120,355" fill="url(#unitFront)"/>
  <polygon points="155,320 175,310 175,345 155,355" fill="url(#unitSide)"/>

  <!-- 列1 -->
  <polygon points="155,320 175,310 210,310 190,320" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="155,320 190,320 190,355 155,355" fill="url(#unitFront)"/>
  <polygon points="190,320 210,310 210,345 190,355" fill="url(#unitSide)"/>

  <!-- 列2 -->
  <polygon points="190,320 210,310 245,310 225,320" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="190,320 225,320 225,355 190,355" fill="url(#unitFront)"/>
  <polygon points="225,320 245,310 245,345 225,355" fill="url(#unitSide)"/>

  <!-- 列3 -->
  <polygon points="225,320 245,310 280,310 260,320" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="225,320 260,320 260,355 225,355" fill="url(#unitFront)"/>
  <polygon points="260,320 280,310 280,345 260,355" fill="url(#unitSide)"/>

  <!-- 行1 (中間行) -->
  <!-- 列0 -->
  <polygon points="100,340 120,330 155,330 135,340" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="100,340 135,340 135,375 100,375" fill="url(#unitFront)"/>
  <polygon points="135,340 155,330 155,365 135,375" fill="url(#unitSide)"/>

  <!-- 列1 -->
  <polygon points="135,340 155,330 190,330 170,340" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="135,340 170,340 170,375 135,375" fill="url(#unitFront)"/>
  <polygon points="170,340 190,330 190,365 170,375" fill="url(#unitSide)"/>

  <!-- 列2 -->
  <polygon points="170,340 190,330 225,330 205,340" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="170,340 205,340 205,375 170,375" fill="url(#unitFront)"/>
  <polygon points="205,340 225,330 225,365 205,375" fill="url(#unitSide)"/>

  <!-- 列3 -->
  <polygon points="205,340 225,330 260,330 240,340" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="205,340 240,340 240,375 205,375" fill="url(#unitFront)"/>
  <polygon points="240,340 260,330 260,365 240,375" fill="url(#unitSide)"/>

  <!-- 行2 (最近行) -->
  <!-- 列0 -->
  <polygon points="80,360 100,350 135,350 115,360" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="80,360 115,360 115,395 80,395" fill="url(#unitFront)"/>
  <polygon points="115,360 135,350 135,385 115,395" fill="url(#unitSide)"/>

  <!-- 列1 -->
  <polygon points="115,360 135,350 170,350 150,360" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="115,360 150,360 150,395 115,395" fill="url(#unitFront)"/>
  <polygon points="150,360 170,350 170,385 150,395" fill="url(#unitSide)"/>

  <!-- 列2 -->
  <polygon points="150,360 170,350 205,350 185,360" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="150,360 185,360 185,395 150,395" fill="url(#unitFront)"/>
  <polygon points="185,360 205,350 205,385 185,395" fill="url(#unitSide)"/>

  <!-- 列3 -->
  <polygon points="185,360 205,350 240,350 220,360" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="185,360 220,360 220,395 185,395" fill="url(#unitFront)"/>
  <polygon points="220,360 240,350 240,385 220,395" fill="url(#unitSide)"/>

  <!-- 第2層 (上層) 單位立方體 -->
  <!-- 第2層：z=1，4列×3行，y方向偏移 -35 -->

  <!-- 行0 (最遠行) -->
  <!-- 列0 -->
  <polygon points="120,285 140,275 175,275 155,285" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="120,285 155,285 155,320 120,320" fill="url(#unitFront)"/>
  <polygon points="155,285 175,275 175,310 155,320" fill="url(#unitSide)"/>

  <!-- 列1 -->
  <polygon points="155,285 175,275 210,275 190,285" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="155,285 190,285 190,320 155,320" fill="url(#unitFront)"/>
  <polygon points="190,285 210,275 210,310 190,320" fill="url(#unitSide)"/>

  <!-- 列2 -->
  <polygon points="190,285 210,275 245,275 225,285" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="190,285 225,285 225,320 190,320" fill="url(#unitFront)"/>
  <polygon points="225,285 245,275 245,310 225,320" fill="url(#unitSide)"/>

  <!-- 列3 -->
  <polygon points="225,285 245,275 280,275 260,285" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="225,285 260,285 260,320 225,320" fill="url(#unitFront)"/>
  <polygon points="260,285 280,275 280,310 260,320" fill="url(#unitSide)"/>

  <!-- 行1 (中間行) -->
  <!-- 列0 -->
  <polygon points="100,305 120,295 155,295 135,305" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="100,305 135,305 135,340 100,340" fill="url(#unitFront)"/>
  <polygon points="135,305 155,295 155,330 135,340" fill="url(#unitSide)"/>

  <!-- 列1 -->
  <polygon points="135,305 155,295 190,295 170,305" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="135,305 170,305 170,340 135,340" fill="url(#unitFront)"/>
  <polygon points="170,305 190,295 190,330 170,340" fill="url(#unitSide)"/>

  <!-- 列2 -->
  <polygon points="170,305 190,295 225,295 205,305" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="170,305 205,305 205,340 170,340" fill="url(#unitFront)"/>
  <polygon points="205,305 225,295 225,330 205,340" fill="url(#unitSide)"/>

  <!-- 列3 -->
  <polygon points="205,305 225,295 260,295 240,305" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="205,305 240,305 240,340 205,340" fill="url(#unitFront)"/>
  <polygon points="240,305 260,295 260,330 240,340" fill="url(#unitSide)"/>

  <!-- 行2 (最近行) -->
  <!-- 列0 -->
  <polygon points="80,325 100,315 135,315 115,325" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="80,325 115,325 115,360 80,360" fill="url(#unitFront)"/>
  <polygon points="115,325 135,315 135,350 115,360" fill="url(#unitSide)"/>

  <!-- 列1 -->
  <polygon points="115,325 135,315 170,315 150,325" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="115,325 150,325 150,360 115,360" fill="url(#unitFront)"/>
  <polygon points="150,325 170,315 170,350 150,360" fill="url(#unitSide)"/>

  <!-- 列2 -->
  <polygon points="150,325 170,315 205,315 185,325" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="150,325 185,325 185,360 150,360" fill="url(#unitFront)"/>
  <polygon points="185,325 205,315 205,350 185,360" fill="url(#unitSide)"/>

  <!-- 列3 -->
  <polygon points="185,325 205,315 240,315 220,325" fill="url(#unitTop)" filter="url(#cubeShadow)"/>
  <polygon points="185,325 220,325 220,360 185,360" fill="url(#unitFront)"/>
  <polygon points="220,325 240,315 240,350 220,360" fill="url(#unitSide)"/>

  <!-- ==================== 尺寸標註 ==================== -->

  <!-- 長度標註（4格） -->
  <line x1="80" y1="400" x2="260" y2="400" stroke="#E64A19" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="80" y1="395" x2="80" y2="405" stroke="#E64A19" stroke-width="1.5"/>
  <line x1="260" y1="395" x2="260" y2="405" stroke="#E64A19" stroke-width="1.5"/>
  <text x="170" y="412" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#E64A19" font-weight="bold">長 = 4 格</text>

  <!-- 寬度標註（3格） -->
  <line x1="75" y1="325" x2="75" y2="395" stroke="#FF8A65" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="70" y1="325" x2="80" y2="325" stroke="#FF8A65" stroke-width="1.5"/>
  <line x1="70" y1="395" x2="80" y2="395" stroke="#FF8A65" stroke-width="1.5"/>
  <text x="60" y="365" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#FF8A65" font-weight="bold" transform="rotate(-90,60,365)">寬 = 3 格</text>

  <!-- 高度標註（2層） -->
  <line x1="285" y1="275" x2="285" y2="355" stroke="#FFB300" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="280" y1="275" x2="290" y2="275" stroke="#FFB300" stroke-width="1.5"/>
  <line x1="280" y1="355" x2="290" y2="355" stroke="#FFB300" stroke-width="1.5"/>
  <text x="298" y="320" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#FFB300" font-weight="bold">高 = 2 層</text>

  <!-- ==================== 公式與計算 ==================== -->

  <!-- 公式卡片 -->
  <rect x="340" y="90" width="220" height="130" rx="12" ry="12" fill="#FFF8E1" filter="url(#doubleShadow)" stroke="#FFE082" stroke-width="1.5"/>

  <text x="450" y="118" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" fill="#E65100" font-weight="bold">📝 體積公式</text>

  <text x="450" y="148" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#5D4037">長 × 寬 × 高</text>

  <text x="450" y="175" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#5D4037">= 4 × 3 × 2</text>

  <text x="450" y="202" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" fill="#E64A19" font-weight="bold">= 24 個單位立方體</text>

  <!-- 層數說明 -->
  <rect x="340" y="235" width="220" height="55" rx="10" ry="10" fill="#E3F2FD" filter="url(#innerShadow)" stroke="#90CAF9" stroke-width="1"/>

  <text x="450" y="258" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#1565C0">📊 每層個數：4 × 3 = 12 個</text>
  <text x="450" y="278" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#1565C0">📦 層數：2 層 → 12 × 2 = 24 個</text>

  <!-- 裝飾小圖標 -->
  <circle cx="360" cy="310" r="8" fill="#FFB300" opacity="0.3"/>
  <circle cx="540" cy="310" r="6" fill="#FF8A65" opacity="0.3"/>
  <circle cx="360" cy="340" r="5" fill="#E64A19" opacity="0.2"/>
  <circle cx="540" cy="340" r="7" fill="#FFD93D" opacity="0.25"/>

</svg>