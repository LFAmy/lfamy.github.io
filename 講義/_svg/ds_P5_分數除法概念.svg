<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#E2E8F0" opacity="0.6"/>
    </pattern>
    <pattern id="grid-dot" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#CBD5E1" opacity="0.4"/>
    </pattern>

    <!-- 主色多層漸變 -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <!-- 強調色多層漸變 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- 放射漸變 3D光影 -->
    <radialGradient id="radialMain" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.6"/>
    </radialGradient>

    <radialGradient id="radialAccent" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FBBF24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.65"/>
    </radialGradient>

    <radialGradient id="radialGreen" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </radialGradient>

    <radialGradient id="radialRed" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F87171" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.6"/>
    </radialGradient>

    <radialGradient id="radialBlue" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.6"/>
    </radialGradient>

    <radialGradient id="radialPurple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    </radialGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="shadowDouble" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>

    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1E293B" flood-opacity="0.1"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.05"/>
    </filter>

    <!-- 箭頭定義 - 漸層箭頭 -->
    <marker id="arrowMain" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="url(#mainGrad)"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="url(#accentGrad)"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#10B981"/>
    </marker>

    <!-- 數線刻度標記 -->
    <linearGradient id="tickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#grid-dot)"/>

  <!-- 主卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="16" ry="16" fill="url(#cardBg)" filter="url(#shadowDouble)" stroke="url(#mainGrad)" stroke-width="2"/>

  <!-- 標題區域 -->
  <rect x="20" y="15" width="560" height="52" rx="16" ry="16" fill="url(#mainGrad)" opacity="0.12"/>
  <rect x="20" y="45" width="560" height="22" fill="url(#mainGrad)" opacity="0.08"/>

  <!-- 標題文字 -->
  <text x="40" y="48" font-family="'Microsoft JhengHei', 'Noto Sans HK', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E293B" letter-spacing="1">
    📐 分數除法 — 1 ÷ 1/3 = 3
  </text>
  <text x="40" y="65" font-family="'Microsoft JhengHei', 'Noto Sans HK', Arial, sans-serif" font-size="11" fill="#64748B">
    數線視覺化 · 每 1/3 段不同色 · 跳躍箭頭
  </text>

  <!-- 數線區域 -->
  <g transform="translate(40, 100)">
    <!-- 數線主線 -->
    <line x1="0" y1="60" x2="520" y2="60" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 刻度標記 0 到 3 -->
    <!-- 0 -->
    <line x1="0" y1="45" x2="0" y2="75" stroke="url(#tickGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="92" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">0</text>

    <!-- 1/3 -->
    <line x1="57.78" y1="50" x2="57.78" y2="70" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="57.78" y="88" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">1/3</text>

    <!-- 2/3 -->
    <line x1="115.56" y1="50" x2="115.56" y2="70" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="115.56" y="88" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">2/3</text>

    <!-- 1 -->
    <line x1="173.33" y1="45" x2="173.33" y2="75" stroke="url(#tickGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="173.33" y="92" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">1</text>

    <!-- 4/3 -->
    <line x1="231.11" y1="50" x2="231.11" y2="70" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="231.11" y="88" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">4/3</text>

    <!-- 5/3 -->
    <line x1="288.89" y1="50" x2="288.89" y2="70" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="288.89" y="88" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">5/3</text>

    <!-- 2 -->
    <line x1="346.67" y1="45" x2="346.67" y2="75" stroke="url(#tickGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="346.67" y="92" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">2</text>

    <!-- 7/3 -->
    <line x1="404.44" y1="50" x2="404.44" y2="70" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="404.44" y="88" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">7/3</text>

    <!-- 8/3 -->
    <line x1="462.22" y1="50" x2="462.22" y2="70" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="462.22" y="88" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">8/3</text>

    <!-- 3 -->
    <line x1="520" y1="45" x2="520" y2="75" stroke="url(#tickGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="520" y="92" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B" text-anchor="middle">3</text>

    <!-- 彩色區塊 - 每 1/3 段不同色 -->
    <!-- 第1段: 0→1/3 紫色 -->
    <rect x="0" y="52" width="57.78" height="16" rx="8" ry="8" fill="url(#radialPurple)" opacity="0.7" filter="url(#shadowLight)"/>
    <!-- 第2段: 1/3→2/3 藍色 -->
    <rect x="57.78" y="52" width="57.78" height="16" rx="8" ry="8" fill="url(#radialBlue)" opacity="0.7" filter="url(#shadowLight)"/>
    <!-- 第3段: 2/3→1 綠色 -->
    <rect x="115.56" y="52" width="57.78" height="16" rx="8" ry="8" fill="url(#radialGreen)" opacity="0.7" filter="url(#shadowLight)"/>
    <!-- 第4段: 1→4/3 紅色 -->
    <rect x="173.33" y="52" width="57.78" height="16" rx="8" ry="8" fill="url(#radialRed)" opacity="0.7" filter="url(#shadowLight)"/>
    <!-- 第5段: 4/3→5/3 紫色 -->
    <rect x="231.11" y="52" width="57.78" height="16" rx="8" ry="8" fill="url(#radialPurple)" opacity="0.7" filter="url(#shadowLight)"/>
    <!-- 第6段: 5/3→2 藍色 -->
    <rect x="288.89" y="52" width="57.78" height="16" rx="8" ry="8" fill="url(#radialBlue)" opacity="0.7" filter="url(#shadowLight)"/>
    <!-- 第7段: 2→7/3 綠色 -->
    <rect x="346.67" y="52" width="57.78" height="16" rx="8" ry="8" fill="url(#radialGreen)" opacity="0.7" filter="url(#shadowLight)"/>
    <!-- 第8段: 7/3→8/3 紅色 -->
    <rect x="404.44" y="52" width="57.78" height="16" rx="8" ry="8" fill="url(#radialRed)" opacity="0.7" filter="url(#shadowLight)"/>
    <!-- 第9段: 8/3→3 紫色 -->
    <rect x="462.22" y="52" width="57.78" height="16" rx="8" ry="8" fill="url(#radialPurple)" opacity="0.7" filter="url(#shadowLight)"/>

    <!-- 跳躍箭頭 1→2→3 -->
    <!-- 箭頭 1: 0→1 -->
    <path d="M5,35 Q86.67,10 168.33,35" fill="none" stroke="url(#mainGrad)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowMain)" filter="url(#shadowLight)"/>
    <text x="86.67" y="18" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#4F46E5" text-anchor="middle">第1個 1/3</text>

    <!-- 箭頭 2: 1→2 -->
    <path d="M178.33,35 Q260,10 341.67,35" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowAccent)" filter="url(#shadowLight)"/>
    <text x="260" y="18" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#D97706" text-anchor="middle">第2個 1/3</text>

    <!-- 箭頭 3: 2→3 -->
    <path d="M351.67,35 Q433.33,10 515,35" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowGreen)" filter="url(#shadowLight)"/>
    <text x="433.33" y="18" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">第3個 1/3</text>

    <!-- 大括號標示 1 單位 -->
    <path d="M173.33,110 Q173.33,125 173.33,130" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
    <path d="M173.33,130 Q260,140 346.67,130" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
    <path d="M346.67,130 Q346.67,125 346.67,110" fill="none" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="260" y="148" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="11" fill="#4F46E5" text-anchor="middle">1 個整體</text>
  </g>

  <!-- 底部解說 -->
  <g transform="translate(40, 290)">
    <!-- 解說卡片 -->
    <rect x="0" y="0" width="520" height="75" rx="12" ry="12" fill="#F1F5F9" filter="url(#shadowLight)" stroke="#E2E8F0" stroke-width="1"/>

    <text x="20" y="24" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">
      ✨ 解說：
    </text>
    <text x="20" y="44" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="13" fill="#334155">
      1 ÷ <tspan fill="#4F46E5" font-weight="bold">1/3</tspan> = 3
    </text>
    <text x="20" y="62" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="12" fill="#64748B">
      1 裡面有 3 個 <tspan fill="#4F46E5" font-weight="bold">1/3</tspan>，所以答案是 3。
    </text>

    <!-- 圖例 -->
    <rect x="340" y="12" width="12" height="12" rx="4" fill="url(#radialPurple)" opacity="0.8"/>
    <text x="358" y="23" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="10" fill="#64748B">第1段</text>

    <rect x="400" y="12" width="12" height="12" rx="4" fill="url(#radialBlue)" opacity="0.8"/>
    <text x="418" y="23" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="10" fill="#64748B">第2段</text>

    <rect x="460" y="12" width="12" height="12" rx="4" fill="url(#radialGreen)" opacity="0.8"/>
    <text x="478" y="23" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="10" fill="#64748B">第3段</text>
  </g>

  <!-- 右上角標籤 -->
  <rect x="480" y="28" width="85" height="24" rx="12" ry="12" fill="url(#accentGrad)" opacity="0.9" filter="url(#shadowLight)"/>
  <text x="522.5" y="44" font-family="'Microsoft JhengHei', Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P5 數學</text>
</svg>