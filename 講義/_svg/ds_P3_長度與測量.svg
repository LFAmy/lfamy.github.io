<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="50%" stop-color="#dce8f5"/>
      <stop offset="100%" stop-color="#b8cfe0"/>
    </radialGradient>

    <!-- 卡片主體漸變 - 3D光影效果 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8faff"/>
      <stop offset="70%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#dce6f2"/>
    </linearGradient>

    <!-- 卡片頂部高光 -->
    <linearGradient id="cardHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="20%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="80%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 尺子漸變 -->
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="15%" stop-color="#fff9d6"/>
      <stop offset="50%" stop-color="#fff3b0"/>
      <stop offset="85%" stop-color="#f5e89a"/>
      <stop offset="100%" stop-color="#e8d980"/>
    </linearGradient>

    <!-- 尺子3D邊緣 -->
    <linearGradient id="rulerEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e89a"/>
      <stop offset="100%" stop-color="#d4c470"/>
    </linearGradient>

    <!-- 物品A漸變 - 鉛筆 -->
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a56"/>
      <stop offset="50%" stop-color="#f08030"/>
      <stop offset="100%" stop-color="#d46520"/>
    </linearGradient>

    <!-- 物品B漸變 - 迴紋針 -->
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="50%" stop-color="#5ab0d4"/>
      <stop offset="100%" stop-color="#3a90b8"/>
    </linearGradient>

    <!-- 物品C漸變 - 橡皮擦 -->
    <linearGradient id="eraserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a9e"/>
      <stop offset="50%" stop-color="#f06a7e"/>
      <stop offset="100%" stop-color="#d05064"/>
    </linearGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2a4a6a" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3a5a" flood-opacity="0.15"/>
    </filter>

    <filter id="rulerShadow" x="-2%" y="-5%" width="108%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5a4a2a" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3a2a1a" flood-opacity="0.2"/>
    </filter>

    <filter id="itemShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#2a3a4a" flood-opacity="0.3"/>
    </filter>

    <!-- 放射漸變光暈 -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a5a8a"/>
      <stop offset="50%" stop-color="#4a7ab0"/>
      <stop offset="100%" stop-color="#2a5a8a"/>
    </linearGradient>

    <!-- 刻度線圖案 -->
    <pattern id="cmPattern" x="0" y="0" width="50" height="1" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#4a4a5a" stroke-width="1.5"/>
    </pattern>

    <pattern id="mmPattern" x="0" y="0" width="10" height="1" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#7a7a8a" stroke-width="0.8"/>
    </pattern>

    <pattern id="halfPattern" x="0" y="0" width="25" height="1" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#6a6a7a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="30" fill="rgba(255,255,255,0.15)"/>
  <circle cx="550" cy="350" r="40" fill="rgba(255,255,255,0.1)"/>
  <circle cx="520" cy="60" r="20" fill="rgba(255,255,255,0.12)"/>
  <circle cx="80" cy="340" r="25" fill="rgba(255,255,255,0.08)"/>

  <!-- 主卡片 - 圓角卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#cardShadow)"/>

  <!-- 卡片頂部高光條 -->
  <rect x="25" y="20" width="550" height="40" rx="20" ry="20" fill="url(#cardHighlight)" opacity="0.5"/>
  <rect x="25" y="20" width="550" height="20" rx="20" ry="20" fill="rgba(255,255,255,0.3)"/>

  <!-- 卡片邊框 -->
  <rect x="25" y="20" width="550" height="360" rx="20" ry="20" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" letter-spacing="2">
    📏 長度測量
  </text>

  <!-- 標題底線 -->
  <line x1="200" y1="68" x2="400" y2="68" stroke="url(#titleGrad)" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

  <!-- 尺子區域 -->
  <g transform="translate(50, 95)">
    <!-- 尺子陰影 -->
    <rect x="0" y="5" width="500" height="50" rx="6" ry="6" fill="rgba(0,0,0,0.1)" filter="url(#rulerShadow)"/>

    <!-- 尺子主體 -->
    <rect x="0" y="0" width="500" height="48" rx="6" ry="6" fill="url(#rulerGrad)" stroke="#d4c470" stroke-width="1"/>

    <!-- 尺子頂部高光 -->
    <rect x="2" y="2" width="496" height="12" rx="4" ry="4" fill="rgba(255,255,255,0.4)"/>

    <!-- cm刻度 - 每50px一個 -->
    <g stroke="#4a4a5a" stroke-width="1.5">
      <line x1="50" y1="0" x2="50" y2="14"/>
      <line x1="100" y1="0" x2="100" y2="14"/>
      <line x1="150" y1="0" x2="150" y2="14"/>
      <line x1="200" y1="0" x2="200" y2="14"/>
      <line x1="250" y1="0" x2="250" y2="14"/>
      <line x1="300" y1="0" x2="300" y2="14"/>
      <line x1="350" y1="0" x2="350" y2="14"/>
      <line x1="400" y1="0" x2="400" y2="14"/>
      <line x1="450" y1="0" x2="450" y2="14"/>
    </g>

    <!-- 半cm刻度 - 每25px一個 -->
    <g stroke="#6a6a7a" stroke-width="1">
      <line x1="25" y1="0" x2="25" y2="11"/>
      <line x1="75" y1="0" x2="75" y2="11"/>
      <line x1="125" y1="0" x2="125" y2="11"/>
      <line x1="175" y1="0" x2="175" y2="11"/>
      <line x1="225" y1="0" x2="225" y2="11"/>
      <line x1="275" y1="0" x2="275" y2="11"/>
      <line x1="325" y1="0" x2="325" y2="11"/>
      <line x1="375" y1="0" x2="375" y2="11"/>
      <line x1="425" y1="0" x2="425" y2="11"/>
      <line x1="475" y1="0" x2="475" y2="11"/>
    </g>

    <!-- mm刻度 - 每10px一個 -->
    <g stroke="#7a7a8a" stroke-width="0.6">
      <line x1="10" y1="0" x2="10" y2="7"/>
      <line x1="20" y1="0" x2="20" y2="7"/>
      <line x1="30" y1="0" x2="30" y2="7"/>
      <line x1="40" y1="0" x2="40" y2="7"/>
      <line x1="60" y1="0" x2="60" y2="7"/>
      <line x1="70" y1="0" x2="70" y2="7"/>
      <line x1="80" y1="0" x2="80" y2="7"/>
      <line x1="90" y1="0" x2="90" y2="7"/>
      <line x1="110" y1="0" x2="110" y2="7"/>
      <line x1="120" y1="0" x2="120" y2="7"/>
      <line x1="130" y1="0" x2="130" y2="7"/>
      <line x1="140" y1="0" x2="140" y2="7"/>
      <line x1="160" y1="0" x2="160" y2="7"/>
      <line x1="170" y1="0" x2="170" y2="7"/>
      <line x1="180" y1="0" x2="180" y2="7"/>
      <line x1="190" y1="0" x2="190" y2="7"/>
      <line x1="210" y1="0" x2="210" y2="7"/>
      <line x1="220" y1="0" x2="220" y2="7"/>
      <line x1="230" y1="0" x2="230" y2="7"/>
      <line x1="240" y1="0" x2="240" y2="7"/>
      <line x1="260" y1="0" x2="260" y2="7"/>
      <line x1="270" y1="0" x2="270" y2="7"/>
      <line x1="280" y1="0" x2="280" y2="7"/>
      <line x1="290" y1="0" x2="290" y2="7"/>
      <line x1="310" y1="0" x2="310" y2="7"/>
      <line x1="320" y1="0" x2="320" y2="7"/>
      <line x1="330" y1="0" x2="330" y2="7"/>
      <line x1="340" y1="0" x2="340" y2="7"/>
      <line x1="360" y1="0" x2="360" y2="7"/>
      <line x1="370" y1="0" x2="370" y2="7"/>
      <line x1="380" y1="0" x2="380" y2="7"/>
      <line x1="390" y1="0" x2="390" y2="7"/>
      <line x1="410" y1="0" x2="410" y2="7"/>
      <line x1="420" y1="0" x2="420" y2="7"/>
      <line x1="430" y1="0" x2="430" y2="7"/>
      <line x1="440" y1="0" x2="440" y2="7"/>
      <line x1="460" y1="0" x2="460" y2="7"/>
      <line x1="470" y1="0" x2="470" y2="7"/>
      <line x1="480" y1="0" x2="480" y2="7"/>
      <line x1="490" y1="0" x2="490" y2="7"/>
    </g>

    <!-- cm數字標記 -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#4a4a5a" text-anchor="middle">
      <text x="50" y="28">1</text>
      <text x="100" y="28">2</text>
      <text x="150" y="28">3</text>
      <text x="200" y="28">4</text>
      <text x="250" y="28">5</text>
      <text x="300" y="28">6</text>
      <text x="350" y="28">7</text>
      <text x="400" y="28">8</text>
      <text x="450" y="28">9</text>
    </g>

    <!-- 單位標記 -->
    <text x="490" y="28" font-family="Arial, sans-serif" font-size="10" fill="#6a6a7a" text-anchor="end">cm</text>

    <!-- 尺子起始0標記 -->
    <text x="5" y="28" font-family="Arial, sans-serif" font-size="10" fill="#4a4a5a" text-anchor="start">0</text>
  </g>

  <!-- 物品對比區域 -->
  <g transform="translate(50, 170)">

    <!-- 物品A：鉛筆（長度約7cm = 350px） -->
    <g filter="url(#itemShadow)">
      <!-- 鉛筆主體 -->
      <rect x="50" y="5" width="350" height="18" rx="2" ry="2" fill="url(#pencilGrad)"/>
      <!-- 鉛筆高光 -->
      <rect x="50" y="5" width="350" height="6" rx="2" ry="2" fill="rgba(255,255,255,0.3)"/>
      <!-- 鉛筆筆尖 -->
      <polygon points="400,5 420,14 400,23" fill="#f5deb3" stroke="#d4c470" stroke-width="0.5"/>
      <polygon points="400,5 420,14 400,23" fill="rgba(255,255,255,0.2)"/>
      <!-- 鉛筆筆芯 -->
      <polygon points="412,10 420,14 412,18" fill="#3a3a3a"/>
      <!-- 鉛筆橡皮擦頭 -->
      <rect x="40" y="5" width="12" height="18" rx="2" ry="2" fill="#f06a7e"/>
      <rect x="40" y="5" width="12" height="5" rx="2" ry="2" fill="rgba(255,255,255,0.3)"/>
      <!-- 金屬箍 -->
      <rect x="48" y="5" width="4" height="18" rx="1" ry="1" fill="#c0c0c0"/>
      <rect x="48" y="5" width="4" height="4" rx="1" ry="1" fill="rgba(255,255,255,0.4)"/>
    </g>

    <!-- 物品A標籤 -->
    <text x="50" y="38" font-family="Arial, sans-serif" font-size="12" fill="#d46520" font-weight="bold">
      鉛筆
    </text>
    <text x="90" y="38" font-family="Arial, sans-serif" font-size="11" fill="#7a7a8a">
      ≈ 7 cm
    </text>

    <!-- 物品A測量指示線 -->
    <line x1="50" y1="28" x2="50" y2="40" stroke="#d46520" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
    <line x1="400" y1="28" x2="400" y2="40" stroke="#d46520" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

    <!-- 物品B：迴紋針（長度約3cm = 150px） -->
    <g transform="translate(0, 55)" filter="url(#itemShadow)">
      <!-- 迴紋針外框 -->
      <rect x="50" y="5" width="150" height="18" rx="8" ry="8" fill="none" stroke="url(#clipGrad)" stroke-width="3"/>
      <!-- 迴紋針內框 -->
      <rect x="65" y="5" width="120" height="18" rx="6" ry="6" fill="none" stroke="url(#clipGrad)" stroke-width="2" opacity="0.6"/>
      <!-- 迴紋針高光 -->
      <rect x="50" y="5" width="150" height="6" rx="8" ry="8" fill="rgba(255,255,255,0.25)"/>
    </g>

    <!-- 物品B標籤 -->
    <text x="50" y="88" font-family="Arial, sans-serif" font-size="12" fill="#3a90b8" font-weight="bold">
      迴紋針
    </text>
    <text x="110" y="88" font-family="Arial, sans-serif" font-size="11" fill="#7a7a8a">
      ≈ 3 cm
    </text>

    <!-- 物品B測量指示線 -->
    <line x1="50" y1="78" x2="50" y2="90" stroke="#3a90b8" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
    <line x1="200" y1="78" x2="200" y2="90" stroke="#3a90b8" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

    <!-- 物品C：橡皮擦（長度約4.5cm = 225px） -->
    <g transform="translate(0, 105)" filter="url(#itemShadow)">
      <!-- 橡皮擦主體 -->
      <rect x="50" y="5" width="225" height="18" rx="3" ry="3" fill="url(#eraserGrad)"/>
      <!-- 橡皮擦高光 -->
      <rect x="50" y="5" width="225" height="6" rx="3" ry="3" fill="rgba(255,255,255,0.3)"/>
      <!-- 橡皮擦標籤條 -->
      <rect x="130" y="5" width="65" height="18" rx="0" ry="0" fill="rgba(255,255,255,0.2)"/>
      <text x="162" y="17" font-family="Arial, sans-serif" font-size="7" fill="rgba(255,255,255,0.7)" text-anchor="middle">橡皮</text>
    </g>

    <!-- 物品C標籤 -->
    <text x="50" y="138" font-family="Arial, sans-serif" font-size="12" fill="#d05064" font-weight="bold">
      橡皮擦
    </text>
    <text x="110" y="138" font-family="Arial, sans-serif" font-size="11" fill="#7a7a8a">
      ≈ 4.5 cm
    </text>

    <!-- 物品C測量指示線 -->
    <line x1="50" y1="128" x2="50" y2="140" stroke="#d05064" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
    <line x1="275" y1="128" x2="275" y2="140" stroke="#d05064" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  </g>

  <!-- 底部資訊 -->
  <g transform="translate(300, 365)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8a9aaa" opacity="0.7">
      香港小學數學 · 長度測量 · cm 與 mm
    </text>
  </g>

  <!-- 裝飾光暈 -->
  <circle cx="300" cy="200" r="180" fill="url(#glowGrad)" opacity="0.3" pointer-events="none"/>

</svg>