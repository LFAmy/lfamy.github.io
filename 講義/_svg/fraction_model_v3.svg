<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </radialGradient>

    <!-- 圓餅3D光影 - 上半部亮面 -->
    <radialGradient id="pieLight" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FF9A9E" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FAD0C4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F8B4B8" stop-opacity="0.5"/>
    </radialGradient>

    <!-- 圓餅1/2 - 紅色部分 -->
    <radialGradient id="pieRed" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#EE5A24"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </radialGradient>

    <!-- 圓餅1/2 - 白色部分 -->
    <radialGradient id="pieWhite" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </radialGradient>

    <!-- 圓餅外框光暈 -->
    <radialGradient id="pieBorder" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#2C3E50" stop-opacity="0.3"/>
    </radialGradient>

    <!-- 長條3D漸變 - 藍色 -->
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74B9FF"/>
      <stop offset="30%" stop-color="#0984E3"/>
      <stop offset="100%" stop-color="#0652DD"/>
    </linearGradient>

    <!-- 長條3D光影 - 上層 -->
    <linearGradient id="barShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <!-- 長條空白部分 -->
    <linearGradient id="barEmpty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F6FA"/>
      <stop offset="100%" stop-color="#DFE6E9"/>
    </linearGradient>

    <!-- 數線3D漸變 - 綠色 -->
    <linearGradient id="lineGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55EFC4"/>
      <stop offset="50%" stop-color="#00B894"/>
      <stop offset="100%" stop-color="#00A885"/>
    </linearGradient>

    <!-- 數線點3D -->
    <radialGradient id="dotGrad" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#81ECEC"/>
      <stop offset="50%" stop-color="#00CEC9"/>
      <stop offset="100%" stop-color="#00A8A8"/>
    </radialGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2D3436" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2D3436" flood-opacity="0.08"/>
    </filter>

    <filter id="innerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 3D圓餅陰影 -->
    <filter id="pieShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#2D3436" flood-opacity="0.25"/>
    </filter>

    <!-- 長條3D陰影 -->
    <filter id="barShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#2D3436" flood-opacity="0.2"/>
    </filter>

    <!-- 放射光暈 -->
    <radialGradient id="glowPie" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0984E3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0984E3" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00B894" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00B894" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="18" font-weight="700" fill="#2D3436" letter-spacing="1">
    分數模型
  </text>
  <text x="300" y="50" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="11" fill="#636E72" letter-spacing="0.5">
    1/2 · 2/3 · 3/4
  </text>

  <!-- ========== 卡片1：圓餅 1/2 ========== -->
  <g transform="translate(20, 65)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="175" height="310" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- 卡片頂部裝飾條 -->
    <rect x="0" y="0" width="175" height="6" rx="3" ry="3" fill="#FF6B6B"/>

    <!-- 放射光暈 -->
    <ellipse cx="87" cy="115" rx="75" ry="70" fill="url(#glowPie)"/>

    <!-- 標籤 -->
    <text x="87" y="30" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#2D3436">圓餅模型</text>
    <text x="87" y="46" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="11" fill="#636E72">1/2</text>

    <!-- 圓餅3D - 底部陰影 -->
    <ellipse cx="87" cy="145" rx="58" ry="58" fill="#000000" opacity="0.08" transform="translate(3, 5)"/>

    <!-- 圓餅外圈 -->
    <circle cx="87" cy="135" r="58" fill="#E0E0E0" stroke="#BDC3C7" stroke-width="0.5"/>

    <!-- 1/2 白色部分（右半） -->
    <path d="M87,77 A58,58 0 0,1 145,135 A58,58 0 0,1 87,193 Z" fill="url(#pieWhite)"/>

    <!-- 1/2 紅色部分（左半） -->
    <path d="M87,77 A58,58 0 0,0 29,135 A58,58 0 0,0 87,193 Z" fill="url(#pieRed)"/>

    <!-- 分割線 -->
    <line x1="87" y1="77" x2="87" y2="193" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 3D光影效果 - 上半部反光 -->
    <ellipse cx="72" cy="105" rx="30" ry="18" fill="#FFFFFF" opacity="0.25" transform="rotate(-20, 72, 105)"/>

    <!-- 3D邊緣光暈 -->
    <circle cx="87" cy="135" r="58" fill="none" stroke="url(#pieBorder)" stroke-width="3"/>

    <!-- 外框 -->
    <circle cx="87" cy="135" r="58" fill="none" stroke="#2C3E50" stroke-width="1.5" opacity="0.15"/>

    <!-- 分數標示 -->
    <text x="87" y="240" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#EE5A24">½</text>

    <!-- 說明 -->
    <text x="87" y="262" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="10" fill="#636E72">1份塗色，共2等份</text>

    <!-- 底部裝飾點 -->
    <circle cx="70" cy="290" r="3" fill="#FF6B6B" opacity="0.5"/>
    <circle cx="87" cy="290" r="3" fill="#FF6B6B" opacity="0.8"/>
    <circle cx="104" cy="290" r="3" fill="#FF6B6B" opacity="0.5"/>
  </g>

  <!-- ========== 卡片2：長條 2/3 ========== -->
  <g transform="translate(212, 65)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="175" height="310" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- 卡片頂部裝飾條 -->
    <rect x="0" y="0" width="175" height="6" rx="3" ry="3" fill="#0984E3"/>

    <!-- 放射光暈 -->
    <ellipse cx="87" cy="115" rx="75" ry="70" fill="url(#glowBar)"/>

    <!-- 標籤 -->
    <text x="87" y="30" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#2D3436">長條模型</text>
    <text x="87" y="46" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="11" fill="#636E72">2/3</text>

    <!-- 長條3D - 底部陰影 -->
    <rect x="12" y="98" width="150" height="44" rx="6" ry="6" fill="#000000" opacity="0.08" transform="translate(2, 5)"/>

    <!-- 長條背景（空白部分） -->
    <rect x="12" y="95" width="150" height="44" rx="6" ry="6" fill="url(#barEmpty)" stroke="#BDC3C7" stroke-width="0.5"/>

    <!-- 2/3 藍色部分 -->
    <rect x="12" y="95" width="100" height="44" rx="6" ry="6" fill="url(#barBlue)"/>
    <!-- 右側直角修正 -->
    <rect x="100" y="95" width="12" height="44" fill="url(#barBlue)"/>

    <!-- 3D光影覆蓋層 -->
    <rect x="12" y="95" width="150" height="44" rx="6" ry="6" fill="url(#barShine)"/>

    <!-- 分割線 -->
    <line x1="112" y1="95" x2="112" y2="139" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- 等份標記線 -->
    <line x1="62" y1="139" x2="62" y2="145" stroke="#636E72" stroke-width="1" opacity="0.5"/>
    <line x1="112" y1="139" x2="112" y2="145" stroke="#636E72" stroke-width="1" opacity="0.5"/>
    <line x1="162" y1="139" x2="162" y2="145" stroke="#636E72" stroke-width="1" opacity="0.5"/>

    <!-- 等份標籤 -->
    <text x="62" y="158" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="9" fill="#636E72">1</text>
    <text x="112" y="158" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="9" fill="#636E72">2</text>
    <text x="162" y="158" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="9" fill="#636E72">3</text>

    <!-- 分數標示 -->
    <text x="87" y="240" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#0984E3">⅔</text>

    <!-- 說明 -->
    <text x="87" y="262" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="10" fill="#636E72">2份塗色，共3等份</text>

    <!-- 底部裝飾點 -->
    <circle cx="70" cy="290" r="3" fill="#0984E3" opacity="0.5"/>
    <circle cx="87" cy="290" r="3" fill="#0984E3" opacity="0.8"/>
    <circle cx="104" cy="290" r="3" fill="#0984E3" opacity="0.5"/>
  </g>

  <!-- ========== 卡片3：數線 3/4 ========== -->
  <g transform="translate(404, 65)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="175" height="310" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- 卡片頂部裝飾條 -->
    <rect x="0" y="0" width="175" height="6" rx="3" ry="3" fill="#00B894"/>

    <!-- 放射光暈 -->
    <ellipse cx="87" cy="115" rx="75" ry="70" fill="url(#glowLine)"/>

    <!-- 標籤 -->
    <text x="87" y="30" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#2D3436">數線模型</text>
    <text x="87" y="46" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="11" fill="#636E72">3/4</text>

    <!-- 數線3D - 底部陰影 -->
    <line x1="22" y1="133" x2="152" y2="133" stroke="#000000" stroke-width="6" stroke-linecap="round" opacity="0.08" transform="translate(0, 4)"/>

    <!-- 數線主線 -->
    <line x1="22" y1="128" x2="152" y2="128" stroke="#2D3436" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 數線3D漸變覆蓋 -->
    <line x1="22" y1="126" x2="152" y2="126" stroke="url(#lineGreen)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

    <!-- 端點 -->
    <circle cx="22" cy="128" r="5" fill="#2D3436"/>
    <circle cx="152" cy="128" r="5" fill="#2D3436"/>

    <!-- 端點光暈 -->
    <circle cx="22" cy="128" r="5" fill="none" stroke="#55EFC4" stroke-width="1" opacity="0.5"/>
    <circle cx="152" cy="128" r="5" fill="none" stroke="#55EFC4" stroke-width="1" opacity="0.5"/>

    <!-- 等份標記 0, 1/4, 2/4, 3/4, 1 -->
    <line x1="54.5" y1="122" x2="54.5" y2="134" stroke="#636E72" stroke-width="1.5"/>
    <line x1="87" y1="122" x2="87" y2="134" stroke="#636E72" stroke-width="1.5"/>
    <line x1="119.5" y1="122" x2="119.5" y2="134" stroke="#636E72" stroke-width="1.5"/>

    <!-- 標記標籤 -->
    <text x="22" y="150" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="9" fill="#636E72">0</text>
    <text x="54.5" y="150" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="9" fill="#636E72">¼</text>
    <text x="87" y="150" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="9" fill="#636E72">½</text>
    <text x="119.5" y="150" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="9" fill="#636E72">¾</text>
    <text x="152" y="150" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="9" fill="#636E72">1</text>

    <!-- 3/4 標記點（3D效果） -->
    <circle cx="119.5" cy="128" r="8" fill="url(#dotGrad)" filter="url(#innerShadow)"/>
    <circle cx="119.5" cy="128" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    <!-- 高光 -->
    <ellipse cx="117" cy="125" rx="3" ry="2" fill="#FFFFFF" opacity="0.6"/>

    <!-- 箭頭標示 -->
    <path d="M119.5,118 L124,124 L115,124 Z" fill="#00B894" opacity="0.7"/>

    <!-- 分數標示 -->
    <text x="87" y="240" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#00B894">¾</text>

    <!-- 說明 -->
    <text x="87" y="262" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="10" fill="#636E72">第3個標記，共4等份</text>

    <!-- 底部裝飾點 -->
    <circle cx="70" cy="290" r="3" fill="#00B894" opacity="0.5"/>
    <circle cx="87" cy="290" r="3" fill="#00B894" opacity="0.8"/>
    <circle cx="104" cy="290" r="3" fill="#00B894" opacity="0.5"/>
  </g>

  <!-- 底部裝飾線 -->
  <line x1="50" y1="388" x2="550" y2="388" stroke="#DFE6E9" stroke-width="1" opacity="0.5"/>
</svg>