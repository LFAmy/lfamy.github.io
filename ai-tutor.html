<style>
/* ═══ AI Tutor Specific ═══ */
body{background:linear-gradient(170deg,#091524,#0F2440,#1A3C6D,#1E4D8C);min-height:100vh;display:flex;align-items:center;justify-content:center;padding-top:var(--nav-height)}

.tutor-container{width:100%;max-width:780px;height:calc(100vh - var(--nav-height) - 20px);background:var(--surface);border-radius:var(--radius-lg);box-shadow:0 25px 80px rgba(0,0,0,0.4);display:flex;flex-direction:column;overflow:hidden;margin:10px}

/* Header */
.tutor-header{background:linear-gradient(135deg,var(--blue-dark),var(--blue),var(--blue-light));color:white;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.tutor-header h1{font-size:1em;font-weight:700;color:white;margin:0;font-family:var(--font-sans)}
.tutor-header .status{font-size:0.7em;margin-left:auto;display:flex;align-items:center;gap:6px}
.tutor-header .dot{width:7px;height:7px;border-radius:50%}
.dot-online{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,0.4)}
.dot-offline{background:#fbbf24}

/* Mode Tabs */
.mode-tabs{display:flex;gap:4px;padding:4px;margin:10px 16px;background:var(--bg);border-radius:var(--radius-sm);flex-shrink:0}
.mode-tab{flex:1;padding:10px;text-align:center;border-radius:var(--radius-xs);cursor:pointer;font-size:0.82em;font-weight:600;color:var(--text-muted);transition:all var(--duration-fast);border:none;background:transparent;font-family:var(--font-sans)}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}
.mode-tab .icon{display:block;font-size:1.2em;margin-bottom:2px}

/* Topic View */
#topicView{flex:1;overflow-y:auto;padding:14px 18px;display:none}
#topicView h2{font-size:0.9em;margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--purple)}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.topic-card{background:var(--surface-alt);border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all var(--duration-fast)}
.topic-card:hover{border-color:var(--blue);background:#EFF6FF;transform:translateY(-2px);box-shadow:var(--shadow)}
.topic-card .tname{font-weight:600;color:var(--text);font-size:0.9em;margin-bottom:4px}
.topic-card .tmeta{font-size:0.72em;color:var(--text-muted)}

/* Question Area */
#qArea{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);padding:16px 20px;border-bottom:2px solid #BFDBFE;flex-shrink:0;display:none}
#qArea .topic-tag{display:inline-block;background:var(--blue);color:white;padding:2px 10px;border-radius:12px;font-size:0.7em;margin-bottom:8px}
#qArea .qtext{font-size:1.05em;line-height:1.7;color:var(--text)}
#qArea .meta{color:var(--text-muted);font-size:0.72em;margin-top:6px}

/* Chat */
.chat-area{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-alt)}

.msg{max-width:85%;padding:10px 16px;border-radius:16px;line-height:1.6;font-size:0.9em;word-wrap:break-word;animation:fadeUp 0.3s var(--ease-out)}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--blue);color:white;border-bottom-right-radius:4px}
.msg.system{align-self:center;background:var(--bg);color:var(--text-muted);font-size:0.75em;padding:6px 16px;border-radius:10px}
.msg.correct{align-self:center;background:var(--green-light);color:var(--green);font-weight:600;padding:10px 20px;border-radius:var(--radius-full)}
.msg.wrong{align-self:center;background:var(--red-light);color:var(--red);padding:10px 20px;border-radius:var(--radius-full)}

.typing{display:flex;gap:4px;padding:10px 16px;align-self:flex-start}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--text-muted);animation:bounce-dot 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}

/* Actions */
.actions-bar{padding:8px 16px;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.actions-bar button{flex:1;min-width:60px;padding:10px 8px;border-radius:var(--radius-full);border:none;font-size:0.78em;font-weight:600;cursor:pointer;transition:all var(--duration-fast);white-space:nowrap;font-family:var(--font-sans)}
.btn-hint{background:var(--amber-light);color:#92400e}
.btn-hint:hover{background:#fde68a}
.btn-solve{background:var(--purple-light);color:var(--purple)}
.btn-solve:hover{background:#EDE9FE}
.btn-skip{background:var(--bg);color:var(--text-secondary)}
.btn-skip:hover{background:var(--border)}
.btn-topic{background:var(--green-light);color:var(--green)}
.btn-topic:hover{background:#DCFCE7}

/* Input */
.input-area{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--surface);flex-shrink:0}
.input-area input{flex:1;padding:12px 18px;border:2px solid var(--border);border-radius:var(--radius-full);font-size:0.92em;outline:none;transition:border var(--duration-fast);font-family:var(--font-sans)}
.input-area input:focus{border-color:var(--blue)}
.input-area button{background:var(--blue);color:white;border:none;border-radius:50%;min-width:42px;height:42px;cursor:pointer;font-size:1.1em;flex-shrink:0;transition:all var(--duration-fast)}
.input-area button:hover{background:var(--blue-light);transform:scale(1.05)}
.input-area button:disabled{background:var(--border);transform:none}

/* Stats */
.stats-bar{display:flex;gap:16px;padding:8px 18px;font-size:0.72em;color:var(--text-muted);background:var(--surface);border-top:1px solid var(--border-light);flex-shrink:0}

/* Gamification Bar */
.gami-bar{display:flex;gap:14px;padding:8px 18px;background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:white;font-size:0.78em;flex-shrink:0;flex-wrap:wrap;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.gami-bar span{display:flex;align-items:center;gap:4px}

/* Quick Actions */
.quick-bar{padding:6px 16px;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.quick-btn{padding:6px 14px;border-radius:var(--radius-full);border:1.5px solid var(--border);background:var(--surface);font-size:0.75em;cursor:pointer;transition:all var(--duration-fast);color:var(--text-secondary);font-family:var(--font-sans)}
.quick-btn:hover{border-color:var(--blue);color:var(--blue);background:#EFF6FF}

/* Welcome */
.welcome{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}
.welcome .icon{font-size:56px;margin-bottom:12px}
.welcome h2{color:var(--blue);margin-bottom:8px}
.welcome p{color:var(--text-muted);max-width:400px;line-height:1.6;font-size:0.88em}

@media(max-width:500px){
  .tutor-container{height:100vh;border-radius:0;max-width:100%;margin:0}
  .mode-tabs{margin:6px 10px}
  .topic-grid{grid-template-columns:1fr}
  .actions-bar button{font-size:0.7em;padding:8px 4px}
}
</style>

<script>
/* ═══════════════════════════════════════
   AI TUTOR v2.0 — Core Logic
   ═══════════════════════════════════════ */

const API = 'https://lf-api-f80h.onrender.com';
let currentMode = 'practice', currentQ = null, currentTopic = null;
let hintLevel = 0, apiOnline = true;
let stats = { correct: 0, hints: 0, total: 0 };

/* ── Topic Database ── */
const TOPICS = {
  P3: [
    { id: 'p3_addition', name: '加法', icon: '➕', q: 'p3_addition' },
    { id: 'p3_subtraction', name: '減法', icon: '➖', q: 'p3_subtraction' },
    { id: 'p3_multiplication', name: '乘法', icon: '✖️', q: 'p3_multiplication' },
    { id: 'p3_division', name: '除法', icon: '➗', q: 'p3_division' },
    { id: 'p3_fractions', name: '分數認識', icon: '🔢', q: 'p3_fractions' },
    { id: 'p3_measurement', name: '度量', icon: '📏', q: 'p3_measurement' }
  ],
  P4: [
    { id: 'p4_factors_multiples', name: '因數與倍數', icon: '🔗', q: 'p4_factors_multiples' },
    { id: 'p4_fractions', name: '分數加減', icon: '🧮', q: 'p4_fractions' },
    { id: 'p4_decimals', name: '小數', icon: '💯', q: 'p4_decimals' },
    { id: 'p4_area_perimeter', name: '面積與周界', icon: '📐', q: 'p4_area_perimeter' },
    { id: 'p4_division_2', name: '兩位除數', icon: '➗', q: 'p4_division_2' }
  ],
  P5: [
    { id: 'p5_fractions_multi_div', name: '分數乘除', icon: '✖️', q: 'p5_fractions_multi_div' },
    { id: 'p5_percentage', name: '百分數', icon: '%', q: 'p5_percentage' },
    { id: 'p5_volume', name: '體積', icon: '📦', q: 'p5_volume' },
    { id: 'p5_equations', name: '簡易方程', icon: '🔤', q: 'p5_equations' },
    { id: 'p5_avg_speed', name: '平均數與速率', icon: '🚀', q: 'p5_avg_speed' }
  ],
  P6: [
    { id: 'p6_percentage_app', name: '百分數應用', icon: '📊', q: 'p6_percentage_app' },
    { id: 'p6_ratio', name: '比和比例', icon: '⚖️', q: 'p6_ratio' },
    { id: 'p6_circle', name: '圓形', icon: '⭕', q: 'p6_circle' },
    { id: 'p6_speed', name: '速率進階', icon: '🏃', q: 'p6_speed' },
    { id: 'p6_revision', name: '呈分試總複習', icon: '🎯', q: 'p6_revision' }
  ]
};

/* ── Init ── */
(function init() {
  checkAPIStatus();
  document.getElementById('welcomeScreen').style.display = 'flex';
  const saved = localStorage.getItem('lf_tutor_session');
  if (saved) { try { stats = JSON.parse(saved).stats || stats; updateStats(); } catch(e) {} }

  // Restore free chat history
  try {
    const hist = JSON.parse(localStorage.getItem('lf_free_chat') || '[]');
    if (hist.length) document.getElementById('welcomeScreen').style.display = 'none';
  } catch(e) {}
})();

async function checkAPIStatus() {
  try {
    const r = await fetch(API + '/api/topics', { signal: AbortSignal.timeout(4000) });
    apiOnline = r.ok;
  } catch(e) { apiOnline = false; }
  document.getElementById('onlineStatus').innerHTML = apiOnline
    ? '<span class="dot dot-online"></span> AI 在線'
    : '<span class="dot dot-offline"></span> 離線模式';
}

/* ── Mode Switch ── */
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && mode === 'practice') || (i === 1 && mode === 'free'));
  });
  document.getElementById('chat').innerHTML = '';
  document.getElementById('welcomeScreen').style.display = 'none';

  if (mode === 'practice') {
    hideAll();
    showTopics();
  } else {
    hideAll();
    document.getElementById('quickBar').style.display = 'flex';
    document.getElementById('inputArea').style.display = 'flex';
    document.getElementById('userInput').placeholder = '問我任何數學問題...';
    // Personalized greeting with weak topic awareness
    let greeting = '👋 歡迎使用 AI 數學導師！';
    try {
      const profile = JSON.parse(localStorage.getItem('lf_student_profile') || '{}');
      if (profile.name) greeting = '👋 ' + profile.name + '，歡迎返嚟！';
      if (profile.weakTopics && profile.weakTopics.length > 0) {
        greeting += '\n\n📊 我記得你喺「' + profile.weakTopics.slice(0, 2).join('」、「') + '」要加把勁～';
      }
      if (profile.grade) greeting += '\n🎒 你設定嘅年級：' + profile.grade;
      if (profile.totalQuestions > 0) {
        const acc = Math.round((profile.correctCount || 0) / profile.totalQuestions * 100);
        greeting += '\n📈 累計正確率：' + acc + '%（' + profile.totalQuestions + '題）';
      }
    } catch(e) {}
    greeting += '\n\n你可以：\n📐 問數學概念（例如：咩係 LCM？）\n🧮 俾條題目我幫你分析\n📝 問功課題（貼上題目我逐步教你）\n\n有咩數學問題都可以問我！';
    addMsg(greeting, 'ai');
      const hist = JSON.parse(localStorage.getItem('lf_free_chat') || '[]');
      hist.slice(-8).forEach(h => addMsg(h.text, h.role));
    } catch(e) {}
  }
}

function hideAll() {
  ['topicView', 'qArea', 'actionsBar', 'statsBar', 'quickBar', 'inputArea', 'gamiBar'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
}

/* ── Topic Selection ── */
function showTopics() {
  currentQ = null;
  hideAll();
  const tv = document.getElementById('topicView');
  tv.style.display = 'block';

  let html = '';
  for (const [grade, topics] of Object.entries(TOPICS)) {
    html += '<h2>📚 ' + grade + '</h2><div class="topic-grid">';
    for (const t of topics) {
      html += '<div class="topic-card" onclick="selectTopic(\'' + t.q + '\',\'' + grade + '\',\'' + t.name + '\')"><div class="tname">' + t.icon + ' ' + t.name + '</div><div class="tmeta">' + grade + ' · 練習模式</div></div>';
    }
    html += '</div>';
  }
  tv.innerHTML = html;
  document.getElementById('statsBar').style.display = 'flex';
  updateStats();
}

/* ── Select Topic → Get Question ── */
async function selectTopic(topicId, grade, topicName) {
  currentTopic = { id: topicId, grade, name: topicName };
  document.getElementById('topicView').style.display = 'none';
  await fetchQuestion();
}

async function fetchQuestion() {
  if (!currentTopic) return;
  document.getElementById('welcomeScreen').style.display = 'none';
  hintLevel = 0;

  // Try API first
  try {
    const r = await fetch(API + '/api/question?topic=' + currentTopic.id, { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      const d = await r.json();
      if (d.question) {
        displayQuestion(d);
        return;
      }
    }
  } catch(e) {}

  // Fallback: generate locally
  displayQuestion(generateLocalQuestion(currentTopic.grade, currentTopic.name));
}

function displayQuestion(q) {
  currentQ = q;
  document.getElementById('qTopic').textContent = currentTopic.grade + ' · ' + currentTopic.name;
  document.getElementById('qText').textContent = q.question || q.text || q.q || '請回答以下問題';
  document.getElementById('qDiff').textContent = q.diff || q.difficulty || '★★';
  document.getElementById('qMarks').textContent = q.marks || 2;
  document.getElementById('qId').textContent = q.id || currentTopic.id;

  document.getElementById('qArea').style.display = 'block';
  document.getElementById('actionsBar').style.display = 'flex';
  document.getElementById('inputArea').style.display = 'flex';
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('gamiBar').style.display = 'flex';
  document.getElementById('userInput').placeholder = '輸入你嘅答案...';
  document.getElementById('userInput').value = '';
  document.getElementById('userInput').focus();

  stats.total++;
  updateStats();

  addMsg('📝 **' + currentTopic.grade + ' · ' + currentTopic.name + '**\n\n' + (q.question || q.q), 'ai');
  addMsg('試下自己諗先！需要提示嘅話撳「💡 提示」～', 'system');
}

/* ── Local Question Generator ── */
function generateLocalQuestion(grade, topic) {
  const bank = {
    'P3': {
      '加法': [
        { q: '276 + 389 = ?', ans: 665, diff: '★', marks: 2, trap: 'T1' },
        { q: '458 + 167 + 294 = ?', ans: 919, diff: '★★', marks: 3, trap: 'T1' }
      ],
      '減法': [
        { q: '1000 - 456 = ?', ans: 544, diff: '★★', marks: 2, trap: 'T1' },
        { q: '836 - 279 = ?', ans: 557, diff: '★', marks: 2, trap: 'T1' }
      ],
      '乘法': [
        { q: '23 × 6 = ?', ans: 138, diff: '★', marks: 2, trap: 'T1' },
        { q: '47 × 8 = ?', ans: 376, diff: '★★', marks: 2, trap: 'T1' }
      ],
      '除法': [
        { q: '84 ÷ 7 = ?', ans: 12, diff: '★', marks: 2, trap: 'T4' },
        { q: '96 ÷ 8 = ?', ans: 12, diff: '★', marks: 2, trap: 'T4' }

      ]
    }
  };

  const gradeBank = bank[grade];
  if (!gradeBank) return { q: '請計算以下題目', diff: '★★', marks: 3 };

  // Find best matching topic
  let pool = null;
  for (const [tName, questions] of Object.entries(gradeBank)) {
    if (topic.includes(tName) || tName.includes(topic)) {
      pool = questions;
      break;
    }
  }
  if (!pool) {
    // Pick any topic for this grade
    const keys = Object.keys(gradeBank);
    pool = gradeBank[keys[Math.floor(Math.random() * keys.length)]];
  }

  return pool[Math.floor(Math.random() * pool.length)];
}

/* ── AI Chat ── */
async function aiAsk(prompt, systemPrompt) {
  // Try MiMo v2.5 API first (best quality)
  if (typeof MIMO !== 'undefined') {
    try {
      var result = await MIMO.tutorAsk(prompt, systemPrompt);
      if (result && result.content) return result.content;
    } catch(e) {}
  }

  // Try LF shell AI first (fallback)
  if (typeof LF !== 'undefined' && LF.aiAsk) {
    const result = await LF.aiAsk(prompt, systemPrompt);
    if (result) return result;
  }

  // Direct frellmapi with retry
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      const r = await fetch('http://localhost:3687/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'auto',
          messages: [
            { role: 'system', content: systemPrompt || '你係霖楓學苑AI數學導師。用繁體中文+廣東話。逐步引導學生，唔直接俾答案。' },
            { role: 'user', content: prompt }
          ],
          max_tokens: 800, temperature: 0.7
        }),
        signal: ctrl.signal
      });
      clearTimeout(t);
      if (r.ok) {
        const d = await r.json();
        return d.choices?.[0]?.message?.content || null;
      }
      // Non-ok response: retry if attempts remain
      if (attempt < 2) {
        await new Promise(res => setTimeout(res, 800 * (attempt + 1)));
      }
    } catch(e) {
      // Network error: retry if attempts remain
      if (attempt < 2) {
        await new Promise(res => setTimeout(res, 800 * (attempt + 1)));
      }
    }
  }

  return null;
}

/* ── Handle Send ── */
function handleSend() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  if (currentMode === 'practice' && currentQ) {
    handlePracticeAnswer(text);
  } else {
    freeAsk(text);
  }
}

async function handlePracticeAnswer(text) {
  addMsg(text, 'user');

  // Check membership limit
  // Graduated membership check (warn at 80%, block at 100%)
  if (typeof LF !== 'undefined' && LF.showUpgradePrompt) {
    const up = LF.showUpgradePrompt('practice');
    if (up.blocked) { addMsg(up.msg, 'system'); return; }
    if (up.msg) addMsg(up.msg, 'system');
  } else if (typeof checkLimit === 'function' && !checkLimit('practice')) {
    if (typeof showUpgradePrompt === 'function') showUpgradePrompt('practice');
    return;
  }
  }

  // Simple answer checking
  const answer = String(currentQ.ans || currentQ.answer || '').toLowerCase().replace(/\s/g, '');
  const userAns = text.toLowerCase().replace(/\s/g, '');

  if (answer && (userAns === answer || userAns.includes(answer))) {
    stats.correct++;
    updateStats();
    addMsg('✅ **正確！** 答得好！', 'correct');

    if (currentQ.trap) {
      addMsg('💡 呢題嘅陷阱係 **' + currentQ.trap + '**，你成功避開咗！', 'system');
    }

    // Record in gamification
    if (typeof GAMIFICATION !== 'undefined') {
      const gs = GAMIFICATION.recordAnswer(true);
      updateGami(gs);
    }

    // Update BKT
    if (typeof BKT !== 'undefined') BKT.record(currentTopic.id, true);

    // Track usage
    if (typeof incrementUsage === 'function') incrementUsage('practice');

    // Offer next question
    setTimeout(() => {
      addMsg('🎯 準備好下題未？撳「換主題」揀其他課題，或者繼續做同一個主題～', 'system');
      currentQ = null;
    }, 800);
  } else {
    addMsg('❌ 唔啱喎，再諗下！需要提示嗎？', 'wrong');

    if (typeof GAMIFICATION !== 'undefined') {
      updateGami(GAMIFICATION.recordAnswer(false));
    }

    // AI feedback
    const aiHint = await aiAsk(
      '學生答咗「' + text + '」俾呢條題目：「' + (currentQ.q || currentQ.question) + '」，答案應該係「' + (currentQ.ans || currentQ.answer) + '」。請俾一個溫和嘅提示，引導學生自己搵到正確答案。用繁體中文+廣東話，唔好直接講答案。',
      '你係霖楓學苑AI數學導師。學生答錯咗，你要用蘇格拉底式引導，俾提示但唔直接講答案。用繁體中文+廣東話。簡短回應（100字內）。'
    );
    if (aiHint) addMsg(aiHint, 'ai');
  }

  saveSession();
}

async function freeAsk(text) {
  addMsg(text, 'user');
  saveFreeChat(text, 'user');

  // Check limit
  // Graduated membership check
  if (typeof LF !== 'undefined' && LF.showUpgradePrompt) {
    const up = LF.showUpgradePrompt('ai');
    if (up.blocked) { addMsg(up.msg, 'system'); return; }
    if (up.msg) addMsg(up.msg, 'system');
  } else if (typeof checkLimit === 'function' && !checkLimit('ai')) {
    if (typeof showUpgradePrompt === 'function') showUpgradePrompt('ai');
    return;
  }
  }

  showTyping();
  document.getElementById('sendBtn').disabled = true;

  // Try local AI
  const response = await aiAsk(text);

  hideTyping();
  document.getElementById('sendBtn').disabled = false;

  if (response) {
    addMsg(response, 'ai');
    saveFreeChat(response, 'ai');
    if (typeof incrementUsage === 'function') incrementUsage('ai');
  } else {
    // Smart fallback
    addMsg(getSmartFallback(text.toLowerCase()), 'ai');
    saveFreeChat(getSmartFallback(text.toLowerCase()), 'ai');
  }

  if (typeof GAMIFICATION !== 'undefined') updateGami(GAMIFICATION.recordAnswer(true));
}

function getSmartFallback(ql) {
  // Pattern match common math topics
  const topics = [
    { keys: ['分數', 'fraction', '幾分之幾'], resp: '📖 **分數運算**\n\n記住呢個黃金法則：**分母唔同要先通分！**\n\n例：1/3 + 1/4\n→ 通分：4/12 + 3/12 = 7/12\n\n⚠️ 陷阱T6：通分時只改分母唔改分子！\n\n要我幫你練分數嗎？切換去練習模式揀「分數」啦～' },
    { keys: ['百分數', 'percentage', '折扣', '幾折'], resp: '💯 **百分數**\n\n口訣：**百份之幾就係 ÷100**\n\n例：30% of 200 = 200 × 30/100 = 60\n\n⚠️ 陷阱T8：百分比增加 vs 百分比減少要小心！\n"增加20%" = ×1.2\n"減少20%" = ×0.8' },
    { keys: ['面積', 'area', '周界', 'perimeter'], resp: '📐 **面積 vs 周界**\n\n⚠️ 陷阱T7：呢個係最多人混淆嘅概念！\n\n**面積** = 平面大小 (cm², m²)\n**周界** = 外圍長度 (cm, m)\n\n長方形面積 = 長 × 闊\n長方形周界 = (長 + 闊) × 2\n\n記住：答案要有正確單位！' },
    { keys: ['體積', 'volume'], resp: '📦 **體積**\n\n⚠️ 陷阱T9：體積 vs 容量！\n\n**體積** = 物件佔嘅空間 (cm³, m³)\n**容量** = 容器可以裝幾多 (mL, L)\n\n長方體體積 = 長 × 闊 × 高\n1 cm³ = 1 mL\n1000 cm³ = 1 L' },
    { keys: ['速率', 'speed', 'km/h'], resp: '🚀 **速率**\n\n公式：速率 = 距離 ÷ 時間\n\n例：2小時行咗160公里\n速率 = 160 ÷ 2 = 80 km/h\n\n⚠️ 陷阱T2：單位要一致！\n如果有分鐘要轉做小時先！' },
    { keys: ['方程', 'equation', 'x ='], resp: '🔤 **簡易方程**\n\n黃金法則：**等號兩邊一齊做相同運算！**\n\n例：3x + 5 = 20\n→ 3x + 5 - 5 = 20 - 5\n→ 3x = 15\n→ x = 5\n\n⚠️ 陷阱T10：小心應用題中嘅隱藏條件！' },
    { keys: ['因數', '倍數', 'hcf', 'lcm', 'factor'], resp: '🔗 **因數與倍數**\n\n**HCF（最大公因數）**：兩個數共同嘅最大因數\n**LCM（最小公倍數）**：兩個數共同嘅最小倍數\n\n例：12 同 18\nHCF = 6\nLCM = 36\n\n💡 用短除法最快！' },
  ];

  for (const t of topics) {
    for (const k of t.keys) {
      if (ql.includes(k)) return t.resp;
    }
  }

  return '😊 我係霖楓AI數學導師，專幫香港小學生搞掂數學！\n\n你可以問我：\n📐 數學概念解釋\n🧮 題目逐步引導\n📝 陷阱分析\n💡 口訣記憶\n🎯 呈分試攻略\n\n或者切換去「📝 練習模式」揀年級做練習啦！';
}

/* ── Practice Actions ── */
async function getHint() {
  if (!currentQ) return;
  hintLevel++;
  stats.hints++;
  updateStats();

  const hints = [
    '💡 **提示 Level ' + hintLevel + '**: 先睇清楚題目問咩，圈出關鍵數字。',
    '💡 **提示 Level ' + hintLevel + '**: 諗下呢條題目涉及邊個數學概念？' + (currentTopic ? '（提示：' + currentTopic.name + '）' : ''),
    '💡 **提示 Level ' + hintLevel + '**: ' + (currentQ.ans ? '答案係「' + String(currentQ.ans).length + '」位數左右...' : '試下用畫圖或者列表嘅方法幫自己理解～'),
  ];

  addMsg(hints[Math.min(hintLevel - 1, hints.length - 1)], 'system');

  if (hintLevel >= 3) {
    const aiHint = await aiAsk(
      '學生做緊呢條題目需要更多幫助：「' + (currentQ.q || currentQ.question) + '」，答案係「' + (currentQ.ans || '') + '」。請俾一個清晰嘅引導（但唔直接講答案）。用繁體中文+廣東話，150字內。',
      '你係霖楓學苑AI數學導師。學生需要引導。俾清晰步驟但保留最後一步俾學生自己計。'
    );
    if (aiHint) addMsg(aiHint, 'ai');
  }
}

async function solveIt() {
  if (!currentQ) return;
  const aiSolution = await aiAsk(
    '請逐步展示呢條題目嘅完整解答過程：「' + (currentQ.q || currentQ.question) + '」，答案係「' + (currentQ.ans || '') + '」。每個步驟要解釋點解。用繁體中文+廣東話。',
    '你係霖楓學苑AI數學導師。逐步展示解答過程，每步都要解釋。用繁體中文+廣東話。'
  );
  if (aiSolution) {
    addMsg('🧮 **逐步解答：**\n\n' + aiSolution, 'ai');
  } else {
    addMsg('🧮 答案係：**' + (currentQ.ans || currentQ.answer || '?') + '**\n\n記住要理解過程，唔好只記答案！', 'system');
  }
}

function skipQuestion() {
  if (!currentQ) return;
  addMsg('⏭ 跳過咗呢題。答案係：**' + (currentQ.ans || currentQ.answer || '?') + '**', 'system');
  if (currentQ.trap) {
    addMsg('⚠️ 呢題嘅陷阱係 **' + currentQ.trap + '**，下次遇到要小心！', 'system');
  }
  currentQ = null;
  setTimeout(() => fetchQuestion(), 600);
}

/* ── Quick Ask ── */
function quickAsk(question) {
  document.getElementById('userInput').value = question;
  freeAsk(question);
}

/* ── UI Helpers ── */
function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const formatted = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  div.innerHTML = formatted.replace(/\n/g, '<br>');
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  if (window.MathJax) MathJax.typesetPromise([div]);
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function updateStats() {
  document.getElementById('correctCount').textContent = stats.correct;
  document.getElementById('hintCount').textContent = stats.hints;
  document.getElementById('qCount').textContent = stats.total;
}

function updateGami(gs) {
  if (!gs) return;
  document.getElementById('gamiPoints').textContent = gs.points;
  document.getElementById('gamiStreak').textContent = gs.streak;
  if (gs.badge) {
    const badgeEl = document.getElementById('gamiBadge');
    badgeEl.textContent = gs.badge.icon + ' ' + gs.badge.name;
    badgeEl.style.color = gs.badge.color;
  }
  if (gs.daily) document.getElementById('gamiDaily').textContent = gs.daily.done + '/' + gs.daily.goal;
  if (gs.newBadges && gs.newBadges.length > 0) {
    gs.newBadges.forEach(b => addMsg('🎉 解鎖新徽章: ' + b.icon + ' ' + b.name + '!', 'system'));
  }
  if (gs.bonus > 0) addMsg('🔥 連續答對獎勵 +' + gs.bonus + 'pts!', 'system');
}

function saveSession() {
  try { localStorage.setItem('lf_tutor_session', JSON.stringify({ stats })); } catch(e) {}
}

function saveFreeChat(text, role) {
  try {
    const h = JSON.parse(localStorage.getItem('lf_free_chat') || '[]');
    h.push({ text, role, time: Date.now() });
    if (h.length > 100) h.splice(0, h.length - 100);
    localStorage.setItem('lf_free_chat', JSON.stringify(h));
  } catch(e) {}
}

/* ── Keyboard ── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement === document.getElementById('userInput')) {
    handleSend();
  }
});
