name: Daily XHS Publisher (v2 Autopilot)

on:
  schedule:
    # 9:00 AM HKT = 1:00 AM UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (now/dry-run)"
        required: false
        default: "now"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (Chinese fonts for Pillow)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk 2>/dev/null || sudo apt-get install -y -qq fonts-wqy-zenhei 2>/dev/null || echo "Font install skipped"

      - name: Install Python deps
        run: |
          pip install --quiet pillow requests
          pip install --quiet xhs 2>/dev/null || echo "xhs lib optional"

      - name: Run XHS Autopilot
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          PYTHONIOENCODING: utf-8
        run: |
          MODE="${{ github.event.inputs.mode || 'now' }}"
          if [ "$MODE" = "dry-run" ]; then
            python scripts/xhs_autopilot.py --dry-run --now
          else
            python scripts/xhs_autopilot.py --now
          fi

      - name: Commit generated content
        run: |
          git config user.name "LF XHS Bot"
          git config user.email "bot@lfacademyhk.com"
          git add docs/social/xhs_strategy/autopilot_logs/ docs/social/images/xhs/ docs/social/publish/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: daily XHS autopilot $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
