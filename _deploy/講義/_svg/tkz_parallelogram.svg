<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 平行四邊形主體漸層（多層漸變） -->
    <linearGradient id="paraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="25%" stop-color="#5BA0E8"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="75%" stop-color="#2E6ABF"/>
      <stop offset="100%" stop-color="#1E5AAA"/>
    </linearGradient>

    <!-- 切割平移部分漸層 -->
    <linearGradient id="cutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="30%" stop-color="#FFB840"/>
      <stop offset="60%" stop-color="#E8951A"/>
      <stop offset="100%" stop-color="#D4820A"/>
    </linearGradient>

    <!-- 3D光影放射漸層（平行四邊形） -->
    <radialGradient id="para3D" cx="30%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="70%" stop-color="rgba(0,0,0,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.20)"/>
    </radialGradient>

    <!-- 切割部分3D光影 -->
    <radialGradient id="cut3D" cx="30%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.40)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="70%" stop-color="rgba(0,0,0,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-5%" y="-5%" width="115%" height="120%">
      <!-- 第一層陰影：深色擴散 -->
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A2A4A" flood-opacity="0.25"/>
      <!-- 第二層陰影：淺色較遠 -->
      <feDropShadow dx="-1" dy="6" stdDeviation="10" flood-color="#2E6ABF" flood-opacity="0.12"/>
    </filter>

    <!-- 卡片圓角陰影 -->
    <filter id="cardShadow" x="-3%" y="-3%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1A2A4A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1A2A4A" flood-opacity="0.08"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E6ABF"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E8951A"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27AE60"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 主卡片容器（圓角卡片） -->
  <rect x="15" y="15" width="570" height="370" rx="16" ry="16" fill="#FFFFFF" filter="url(#cardShadow)" opacity="0.95"/>
  <rect x="15" y="15" width="570" height="370" rx="16" ry="16" fill="none" stroke="#E0E6ED" stroke-width="1"/>

  <!-- 標題 -->
  <text x="300" y="48" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A2A4A">平行四邊形面積 — 切割平移視覺化</text>
  <line x1="180" y1="56" x2="420" y2="56" stroke="#4A90D9" stroke-width="2" stroke-linecap="round"/>

  <!-- ============ 左側：原始平行四邊形 ============ -->
  <g transform="translate(50, 80)">
    <!-- 平行四邊形主體 -->
    <polygon points="30,120 230,120 200,20 0,20" fill="url(#paraGrad)" filter="url(#doubleShadow)"/>
    <polygon points="30,120 230,120 200,20 0,20" fill="url(#para3D)"/>

    <!-- 切割線（虛線） -->
    <line x1="30" y1="120" x2="30" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>

    <!-- 底邊標註 b -->
    <line x1="0" y1="138" x2="230" y2="138" stroke="#2E6ABF" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
    <text x="115" y="155" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#2E6ABF">b</text>

    <!-- 高標註 h -->
    <line x1="30" y1="20" x2="30" y2="120" stroke="#E74C3C" stroke-width="2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
    <text x="18" y="72" text-anchor="end" font-family="'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#E74C3C">h</text>

    <!-- 直角標記 -->
    <polyline points="30,110 40,110 40,120" fill="none" stroke="#E74C3C" stroke-width="1.5"/>

    <!-- 標籤：平行四邊形 -->
    <text x="115" y="175" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#1A2A4A">平行四邊形</text>
    <text x="115" y="192" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" fill="#4A90D9">面積 = b × h</text>
  </g>

  <!-- ============ 右側：切割平移後 ============ -->
  <g transform="translate(320, 80)">
    <!-- 平移後的矩形（完整） -->
    <rect x="0" y="20" width="200" height="100" fill="url(#paraGrad)" filter="url(#doubleShadow)"/>
    <rect x="0" y="20" width="200" height="100" fill="url(#para3D)"/>

    <!-- 切割部分（橙色三角形，已平移） -->
    <polygon points="0,20 30,20 0,120" fill="url(#cutGrad)" filter="url(#doubleShadow)"/>
    <polygon points="0,20 30,20 0,120" fill="url(#cut3D)"/>

    <!-- 切割線（虛線，顯示原本切割位置） -->
    <line x1="30" y1="20" x2="30" y2="120" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.5"/>

    <!-- 底邊標註 b -->
    <line x1="0" y1="138" x2="200" y2="138" stroke="#2E6ABF" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
    <text x="100" y="155" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#2E6ABF">b</text>

    <!-- 高標註 h -->
    <line x1="30" y1="20" x2="30" y2="120" stroke="#E74C3C" stroke-width="2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
    <text x="18" y="72" text-anchor="end" font-family="'Times New Roman', serif" font-size="16" font-style="italic" font-weight="bold" fill="#E74C3C">h</text>

    <!-- 直角標記 -->
    <polyline points="30,110 40,110 40,120" fill="none" stroke="#E74C3C" stroke-width="1.5"/>

    <!-- 標籤：長方形 -->
    <text x="100" y="175" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" fill="#1A2A4A">長方形</text>
    <text x="100" y="192" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" fill="#4A90D9">面積 = b × h</text>
  </g>

  <!-- ============ 中間：平移箭頭 ============ -->
  <g transform="translate(275, 140)">
    <!-- 大箭頭指示平移方向 -->
    <line x1="0" y1="0" x2="38" y2="0" stroke="#27AE60" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="19" y="-10" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#27AE60" font-weight="bold">平移</text>
  </g>

  <!-- ============ 底部：面積公式 ============ -->
  <g transform="translate(300, 340)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" ry="18" fill="#F0F4F8" stroke="#D0D8E0" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Times New Roman', 'Microsoft YaHei', serif" font-size="16" fill="#1A2A4A">
      平行四邊形面積 = <tspan font-style="italic" font-weight="bold" fill="#2E6ABF">b</tspan> × <tspan font-style="italic" font-weight="bold" fill="#E74C3C">h</tspan> = 底 × 高
    </text>
  </g>

  <!-- ============ 裝飾元素 ============ -->
  <!-- 左上角裝飾點 -->
  <circle cx="30" cy="30" r="4" fill="#4A90D9" opacity="0.3"/>
  <circle cx="46" cy="30" r="3" fill="#F5A623" opacity="0.3"/>
  <circle cx="30" cy="46" r="3" fill="#27AE60" opacity="0.3"/>

  <!-- 右下角裝飾點 -->
  <circle cx="570" cy="370" r="4" fill="#4A90D9" opacity="0.3"/>
  <circle cx="554" cy="370" r="3" fill="#F5A623" opacity="0.3"/>
  <circle cx="570" cy="354" r="3" fill="#27AE60" opacity="0.3"/>
</svg>