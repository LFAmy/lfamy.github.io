<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>
    <pattern id="gridDot" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#D0D6DD"/>
    </pattern>

    <!-- 長方體頂面漸層：多層漸變 5-stop -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A9E"/>
      <stop offset="25%" stop-color="#FAD0C4"/>
      <stop offset="50%" stop-color="#FBC2EB"/>
      <stop offset="75%" stop-color="#A18CD1"/>
      <stop offset="100%" stop-color="#667eea"/>
    </linearGradient>

    <!-- 長方體正面漸層：多層漸變 4-stop -->
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="33%" stop-color="#764ba2"/>
      <stop offset="66%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>

    <!-- 長方體右面漸層：多層漸變 4-stop -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="30%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>

    <!-- 放射漸層 3D光影：用於高光 -->
    <radialGradient id="highlight" cx="30%" cy="30%" r="60%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 陰影濾鏡：雙層陰影 -->
    <filter id="shadowDouble" x="-10%" y="-10%" width="130%" height="140%">
      <!-- 第一層陰影：柔軟擴散 -->
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="rgba(0,0,0,0.15)"/>
      <!-- 第二層陰影：較深較集中 -->
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
    </filter>

    <!-- 圓角卡片濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.1)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 標註箭頭標記 -->
    <marker id="arrowStart" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M 6 0 L 0 3 L 6 6" fill="#E74C3C" stroke="none"/>
    </marker>
    <marker id="arrowEnd" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6" fill="#E74C3C" stroke="none"/>
    </marker>
    <marker id="arrowStartBlue" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M 6 0 L 0 3 L 6 6" fill="#2980B9" stroke="none"/>
    </marker>
    <marker id="arrowEndBlue" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6" fill="#2980B9" stroke="none"/>
    </marker>
    <marker id="arrowStartGreen" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M 6 0 L 0 3 L 6 6" fill="#27AE60" stroke="none"/>
    </marker>
    <marker id="arrowEndGreen" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6" fill="#27AE60" stroke="none"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#gridDot)"/>

  <!-- 圓角卡片背景 -->
  <rect x="15" y="15" width="570" height="370" rx="16" ry="16" fill="white" filter="url(#cardShadow)" opacity="0.7"/>
  <rect x="15" y="15" width="570" height="370" rx="16" ry="16" fill="none" stroke="#E0E6ED" stroke-width="1"/>

  <!-- 標題 -->
  <text x="300" y="48" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">長方體 3D 透視圖</text>
  <line x1="180" y1="56" x2="420" y2="56" stroke="#667eea" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- ==================== 長方體 3D 圖 ==================== -->
  <g filter="url(#shadowDouble)">
    <!-- 背面（先畫，作為陰影層） -->
    <polygon points="160,100 340,100 340,220 160,220" fill="#2C3E50" opacity="0.03"/>

    <!-- 右面（側面） -->
    <polygon points="340,100 420,140 420,260 340,220" fill="url(#rightFace)" opacity="0.85"/>

    <!-- 正面 -->
    <polygon points="160,100 340,100 340,220 160,220" fill="url(#frontFace)" opacity="0.9"/>

    <!-- 頂面 -->
    <polygon points="160,100 340,100 420,140 240,140" fill="url(#topFace)" opacity="0.85"/>

    <!-- 高光層（放射漸變） -->
    <polygon points="160,100 340,100 340,220 160,220" fill="url(#highlight)" opacity="0.5"/>
    <polygon points="340,100 420,140 420,260 340,220" fill="url(#highlight)" opacity="0.3"/>
    <polygon points="160,100 340,100 420,140 240,140" fill="url(#highlight)" opacity="0.4"/>

    <!-- 邊框線條 -->
    <line x1="160" y1="100" x2="340" y2="100" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="100" x2="420" y2="140" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="420" y1="140" x2="240" y2="140" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="240" y1="140" x2="160" y2="100" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="100" x2="160" y2="220" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="100" x2="340" y2="220" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="420" y1="140" x2="420" y2="260" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="240" y1="140" x2="240" y2="260" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="220" x2="340" y2="220" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="340" y1="220" x2="420" y2="260" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="420" y1="260" x2="240" y2="260" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>
    <line x1="240" y1="260" x2="160" y2="220" stroke="#2C3E50" stroke-width="1.5" opacity="0.4"/>

    <!-- 頂點圓點 -->
    <circle cx="160" cy="100" r="3" fill="#2C3E50"/>
    <circle cx="340" cy="100" r="3" fill="#2C3E50"/>
    <circle cx="420" cy="140" r="3" fill="#2C3E50"/>
    <circle cx="240" cy="140" r="3" fill="#2C3E50"/>
    <circle cx="160" cy="220" r="3" fill="#2C3E50"/>
    <circle cx="340" cy="220" r="3" fill="#2C3E50"/>
    <circle cx="420" cy="260" r="3" fill="#2C3E50"/>
    <circle cx="240" cy="260" r="3" fill="#2C3E50"/>
  </g>

  <!-- ==================== 尺寸標註 ==================== -->

  <!-- 長度 l（頂面紅色） -->
  <line x1="160" y1="128" x2="340" y2="128" stroke="#E74C3C" stroke-width="1.5" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="250" y="122" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#E74C3C">l（長）</text>

  <!-- 寬度 w（頂面藍色） -->
  <line x1="340" y1="115" x2="420" y2="145" stroke="#2980B9" stroke-width="1.5" marker-start="url(#arrowStartBlue)" marker-end="url(#arrowEndBlue)"/>
  <text x="395" y="132" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="bold" fill="#2980B9" transform="rotate(18,395,132)">w（寬）</text>

  <!-- 高度 h（正面綠色） -->
  <line x1="148" y1="100" x2="148" y2="220" stroke="#27AE60" stroke-width="1.5" marker-start="url(#arrowStartGreen)" marker-end="url(#arrowEndGreen)"/>
  <text x="138" y="163" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" font-weight="bold" fill="#27AE60">h（高）</text>

  <!-- ==================== 公式卡片 ==================== -->

  <!-- 體積公式卡片 -->
  <g>
    <rect x="30" y="270" width="250" height="105" rx="12" ry="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="30" y="270" width="250" height="105" rx="12" ry="12" fill="none" stroke="#667eea" stroke-width="1.5"/>
    <!-- 頂部色條 -->
    <rect x="30" y="270" width="250" height="6" rx="3" fill="url(#topFace)"/>

    <text x="155" y="298" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="15" font-weight="bold" fill="#2C3E50">📦 體積公式</text>
    <text x="155" y="330" text-anchor="middle" font-family="'Times New Roman',serif" font-size="26" font-weight="bold" fill="#E74C3C">V = l × w × h</text>
    <text x="155" y="360" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#7F8C8D">體積 = 長 × 寬 × 高</text>
  </g>

  <!-- 表面積公式卡片 -->
  <g>
    <rect x="310" y="270" width="260" height="105" rx="12" ry="12" fill="white" filter="url(#cardShadow)"/>
    <rect x="310" y="270" width="260" height="105" rx="12" ry="12" fill="none" stroke="#f093fb" stroke-width="1.5"/>
    <!-- 頂部色條 -->
    <rect x="310" y="270" width="260" height="6" rx="3" fill="url(#rightFace)"/>

    <text x="440" y="298" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="15" font-weight="bold" fill="#2C3E50">📐 表面積公式</text>
    <text x="440" y="330" text-anchor="middle" font-family="'Times New Roman',serif" font-size="22" font-weight="bold" fill="#764ba2">S = 2(lw + lh + wh)</text>
    <text x="440" y="360" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#7F8C8D">表面積 = 2×(長×寬 + 長×高 + 寬×高)</text>
  </g>

  <!-- 裝飾小元素 -->
  <circle cx="45" cy="45" r="3" fill="#667eea" opacity="0.3"/>
  <circle cx="555" cy="45" r="3" fill="#f093fb" opacity="0.3"/>
  <circle cx="45" cy="355" r="3" fill="#43e97b" opacity="0.3"/>
  <circle cx="555" cy="355" r="3" fill="#f5576c" opacity="0.3"/>
</svg>