<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <!-- 卡片陰影 - 雙層 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94A3B8" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#64748B" flood-opacity="0.15"/>
    </filter>

    <!-- 卡片內部光影 -->
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="0" dy="-1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- 銳角漸變 - 綠色系 -->
    <linearGradient id="acuteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="35%" stop-color="#22C55E"/>
      <stop offset="70%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- 直角漸變 - 藍色系 -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- 鈍角漸變 - 橙色系 -->
    <linearGradient id="obtuseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- 平角漸變 - 紫色系 -->
    <linearGradient id="straightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- 周角漸變 - 紅色系 -->
    <radialGradient id="fullGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="30%" stop-color="#F87171"/>
      <stop offset="60%" stop-color="#EF4444"/>
      <stop offset="85%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </radialGradient>

    <!-- 放射光暈 - 3D光影效果 -->
    <radialGradient id="glowAcute" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#15803D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowObtuse" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowStraight" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowFull" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FECACA" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0"/>
    </radialGradient>

    <!-- 卡片頂部高光 -->
    <linearGradient id="cardHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 弧線箭頭標記 -->
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D97706"/>
    </marker>
    <marker id="arrowPurple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7C3AED"/>
    </marker>
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif" font-size="20" font-weight="bold" fill="#1E293B" letter-spacing="2">📐 角度類型 · 並排對比</text>

  <!-- ===== 卡片 1: 銳角 ===== -->
  <g transform="translate(12, 48)">
    <rect width="108" height="148" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect width="108" height="148" rx="14" fill="url(#cardHighlight)"/>
    <!-- 卡片頂部色條 -->
    <rect x="0" y="0" width="108" height="6" rx="3" fill="url(#acuteGrad)"/>
    
    <!-- 角度圖形 -->
    <g transform="translate(30, 95)">
      <!-- 兩條邊 -->
      <line x1="0" y1="0" x2="45" y2="-40" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="48" y2="5" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 弧線 -->
      <path d="M12,-10 A15,15 0 0,0 13,2" fill="none" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
      <!-- 3D光暈 -->
      <circle cx="20" cy="-15" r="25" fill="url(#glowAcute)" opacity="0.5"/>
    </g>
    
    <text x="54" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#16A34A" font-weight="bold">銳角</text>
    <text x="54" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748B">&lt; 90°</text>
  </g>

  <!-- ===== 卡片 2: 直角 ===== -->
  <g transform="translate(128, 48)">
    <rect width="108" height="148" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect width="108" height="148" rx="14" fill="url(#cardHighlight)"/>
    <rect x="0" y="0" width="108" height="6" rx="3" fill="url(#rightGrad)"/>
    
    <g transform="translate(30, 95)">
      <line x1="0" y1="0" x2="45" y2="-40" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="45" y2="5" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 直角方形標記 -->
      <rect x="8" y="-8" width="8" height="8" fill="none" stroke="#2563EB" stroke-width="1.5" rx="1"/>
      <!-- 弧線 -->
      <path d="M12,-10 A15,15 0 0,0 13,2" fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
      <circle cx="20" cy="-15" r="25" fill="url(#glowRight)" opacity="0.5"/>
    </g>
    
    <text x="54" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2563EB" font-weight="bold">直角</text>
    <text x="54" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748B">= 90°</text>
  </g>

  <!-- ===== 卡片 3: 鈍角 ===== -->
  <g transform="translate(244, 48)">
    <rect width="108" height="148" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect width="108" height="148" rx="14" fill="url(#cardHighlight)"/>
    <rect x="0" y="0" width="108" height="6" rx="3" fill="url(#obtuseGrad)"/>
    
    <g transform="translate(30, 95)">
      <line x1="0" y1="0" x2="45" y2="-40" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="38" y2="15" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 弧線 -->
      <path d="M12,-10 A18,18 0 0,0 16,6" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
      <circle cx="20" cy="-15" r="25" fill="url(#glowObtuse)" opacity="0.5"/>
    </g>
    
    <text x="54" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#D97706" font-weight="bold">鈍角</text>
    <text x="54" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748B">&gt; 90°</text>
  </g>

  <!-- ===== 卡片 4: 平角 ===== -->
  <g transform="translate(360, 48)">
    <rect width="108" height="148" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect width="108" height="148" rx="14" fill="url(#cardHighlight)"/>
    <rect x="0" y="0" width="108" height="6" rx="3" fill="url(#straightGrad)"/>
    
    <g transform="translate(30, 95)">
      <line x1="0" y1="0" x2="45" y2="-40" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-40" y2="-40" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 弧線 -->
      <path d="M12,-10 A20,20 0 0,1 -10,-10" fill="none" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
      <circle cx="5" cy="-20" r="25" fill="url(#glowStraight)" opacity="0.5"/>
    </g>
    
    <text x="54" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7C3AED" font-weight="bold">平角</text>
    <text x="54" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748B">= 180°</text>
  </g>

  <!-- ===== 卡片 5: 周角 ===== -->
  <g transform="translate(476, 48)">
    <rect width="112" height="148" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect width="112" height="148" rx="14" fill="url(#cardHighlight)"/>
    <rect x="0" y="0" width="112" height="6" rx="3" fill="url(#fullGrad)"/>
    
    <g transform="translate(56, 95)">
      <!-- 圓圈代表360度 -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#DC2626" stroke-width="2.5"/>
      <!-- 起點/終點標記 -->
      <line x1="22" y1="0" x2="28" y2="0" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 弧線箭頭 -->
      <path d="M22,0 A22,22 0 1,1 20,-2" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
      <circle cx="0" cy="0" r="28" fill="url(#glowFull)" opacity="0.4"/>
      <!-- 中心點 -->
      <circle cx="0" cy="0" r="2.5" fill="#DC2626"/>
    </g>
    
    <text x="56" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="bold">周角</text>
    <text x="56" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748B">= 360°</text>
  </g>

  <!-- ===== 底部資訊條 ===== -->
  <g transform="translate(0, 360)">
    <rect x="0" y="0" width="600" height="40" rx="0" fill="#1E293B" opacity="0.05"/>
    <text x="300" y="18" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif" font-size="11" fill="#64748B">
      💡 銳角 &lt; 90° ｜ 直角 = 90° ｜ 鈍角 &gt; 90° ｜ 平角 = 180° ｜ 周角 = 360°
    </text>
    <text x="300" y="32" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans SC', Arial, sans-serif" font-size="9" fill="#94A3B8">
      香港小學數學 · 角度類型對比 v3
    </text>
  </g>
</svg>