<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F7FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8ECF1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DEE3E9;stop-opacity:1" />
    </linearGradient>

    <!-- 網格線漸變 -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CBD5E1;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:0.3" />
    </linearGradient>

    <!-- 主卡片漸變（多層 5-stop） -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F1F5F9;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#E2E8F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片邊框漸變 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:0.5" />
    </linearGradient>

    <!-- 坐標軸漸變 -->
    <linearGradient id="axisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>

    <!-- 點標記放射漸變（3D 光影效果） -->
    <radialGradient id="pointGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#EE4444;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#CC2222;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#991111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#660000;stop-opacity:1" />
    </radialGradient>

    <!-- 點標記高光 -->
    <radialGradient id="pointHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>

    <!-- 雙層陰影過濾器 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <!-- 第一層陰影（深色外層） -->
      <feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.25"/>
      <!-- 第二層陰影（淺色內層） -->
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>

    <!-- 點標記陰影 -->
    <filter id="pointShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- 網格背景圖案 -->
    <pattern id="bgPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <circle cx="20" cy="20" r="1.5" fill="#CBD5E1" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#bgPattern)"/>

  <!-- 主卡片（圓角卡片） -->
  <rect x="30" y="25" width="540" height="350" rx="18" ry="18" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="bold" fill="#1E293B" letter-spacing="2">坐標系 — 第一象限</text>
  <line x1="180" y1="68" x2="420" y2="68" stroke="#CBD5E1" stroke-width="1" opacity="0.6"/>

  <!-- 網格區域背景 -->
  <rect x="75" y="85" width="420" height="260" rx="8" ry="8" fill="#FFFFFF" fill-opacity="0.5" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- 垂直網格線（x=0 到 x=6） -->
  <g stroke="url(#gridGrad)" stroke-width="0.8">
    <line x1="75" y1="85" x2="75" y2="345"/>
    <line x1="145" y1="85" x2="145" y2="345"/>
    <line x1="215" y1="85" x2="215" y2="345"/>
    <line x1="285" y1="85" x2="285" y2="345"/>
    <line x1="355" y1="85" x2="355" y2="345"/>
    <line x1="425" y1="85" x2="425" y2="345"/>
    <line x1="495" y1="85" x2="495" y2="345"/>
  </g>

  <!-- 水平網格線（y=0 到 y=6） -->
  <g stroke="url(#gridGrad)" stroke-width="0.8">
    <line x1="75" y1="345" x2="495" y2="345"/>
    <line x1="75" y1="301.67" x2="495" y2="301.67"/>
    <line x1="75" y1="258.33" x2="495" y2="258.33"/>
    <line x1="75" y1="215" x2="495" y2="215"/>
    <line x1="75" y1="171.67" x2="495" y2="171.67"/>
    <line x1="75" y1="128.33" x2="495" y2="128.33"/>
    <line x1="75" y1="85" x2="495" y2="85"/>
  </g>

  <!-- X 軸（實線） -->
  <line x1="75" y1="345" x2="500" y2="345" stroke="url(#axisGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Y 軸（實線） -->
  <line x1="75" y1="345" x2="75" y2="80" stroke="url(#axisGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- X 軸箭頭 -->
  <polygon points="500,345 488,340 488,350" fill="#1E293B"/>
  <!-- Y 軸箭頭 -->
  <polygon points="75,80 70,92 80,92" fill="#1E293B"/>

  <!-- X 軸標籤 -->
  <g font-family="'Arial', sans-serif" font-size="13" fill="#475569" text-anchor="middle">
    <text x="75" y="368">0</text>
    <text x="145" y="368">1</text>
    <text x="215" y="368">2</text>
    <text x="285" y="368">3</text>
    <text x="355" y="368">4</text>
    <text x="425" y="368">5</text>
    <text x="495" y="368">6</text>
  </g>

  <!-- Y 軸標籤 -->
  <g font-family="'Arial', sans-serif" font-size="13" fill="#475569" text-anchor="end">
    <text x="68" y="349">0</text>
    <text x="68" y="305.67">1</text>
    <text x="68" y="262.33">2</text>
    <text x="68" y="219">3</text>
    <text x="68" y="175.67">4</text>
    <text x="68" y="132.33">5</text>
    <text x="68" y="89">6</text>
  </g>

  <!-- 軸標籤文字 -->
  <text x="510" y="355" font-family="'Arial', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">x</text>
  <text x="60" y="78" font-family="'Arial', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">y</text>

  <!-- 原點標記 O -->
  <text x="65" y="358" font-family="'Arial', sans-serif" font-size="14" font-style="italic" fill="#1E293B">O</text>

  <!-- 點 (3,4) 的輔助虛線 -->
  <line x1="285" y1="345" x2="285" y2="175.67" stroke="#FF6B6B" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>
  <line x1="75" y1="175.67" x2="285" y2="175.67" stroke="#FF6B6B" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- 點標記 (3,4) — 3D 立體效果 -->
  <g filter="url(#pointShadow)">
    <!-- 外層光暈 -->
    <circle cx="285" cy="175.67" r="16" fill="#FF6B6B" opacity="0.15"/>
    <!-- 主體 -->
    <circle cx="285" cy="175.67" r="11" fill="url(#pointGrad)"/>
    <!-- 高光 -->
    <circle cx="285" cy="175.67" r="11" fill="url(#pointHighlight)"/>
    <!-- 邊緣反光 -->
    <circle cx="285" cy="175.67" r="11" fill="none" stroke="#FF9999" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- 座標標籤 (3,4) -->
  <rect x="295" y="148" width="58" height="26" rx="6" ry="6" fill="#1E293B" opacity="0.85"/>
  <text x="324" y="166" text-anchor="middle" font-family="'Arial', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">(3,4)</text>

  <!-- 座標標籤小三角 -->
  <polygon points="295,174 303,174 299,180" fill="#1E293B" opacity="0.85"/>

  <!-- 圖例 -->
  <g transform="translate(380, 95)">
    <rect x="0" y="0" width="115" height="55" rx="8" ry="8" fill="#FFFFFF" fill-opacity="0.85" stroke="#E2E8F0" stroke-width="0.8"/>
    <circle cx="18" cy="18" r="6" fill="url(#pointGrad)"/>
    <text x="32" y="22" font-family="'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="11" fill="#475569">點 (3,4)</text>
    <line x1="10" y1="36" x2="26" y2="36" stroke="#FF6B6B" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
    <text x="32" y="40" font-family="'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="11" fill="#475569">輔助線</text>
  </g>

  <!-- 底部說明 -->
  <text x="300" y="388" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="11" fill="#94A3B8">香港小學數學 · 坐標系 · 第一象限 (0-6, 0-6)</text>
</svg>