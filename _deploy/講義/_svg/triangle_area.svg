<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </radialGradient>

    <!-- 三角形主漸變（3D光影） -->
    <linearGradient id="triGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#EE5A24"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>

    <!-- 三角形2漸變（複製旋轉） -->
    <linearGradient id="triGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="40%" stop-color="#A29BFE"/>
      <stop offset="100%" stop-color="#4834D4"/>
    </linearGradient>

    <!-- 平行四邊形漸變 -->
    <linearGradient id="paraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B894"/>
      <stop offset="50%" stop-color="#00CEC9"/>
      <stop offset="100%" stop-color="#00A885"/>
    </linearGradient>

    <!-- 放射漸變3D光影 -->
    <radialGradient id="glowGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.08)"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="rgba(0,0,0,0.06)"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="6" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- 圓角卡片 - 主要推導區 -->
  <rect x="20" y="15" width="560" height="370" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 標題 -->
  <text x="300" y="50" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#2D3436" letter-spacing="2">
    三角形面積公式推導
  </text>
  <text x="300" y="70" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#636E72">
    複製旋轉 → 平行四邊形 → ÷2
  </text>

  <!-- ===== 步驟1：原始三角形 ===== -->
  <g transform="translate(60, 100)">
    <!-- 三角形1（原始） -->
    <polygon points="0,120 100,120 50,20" fill="url(#triGrad1)" filter="url(#softShadow)" stroke="#C0392B" stroke-width="1.5"/>
    <!-- 3D光影 -->
    <polygon points="0,120 100,120 50,20" fill="url(#glowGrad)" opacity="0.5"/>
    <!-- 直角標記 -->
    <rect x="0" y="100" width="10" height="10" fill="none" stroke="#2D3436" stroke-width="1" opacity="0.4"/>
    <!-- 底邊標記 -->
    <line x1="0" y1="130" x2="100" y2="130" stroke="#2D3436" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="50" y="145" text-anchor="middle" font-family="'Times New Roman',serif" font-size="14" font-style="italic" fill="#2D3436">b</text>
    <!-- 高標記 -->
    <line x1="50" y1="20" x2="50" y2="120" stroke="#E17055" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="38" y="75" text-anchor="end" font-family="'Times New Roman',serif" font-size="14" font-style="italic" fill="#E17055">h</text>
    <!-- 標籤 -->
    <text x="50" y="170" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#636E72">① 原始三角形</text>
  </g>

  <!-- 箭頭1 → -->
  <g transform="translate(175, 160)">
    <text font-size="24" fill="#B2BEC3" font-weight="bold">→</text>
  </g>

  <!-- ===== 步驟2：複製旋轉 ===== -->
  <g transform="translate(210, 100)">
    <!-- 三角形1（原始） -->
    <polygon points="0,120 100,120 50,20" fill="url(#triGrad1)" filter="url(#softShadow)" stroke="#C0392B" stroke-width="1.2"/>
    <polygon points="0,120 100,120 50,20" fill="url(#glowGrad)" opacity="0.4"/>

    <!-- 三角形2（複製旋轉 - 翻轉） -->
    <polygon points="0,120 100,120 50,220" fill="url(#triGrad2)" filter="url(#softShadow)" stroke="#4834D4" stroke-width="1.2"/>
    <polygon points="0,120 100,120 50,220" fill="url(#glowGrad)" opacity="0.4"/>

    <!-- 旋轉箭頭指示 -->
    <path d="M 85,115 Q 110,70 75,30" fill="none" stroke="#6C5CE7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0,0 8,3 0,6" fill="#6C5CE7"/>
      </marker>
    </defs>
    <text x="105" y="65" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#6C5CE7">複製旋轉</text>

    <!-- 標籤 -->
    <text x="50" y="245" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#636E72">② 複製並旋轉</text>
  </g>

  <!-- 箭頭2 → -->
  <g transform="translate(325, 160)">
    <text font-size="24" fill="#B2BEC3" font-weight="bold">→</text>
  </g>

  <!-- ===== 步驟3：平行四邊形 ===== -->
  <g transform="translate(370, 100)">
    <!-- 平行四邊形 -->
    <polygon points="0,120 100,120 50,20 150,20" fill="url(#paraGrad)" filter="url(#softShadow)" stroke="#00A885" stroke-width="1.5"/>
    <polygon points="0,120 100,120 50,20 150,20" fill="url(#glowGrad)" opacity="0.4"/>

    <!-- 底邊標記 -->
    <line x1="0" y1="130" x2="150" y2="130" stroke="#2D3436" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="75" y="145" text-anchor="middle" font-family="'Times New Roman',serif" font-size="14" font-style="italic" fill="#2D3436">b</text>

    <!-- 高標記 -->
    <line x1="50" y1="20" x2="50" y2="120" stroke="#E17055" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="38" y="75" text-anchor="end" font-family="'Times New Roman',serif" font-size="14" font-style="italic" fill="#E17055">h</text>

    <!-- 面積公式 -->
    <text x="75" y="175" text-anchor="middle" font-family="'Times New Roman',serif" font-size="12" fill="#00A885">面積 = b × h</text>

    <!-- 標籤 -->
    <text x="75" y="245" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#636E72">③ 拼成平行四邊形</text>
  </g>

  <!-- ===== 底部：公式推導 ===== -->
  <g transform="translate(300, 340)">
    <!-- 公式推導卡片 -->
    <rect x="-200" y="-25" width="400" height="50" rx="12" fill="#F8F9FA" stroke="#E9ECEF" stroke-width="1"/>

    <!-- 公式文字 -->
    <text x="-160" y="5" font-family="'Times New Roman',serif" font-size="16" fill="#2D3436">
      <tspan font-weight="bold" fill="#EE5A24">三角形面積</tspan>
      <tspan fill="#636E72"> = 平行四邊形面積 ÷ 2 = </tspan>
      <tspan font-weight="bold" fill="#00B894">b × h ÷ 2</tspan>
      <tspan fill="#636E72"> = </tspan>
      <tspan font-weight="bold" fill="#6C5CE7">½bh</tspan>
    </text>

    <!-- 裝飾線 -->
    <line x1="-180" y1="-15" x2="180" y2="-15" stroke="#E9ECEF" stroke-width="1"/>
  </g>

  <!-- 裝飾元素：小三角形標記 -->
  <g opacity="0.08">
    <polygon points="30,30 50,30 40,50" fill="#EE5A24"/>
    <polygon points="570,30 550,30 560,50" fill="#6C5CE7"/>
    <polygon points="30,370 50,370 40,350" fill="#00B894"/>
    <polygon points="570,370 550,370 560,350" fill="#EE5A24"/>
  </g>
</svg>