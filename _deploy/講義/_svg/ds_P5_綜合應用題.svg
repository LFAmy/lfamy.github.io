<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#dce3f5"/>
    </radialGradient>

    <!-- 卡片1：閱讀理解 - 藍色系 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="50%" stop-color="#357ABD"/>
      <stop offset="100%" stop-color="#2B6CB0"/>
    </linearGradient>
    <radialGradient id="card1Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片2：分析問題 - 綠色系 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="50%" stop-color="#38A169"/>
      <stop offset="100%" stop-color="#2F855A"/>
    </linearGradient>
    <radialGradient id="card2Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片3：列式計算 - 橙色系 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED8936"/>
      <stop offset="50%" stop-color="#DD6B20"/>
      <stop offset="100%" stop-color="#C05621"/>
    </linearGradient>
    <radialGradient id="card3Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片4：驗算答案 - 紫色系 -->
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9F7AEA"/>
      <stop offset="50%" stop-color="#805AD5"/>
      <stop offset="100%" stop-color="#6B46C1"/>
    </linearGradient>
    <radialGradient id="card4Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 箭頭漸變 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A0AEC0"/>
      <stop offset="100%" stop-color="#CBD5E0"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#2D3748" flood-opacity="0.25"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.15"/>
    </filter>

    <filter id="cardShadowDeep" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="4" dy="7" stdDeviation="8" flood-color="#1A202C" flood-opacity="0.3"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.2"/>
    </filter>

    <!-- 圖標陰影 -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#1A202C" flood-opacity="0.2"/>
    </filter>

    <!-- 標題發光 -->
    <filter id="titleGlow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2B6CB0" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="80" fill="rgba(74,144,217,0.06)"/>
  <circle cx="550" cy="350" r="100" fill="rgba(72,187,120,0.05)"/>
  <circle cx="500" cy="60" r="60" fill="rgba(237,137,54,0.04)"/>
  <circle cx="80" cy="340" r="70" fill="rgba(159,122,234,0.05)"/>

  <!-- 標題 -->
  <text x="300" y="42" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="22" font-weight="bold" fill="#2D3748" filter="url(#titleGlow)">📐 應用題四步框架</text>
  <text x="300" y="62" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#718096">香港小學數學 · 綜合應用</text>

  <!-- 連接箭頭 -->
  <!-- 箭頭1→2 -->
  <line x1="160" y1="160" x2="200" y2="160" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="198,154 210,160 198,166" fill="#A0AEC0"/>

  <!-- 箭頭2→3 -->
  <line x1="310" y1="160" x2="350" y2="160" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="348,154 360,160 348,166" fill="#A0AEC0"/>

  <!-- 箭頭3→4 -->
  <line x1="460" y1="160" x2="500" y2="160" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="498,154 510,160 498,166" fill="#A0AEC0"/>

  <!-- ========== 卡片1：閱讀理解 ========== -->
  <g filter="url(#cardShadowDeep)">
    <rect x="20" y="90" width="140" height="180" rx="16" fill="url(#card1Grad)"/>
    <rect x="20" y="90" width="140" height="180" rx="16" fill="url(#card1Shine)"/>
    <!-- 3D光影效果 - 底部反光 -->
    <rect x="20" y="240" width="140" height="30" rx="16" fill="rgba(255,255,255,0.08)"/>
    <rect x="20" y="250" width="140" height="20" rx="10" fill="rgba(255,255,255,0.05)"/>
  </g>

  <!-- 圖標：書本/閱讀 -->
  <g filter="url(#iconShadow)">
    <circle cx="90" cy="130" r="22" fill="rgba(255,255,255,0.2)"/>
    <text x="90" y="137" text-anchor="middle" font-size="22">📖</text>
  </g>

  <text x="90" y="175" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">閱讀理解</text>
  <text x="90" y="195" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">找出題目中的</text>
  <text x="90" y="212" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">已知條件和問題</text>

  <!-- 步驟編號 -->
  <circle cx="30" cy="98" r="12" fill="rgba(255,255,255,0.25)"/>
  <text x="30" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">1</text>

  <!-- ========== 卡片2：分析問題 ========== -->
  <g filter="url(#cardShadowDeep)">
    <rect x="210" y="90" width="140" height="180" rx="16" fill="url(#card2Grad)"/>
    <rect x="210" y="90" width="140" height="180" rx="16" fill="url(#card2Shine)"/>
    <rect x="210" y="240" width="140" height="30" rx="16" fill="rgba(255,255,255,0.08)"/>
    <rect x="210" y="250" width="140" height="20" rx="10" fill="rgba(255,255,255,0.05)"/>
  </g>

  <g filter="url(#iconShadow)">
    <circle cx="280" cy="130" r="22" fill="rgba(255,255,255,0.2)"/>
    <text x="280" y="137" text-anchor="middle" font-size="22">🔍</text>
  </g>

  <text x="280" y="175" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">分析問題</text>
  <text x="280" y="195" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">思考數量關係</text>
  <text x="280" y="212" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">決定計算方法</text>

  <circle cx="220" cy="98" r="12" fill="rgba(255,255,255,0.25)"/>
  <text x="220" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">2</text>

  <!-- ========== 卡片3：列式計算 ========== -->
  <g filter="url(#cardShadowDeep)">
    <rect x="400" y="90" width="140" height="180" rx="16" fill="url(#card3Grad)"/>
    <rect x="400" y="90" width="140" height="180" rx="16" fill="url(#card3Shine)"/>
    <rect x="400" y="240" width="140" height="30" rx="16" fill="rgba(255,255,255,0.08)"/>
    <rect x="400" y="250" width="140" height="20" rx="10" fill="rgba(255,255,255,0.05)"/>
  </g>

  <g filter="url(#iconShadow)">
    <circle cx="470" cy="130" r="22" fill="rgba(255,255,255,0.2)"/>
    <text x="470" y="137" text-anchor="middle" font-size="22">✏️</text>
  </g>

  <text x="470" y="175" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">列式計算</text>
  <text x="470" y="195" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">寫出橫式/直式</text>
  <text x="470" y="212" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">仔細計算答案</text>

  <circle cx="410" cy="98" r="12" fill="rgba(255,255,255,0.25)"/>
  <text x="410" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">3</text>

  <!-- ========== 卡片4：驗算答案 ========== -->
  <g filter="url(#cardShadowDeep)">
    <rect x="590" y="90" width="140" height="180" rx="16" fill="url(#card4Grad)"/>
    <rect x="590" y="90" width="140" height="180" rx="16" fill="url(#card4Shine)"/>
    <rect x="590" y="240" width="140" height="30" rx="16" fill="rgba(255,255,255,0.08)"/>
    <rect x="590" y="250" width="140" height="20" rx="10" fill="rgba(255,255,255,0.05)"/>
  </g>

  <g filter="url(#iconShadow)">
    <circle cx="660" cy="130" r="22" fill="rgba(255,255,255,0.2)"/>
    <text x="660" y="137" text-anchor="middle" font-size="22">✅</text>
  </g>

  <text x="660" y="175" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">驗算答案</text>
  <text x="660" y="195" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">檢查計算過程</text>
  <text x="660" y="212" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">確認答案合理</text>

  <circle cx="600" cy="98" r="12" fill="rgba(255,255,255,0.25)"/>
  <text x="600" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">4</text>

  <!-- ========== 底部提示框 ========== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="300" width="360" height="70" rx="14" fill="#FFFFFF" opacity="0.9"/>
    <rect x="120" y="300" width="360" height="70" rx="14" fill="rgba(255,255,255,0.5)"/>
  </g>

  <text x="300" y="325" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="bold" fill="#4A5568">💡 小提示</text>
  <text x="300" y="348" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#718096">完成每一步後，在旁邊 ✓ 打勾，確保沒有遺漏！</text>

  <!-- 底部裝飾線 -->
  <line x1="180" y1="385" x2="420" y2="385" stroke="rgba(74,144,217,0.2)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="300" cy="385" r="3" fill="rgba(74,144,217,0.3)"/>
</svg>