<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8EDF2;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片1：2x+3=11 漸變 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片2：2x=8 漸變 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F093FB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5576C;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片3：x=4 漸變 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>

    <!-- 放射漸變 3D 光影效果 -->
    <radialGradient id="shine1" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>

    <radialGradient id="shine2" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>

    <radialGradient id="shine3" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <filter id="doubleShadowSmall" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#667EEA"/>
    </marker>
    <marker id="arrowPink" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#F5576C"/>
    </marker>

    <!-- 操作標籤背景 -->
    <linearGradient id="opGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8ECF1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D5DCE4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="opGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8ECF1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D5DCE4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="8"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#2D3748" letter-spacing="1">
    兩步方程流程 — 2x + 3 = 11
  </text>
  <line x1="180" y1="48" x2="420" y2="48" stroke="#CBD5E0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ========== 卡片 1：2x + 3 = 11 ========== -->
  <g filter="url(#doubleShadow)">
    <rect x="30" y="72" width="160" height="100" rx="18" ry="18" fill="url(#card1Grad)"/>
    <rect x="30" y="72" width="160" height="100" rx="18" ry="18" fill="url(#shine1)"/>
  </g>
  <text x="110" y="118" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    2x + 3 = 11
  </text>
  <text x="110" y="148" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="13" fill="#FFFFFF" fill-opacity="0.85">
    初始方程
  </text>

  <!-- 操作標籤 1：減3 -->
  <g filter="url(#doubleShadowSmall)">
    <rect x="75" y="180" width="70" height="32" rx="16" ry="16" fill="url(#opGrad1)"/>
  </g>
  <text x="110" y="200" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="13" font-weight="700" fill="#4A5568">
    − 3
  </text>

  <!-- 箭頭 1 → -->
  <line x1="190" y1="122" x2="250" y2="122" stroke="#667EEA" stroke-width="2.5" marker-end="url(#arrowBlue)" stroke-linecap="round"/>

  <!-- ========== 卡片 2：2x = 8 ========== -->
  <g filter="url(#doubleShadow)">
    <rect x="260" y="72" width="160" height="100" rx="18" ry="18" fill="url(#card2Grad)"/>
    <rect x="260" y="72" width="160" height="100" rx="18" ry="18" fill="url(#shine2)"/>
  </g>
  <text x="340" y="118" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    2x = 8
  </text>
  <text x="340" y="148" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="13" fill="#FFFFFF" fill-opacity="0.85">
    兩邊同時減 3
  </text>

  <!-- 操作標籤 2：÷2 -->
  <g filter="url(#doubleShadowSmall)">
    <rect x="305" y="180" width="70" height="32" rx="16" ry="16" fill="url(#opGrad2)"/>
  </g>
  <text x="340" y="200" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="13" font-weight="700" fill="#4A5568">
    ÷ 2
  </text>

  <!-- 箭頭 2 → -->
  <line x1="420" y1="122" x2="480" y2="122" stroke="#F5576C" stroke-width="2.5" marker-end="url(#arrowPink)" stroke-linecap="round"/>

  <!-- ========== 卡片 3：x = 4 ========== -->
  <g filter="url(#doubleShadow)">
    <rect x="490" y="72" width="100" height="100" rx="18" ry="18" fill="url(#card3Grad)"/>
    <rect x="490" y="72" width="100" height="100" rx="18" ry="18" fill="url(#shine3)"/>
  </g>
  <text x="540" y="118" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    x = 4
  </text>
  <text x="540" y="148" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="13" fill="#FFFFFF" fill-opacity="0.85">
    兩邊除以 2
  </text>

  <!-- ========== 底部提示 ========== -->
  <g transform="translate(300, 260)" text-anchor="middle">
    <rect x="-180" y="-15" width="360" height="40" rx="10" ry="10" fill="#FFFFFF" fill-opacity="0.6" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="10" font-family="'Microsoft JhengHei', 'PingFang TC', sans-serif" font-size="14" fill="#4A5568">
      <tspan font-weight="700" fill="#667EEA">減 3</tspan>
      <tspan fill="#A0AEC0"> 消去常數項 → </tspan>
      <tspan font-weight="700" fill="#F5576C">除以 2</tspan>
      <tspan fill="#A0AEC0"> 得到未知數 </tspan>
    </text>
  </g>

  <!-- 裝飾小點 -->
  <circle cx="50" cy="350" r="3" fill="#667EEA" fill-opacity="0.3"/>
  <circle cx="150" cy="360" r="2" fill="#F5576C" fill-opacity="0.25"/>
  <circle cx="450" cy="355" r="3" fill="#4FACFE" fill-opacity="0.3"/>
  <circle cx="550" cy="345" r="2" fill="#764BA2" fill-opacity="0.2"/>
  <circle cx="380" cy="370" r="2.5" fill="#F093FB" fill-opacity="0.2"/>
</svg>