<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="100%" stop-color="#d4e8f0"/>
    </radialGradient>

    <!-- 天秤底座金屬漸變 -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c0a060"/>
      <stop offset="30%" stop-color="#e8d48b"/>
      <stop offset="50%" stop-color="#f0e6a8"/>
      <stop offset="70%" stop-color="#d4b86a"/>
      <stop offset="100%" stop-color="#a08040"/>
    </linearGradient>

    <!-- 天秤柱體漸變 -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b7355"/>
      <stop offset="30%" stop-color="#c4a86a"/>
      <stop offset="50%" stop-color="#dcc88a"/>
      <stop offset="70%" stop-color="#b89858"/>
      <stop offset="100%" stop-color="#7a6040"/>
    </linearGradient>

    <!-- 天秤橫桿漸變 -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="20%" stop-color="#d4a830"/>
      <stop offset="50%" stop-color="#f0c850"/>
      <stop offset="80%" stop-color="#c49828"/>
      <stop offset="100%" stop-color="#7a5c10"/>
    </linearGradient>

    <!-- 左盤金色漸變 -->
    <radialGradient id="panLeftGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f5e6a0"/>
      <stop offset="40%" stop-color="#e8d070"/>
      <stop offset="80%" stop-color="#c8a840"/>
      <stop offset="100%" stop-color="#a08030"/>
    </radialGradient>

    <!-- 右盤金色漸變 -->
    <radialGradient id="panRightGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f5e6a0"/>
      <stop offset="40%" stop-color="#e8d070"/>
      <stop offset="80%" stop-color="#c8a840"/>
      <stop offset="100%" stop-color="#a08030"/>
    </radialGradient>

    <!-- 左盤陰影 -->
    <radialGradient id="panShadowLeft" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- 右盤陰影 -->
    <radialGradient id="panShadowRight" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- 方塊漸變（左） -->
    <linearGradient id="blockLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="30%" stop-color="#5ba0e8"/>
      <stop offset="60%" stop-color="#3a80c8"/>
      <stop offset="100%" stop-color="#2a60a0"/>
    </linearGradient>

    <!-- 方塊漸變（右） -->
    <linearGradient id="blockRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e85a5a"/>
      <stop offset="30%" stop-color="#f06a6a"/>
      <stop offset="60%" stop-color="#d04a4a"/>
      <stop offset="100%" stop-color="#b03030"/>
    </linearGradient>

    <!-- 方塊3D側面漸變（左） -->
    <linearGradient id="blockLeftSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a70b0"/>
      <stop offset="100%" stop-color="#1a4a80"/>
    </linearGradient>

    <!-- 方塊3D頂面漸變（左） -->
    <linearGradient id="blockLeftTopGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5aa0e8"/>
      <stop offset="100%" stop-color="#7ab8f0"/>
    </linearGradient>

    <!-- 方塊3D側面漸變（右） -->
    <linearGradient id="blockRightSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c04040"/>
      <stop offset="100%" stop-color="#902020"/>
    </linearGradient>

    <!-- 方塊3D頂面漸變（右） -->
    <linearGradient id="blockRightTopGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e06060"/>
      <stop offset="100%" stop-color="#f08080"/>
    </linearGradient>

    <!-- 繩子陰影濾鏡 -->
    <filter id="stringShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.2)"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.1)"/>
    </filter>

    <!-- 天秤整體陰影 -->
    <filter id="scaleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="rgba(0,0,0,0.2)"/>
    </filter>

    <!-- 發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 放射背景 -->
    <radialGradient id="radialBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="60%" stop-color="#d0e4ec"/>
      <stop offset="100%" stop-color="#b8d0dc"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="16" ry="16" fill="url(#radialBg)"/>
  <rect width="600" height="400" rx="16" ry="16" fill="none" stroke="#a0c0d0" stroke-width="1.5" opacity="0.5"/>

  <!-- 頂部裝飾條 -->
  <rect x="0" y="0" width="600" height="6" rx="3" fill="url(#baseGrad)" opacity="0.6"/>

  <!-- 標題區域 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="bold" fill="#3a5a6a" letter-spacing="2">
    ⚖️ 代數天秤 — 平衡方程式
  </text>
  <line x1="180" y1="40" x2="420" y2="40" stroke="#8ab0c0" stroke-width="0.8" opacity="0.5"/>

  <!-- 天秤主體分組 -->
  <g filter="url(#scaleShadow)">

    <!-- 底座陰影 -->
    <ellipse cx="300" cy="348" rx="120" ry="12" fill="rgba(0,0,0,0.12)"/>

    <!-- 底座 -->
    <rect x="200" y="330" width="200" height="20" rx="6" ry="6" fill="url(#baseGrad)" stroke="#8a6a30" stroke-width="1"/>
    <!-- 底座高光 -->
    <rect x="210" y="332" width="180" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>

    <!-- 底座裝飾 -->
    <rect x="240" y="335" width="120" height="3" rx="1.5" fill="rgba(160,130,60,0.4)"/>

    <!-- 柱體 -->
    <rect x="290" y="180" width="20" height="152" rx="3" fill="url(#pillarGrad)" stroke="#7a6040" stroke-width="0.8"/>
    <!-- 柱體高光 -->
    <rect x="294" y="185" width="4" height="140" rx="2" fill="rgba(255,255,255,0.2)"/>

    <!-- 柱體頂部裝飾 -->
    <rect x="285" y="178" width="30" height="8" rx="4" fill="url(#baseGrad)" stroke="#8a6a30" stroke-width="0.8"/>

    <!-- 橫桿 — 3D立體效果 -->
    <rect x="120" y="168" width="360" height="14" rx="4" fill="url(#beamGrad)" stroke="#7a5c10" stroke-width="0.8"/>
    <!-- 橫桿高光 -->
    <rect x="125" y="170" width="350" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
    <!-- 橫桿底部陰影 -->
    <rect x="125" y="178" width="350" height="2" rx="1" fill="rgba(0,0,0,0.1)"/>

    <!-- 橫桿兩端裝飾 -->
    <circle cx="130" cy="175" r="5" fill="url(#baseGrad)" stroke="#8a6a30" stroke-width="0.8"/>
    <circle cx="470" cy="175" r="5" fill="url(#baseGrad)" stroke="#8a6a30" stroke-width="0.8"/>

    <!-- 中心支點裝飾 -->
    <circle cx="300" cy="175" r="8" fill="url(#baseGrad)" stroke="#8a6a30" stroke-width="1.2"/>
    <circle cx="300" cy="175" r="3" fill="#f0e6a8"/>

    <!-- 左繩子 -->
    <line x1="160" y1="182" x2="160" y2="230" stroke="#8a7a5a" stroke-width="2.5" filter="url(#stringShadow)"/>
    <!-- 左繩子分叉 -->
    <line x1="160" y1="230" x2="130" y2="250" stroke="#8a7a5a" stroke-width="2" filter="url(#stringShadow)"/>
    <line x1="160" y1="230" x2="190" y2="250" stroke="#8a7a5a" stroke-width="2" filter="url(#stringShadow)"/>

    <!-- 右繩子 -->
    <line x1="440" y1="182" x2="440" y2="230" stroke="#8a7a5a" stroke-width="2.5" filter="url(#stringShadow)"/>
    <!-- 右繩子分叉 -->
    <line x1="440" y1="230" x2="410" y2="250" stroke="#8a7a5a" stroke-width="2" filter="url(#stringShadow)"/>
    <line x1="440" y1="230" x2="470" y2="250" stroke="#8a7a5a" stroke-width="2" filter="url(#stringShadow)"/>

    <!-- 左盤子 -->
    <ellipse cx="160" cy="290" rx="70" ry="18" fill="url(#panShadowLeft)"/>
    <ellipse cx="160" cy="285" rx="70" ry="18" fill="url(#panLeftGrad)" stroke="#a08030" stroke-width="1.2"/>
    <!-- 盤子高光 -->
    <ellipse cx="160" cy="280" rx="50" ry="8" fill="rgba(255,255,255,0.2)"/>
    <!-- 盤子邊緣 -->
    <ellipse cx="160" cy="285" rx="70" ry="18" fill="none" stroke="#c8a840" stroke-width="0.5" opacity="0.6"/>

    <!-- 右盤子 -->
    <ellipse cx="440" cy="290" rx="70" ry="18" fill="url(#panShadowRight)"/>
    <ellipse cx="440" cy="285" rx="70" ry="18" fill="url(#panRightGrad)" stroke="#a08030" stroke-width="1.2"/>
    <!-- 盤子高光 -->
    <ellipse cx="440" cy="280" rx="50" ry="8" fill="rgba(255,255,255,0.2)"/>
    <!-- 盤子邊緣 -->
    <ellipse cx="440" cy="285" rx="70" ry="18" fill="none" stroke="#c8a840" stroke-width="0.5" opacity="0.6"/>

    <!-- 左盤方塊 — 2個藍色方塊（2x） -->
    <!-- 方塊1 -->
    <g>
      <rect x="130" y="248" width="28" height="28" rx="3" fill="url(#blockLeftGrad)" stroke="#2a60a0" stroke-width="1"/>
      <rect x="130" y="248" width="28" height="6" rx="2" fill="url(#blockLeftTopGrad)"/>
      <rect x="130" y="254" width="6" height="22" rx="1" fill="url(#blockLeftSideGrad)"/>
      <text x="144" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">x</text>
    </g>
    <!-- 方塊2 -->
    <g>
      <rect x="162" y="248" width="28" height="28" rx="3" fill="url(#blockLeftGrad)" stroke="#2a60a0" stroke-width="1"/>
      <rect x="162" y="248" width="28" height="6" rx="2" fill="url(#blockLeftTopGrad)"/>
      <rect x="162" y="254" width="6" height="22" rx="1" fill="url(#blockLeftSideGrad)"/>
      <text x="176" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">x</text>
    </g>

    <!-- 右盤方塊 — 6個紅色數字方塊 -->
    <g>
      <rect x="400" y="248" width="22" height="22" rx="3" fill="url(#blockRightGrad)" stroke="#b03030" stroke-width="0.8"/>
      <rect x="400" y="248" width="22" height="5" rx="2" fill="url(#blockRightTopGrad)"/>
      <text x="411" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
    </g>
    <g>
      <rect x="424" y="248" width="22" height="22" rx="3" fill="url(#blockRightGrad)" stroke="#b03030" stroke-width="0.8"/>
      <rect x="424" y="248" width="22" height="5" rx="2" fill="url(#blockRightTopGrad)"/>
      <text x="435" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
    </g>
    <g>
      <rect x="448" y="248" width="22" height="22" rx="3" fill="url(#blockRightGrad)" stroke="#b03030" stroke-width="0.8"/>
      <rect x="448" y="248" width="22" height="5" rx="2" fill="url(#blockRightTopGrad)"/>
      <text x="459" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
    </g>
    <g>
      <rect x="400" y="272" width="22" height="22" rx="3" fill="url(#blockRightGrad)" stroke="#b03030" stroke-width="0.8"/>
      <rect x="400" y="272" width="22" height="5" rx="2" fill="url(#blockRightTopGrad)"/>
      <text x="411" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
    </g>
    <g>
      <rect x="424" y="272" width="22" height="22" rx="3" fill="url(#blockRightGrad)" stroke="#b03030" stroke-width="0.8"/>
      <rect x="424" y="272" width="22" height="5" rx="2" fill="url(#blockRightTopGrad)"/>
      <text x="435" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
    </g>
    <g>
      <rect x="448" y="272" width="22" height="22" rx="3" fill="url(#blockRightGrad)" stroke="#b03030" stroke-width="0.8"/>
      <rect x="448" y="272" width="22" height="5" rx="2" fill="url(#blockRightTopGrad)"/>
      <text x="459" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
    </g>

  </g>

  <!-- 方程式卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="60" width="160" height="90" rx="12" ry="12" fill="white" opacity="0.92"/>
    <rect x="20" y="60" width="160" height="90" rx="12" ry="12" fill="none" stroke="#c0d8e0" stroke-width="1.2"/>

    <!-- 卡片頂部裝飾 -->
    <rect x="20" y="60" width="160" height="6" rx="3" fill="url(#blockLeftGrad)" opacity="0.7"/>

    <text x="100" y="82" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#5a7a8a">📐 方程式</text>
    <line x1="40" y1="88" x2="160" y2="88" stroke="#d0e0e8" stroke-width="0.5"/>

    <text x="100" y="108" text-anchor="middle" font-family="'Times New Roman',serif" font-size="22" font-weight="bold" fill="#2a5a7a">
      2x = 6
    </text>
    <text x="100" y="130" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#4a7a8a">
      x = <tspan font-weight="bold" fill="#d04040">3</tspan>
    </text>
  </g>

  <!-- 解說卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="420" y="60" width="160" height="90" rx="12" ry="12" fill="white" opacity="0.92"/>
    <rect x="420" y="60" width="160" height="90" rx="12" ry="12" fill="none" stroke="#c0d8e0" stroke-width="1.2"/>

    <!-- 卡片頂部裝飾 -->
    <rect x="420" y="60" width="160" height="6" rx="3" fill="url(#blockRightGrad)" opacity="0.7"/>

    <text x="500" y="82" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#5a7a8a">💡 平衡操作</text>
    <line x1="440" y1="88" x2="560" y2="88" stroke="#d0e0e8" stroke-width="0.5"/>

    <text x="500" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#4a6a7a">
      兩邊各拿走一半
    </text>
    <text x="500" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#4a6a7a">
      每邊剩 <tspan font-weight="bold" fill="#2a6a9a">x</tspan> = <tspan font-weight="bold" fill="#d04040">3</tspan>
    </text>
  </g>

  <!-- 底部裝飾文字 -->
  <text x="300" y="380" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#8aacbc" opacity="0.7">
    香港小學數學 · 代數天秤 · 平衡視覺化
  </text>

</svg>