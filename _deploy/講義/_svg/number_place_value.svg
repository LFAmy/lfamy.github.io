<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </radialGradient>

    <!-- 百位卡片主漸變（暖色） -->
    <linearGradient id="hundredGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="30%" stop-color="#FF8E53"/>
      <stop offset="60%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E84855"/>
    </linearGradient>

    <!-- 百位卡片光澤漸變 -->
    <linearGradient id="hundredShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 十位卡片主漸變（冷色） -->
    <linearGradient id="tenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="30%" stop-color="#44B09E"/>
      <stop offset="60%" stop-color="#3DA5A0"/>
      <stop offset="100%" stop-color="#2E8B89"/>
    </linearGradient>

    <!-- 十位卡片光澤漸變 -->
    <linearGradient id="tenShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 個位卡片主漸變（紫色） -->
    <linearGradient id="oneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="30%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- 個位卡片光澤漸變 -->
    <linearGradient id="oneShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 等號卡片漸變 -->
    <linearGradient id="equalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>

    <!-- 加號卡片漸變 -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- 雙層陰影過濾器 - 百位 -->
    <filter id="shadowHundred" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="rgba(232,72,85,0.4)"/>
      <feDropShadow dx="-1" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 雙層陰影過濾器 - 十位 -->
    <filter id="shadowTen" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="rgba(46,139,137,0.4)"/>
      <feDropShadow dx="-1" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 雙層陰影過濾器 - 個位 -->
    <filter id="shadowOne" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="rgba(109,40,217,0.4)"/>
      <feDropShadow dx="-1" dy="2" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 雙層陰影過濾器 - 小卡片 -->
    <filter id="shadowSmall" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
      <feDropShadow dx="-1" dy="1" stdDeviation="6" flood-color="rgba(0,0,0,0.1)"/>
    </filter>

    <!-- 放射漸變 - 百位3D頂部 -->
    <radialGradient id="hundredTop" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 放射漸變 - 十位3D頂部 -->
    <radialGradient id="tenTop" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 放射漸變 - 個位3D頂部 -->
    <radialGradient id="oneTop" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#374151" letter-spacing="2">
    位值展開式
  </text>
  <text x="300" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9CA3AF" letter-spacing="1">
    Place Value Expansion
  </text>

  <!-- ========== 主要等式：365 = 3百 + 6十 + 5個 ========== -->

  <!-- 365 主卡片 - 百位 -->
  <g filter="url(#shadowHundred)">
    <!-- 3D 底部（陰影層） -->
    <rect x="38" y="78" width="100" height="130" rx="14" fill="#C0392B" opacity="0.3" transform="translate(4,4)"/>
    <!-- 3D 側面 -->
    <rect x="38" y="78" width="100" height="130" rx="14" fill="url(#hundredGrad)" opacity="0.85" transform="translate(2,2)"/>
    <!-- 主卡片正面 -->
    <rect x="38" y="78" width="100" height="130" rx="14" fill="url(#hundredGrad)"/>
    <!-- 光澤層 -->
    <rect x="38" y="78" width="100" height="130" rx="14" fill="url(#hundredShine)"/>
    <!-- 放射頂部光暈 -->
    <rect x="38" y="78" width="100" height="130" rx="14" fill="url(#hundredTop)"/>
    <!-- 邊框高光 -->
    <rect x="38" y="78" width="100" height="130" rx="14" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <!-- 數字 3 -->
    <text x="88" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">3</text>
    <!-- 單位標籤 -->
    <rect x="48" y="175" width="80" height="22" rx="11" fill="rgba(255,255,255,0.25)"/>
    <text x="88" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">百</text>
  </g>

  <!-- 加號 -->
  <g filter="url(#shadowSmall)">
    <rect x="148" y="118" width="36" height="36" rx="10" fill="url(#plusGrad)"/>
    <text x="166" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">+</text>
  </g>

  <!-- 6 十位卡片 -->
  <g filter="url(#shadowTen)">
    <rect x="194" y="78" width="100" height="130" rx="14" fill="#1A7A72" opacity="0.3" transform="translate(4,4)"/>
    <rect x="194" y="78" width="100" height="130" rx="14" fill="url(#tenGrad)" opacity="0.85" transform="translate(2,2)"/>
    <rect x="194" y="78" width="100" height="130" rx="14" fill="url(#tenGrad)"/>
    <rect x="194" y="78" width="100" height="130" rx="14" fill="url(#tenShine)"/>
    <rect x="194" y="78" width="100" height="130" rx="14" fill="url(#tenTop)"/>
    <rect x="194" y="78" width="100" height="130" rx="14" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="244" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">6</text>
    <rect x="204" y="175" width="80" height="22" rx="11" fill="rgba(255,255,255,0.25)"/>
    <text x="244" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">十</text>
  </g>

  <!-- 加號 -->
  <g filter="url(#shadowSmall)">
    <rect x="304" y="118" width="36" height="36" rx="10" fill="url(#plusGrad)"/>
    <text x="322" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">+</text>
  </g>

  <!-- 5 個位卡片 -->
  <g filter="url(#shadowOne)">
    <rect x="350" y="78" width="100" height="130" rx="14" fill="#5B21B6" opacity="0.3" transform="translate(4,4)"/>
    <rect x="350" y="78" width="100" height="130" rx="14" fill="url(#oneGrad)" opacity="0.85" transform="translate(2,2)"/>
    <rect x="350" y="78" width="100" height="130" rx="14" fill="url(#oneGrad)"/>
    <rect x="350" y="78" width="100" height="130" rx="14" fill="url(#oneShine)"/>
    <rect x="350" y="78" width="100" height="130" rx="14" fill="url(#oneTop)"/>
    <rect x="350" y="78" width="100" height="130" rx="14" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <text x="400" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">5</text>
    <rect x="360" y="175" width="80" height="22" rx="11" fill="rgba(255,255,255,0.25)"/>
    <text x="400" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">個</text>
  </g>

  <!-- ========== 底部展開式 ========== -->

  <!-- 等號 -->
  <g filter="url(#shadowSmall)">
    <rect x="38" y="240" width="36" height="36" rx="10" fill="url(#equalGrad)"/>
    <text x="56" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">=</text>
  </g>

  <!-- 展開式：3百 -->
  <g filter="url(#shadowSmall)">
    <rect x="84" y="240" width="90" height="36" rx="10" fill="url(#hundredGrad)"/>
    <text x="129" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3 百</text>
  </g>

  <!-- 加號 -->
  <g filter="url(#shadowSmall)">
    <rect x="184" y="240" width="30" height="36" rx="10" fill="url(#plusGrad)"/>
    <text x="199" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">+</text>
  </g>

  <!-- 展開式：6十 -->
  <g filter="url(#shadowSmall)">
    <rect x="224" y="240" width="90" height="36" rx="10" fill="url(#tenGrad)"/>
    <text x="269" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">6 十</text>
  </g>

  <!-- 加號 -->
  <g filter="url(#shadowSmall)">
    <rect x="324" y="240" width="30" height="36" rx="10" fill="url(#plusGrad)"/>
    <text x="339" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">+</text>
  </g>

  <!-- 展開式：5個 -->
  <g filter="url(#shadowSmall)">
    <rect x="364" y="240" width="90" height="36" rx="10" fill="url(#oneGrad)"/>
    <text x="409" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">5 個</text>
  </g>

  <!-- ========== 底部數值對照 ========== -->

  <!-- 數值條背景 -->
  <rect x="38" y="300" width="524" height="70" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" opacity="0.9"/>
  <rect x="38" y="300" width="524" height="70" rx="16" fill="url(#bgGrad)" opacity="0.5"/>

  <!-- 數值條：300 -->
  <text x="100" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#E84855">300</text>
  <text x="100" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9CA3AF">3 × 100</text>

  <!-- 加號 -->
  <text x="195" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#F59E0B">+</text>

  <!-- 數值條：60 -->
  <text x="270" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#2E8B89">60</text>
  <text x="270" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9CA3AF">6 × 10</text>

  <!-- 加號 -->
  <text x="365" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#F59E0B">+</text>

  <!-- 數值條：5 -->
  <text x="440" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#7C3AED">5</text>
  <text x="440" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9CA3AF">5 × 1</text>

  <!-- 等號 -->
  <text x="500" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#6B7280">=</text>

  <!-- 結果 365 -->
  <text x="545" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#374151">365</text>

  <!-- 裝飾性圓點 -->
  <circle cx="560" cy="88" r="3" fill="#FF6B6B" opacity="0.6"/>
  <circle cx="570" cy="88" r="3" fill="#4ECDC4" opacity="0.6"/>
  <circle cx="580" cy="88" r="3" fill="#A78BFA" opacity="0.6"/>
</svg>