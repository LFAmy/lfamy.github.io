<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#d6e4f0"/>
    </radialGradient>

    <!-- 卡片主體漸變（3D光影） -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#e8eef8"/>
    </linearGradient>

    <!-- 卡片邊框漸變 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8d8e8"/>
      <stop offset="50%" stop-color="#a0b8d0"/>
      <stop offset="100%" stop-color="#8899bb"/>
    </linearGradient>

    <!-- 羅盤外圈放射漸變 -->
    <radialGradient id="compassOuter" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#4a6fa5"/>
      <stop offset="60%" stop-color="#2c4a7c"/>
      <stop offset="100%" stop-color="#1a3058"/>
    </radialGradient>

    <!-- 羅盤內圈漸變 -->
    <radialGradient id="compassInner" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="50%" stop-color="#e8eff8"/>
      <stop offset="100%" stop-color="#d0dce8"/>
    </radialGradient>

    <!-- 北方向高光 -->
    <radialGradient id="northGlow" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#cc3333" stop-opacity="0.2"/>
    </radialGradient>

    <!-- 南方向陰影 -->
    <radialGradient id="southShadow" cx="50%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#4a6fa5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2c4a7c" stop-opacity="0.05"/>
    </radialGradient>

    <!-- 方向文字漸變 -->
    <linearGradient id="dirTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a2530"/>
    </linearGradient>

    <!-- 方向文字發光 -->
    <filter id="textGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <!-- 第一層陰影（深色，偏移大） -->
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#1a3058" flood-opacity="0.25"/>
      <!-- 第二層陰影（淺色，偏移小） -->
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#4a6fa5" flood-opacity="0.15"/>
    </filter>

    <!-- 輕微發光濾鏡 -->
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 網格線樣式 -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b0c8e0" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <!-- 箭頭標記 -->
    <marker id="arrowN" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,8 L4,0 L8,8" fill="#cc3333"/>
    </marker>
    <marker id="arrowS" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0" fill="#2c4a7c"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="3" fill="#a0b8d0" opacity="0.3"/>
  <circle cx="550" cy="60" r="4" fill="#a0b8d0" opacity="0.25"/>
  <circle cx="30" cy="350" r="2" fill="#a0b8d0" opacity="0.3"/>
  <circle cx="570" cy="340" r="3" fill="#a0b8d0" opacity="0.2"/>
  <circle cx="120" cy="380" r="2" fill="#a0b8d0" opacity="0.25"/>

  <!-- 主卡片 - 雙層陰影 -->
  <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" filter="url(#doubleShadow)"/>

  <!-- 卡片頂部裝飾條 -->
  <rect x="25" y="20" width="550" height="6" rx="3" ry="3" fill="url(#compassOuter)" opacity="0.8"/>

  <!-- 標題 -->
  <text x="300" y="62" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', 'Noto Sans HK', sans-serif" font-size="22" font-weight="bold" fill="url(#dirTextGrad)" filter="url(#textGlow)">🧭 方向與位置 — 八方向羅盤</text>

  <!-- 標題底線 -->
  <line x1="180" y1="72" x2="420" y2="72" stroke="#c8d8e8" stroke-width="1" opacity="0.6"/>

  <!-- ===== 坐標網格 ===== -->
  <g transform="translate(300, 230)">
    <!-- 網格背景 -->
    <rect x="-140" y="-140" width="280" height="280" rx="8" fill="#f5f9ff" stroke="#c0d0e0" stroke-width="0.8" opacity="0.7"/>

    <!-- 網格線 -->
    <rect x="-140" y="-140" width="280" height="280" rx="8" fill="url(#gridPattern)" opacity="0.6"/>

    <!-- 中心十字線（較粗） -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#8899bb" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#8899bb" stroke-width="1" opacity="0.6"/>

    <!-- 對角線 -->
    <line x1="-140" y1="-140" x2="140" y2="140" stroke="#b0c8e0" stroke-width="0.5" opacity="0.4" stroke-dasharray="4,4"/>
    <line x1="140" y1="-140" x2="-140" y2="140" stroke="#b0c8e0" stroke-width="0.5" opacity="0.4" stroke-dasharray="4,4"/>

    <!-- 網格座標標籤 -->
    <text x="-148" y="4" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#8899bb" opacity="0.7">0</text>
    <text x="4" y="-148" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8899bb" opacity="0.7">0</text>
    <text x="148" y="4" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#8899bb" opacity="0.7">4</text>
    <text x="4" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8899bb" opacity="0.7">4</text>
    <text x="-148" y="-148" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#8899bb" opacity="0.5">(0,4)</text>
    <text x="148" y="-148" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#8899bb" opacity="0.5">(4,4)</text>
    <text x="-148" y="148" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#8899bb" opacity="0.5">(0,0)</text>
    <text x="148" y="148" text-anchor="start" font-family="Arial, sans-serif" font-size="9" fill="#8899bb" opacity="0.5">(4,0)</text>

    <!-- 網格交點小點 -->
    <g fill="#7a9abb" opacity="0.4">
      <circle cx="-140" cy="-140" r="2"/>
      <circle cx="-100" cy="-140" r="1.5"/>
      <circle cx="-60" cy="-140" r="1.5"/>
      <circle cx="-20" cy="-140" r="1.5"/>
      <circle cx="20" cy="-140" r="1.5"/>
      <circle cx="60" cy="-140" r="1.5"/>
      <circle cx="100" cy="-140" r="1.5"/>
      <circle cx="140" cy="-140" r="2"/>
      <circle cx="-140" cy="-100" r="1.5"/>
      <circle cx="-140" cy="-60" r="1.5"/>
      <circle cx="-140" cy="-20" r="1.5"/>
      <circle cx="-140" cy="20" r="1.5"/>
      <circle cx="-140" cy="60" r="1.5"/>
      <circle cx="-140" cy="100" r="1.5"/>
      <circle cx="-140" cy="140" r="2"/>
      <circle cx="140" cy="-100" r="1.5"/>
      <circle cx="140" cy="-60" r="1.5"/>
      <circle cx="140" cy="-20" r="1.5"/>
      <circle cx="140" cy="20" r="1.5"/>
      <circle cx="140" cy="60" r="1.5"/>
      <circle cx="140" cy="100" r="1.5"/>
      <circle cx="140" cy="140" r="2"/>
      <circle cx="-100" cy="140" r="1.5"/>
      <circle cx="-60" cy="140" r="1.5"/>
      <circle cx="-20" cy="140" r="1.5"/>
      <circle cx="20" cy="140" r="1.5"/>
      <circle cx="60" cy="140" r="1.5"/>
      <circle cx="100" cy="140" r="1.5"/>
    </g>
  </g>

  <!-- ===== 羅盤 ===== -->
  <g transform="translate(300, 230)">
    <!-- 外圈（雙層陰影） -->
    <circle cx="0" cy="0" r="118" fill="url(#compassOuter)" stroke="#1a3058" stroke-width="1.5" filter="url(#doubleShadow)"/>

    <!-- 外圈高光 -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="#6a8fbf" stroke-width="0.8" opacity="0.4"/>

    <!-- 刻度環 -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#8aadd5" stroke-width="0.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#8aadd5" stroke-width="0.3" opacity="0.3"/>

    <!-- 刻度線（每10度） -->
    <g stroke="#b0c8e0" stroke-width="0.5" opacity="0.4">
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(0)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(30)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(60)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(90)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(120)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(150)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(180)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(210)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(240)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(270)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(300)"/>
      <line x1="0" y1="-105" x2="0" y2="-110" transform="rotate(330)"/>
    </g>

    <!-- 內圈 -->
    <circle cx="0" cy="0" r="85" fill="url(#compassInner)" stroke="#b0c8e0" stroke-width="1" opacity="0.9"/>

    <!-- 北方向發光 -->
    <circle cx="0" cy="0" r="85" fill="url(#northGlow)" opacity="0.15"/>

    <!-- 南方向陰影 -->
    <circle cx="0" cy="0" r="85" fill="url(#southShadow)" opacity="0.1"/>

    <!-- ===== 八方向標記 ===== -->

    <!-- 北（N）- 紅色箭頭 -->
    <polygon points="0,-80 -8,-20 0,-30 8,-20" fill="#cc3333" stroke="#aa2222" stroke-width="0.8"/>
    <text x="0" y="-88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#cc3333" filter="url(#softGlow)">N</text>

    <!-- 南（S） -->
    <polygon points="0,80 -8,20 0,30 8,20" fill="#2c4a7c" stroke="#1a3058" stroke-width="0.8"/>
    <text x="0" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c4a7c">S</text>

    <!-- 東（E） -->
    <polygon points="80,0 20,-8 30,0 20,8" fill="#2c4a7c" stroke="#1a3058" stroke-width="0.8"/>
    <text x="94" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c4a7c">E</text>

    <!-- 西（W） -->
    <polygon points="-80,0 -20,-8 -30,0 -20,8" fill="#2c4a7c" stroke="#1a3058" stroke-width="0.8"/>
    <text x="-94" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c4a7c">W</text>

    <!-- 東北（NE） -->
    <line x1="0" y1="0" x2="56" y2="-56" stroke="#b0c8e0" stroke-width="0.8" opacity="0.5" stroke-dasharray="3,3"/>
    <text x="64" y="-56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">NE</text>

    <!-- 西北（NW） -->
    <line x1="0" y1="0" x2="-56" y2="-56" stroke="#b0c8e0" stroke-width="0.8" opacity="0.5" stroke-dasharray="3,3"/>
    <text x="-64" y="-56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">NW</text>

    <!-- 東南（SE） -->
    <line x1="0" y1="0" x2="56" y2="56" stroke="#b0c8e0" stroke-width="0.8" opacity="0.5" stroke-dasharray="3,3"/>
    <text x="64" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">SE</text>

    <!-- 西南（SW） -->
    <line x1="0" y1="0" x2="-56" y2="56" stroke="#b0c8e0" stroke-width="0.8" opacity="0.5" stroke-dasharray="3,3"/>
    <text x="-64" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a6fa5">SW</text>

    <!-- 中心點 -->
    <circle cx="0" cy="0" r="5" fill="#2c4a7c" stroke="#1a3058" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#f5f9ff" opacity="0.8"/>

    <!-- 內圈裝飾環 -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#c0d0e0" stroke-width="0.5" opacity="0.4" stroke-dasharray="2,4"/>
  </g>

  <!-- ===== 圖例 ===== -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="500" height="55" rx="10" fill="#f5f9ff" stroke="#d0dce8" stroke-width="0.8" opacity="0.85"/>
    <text x="15" y="22" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="11" fill="#4a6fa5" font-weight="bold">📌 方向標記：</text>
    <text x="15" y="42" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="10" fill="#666">N（北）紅色 · S（南）深藍 · E（東）W（西） · NE/NW/SE/SW（斜角方向）</text>
    <text x="290" y="22" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="11" fill="#4a6fa5" font-weight="bold">📍 座標網格：</text>
    <text x="290" y="42" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="10" fill="#666">每格代表 1 單位 · 中心 (0,0) 為原點</text>
  </g>

  <!-- 裝飾小羅盤（右上角） -->
  <g transform="translate(530, 45)">
    <circle cx="0" cy="0" r="18" fill="#f0f4ff" stroke="#b0c8e0" stroke-width="0.8" opacity="0.6"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#cc3333" opacity="0.6">N</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2c4a7c" opacity="0.5">S</text>
    <text x="10" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2c4a7c" opacity="0.5">E</text>
    <text x="-10" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2c4a7c" opacity="0.5">W</text>
    <circle cx="0" cy="0" r="2" fill="#2c4a7c" opacity="0.4"/>
  </g>
</svg>