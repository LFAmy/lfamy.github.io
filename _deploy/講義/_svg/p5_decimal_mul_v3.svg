<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8f0fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dce8fa;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 - 3D立體感 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#fafcff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eef3fb;stop-opacity:1" />
    </linearGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a6b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a6b;stop-opacity:1" />
    </linearGradient>

    <!-- 格子陰影 - 雙層陰影效果 -->
    <filter id="gridShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#00000022" />
      <feDropShadow dx="0.5" dy="0.5" stdDeviation="0.5" flood-color="#00000011" />
    </filter>

    <!-- 卡片陰影 - 雙層 -->
    <filter id="cardShadow" x="-3%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#1a3a6b33" />
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1a3a6b1a" />
    </filter>

    <!-- 高亮光澤 -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- 選中格子放射漸變 - 3D光影 -->
    <radialGradient id="cellGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#ff7b5a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#e8553a;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#cc3d2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a82d1e;stop-opacity:1" />
    </radialGradient>

    <!-- 選中格子高光 -->
    <radialGradient id="cellHighlight" cx="30%" cy="25%" r="50%">
      <stop offset="0%" style="stop-color:#ffb8a8;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ffb8a8;stop-opacity:0" />
    </radialGradient>

    <!-- 未選中格子漸變 -->
    <linearGradient id="emptyCellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ecf5;stop-opacity:1" />
    </linearGradient>

    <!-- 網格線漸變 -->
    <linearGradient id="gridLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b0c4de;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#8aa8d0;stop-opacity:0.4" />
    </linearGradient>

    <!-- 按鈕漸變 -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7bc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5aa0;stop-opacity:1" />
    </linearGradient>

    <!-- 按鈕高光 -->
    <linearGradient id="btnHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6a9be4;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4a7bc4;stop-opacity:0" />
    </linearGradient>

    <!-- 陰影遮罩 -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="2" dy="3" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 數字發光 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0" ry="0" />

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="80" fill="#ffffff" opacity="0.15" />
  <circle cx="550" cy="350" r="100" fill="#ffffff" opacity="0.1" />
  <circle cx="520" cy="60" r="40" fill="#ffffff" opacity="0.12" />

  <!-- 主卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#ffffff" stroke-width="1.5" />

  <!-- 卡片高光 -->
  <rect x="25" y="20" width="550" height="180" rx="18" ry="18" fill="url(#highlight)" />

  <!-- 標題區域 -->
  <text x="300" y="62" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" letter-spacing="2">小數乘法 · 面積模型</text>

  <!-- 分隔線 -->
  <line x1="80" y1="78" x2="520" y2="78" stroke="url(#gridLineGrad)" stroke-width="1" stroke-dasharray="4,3" />

  <!-- 算式顯示 -->
  <rect x="185" y="88" width="230" height="36" rx="18" ry="18" fill="#2d5aa0" opacity="0.08" />
  <text x="300" y="112" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="20" font-weight="bold" fill="#2d5aa0">
    0.3 × 0.4 = 0.12
  </text>

  <!-- 10×10 網格背景 -->
  <rect x="100" y="140" width="200" height="200" rx="6" ry="6" fill="#f8faff" stroke="#c8d8e8" stroke-width="1.5" />

  <!-- 繪製10×10網格 -->
  <!-- 行和列 -->
  <g stroke="#c8d8e8" stroke-width="0.8" opacity="0.7">
    <!-- 垂直線 -->
    <line x1="120" y1="140" x2="120" y2="340" />
    <line x1="140" y1="140" x2="140" y2="340" />
    <line x1="160" y1="140" x2="160" y2="340" />
    <line x1="180" y1="140" x2="180" y2="340" />
    <line x1="200" y1="140" x2="200" y2="340" />
    <line x1="220" y1="140" x2="220" y2="340" />
    <line x1="240" y1="140" x2="240" y2="340" />
    <line x1="260" y1="140" x2="260" y2="340" />
    <line x1="280" y1="140" x2="280" y2="340" />
    <!-- 水平線 -->
    <line x1="100" y1="160" x2="300" y2="160" />
    <line x1="100" y1="180" x2="300" y2="180" />
    <line x1="100" y1="200" x2="300" y2="200" />
    <line x1="100" y1="220" x2="300" y2="220" />
    <line x1="100" y1="240" x2="300" y2="240" />
    <line x1="100" y1="260" x2="300" y2="260" />
    <line x1="100" y1="280" x2="300" y2="280" />
    <line x1="100" y1="300" x2="300" y2="300" />
    <line x1="100" y1="320" x2="300" y2="320" />
  </g>

  <!-- 網格外框 -->
  <rect x="100" y="140" width="200" height="200" rx="6" ry="6" fill="none" stroke="#7a9cc6" stroke-width="2" />

  <!-- 標記行（3行 = 0.3） -->
  <g>
    <!-- 第1行：4個選中 -->
    <rect x="100" y="140" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="120" y="140" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="140" y="140" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="160" y="140" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <!-- 第1行高光 -->
    <rect x="100" y="140" width="20" height="20" fill="url(#cellHighlight)" />
    <rect x="120" y="140" width="20" height="20" fill="url(#cellHighlight)" />
    <rect x="140" y="140" width="20" height="20" fill="url(#cellHighlight)" />
    <rect x="160" y="140" width="20" height="20" fill="url(#cellHighlight)" />

    <!-- 第2行：4個選中 -->
    <rect x="100" y="160" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="120" y="160" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="140" y="160" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="160" y="160" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="100" y="160" width="20" height="20" fill="url(#cellHighlight)" />
    <rect x="120" y="160" width="20" height="20" fill="url(#cellHighlight)" />
    <rect x="140" y="160" width="20" height="20" fill="url(#cellHighlight)" />
    <rect x="160" y="160" width="20" height="20" fill="url(#cellHighlight)" />

    <!-- 第3行：4個選中 -->
    <rect x="100" y="180" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="120" y="180" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="140" y="180" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="160" y="180" width="20" height="20" fill="url(#cellGrad)" filter="url(#gridShadow)" />
    <rect x="100" y="180" width="20" height="20" fill="url(#cellHighlight)" />
    <rect x="120" y="180" width="20" height="20" fill="url(#cellHighlight)" />
    <rect x="140" y="180" width="20" height="20" fill="url(#cellHighlight)" />
    <rect x="160" y="180" width="20" height="20" fill="url(#cellHighlight)" />
  </g>

  <!-- 標記區域邊框（3行×4列） -->
  <rect x="100" y="140" width="80" height="60" fill="none" stroke="#e8553a" stroke-width="2.5" stroke-dasharray="6,3" rx="2" ry="2" />

  <!-- 標籤：0.3（垂直） -->
  <text x="78" y="175" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="15" font-weight="bold" fill="#e8553a">0.3</text>
  <line x1="85" y1="140" x2="85" y2="200" stroke="#e8553a" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5" />

  <!-- 標籤：0.4（水平） -->
  <text x="140" y="358" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="15" font-weight="bold" fill="#e8553a">0.4</text>
  <line x1="100" y1="352" x2="180" y2="352" stroke="#e8553a" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5" />

  <!-- 圖例 -->
  <rect x="340" y="140" width="210" height="200" rx="12" ry="12" fill="#f5f9ff" stroke="#d0dff0" stroke-width="1" />

  <!-- 圖例標題 -->
  <text x="445" y="165" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#2d5aa0">圖例說明</text>

  <!-- 圖例項目1 -->
  <rect x="358" y="182" width="24" height="24" rx="4" ry="4" fill="url(#cellGrad)" filter="url(#gridShadow)" />
  <rect x="358" y="182" width="24" height="24" rx="4" ry="4" fill="url(#cellHighlight)" />
  <text x="392" y="199" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#444">已選中區域 (12格)</text>

  <!-- 圖例項目2 -->
  <rect x="358" y="218" width="24" height="24" rx="4" ry="4" fill="url(#emptyCellGrad)" stroke="#c8d8e8" stroke-width="0.8" />
  <text x="392" y="235" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#444">未選中區域</text>

  <!-- 圖例項目3 -->
  <rect x="358" y="254" width="24" height="24" rx="4" ry="4" fill="none" stroke="#e8553a" stroke-width="2" stroke-dasharray="4,2" />
  <text x="392" y="271" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#444">3行 × 4列 邊界</text>

  <!-- 計算過程 -->
  <rect x="340" y="290" width="210" height="42" rx="8" ry="8" fill="#2d5aa0" opacity="0.06" />
  <text x="445" y="310" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="13" fill="#2d5aa0" opacity="0.8">
    3 × 4 = 12 格
  </text>
  <text x="445" y="326" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="13" fill="#2d5aa0" opacity="0.8">
    每格 = 0.01 → 12 × 0.01 = 0.12
  </text>

  <!-- 底部資訊 -->
  <text x="300" y="365" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#7a9cc6" opacity="0.7">
    💡 拖動滑塊可調整數值 · 點擊格子可切換選中狀態
  </text>

  <!-- 裝飾小圓點 -->
  <circle cx="40" cy="200" r="3" fill="#4a7bc4" opacity="0.2" />
  <circle cx="560" cy="200" r="3" fill="#4a7bc4" opacity="0.2" />
  <circle cx="300" cy="385" r="2" fill="#4a7bc4" opacity="0.15" />
</svg>