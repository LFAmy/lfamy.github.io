<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A2A3A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1A2A3A" flood-opacity="0.08"/>
    </filter>

    <!-- 蝴蝶主體漸變（左翼） -->
    <linearGradient id="butterflyLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="40%" stop-color="#FF2E63"/>
      <stop offset="100%" stop-color="#C41E3A"/>
    </linearGradient>

    <!-- 蝴蝶主體漸變（右翼） -->
    <linearGradient id="butterflyRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="40%" stop-color="#FF2E63"/>
      <stop offset="100%" stop-color="#C41E3A"/>
    </linearGradient>

    <!-- 蝴蝶上翼漸層 -->
    <radialGradient id="butterflyUpperGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFB3C6"/>
      <stop offset="50%" stop-color="#FF6B9D" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF2E63" stop-opacity="0.3"/>
    </radialGradient>

    <!-- 蝴蝶下翼漸層 -->
    <radialGradient id="butterflyLowerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD6E0"/>
      <stop offset="60%" stop-color="#FF8FAB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2E63" stop-opacity="0.2"/>
    </radialGradient>

    <!-- 蝴蝶3D光影 -->
    <filter id="butterfly3D" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#1A0A0A" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 蝴蝶翅膀光澤 -->
    <linearGradient id="wingShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 風車葉片漸變 -->
    <linearGradient id="blade1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#2EAFAC"/>
    </linearGradient>
    <linearGradient id="blade2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE66D"/>
      <stop offset="100%" stop-color="#F7C948"/>
    </linearGradient>
    <linearGradient id="blade3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E84848"/>
    </linearGradient>
    <linearGradient id="blade4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C5CE7"/>
    </linearGradient>

    <!-- 風車3D光影 -->
    <filter id="windmill3D" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="3" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#1A2A3A" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 風車葉片光澤 -->
    <linearGradient id="bladeShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- 風車中心放射漸變 -->
    <radialGradient id="centerHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E8EDF2"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </radialGradient>

    <!-- 對稱軸虛線樣式 -->
    <style>
      .axis-line { stroke: #FF6B9D; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
      .axis-label { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-size: 13px; fill: #FF2E63; font-weight: bold; }
      .angle-label { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-size: 13px; fill: #7C5CE7; font-weight: bold; }
      .title-text { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-size: 16px; fill: #2C3E50; font-weight: bold; }
      .subtitle-text { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-size: 12px; fill: #7F8C8D; }
      .card-bg { fill: #FFFFFF; rx: 16; ry: 16; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- 頂部標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Arial','Microsoft YaHei',sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">對稱圖形</text>
  <text x="300" y="52" text-anchor="middle" font-family="'Arial','Microsoft YaHei',sans-serif" font-size="12" fill="#7F8C8D">軸對稱 vs 旋轉對稱</text>

  <!-- ============ 左側卡片：軸對稱（蝴蝶） ============ -->
  <g transform="translate(15, 70)">
    <!-- 卡片背景 -->
    <rect class="card-bg" x="0" y="0" width="275" height="310" filter="url(#cardShadow)"/>

    <!-- 卡片標題 -->
    <text x="137" y="28" text-anchor="middle" class="title-text">軸對稱</text>
    <text x="137" y="46" text-anchor="middle" class="subtitle-text">蝴蝶</text>

    <!-- 蝴蝶圖案區域 -->
    <g transform="translate(137, 175)">

      <!-- 對稱軸（垂直虛線） -->
      <line x1="0" y1="-95" x2="0" y2="95" class="axis-line"/>
      <text x="0" y="-100" text-anchor="middle" class="axis-label">對稱軸</text>

      <!-- 左翅膀（上） -->
      <g filter="url(#butterfly3D)">
        <ellipse cx="-35" cy="-30" rx="45" ry="35" fill="url(#butterflyLeft)" transform="rotate(-15, -35, -30)"/>
        <ellipse cx="-35" cy="-30" rx="45" ry="35" fill="url(#butterflyUpperGrad)" transform="rotate(-15, -35, -30)"/>
        <ellipse cx="-35" cy="-30" rx="45" ry="35" fill="url(#wingShine)" transform="rotate(-15, -35, -30)"/>
      </g>

      <!-- 右翅膀（上） -->
      <g filter="url(#butterfly3D)">
        <ellipse cx="35" cy="-30" rx="45" ry="35" fill="url(#butterflyRight)" transform="rotate(15, 35, -30)"/>
        <ellipse cx="35" cy="-30" rx="45" ry="35" fill="url(#butterflyUpperGrad)" transform="rotate(15, 35, -30)"/>
        <ellipse cx="35" cy="-30" rx="45" ry="35" fill="url(#wingShine)" transform="rotate(15, 35, -30)"/>
      </g>

      <!-- 左翅膀（下） -->
      <g filter="url(#butterfly3D)">
        <ellipse cx="-30" cy="25" rx="38" ry="28" fill="url(#butterflyLeft)" transform="rotate(10, -30, 25)"/>
        <ellipse cx="-30" cy="25" rx="38" ry="28" fill="url(#butterflyLowerGrad)" transform="rotate(10, -30, 25)"/>
        <ellipse cx="-30" cy="25" rx="38" ry="28" fill="url(#wingShine)" transform="rotate(10, -30, 25)"/>
      </g>

      <!-- 右翅膀（下） -->
      <g filter="url(#butterfly3D)">
        <ellipse cx="30" cy="25" rx="38" ry="28" fill="url(#butterflyRight)" transform="rotate(-10, 30, 25)"/>
        <ellipse cx="30" cy="25" rx="38" ry="28" fill="url(#butterflyLowerGrad)" transform="rotate(-10, 30, 25)"/>
        <ellipse cx="30" cy="25" rx="38" ry="28" fill="url(#wingShine)" transform="rotate(-10, 30, 25)"/>
      </g>

      <!-- 蝴蝶身體 -->
      <ellipse cx="0" cy="0" rx="5" ry="35" fill="#2C1810"/>
      <ellipse cx="0" cy="0" rx="3" ry="33" fill="#4A2C20"/>

      <!-- 觸角 -->
      <path d="M-3,-33 Q-20,-55 -25,-65" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M3,-33 Q20,-55 25,-65" stroke="#2C1810" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="-25" cy="-65" r="3" fill="#FF6B9D"/>
      <circle cx="25" cy="-65" r="3" fill="#FF6B9D"/>

      <!-- 翅膀花紋 -->
      <circle cx="-35" cy="-30" r="8" fill="#FFFFFF" fill-opacity="0.25"/>
      <circle cx="35" cy="-30" r="8" fill="#FFFFFF" fill-opacity="0.25"/>
      <circle cx="-30" cy="25" r="6" fill="#FFFFFF" fill-opacity="0.2"/>
      <circle cx="30" cy="25" r="6" fill="#FFFFFF" fill-opacity="0.2"/>
    </g>

    <!-- 說明文字 -->
    <text x="137" y="270" text-anchor="middle" font-family="'Arial','Microsoft YaHei',sans-serif" font-size="11" fill="#7F8C8D">沿對稱軸摺疊，兩側完全重合</text>
    <text x="137" y="288" text-anchor="middle" font-family="'Arial','Microsoft YaHei',sans-serif" font-size="11" fill="#7F8C8D">左右形狀、大小、顏色相同</text>
  </g>

  <!-- ============ 右側卡片：旋轉對稱（風車） ============ -->
  <g transform="translate(310, 70)">
    <!-- 卡片背景 -->
    <rect class="card-bg" x="0" y="0" width="275" height="310" filter="url(#cardShadow)"/>

    <!-- 卡片標題 -->
    <text x="137" y="28" text-anchor="middle" class="title-text">旋轉對稱</text>
    <text x="137" y="46" text-anchor="middle" class="subtitle-text">風車</text>

    <!-- 風車圖案區域 -->
    <g transform="translate(137, 175)">

      <!-- 旋轉角度標示 -->
      <text x="0" y="-110" text-anchor="middle" class="angle-label">旋轉 90° 重合</text>

      <!-- 旋轉中心點 -->
      <circle cx="0" cy="0" r="3" fill="#7C5CE7"/>

      <!-- 葉片1（上） -->
      <g filter="url(#windmill3D)">
        <polygon points="0,0 -18,-8 0,-80 18,-8" fill="url(#blade1)"/>
        <polygon points="0,0 -18,-8 0,-80 18,-8" fill="url(#bladeShine)"/>
      </g>

      <!-- 葉片2（右） -->
      <g filter="url(#windmill3D)">
        <polygon points="0,0 8,-18 80,0 8,18" fill="url(#blade2)"/>
        <polygon points="0,0 8,-18 80,0 8,18" fill="url(#bladeShine)"/>
      </g>

      <!-- 葉片3（下） -->
      <g filter="url(#windmill3D)">
        <polygon points="0,0 18,8 0,80 -18,8" fill="url(#blade3)"/>
        <polygon points="0,0 18,8 0,80 -18,8" fill="url(#bladeShine)"/>
      </g>

      <!-- 葉片4（左） -->
      <g filter="url(#windmill3D)">
        <polygon points="0,0 -8,18 -80,0 -8,-18" fill="url(#blade4)"/>
        <polygon points="0,0 -8,18 -80,0 -8,-18" fill="url(#bladeShine)"/>
      </g>

      <!-- 中心蓋 -->
      <circle cx="0" cy="0" r="12" fill="url(#centerHub)" stroke="#B0BEC5" stroke-width="1"/>
      <circle cx="0" cy="0" r="5" fill="#7C5CE7"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>

      <!-- 旋轉角度弧線 -->
      <path d="M0,-55 A55,55 0 0,1 55,0" stroke="#7C5CE7" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
      <text x="32" y="-32" text-anchor="middle" class="angle-label" font-size="11">90°</text>
    </g>

    <!-- 說明文字 -->
    <text x="137" y="270" text-anchor="middle" font-family="'Arial','Microsoft YaHei',sans-serif" font-size="11" fill="#7F8C8D">繞中心點旋轉 90° 後與原圖重合</text>
    <text x="137" y="288" text-anchor="middle" font-family="'Arial','Microsoft YaHei',sans-serif" font-size="11" fill="#7F8C8D">共有 4 個旋轉對稱位置</text>
  </g>

  <!-- 底部裝飾線 -->
  <line x1="50" y1="388" x2="550" y2="388" stroke="#D0D7DE" stroke-width="1" opacity="0.5"/>
</svg>