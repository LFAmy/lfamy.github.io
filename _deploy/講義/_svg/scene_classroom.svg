<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="30%" stop-color="#FAFBFC"/>
      <stop offset="60%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>

    <!-- 牆面漸變 -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="50%" stop-color="#FFEED6"/>
      <stop offset="100%" stop-color="#FFE0B8"/>
    </linearGradient>

    <!-- 黑板漸變 -->
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="30%" stop-color="#1E4A1A"/>
      <stop offset="60%" stop-color="#1A3F16"/>
      <stop offset="100%" stop-color="#0F2A0C"/>
    </linearGradient>

    <!-- 黑板放射光影 -->
    <radialGradient id="boardGlare" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 桌面漸變 -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A056"/>
      <stop offset="30%" stop-color="#C8923E"/>
      <stop offset="60%" stop-color="#B87D2E"/>
      <stop offset="100%" stop-color="#A06B20"/>
    </linearGradient>

    <!-- 桌面光影 -->
    <radialGradient id="deskGlare" cx="0.4" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 窗天空漸變 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="40%" stop-color="#B0E0F6"/>
      <stop offset="70%" stop-color="#D4EDFC"/>
      <stop offset="100%" stop-color="#E8F4FD"/>
    </linearGradient>

    <!-- 地板漸變 -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A87C"/>
      <stop offset="50%" stop-color="#B8986A"/>
      <stop offset="100%" stop-color="#A88858"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
    </filter>

    <filter id="shadow2" x="-10%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="rgba(0,0,0,0.25)"/>
    </filter>

    <filter id="shadow3" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.15)"/>
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="rgba(0,0,0,0.1)"/>
    </filter>

    <!-- 圓角卡片濾鏡 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.12)"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 粉筆字發光 -->
    <filter id="chalkGlow">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="0.5"/>
    </pattern>

    <!-- 窗框陰影 -->
    <filter id="windowShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>

    <!-- 植物葉片漸變 -->
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CB85C"/>
      <stop offset="100%" stop-color="#3D8B3D"/>
    </linearGradient>

    <!-- 書本漸變 -->
    <linearGradient id="bookGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <linearGradient id="bookGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <linearGradient id="bookGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 地板 -->
  <rect x="0" y="280" width="600" height="120" fill="url(#floorGrad)"/>
  <!-- 地板線條 -->
  <line x1="0" y1="300" x2="600" y2="300" stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="360" x2="600" y2="360" stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>

  <!-- 牆面 -->
  <rect x="0" y="0" width="600" height="280" fill="url(#wallGrad)"/>

  <!-- 牆面裝飾線 -->
  <rect x="0" y="270" width="600" height="10" fill="#E8D5B8" opacity="0.5"/>

  <!-- ========== 窗戶 ========== -->
  <g filter="url(#windowShadow)">
    <!-- 窗框 -->
    <rect x="380" y="40" width="160" height="200" rx="4" fill="#F5F0E8" stroke="#D4C8B0" stroke-width="3"/>
    <!-- 天空 -->
    <rect x="388" y="48" width="144" height="184" rx="2" fill="url(#skyGrad)"/>
    <!-- 雲朵 -->
    <ellipse cx="430" cy="90" rx="25" ry="12" fill="white" opacity="0.8"/>
    <ellipse cx="450" cy="85" rx="20" ry="10" fill="white" opacity="0.7"/>
    <ellipse cx="500" cy="100" rx="18" ry="9" fill="white" opacity="0.6"/>
    <!-- 太陽 -->
    <circle cx="510" cy="65" r="15" fill="#FFD93D" opacity="0.9"/>
    <circle cx="510" cy="65" r="20" fill="#FFD93D" opacity="0.2"/>
    <!-- 遠山 -->
    <path d="M388 200 Q420 160 450 185 Q480 150 510 180 Q530 155 532 200 Z" fill="#A8D5A2" opacity="0.5"/>
    <!-- 建築 -->
    <rect x="420" y="170" width="30" height="62" fill="#E8D5C8" opacity="0.6"/>
    <rect x="460" y="180" width="25" height="52" fill="#D8C8B8" opacity="0.5"/>
    <rect x="425" y="175" width="8" height="8" fill="#B0D0F0" opacity="0.7"/>
    <rect x="438" y="175" width="8" height="8" fill="#B0D0F0" opacity="0.7"/>
    <!-- 窗框十字 -->
    <line x1="460" y1="48" x2="460" y2="232" stroke="#D4C8B0" stroke-width="2.5"/>
    <line x1="388" y1="140" x2="532" y2="140" stroke="#D4C8B0" stroke-width="2.5"/>
    <!-- 窗台 -->
    <rect x="375" y="235" width="170" height="8" rx="2" fill="#E8DCC8" stroke="#D4C8B0" stroke-width="1"/>
  </g>

  <!-- ========== 黑板 ========== -->
  <g filter="url(#shadow2)">
    <!-- 黑板外框 -->
    <rect x="40" y="30" width="280" height="180" rx="6" fill="#8B7355" stroke="#6B5335" stroke-width="2"/>
    <!-- 黑板內面 -->
    <rect x="46" y="36" width="268" height="168" rx="4" fill="url(#boardGrad)"/>
    <!-- 黑板反光 -->
    <rect x="46" y="36" width="268" height="168" rx="4" fill="url(#boardGlare)"/>

    <!-- 粉筆字 - 數學公式 -->
    <text x="65" y="70" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-size="16" fill="#F5F5DC" opacity="0.9" filter="url(#chalkGlow)">數學公式</text>
    <text x="65" y="95" font-family="'Times New Roman', serif" font-size="20" fill="#FFFDE7" opacity="0.85" font-style="italic">E = mc²</text>
    <text x="65" y="125" font-family="'Times New Roman', serif" font-size="18" fill="#FFFDE7" opacity="0.8">a² + b² = c²</text>
    <text x="65" y="155" font-family="'Times New Roman', serif" font-size="16" fill="#FFFDE7" opacity="0.75">π = 3.14159...</text>
    <text x="65" y="180" font-family="'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif" font-size="14" fill="#FFD700" opacity="0.7">✏ 記住公式！</text>

    <!-- 粉筆灰效果 -->
    <circle cx="280" cy="190" r="3" fill="white" opacity="0.1"/>
    <circle cx="270" cy="195" r="2" fill="white" opacity="0.08"/>
    <circle cx="290" cy="192" r="1.5" fill="white" opacity="0.06"/>
  </g>

  <!-- ========== 書桌 ========== -->
  <g filter="url(#shadow3)">
    <!-- 桌腳 -->
    <rect x="70" y="270" width="8" height="50" fill="#8B6914" rx="1"/>
    <rect x="222" y="270" width="8" height="50" fill="#8B6914" rx="1"/>
    <rect x="80" y="270" width="6" height="45" fill="#7A5E12" rx="1"/>
    <rect x="214" y="270" width="6" height="45" fill="#7A5E12" rx="1"/>

    <!-- 抽屜 -->
    <rect x="72" y="260" width="156" height="18" rx="2" fill="#B8882E" stroke="#A07020" stroke-width="1"/>
    <circle cx="150" cy="269" r="3" fill="#D4A056" stroke="#A07020" stroke-width="0.5"/>

    <!-- 桌面 -->
    <rect x="60" y="240" width="180" height="22" rx="3" fill="url(#deskGrad)"/>
    <rect x="60" y="240" width="180" height="22" rx="3" fill="url(#deskGlare)"/>
    <!-- 桌面邊緣高光 -->
    <line x1="62" y1="242" x2="238" y2="242" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  </g>

  <!-- ========== 書桌上的物品 ========== -->

  <!-- 書本 1 -->
  <g filter="url(#shadow1)">
    <rect x="80" y="225" width="30" height="18" rx="2" fill="url(#bookGrad1)"/>
    <rect x="80" y="225" width="30" height="3" rx="1" fill="rgba(255,255,255,0.2)"/>
    <line x1="85" y1="230" x2="105" y2="230" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <line x1="85" y1="234" x2="105" y2="234" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  </g>

  <!-- 書本 2 -->
  <g filter="url(#shadow1)">
    <rect x="115" y="222" width="28" height="20" rx="2" fill="url(#bookGrad2)"/>
    <rect x="115" y="222" width="28" height="3" rx="1" fill="rgba(255,255,255,0.2)"/>
    <line x1="120" y1="228" x2="138" y2="228" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <line x1="120" y1="233" x2="138" y2="233" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  </g>

  <!-- 書本 3 -->
  <g filter="url(#shadow1)">
    <rect x="148" y="227" width="25" height="16" rx="2" fill="url(#bookGrad3)"/>
    <rect x="148" y="227" width="25" height="3" rx="1" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- 鉛筆 -->
  <g filter="url(#shadow1)">
    <rect x="185" y="228" width="3" height="14" rx="0.5" fill="#FFD700" transform="rotate(-15,186,235)"/>
    <polygon points="185,228 188,228 186.5,224" fill="#F5A623" transform="rotate(-15,186,235)"/>
    <rect x="185" y="240" width="3" height="2" rx="0.3" fill="#FF6B6B" transform="rotate(-15,186,235)"/>
  </g>

  <!-- 橡皮擦 -->
  <g filter="url(#shadow1)">
    <rect x="195" y="230" width="12" height="8" rx="1.5" fill="#FF9FF3"/>
    <rect x="195" y="230" width="12" height="3" rx="1" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- ========== 盆栽 ========== -->
  <g filter="url(#shadow1)">
    <!-- 花盆 -->
    <path d="M520 260 L525 240 L555 240 L560 260 Z" fill="#D4845A" stroke="#B06A40" stroke-width="1"/>
    <rect x="522" y="238" width="36" height="5" rx="2" fill="#C0784A"/>
    <!-- 泥土 -->
    <ellipse cx="540" cy="245" rx="14" ry="4" fill="#5D4037" opacity="0.6"/>
    <!-- 葉子 -->
    <ellipse cx="535" cy="230" rx="8" ry="12" fill="url(#leafGrad)" transform="rotate(-15,535,230)"/>
    <ellipse cx="545" cy="228" rx="7" ry="11" fill="url(#leafGrad)" transform="rotate(10,545,228)"/>
    <ellipse cx="540" cy="220" rx="6" ry="10" fill="#6DC86D" transform="rotate(-5,540,220)"/>
    <!-- 小花 -->
    <circle cx="540" cy="215" r="3" fill="#FF6B8A"/>
    <circle cx="540" cy="215" r="1.5" fill="#FFD700"/>
  </g>

  <!-- ========== 時鐘 ========== -->
  <g filter="url(#shadow1)">
    <circle cx="320" cy="80" r="22" fill="white" stroke="#8B7355" stroke-width="2.5"/>
    <circle cx="320" cy="80" r="20" fill="#FFFDE7"/>
    <!-- 時鐘刻度 -->
    <line x1="320" y1="62" x2="320" y2="66" stroke="#333" stroke-width="1.5"/>
    <line x1="320" y1="94" x2="320" y2="98" stroke="#333" stroke-width="1.5"/>
    <line x1="302" y1="80" x2="306" y2="80" stroke="#333" stroke-width="1.5"/>
    <line x1="334" y1="80" x2="338" y2="80" stroke="#333" stroke-width="1.5"/>
    <!-- 時針分針 -->
    <line x1="320" y1="80" x2="320" y2="68" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="320" y1="80" x2="330" y2="80" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="320" cy="80" r="2" fill="#333"/>
  </g>

  <!-- ========== 公告欄 ========== -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="220" width="12" height="60" rx="2" fill="#D4A056" opacity="0.6"/>
    <rect x="55" y="218" width="100" height="65" rx="4" fill="#FFF8E7" stroke="#E8D5B8" stroke-width="1"/>
    <!-- 公告內容 -->
    <text x="65" y="238" font-family="'Arial Rounded MT Bold', sans-serif" font-size="9" fill="#E74C3C" font-weight="bold">📢 重要通知</text>
    <text x="65" y="252" font-family="sans-serif" font-size="8" fill="#555">1. 明天測驗</text>
    <text x="65" y="264" font-family="sans-serif" font-size="8" fill="#555">2. 帶齊文具</text>
    <text x="65" y="276" font-family="sans-serif" font-size="8" fill="#555">3. 準時上課</text>
  </g>

  <!-- ========== 門 ========== -->
  <g filter="url(#shadow1)">
    <rect x="560" y="60" width="35" height="210" rx="3" fill="#C8923E" stroke="#A07020" stroke-width="1.5"/>
    <rect x="560" y="60" width="35" height="210" rx="3" fill="url(#deskGlare)" opacity="0.3"/>
    <!-- 門把 -->
    <circle cx="580" cy="180" r="3" fill="#FFD700" stroke="#D4A056" stroke-width="1"/>
    <!-- 門板裝飾 -->
    <rect x="565" y="80" width="25" height="40" rx="2" fill="none" stroke="#B8882E" stroke-width="0.8" opacity="0.5"/>
    <rect x="565" y="135" width="25" height="40" rx="2" fill="none" stroke="#B8882E" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- ========== 天花板燈 ========== -->
  <g>
    <rect x="270" y="0" width="60" height="8" rx="2" fill="#E8D5B8"/>
    <path d="M280 8 L290 25 L310 25 L320 8 Z" fill="#FFFDE7" opacity="0.8"/>
    <!-- 燈光光暈 -->
    <ellipse cx="300" cy="30" rx="40" ry="15" fill="#FFFDE7" opacity="0.15"/>
    <ellipse cx="300" cy="40" rx="60" ry="25" fill="#FFFDE7" opacity="0.08"/>
  </g>

  <!-- ========== 窗簾 ========== -->
  <g>
    <path d="M375 40 Q370 100 372 240" stroke="#E8D5B8" stroke-width="3" fill="none"/>
    <path d="M545 40 Q550 100 548 240" stroke="#E8D5B8" stroke-width="3" fill="none"/>
    <!-- 窗簾布 -->
    <path d="M375 40 Q365 80 370 130 Q368 180 372 240 L380 240 L380 40 Z" fill="#FFE0B8" opacity="0.3"/>
    <path d="M545 40 Q555 80 550 130 Q552 180 548 240 L540 240 L540 40 Z" fill="#FFE0B8" opacity="0.3"/>
  </g>

  <!-- ========== 裝飾小物 ========== -->

  <!-- 牆上畫作 -->
  <g filter="url(#shadow1)">
    <rect x="320" y="110" width="40" height="30" rx="2" fill="#FFF8E7" stroke="#D4C8B0" stroke-width="1"/>
    <rect x="323" y="113" width="34" height="24" rx="1" fill="#E8F4FD"/>
    <!-- 簡單畫作內容 -->
    <circle cx="340" cy="125" r="5" fill="#FFD93D" opacity="0.7"/>
    <path d="M325 135 L335 122 L345 135 Z" fill="#6DC86D" opacity="0.5"/>
  </g>

  <!-- 地上小裝飾 -->
  <g filter="url(#shadow1)">
    <rect x="320" y="275" width="15" height="10" rx="2" fill="#E8D5C8"/>
    <rect x="322" y="277" width="11" height="6" rx="1" fill="#FFF8E7"/>
  </g>

  <!-- ========== 整體暖色調光暈 ========== -->
  <rect x="0" y="0" width="600" height="400" fill="#FF8C00" opacity="0.03"/>

  <!-- ========== 前景裝飾 - 地板反光 ========== -->
  <ellipse cx="150" cy="320" rx="80" ry="10" fill="rgba(255,255,255,0.08)"/>

</svg>