<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>

    <!-- 平行四邊形漸變（3D光影） -->
    <linearGradient id="paraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a00e0;stop-opacity:1" />
    </linearGradient>

    <!-- 平行四邊形高光漸變 -->
    <linearGradient id="paraHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- 三角形漸變（3D光影） -->
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5576c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c31432;stop-opacity:1" />
    </linearGradient>

    <!-- 三角形高光漸變 -->
    <linearGradient id="triHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- 放射漸變（光暈效果） -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 陰影濾鏡（雙層陰影） -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.1" />
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- 文字光暈 -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0" />

  <!-- 背景裝飾圓 -->
  <circle cx="100" cy="80" r="120" fill="url(#glowGrad)" />
  <circle cx="500" cy="320" r="150" fill="url(#glowGrad)" />

  <!-- 主卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="20" ry="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" filter="url(#cardShadow)" />

  <!-- 標題區域 -->
  <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#textGlow)">📐 平行四邊形 vs 三角形</text>
  <text x="300" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">同底等高 · 面積關係探索</text>

  <!-- 分隔線 -->
  <line x1="60" y1="90" x2="540" y2="90" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- ==================== 左側：平行四邊形 ==================== -->
  <g transform="translate(55, 110)">
    <!-- 平行四邊形雙層陰影 -->
    <polygon points="15,140 195,140 235,20 55,20" fill="#000000" opacity="0.3" transform="translate(4,6)" filter="url(#doubleShadow)" />
    
    <!-- 平行四邊形主體 -->
    <polygon points="15,140 195,140 235,20 55,20" fill="url(#paraGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" filter="url(#doubleShadow)" />
    
    <!-- 平行四邊形高光 -->
    <polygon points="15,140 195,140 235,20 55,20" fill="url(#paraHighlight)" />

    <!-- 平行四邊形頂邊高光線 -->
    <line x1="58" y1="22" x2="232" y2="22" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" />

    <!-- 底邊標註 -->
    <line x1="15" y1="148" x2="195" y2="148" stroke="#ffd700" stroke-width="2" stroke-dasharray="6,3" />
    <text x="105" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffd700" font-weight="bold">底 (b)</text>

    <!-- 高標註 -->
    <line x1="205" y1="25" x2="205" y2="135" stroke="#00e5ff" stroke-width="2" stroke-dasharray="6,3" />
    <polygon points="200,25 210,25 205,18" fill="#00e5ff" />
    <polygon points="200,135 210,135 205,142" fill="#00e5ff" />
    <text x="218" y="85" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#00e5ff" font-weight="bold">高 (h)</text>

    <!-- 面積公式 -->
    <text x="125" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" font-weight="bold">面積 = 底 × 高</text>
    <text x="125" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">= b × h</text>

    <!-- 標籤 -->
    <rect x="70" y="-5" width="110" height="24" rx="12" ry="12" fill="rgba(102,126,234,0.6)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="125" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">平行四邊形</text>
  </g>

  <!-- ==================== 右側：三角形 ==================== -->
  <g transform="translate(310, 110)">
    <!-- 三角形雙層陰影 -->
    <polygon points="125,140 245,20 5,20" fill="#000000" opacity="0.3" transform="translate(4,6)" filter="url(#doubleShadow)" />
    
    <!-- 三角形主體 -->
    <polygon points="125,140 245,20 5,20" fill="url(#triGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" filter="url(#doubleShadow)" />
    
    <!-- 三角形高光 -->
    <polygon points="125,140 245,20 5,20" fill="url(#triHighlight)" />

    <!-- 三角形頂點高光 -->
    <circle cx="125" cy="22" r="3" fill="rgba(255,255,255,0.6)" />

    <!-- 底邊標註 -->
    <line x1="5" y1="148" x2="245" y2="148" stroke="#ffd700" stroke-width="2" stroke-dasharray="6,3" />
    <text x="125" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffd700" font-weight="bold">底 (b)</text>

    <!-- 高標註 -->
    <line x1="125" y1="25" x2="125" y2="135" stroke="#00e5ff" stroke-width="2" stroke-dasharray="6,3" />
    <polygon points="120,25 130,25 125,18" fill="#00e5ff" />
    <polygon points="120,135 130,135 125,142" fill="#00e5ff" />
    <text x="138" y="85" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#00e5ff" font-weight="bold">高 (h)</text>

    <!-- 面積公式 -->
    <text x="125" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" font-weight="bold">面積 = ½ × 底 × 高</text>
    <text x="125" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.6)">= ½ × b × h</text>

    <!-- 標籤 -->
    <rect x="70" y="-5" width="110" height="24" rx="12" ry="12" fill="rgba(240,147,251,0.5)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="125" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">三角形</text>
  </g>

  <!-- ==================== 底部結論 ==================== -->
  <g transform="translate(0, 330)">
    <!-- 結論卡片 -->
    <rect x="60" y="0" width="480" height="45" rx="22" ry="22" fill="rgba(255,215,0,0.12)" stroke="rgba(255,215,0,0.25)" stroke-width="1" filter="url(#cardShadow)" />
    
    <!-- 結論文字 -->
    <text x="300" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffd700" font-weight="bold">✨ 同底同高時：平行四邊形面積 = 三角形面積 × 2</text>
    <text x="300" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.5)">即：平行四邊形是三角形的 2 倍</text>
  </g>

  <!-- 裝飾小點 -->
  <circle cx="45" cy="45" r="2" fill="rgba(255,255,255,0.3)" />
  <circle cx="555" cy="45" r="2" fill="rgba(255,255,255,0.3)" />
  <circle cx="45" cy="355" r="2" fill="rgba(255,255,255,0.3)" />
  <circle cx="555" cy="355" r="2" fill="rgba(255,255,255,0.3)" />
</svg>