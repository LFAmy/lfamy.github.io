<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <!-- 網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CBD5E1" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <pattern id="gridDot" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#94A3B8" opacity="0.3"/>
    </pattern>

    <!-- 梯形填充 - 多層漸變 -->
    <linearGradient id="trapezoidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="25%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="75%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- 平行四邊形填充 - 多層漸變 -->
    <linearGradient id="paraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 三角形填充 - 多層漸變 -->
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="60%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- 3D 光影 - 放射漸變 -->
    <radialGradient id="shadow3D" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </radialGradient>

    <!-- 高光 -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>

    <filter id="shapeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1E293B" flood-opacity="0.15"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC" rx="0"/>
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>
  <rect width="600" height="400" fill="url(#grid)" rx="0"/>
  <rect width="600" height="400" fill="url(#gridDot)" rx="0"/>

  <!-- 主卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="25" y="20" width="550" height="360" rx="16" fill="url(#highlight)" opacity="0.3"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', sans-serif" font-size="22" font-weight="700" fill="#1E293B" letter-spacing="1">梯形分解 — 面積推導</text>
  <line x1="180" y1="68" x2="420" y2="68" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- ==================== 梯形（完整） ==================== -->
  <g filter="url(#shapeShadow)">
    <polygon points="100,120 280,120 340,230 60,230" fill="url(#trapezoidGrad)" stroke="#3730A3" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 3D 光影覆蓋 -->
    <polygon points="100,120 280,120 340,230 60,230" fill="url(#shadow3D)" stroke="none"/>
  </g>

  <!-- 梯形標籤 -->
  <text x="170" y="175" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.9)">梯形</text>

  <!-- 上底標示 -->
  <line x1="100" y1="105" x2="280" y2="105" stroke="#F472B6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="190" y="98" text-anchor="middle" font-family="'Times New Roman', serif" font-size="15" font-weight="700" fill="#BE185D">上底 (a)</text>

  <!-- 下底標示 -->
  <line x1="60" y1="248" x2="340" y2="248" stroke="#F472B6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="200" y="268" text-anchor="middle" font-family="'Times New Roman', serif" font-size="15" font-weight="700" fill="#BE185D">下底 (b)</text>

  <!-- 高標示 -->
  <line x1="50" y1="120" x2="50" y2="230" stroke="#10B981" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="38" y="178" text-anchor="middle" font-family="'Times New Roman', serif" font-size="15" font-weight="700" fill="#047857" transform="rotate(-90,38,178)">高 (h)</text>

  <!-- ==================== 分解箭頭 ==================== -->
  <g filter="url(#softGlow)">
    <line x1="355" y1="175" x2="395" y2="175" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <polygon points="395,168 408,175 395,182" fill="#6366F1"/>
  </g>

  <!-- ==================== 平行四邊形（左） ==================== -->
  <g filter="url(#shapeShadow)">
    <polygon points="410,120 560,120 520,230 370,230" fill="url(#paraGrad)" stroke="#0284C7" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="410,120 560,120 520,230 370,230" fill="url(#shadow3D)" stroke="none"/>
  </g>

  <text x="465" y="178" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.9)">平行四邊形</text>

  <!-- 平行四邊形底標示 -->
  <line x1="370" y1="248" x2="520" y2="248" stroke="#F472B6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="445" y="268" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="700" fill="#BE185D">底 = a</text>

  <!-- 平行四邊形高標示 -->
  <line x1="362" y1="120" x2="362" y2="230" stroke="#10B981" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="350" y="178" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="700" fill="#047857" transform="rotate(-90,350,178)">h</text>

  <!-- ==================== 三角形（右） ==================== -->
  <g filter="url(#shapeShadow)">
    <polygon points="370,230 520,230 560,120" fill="url(#triGrad)" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="370,230 520,230 560,120" fill="url(#shadow3D)" stroke="none"/>
  </g>

  <text x="475" y="210" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.9)">三角形</text>

  <!-- 三角形底標示 -->
  <line x1="370" y1="248" x2="520" y2="248" stroke="#F472B6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="445" y="268" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="700" fill="#BE185D">底 = b−a</text>

  <!-- 三角形高標示 -->
  <line x1="555" y1="120" x2="555" y2="230" stroke="#10B981" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="570" y="178" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="700" fill="#047857" transform="rotate(-90,570,178)">h</text>

  <!-- ==================== 公式推導 ==================== -->
  <g transform="translate(60, 295)">
    <!-- 公式背景 -->
    <rect x="0" y="0" width="480" height="70" rx="10" fill="#F1F5F9" opacity="0.8"/>
    <rect x="0" y="0" width="480" height="70" rx="10" fill="none" stroke="#CBD5E1" stroke-width="1"/>

    <text x="240" y="22" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-weight="700" fill="#475569">面積推導</text>

    <text x="20" y="50" font-family="'Times New Roman', serif" font-size="15" fill="#1E293B">
      <tspan font-weight="700" fill="#6366F1">梯形面積</tspan>
      <tspan> = </tspan>
      <tspan font-weight="700" fill="#0EA5E9">平行四邊形面積</tspan>
      <tspan> + </tspan>
      <tspan font-weight="700" fill="#F59E0B">三角形面積</tspan>
    </text>

    <text x="20" y="68" font-family="'Times New Roman', serif" font-size="14" fill="#1E293B">
      <tspan>= a × h + (b−a) × h ÷ 2</tspan>
      <tspan fill="#6366F1" font-weight="700"> = (a+b) × h ÷ 2</tspan>
    </text>
  </g>

  <!-- 裝飾性小標籤 -->
  <g opacity="0.4">
    <circle cx="540" cy="40" r="3" fill="#6366F1"/>
    <circle cx="555" cy="40" r="3" fill="#0EA5E9"/>
    <circle cx="570" cy="40" r="3" fill="#F59E0B"/>
  </g>
</svg>