<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>
    <pattern id="gridDot" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#D0D6DE"/>
    </pattern>

    <!-- 主卡片漸層 - 多層漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F8FAFF"/>
      <stop offset="50%" stop-color="#F0F4FF"/>
      <stop offset="75%" stop-color="#E8EEFF"/>
      <stop offset="100%" stop-color="#E0E8FF"/>
    </linearGradient>

    <!-- 標題漸層 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>

    <!-- 速率三角 - 頂部漸層 -->
    <linearGradient id="triTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="30%" stop-color="#FF8F00"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>

    <!-- 速率三角 - 底部漸層（3D效果） -->
    <linearGradient id="triBotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8F00"/>
      <stop offset="40%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <!-- 放射漸層 3D光影 -->
    <radialGradient id="triRadial" cx="45%" cy="35%" r="55%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FFCA28" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FF8F00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E65100" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D側面漸層 -->
    <linearGradient id="triSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF360C"/>
      <stop offset="50%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <!-- 距離圓形漸層 -->
    <radialGradient id="distCircle" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#42A5F5"/>
      <stop offset="80%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </radialGradient>

    <!-- 速率圓形漸層 -->
    <radialGradient id="speedCircle" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#66BB6A"/>
      <stop offset="80%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>

    <!-- 時間圓形漸層 -->
    <radialGradient id="timeCircle" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#EF5350"/>
      <stop offset="80%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A237E" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1A237E" flood-opacity="0.06"/>
    </filter>

    <filter id="triShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#BF360C" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#E65100" flood-opacity="0.15"/>
    </filter>

    <filter id="circleShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C62828"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#gridDot)"/>

  <!-- 主卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#D0D8F0" stroke-width="0.5"/>

  <!-- 標題 -->
  <text x="300" y="52" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="bold" fill="url(#titleGrad)" letter-spacing="2">
    速率關係三角 D = S × T
  </text>
  <line x1="180" y1="62" x2="420" y2="62" stroke="#C5CAE9" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 速率三角主體 - 3D效果 -->
  <g filter="url(#triShadow)">
    <!-- 3D側面（厚度） -->
    <polygon points="300,105 160,275 300,260" fill="url(#triSideGrad)" opacity="0.6"/>
    <!-- 主三角形 -->
    <polygon points="300,90 150,260 450,260" fill="url(#triTopGrad)" stroke="#E65100" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 放射光影 -->
    <polygon points="300,90 150,260 450,260" fill="url(#triRadial)"/>
  </g>

  <!-- 三角形內文字 - D -->
  <text x="300" y="195" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" filter="url(#glowFilter)">D</text>
  <text x="300" y="218" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="13" fill="#FFF8E1" opacity="0.9">距離</text>

  <!-- 三角形內符號 × -->
  <text x="300" y="240" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="18" fill="#FFF8E1" opacity="0.7">=</text>

  <!-- 連線與圓形節點 -->
  <!-- D-S 連線 -->
  <line x1="300" y1="90" x2="220" y2="260" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowBlue)" opacity="0.7"/>
  <!-- D-T 連線 -->
  <line x1="300" y1="90" x2="380" y2="260" stroke="#C62828" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowRed)" opacity="0.7"/>
  <!-- S-T 連線 -->
  <line x1="220" y1="260" x2="380" y2="260" stroke="#2E7D32" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowGreen)" opacity="0.7"/>

  <!-- 速率圓形 (S) -->
  <g filter="url(#circleShadow)">
    <circle cx="170" cy="285" r="32" fill="url(#speedCircle)"/>
    <circle cx="170" cy="285" r="28" fill="none" stroke="#A5D6A7" stroke-width="0.8" opacity="0.5"/>
    <text x="170" y="281" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">S</text>
    <text x="170" y="298" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="9" fill="#E8F5E9">速率</text>
  </g>

  <!-- 時間圓形 (T) -->
  <g filter="url(#circleShadow)">
    <circle cx="430" cy="285" r="32" fill="url(#timeCircle)"/>
    <circle cx="430" cy="285" r="28" fill="none" stroke="#EF9A9A" stroke-width="0.8" opacity="0.5"/>
    <text x="430" y="281" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">T</text>
    <text x="430" y="298" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="9" fill="#FFEBEE">時間</text>
  </g>

  <!-- 距離圓形 (D) -->
  <g filter="url(#circleShadow)">
    <circle cx="300" cy="105" r="28" fill="url(#distCircle)"/>
    <circle cx="300" cy="105" r="24" fill="none" stroke="#90CAF9" stroke-width="0.8" opacity="0.5"/>
    <text x="300" y="101" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">D</text>
    <text x="300" y="118" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="9" fill="#E3F2FD">距離</text>
  </g>

  <!-- 公式說明區 -->
  <rect x="80" y="330" width="440" height="42" rx="10" ry="10" fill="#F5F7FF" stroke="#C5CAE9" stroke-width="0.8" opacity="0.9"/>

  <text x="140" y="356" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="13" font-weight="bold" fill="#1565C0">距離 = 速率 × 時間</text>
  <text x="300" y="356" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="13" font-weight="bold" fill="#2E7D32">速率 = 距離 ÷ 時間</text>
  <text x="460" y="356" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="13" font-weight="bold" fill="#C62828">時間 = 距離 ÷ 速率</text>

  <!-- 小明行車例 -->
  <g transform="translate(35, 68)">
    <!-- 小圖示：單車 -->
    <circle cx="18" cy="12" r="5" fill="#FF8F00" opacity="0.3"/>
    <text x="18" y="15" text-anchor="middle" font-size="10" fill="#E65100">🚴</text>
    <text x="30" y="15" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="8" fill="#5C6BC0" opacity="0.8">小明</text>
  </g>

  <!-- 裝飾性角標 -->
  <rect x="20" y="15" width="18" height="18" rx="4" fill="#FF8F00" opacity="0.15"/>
  <rect x="562" y="15" width="18" height="18" rx="4" fill="#FF8F00" opacity="0.15"/>
  <rect x="20" y="367" width="18" height="18" rx="4" fill="#FF8F00" opacity="0.15"/>
  <rect x="562" y="367" width="18" height="18" rx="4" fill="#FF8F00" opacity="0.15"/>

  <!-- 小提示 -->
  <text x="300" y="388" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="8" fill="#9FA8DA" opacity="0.6">💡 遮住其中一個變量，就能找出計算公式</text>
</svg>