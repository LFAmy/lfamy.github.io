<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="400" fill="#F9FAFB"/>
  
  <!-- 標題 -->
  <text x="300" y="40" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#4F46E5">兩步方程的解法流程</text>
  
  <!-- 流程圖卡片 -->
  <!-- 第一個卡片：初始方程 -->
  <rect x="20" y="150" width="160" height="120" rx="10" ry="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
  <text x="100" y="180" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="white">初始方程</text>
  <text x="100" y="210" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="white" font-weight="bold">2x + 3 = 11</text>
  
  <!-- 第二個卡片：步驟一 -->
  <rect x="220" y="150" width="160" height="120" rx="10" ry="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
  <text x="300" y="170" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="white">步驟一：處理加減</text>
  <text x="300" y="200" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="white">減去 3</text>
  <text x="300" y="230" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="white" font-weight="bold">2x = 8</text>
  
  <!-- 第三個卡片：步驟二 -->
  <rect x="420" y="150" width="160" height="120" rx="10" ry="10" fill="url(#cardGradient)" filter="url(#shadow)"/>
  <text x="500" y="170" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="white">步驟二：處理乘除</text>
  <text x="500" y="200" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="white">除以 2</text>
  <text x="500" y="230" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" fill="#10B981" font-weight="bold">x = 4</text>
  
  <!-- 箭頭連接 -->
  <line x1="180" y1="210" x2="220" y2="210" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="210" x2="420" y2="210" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>