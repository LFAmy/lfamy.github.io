<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>

    <!-- 卡片主體漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="30%" style="stop-color:#f0f4ff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e8eeff;stop-opacity:0.95"/>
    </linearGradient>

    <!-- 速率三角漸變（頂部） -->
    <linearGradient id="triTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#EE5A24"/>
    </linearGradient>

    <!-- 速率三角漸變（左） -->
    <linearGradient id="triLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="100%" style="stop-color:#2ECC71"/>
    </linearGradient>

    <!-- 速率三角漸變（右） -->
    <linearGradient id="triRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A29BFE"/>
      <stop offset="100%" style="stop-color:#6C5CE7"/>
    </linearGradient>

    <!-- 放射漸變 3D 光影效果 -->
    <radialGradient id="triGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 陰影濾鏡（雙層） -->
    <filter id="shadowLayer1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="#1a1a2e" flood-opacity="0.4"/>
    </filter>
    <filter id="shadowLayer2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="-1" dy="-1" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- 內部發光 -->
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.2"/>
      <feComposite operator="in" in2="blur"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- 數字發光 -->
    <filter id="numGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="80" cy="60" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="520" cy="80" r="1.5" fill="#ffffff" opacity="0.12"/>
  <circle cx="450" cy="350" r="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="150" cy="340" r="1.5" fill="#ffffff" opacity="0.15"/>
  <circle cx="50" cy="200" r="1" fill="#ffffff" opacity="0.12"/>
  <circle cx="560" cy="250" r="1.5" fill="#ffffff" opacity="0.1"/>

  <!-- 主卡片 - 雙層陰影 -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="20" width="550" height="360" rx="20" ry="20" fill="url(#cardGrad)"/>
  </g>
  <g filter="url(#shadowLayer2)">
    <rect x="25" y="20" width="550" height="360" rx="20" ry="20" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  </g>

  <!-- 標題區域 -->
  <text x="300" y="62" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK','Noto Sans HK',sans-serif" font-size="22" font-weight="bold" fill="#2d3436" letter-spacing="2">
    速率應用 — 速率三角
  </text>
  <line x1="100" y1="78" x2="500" y2="78" stroke="#dfe6e9" stroke-width="1.5"/>

  <!-- 速率三角 D=S×T -->
  <g transform="translate(300, 210)">
    <!-- 三角外框（立體效果） -->
    <!-- 底部陰影三角 -->
    <polygon points="0,-95 -110,65 110,65" fill="#000000" opacity="0.08" transform="translate(3,5)"/>

    <!-- 主三角 -->
    <polygon points="0,-95 -110,65 110,65" fill="url(#triTopGrad)" stroke="#ffffff" stroke-width="2.5"/>

    <!-- 左側高光 -->
    <polygon points="0,-95 -110,65 0,65" fill="url(#triLeftGrad)" opacity="0.35"/>

    <!-- 右側陰影 -->
    <polygon points="0,-95 110,65 0,65" fill="url(#triRightGrad)" opacity="0.25"/>

    <!-- 放射漸變 3D 光影 -->
    <polygon points="0,-95 -110,65 110,65" fill="url(#triGlow)"/>

    <!-- 邊框發光 -->
    <polygon points="0,-95 -110,65 110,65" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

    <!-- D = S × T 文字 -->
    <text x="0" y="-40" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="32" font-weight="bold" fill="#ffffff" filter="url(#numGlow)">D</text>
    <text x="0" y="-15" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="16" fill="#ffffff" opacity="0.9">=</text>

    <!-- S -->
    <text x="-55" y="30" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="28" font-weight="bold" fill="#ffffff" filter="url(#numGlow)">S</text>
    <text x="-55" y="50" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#ffffff" opacity="0.85">速率</text>

    <!-- × -->
    <text x="0" y="38" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="20" fill="#ffffff" opacity="0.9">×</text>

    <!-- T -->
    <text x="55" y="30" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="28" font-weight="bold" fill="#ffffff" filter="url(#numGlow)">T</text>
    <text x="55" y="50" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#ffffff" opacity="0.85">時間</text>
  </g>

  <!-- 例題區域 -->
  <g transform="translate(40, 310)">
    <text x="0" y="0" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" fill="#636e72" font-weight="bold">例題：</text>
    <text x="55" y="0" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" fill="#2d3436">小明以 60 km/h 行駛 2.5 小時，求行駛距離。</text>
  </g>

  <!-- 計算過程 -->
  <g transform="translate(40, 345)">
    <text x="0" y="0" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" fill="#636e72" font-weight="bold">計算：</text>
    <text x="55" y="0" font-family="'Times New Roman','Georgia',serif" font-size="14" fill="#2d3436">D = S × T = 60 × 2.5 = </text>
    <text x="290" y="0" font-family="'Times New Roman','Georgia',serif" font-size="16" font-weight="bold" fill="#EE5A24">150 km</text>
  </g>

  <!-- 裝飾線條 - 速率三角標籤 -->
  <g transform="translate(300, 130)">
    <text x="0" y="0" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="#636e72" letter-spacing="1">
      速率公式
    </text>
  </g>

  <!-- 底部裝飾 -->
  <line x1="40" y1="375" x2="560" y2="375" stroke="#dfe6e9" stroke-width="0.5" opacity="0.5"/>

  <!-- 小圖標 - 速率三角提示 -->
  <g transform="translate(530, 50)" opacity="0.3">
    <polygon points="0,-12 -10,8 10,8" fill="#6C5CE7"/>
  </g>
</svg>