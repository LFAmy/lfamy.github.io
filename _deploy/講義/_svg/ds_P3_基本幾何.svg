<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="50%" stop-color="#dce6f5"/>
      <stop offset="100%" stop-color="#b8c9e8"/>
    </radialGradient>

    <!-- 卡片1：三角形 - 雙層陰影 -->
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2a4a" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a2a4a" flood-opacity="0.10"/>
    </filter>

    <!-- 卡片2：四邊形 -->
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2a4a" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a2a4a" flood-opacity="0.10"/>
    </filter>

    <!-- 卡片3：五邊形 -->
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2a4a" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a2a4a" flood-opacity="0.10"/>
    </filter>

    <!-- 卡片4：圓形 -->
    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a2a4a" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a2a4a" flood-opacity="0.10"/>
    </filter>

    <!-- 3D光影漸變：三角形 -->
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="30%" stop-color="#FF8E8E"/>
      <stop offset="60%" stop-color="#E84545"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <radialGradient id="triShine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D光影漸變：四邊形 -->
    <linearGradient id="sqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="30%" stop-color="#6EE7DE"/>
      <stop offset="60%" stop-color="#2EB5A8"/>
      <stop offset="100%" stop-color="#1A8A7E"/>
    </linearGradient>
    <radialGradient id="sqShine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D光影漸變：五邊形 -->
    <linearGradient id="pentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A29BFE"/>
      <stop offset="30%" stop-color="#BDB7FF"/>
      <stop offset="60%" stop-color="#7C73E6"/>
      <stop offset="100%" stop-color="#5A4FCF"/>
    </linearGradient>
    <radialGradient id="pentShine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D光影漸變：圓形 -->
    <radialGradient id="circleGrad" cx="40%" cy="35%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="25%" stop-color="#FFE066"/>
      <stop offset="55%" stop-color="#F0C929"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </radialGradient>
    <radialGradient id="circleShine" cx="28%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="50%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>

    <!-- 表格標頭漸變 -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#1A252F"/>
    </linearGradient>

    <!-- 數值標籤背景 -->
    <filter id="labelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- 裝飾光暈 -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A29BFE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A29BFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD93D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD93D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- 裝飾背景圓點 -->
  <circle cx="50" cy="50" r="80" fill="url(#glow1)"/>
  <circle cx="550" cy="80" r="70" fill="url(#glow2)"/>
  <circle cx="100" cy="350" r="60" fill="url(#glow3)"/>
  <circle cx="500" cy="320" r="75" fill="url(#glow4)"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="22" font-weight="700" fill="url(#titleGrad)" letter-spacing="2">
    📐 平面圖形特徵對比表
  </text>
  <line x1="180" y1="48" x2="420" y2="48" stroke="#2C3E50" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- ==================== 卡片1：三角形 ==================== -->
  <g filter="url(#shadow1)">
    <rect x="20" y="62" width="130" height="320" rx="16" ry="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="20" y="62" width="130" height="320" rx="16" ry="16" fill="none" stroke="#FF6B6B" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <!-- 三角形圖形區域 -->
  <rect x="30" y="72" width="110" height="100" rx="12" fill="#FFF5F5"/>
  <polygon points="85,82 55,162 115,162" fill="url(#triGrad)" stroke="#C0392B" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="85,82 55,162 115,162" fill="url(#triShine)"/>

  <!-- 圖形名稱 -->
  <rect x="35" y="180" width="100" height="28" rx="14" fill="#FF6B6B" opacity="0.15"/>
  <text x="85" y="199" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" font-weight="700" fill="#C0392B">三角形</text>

  <!-- 分隔線 -->
  <line x1="35" y1="218" x2="135" y2="218" stroke="#FF6B6B" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- 特徵數據 -->
  <!-- 邊數 -->
  <rect x="35" y="228" width="100" height="42" rx="8" fill="#FFF5F5"/>
  <text x="85" y="245" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">邊數</text>
  <text x="85" y="263" text-anchor="middle" font-family="'Arial',sans-serif" font-size="20" font-weight="800" fill="#E84545">3</text>

  <!-- 角數 -->
  <rect x="35" y="278" width="100" height="42" rx="8" fill="#FFF5F5"/>
  <text x="85" y="295" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">角數</text>
  <text x="85" y="313" text-anchor="middle" font-family="'Arial',sans-serif" font-size="20" font-weight="800" fill="#E84545">3</text>

  <!-- 對稱軸 -->
  <rect x="35" y="328" width="100" height="42" rx="8" fill="#FFF5F5"/>
  <text x="85" y="345" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">對稱軸</text>
  <text x="85" y="363" text-anchor="middle" font-family="'Arial',sans-serif" font-size="20" font-weight="800" fill="#E84545">3</text>


  <!-- ==================== 卡片2：四邊形 ==================== -->
  <g filter="url(#shadow2)">
    <rect x="165" y="62" width="130" height="320" rx="16" ry="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="165" y="62" width="130" height="320" rx="16" ry="16" fill="none" stroke="#4ECDC4" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <rect x="175" y="72" width="110" height="100" rx="12" fill="#F0FFFE"/>
  <rect x="195" y="92" width="70" height="70" rx="4" fill="url(#sqGrad)" stroke="#1A8A7E" stroke-width="1.5"/>
  <rect x="195" y="92" width="70" height="70" rx="4" fill="url(#sqShine)"/>

  <rect x="180" y="180" width="100" height="28" rx="14" fill="#4ECDC4" opacity="0.15"/>
  <text x="230" y="199" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" font-weight="700" fill="#1A8A7E">四邊形</text>

  <line x1="180" y1="218" x2="280" y2="218" stroke="#4ECDC4" stroke-width="0.8" stroke-opacity="0.2"/>

  <rect x="180" y="228" width="100" height="42" rx="8" fill="#F0FFFE"/>
  <text x="230" y="245" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">邊數</text>
  <text x="230" y="263" text-anchor="middle" font-family="'Arial',sans-serif" font-size="20" font-weight="800" fill="#2EB5A8">4</text>

  <rect x="180" y="278" width="100" height="42" rx="8" fill="#F0FFFE"/>
  <text x="230" y="295" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">角數</text>
  <text x="230" y="313" text-anchor="middle" font-family="'Arial',sans-serif" font-size="20" font-weight="800" fill="#2EB5A8">4</text>

  <rect x="180" y="328" width="100" height="42" rx="8" fill="#F0FFFE"/>
  <text x="230" y="345" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">對稱軸</text>
  <text x="230" y="363" text-anchor="middle" font-family="'Arial',sans-serif" font-size="20" font-weight="800" fill="#2EB5A8">4</text>


  <!-- ==================== 卡片3：五邊形 ==================== -->
  <g filter="url(#shadow3)">
    <rect x="310" y="62" width="130" height="320" rx="16" ry="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="310" y="62" width="130" height="320" rx="16" ry="16" fill="none" stroke="#A29BFE" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <rect x="320" y="72" width="110" height="100" rx="12" fill="#F5F0FF"/>
  <polygon points="375,82 345,115 355,155 395,155 405,115" fill="url(#pentGrad)" stroke="#5A4FCF" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="375,82 345,115 355,155 395,155 405,115" fill="url(#pentShine)"/>

  <rect x="325" y="180" width="100" height="28" rx="14" fill="#A29BFE" opacity="0.15"/>
  <text x="375" y="199" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" font-weight="700" fill="#5A4FCF">五邊形</text>

  <line x1="325" y1="218" x2="425" y2="218" stroke="#A29BFE" stroke-width="0.8" stroke-opacity="0.2"/>

  <rect x="325" y="228" width="100" height="42" rx="8" fill="#F5F0FF"/>
  <text x="375" y="245" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">邊數</text>
  <text x="375" y="263" text-anchor="middle" font-family="'Arial',sans-serif" font-size="20" font-weight="800" fill="#7C73E6">5</text>

  <rect x="325" y="278" width="100" height="42" rx="8" fill="#F5F0FF"/>
  <text x="375" y="295" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">角數</text>
  <text x="375" y="313" text-anchor="middle" font-family="'Arial',sans-serif" font-size="20" font-weight="800" fill="#7C73E6">5</text>

  <rect x="325" y="328" width="100" height="42" rx="8" fill="#F5F0FF"/>
  <text x="375" y="345" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">對稱軸</text>
  <text x="375" y="363" text-anchor="middle" font-family="'Arial',sans-serif" font-size="20" font-weight="800" fill="#7C73E6">5</text>


  <!-- ==================== 卡片4：圓形 ==================== -->
  <g filter="url(#shadow4)">
    <rect x="455" y="62" width="130" height="320" rx="16" ry="16" fill="#FFFFFF" opacity="0.95"/>
    <rect x="455" y="62" width="130" height="320" rx="16" ry="16" fill="none" stroke="#FFD93D" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <rect x="465" y="72" width="110" height="100" rx="12" fill="#FFFDF0"/>
  <circle cx="520" cy="122" r="35" fill="url(#circleGrad)" stroke="#D4A017" stroke-width="1.5"/>
  <circle cx="520" cy="122" r="35" fill="url(#circleShine)"/>

  <rect x="470" y="180" width="100" height="28" rx="14" fill="#FFD93D" opacity="0.15"/>
  <text x="520" y="199" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" font-weight="700" fill="#D4A017">圓形</text>

  <line x1="470" y1="218" x2="570" y2="218" stroke="#FFD93D" stroke-width="0.8" stroke-opacity="0.2"/>

  <rect x="470" y="228" width="100" height="42" rx="8" fill="#FFFDF0"/>
  <text x="520" y="245" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">邊數</text>
  <text x="520" y="263" text-anchor="middle" font-family="'Arial',sans-serif" font-size="18" font-weight="800" fill="#D4A017">∞</text>

  <rect x="470" y="278" width="100" height="42" rx="8" fill="#FFFDF0"/>
  <text x="520" y="295" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">角數</text>
  <text x="520" y="313" text-anchor="middle" font-family="'Arial',sans-serif" font-size="18" font-weight="800" fill="#D4A017">0</text>

  <rect x="470" y="328" width="100" height="42" rx="8" fill="#FFFDF0"/>
  <text x="520" y="345" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#888" letter-spacing="1">對稱軸</text>
  <text x="520" y="363" text-anchor="middle" font-family="'Arial',sans-serif" font-size="18" font-weight="800" fill="#D4A017">∞</text>

</svg>