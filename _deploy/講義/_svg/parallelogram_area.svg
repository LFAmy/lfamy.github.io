<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸層 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </radialGradient>

    <!-- 平行四邊形主色漸層（3D光影） -->
    <linearGradient id="paraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="30%" stop-color="#5BA0E8"/>
      <stop offset="60%" stop-color="#3A7BC8"/>
      <stop offset="100%" stop-color="#2D6BB5"/>
    </linearGradient>

    <!-- 平行四邊形高光漸層 -->
    <linearGradient id="paraHighlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 切割三角形漸層 -->
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#E8961A"/>
      <stop offset="100%" stop-color="#D4880F"/>
    </linearGradient>

    <!-- 三角形高光 -->
    <linearGradient id="triHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 長方形漸層 -->
    <linearGradient id="rectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ED321"/>
      <stop offset="40%" stop-color="#6CC419"/>
      <stop offset="100%" stop-color="#5AAD10"/>
    </linearGradient>

    <!-- 長方形高光 -->
    <linearGradient id="rectHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 放射陰影濾鏡（雙層陰影） -->
    <filter id="shadowLayer1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
    <filter id="shadowLayer2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="8" flood-color="rgba(0,0,0,0.12)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2D6BB5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5AAD10"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D4880F"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>

    <!-- 虛線樣式 -->
    <style>
      .dashed-line { stroke-dasharray: 6 4; stroke-width: 1.5; }
      .label-text { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-size: 14px; font-weight: bold; }
      .title-text { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-size: 18px; font-weight: bold; }
      .formula-text { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-size: 16px; font-weight: bold; }
      .small-label { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-size: 13px; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC" rx="0"/>
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 主卡片 -->
  <rect x="15" y="15" width="570" height="370" rx="16" ry="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 標題 -->
  <text x="300" y="50" text-anchor="middle" class="title-text" fill="#2C3E50">平行四邊形面積 — 切割平移推導</text>
  <line x1="180" y1="58" x2="420" y2="58" stroke="#4A90D9" stroke-width="2" stroke-linecap="round"/>

  <!-- ============================================ -->
  <!-- 左側：平行四邊形（原始） -->
  <!-- ============================================ -->

  <!-- 平行四邊形卡片子標題 -->
  <text x="155" y="90" text-anchor="middle" class="label-text" fill="#2D6BB5">① 平行四邊形</text>

  <!-- 平行四邊形本體（雙層陰影） -->
  <g filter="url(#shadowLayer1)">
    <g filter="url(#shadowLayer2)">
      <!-- 平行四邊形主體 -->
      <polygon points="60,180 260,180 220,280 60,280" fill="url(#paraGrad)"/>
      <!-- 高光層 -->
      <polygon points="60,180 260,180 220,280 60,280" fill="url(#paraHighlight)"/>
    </g>
  </g>

  <!-- 平行四邊形邊框 -->
  <polygon points="60,180 260,180 220,280 60,280" fill="none" stroke="#2D6BB5" stroke-width="2" stroke-linejoin="round"/>

  <!-- 底邊標註 b -->
  <line x1="60" y1="295" x2="260" y2="295" stroke="#E74C3C" stroke-width="2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="160" y="312" text-anchor="middle" class="formula-text" fill="#E74C3C">b（底）</text>

  <!-- 高 h 標註（虛線 + 箭頭） -->
  <line x1="60" y1="180" x2="60" y2="280" stroke="#E74C3C" stroke-width="2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="48" y="235" text-anchor="end" class="formula-text" fill="#E74C3C">h</text>

  <!-- 高虛線（輔助） -->
  <line x1="60" y1="180" x2="60" y2="280" class="dashed-line" stroke="#E74C3C" stroke-opacity="0.4"/>

  <!-- 直角標記 -->
  <polyline points="60,270 70,270 70,280" fill="none" stroke="#E74C3C" stroke-width="1.5"/>

  <!-- 切割線（虛線） -->
  <line x1="60" y1="180" x2="120" y2="180" class="dashed-line" stroke="#F5A623" stroke-width="2"/>

  <!-- 切割三角形標示 -->
  <text x="85" y="195" text-anchor="middle" class="small-label" fill="#D4880F">✂ 切割</text>

  <!-- ============================================ -->
  <!-- 中間：箭頭過渡 -->
  <!-- ============================================ -->

  <!-- 過渡箭頭 -->
  <g transform="translate(275, 210)">
    <path d="M 0,10 L 30,10 L 30,0 L 50,20 L 30,40 L 30,30 L 0,30 Z" fill="#4A90D9" opacity="0.7"/>
  </g>

  <!-- 過渡文字 -->
  <text x="300" y="260" text-anchor="middle" class="small-label" fill="#4A90D9">平移</text>

  <!-- ============================================ -->
  <!-- 右側：長方形（結果） -->
  <!-- ============================================ -->

  <text x="445" y="90" text-anchor="middle" class="label-text" fill="#5AAD10">② 長方形</text>

  <!-- 長方形本體（雙層陰影） -->
  <g filter="url(#shadowLayer1)">
    <g filter="url(#shadowLayer2)">
      <!-- 長方形主體 -->
      <rect x="320" y="180" width="200" height="100" rx="2" ry="2" fill="url(#rectGrad)"/>
      <!-- 高光層 -->
      <rect x="320" y="180" width="200" height="100" rx="2" ry="2" fill="url(#rectHighlight)"/>
    </g>
  </g>

  <!-- 長方形邊框 -->
  <rect x="320" y="180" width="200" height="100" rx="2" ry="2" fill="none" stroke="#5AAD10" stroke-width="2"/>

  <!-- 底邊標註 b -->
  <line x1="320" y1="295" x2="520" y2="295" stroke="#E74C3C" stroke-width="2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="420" y="312" text-anchor="middle" class="formula-text" fill="#E74C3C">b（底）</text>

  <!-- 高 h 標註 -->
  <line x1="530" y1="180" x2="530" y2="280" stroke="#E74C3C" stroke-width="2" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <text x="545" y="235" text-anchor="start" class="formula-text" fill="#E74C3C">h</text>

  <!-- 直角標記 -->
  <polyline points="320,270 330,270 330,280" fill="none" stroke="#E74C3C" stroke-width="1.5"/>
  <polyline points="520,270 510,270 510,280" fill="none" stroke="#E74C3C" stroke-width="1.5"/>

  <!-- ============================================ -->
  <!-- 底部：公式推導 -->
  <!-- ============================================ -->

  <!-- 公式卡片背景 -->
  <rect x="80" y="335" width="440" height="40" rx="10" ry="10" fill="#F0F7FF" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 公式文字 -->
  <text x="300" y="360" text-anchor="middle" class="formula-text" fill="#2C3E50">
    平行四邊形面積 = 長方形面積 = 
    <tspan fill="#E74C3C">b</tspan>
    <tspan fill="#2C3E50"> × </tspan>
    <tspan fill="#E74C3C">h</tspan>
  </text>

  <!-- ============================================ -->
  <!-- 裝飾元素：小三角形（切割示意） -->
  <!-- ============================================ -->

  <!-- 左側切割三角形（虛線輔助） -->
  <g opacity="0.6">
    <polygon points="60,180 120,180 60,230" fill="url(#triGrad)" fill-opacity="0.5" stroke="#D4880F" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- 右側平移過來的三角形 -->
  <g opacity="0.6">
    <polygon points="520,180 520,230 470,180" fill="url(#triGrad)" fill-opacity="0.5" stroke="#D4880F" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- 小提示：切割平移 -->
  <text x="300" y="140" text-anchor="middle" class="small-label" fill="#7F8C8D">
    沿高切割 → 平移三角形 → 拼成長方形
  </text>

  <!-- 裝飾小點 -->
  <circle cx="60" cy="180" r="3" fill="#F5A623"/>
  <circle cx="120" cy="180" r="3" fill="#F5A623"/>
  <circle cx="60" cy="230" r="3" fill="#F5A623"/>
  <circle cx="520" cy="180" r="3" fill="#F5A623"/>
  <circle cx="520" cy="230" r="3" fill="#F5A623"/>
  <circle cx="470" cy="180" r="3" fill="#F5A623"/>

</svg>