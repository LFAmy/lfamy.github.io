<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="50%" stop-color="#e8edf5"/>
      <stop offset="100%" stop-color="#d0d8e8"/>
    </radialGradient>

    <!-- 卡片主體漸變 - 3D效果 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fafcff"/>
      <stop offset="70%" stop-color="#eef3fa"/>
      <stop offset="100%" stop-color="#dce4f0"/>
    </linearGradient>

    <!-- 卡片邊框漸變 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8d6e5"/>
      <stop offset="50%" stop-color="#a0b4cc"/>
      <stop offset="100%" stop-color="#8899bb"/>
    </linearGradient>

    <!-- 3D光影 - 左上角光源 -->
    <radialGradient id="lightReflect" cx="15%" cy="15%" r="50%" fx="10%" fy="10%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="shadowLayer1" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#8899bb" flood-opacity="0.35"/>
    </filter>
    <filter id="shadowLayer2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#667788" flood-opacity="0.2"/>
    </filter>

    <!-- 內部陰影 -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- 網格線漸變 -->
    <linearGradient id="gridLineH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0c4de"/>
      <stop offset="50%" stop-color="#8fa8c8"/>
      <stop offset="100%" stop-color="#b0c4de"/>
    </linearGradient>

    <linearGradient id="gridLineV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0c4de"/>
      <stop offset="50%" stop-color="#8fa8c8"/>
      <stop offset="100%" stop-color="#b0c4de"/>
    </linearGradient>

    <!-- 2/3 區域漸變 - 垂直條紋 -->
    <linearGradient id="frac2_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ee5a24" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.35"/>
    </linearGradient>

    <!-- 4/5 區域漸變 - 水平條紋 -->
    <linearGradient id="frac4_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2ecc71" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.35"/>
    </linearGradient>

    <!-- 交叉區域漸變 -->
    <radialGradient id="crossArea" cx="50%" cy="50%" r="60%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#f6c90e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e2b007" stop-opacity="0.5"/>
    </radialGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="50%" stop-color="#34495e"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>

    <!-- 數字高亮 -->
    <linearGradient id="numHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>

    <linearGradient id="numHighlight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>

    <linearGradient id="numHighlight3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d68910"/>
    </linearGradient>

    <!-- 發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 主卡片 - 雙層陰影 -->
  <g filter="url(#shadowLayer1)">
    <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>
  </g>
  <g filter="url(#shadowLayer2)">
    <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  </g>

  <!-- 卡片高光 -->
  <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="url(#lightReflect)" opacity="0.5"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" letter-spacing="2">
    分數乘法 — 面積模型
  </text>

  <!-- 分隔線 -->
  <line x1="80" y1="72" x2="520" y2="72" stroke="url(#gridLineH)" stroke-width="1" opacity="0.5"/>

  <!-- 公式顯示 -->
  <text x="300" y="98" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="20" fill="#2c3e50" font-style="italic">
    <tspan fill="url(#numHighlight)" font-weight="bold" font-size="24">2</tspan>
    <tspan fill="#2c3e50">/</tspan>
    <tspan fill="url(#numHighlight)" font-weight="bold" font-size="24">3</tspan>
    <tspan fill="#2c3e50"> × </tspan>
    <tspan fill="url(#numHighlight2)" font-weight="bold" font-size="24">4</tspan>
    <tspan fill="#2c3e50">/</tspan>
    <tspan fill="url(#numHighlight2)" font-weight="bold" font-size="24">5</tspan>
    <tspan fill="#2c3e50"> = </tspan>
    <tspan fill="url(#numHighlight3)" font-weight="bold" font-size="24">8</tspan>
    <tspan fill="#2c3e50">/</tspan>
    <tspan fill="url(#numHighlight3)" font-weight="bold" font-size="24">15</tspan>
  </text>

  <!-- 圖例 -->
  <rect x="70" y="110" width="18" height="12" rx="2" fill="#ff6b6b" opacity="0.5" stroke="#ee5a24" stroke-width="0.8"/>
  <text x="94" y="121" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#555">2/3</text>

  <rect x="155" y="110" width="18" height="12" rx="2" fill="#4ecdc4" opacity="0.5" stroke="#2ecc71" stroke-width="0.8"/>
  <text x="179" y="121" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#555">4/5</text>

  <rect x="245" y="110" width="18" height="12" rx="2" fill="#ffd93d" opacity="0.6" stroke="#e2b007" stroke-width="0.8"/>
  <text x="269" y="121" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#555">乘積</text>

  <!-- 3×5 網格區域 -->
  <g transform="translate(95, 145)">
    <!-- 網格背景 -->
    <rect x="0" y="0" width="300" height="180" rx="4" fill="#f8faff" stroke="#c8d6e5" stroke-width="1.2"/>

    <!-- 2/3 區域 - 垂直方向佔2行 (每行60px) -->
    <rect x="0" y="0" width="300" height="120" fill="url(#frac2_3)" rx="0"/>

    <!-- 4/5 區域 - 水平方向佔4列 (每列60px) -->
    <rect x="0" y="0" width="240" height="180" fill="url(#frac4_5)" rx="0"/>

    <!-- 交叉區域 (2/3 × 4/5 = 8/15) -->
    <rect x="0" y="0" width="240" height="120" fill="url(#crossArea)" rx="0"/>

    <!-- 交叉區域標記 "8" -->
    <text x="120" y="68" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="28" font-weight="bold" fill="#d68910" filter="url(#glow)" opacity="0.8">8</text>

    <!-- 水平網格線 - 3行 -->
    <line x1="0" y1="60" x2="300" y2="60" stroke="url(#gridLineH)" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="120" x2="300" y2="120" stroke="url(#gridLineH)" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="180" x2="300" y2="180" stroke="url(#gridLineH)" stroke-width="1.5" opacity="0.7"/>

    <!-- 垂直網格線 - 5列 -->
    <line x1="60" y1="0" x2="60" y2="180" stroke="url(#gridLineV)" stroke-width="1.5" opacity="0.7"/>
    <line x1="120" y1="0" x2="120" y2="180" stroke="url(#gridLineV)" stroke-width="1.5" opacity="0.7"/>
    <line x1="180" y1="0" x2="180" y2="180" stroke="url(#gridLineV)" stroke-width="1.5" opacity="0.7"/>
    <line x1="240" y1="0" x2="240" y2="180" stroke="url(#gridLineV)" stroke-width="1.5" opacity="0.7"/>
    <line x1="300" y1="0" x2="300" y2="180" stroke="url(#gridLineV)" stroke-width="1.5" opacity="0.7"/>

    <!-- 邊框重繪 -->
    <rect x="0" y="0" width="300" height="180" rx="4" fill="none" stroke="#8899bb" stroke-width="1.8"/>

    <!-- 2/3 標籤 - 右側 -->
    <text x="312" y="35" font-family="'Times New Roman','Georgia',serif" font-size="15" fill="#c0392b" font-weight="bold">2</text>
    <line x1="310" y1="42" x2="330" y2="42" stroke="#c0392b" stroke-width="1"/>
    <text x="312" y="58" font-family="'Times New Roman','Georgia',serif" font-size="15" fill="#c0392b" font-weight="bold">3</text>

    <!-- 4/5 標籤 - 下方 -->
    <text x="30" y="198" font-family="'Times New Roman','Georgia',serif" font-size="15" fill="#1e8449" font-weight="bold">4</text>
    <line x1="25" y1="205" x2="55" y2="205" stroke="#1e8449" stroke-width="1"/>
    <text x="30" y="218" font-family="'Times New Roman','Georgia',serif" font-size="15" fill="#1e8449" font-weight="bold">5</text>

    <!-- 行標籤 1,2,3 -->
    <text x="-18" y="38" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="12" fill="#666">1</text>
    <text x="-18" y="98" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="12" fill="#666">2</text>
    <text x="-18" y="158" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="12" fill="#666">3</text>

    <!-- 列標籤 1,2,3,4,5 -->
    <text x="30" y="-10" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="12" fill="#666">1</text>
    <text x="90" y="-10" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="12" fill="#666">2</text>
    <text x="150" y="-10" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="12" fill="#666">3</text>
    <text x="210" y="-10" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="12" fill="#666">4</text>
    <text x="270" y="-10" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="12" fill="#666">5</text>
  </g>

  <!-- 解釋文字 -->
  <g transform="translate(420, 150)">
    <rect x="0" y="0" width="140" height="170" rx="10" fill="#f8faff" stroke="#d0d8e8" stroke-width="1" opacity="0.8"/>
    <rect x="0" y="0" width="140" height="170" rx="10" fill="url(#lightReflect)" opacity="0.3"/>

    <text x="70" y="25" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">計算步驟</text>
    <line x1="20" y1="33" x2="120" y2="33" stroke="#d0d8e8" stroke-width="0.8"/>

    <text x="15" y="52" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#555">
      <tspan font-weight="bold" fill="#c0392b">分子：</tspan>
    </text>
    <text x="15" y="68" font-family="'Times New Roman','Georgia',serif" font-size="13" fill="#555">
      2 × 4 = <tspan font-weight="bold" fill="#d68910">8</tspan>
    </text>

    <text x="15" y="92" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#555">
      <tspan font-weight="bold" fill="#1e8449">分母：</tspan>
    </text>
    <text x="15" y="108" font-family="'Times New Roman','Georgia',serif" font-size="13" fill="#555">
      3 × 5 = <tspan font-weight="bold" fill="#d68910">15</tspan>
    </text>

    <line x1="20" y1="120" x2="120" y2="120" stroke="#d0d8e8" stroke-width="0.8" stroke-dasharray="3,3"/>

    <text x="15" y="140" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#555">
      <tspan font-weight="bold">答案：</tspan>
    </text>
    <text x="15" y="160" font-family="'Times New Roman','Georgia',serif" font-size="20" font-weight="bold" fill="url(#numHighlight3)">8/15</text>
  </g>

  <!-- 底部提示 -->
  <text x="300" y="365" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#8899bb">
    將分子相乘（2×4=8），分母相乘（3×5=15），得到 8/15
  </text>

  <!-- 裝飾性角標 -->
  <path d="M 30 30 L 55 30 L 55 33 L 33 33 L 33 55 L 30 55 Z" fill="#a0b4cc" opacity="0.3"/>
  <path d="M 570 30 L 545 30 L 545 33 L 567 33 L 567 55 L 570 55 Z" fill="#a0b4cc" opacity="0.3"/>
  <path d="M 30 370 L 55 370 L 55 367 L 33 367 L 33 345 L 30 345 Z" fill="#a0b4cc" opacity="0.3"/>
  <path d="M 570 370 L 545 370 L 545 367 L 567 367 L 567 345 L 570 345 Z" fill="#a0b4cc" opacity="0.3"/>
</svg>