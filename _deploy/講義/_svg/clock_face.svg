<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </radialGradient>

    <!-- 卡片陰影 - 雙層 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <!-- 時鐘外框陰影 -->
    <filter id="clockShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- 時鐘內框陰影 -->
    <filter id="innerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 時針陰影 -->
    <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- 中心點光暈 -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FFA500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>

    <!-- 時鐘外框漸變 - 3D金屬感 -->
    <linearGradient id="clockBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="20%" stop-color="#F5F5F5"/>
      <stop offset="40%" stop-color="#D0D0D0"/>
      <stop offset="60%" stop-color="#C0C0C0"/>
      <stop offset="80%" stop-color="#E0E0E0"/>
      <stop offset="100%" stop-color="#B8B8B8"/>
    </linearGradient>

    <!-- 時鐘面漸變 - 放射 -->
    <radialGradient id="clockFace" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFFEF5"/>
      <stop offset="70%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#F5F0E0"/>
    </radialGradient>

    <!-- 3D 立體邊緣漸變 -->
    <linearGradient id="bezel3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4D4D4"/>
      <stop offset="30%" stop-color="#E8E8E8"/>
      <stop offset="50%" stop-color="#C8C8C8"/>
      <stop offset="70%" stop-color="#B0B0B0"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>

    <!-- 時針漸變 -->
    <linearGradient id="hourHandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="50%" stop-color="#34495E"/>
      <stop offset="100%" stop-color="#1A252F"/>
    </linearGradient>

    <!-- 分針漸變 -->
    <linearGradient id="minHandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="50%" stop-color="#3D566E"/>
      <stop offset="100%" stop-color="#1A252F"/>
    </linearGradient>

    <!-- 刻度陰影 -->
    <filter id="tickShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 數字陰影 -->
    <filter id="numShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- 卡片圓角遮罩 -->
    <clipPath id="cardClip">
      <rect x="20" y="20" width="560" height="360" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- 圓角卡片 -->
  <rect x="20" y="20" width="560" height="360" rx="24" ry="24" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 卡片內邊框裝飾 -->
  <rect x="20" y="20" width="560" height="360" rx="24" ry="24" fill="none" stroke="#F0F0F0" stroke-width="1"/>

  <!-- 頂部裝飾條 -->
  <rect x="20" y="20" width="560" height="6" rx="3" fill="url(#clockBorder)"/>

  <!-- 標題 -->
  <text x="300" y="62" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="18" font-weight="700" fill="#2C3E50" letter-spacing="2">🕐 時鐘面學習</text>

  <!-- 時鐘主體 - 3D 立體外框 -->
  <g transform="translate(300, 225)">
    <!-- 外層陰影 -->
    <circle cx="0" cy="0" r="148" fill="none" filter="url(#clockShadow)"/>

    <!-- 3D 立體邊緣（外圈） -->
    <circle cx="0" cy="0" r="148" fill="url(#bezel3D)" stroke="#A0A0A0" stroke-width="0.5"/>

    <!-- 3D 立體邊緣（內圈） -->
    <circle cx="0" cy="2" r="142" fill="url(#clockBorder)" stroke="#C8C8C8" stroke-width="0.5"/>

    <!-- 時鐘白色面 -->
    <circle cx="0" cy="0" r="138" fill="url(#clockFace)" stroke="#D4D4D4" stroke-width="0.5"/>

    <!-- 內圈陰影 -->
    <circle cx="0" cy="0" r="138" fill="none" filter="url(#innerShadow)"/>

    <!-- 分鐘刻度線（60 條） -->
    <g filter="url(#tickShadow)">
      <!-- 每條刻度線 -->
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(0)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(6)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(12)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(18)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(24)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(36)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(42)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(48)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(54)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(66)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(72)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(78)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(84)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(96)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(102)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(108)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(114)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(126)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(132)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(138)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(144)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(156)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(162)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(168)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(174)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(186)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(192)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(198)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(204)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(216)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(222)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(228)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(234)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(246)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(252)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(258)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(264)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(276)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(282)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(288)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(294)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(306)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(312)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(318)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(324)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(336)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(342)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(348)"/>
      <line x1="0" y1="-125" x2="0" y2="-118" stroke="#B0B0B0" stroke-width="1" transform="rotate(354)"/>
    </g>

    <!-- 5 分鐘刻度（粗線） -->
    <g filter="url(#tickShadow)">
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(0)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(30)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(60)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(90)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(120)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(150)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(180)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(210)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(240)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(270)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(300)"/>
      <line x1="0" y1="-128" x2="0" y2="-113" stroke="#555555" stroke-width="3" stroke-linecap="round" transform="rotate(330)"/>
    </g>

    <!-- 數字 - 使用 filter 陰影 -->
    <g font-family="'Arial', 'Helvetica', sans-serif" font-size="20" font-weight="700" fill="#2C3E50" text-anchor="middle" dominant-baseline="central" filter="url(#numShadow)">
      <text x="0" y="-102">12</text>
      <text x="53" y="-88">1</text>
      <text x="90" y="-53">2</text>
      <text x="105" y="0">3</text>
      <text x="90" y="53">4</text>
      <text x="53" y="88">5</text>
      <text x="0" y="105">6</text>
      <text x="-53" y="88">7</text>
      <text x="-90" y="53">8</text>
      <text x="-105" y="0">9</text>
      <text x="-90" y="-53">10</text>
      <text x="-53" y="-88">11</text>
    </g>

    <!-- 時針（指向 10 點位置） -->
    <g filter="url(#handShadow)">
      <polygon points="-6,15 0,-75 6,15" fill="url(#hourHandGrad)" transform="rotate(-60)"/>
      <!-- 時針高光 -->
      <polygon points="-2,12 0,-70 2,12" fill="#4A6A8A" opacity="0.3" transform="rotate(-60)"/>
    </g>

    <!-- 分針（指向 2 點位置） -->
    <g filter="url(#handShadow)">
      <polygon points="-4,18 0,-110 4,18" fill="url(#minHandGrad)" transform="rotate(60)"/>
      <!-- 分針高光 -->
      <polygon points="-1.5,15 0,-105 1.5,15" fill="#4A6A8A" opacity="0.25" transform="rotate(60)"/>
    </g>

    <!-- 中心點光暈 -->
    <circle cx="0" cy="0" r="20" fill="url(#centerGlow)"/>

    <!-- 中心點外圈 -->
    <circle cx="0" cy="0" r="8" fill="#FFD700" stroke="#E6A800" stroke-width="1.5"/>

    <!-- 中心點內圈 -->
    <circle cx="0" cy="0" r="4" fill="#FFF8DC"/>

    <!-- 中心點高光 -->
    <circle cx="-1.5" cy="-1.5" r="2" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 底部說明文字 -->
  <text x="300" y="370" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="12" fill="#999999">
    時針（短）· 分針（長）· 5 分鐘刻度
  </text>
</svg>