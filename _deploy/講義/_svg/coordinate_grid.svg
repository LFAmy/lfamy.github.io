<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#F0F2F5"/>
    </radialGradient>

    <!-- 卡片主體漸變（多層） -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#F8FAFE"/>
      <stop offset="100%" stop-color="#E8EDF5"/>
    </linearGradient>

    <!-- 卡片邊框漸變 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- 網格線漸變 -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1D9E6"/>
      <stop offset="100%" stop-color="#B8C4D4"/>
    </linearGradient>

    <!-- 座標軸漸變 -->
    <linearGradient id="axisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- 點1放射漸變 (2,3) - 藍色 -->
    <radialGradient id="point1Grad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>

    <!-- 點1高光 -->
    <radialGradient id="point1Highlight" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- 點2放射漸變 (4,5) - 紫色 -->
    <radialGradient id="point2Grad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>

    <radialGradient id="point2Highlight" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- 點3放射漸變 (5,1) - 翡翠綠 -->
    <radialGradient id="point3Grad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <radialGradient id="point3Highlight" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- 陰影濾鏡：雙層陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#94A3B8" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#64748B" flood-opacity="0.15"/>
    </filter>

    <!-- 點陰影 -->
    <filter id="pointShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.3"/>
    </filter>

    <!-- 標籤陰影 -->
    <filter id="labelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- 網格線陰影 -->
    <filter id="gridShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" flood-color="#94A3B8" flood-opacity="0.1"/>
    </filter>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- 裝飾條漸變 -->
    <linearGradient id="decoBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="33%" stop-color="#8B5CF6"/>
      <stop offset="66%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="80" fill="#3B82F6" opacity="0.03"/>
  <circle cx="550" cy="350" r="100" fill="#8B5CF6" opacity="0.03"/>
  <circle cx="500" cy="60" r="60" fill="#10B981" opacity="0.03"/>

  <!-- 主卡片 -->
  <rect x="30" y="25" width="540" height="350" rx="16" ry="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- 頂部裝飾條 -->
  <rect x="30" y="25" width="540" height="5" rx="3" ry="3" fill="url(#decoBar)"/>

  <!-- 標題 -->
  <text x="300" y="62" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="url(#titleGrad)" filter="url(#labelShadow)">坐標網格 · 第一象限</text>

  <!-- 副標題 -->
  <text x="300" y="82" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#94A3B8" letter-spacing="2">坐標範圍 0 – 6</text>

  <!-- 網格背景區域 -->
  <rect x="80" y="100" width="420" height="240" rx="8" ry="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#gridShadow)"/>

  <!-- 網格線（垂直） -->
  <g stroke="url(#gridGrad)" stroke-width="0.8" opacity="0.6">
    <line x1="150" y1="100" x2="150" y2="340" filter="url(#gridShadow)"/>
    <line x1="220" y1="100" x2="220" y2="340" filter="url(#gridShadow)"/>
    <line x1="290" y1="100" x2="290" y2="340" filter="url(#gridShadow)"/>
    <line x1="360" y1="100" x2="360" y2="340" filter="url(#gridShadow)"/>
    <line x1="430" y1="100" x2="430" y2="340" filter="url(#gridShadow)"/>
    <line x1="500" y1="100" x2="500" y2="340" filter="url(#gridShadow)"/>
  </g>

  <!-- 網格線（水平） -->
  <g stroke="url(#gridGrad)" stroke-width="0.8" opacity="0.6">
    <line x1="80" y1="140" x2="500" y2="140" filter="url(#gridShadow)"/>
    <line x1="80" y1="180" x2="500" y2="180" filter="url(#gridShadow)"/>
    <line x1="80" y1="220" x2="500" y2="220" filter="url(#gridShadow)"/>
    <line x1="80" y1="260" x2="500" y2="260" filter="url(#gridShadow)"/>
    <line x1="80" y1="300" x2="500" y2="300" filter="url(#gridShadow)"/>
  </g>

  <!-- X 軸（加粗） -->
  <line x1="80" y1="340" x2="500" y2="340" stroke="url(#axisGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Y 軸（加粗） -->
  <line x1="80" y1="100" x2="80" y2="340" stroke="url(#axisGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 箭頭 - X 軸 -->
  <polygon points="500,340 492,335 492,345" fill="#1E293B"/>
  <!-- 箭頭 - Y 軸 -->
  <polygon points="80,100 75,108 85,108" fill="#1E293B"/>

  <!-- X 軸標籤 -->
  <g font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
    <text x="150" y="360">1</text>
    <text x="220" y="360">2</text>
    <text x="290" y="360">3</text>
    <text x="360" y="360">4</text>
    <text x="430" y="360">5</text>
    <text x="500" y="360">6</text>
  </g>

  <!-- Y 軸標籤 -->
  <g font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#64748B" text-anchor="end">
    <text x="72" y="144">1</text>
    <text x="72" y="184">2</text>
    <text x="72" y="224">3</text>
    <text x="72" y="264">4</text>
    <text x="72" y="304">5</text>
    <text x="72" y="344">6</text>
  </g>

  <!-- 軸標籤 -->
  <text x="510" y="355" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#334155">x</text>
  <text x="68" y="98" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#334155">y</text>

  <!-- 原點 O -->
  <text x="72" y="355" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="end">O</text>

  <!-- ============ 點 (2,3) ============ -->
  <g filter="url(#pointShadow)">
    <!-- 外光暈 -->
    <circle cx="220" cy="220" r="16" fill="#3B82F6" opacity="0.12"/>
    <!-- 主點 -->
    <circle cx="220" cy="220" r="10" fill="url(#point1Grad)"/>
    <!-- 3D 高光 -->
    <circle cx="220" cy="220" r="10" fill="url(#point1Highlight)"/>
    <!-- 內光點 -->
    <circle cx="216" cy="216" r="3" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <!-- 標籤背景 -->
  <rect x="232" y="208" width="48" height="20" rx="10" ry="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1" opacity="0.95"/>
  <!-- 標籤文字 -->
  <text x="256" y="222" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#1D4ED8">(2,3)</text>

  <!-- ============ 點 (4,5) ============ -->
  <g filter="url(#pointShadow)">
    <circle cx="360" cy="140" r="16" fill="#8B5CF6" opacity="0.12"/>
    <circle cx="360" cy="140" r="10" fill="url(#point2Grad)"/>
    <circle cx="360" cy="140" r="10" fill="url(#point2Highlight)"/>
    <circle cx="356" cy="136" r="3" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <rect x="372" y="128" width="48" height="20" rx="10" ry="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1" opacity="0.95"/>
  <text x="396" y="142" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#6D28D9">(4,5)</text>

  <!-- ============ 點 (5,1) ============ -->
  <g filter="url(#pointShadow)">
    <circle cx="430" cy="300" r="16" fill="#10B981" opacity="0.12"/>
    <circle cx="430" cy="300" r="10" fill="url(#point3Grad)"/>
    <circle cx="430" cy="300" r="10" fill="url(#point3Highlight)"/>
    <circle cx="426" cy="296" r="3" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <rect x="442" y="288" width="48" height="20" rx="10" ry="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1" opacity="0.95"/>
  <text x="466" y="302" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="600" fill="#047857">(5,1)</text>

  <!-- 圖例 -->
  <g transform="translate(130, 370)">
    <rect x="0" y="0" width="340" height="0" rx="0" ry="0" fill="none"/>
    <!-- 圖例點 -->
    <circle cx="20" cy="-5" r="5" fill="url(#point1Grad)"/>
    <text x="30" y="-1" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748B">(2,3)</text>
    <circle cx="120" cy="-5" r="5" fill="url(#point2Grad)"/>
    <text x="130" y="-1" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748B">(4,5)</text>
    <circle cx="220" cy="-5" r="5" fill="url(#point3Grad)"/>
    <text x="230" y="-1" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="10" fill="#64748B">(5,1)</text>
  </g>

  <!-- 右下角裝飾 -->
  <text x="540" y="355" text-anchor="end" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="8" fill="#CBD5E1" letter-spacing="1">小學數學 · 坐標網格</text>
</svg>