<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-dot" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#D0D6DD"/>
    </pattern>

    <!-- 主卡片漸層 - 多層漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F8FAFF"/>
      <stop offset="50%" stop-color="#F0F4FF"/>
      <stop offset="75%" stop-color="#EBF0FE"/>
      <stop offset="100%" stop-color="#E4EBFA"/>
    </linearGradient>

    <!-- 步驟卡片漸層 - 放射漸變3D光影 -->
    <radialGradient id="step1Grad" cx="30%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFE8E0"/>
      <stop offset="60%" stop-color="#FFD4C8"/>
      <stop offset="85%" stop-color="#F5B8A8"/>
      <stop offset="100%" stop-color="#E89F8C"/>
    </radialGradient>

    <radialGradient id="step2Grad" cx="30%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E0F0E8"/>
      <stop offset="60%" stop-color="#C8E8D8"/>
      <stop offset="85%" stop-color="#A8D8C0"/>
      <stop offset="100%" stop-color="#8CC4A8"/>
    </radialGradient>

    <radialGradient id="step3Grad" cx="30%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E0E8FF"/>
      <stop offset="60%" stop-color="#C8D8FF"/>
      <stop offset="85%" stop-color="#A8C0F0"/>
      <stop offset="100%" stop-color="#8CA8E0"/>
    </radialGradient>

    <!-- 標題漸層 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C3E6B"/>
      <stop offset="40%" stop-color="#4A6FA5"/>
      <stop offset="70%" stop-color="#3D5A8C"/>
      <stop offset="100%" stop-color="#2C3E6B"/>
    </linearGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#A0B0C8" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#C0D0E0" flood-opacity="0.2"/>
    </filter>

    <filter id="stepShadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#8898B0" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#AAB8D0" flood-opacity="0.2"/>
    </filter>

    <filter id="arrowShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#8898B0" flood-opacity="0.25"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7A8BA8"/>
    </marker>

    <!-- 數字標籤漸層 -->
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#E84520"/>
    </linearGradient>

    <linearGradient id="numGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF80"/>
      <stop offset="100%" stop-color="#2E8B60"/>
    </linearGradient>

    <linearGradient id="numGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B7FD4"/>
      <stop offset="100%" stop-color="#3A5FB8"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#grid-dot)"/>

  <!-- 主卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#D0DCE8" stroke-width="1"/>

  <!-- 標題 -->
  <text x="300" y="52" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="bold" fill="url(#titleGrad)" letter-spacing="2">
    📐 方程進階 · 三步解括號方程
  </text>

  <!-- 分隔線 -->
  <line x1="60" y1="65" x2="540" y2="65" stroke="#D8E0EC" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 方程式顯示區 -->
  <rect x="140" y="78" width="320" height="44" rx="22" fill="#F0F4FA" stroke="#C8D4E4" stroke-width="1.5" filter="url(#stepShadow)"/>
  <text x="300" y="107" text-anchor="middle" font-family="'Courier New','Consolas',monospace" font-size="22" font-weight="bold" fill="#2C3E6B">
    2(x + 3) = 14
  </text>

  <!-- 步驟 1：去括號 -->
  <g filter="url(#stepShadow)">
    <rect x="40" y="145" width="155" height="95" rx="14" fill="url(#step1Grad)" stroke="#E8A088" stroke-width="1.5"/>
    <!-- 步驟編號 -->
    <circle cx="62" cy="162" r="12" fill="url(#numGrad)"/>
    <text x="62" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
    <!-- 步驟標題 -->
    <text x="82" y="167" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#8B3A2A">去括號</text>
    <!-- 步驟內容 -->
    <text x="55" y="192" font-family="'Courier New','Consolas',monospace" font-size="15" font-weight="bold" fill="#5A2A1A">2·x + 2·3 = 14</text>
    <text x="55" y="215" font-family="'Courier New','Consolas',monospace" font-size="15" font-weight="bold" fill="#5A2A1A">2x + 6 = 14</text>
    <!-- 小提示 -->
    <text x="55" y="233" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#A06050" font-style="italic">分配律：a(b+c)=ab+ac</text>
  </g>

  <!-- 箭頭 1→2 -->
  <g filter="url(#arrowShadow)">
    <line x1="200" y1="192" x2="235" y2="192" stroke="#7A8BA8" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  </g>

  <!-- 步驟 2：移項 -->
  <g filter="url(#stepShadow)">
    <rect x="245" y="145" width="155" height="95" rx="14" fill="url(#step2Grad)" stroke="#90C8A8" stroke-width="1.5"/>
    <circle cx="267" cy="162" r="12" fill="url(#numGrad2)"/>
    <text x="267" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="287" y="167" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#2A6A4A">移項</text>
    <text x="260" y="192" font-family="'Courier New','Consolas',monospace" font-size="15" font-weight="bold" fill="#1A4A3A">2x + 6 - 6 = 14 - 6</text>
    <text x="260" y="215" font-family="'Courier New','Consolas',monospace" font-size="15" font-weight="bold" fill="#1A4A3A">2x = 8</text>
    <text x="260" y="233" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#509070" font-style="italic">等式性質：兩邊同減6</text>
  </g>

  <!-- 箭頭 2→3 -->
  <g filter="url(#arrowShadow)">
    <line x1="405" y1="192" x2="440" y2="192" stroke="#7A8BA8" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  </g>

  <!-- 步驟 3：求解 -->
  <g filter="url(#stepShadow)">
    <rect x="450" y="145" width="120" height="95" rx="14" fill="url(#step3Grad)" stroke="#88A8D8" stroke-width="1.5"/>
    <circle cx="470" cy="162" r="12" fill="url(#numGrad3)"/>
    <text x="470" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="490" y="167" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#2A4A7A">求解</text>
    <text x="465" y="195" font-family="'Courier New','Consolas',monospace" font-size="16" font-weight="bold" fill="#1A3A6A">2x = 8</text>
    <text x="465" y="218" font-family="'Courier New','Consolas',monospace" font-size="16" font-weight="bold" fill="#1A3A6A">x = 4</text>
    <text x="465" y="233" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#5080B0" font-style="italic">兩邊同除2</text>
  </g>

  <!-- 答案框 -->
  <rect x="195" y="268" width="210" height="50" rx="25" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="300" y="293" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" fill="#3A5A8A">✅ 解：</text>
  <text x="300" y="312" text-anchor="middle" font-family="'Courier New','Consolas',monospace" font-size="20" font-weight="bold" fill="#2C3E6B">
    x = 4
  </text>

  <!-- 驗證提示 -->
  <text x="300" y="348" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#7A8BA8">
    驗算：2(4 + 3) = 2 × 7 = 14 ✓
  </text>

  <!-- 底部裝飾線 -->
  <line x1="180" y1="362" x2="420" y2="362" stroke="#D0DCE8" stroke-width="1" stroke-dasharray="2,4"/>
</svg>