<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#E2E8F0" opacity="0.6"/>
    </pattern>

    <!-- 主色放射漸變（藍色系） -->
    <radialGradient id="gradHalf" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </radialGradient>

    <radialGradient id="gradThird" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </radialGradient>

    <radialGradient id="gradQuarter" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="30%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </radialGradient>

    <radialGradient id="gradTwoThirds" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </radialGradient>

    <radialGradient id="gradThreeQuarters" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </radialGradient>

    <!-- 強調色放射漸變（橙色系） -->
    <radialGradient id="gradAccent1" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <radialGradient id="gradAccent2" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <radialGradient id="gradAccent3" cx="35%" cy="35%" r="65%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>

    <filter id="pieShadow" x="-20%" y="-20%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E293B" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.10"/>
    </filter>

    <!-- 漸層箭頭 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="url(#arrowGrad)"/>
    </marker>

    <!-- 卡片漸層邊框 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="18" font-weight="bold" fill="#1E293B">分數基本認識</text>
  <line x1="200" y1="40" x2="400" y2="40" stroke="url(#borderGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ==================== 卡片 1：1/2 ==================== -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="170" height="155" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)" stroke="url(#borderGrad)" stroke-width="2"/>
    <text x="85" y="22" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#334155">1/2 一半</text>

    <!-- 圓餅圖 1/2 -->
    <g transform="translate(85, 85)" filter="url(#pieShadow)">
      <!-- 背景圓 -->
      <circle cx="0" cy="0" r="45" fill="#F1F5F9"/>
      <!-- 1/2 部分（上半） -->
      <path d="M0,0 L0,-45 A45,45 0 0,1 0,45 Z" fill="url(#gradHalf)"/>
      <!-- 分隔線 -->
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <!-- 高光 -->
      <ellipse cx="-12" cy="-18" rx="10" ry="6" fill="#FFFFFF" opacity="0.25" transform="rotate(-30,-12,-18)"/>
    </g>

    <!-- 標示 -->
    <text x="85" y="148" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#64748B">
      <tspan fill="#4F46E5" font-weight="bold">分子：1</tspan> ｜
      <tspan fill="#F59E0B" font-weight="bold">分母：2</tspan>
    </text>
  </g>

  <!-- ==================== 卡片 2：1/3 ==================== -->
  <g transform="translate(210, 55)">
    <rect x="0" y="0" width="170" height="155" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)" stroke="url(#borderGrad)" stroke-width="2"/>
    <text x="85" y="22" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#334155">1/3 三分之一</text>

    <!-- 圓餅圖 1/3 -->
    <g transform="translate(85, 85)" filter="url(#pieShadow)">
      <circle cx="0" cy="0" r="45" fill="#F1F5F9"/>
      <!-- 1/3 部分（120度） -->
      <path d="M0,0 L0,-45 A45,45 0 0,1 38.97,22.5 Z" fill="url(#gradThird)"/>
      <!-- 分隔線 -->
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="-45" x2="38.97" y2="22.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="-45" x2="-38.97" y2="22.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 高光 -->
      <ellipse cx="-10" cy="-18" rx="8" ry="5" fill="#FFFFFF" opacity="0.25" transform="rotate(-20,-10,-18)"/>
    </g>

    <text x="85" y="148" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#64748B">
      <tspan fill="#4F46E5" font-weight="bold">分子：1</tspan> ｜
      <tspan fill="#F59E0B" font-weight="bold">分母：3</tspan>
    </text>
  </g>

  <!-- ==================== 卡片 3：1/4 ==================== -->
  <g transform="translate(400, 55)">
    <rect x="0" y="0" width="180" height="155" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)" stroke="url(#borderGrad)" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#334155">1/4 四分之一</text>

    <!-- 圓餅圖 1/4 -->
    <g transform="translate(90, 85)" filter="url(#pieShadow)">
      <circle cx="0" cy="0" r="45" fill="#F1F5F9"/>
      <!-- 1/4 部分（右上象限） -->
      <path d="M0,0 L0,-45 A45,45 0 0,1 45,0 Z" fill="url(#gradQuarter)"/>
      <!-- 分隔線 -->
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-45" y1="0" x2="45" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 高光 -->
      <ellipse cx="8" cy="-18" rx="8" ry="5" fill="#FFFFFF" opacity="0.25" transform="rotate(30,8,-18)"/>
    </g>

    <text x="90" y="148" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#64748B">
      <tspan fill="#4F46E5" font-weight="bold">分子：1</tspan> ｜
      <tspan fill="#F59E0B" font-weight="bold">分母：4</tspan>
    </text>
  </g>

  <!-- ==================== 卡片 4：2/3 ==================== -->
  <g transform="translate(80, 225)">
    <rect x="0" y="0" width="200" height="155" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)" stroke="url(#borderGrad)" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#334155">2/3 三分之二</text>

    <!-- 圓餅圖 2/3 -->
    <g transform="translate(100, 85)" filter="url(#pieShadow)">
      <circle cx="0" cy="0" r="45" fill="#F1F5F9"/>
      <!-- 2/3 部分（240度） -->
      <path d="M0,0 L0,-45 A45,45 0 0,1 -38.97,22.5 Z" fill="url(#gradTwoThirds)"/>
      <!-- 未選取部分用強調色 -->
      <path d="M0,0 L-38.97,22.5 A45,45 0 0,1 0,45 Z" fill="url(#gradAccent1)"/>
      <!-- 分隔線 -->
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="-45" x2="38.97" y2="22.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="-45" x2="-38.97" y2="22.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 高光 -->
      <ellipse cx="-8" cy="-20" rx="10" ry="5" fill="#FFFFFF" opacity="0.25" transform="rotate(-15,-8,-20)"/>
    </g>

    <text x="100" y="148" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#64748B">
      <tspan fill="#4F46E5" font-weight="bold">分子：2</tspan> ｜
      <tspan fill="#F59E0B" font-weight="bold">分母：3</tspan>
    </text>
  </g>

  <!-- ==================== 卡片 5：3/4 ==================== -->
  <g transform="translate(310, 225)">
    <rect x="0" y="0" width="200" height="155" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)" stroke="url(#borderGrad)" stroke-width="2"/>
    <text x="100" y="22" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="13" font-weight="bold" fill="#334155">3/4 四分之三</text>

    <!-- 圓餅圖 3/4 -->
    <g transform="translate(100, 85)" filter="url(#pieShadow)">
      <circle cx="0" cy="0" r="45" fill="#F1F5F9"/>
      <!-- 3/4 部分（270度） -->
      <path d="M0,0 L0,-45 A45,45 0 0,1 -45,0 Z" fill="url(#gradThreeQuarters)"/>
      <!-- 未選取部分用強調色 -->
      <path d="M0,0 L-45,0 A45,45 0 0,1 0,45 Z" fill="url(#gradAccent2)"/>
      <!-- 分隔線 -->
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-45" y1="0" x2="45" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 高光 -->
      <ellipse cx="-10" cy="-18" rx="10" ry="5" fill="#FFFFFF" opacity="0.25" transform="rotate(-25,-10,-18)"/>
    </g>

    <text x="100" y="148" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#64748B">
      <tspan fill="#4F46E5" font-weight="bold">分子：3</tspan> ｜
      <tspan fill="#F59E0B" font-weight="bold">分母：4</tspan>
    </text>
  </g>

  <!-- 底部說明箭頭 -->
  <g transform="translate(260, 388)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="url(#arrowGrad)" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="40" y="-6" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#94A3B8">分子 ÷ 分母</text>
  </g>
</svg>