<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>

    <!-- 圓形放射漸變 - 3D光影效果 -->
    <radialGradient id="circleGrad" cx="0.38" cy="0.35" r="0.62">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="30%" stop-color="#FF7043"/>
      <stop offset="60%" stop-color="#F4511E"/>
      <stop offset="85%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>

    <!-- 扇形漸變 -->
    <radialGradient id="sliceGrad1" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="40%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#D84315"/>
    </radialGradient>

    <radialGradient id="sliceGrad2" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#FFCCBC"/>
      <stop offset="40%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </radialGradient>

    <!-- 長方形漸變 -->
    <linearGradient id="rectGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>

    <!-- 長方形條紋漸變 -->
    <linearGradient id="rectStripe1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="50%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>

    <linearGradient id="rectStripe2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E64A19"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A2A3A" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1A2A3A" flood-opacity="0.10"/>
    </filter>

    <filter id="elementShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1A2A3A" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1A2A3A" flood-opacity="0.15"/>
    </filter>

    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2A3A" flood-opacity="0.12"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565C0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C62828"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="16" ry="16" fill="#FAFBFC"/>
  <rect width="600" height="400" rx="16" ry="16" fill="url(#bgGrad)" opacity="0.5"/>

  <!-- 主卡片容器 -->
  <rect x="10" y="10" width="580" height="380" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 標題區域 -->
  <rect x="10" y="10" width="580" height="48" rx="14" ry="14" fill="#1565C0" opacity="0.08"/>
  <text x="300" y="42" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="20" font-weight="bold" fill="#1565C0">圓面積公式推導 — 圓形切割重組為長方形</text>

  <!-- ==================== 左側：圓形切割 ==================== -->
  <g transform="translate(155, 210)">
    <!-- 圓形外陰影 -->
    <circle cx="0" cy="0" r="88" fill="none" filter="url(#elementShadow)"/>

    <!-- 圓形背景 -->
    <circle cx="0" cy="0" r="88" fill="#FFF3E0" stroke="#FF7043" stroke-width="1.5"/>

    <!-- 切割線（8條半徑） -->
    <g stroke="#BF360C" stroke-width="0.8" opacity="0.5">
      <line x1="0" y1="0" x2="0" y2="-88"/>
      <line x1="0" y1="0" x2="62.2" y2="-62.2"/>
      <line x1="0" y1="0" x2="88" y2="0"/>
      <line x1="0" y1="0" x2="62.2" y2="62.2"/>
      <line x1="0" y1="0" x2="0" y2="88"/>
      <line x1="0" y1="0" x2="-62.2" y2="62.2"/>
      <line x1="0" y1="0" x2="-88" y2="0"/>
      <line x1="0" y1="0" x2="-62.2" y2="-62.2"/>
    </g>

    <!-- 扇形填充（交替顏色） -->
    <path d="M0,0 L0,-88 A88,88 0 0,1 62.2,-62.2 Z" fill="url(#sliceGrad1)" opacity="0.7"/>
    <path d="M0,0 L62.2,-62.2 A88,88 0 0,1 88,0 Z" fill="url(#sliceGrad2)" opacity="0.7"/>
    <path d="M0,0 L88,0 A88,88 0 0,1 62.2,62.2 Z" fill="url(#sliceGrad1)" opacity="0.7"/>
    <path d="M0,0 L62.2,62.2 A88,88 0 0,1 0,88 Z" fill="url(#sliceGrad2)" opacity="0.7"/>
    <path d="M0,0 L0,88 A88,88 0 0,1 -62.2,62.2 Z" fill="url(#sliceGrad1)" opacity="0.7"/>
    <path d="M0,0 L-62.2,62.2 A88,88 0 0,1 -88,0 Z" fill="url(#sliceGrad2)" opacity="0.7"/>
    <path d="M0,0 L-88,0 A88,88 0 0,1 -62.2,-62.2 Z" fill="url(#sliceGrad1)" opacity="0.7"/>
    <path d="M0,0 L-62.2,-62.2 A88,88 0 0,1 0,-88 Z" fill="url(#sliceGrad2)" opacity="0.7"/>

    <!-- 圓形邊框 -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#D84315" stroke-width="2.5"/>

    <!-- 中心點 -->
    <circle cx="0" cy="0" r="3.5" fill="#BF360C"/>

    <!-- 半徑標註 r -->
    <line x1="0" y1="0" x2="60" y2="-60" stroke="#1565C0" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
    <text x="32" y="-38" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" fill="#1565C0" font-style="italic">r</text>

    <!-- 圓周標註 C -->
    <path d="M-80,-36 A88,88 0 0,1 -36,-80" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-dasharray="4,3"/>
    <text x="-72" y="-52" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" fill="#2E7D32" font-style="italic">C</text>

    <!-- 標籤 -->
    <text x="0" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="14" font-weight="bold" fill="#BF360C">① 把圓切割成 8 個扇形</text>
  </g>

  <!-- ==================== 中間：箭頭轉換 ==================== -->
  <g transform="translate(280, 210)">
    <!-- 轉換箭頭 -->
    <path d="M-15,0 L15,0" stroke="#1565C0" stroke-width="2.5" marker-end="url(#arrowBlue)" opacity="0.6"/>
    <path d="M-15,-8 L15,-8" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.3"/>
    <path d="M-15,8 L15,8" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrowBlue)" opacity="0.3"/>

    <!-- 轉換文字 -->
    <text x="0" y="-22" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="12" fill="#1565C0" opacity="0.8">重組</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="11" fill="#1565C0" opacity="0.6">⟶</text>
  </g>

  <!-- ==================== 右側：近似長方形 ==================== -->
  <g transform="translate(430, 210)">
    <!-- 長方形外陰影 -->
    <rect x="-95" y="-55" width="190" height="110" rx="4" ry="4" fill="none" filter="url(#elementShadow)"/>

    <!-- 長方形背景 -->
    <rect x="-95" y="-55" width="190" height="110" rx="4" ry="4" fill="#FFF3E0" stroke="#D84315" stroke-width="1.5"/>

    <!-- 長方形內部條紋（模擬扇形交錯） -->
    <rect x="-95" y="-55" width="23.75" height="110" fill="url(#rectStripe1)" opacity="0.5"/>
    <rect x="-71.25" y="-55" width="23.75" height="110" fill="url(#rectStripe2)" opacity="0.5"/>
    <rect x="-47.5" y="-55" width="23.75" height="110" fill="url(#rectStripe1)" opacity="0.5"/>
    <rect x="-23.75" y="-55" width="23.75" height="110" fill="url(#rectStripe2)" opacity="0.5"/>
    <rect x="0" y="-55" width="23.75" height="110" fill="url(#rectStripe1)" opacity="0.5"/>
    <rect x="23.75" y="-55" width="23.75" height="110" fill="url(#rectStripe2)" opacity="0.5"/>
    <rect x="47.5" y="-55" width="23.75" height="110" fill="url(#rectStripe1)" opacity="0.5"/>
    <rect x="71.25" y="-55" width="23.75" height="110" fill="url(#rectStripe2)" opacity="0.5"/>

    <!-- 長方形邊框 -->
    <rect x="-95" y="-55" width="190" height="110" rx="4" ry="4" fill="none" stroke="#D84315" stroke-width="2.5"/>

    <!-- 寬度標註 = πr -->
    <line x1="-95" y1="62" x2="95" y2="62" stroke="#1565C0" stroke-width="1.8" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
    <text x="0" y="80" text-anchor="middle" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" fill="#1565C0" font-style="italic">πr（半圓周）</text>

    <!-- 高度標註 = r -->
    <line x1="-102" y1="-55" x2="-102" y2="55" stroke="#2E7D32" stroke-width="1.8" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
    <text x="-118" y="5" text-anchor="middle" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" fill="#2E7D32" font-style="italic" transform="rotate(-90,-118,5)">r</text>

    <!-- 標籤 -->
    <text x="0" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="14" font-weight="bold" fill="#BF360C">② 重排成近似長方形</text>
  </g>

  <!-- ==================== 底部：公式推導 ==================== -->
  <g transform="translate(300, 350)">
    <!-- 公式卡片背景 -->
    <rect x="-220" y="-28" width="440" height="56" rx="10" ry="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#softShadow)"/>

    <!-- 公式推導過程 -->
    <text x="-195" y="8" font-family="'Times New Roman', serif" font-size="18" fill="#1B5E20" font-weight="bold">長方形面積</text>
    <text x="-75" y="8" font-family="'Times New Roman', serif" font-size="18" fill="#1B5E20">=</text>
    <text x="-45" y="8" font-family="'Times New Roman', serif" font-size="18" fill="#1565C0" font-weight="bold" font-style="italic">πr</text>
    <text x="-10" y="8" font-family="'Times New Roman', serif" font-size="18" fill="#1B5E20">×</text>
    <text x="10" y="8" font-family="'Times New Roman', serif" font-size="18" fill="#2E7D32" font-weight="bold" font-style="italic">r</text>
    <text x="40" y="8" font-family="'Times New Roman', serif" font-size="18" fill="#1B5E20">=</text>
    <text x="70" y="8" font-family="'Times New Roman', serif" font-size="22" fill="#C62828" font-weight="bold" font-style="italic">πr²</text>

    <!-- 裝飾性下劃線 -->
    <line x1="60" y1="16" x2="130" y2="16" stroke="#C62828" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- 裝飾元素 -->
  <g opacity="0.08">
    <circle cx="30" cy="30" r="40" fill="#1565C0"/>
    <circle cx="570" cy="30" r="40" fill="#1565C0"/>
    <circle cx="30" cy="370" r="40" fill="#1565C0"/>
    <circle cx="570" cy="370" r="40" fill="#1565C0"/>
  </g>
</svg>