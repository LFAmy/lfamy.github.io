<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 卡片主體漸層（多層漸變） -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F8FAFE"/>
      <stop offset="50%" stop-color="#F0F4FC"/>
      <stop offset="75%" stop-color="#E8EEF8"/>
      <stop offset="100%" stop-color="#E0E8F4"/>
    </linearGradient>

    <!-- 卡片邊框漸層 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0D8E8"/>
      <stop offset="50%" stop-color="#B8C4D8"/>
      <stop offset="100%" stop-color="#A0B0C8"/>
    </linearGradient>

    <!-- 直角標記正方形漸層 -->
    <linearGradient id="squareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="30%" stop-color="#FF8E53"/>
      <stop offset="60%" stop-color="#FFB347"/>
      <stop offset="85%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>

    <!-- 垂直線放射漸層（3D光影） -->
    <radialGradient id="verticalLineGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="25%" stop-color="#3B7DD8"/>
      <stop offset="50%" stop-color="#2D6BC4"/>
      <stop offset="75%" stop-color="#1E5AAE"/>
      <stop offset="100%" stop-color="#154A94"/>
    </radialGradient>

    <!-- 水平線漸層 -->
    <linearGradient id="horizontalLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="30%" stop-color="#5B4BD4"/>
      <stop offset="60%" stop-color="#4A3FC0"/>
      <stop offset="100%" stop-color="#3D33A8"/>
    </linearGradient>

    <!-- 直角標記正方形陰影 -->
    <filter id="squareShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#FF6B6B" flood-opacity="0.35"/>
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#FF8E53" flood-opacity="0.15"/>
    </filter>

    <!-- 卡片雙層陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#A0B0C8" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#C0C8D8" flood-opacity="0.15"/>
    </filter>

    <!-- 垂直線發光效果 -->
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 放射狀背景光暈 -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FAFBFC" stop-opacity="0"/>
    </radialGradient>

    <!-- 頂點圓點漸層 -->
    <radialGradient id="vertexDot" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="40%" stop-color="#FFB347"/>
      <stop offset="70%" stop-color="#FF8E53"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </radialGradient>

    <!-- 頂點光暈 -->
    <radialGradient id="vertexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#bgGlow)"/>

  <!-- 主卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="40" width="500" height="320" rx="20" ry="20" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>
  </g>

  <!-- 卡片頂部裝飾條 -->
  <rect x="50" y="40" width="500" height="6" rx="3" ry="3" fill="url(#horizontalLineGrad)" opacity="0.6"/>

  <!-- 標題 -->
  <text x="300" y="85" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="22" font-weight="bold" fill="#2D3748" letter-spacing="2">認識 90° 直角</text>
  <line x1="200" y1="98" x2="400" y2="98" stroke="url(#horizontalLineGrad)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- 垂直線（帶3D光影效果） -->
  <g filter="url(#glowEffect)">
    <!-- 垂直線主體 -->
    <line x1="220" y1="140" x2="220" y2="310" stroke="url(#verticalLineGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- 垂直線高光 -->
    <line x1="218" y1="145" x2="218" y2="305" stroke="#6AB0FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 水平線 -->
  <g filter="url(#glowEffect)">
    <line x1="220" y1="310" x2="390" y2="310" stroke="url(#horizontalLineGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- 水平線高光 -->
    <line x1="225" y1="308" x2="385" y2="308" stroke="#A99AFF" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 直角正方形標記 -->
  <g filter="url(#squareShadow)">
    <rect x="220" y="270" width="40" height="40" fill="url(#squareGrad)" rx="3" ry="3" opacity="0.9"/>
    <!-- 正方形內部高光 -->
    <rect x="224" y="274" width="16" height="16" fill="white" opacity="0.15" rx="2"/>
    <!-- 正方形邊框 -->
    <rect x="220" y="270" width="40" height="40" fill="none" stroke="#FF6B6B" stroke-width="1.5" rx="3" opacity="0.5"/>
  </g>

  <!-- 頂點圓點（帶光暈） -->
  <circle cx="220" cy="310" r="18" fill="url(#vertexGlow)"/>
  <circle cx="220" cy="310" r="8" fill="url(#vertexDot)"/>
  <circle cx="218" cy="307" r="3" fill="white" opacity="0.5"/>

  <!-- 頂點標籤 O -->
  <text x="220" y="340" text-anchor="middle" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#E53E3E" font-style="italic">O</text>

  <!-- 水平線端點標籤 A -->
  <text x="400" y="318" text-anchor="middle" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#5B4BD4" font-style="italic">A</text>

  <!-- 垂直線端點標籤 B -->
  <text x="210" y="135" text-anchor="end" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="#2D6BC4" font-style="italic">B</text>

  <!-- 90° 標籤 -->
  <text x="248" y="295" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#FFFFFF" opacity="0.9">90°</text>

  <!-- 角度弧線 -->
  <path d="M 230 310 A 10 10 0 0 1 220 300" fill="none" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- 說明文字 -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" fill="#4A5568">
    <text x="300" y="370" text-anchor="middle" opacity="0.7">兩條線互相垂直形成 90° 直角</text>
  </g>

  <!-- 裝飾小點 -->
  <circle cx="160" cy="160" r="3" fill="#FFB347" opacity="0.3"/>
  <circle cx="440" cy="180" r="2" fill="#4A90D9" opacity="0.3"/>
  <circle cx="150" cy="300" r="2.5" fill="#6C5CE7" opacity="0.25"/>
  <circle cx="450" cy="280" r="2" fill="#FF6B6B" opacity="0.25"/>
</svg>