<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </radialGradient>

    <!-- 硬幣金屬漸變 - 銀色 -->
    <radialGradient id="silverGrad1" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="30%" stop-color="#D8D8D8"/>
      <stop offset="60%" stop-color="#B0B0B0"/>
      <stop offset="85%" stop-color="#909090"/>
      <stop offset="100%" stop-color="#707070"/>
    </radialGradient>
    <radialGradient id="silverGrad2" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="30%" stop-color="#D0D0D0"/>
      <stop offset="60%" stop-color="#A8A8A8"/>
      <stop offset="85%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#686868"/>
    </radialGradient>

    <!-- 硬幣金屬漸變 - 金色 -->
    <radialGradient id="goldGrad1" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#F5D742"/>
      <stop offset="60%" stop-color="#D4A820"/>
      <stop offset="85%" stop-color="#B8921A"/>
      <stop offset="100%" stop-color="#8C6E10"/>
    </radialGradient>
    <radialGradient id="goldGrad2" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FFF0B0"/>
      <stop offset="30%" stop-color="#F0C830"/>
      <stop offset="60%" stop-color="#C89A18"/>
      <stop offset="85%" stop-color="#A88014"/>
      <stop offset="100%" stop-color="#7A600E"/>
    </radialGradient>

    <!-- 硬幣金屬漸變 - 銅色 -->
    <radialGradient id="copperGrad1" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FDE0C0"/>
      <stop offset="30%" stop-color="#E8A860"/>
      <stop offset="60%" stop-color="#C88040"/>
      <stop offset="85%" stop-color="#A86030"/>
      <stop offset="100%" stop-color="#804020"/>
    </radialGradient>
    <radialGradient id="copperGrad2" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#FCD8B0"/>
      <stop offset="30%" stop-color="#E09850"/>
      <stop offset="60%" stop-color="#B87038"/>
      <stop offset="85%" stop-color="#985828"/>
      <stop offset="100%" stop-color="#703818"/>
    </radialGradient>

    <!-- 3D光影效果 - 高光 -->
    <radialGradient id="highlight" cx="35%" cy="30%" r="30%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 陰影濾鏡 -->
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 雙層陰影卡片 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.12)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 圓角卡片裁剪 -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="600" height="400" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="20" ry="20"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50" letter-spacing="2">
    香港硬幣換算關係
  </text>
  <line x1="180" y1="48" x2="420" y2="48" stroke="#D0D5DD" stroke-width="1"/>

  <!-- ==================== 第一行：1毫、2毫、5毫 ==================== -->

  <!-- 1毫卡片 -->
  <g transform="translate(30, 65)">
    <rect width="165" height="145" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- 1毫硬幣 -->
    <g transform="translate(82, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#silverGrad1)" filter="url(#shadow1)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#555">1毫</text>
      <circle cx="0" cy="0" r="32" fill="url(#highlight)"/>
    </g>
    <text x="82" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">0.10 元</text>
  </g>

  <!-- 2毫卡片 -->
  <g transform="translate(217, 65)">
    <rect width="165" height="145" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(82, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#silverGrad2)" filter="url(#shadow1)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#555">2毫</text>
      <circle cx="0" cy="0" r="32" fill="url(#highlight)"/>
    </g>
    <text x="82" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">0.20 元</text>
  </g>

  <!-- 5毫卡片 -->
  <g transform="translate(405, 65)">
    <rect width="165" height="145" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(82, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#copperGrad1)" filter="url(#shadow1)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B4226">5毫</text>
      <circle cx="0" cy="0" r="32" fill="url(#highlight)"/>
    </g>
    <text x="82" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">0.50 元</text>
  </g>

  <!-- ==================== 第二行：1元、2元、5元、10元 ==================== -->

  <!-- 1元卡片 -->
  <g transform="translate(30, 230)">
    <rect width="125" height="145" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(62, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#goldGrad1)" filter="url(#shadow1)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7A5A00">1元</text>
      <circle cx="0" cy="0" r="32" fill="url(#highlight)"/>
    </g>
    <text x="62" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">1.00 元</text>
  </g>

  <!-- 2元卡片 -->
  <g transform="translate(170, 230)">
    <rect width="125" height="145" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(62, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#goldGrad2)" filter="url(#shadow1)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7A5A00">2元</text>
      <circle cx="0" cy="0" r="32" fill="url(#highlight)"/>
    </g>
    <text x="62" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">2.00 元</text>
  </g>

  <!-- 5元卡片 -->
  <g transform="translate(310, 230)">
    <rect width="125" height="145" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(62, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#silverGrad1)" filter="url(#shadow1)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#555">5元</text>
      <circle cx="0" cy="0" r="32" fill="url(#highlight)"/>
    </g>
    <text x="62" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">5.00 元</text>
  </g>

  <!-- 10元卡片 -->
  <g transform="translate(450, 230)">
    <rect width="120" height="145" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(60, 55)">
      <circle cx="0" cy="0" r="32" fill="url(#copperGrad2)" filter="url(#shadow1)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#6B4226">10元</text>
      <circle cx="0" cy="0" r="32" fill="url(#highlight)"/>
    </g>
    <text x="60" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7F8C8D">10.00 元</text>
  </g>

  <!-- ==================== 換算關係標註 ==================== -->

  <!-- 第一行換算箭頭與文字 -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#95A5A6">
    <!-- 1毫 → 2毫 -->
    <text x="210" y="100" text-anchor="middle">×2</text>
    <!-- 2毫 → 5毫 -->
    <text x="398" y="100" text-anchor="middle">×2.5</text>
  </g>

  <!-- 第二行換算箭頭與文字 -->
  <g font-family="Arial, sans-serif" font-size="9" fill="#95A5A6">
    <!-- 1元 → 2元 -->
    <text x="298" y="265" text-anchor="middle">×2</text>
    <!-- 2元 → 5元 -->
    <text x="438" y="265" text-anchor="middle">×2.5</text>
    <!-- 5元 → 10元 -->
    <text x="568" y="265" text-anchor="middle">×2</text>
  </g>

  <!-- 底部換算總結 -->
  <g transform="translate(300, 378)" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">
    <text x="0" y="0">1 元 = 10 毫 ｜ 1 元 = 2 個 5 毫 ｜ 1 毫 = 10 分</text>
  </g>

</svg>