<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 梯形主體多層漸變（3-5 stop） -->
    <linearGradient id="trapezoidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="25%" stop-color="#5BA0E8"/>
      <stop offset="50%" stop-color="#3A7BC8"/>
      <stop offset="75%" stop-color="#2D6BB5"/>
      <stop offset="100%" stop-color="#1E5799"/>
    </linearGradient>

    <!-- 三角形1漸變（左：紅色系） -->
    <linearGradient id="tri1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="30%" stop-color="#EE5A5A"/>
      <stop offset="60%" stop-color="#E04848"/>
      <stop offset="100%" stop-color="#CC3333"/>
    </linearGradient>

    <!-- 三角形2漸變（右：橙色系） -->
    <linearGradient id="tri2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="30%" stop-color="#FFA533"/>
      <stop offset="60%" stop-color="#FF9400"/>
      <stop offset="100%" stop-color="#E08500"/>
    </linearGradient>

    <!-- 放射漸層3D光影效果 -->
    <radialGradient id="shineEffect" cx="40%" cy="30%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 陰影濾鏡：雙層陰影 -->
    <filter id="doubleShadow" x="-5%" y="-5%" width="115%" height="130%">
      <!-- 第一層陰影：柔軟擴散 -->
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="rgba(0,0,0,0.25)"/>
      <!-- 第二層陰影：較深較集中 -->
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.35)"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-3%" y="-3%" width="108%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.12)"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 文字陰影 -->
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 圓角卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="16" ry="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans HK',Arial,sans-serif" font-size="22" font-weight="bold" fill="#2C3E50" filter="url(#textShadow)">梯形面積公式 — 分割為兩個三角形</text>

  <!-- 梯形主體（上底a，下底b，高h） -->
  <g filter="url(#doubleShadow)">
    <!-- 梯形本體 -->
    <polygon points="120,120 480,120 400,280 200,280" fill="url(#trapezoidGrad)" stroke="#1E5799" stroke-width="2"/>
    <!-- 3D光影覆蓋 -->
    <polygon points="120,120 480,120 400,280 200,280" fill="url(#shineEffect)"/>
  </g>

  <!-- 分割線（將梯形分為兩個三角形） -->
  <line x1="120" y1="120" x2="400" y2="280" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.9"/>

  <!-- 三角形1標示（左：紅色） -->
  <polygon points="120,120 200,280 120,280" fill="url(#tri1Grad)" opacity="0.55"/>
  <text x="155" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">△₁</text>

  <!-- 三角形2標示（右：橙色） -->
  <polygon points="120,120 400,280 480,120" fill="url(#tri2Grad)" opacity="0.40"/>
  <text x="340" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">△₂</text>

  <!-- 上底 a 標示 -->
  <line x1="120" y1="105" x2="480" y2="105" stroke="#E74C3C" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <defs>
    <marker id="arrowStart" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#E74C3C"/>
    </marker>
    <marker id="arrowEnd" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#E74C3C"/>
    </marker>
  </defs>
  <text x="300" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#E74C3C">a（上底）</text>

  <!-- 下底 b 標示 -->
  <line x1="200" y1="298" x2="400" y2="298" stroke="#E74C3C" stroke-width="2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="300" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#E74C3C">b（下底）</text>

  <!-- 高 h 標示（左側垂直虛線） -->
  <line x1="120" y1="120" x2="120" y2="280" stroke="#27AE60" stroke-width="2.5" stroke-dasharray="6,3"/>
  <!-- 高箭頭 -->
  <line x1="105" y1="120" x2="105" y2="280" stroke="#27AE60" stroke-width="2" marker-start="url(#arrowStart2)" marker-end="url(#arrowEnd2)"/>
  <defs>
    <marker id="arrowStart2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#27AE60"/>
    </marker>
    <marker id="arrowEnd2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#27AE60"/>
    </marker>
  </defs>
  <text x="92" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#27AE60" transform="rotate(-90,92,205)">h（高）</text>

  <!-- 公式顯示 -->
  <rect x="160" y="335" width="280" height="36" rx="8" ry="8" fill="#F0F4F8" stroke="#D0D8E0" stroke-width="1"/>
  <text x="300" y="358" text-anchor="middle" font-family="'Times New Roman',serif" font-size="18" font-weight="bold" fill="#2C3E50">
    面積 = ½ × (a + b) × h = △₁ + △₂
  </text>

  <!-- 左上角裝飾標籤 -->
  <rect x="40" y="30" width="80" height="26" rx="13" ry="13" fill="#4A90D9" opacity="0.9"/>
  <text x="80" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">梯形面積</text>

  <!-- 右下角裝飾標籤 -->
  <rect x="460" y="345" width="100" height="24" rx="12" ry="12" fill="#FFB347" opacity="0.85"/>
  <text x="510" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">v3 多層漸變</text>
</svg>