<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1"/>
    </linearGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    </linearGradient>

    <!-- 卡片邊框漸變 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>

    <!-- 圖表區域漸變 -->
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0d2b;stop-opacity:1"/>
    </linearGradient>

    <!-- 折線漸變 - 溫度線 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#3a7bd5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:1"/>
    </linearGradient>

    <!-- 趨勢線漸變 -->
    <linearGradient id="trendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7971e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffd200;stop-opacity:0.9"/>
    </linearGradient>

    <!-- 上升標示漸變 -->
    <linearGradient id="upGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00c853;stop-opacity:1"/>
    </linearGradient>

    <!-- 下降標示漸變 -->
    <linearGradient id="downGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1744;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d50000;stop-opacity:1"/>
    </linearGradient>

    <!-- 平穩標示漸變 -->
    <linearGradient id="flatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd740;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffab00;stop-opacity:1"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pointGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3D光影放射漸變 -->
    <radialGradient id="pointGrad1" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#00d2ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:0.9"/>
    </radialGradient>

    <radialGradient id="pointGrad2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#3a7bd5;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1a3a6e;stop-opacity:0.9"/>
    </radialGradient>

    <radialGradient id="pointGrad3" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#00e676;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00a152;stop-opacity:0.9"/>
    </radialGradient>

    <!-- 面積填充漸變 -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:0.01"/>
    </linearGradient>

    <!-- 網格線陰影 -->
    <filter id="gridShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.05"/>
    </filter>

    <!-- 標籤陰影 -->
    <filter id="labelShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 主卡片 -->
  <rect x="15" y="15" width="570" height="370" rx="20" ry="20" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- 標題區域 -->
  <text x="300" y="52" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="20" font-weight="bold" fill="#ffffff" filter="url(#labelShadow)">📊 香港一週溫度變化折線圖</text>
  <text x="300" y="72" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#8899bb" opacity="0.8">香港小學數學 — 折線圖趨勢</text>

  <!-- 圖表區域 -->
  <rect x="55" y="85" width="490" height="240" rx="12" ry="12" fill="url(#chartBg)" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- 圖表內部邊框光效 -->
  <rect x="55" y="85" width="490" height="240" rx="12" ry="12" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="3"/>

  <!-- Y軸網格線 -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="0.8" filter="url(#gridShadow)">
    <line x1="75" y1="105" x2="525" y2="105"/>
    <line x1="75" y1="145" x2="525" y2="145"/>
    <line x1="75" y1="185" x2="525" y2="185"/>
    <line x1="75" y1="225" x2="525" y2="225"/>
    <line x1="75" y1="265" x2="525" y2="265"/>
    <line x1="75" y1="305" x2="525" y2="305"/>
  </g>

  <!-- Y軸標籤 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#667799" text-anchor="end">
    <text x="68" y="108">35°C</text>
    <text x="68" y="148">30°C</text>
    <text x="68" y="188">25°C</text>
    <text x="68" y="228">20°C</text>
    <text x="68" y="268">15°C</text>
    <text x="68" y="308">10°C</text>
  </g>

  <!-- X軸標籤 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#667799" text-anchor="middle">
    <text x="90" y="340">週一</text>
    <text x="162" y="340">週二</text>
    <text x="234" y="340">週三</text>
    <text x="306" y="340">週四</text>
    <text x="378" y="340">週五</text>
    <text x="450" y="340">週六</text>
    <text x="522" y="340">週日</text>
  </g>

  <!-- 面積填充（在折線下方） -->
  <polygon points="90,265 162,225 234,185 306,145 378,165 450,125 522,145 522,305 90,305" fill="url(#areaGrad)"/>

  <!-- 折線路徑 -->
  <polyline points="90,265 162,225 234,185 306,145 378,165 450,125 522,145" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)"/>

  <!-- 折線光暈 -->
  <polyline points="90,265 162,225 234,185 306,145 378,165 450,125 522,145" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- 數據點 - 3D光影效果 -->
  <!-- 週一：25°C (y=265) -->
  <circle cx="90" cy="265" r="7" fill="url(#pointGrad2)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" filter="url(#pointGlow)"/>
  <circle cx="90" cy="265" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- 週二：28°C (y=225) -->
  <circle cx="162" cy="225" r="7" fill="url(#pointGrad1)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" filter="url(#pointGlow)"/>
  <circle cx="162" cy="225" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- 週三：30°C (y=185) -->
  <circle cx="234" cy="185" r="7" fill="url(#pointGrad1)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" filter="url(#pointGlow)"/>
  <circle cx="234" cy="185" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- 週四：33°C (y=145) -->
  <circle cx="306" cy="145" r="8" fill="url(#pointGrad1)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" filter="url(#pointGlow)"/>
  <circle cx="306" cy="145" r="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- 週五：31°C (y=165) -->
  <circle cx="378" cy="165" r="7" fill="url(#pointGrad2)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" filter="url(#pointGlow)"/>
  <circle cx="378" cy="165" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- 週六：34°C (y=125) -->
  <circle cx="450" cy="125" r="8" fill="url(#pointGrad1)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" filter="url(#pointGlow)"/>
  <circle cx="450" cy="125" r="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- 週日：32°C (y=145) -->
  <circle cx="522" cy="145" r="7" fill="url(#pointGrad2)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" filter="url(#pointGlow)"/>
  <circle cx="522" cy="145" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- 趨勢線（虛線） -->
  <line x1="90" y1="260" x2="522" y2="130" stroke="url(#trendGrad)" stroke-width="2.5" stroke-dasharray="8,6" stroke-linecap="round" opacity="0.85" filter="url(#glowFilter)"/>

  <!-- 趨勢線標籤 -->
  <text x="540" y="128" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#ffd200" opacity="0.9" filter="url(#labelShadow)">趨勢線</text>

  <!-- 上升標示 - 週二到週三 -->
  <g transform="translate(198, 200)">
    <rect x="-28" y="-12" width="56" height="24" rx="12" fill="url(#upGrad)" opacity="0.9" filter="url(#cardShadow)"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="bold" fill="#ffffff">⬆ 上升</text>
  </g>

  <!-- 下降標示 - 週四到週五 -->
  <g transform="translate(342, 175)">
    <rect x="-28" y="-12" width="56" height="24" rx="12" fill="url(#downGrad)" opacity="0.9" filter="url(#cardShadow)"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="bold" fill="#ffffff">⬇ 下降</text>
  </g>

  <!-- 平穩標示 - 週六到週日 -->
  <g transform="translate(486, 155)">
    <rect x="-28" y="-12" width="56" height="24" rx="12" fill="url(#flatGrad)" opacity="0.9" filter="url(#cardShadow)"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="bold" fill="#ffffff">➡ 平穩</text>
  </g>

  <!-- 溫度數值標籤 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#labelShadow)">
    <text x="90" y="280">25°</text>
    <text x="162" y="240">28°</text>
    <text x="234" y="200">30°</text>
    <text x="306" y="160">33°</text>
    <text x="378" y="180">31°</text>
    <text x="450" y="140">34°</text>
    <text x="522" y="160">32°</text>
  </g>

  <!-- 圖例 -->
  <g transform="translate(380, 350)">
    <rect x="0" y="-8" width="155" height="28" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5"/>
    <line x1="12" y1="6" x2="32" y2="6" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="38" y="10" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#aabbdd">溫度變化</text>
    <line x1="85" y1="6" x2="100" y2="6" stroke="url(#trendGrad)" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity="0.8"/>
    <text x="106" y="10" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#aabbdd">趨勢</text>
  </g>

  <!-- 裝飾性光點 -->
  <circle cx="55" cy="85" r="2" fill="#00d2ff" opacity="0.4"/>
  <circle cx="545" cy="85" r="2" fill="#00d2ff" opacity="0.4"/>
  <circle cx="55" cy="325" r="2" fill="#00d2ff" opacity="0.4"/>
  <circle cx="545" cy="325" r="2" fill="#00d2ff" opacity="0.4"/>
</svg>