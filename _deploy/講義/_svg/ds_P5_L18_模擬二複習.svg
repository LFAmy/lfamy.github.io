<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4FF;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FAFBFC;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EEF2F7;stop-opacity:1"/>
    </linearGradient>

    <!-- 站點1：數 - 藍色多層漸變 -->
    <linearGradient id="stop1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="30%" style="stop-color:#5BA0E8"/>
      <stop offset="60%" style="stop-color:#3A7BC8"/>
      <stop offset="100%" style="stop-color:#2A5FA0"/>
    </linearGradient>
    <radialGradient id="stop1Shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>

    <!-- 站點2：量 - 綠色多層漸變 -->
    <linearGradient id="stop2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38B87C"/>
      <stop offset="30%" style="stop-color:#4CC98E"/>
      <stop offset="60%" style="stop-color:#2EA86A"/>
      <stop offset="100%" style="stop-color:#1F8A55"/>
    </linearGradient>
    <radialGradient id="stop2Shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>

    <!-- 站點3：圖形 - 橙色多層漸變 -->
    <linearGradient id="stop3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623"/>
      <stop offset="30%" style="stop-color:#FFB840"/>
      <stop offset="60%" style="stop-color:#E89518"/>
      <stop offset="100%" style="stop-color:#D0800F"/>
    </linearGradient>
    <radialGradient id="stop3Shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>

    <!-- 站點4：方程 - 紫色多層漸變 -->
    <linearGradient id="stop4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6"/>
      <stop offset="30%" style="stop-color:#B06CC9"/>
      <stop offset="60%" style="stop-color:#8E44AD"/>
      <stop offset="100%" style="stop-color:#6C3483"/>
    </linearGradient>
    <radialGradient id="stop4Shine" cx="35%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>

    <!-- 路徑漸變 -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.8"/>
      <stop offset="33%" style="stop-color:#38B87C;stop-opacity:0.8"/>
      <stop offset="66%" style="stop-color:#F5A623;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:0.8"/>
    </linearGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="nodeShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <filter id="checkShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#8899AA"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="20" font-weight="bold" fill="#2C3E50" letter-spacing="2">SSPA 複習路線圖</text>
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#7F8C8D" letter-spacing="1">小學數學 · 四大核心領域</text>

  <!-- 進度路線 -->
  <line x1="95" y1="175" x2="505" y2="175" stroke="url(#pathGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0,0"/>

  <!-- 路線箭頭（裝飾性小箭頭） -->
  <line x1="95" y1="175" x2="505" y2="175" stroke="#8899AA" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,12" marker-end="url(#arrowHead)" opacity="0.4"/>

  <!-- ============ 站點1：數 ============ -->
  <g filter="url(#nodeShadow)">
    <!-- 圓角卡片 -->
    <rect x="50" y="120" width="110" height="110" rx="16" ry="16" fill="url(#stop1Grad)"/>
    <rect x="50" y="120" width="110" height="110" rx="16" ry="16" fill="url(#stop1Shine)"/>
  </g>
  <!-- 圖標：數字符號 -->
  <text x="105" y="168" text-anchor="middle" font-family="'Arial',sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" opacity="0.9">123</text>
  <!-- 站點名稱 -->
  <text x="105" y="200" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">數</text>
  <!-- 檢查點標記 -->
  <g filter="url(#checkShadow)">
    <circle cx="105" cy="220" r="10" fill="#FFFFFF" opacity="0.9"/>
    <path d="M99,220 L103,224 L111,216" stroke="#2A5FA0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="105" y="248" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#4A90D9" opacity="0.8">✓ 檢查點</text>

  <!-- ============ 站點2：量 ============ -->
  <g filter="url(#nodeShadow)">
    <rect x="195" y="120" width="110" height="110" rx="16" ry="16" fill="url(#stop2Grad)"/>
    <rect x="195" y="120" width="110" height="110" rx="16" ry="16" fill="url(#stop2Shine)"/>
  </g>
  <!-- 圖標：量杯 -->
  <text x="250" y="168" text-anchor="middle" font-family="'Arial',sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" opacity="0.9">mL</text>
  <text x="250" y="200" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">量</text>
  <g filter="url(#checkShadow)">
    <circle cx="250" cy="220" r="10" fill="#FFFFFF" opacity="0.9"/>
    <path d="M244,220 L248,224 L256,216" stroke="#1F8A55" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="250" y="248" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#38B87C" opacity="0.8">✓ 檢查點</text>

  <!-- ============ 站點3：圖形 ============ -->
  <g filter="url(#nodeShadow)">
    <rect x="340" y="120" width="110" height="110" rx="16" ry="16" fill="url(#stop3Grad)"/>
    <rect x="340" y="120" width="110" height="110" rx="16" ry="16" fill="url(#stop3Shine)"/>
  </g>
  <!-- 圖標：幾何形狀 -->
  <text x="395" y="168" text-anchor="middle" font-family="'Arial',sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" opacity="0.9">□△</text>
  <text x="395" y="200" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">圖形</text>
  <g filter="url(#checkShadow)">
    <circle cx="395" cy="220" r="10" fill="#FFFFFF" opacity="0.9"/>
    <path d="M389,220 L393,224 L401,216" stroke="#D0800F" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="395" y="248" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#F5A623" opacity="0.8">✓ 檢查點</text>

  <!-- ============ 站點4：方程 ============ -->
  <g filter="url(#nodeShadow)">
    <rect x="485" y="120" width="110" height="110" rx="16" ry="16" fill="url(#stop4Grad)"/>
    <rect x="485" y="120" width="110" height="110" rx="16" ry="16" fill="url(#stop4Shine)"/>
  </g>
  <!-- 圖標：方程式 -->
  <text x="540" y="168" text-anchor="middle" font-family="'Arial',sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" opacity="0.9">x+y</text>
  <text x="540" y="200" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">方程</text>
  <g filter="url(#checkShadow)">
    <circle cx="540" cy="220" r="10" fill="#FFFFFF" opacity="0.9"/>
    <path d="M534,220 L538,224 L546,216" stroke="#6C3483" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="540" y="248" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#9B59B6" opacity="0.8">✓ 檢查點</text>

  <!-- ============ 底部資訊卡片 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="285" width="440" height="85" rx="14" ry="14" fill="#FFFFFF" opacity="0.95"/>
    <rect x="80" y="285" width="440" height="85" rx="14" ry="14" fill="none" stroke="#E8ECF0" stroke-width="1"/>
  </g>

  <!-- 底部資訊內容 -->
  <text x="300" y="312" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#34495E">複習小貼士</text>
  <text x="300" y="335" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#7F8C8D">由「數」到「量」，再到「圖形」與「方程」，循序漸進</text>
  <text x="300" y="355" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#7F8C8D">每個站點完成後，記得在檢查點打勾 ✓</text>

  <!-- 裝飾性小圓點 -->
  <circle cx="140" cy="285" r="3" fill="#4A90D9" opacity="0.3"/>
  <circle cx="460" cy="285" r="3" fill="#9B59B6" opacity="0.3"/>
</svg>