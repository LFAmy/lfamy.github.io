<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="50%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>

    <!-- 卡片主體漸層（多層3-stop） -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#E8F0FE"/>
    </linearGradient>

    <!-- 三角形填充漸層（5-stop多層漸變） -->
    <linearGradient id="triangleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="25%" stop-color="#5BA0E8"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="75%" stop-color="#2E6ABF"/>
      <stop offset="100%" stop-color="#1E5AAA"/>
    </linearGradient>

    <!-- 放射漸層3D光影 -->
    <radialGradient id="lightEffect" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 陰影濾鏡（雙層陰影） -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.10)"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="rgba(0,0,0,0.06)"/>
    </filter>

    <!-- 小陰影 -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 文字陰影 -->
    <filter id="textShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 圓角卡片 -->
  <rect x="30" y="25" width="540" height="350" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>

  <!-- 標題 -->
  <text x="300" y="70" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', 'PingFang TC', sans-serif" font-size="24" font-weight="700" fill="#2C3E50" filter="url(#textShadow)">直角三角形 · 勾股定理 3-4-5</text>

  <!-- 裝飾線 -->
  <line x1="180" y1="82" x2="420" y2="82" stroke="url(#triangleGrad)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- 三角形區域 -->
  <g transform="translate(120, 140)">
    <!-- 直角標記 -->
    <rect x="0" y="0" width="28" height="28" fill="none" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round" rx="3"/>
    <polygon points="0,0 10,0 0,10" fill="#E74C3C" opacity="0.25"/>

    <!-- 三角形本體（3-4-5直角三角形） -->
    <!-- 垂直邊（高）= 180px，水平邊（底）= 240px -->
    <polygon points="0,0 0,180 240,0" fill="url(#triangleGrad)" stroke="#1E5AAA" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 放射3D光影 -->
    <polygon points="0,0 0,180 240,0" fill="url(#lightEffect)"/>

    <!-- 邊長標示 -->
    <!-- 垂直邊（3） -->
    <line x1="-18" y1="90" x2="-8" y2="90" stroke="#E67E22" stroke-width="2"/>
    <text x="-28" y="95" text-anchor="end" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#E67E22">3</text>

    <!-- 水平邊（4） -->
    <line x1="120" y1="192" x2="120" y2="202" stroke="#E67E22" stroke-width="2"/>
    <text x="120" y="218" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#E67E22">4</text>

    <!-- 斜邊（5） -->
    <text x="132" y="80" transform="rotate(-37, 132, 80)" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="16" font-weight="700" fill="#E67E22">5</text>

    <!-- 直角符號 -->
    <text x="8" y="22" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="13" font-weight="700" fill="#E74C3C">90°</text>

    <!-- 頂點標籤 -->
    <circle cx="0" cy="0" r="4" fill="#1E5AAA"/>
    <text x="-10" y="-10" text-anchor="end" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#2C3E50">A</text>

    <circle cx="0" cy="180" r="4" fill="#1E5AAA"/>
    <text x="-10" y="195" text-anchor="end" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#2C3E50">B</text>

    <circle cx="240" cy="0" r="4" fill="#1E5AAA"/>
    <text x="250" y="-10" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#2C3E50">C</text>
  </g>

  <!-- 公式區域 -->
  <g transform="translate(380, 150)">
    <!-- 公式卡片背景 -->
    <rect x="0" y="0" width="165" height="190" rx="14" ry="14" fill="white" filter="url(#softShadow)" stroke="#E8EDF2" stroke-width="1"/>

    <!-- 勾股定理 -->
    <text x="82" y="32" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#2C3E50">勾股定理</text>
    <line x1="25" y1="42" x2="140" y2="42" stroke="#4A90D9" stroke-width="1.5" opacity="0.4"/>

    <text x="82" y="65" text-anchor="middle" font-family="'Times New Roman', serif" font-size="18" font-weight="700" fill="#2E6ABF">a² + b² = c²</text>

    <text x="82" y="90" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="13" fill="#555">
      <tspan font-weight="700" fill="#E67E22">3² + 4² = 5²</tspan>
    </text>

    <text x="82" y="112" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="12" fill="#777">9 + 16 = 25 ✓</text>

    <!-- 面積公式 -->
    <line x1="25" y1="125" x2="140" y2="125" stroke="#4A90D9" stroke-width="1.5" opacity="0.4"/>

    <text x="82" y="148" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#2C3E50">面積公式</text>

    <text x="82" y="175" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" font-weight="700" fill="#2E6ABF">A = (a × b) ÷ 2</text>

    <text x="82" y="198" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="13" fill="#555">
      <tspan font-weight="700" fill="#E67E22">= (3 × 4) ÷ 2 = 6</tspan>
    </text>
  </g>

  <!-- 底部裝飾資訊 -->
  <g transform="translate(0, 0)">
    <rect x="55" y="330" width="490" height="30" rx="10" ry="10" fill="rgba(74,144,217,0.08)"/>
    <text x="300" y="350" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', sans-serif" font-size="12" fill="#5A7A9A">直角三角形 · 直角邊為 3 和 4 · 斜邊為 5 · 面積 = 6 平方單位</text>
  </g>
</svg>