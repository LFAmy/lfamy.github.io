<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#dce3f5"/>
    </radialGradient>

    <!-- L形主體漸變（藍色系） -->
    <linearGradient id="lShapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="50%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#2b5fa8"/>
    </linearGradient>

    <!-- L形光影效果1 -->
    <linearGradient id="lShapeLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.2)"/>
    </linearGradient>

    <!-- T形主體漸變（橙色系） -->
    <linearGradient id="tShapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="50%" stop-color="#e8912a"/>
      <stop offset="100%" stop-color="#d4781f"/>
    </linearGradient>

    <!-- T形光影效果 -->
    <linearGradient id="tShapeLight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
    </linearGradient>

    <!-- L形分割區A（淺藍） -->
    <linearGradient id="partAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6db3f2"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>

    <!-- L形分割區B（深藍） -->
    <linearGradient id="partBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a9de0"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>

    <!-- T形分割區C（淺橙） -->
    <linearGradient id="partCGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>

    <!-- T形分割區D（深橙） -->
    <linearGradient id="partDGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d4781f"/>
    </linearGradient>

    <!-- 陰影濾鏡（雙層陰影） -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.25)"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.2)"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="4" flood-color="rgba(0,0,0,0.05)"/>
    </filter>

    <!-- 內部發光 -->
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feFlood flood-color="rgba(255,255,255,0.3)"/>
      <feComposite operator="in" in2="blur"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- 放射漸變高光 -->
    <radialGradient id="highlightL" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <radialGradient id="highlightT" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 虛線樣式 -->
    <style>
      .dashed-line {
        stroke: rgba(255,255,255,0.6);
        stroke-width: 1.5;
        stroke-dasharray: 6 4;
        fill: none;
      }
      .dim-label {
        font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        font-size: 13px;
        font-weight: bold;
        fill: #2c3e50;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .dim-label-light {
        font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        font-size: 13px;
        font-weight: bold;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
        text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      }
      .title-text {
        font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        font-size: 20px;
        font-weight: bold;
        fill: #1a2a4a;
        text-anchor: middle;
      }
      .subtitle-text {
        font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        fill: #4a6a8a;
        text-anchor: middle;
      }
      .legend-text {
        font-family: 'Arial', 'Microsoft YaHei', sans-serif;
        font-size: 12px;
        fill: #2c3e50;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="18" ry="18" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="30" fill="rgba(74,144,217,0.06)"/>
  <circle cx="550" cy="350" r="40" fill="rgba(245,166,35,0.06)"/>
  <circle cx="520" cy="60" r="25" fill="rgba(74,144,217,0.04)"/>
  <circle cx="80" cy="340" r="35" fill="rgba(245,166,35,0.04)"/>

  <!-- 標題區域 -->
  <text x="300" y="32" class="title-text">📐 複合圖形面積分解</text>
  <text x="300" y="52" class="subtitle-text">L形 + T形 · 分割為長方形 · 顏色分區</text>

  <!-- ==================== L 形（左側） ==================== -->
  <g filter="url(#cardShadow)">
    <!-- L形卡片背景 -->
    <rect x="25" y="72" width="260" height="300" rx="14" ry="14" fill="#ffffff" opacity="0.85"/>

    <!-- L形標題 -->
    <text x="155" y="98" class="dim-label" fill="#2c5a8a">L 形</text>

    <!-- L形本體 -->
    <g filter="url(#doubleShadow)">
      <!-- L形主體 -->
      <path d="M 55 120 L 55 310 L 195 310 L 195 250 L 115 250 L 115 120 Z"
            fill="url(#lShapeGrad)" stroke="#2b5fa8" stroke-width="1.5"/>

      <!-- L形光影圖層 -->
      <path d="M 55 120 L 55 310 L 195 310 L 195 250 L 115 250 L 115 120 Z"
            fill="url(#lShapeLight)"/>

      <!-- L形放射高光 -->
      <path d="M 55 120 L 55 310 L 195 310 L 195 250 L 115 250 L 115 120 Z"
            fill="url(#highlightL)"/>
    </g>

    <!-- 分割區 A（上方橫條） -->
    <path d="M 55 120 L 55 185 L 195 185 L 195 120 Z"
          fill="url(#partAGrad)" opacity="0.3" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

    <!-- 分割區 B（下方豎條） -->
    <path d="M 115 185 L 115 310 L 195 310 L 195 185 Z"
          fill="url(#partBGrad)" opacity="0.3" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

    <!-- 分割虛線 -->
    <line x1="55" y1="185" x2="195" y2="185" class="dashed-line"/>
    <line x1="115" y1="120" x2="115" y2="310" class="dashed-line"/>

    <!-- 尺寸標註 A -->
    <text x="125" y="155" class="dim-label-light" font-size="14">A</text>
    <text x="155" y="248" class="dim-label-light" font-size="14">B</text>

    <!-- 尺寸數字 -->
    <text x="125" y="110" class="dim-label" font-size="11" fill="#ffffff">8 cm</text>
    <text x="205" y="220" class="dim-label" font-size="11" fill="#2b5fa8">6 cm</text>
    <text x="85" y="330" class="dim-label" font-size="11" fill="#2b5fa8">10 cm</text>
    <text x="45" y="218" class="dim-label" font-size="11" fill="#2b5fa8">4 cm</text>

    <!-- 圖例 -->
    <rect x="55" y="345" width="12" height="12" rx="2" fill="url(#partAGrad)" opacity="0.7"/>
    <text x="72" y="353" class="legend-text">區域 A（橫）</text>
    <rect x="155" y="345" width="12" height="12" rx="2" fill="url(#partBGrad)" opacity="0.7"/>
    <text x="172" y="353" class="legend-text">區域 B（豎）</text>
  </g>

  <!-- ==================== T 形（右側） ==================== -->
  <g filter="url(#cardShadow)">
    <!-- T形卡片背景 -->
    <rect x="315" y="72" width="260" height="300" rx="14" ry="14" fill="#ffffff" opacity="0.85"/>

    <!-- T形標題 -->
    <text x="445" y="98" class="dim-label" fill="#8a5a1a">T 形</text>

    <!-- T形本體 -->
    <g filter="url(#doubleShadow)">
      <!-- T形主體 -->
      <path d="M 345 120 L 345 180 L 405 180 L 405 310 L 485 310 L 485 180 L 545 180 L 545 120 Z"
            fill="url(#tShapeGrad)" stroke="#d4781f" stroke-width="1.5"/>

      <!-- T形光影圖層 -->
      <path d="M 345 120 L 345 180 L 405 180 L 405 310 L 485 310 L 485 180 L 545 180 L 545 120 Z"
            fill="url(#tShapeLight)"/>

      <!-- T形放射高光 -->
      <path d="M 345 120 L 345 180 L 405 180 L 405 310 L 485 310 L 485 180 L 545 180 L 545 120 Z"
            fill="url(#highlightT)"/>
    </g>

    <!-- 分割區 C（上方橫條） -->
    <path d="M 345 120 L 345 180 L 545 180 L 545 120 Z"
          fill="url(#partCGrad)" opacity="0.3" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

    <!-- 分割區 D（下方豎條） -->
    <path d="M 405 180 L 405 310 L 485 310 L 485 180 Z"
          fill="url(#partDGrad)" opacity="0.3" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

    <!-- 分割虛線 -->
    <line x1="345" y1="180" x2="545" y2="180" class="dashed-line"/>
    <line x1="405" y1="120" x2="405" y2="310" class="dashed-line"/>
    <line x1="485" y1="120" x2="485" y2="310" class="dashed-line"/>

    <!-- 尺寸標註 -->
    <text x="445" y="152" class="dim-label-light" font-size="14">C</text>
    <text x="445" y="248" class="dim-label-light" font-size="14">D</text>

    <!-- 尺寸數字 -->
    <text x="445" y="110" class="dim-label" font-size="11" fill="#ffffff">12 cm</text>
    <text x="395" y="248" class="dim-label" font-size="11" fill="#d4781f">8 cm</text>
    <text x="495" y="248" class="dim-label" font-size="11" fill="#d4781f">8 cm</text>
    <text x="445" y="330" class="dim-label" font-size="11" fill="#d4781f">10 cm</text>
    <text x="335" y="152" class="dim-label" font-size="11" fill="#d4781f">4 cm</text>
    <text x="555" y="152" class="dim-label" font-size="11" fill="#d4781f">4 cm</text>

    <!-- 圖例 -->
    <rect x="345" y="345" width="12" height="12" rx="2" fill="url(#partCGrad)" opacity="0.7"/>
    <text x="362" y="353" class="legend-text">區域 C（橫）</text>
    <rect x="455" y="345" width="12" height="12" rx="2" fill="url(#partDGrad)" opacity="0.7"/>
    <text x="472" y="353" class="legend-text">區域 D（豎）</text>
  </g>

  <!-- 底部提示 -->
  <text x="300" y="388" class="legend-text" font-size="11" fill="#6a8aaa" text-anchor="middle">
    💡 將複合圖形分割為多個長方形，分別計算面積後相加
  </text>
</svg>