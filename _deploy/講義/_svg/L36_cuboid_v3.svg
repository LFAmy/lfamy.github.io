<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f0fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0eaf5;stop-opacity:1" />
    </linearGradient>

    <!-- 長方體A - 頂面漸變（藍色系） -->
    <linearGradient id="topA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a7de1;stop-opacity:1" />
    </linearGradient>
    <!-- 長方體A - 正面漸變 -->
    <linearGradient id="frontA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d8ef5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5fc7;stop-opacity:1" />
    </linearGradient>
    <!-- 長方體A - 側面漸變 -->
    <linearGradient id="sideA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a7de1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f4a9e;stop-opacity:1" />
    </linearGradient>

    <!-- 長方體B - 頂面漸變（橙色系） -->
    <linearGradient id="topB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e42;stop-opacity:1" />
    </linearGradient>
    <!-- 長方體B - 正面漸變 -->
    <linearGradient id="frontB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4851a;stop-opacity:1" />
    </linearGradient>
    <!-- 長方體B - 側面漸變 -->
    <linearGradient id="sideB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8951e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b06d12;stop-opacity:1" />
    </linearGradient>

    <!-- 組合體 - 頂面漸變（紫色系） -->
    <linearGradient id="topC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <!-- 組合體 - 正面漸變 -->
    <linearGradient id="frontC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <!-- 組合體 - 側面漸變 -->
    <linearGradient id="sideC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
    </linearGradient>

    <!-- 放射漸變用於高光 -->
    <radialGradient id="glossA" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glossB" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glossC" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="shadow1" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 圓角卡片濾鏡 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 等號圓形背景 -->
    <radialGradient id="equalBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e42;stop-opacity:1" />
    </radialGradient>

    <!-- 加號圓形背景 -->
    <radialGradient id="plusBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a7de1;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16" ry="16"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="22" font-weight="bold" fill="#2c3e50" letter-spacing="2">
    長方體複合體積
  </text>
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" fill="#7f8c8d" letter-spacing="1">
    組合體積 = 各自體積相加
  </text>

  <!-- ============ 第一部分：長方體 A ============ -->
  <g filter="url(#shadow1)">
    <!-- 卡片背景 -->
    <rect x="25" y="75" width="160" height="145" rx="12" ry="12" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- 長方體 A 3D 圖形 -->
  <g transform="translate(55, 100)">
    <!-- 頂面 -->
    <polygon points="0,50 50,25 100,50 50,75" fill="url(#topA)" stroke="#1a5fc7" stroke-width="0.5"/>
    <!-- 正面 -->
    <polygon points="0,50 0,110 50,135 50,75" fill="url(#frontA)" stroke="#1a5fc7" stroke-width="0.5"/>
    <!-- 側面 -->
    <polygon points="50,75 50,135 100,110 100,50" fill="url(#sideA)" stroke="#1a5fc7" stroke-width="0.5"/>
    <!-- 高光 -->
    <polygon points="0,50 50,25 100,50 50,75" fill="url(#glossA)"/>
    <polygon points="0,50 0,110 50,135 50,75" fill="url(#glossA)"/>
  </g>

  <!-- 標籤 A -->
  <text x="105" y="255" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="15" font-weight="bold" fill="#1a5fc7">
    長方體 A
  </text>
  <text x="105" y="272" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="12" fill="#4a6fa5">
    體積 = 長 × 寬 × 高
  </text>

  <!-- ============ 加號 ============ -->
  <g filter="url(#cardShadow)">
    <circle cx="210" cy="160" r="18" fill="url(#plusBg)"/>
  </g>
  <text x="210" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">+</text>

  <!-- ============ 第二部分：長方體 B ============ -->
  <g filter="url(#shadow1)">
    <rect x="245" y="75" width="160" height="145" rx="12" ry="12" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- 長方體 B 3D 圖形 -->
  <g transform="translate(275, 100)">
    <!-- 頂面 -->
    <polygon points="0,50 50,25 100,50 50,75" fill="url(#topB)" stroke="#d4851a" stroke-width="0.5"/>
    <!-- 正面 -->
    <polygon points="0,50 0,110 50,135 50,75" fill="url(#frontB)" stroke="#d4851a" stroke-width="0.5"/>
    <!-- 側面 -->
    <polygon points="50,75 50,135 100,110 100,50" fill="url(#sideB)" stroke="#d4851a" stroke-width="0.5"/>
    <!-- 高光 -->
    <polygon points="0,50 50,25 100,50 50,75" fill="url(#glossB)"/>
    <polygon points="0,50 0,110 50,135 50,75" fill="url(#glossB)"/>
  </g>

  <!-- 標籤 B -->
  <text x="325" y="255" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="15" font-weight="bold" fill="#d4851a">
    長方體 B
  </text>
  <text x="325" y="272" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="12" fill="#b07a3a">
    體積 = 長 × 寬 × 高
  </text>

  <!-- ============ 等號 ============ -->
  <g filter="url(#cardShadow)">
    <circle cx="430" cy="160" r="18" fill="url(#equalBg)"/>
  </g>
  <text x="430" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">=</text>

  <!-- ============ 第三部分：組合體 C ============ -->
  <g filter="url(#shadow1)">
    <rect x="460" y="75" width="120" height="145" rx="12" ry="12" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- 組合體 C 3D 圖形（兩個長方體疊加） -->
  <g transform="translate(475, 95)">
    <!-- 下方長方體（紫色） -->
    <!-- 頂面 -->
    <polygon points="0,40 40,20 80,40 40,60" fill="url(#topC)" stroke="#7c3aed" stroke-width="0.5"/>
    <!-- 正面 -->
    <polygon points="0,40 0,90 40,110 40,60" fill="url(#frontC)" stroke="#7c3aed" stroke-width="0.5"/>
    <!-- 側面 -->
    <polygon points="40,60 40,110 80,90 80,40" fill="url(#sideC)" stroke="#7c3aed" stroke-width="0.5"/>

    <!-- 上方長方體（紫色，較小） -->
    <!-- 頂面 -->
    <polygon points="10,20 40,5 70,20 40,35" fill="url(#topC)" stroke="#7c3aed" stroke-width="0.5"/>
    <!-- 正面 -->
    <polygon points="10,20 10,55 40,70 40,35" fill="url(#frontC)" stroke="#7c3aed" stroke-width="0.5"/>
    <!-- 側面 -->
    <polygon points="40,35 40,70 70,55 70,20" fill="url(#sideC)" stroke="#7c3aed" stroke-width="0.5"/>

    <!-- 高光 -->
    <polygon points="0,40 40,20 80,40 40,60" fill="url(#glossC)"/>
    <polygon points="0,40 0,90 40,110 40,60" fill="url(#glossC)"/>
    <polygon points="10,20 40,5 70,20 40,35" fill="url(#glossC)"/>
    <polygon points="10,20 10,55 40,70 40,35" fill="url(#glossC)"/>
  </g>

  <!-- 標籤 C -->
  <text x="520" y="255" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">
    組合體
  </text>
  <text x="520" y="272" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="12" fill="#6d4fa0">
    A + B
  </text>

  <!-- ============ 底部公式 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="295" width="400" height="80" rx="14" ry="14" fill="#ffffff" opacity="0.9"/>
  </g>

  <text x="300" y="328" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">
    V<span font-size="11" baseline-shift="sub">組合</span>
    <tspan fill="#1a5fc7" font-weight="bold"> = V</tspan><tspan fill="#1a5fc7" font-size="11" baseline-shift="sub">A</tspan>
    <tspan fill="#d4851a" font-weight="bold"> + V</tspan><tspan fill="#d4851a" font-size="11" baseline-shift="sub">B</tspan>
  </text>

  <text x="300" y="355" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" fill="#7f8c8d">
    長方體複合體積 = 各部分體積之和
  </text>

  <!-- 裝飾小點 -->
  <circle cx="50" cy="370" r="3" fill="#4facfe" opacity="0.4"/>
  <circle cx="550" cy="370" r="3" fill="#fbbf6a" opacity="0.4"/>
  <circle cx="300" cy="385" r="2" fill="#c084fc" opacity="0.3"/>
</svg>