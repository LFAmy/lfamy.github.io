<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1ecf1;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#2c3e50" flood-opacity="0.25"/>
    </filter>

    <!-- 量杯外壁漸變（玻璃效果） -->
    <linearGradient id="beakerOuter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8d4e3;stop-opacity:0.7" />
      <stop offset="15%" style="stop-color:#e8f4fc;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="85%" style="stop-color:#e8f4fc;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#a0c4d8;stop-opacity:0.7" />
    </linearGradient>

    <!-- 量杯內壁漸變 -->
    <linearGradient id="beakerInner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d0e6f2;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#f0f8ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#c8dce8;stop-opacity:0.3" />
    </linearGradient>

    <!-- 水量漸變（藍色） -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5dade2;stop-opacity:0.7" />
      <stop offset="40%" style="stop-color:#3498db;stop-opacity:0.65" />
      <stop offset="100%" style="stop-color:#2e86c1;stop-opacity:0.8" />
    </linearGradient>

    <!-- 水量上升後漸變 -->
    <linearGradient id="waterGradRisen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5dade2;stop-opacity:0.75" />
      <stop offset="30%" style="stop-color:#3498db;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#2471a3;stop-opacity:0.85" />
    </linearGradient>

    <!-- 水面反射漸變 -->
    <radialGradient id="waterSurface" cx="40%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#aed6f1;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#85c1e9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#5dade2;stop-opacity:0.1" />
    </radialGradient>

    <!-- 石頭漸變 -->
    <radialGradient id="stoneGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#95a5a6;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#7f8c8d;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#6c7a7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d6d6e;stop-opacity:1" />
    </radialGradient>

    <!-- 石頭高光 -->
    <radialGradient id="stoneHighlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" style="stop-color:#bdc3c7;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:0" />
    </radialGradient>

    <!-- 石頭影子 -->
    <filter id="stoneShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#2c3e50" flood-opacity="0.35"/>
    </filter>

    <!-- 量杯陰影 -->
    <filter id="beakerShadow" x="-10%" y="-5%" width="130%" height="120%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#1a252f" flood-opacity="0.3"/>
    </filter>

    <!-- 雙層陰影（卡片） -->
    <filter id="doubleShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1a252f" flood-opacity="0.2"/>
      <feDropShadow dx="5" dy="7" stdDeviation="8" flood-color="#1a252f" flood-opacity="0.15"/>
    </filter>

    <!-- 刻度線樣式 -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:0.3" />
    </linearGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5276" />
      <stop offset="50%" style="stop-color:#2e86c1" />
      <stop offset="100%" style="stop-color:#1a5276" />
    </linearGradient>

    <!-- 放射漸變背景裝飾 -->
    <radialGradient id="radialDecor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="16" ry="16" fill="url(#bgGrad)"/>
  <rect width="600" height="400" rx="16" ry="16" fill="url(#radialDecor)"/>

  <!-- 圓角卡片背景 -->
  <rect x="15" y="15" width="570" height="370" rx="14" ry="14" fill="#ffffff" filter="url(#doubleShadow)" opacity="0.95"/>
  <rect x="15" y="15" width="570" height="370" rx="14" ry="14" fill="none" stroke="#d5e8ed" stroke-width="1.5"/>

  <!-- 標題 -->
  <text x="300" y="48" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)">📐 體積排水法 1 — 石頭體積 = 水位上升</text>

  <!-- 裝飾線 -->
  <line x1="80" y1="58" x2="520" y2="58" stroke="#d5e8ed" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ==================== 左圖：量杯 + 石頭入水前 ==================== -->

  <!-- 左圖標籤 -->
  <rect x="55" y="72" width="100" height="26" rx="13" fill="#eaf2f8" stroke="#aed6f1" stroke-width="1"/>
  <text x="105" y="90" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" fill="#2c3e50" font-weight="bold">① 入水前</text>

  <!-- 量杯本體（左） -->
  <g filter="url(#beakerShadow)">
    <!-- 量杯外壁 -->
    <path d="M 120 100 L 115 310 Q 115 320 125 320 L 195 320 Q 205 320 205 310 L 200 100 Z" fill="url(#beakerOuter)" stroke="#7fb3d0" stroke-width="1.5"/>

    <!-- 量杯內壁 -->
    <path d="M 125 105 L 120 308 Q 120 316 128 316 L 192 316 Q 200 316 200 308 L 195 105 Z" fill="url(#beakerInner)"/>

    <!-- 水量（入水前，水位較低） -->
    <path d="M 122 260 L 120 308 Q 120 316 128 316 L 192 316 Q 200 316 200 308 L 198 260 Z" fill="url(#waterGrad)"/>

    <!-- 水面 -->
    <ellipse cx="160" cy="260" rx="39" ry="5" fill="url(#waterSurface)"/>

    <!-- 刻度線 -->
    <line x1="205" y1="140" x2="215" y2="140" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="218" y="144" font-family="Arial" font-size="9" fill="#5d6d7e">400</text>

    <line x1="205" y1="180" x2="215" y2="180" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="218" y="184" font-family="Arial" font-size="9" fill="#5d6d7e">300</text>

    <line x1="205" y1="220" x2="215" y2="220" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="218" y="224" font-family="Arial" font-size="9" fill="#5d6d7e">200</text>

    <line x1="205" y1="260" x2="215" y2="260" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="218" y="264" font-family="Arial" font-size="9" fill="#5d6d7e">100</text>

    <line x1="205" y1="300" x2="215" y2="300" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="218" y="304" font-family="Arial" font-size="9" fill="#5d6d7e">0</text>

    <!-- 量杯邊緣高光 -->
    <path d="M 122 105 L 120 308 Q 120 316 128 316" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- 左圖水位標示 -->
  <line x1="80" y1="260" x2="115" y2="260" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="78" y="257" text-anchor="end" font-family="Arial" font-size="10" fill="#e74c3c" font-weight="bold">100mL</text>

  <!-- ==================== 右圖：量杯 + 石頭入水後 ==================== -->

  <!-- 右圖標籤 -->
  <rect x="395" y="72" width="100" height="26" rx="13" fill="#eafaf1" stroke="#82e0aa" stroke-width="1"/>
  <text x="445" y="90" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" fill="#2c3e50" font-weight="bold">② 入水後</text>

  <!-- 量杯本體（右） -->
  <g filter="url(#beakerShadow)">
    <!-- 量杯外壁 -->
    <path d="M 400 100 L 395 310 Q 395 320 405 320 L 475 320 Q 485 320 485 310 L 480 100 Z" fill="url(#beakerOuter)" stroke="#7fb3d0" stroke-width="1.5"/>

    <!-- 量杯內壁 -->
    <path d="M 405 105 L 400 308 Q 400 316 408 316 L 472 316 Q 480 316 480 308 L 475 105 Z" fill="url(#beakerInner)"/>

    <!-- 水量（入水後，水位上升） -->
    <path d="M 402 210 L 400 308 Q 400 316 408 316 L 472 316 Q 480 316 480 308 L 478 210 Z" fill="url(#waterGradRisen)"/>

    <!-- 水面（入水後） -->
    <ellipse cx="440" cy="210" rx="39" ry="5" fill="url(#waterSurface)"/>

    <!-- 石頭（在水中） -->
    <g filter="url(#stoneShadow)">
      <path d="M 425 280 Q 430 265 440 260 Q 450 258 455 265 Q 460 275 455 285 Q 448 295 438 293 Q 428 290 425 280 Z" fill="url(#stoneGrad)"/>
      <path d="M 425 280 Q 430 265 440 260 Q 450 258 455 265 Q 460 275 455 285 Q 448 295 438 293 Q 428 290 425 280 Z" fill="url(#stoneHighlight)"/>
      <!-- 石頭紋理 -->
      <path d="M 432 272 Q 438 268 445 270" fill="none" stroke="#5d6d6e" stroke-width="0.8" opacity="0.4"/>
      <path d="M 430 282 Q 436 285 442 283" fill="none" stroke="#5d6d6e" stroke-width="0.8" opacity="0.3"/>
    </g>

    <!-- 刻度線 -->
    <line x1="485" y1="140" x2="495" y2="140" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="498" y="144" font-family="Arial" font-size="9" fill="#5d6d7e">400</text>

    <line x1="485" y1="180" x2="495" y2="180" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="498" y="184" font-family="Arial" font-size="9" fill="#5d6d7e">300</text>

    <line x1="485" y1="220" x2="495" y2="220" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="498" y="224" font-family="Arial" font-size="9" fill="#5d6d7e">200</text>

    <line x1="485" y1="260" x2="495" y2="260" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="498" y="264" font-family="Arial" font-size="9" fill="#5d6d7e">100</text>

    <line x1="485" y1="300" x2="495" y2="300" stroke="url(#scaleGrad)" stroke-width="1.2"/>
    <text x="498" y="304" font-family="Arial" font-size="9" fill="#5d6d7e">0</text>

    <!-- 量杯邊緣高光 -->
    <path d="M 402 105 L 400 308 Q 400 316 408 316" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- 右圖水位標示 -->
  <line x1="360" y1="210" x2="395" y2="210" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="358" y="207" text-anchor="end" font-family="Arial" font-size="10" fill="#e74c3c" font-weight="bold">250mL</text>

  <!-- 右圖原水位標示（虛線） -->
  <line x1="360" y1="260" x2="395" y2="260" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <text x="358" y="257" text-anchor="end" font-family="Arial" font-size="9" fill="#e74c3c" opacity="0.6">原水位</text>

  <!-- ==================== 中間：箭頭 + 公式 ==================== -->

  <!-- 箭頭 -->
  <g>
    <!-- 箭頭主體 -->
    <line x1="280" y1="200" x2="340" y2="200" stroke="#2c3e50" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 箭頭頭部 -->
    <polygon points="340,200 328,192 328,208" fill="#2c3e50"/>
  </g>

  <!-- 公式區域 -->
  <rect x="265" y="130" width="90" height="55" rx="10" fill="#fef9e7" stroke="#f9e79f" stroke-width="1.5" filter="url(#cardShadow)"/>

  <text x="310" y="150" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="11" fill="#7d6608">體積 =</text>
  <text x="310" y="170" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="12" fill="#d35400" font-weight="bold">250 − 100</text>
  <line x1="280" y1="176" x2="340" y2="176" stroke="#f9e79f" stroke-width="1"/>
  <text x="310" y="188" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="11" fill="#d35400" font-weight="bold">= 150 mL</text>

  <!-- 結果標示 -->
  <rect x="265" y="310" width="90" height="28" rx="14" fill="#d4efdf" stroke="#82e0aa" stroke-width="1.5"/>
  <text x="310" y="329" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" fill="#1e8449" font-weight="bold">石頭 = 150cm³</text>

  <!-- 裝飾小圖示：石頭 -->
  <g transform="translate(310, 295)">
    <path d="M -8 5 Q -5 -3 0 -5 Q 5 -4 8 2 Q 9 8 4 10 Q -2 11 -8 5 Z" fill="#95a5a6" opacity="0.6"/>
  </g>

  <!-- ==================== 底部說明 ==================== -->
  <rect x="40" y="350" width="520" height="28" rx="8" fill="#eaf2f8" stroke="#d5e8ed" stroke-width="1"/>
  <text x="300" y="369" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="12" fill="#2c3e50">
    💡 石頭體積 = 水位上升的體積 = 250mL − 100mL = <tspan fill="#d35400" font-weight="bold">150cm³</tspan>
  </text>

</svg>