<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="gradSuccess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F9FAFB"/>
  <!-- 标题 -->
  <text x="300" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F2937">多位數認識與位值表</text>
  <text x="300" y="75" text-anchor="middle" font-size="16" fill="#4B5563">適用於小學五年級 | 數字讀寫與位值概念</text>
  <!-- 左側：數字塔視覺化 -->
  <g transform="translate(140, 100)">
    <rect x="0" y="0" width="200" height="280" rx="12" fill="white" stroke="#E5E7EB" filter="url(#shadow)"/>
    <text x="100" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#4F46E5">數字塔：53, 492</text>
    <!-- 塔結構 -->
    <g transform="translate(100, 60)">
      <rect x="-40" y="0" width="80" height="40" rx="8" fill="url(#gradMain)" filter="url(#shadow)"/>
      <text x="0" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="white">5</text>
      <text x="0" y="55" text-anchor="middle" font-size="12" fill="#6B7280">萬位</text>
      
      <rect x="-40" y="65" width="80" height="40" rx="8" fill="url(#gradAccent)" filter="url(#shadow)"/>
      <text x="0" y="93" text-anchor="middle" font-size="18" font-weight="bold" fill="white">3</text>
      <text x="0" y="120" text-anchor="middle" font-size="12" fill="#6B7280">千位</text>
      
      <rect x="-40" y="130" width="80" height="40" rx="8" fill="url(#gradSuccess)" filter="url(#shadow)"/>
      <text x="0" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="white">4</text>
      <text x="0" y="185" text-anchor="middle" font-size="12" fill="#6B7280">百位</text>
      
      <rect x="-40" y="195" width="80" height="40" rx="8" fill="#8B5CF6" filter="url(#shadow)"/>
      <text x="0" y="223" text-anchor="middle" font-size="18" font-weight="bold" fill="white">9</text>
      <text x="0" y="250" text-anchor="middle" font-size="12" fill="#6B7280">十位</text>
      
      <rect x="-40" y="260" width="80" height="40" rx="8" fill="#EC4899" filter="url(#shadow)"/>
      <text x="0" y="288" text-anchor="middle" font-size="18" font-weight="bold" fill="white">2</text>
      <text x="0" y="315" text-anchor="middle" font-size="12" fill="#6B7280">個位</text>
    </g>
    <!-- 連接箭頭 -->
    <path d="M 200,180 L 220,180" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  <!-- 右側：位值表與教學要點 -->
  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="220" height="280" rx="12" fill="white" stroke="#E5E7EB" filter="url(#shadow)"/>
    <text x="110" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">位值表分解</text>
    <!-- 表格 -->
    <g transform="translate(10, 50)">
      <rect x="0" y="0" width="200" height="35" rx="6" fill="#F3F4F6"/>
      <text x="35" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#4F46E5">萬</text>
      <text x="75" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B">千</text>
      <text x="115" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#10B981">百</text>
      <text x="155" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#8B5CF6">十</text>
      <text x="190" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#EC4899">個</text>
      
      <rect x="0" y="45" width="200" height="35" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="35" y="68" text-anchor="middle" font-size="16" fill="#1E40AF">5</text>
      <text x="75" y="68" text-anchor="middle" font-size="16" fill="#92400E">3</text>
      <text x="115" y="68" text-anchor="middle" font-size="16" fill="#065F46">4</text>
      <text x="155" y="68" text-anchor="middle" font-size="16" fill="#5B21B6">9</text>
      <text x="190" y="68" text-anchor="middle" font-size="16" fill="#9D174D">2</text>
    </g>
    <!-- 要點框 -->
    <g transform="translate(10, 140)">
      <rect x="0" y="0" width="200" height="130" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
      <text x="100" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">讀寫要點</text>
      <text x="15" y="50" font-size="13" fill="#15803D">• 讀數：從高到低</text>
      <text x="25" y="70" font-size="13" fill="#15803D">五萬三千四百九十二</text>
      <text x="15" y="95" font-size="13" fill="#15803D">• 寫數：注意零的位置</text>
      <text x="15" y="115" font-size="13" fill="#15803D">• 位值：每個數字的價值</text>
    </g>
    <!-- 示例氣泡 -->
    <g transform="translate(30, 290)">
      <path d="M0,0 L150,0 Q160,0 160,10 L160,35 Q160,45 150,45 L40,45 L30,55 L30,45 L0,45 Q-10,45 -10,35 L-10,10 Q-10,0 0,0Z" fill="#FFFBEB" stroke="#FDE68A" filter="url(#shadow)"/>
      <text x="75" y="20" text-anchor="middle" font-size="12" fill="#92400E">練習：寫出 60, 215</text>
      <text x="75" y="38" text-anchor="middle" font-size="12" fill="#92400E">各數字的位值</text>
    </g>
  </g>
  <!-- 底部裝飾 -->
  <text x="300" y="395" text-anchor="middle" font-size="12" fill="#9CA3AF">© 數學教材設計 | 香港小學課程</text>
</svg>