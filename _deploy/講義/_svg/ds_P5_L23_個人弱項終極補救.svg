<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </radialGradient>

    <!-- 卡片1：錯題 - 紅色系 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#EE5A24"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>
    <radialGradient id="card1Shine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D63031" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D63031" flood-opacity="0.15"/>
    </filter>

    <!-- 卡片2：根因 - 藍色系 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74B9FF"/>
      <stop offset="50%" stop-color="#0984E3"/>
      <stop offset="100%" stop-color="#0652DD"/>
    </linearGradient>
    <radialGradient id="card2Shine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0984E3" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0984E3" flood-opacity="0.15"/>
    </filter>

    <!-- 卡片3：對策 - 綠色系 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55EFC4"/>
      <stop offset="50%" stop-color="#00B894"/>
      <stop offset="100%" stop-color="#006266"/>
    </linearGradient>
    <radialGradient id="card3Shine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00B894" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00B894" flood-opacity="0.15"/>
    </filter>

    <!-- 箭頭漸變 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D63031"/>
      <stop offset="50%" stop-color="#0984E3"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>

    <!-- 循環箭頭背景光暈 -->
    <radialGradient id="cycleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(9,132,227,0.12)"/>
      <stop offset="100%" stop-color="rgba(9,132,227,0)"/>
    </radialGradient>

    <!-- 圖標陰影 -->
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- 標題光澤 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D3436"/>
      <stop offset="50%" stop-color="#636E72"/>
      <stop offset="100%" stop-color="#2D3436"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC" rx="0"/>
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 標題 -->
  <text x="300" y="42" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="url(#titleGrad)" letter-spacing="3">📊 數學弱項診斷 · 閉環改進</text>

  <!-- 裝飾線 -->
  <line x1="140" y1="55" x2="460" y2="55" stroke="url(#arrowGrad)" stroke-width="2" stroke-linecap="round" opacity="0.3"/>

  <!-- ===== 卡片1：錯題 ===== -->
  <g filter="url(#shadow1)">
    <rect x="30" y="80" width="160" height="220" rx="18" fill="url(#card1Grad)"/>
    <rect x="30" y="80" width="160" height="220" rx="18" fill="url(#card1Shine)"/>
    <!-- 頂部光條 -->
    <rect x="30" y="80" width="160" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  </g>
  <!-- 圖標 -->
  <text x="110" y="125" text-anchor="middle" font-size="36" filter="url(#iconShadow)">❌</text>
  <text x="110" y="165" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#fff">錯題</text>
  <text x="110" y="188" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">分數加減 / 應用題</text>
  <!-- 分隔線 -->
  <line x1="50" y1="200" x2="170" y2="200" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- 弱項列表 -->
  <text x="110" y="222" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">• 分數通分錯誤</text>
  <text x="110" y="242" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">• 應用題列式不當</text>
  <text x="110" y="262" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">• 計算粗心大意</text>
  <!-- 錯誤次數標籤 -->
  <rect x="55" y="275" width="110" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
  <text x="110" y="289" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#fff">累計 12 次錯誤</text>

  <!-- ===== 卡片2：根因 ===== -->
  <g filter="url(#shadow2)">
    <rect x="220" y="80" width="160" height="220" rx="18" fill="url(#card2Grad)"/>
    <rect x="220" y="80" width="160" height="220" rx="18" fill="url(#card2Shine)"/>
    <rect x="220" y="80" width="160" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  </g>
  <text x="300" y="125" text-anchor="middle" font-size="36" filter="url(#iconShadow)">🔍</text>
  <text x="300" y="165" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#fff">根因</text>
  <text x="300" y="188" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">概念不清 / 粗心</text>
  <line x1="240" y1="200" x2="360" y2="200" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="300" y="222" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">• 分數概念未掌握</text>
  <text x="300" y="242" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">• 審題習慣欠佳</text>
  <text x="300" y="262" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">• 運算基礎不穩</text>
  <rect x="245" y="275" width="110" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
  <text x="300" y="289" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#fff">3 大核心原因</text>

  <!-- ===== 卡片3：對策 ===== -->
  <g filter="url(#shadow3)">
    <rect x="410" y="80" width="160" height="220" rx="18" fill="url(#card3Grad)"/>
    <rect x="410" y="80" width="160" height="220" rx="18" fill="url(#card3Shine)"/>
    <rect x="410" y="80" width="160" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
  </g>
  <text x="490" y="125" text-anchor="middle" font-size="36" filter="url(#iconShadow)">✅</text>
  <text x="490" y="165" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#fff">對策</text>
  <text x="490" y="188" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">針對性練習</text>
  <line x1="430" y1="200" x2="550" y2="200" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="490" y="222" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">• 分數圖像化練習</text>
  <text x="490" y="242" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">• 審題三步法訓練</text>
  <text x="490" y="262" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">• 每日口算打卡</text>
  <rect x="435" y="275" width="110" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
  <text x="490" y="289" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#fff">立即執行</text>

  <!-- ===== 循環箭頭 ===== -->
  <!-- 箭頭1：錯題 → 根因 -->
  <g>
    <line x1="190" y1="190" x2="218" y2="190" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="218,183 230,190 218,197" fill="#0984E3"/>
  </g>

  <!-- 箭頭2：根因 → 對策 -->
  <g>
    <line x1="380" y1="190" x2="408" y2="190" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="408,183 420,190 408,197" fill="#00B894"/>
  </g>

  <!-- ===== 循環閉環：底部弧形箭頭 ===== -->
  <!-- 背景光暈 -->
  <ellipse cx="300" cy="355" rx="220" ry="30" fill="url(#cycleGlow)"/>

  <!-- 弧形箭頭路徑 -->
  <path d="M 490,310 Q 490,355 300,355 Q 110,355 110,310"
        fill="none" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round" opacity="0.7"/>

  <!-- 循環箭頭頭部 -->
  <polygon points="110,303 100,310 110,317" fill="#D63031" opacity="0.8"/>

  <!-- 循環文字 -->
  <text x="300" y="348" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#636E72" font-weight="600" letter-spacing="1">🔄 持續診斷 · 閉環改進</text>

  <!-- 底部小裝飾點 -->
  <circle cx="160" cy="370" r="2" fill="#D63031" opacity="0.3"/>
  <circle cx="300" cy="375" r="2" fill="#0984E3" opacity="0.3"/>
  <circle cx="440" cy="370" r="2" fill="#00B894" opacity="0.3"/>

  <!-- 版本標記 -->
  <text x="580" y="390" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="8" fill="#B2BEC3">v3.0</text>
</svg>