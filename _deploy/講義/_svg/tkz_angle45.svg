<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#D0D6DE" stroke-width="1"/>
    </pattern>

    <!-- 背景卡片漸層 -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F8FAFE"/>
      <stop offset="70%" stop-color="#F0F4FA"/>
      <stop offset="100%" stop-color="#E8EDF5"/>
    </linearGradient>

    <!-- 卡片邊框漸層 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0D8E8"/>
      <stop offset="50%" stop-color="#B8C4D8"/>
      <stop offset="100%" stop-color="#A0B0C8"/>
    </linearGradient>

    <!-- 量角器主體漸層（半透明） -->
    <linearGradient id="protractorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#F5F8FF" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#EAF0FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#DCE4F0" stop-opacity="0.88"/>
    </linearGradient>

    <!-- 量角器邊框漸層 -->
    <linearGradient id="protractorBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8899BB"/>
      <stop offset="50%" stop-color="#6A7FA0"/>
      <stop offset="100%" stop-color="#556688"/>
    </linearGradient>

    <!-- 45度角區域放射漸層 -->
    <radialGradient id="angleGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#FF8F5E" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#FFB088" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFD0B0" stop-opacity="0"/>
    </radialGradient>

    <!-- 45度角填充漸層 -->
    <linearGradient id="angleFill" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#FF8F5E" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFB088" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFD0B0" stop-opacity="0.15"/>
    </linearGradient>

    <!-- 3D光影效果 - 量角器頂部高光 -->
    <radialGradient id="protractorHighlight" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D光影效果 - 量角器底部陰影 -->
    <radialGradient id="protractorShadow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8899BB" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#667799" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#445566" stop-opacity="0"/>
    </radialGradient>

    <!-- 雙層陰影過濾器 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="140%">
      <!-- 第一層陰影（深色、較大） -->
      <feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="#8899BB" flood-opacity="0.3"/>
      <!-- 第二層陰影（淺色、較小） -->
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#AABBCC" flood-opacity="0.2"/>
    </filter>

    <!-- 量角器內陰影 -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- 弧線發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 刻度線標記 -->
    <linearGradient id="tickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#445566"/>
      <stop offset="100%" stop-color="#667788"/>
    </linearGradient>

    <!-- 數字標籤漸層 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334455"/>
      <stop offset="100%" stop-color="#556677"/>
    </linearGradient>

    <!-- 45度角標籤漸層 -->
    <linearGradient id="angleLabelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E84A1B"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E84A1B"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#gridMajor)"/>

  <!-- 圓角卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="20" ry="20" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" filter="url(#doubleShadow)"/>

  <!-- 卡片頂部高光條 -->
  <rect x="25" y="20" width="550" height="60" rx="20" ry="20" fill="url(#cardBg)" opacity="0.3"/>
  <rect x="25" y="20" width="550" height="30" rx="20" ry="20" fill="#FFFFFF" opacity="0.15"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="22" font-weight="bold" fill="url(#textGrad)" letter-spacing="2">認識 45° 角</text>
  <line x1="200" y1="68" x2="400" y2="68" stroke="#D0D8E8" stroke-width="1" opacity="0.6"/>

  <!-- 量角器組 - 中心在 (300, 230) -->
  <g transform="translate(300, 230)">

    <!-- 量角器底部陰影（3D效果） -->
    <ellipse cx="2" cy="8" rx="175" ry="95" fill="url(#protractorShadow)" opacity="0.4"/>

    <!-- 量角器外框（半圓形） -->
    <path d="M -175 0 A 175 175 0 0 1 175 0" fill="url(#protractorGrad)" stroke="url(#protractorBorder)" stroke-width="2.5" filter="url(#innerShadow)"/>

    <!-- 量角器底部直線 -->
    <line x1="-175" y1="0" x2="175" y2="0" stroke="url(#protractorBorder)" stroke-width="2.5"/>

    <!-- 量角器高光（3D光影） -->
    <path d="M -175 0 A 175 175 0 0 1 175 0" fill="url(#protractorHighlight)" opacity="0.5"/>

    <!-- 量角器內弧 -->
    <path d="M -145 0 A 145 145 0 0 1 145 0" fill="none" stroke="#C8D0DC" stroke-width="1" opacity="0.5"/>

    <!-- 中心點 -->
    <circle cx="0" cy="0" r="4" fill="#556677"/>
    <circle cx="0" cy="0" r="2" fill="#8899BB"/>

    <!-- 刻度線 - 每5度一條 -->
    <g stroke="url(#tickGrad)" stroke-width="1.2">
      <!-- 0度 -->
      <line x1="175" y1="0" x2="165" y2="0"/>
      <!-- 5度 -->
      <line x1="174.3" y1="-15.2" x2="164.3" y2="-14.3"/>
      <!-- 10度 -->
      <line x1="172.4" y1="-30.4" x2="162.7" y2="-28.7"/>
      <!-- 15度 -->
      <line x1="169.0" y1="-45.3" x2="159.6" y2="-42.7"/>
      <!-- 20度 -->
      <line x1="164.4" y1="-59.9" x2="155.2" y2="-56.5"/>
      <!-- 25度 -->
      <line x1="158.6" y1="-74.0" x2="149.7" y2="-69.8"/>
      <!-- 30度 -->
      <line x1="151.6" y1="-87.5" x2="143.1" y2="-82.6"/>
      <!-- 35度 -->
      <line x1="143.4" y1="-100.4" x2="135.3" y2="-94.7"/>
      <!-- 40度 -->
      <line x1="134.1" y1="-112.6" x2="126.5" y2="-106.2"/>
      <!-- 45度 -->
      <line x1="123.7" y1="-123.7" x2="116.7" y2="-116.7" stroke="#FF6B35" stroke-width="2.2"/>
      <!-- 50度 -->
      <line x1="112.6" y1="-134.1" x2="106.2" y2="-126.5"/>
      <!-- 55度 -->
      <line x1="100.4" y1="-143.4" x2="94.7" y2="-135.3"/>
      <!-- 60度 -->
      <line x1="87.5" y1="-151.6" x2="82.6" y2="-143.1"/>
      <!-- 65度 -->
      <line x1="74.0" y1="-158.6" x2="69.8" y2="-149.7"/>
      <!-- 70度 -->
      <line x1="59.9" y1="-164.4" x2="56.5" y2="-155.2"/>
      <!-- 75度 -->
      <line x1="45.3" y1="-169.0" x2="42.7" y2="-159.6"/>
      <!-- 80度 -->
      <line x1="30.4" y1="-172.4" x2="28.7" y2="-162.7"/>
      <!-- 85度 -->
      <line x1="15.2" y1="-174.3" x2="14.3" y2="-164.3"/>
      <!-- 90度 -->
      <line x1="0" y1="-175" x2="0" y2="-165"/>
    </g>

    <!-- 主要刻度線（每10度）加粗 -->
    <g stroke="url(#tickGrad)" stroke-width="1.8">
      <line x1="175" y1="0" x2="162" y2="0"/>
      <line x1="172.4" y1="-30.4" x2="159.7" y2="-28.2"/>
      <line x1="164.4" y1="-59.9" x2="152.3" y2="-55.5"/>
      <line x1="151.6" y1="-87.5" x2="140.5" y2="-81.1"/>
      <line x1="134.1" y1="-112.6" x2="124.2" y2="-104.3"/>
      <line x1="112.6" y1="-134.1" x2="104.3" y2="-124.2"/>
      <line x1="87.5" y1="-151.6" x2="81.1" y2="-140.5"/>
      <line x1="59.9" y1="-164.4" x2="55.5" y2="-152.3"/>
      <line x1="30.4" y1="-172.4" x2="28.2" y2="-159.7"/>
      <line x1="0" y1="-175" x2="0" y2="-162"/>
    </g>

    <!-- 45度刻度線標記（突出顯示） -->
    <line x1="123.7" y1="-123.7" x2="116.7" y2="-116.7" stroke="#FF6B35" stroke-width="2.5" filter="url(#glow)"/>

    <!-- 角度數字標籤 -->
    <g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="url(#textGrad)" text-anchor="middle">
      <text x="185" y="5">0°</text>
      <text x="182" y="-28">10°</text>
      <text x="174" y="-55">20°</text>
      <text x="160" y="-82">30°</text>
      <text x="142" y="-106">40°</text>
      <text x="120" y="-126">50°</text>
      <text x="95" y="-143">60°</text>
      <text x="68" y="-156">70°</text>
      <text x="38" y="-165">80°</text>
      <text x="0" y="-170">90°</text>
    </g>

    <!-- 45度角標籤（突出顯示） -->
    <text x="135" y="-100" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="url(#angleLabelGrad)" text-anchor="middle" filter="url(#glow)">45°</text>

    <!-- 45度角區域 -->
    <!-- 從中心到45度方向的射線 -->
    <line x1="0" y1="0" x2="123.7" y2="-123.7" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- 水平射線（0度方向） -->
    <line x1="0" y1="0" x2="175" y2="0" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- 45度角填充區域 -->
    <path d="M 0 0 L 175 0 A 175 175 0 0 1 123.7 -123.7 Z" fill="url(#angleFill)" opacity="0.6"/>

    <!-- 45度角填充區域發光 -->
    <path d="M 0 0 L 175 0 A 175 175 0 0 1 123.7 -123.7 Z" fill="url(#angleGlow)" opacity="0.5"/>

    <!-- 弧度標示 - 45度弧線 -->
    <path d="M 40 0 A 40 40 0 0 1 28.3 -28.3" fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- 弧度內的小箭頭 -->
    <polygon points="32,-18 36,-22 28,-24" fill="#FF6B35" opacity="0.7"/>

    <!-- 弧度標籤 "45°" -->
    <text x="38" y="-14" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="bold" fill="#FF6B35" text-anchor="middle">45°</text>

    <!-- 直角標記（小正方形） -->
    <polyline points="20,0 20,-20 0,-20" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>

  </g>

  <!-- 底部說明文字 -->
  <text x="300" y="355" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#8899BB" letter-spacing="1">45° 角 = 直角（90°）的一半</text>

  <!-- 裝飾性小點 -->
  <circle cx="50" cy="50" r="2" fill="#D0D8E8" opacity="0.5"/>
  <circle cx="550" cy="50" r="2" fill="#D0D8E8" opacity="0.5"/>
  <circle cx="50" cy="370" r="2" fill="#D0D8E8" opacity="0.5"/>
  <circle cx="550" cy="370" r="2" fill="#D0D8E8" opacity="0.5"/>
</svg>