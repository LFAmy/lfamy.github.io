<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>

    <!-- 卡片1：部分除以整體 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
    <radialGradient id="card1Shine" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 卡片2：乘100% -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48dbfb"/>
      <stop offset="100%" style="stop-color:#0abde3"/>
    </linearGradient>
    <radialGradient id="card2Shine" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 卡片3：折扣計算 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#feca57"/>
      <stop offset="100%" style="stop-color:#ff9f43"/>
    </linearGradient>
    <radialGradient id="card3Shine" cx="30%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7971e"/>
      <stop offset="100%" style="stop-color:#ffd200"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 數字陰影 -->
    <filter id="numShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- 百分比符號漸變 -->
    <linearGradient id="pctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.5"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- 背景裝飾圓圈 -->
  <circle cx="50" cy="50" r="80" fill="#ffffff" opacity="0.03"/>
  <circle cx="550" cy="350" r="100" fill="#ffffff" opacity="0.03"/>
  <circle cx="300" cy="200" r="180" fill="#ffffff" opacity="0.02"/>

  <!-- 標題 -->
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#titleGrad)" filter="url(#numShadow)">
    📊 百分數應用 · 三步法
  </text>

  <!-- ============ 卡片1：部分 ÷ 整體 ============ -->
  <g filter="url(#shadow1)">
    <rect x="20" y="65" width="175" height="145" rx="16" fill="url(#card1Grad)"/>
    <rect x="20" y="65" width="175" height="145" rx="16" fill="url(#card1Shine)"/>
    <!-- 雙層邊框 -->
    <rect x="22" y="67" width="171" height="141" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  </g>

  <text x="107" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" opacity="0.9">
    第一步
  </text>
  <text x="107" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.8">
    部分 ÷ 整體
  </text>

  <!-- 圓餅圖示意 -->
  <circle cx="107" cy="160" r="30" fill="#ffffff" opacity="0.15"/>
  <path d="M107 160 L107 135 A25 25 0 0 1 130 155 Z" fill="#ffffff" opacity="0.5"/>
  <path d="M107 160 L130 155 A25 25 0 0 1 95 178 Z" fill="#ffffff" opacity="0.3"/>
  <circle cx="107" cy="160" r="10" fill="#ffffff" opacity="0.2"/>

  <text x="107" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">
    找出比率
  </text>

  <!-- ============ 箭頭1 ============ -->
  <g filter="url(#shadow2)">
    <circle cx="215" cy="137" r="14" fill="#2d3436" opacity="0.6"/>
    <polygon points="220,137 210,131 210,143" fill="#feca57"/>
  </g>

  <!-- ============ 卡片2：乘 100% ============ -->
  <g filter="url(#shadow1)">
    <rect x="240" y="65" width="175" height="145" rx="16" fill="url(#card2Grad)"/>
    <rect x="240" y="65" width="175" height="145" rx="16" fill="url(#card2Shine)"/>
    <rect x="242" y="67" width="171" height="141" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  </g>

  <text x="327" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" opacity="0.9">
    第二步
  </text>
  <text x="327" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.8">
    結果 × 100%
  </text>

  <!-- 放大鏡圖示 -->
  <circle cx="327" cy="158" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="327" cy="158" r="14" fill="#ffffff" opacity="0.15"/>
  <text x="327" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" opacity="0.6">
    %
  </text>
  <line x1="345" y1="176" x2="355" y2="186" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>

  <text x="327" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">
    轉換百分數
  </text>

  <!-- ============ 箭頭2 ============ -->
  <g filter="url(#shadow2)">
    <circle cx="435" cy="137" r="14" fill="#2d3436" opacity="0.6"/>
    <polygon points="440,137 430,131 430,143" fill="#feca57"/>
  </g>

  <!-- ============ 卡片3：折扣計算 ============ -->
  <g filter="url(#shadow1)">
    <rect x="460" y="65" width="120" height="145" rx="16" fill="url(#card3Grad)"/>
    <rect x="460" y="65" width="120" height="145" rx="16" fill="url(#card3Shine)"/>
    <rect x="462" y="67" width="116" height="141" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  </g>

  <text x="520" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" opacity="0.9">
    第三步
  </text>
  <text x="520" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.8">
    折扣計算
  </text>

  <!-- 折扣標籤 -->
  <rect x="488" y="135" width="64" height="28" rx="6" fill="#ffffff" opacity="0.2"/>
  <text x="520" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    30% OFF
  </text>

  <text x="520" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">
    原價 × (1 − 折扣%)
  </text>
  <text x="520" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.7">
    節省金錢！
  </text>

  <!-- ============ 底部範例區 ============ -->
  <g filter="url(#shadow1)">
    <rect x="20" y="230" width="560" height="150" rx="16" fill="#ffffff" opacity="0.08"/>
    <rect x="22" y="232" width="556" height="146" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  </g>

  <text x="300" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffd200">
    🛍️ 實例：八折優惠計算
  </text>

  <!-- 原價 -->
  <rect x="40" y="278" width="160" height="50" rx="10" fill="#ffffff" opacity="0.1"/>
  <text x="120" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">
    原價
  </text>
  <text x="120" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">
    $200
  </text>

  <!-- 乘號 -->
  <text x="230" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#feca57">
    ×
  </text>

  <!-- 折扣率 -->
  <rect x="260" y="278" width="100" height="50" rx="10" fill="#ffffff" opacity="0.1"/>
  <text x="310" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">
    折扣率
  </text>
  <text x="310" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#48dbfb">
    80%
  </text>

  <!-- 等號 -->
  <text x="390" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#feca57">
    =
  </text>

  <!-- 折扣價 -->
  <rect x="420" y="278" width="140" height="50" rx="10" fill="#ffffff" opacity="0.15"/>
  <text x="490" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.6">
    折扣價
  </text>
  <text x="490" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff6b6b">
    $160
  </text>

  <!-- 節省金額 -->
  <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2ecc71" opacity="0.8">
    ✅ 節省了 $40！ 200 × (1 − 0.8) = 40
  </text>

  <!-- 裝飾小圓點 -->
  <circle cx="30" cy="30" r="3" fill="#ff6b6b" opacity="0.3"/>
  <circle cx="570" cy="30" r="3" fill="#48dbfb" opacity="0.3"/>
  <circle cx="30" cy="370" r="3" fill="#feca57" opacity="0.3"/>
  <circle cx="570" cy="370" r="3" fill="#2ecc71" opacity="0.3"/>
</svg>