<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d35;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 - 金色 -->
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ffec80;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ffb300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc8800;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 - 銀色 -->
    <linearGradient id="cardSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#909090;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 - 藍色 -->
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#81d4fa;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0288d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#01579b;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 - 綠色 -->
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#a5d6a7;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#388e3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 - 紫色 -->
    <linearGradient id="cardPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ab47bc;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ce93d8;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#7b1fa2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a148c;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 - 紅色 -->
    <linearGradient id="cardRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef5350;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ef9a9a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#c62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 - 橙色 -->
    <linearGradient id="cardOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ffcc80;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#e65100;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bf360c;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 - 青色 -->
    <linearGradient id="cardCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#80deea;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0097a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006064;stop-opacity:1" />
    </linearGradient>

    <!-- 3D 高光放射漸變 -->
    <radialGradient id="highlight" cx="30%" cy="25%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>

    <!-- 按鈕放射漸變 -->
    <radialGradient id="btnGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </radialGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <!-- 第一層陰影（深色，偏移大） -->
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
      <!-- 第二層陰影（淺色，偏移小） -->
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <!-- 卡片陰影濾鏡 -->
    <filter id="cardShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- 發光濾鏡 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 標題文字漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>

    <!-- 分節標記漸變 -->
    <linearGradient id="sectionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6f00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff3d00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12" />

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="2" fill="#ffffff" opacity="0.15" />
  <circle cx="150" cy="30" r="1.5" fill="#ffffff" opacity="0.1" />
  <circle cx="450" cy="60" r="2" fill="#ffffff" opacity="0.12" />
  <circle cx="550" cy="40" r="1.5" fill="#ffffff" opacity="0.1" />
  <circle cx="80" cy="370" r="1.5" fill="#ffffff" opacity="0.1" />
  <circle cx="520" cy="380" r="2" fill="#ffffff" opacity="0.12" />
  <circle cx="300" cy="20" r="1" fill="#ffffff" opacity="0.15" />

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" filter="url(#glow)">大數位值表</text>
  <text x="300" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8899cc" opacity="0.8">香港小學數學</text>

  <!-- 位值卡片 - 從億位到個位，每3位一組 -->
  <!-- 億位 -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="75" width="64" height="90" rx="10" ry="10" fill="url(#cardGold)" />
    <rect x="20" y="75" width="64" height="90" rx="10" ry="10" fill="url(#highlight)" />
    <!-- 3D 邊緣效果 -->
    <rect x="20" y="155" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.15" />
    <rect x="20" y="155" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.1" />
    <text x="52" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" filter="url(#glow)">億</text>
    <text x="52" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.85">100,000,000</text>
  </g>

  <!-- 千萬位 -->
  <g filter="url(#cardShadow)">
    <rect x="92" y="75" width="64" height="90" rx="10" ry="10" fill="url(#cardSilver)" />
    <rect x="92" y="75" width="64" height="90" rx="10" ry="10" fill="url(#highlight)" />
    <rect x="92" y="155" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.1" />
    <text x="124" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a1a4e">千萬</text>
    <text x="124" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333366">10,000,000</text>
  </g>

  <!-- 百萬位 -->
  <g filter="url(#cardShadow)">
    <rect x="164" y="75" width="64" height="90" rx="10" ry="10" fill="url(#cardSilver)" />
    <rect x="164" y="75" width="64" height="90" rx="10" ry="10" fill="url(#highlight)" />
    <rect x="164" y="155" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.1" />
    <text x="196" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a1a4e">百萬</text>
    <text x="196" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333366">1,000,000</text>
  </g>

  <!-- 分節標記 1 -->
  <rect x="228" y="80" width="6" height="80" rx="3" ry="3" fill="url(#sectionGrad)" opacity="0.9" />

  <!-- 十萬位 -->
  <g filter="url(#cardShadow)">
    <rect x="240" y="75" width="64" height="90" rx="10" ry="10" fill="url(#cardBlue)" />
    <rect x="240" y="75" width="64" height="90" rx="10" ry="10" fill="url(#highlight)" />
    <rect x="240" y="155" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.1" />
    <text x="272" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">十萬</text>
    <text x="272" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e0f7fa">100,000</text>
  </g>

  <!-- 萬位 -->
  <g filter="url(#cardShadow)">
    <rect x="312" y="75" width="64" height="90" rx="10" ry="10" fill="url(#cardGreen)" />
    <rect x="312" y="75" width="64" height="90" rx="10" ry="10" fill="url(#highlight)" />
    <rect x="312" y="155" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.1" />
    <text x="344" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">萬</text>
    <text x="344" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e8f5e9">10,000</text>
  </g>

  <!-- 千位 -->
  <g filter="url(#cardShadow)">
    <rect x="384" y="75" width="64" height="90" rx="10" ry="10" fill="url(#cardPurple)" />
    <rect x="384" y="75" width="64" height="90" rx="10" ry="10" fill="url(#highlight)" />
    <rect x="384" y="155" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.1" />
    <text x="416" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">千</text>
    <text x="416" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#f3e5f5">1,000</text>
  </g>

  <!-- 分節標記 2 -->
  <rect x="448" y="80" width="6" height="80" rx="3" ry="3" fill="url(#sectionGrad)" opacity="0.9" />

  <!-- 百位 -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="75" width="64" height="90" rx="10" ry="10" fill="url(#cardRed)" />
    <rect x="460" y="75" width="64" height="90" rx="10" ry="10" fill="url(#highlight)" />
    <rect x="460" y="155" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.1" />
    <text x="492" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">百</text>
    <text x="492" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffebee">100</text>
  </g>

  <!-- 十位 -->
  <g filter="url(#cardShadow)">
    <rect x="532" y="75" width="64" height="90" rx="10" ry="10" fill="url(#cardOrange)" />
    <rect x="532" y="75" width="64" height="90" rx="10" ry="10" fill="url(#highlight)" />
    <rect x="532" y="155" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.1" />
    <text x="564" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">十</text>
    <text x="564" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff3e0">10</text>
  </g>

  <!-- 個位 -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="185" width="64" height="90" rx="10" ry="10" fill="url(#cardCyan)" />
    <rect x="20" y="185" width="64" height="90" rx="10" ry="10" fill="url(#highlight)" />
    <rect x="20" y="265" width="64" height="10" rx="0" ry="0" fill="#000000" opacity="0.1" />
    <text x="52" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">個</text>
    <text x="52" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e0f7fa">1</text>
  </g>

  <!-- 分節說明標籤 -->
  <g>
    <!-- 億級標籤 -->
    <rect x="20" y="285" width="208" height="28" rx="14" ry="14" fill="#ffd700" opacity="0.2" />
    <text x="124" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffd700">億級</text>

    <!-- 萬級標籤 -->
    <rect x="240" y="285" width="208" height="28" rx="14" ry="14" fill="#4fc3f7" opacity="0.2" />
    <text x="344" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4fc3f7">萬級</text>

    <!-- 個級標籤 -->
    <rect x="460" y="285" width="136" height="28" rx="14" ry="14" fill="#ef5350" opacity="0.2" />
    <text x="528" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef5350">個級</text>
  </g>

  <!-- 示例數字 -->
  <g>
    <rect x="100" y="325" width="400" height="55" rx="12" ry="12" fill="#ffffff" opacity="0.08" />
    <rect x="100" y="325" width="400" height="55" rx="12" ry="12" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15" />

    <text x="300" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#aabbdd" opacity="0.9">示例數字</text>

    <!-- 數字位值顯示 -->
    <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" letter-spacing="4">
      3 億 2 千 5 百 6 十 7 萬 8 千 9 百 1 十 4
    </text>
  </g>

  <!-- 裝飾性角標 -->
  <rect x="5" y="5" width="15" height="3" rx="1.5" fill="#ffd700" opacity="0.4" />
  <rect x="5" y="5" width="3" height="15" rx="1.5" fill="#ffd700" opacity="0.4" />
  <rect x="580" y="5" width="15" height="3" rx="1.5" fill="#ffd700" opacity="0.4" />
  <rect x="582" y="5" width="3" height="15" rx="1.5" fill="#ffd700" opacity="0.4" />
  <rect x="5" y="380" width="15" height="3" rx="1.5" fill="#ffd700" opacity="0.4" />
  <rect x="5" y="380" width="3" height="15" rx="1.5" fill="#ffd700" opacity="0.4" />
  <rect x="580" y="380" width="15" height="3" rx="1.5" fill="#ffd700" opacity="0.4" />
  <rect x="582" y="380" width="3" height="15" rx="1.5" fill="#ffd700" opacity="0.4" />
</svg>