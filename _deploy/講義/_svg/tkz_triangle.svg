<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-dot" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#D0D6DE"/>
    </pattern>

    <!-- 圓角卡片陰影（雙層） -->
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#B0B8C4" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#C8D0DC" flood-opacity="0.15"/>
    </filter>

    <!-- 三角形3D斜面光影 - 主面多層漸變 -->
    <linearGradient id="triangle-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="25%" stop-color="#5B9FE8"/>
      <stop offset="50%" stop-color="#3A7BC8"/>
      <stop offset="75%" stop-color="#2E6AB5"/>
      <stop offset="100%" stop-color="#1E5799"/>
    </linearGradient>

    <!-- 放射漸變3D光影 - 高光 -->
    <radialGradient id="triangle-highlight" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 放射漸變3D光影 - 邊緣光 -->
    <radialGradient id="edge-glow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#7CB8F0" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#7CB8F0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7CB8F0" stop-opacity="0"/>
    </radialGradient>

    <!-- 底部陰影漸變 -->
    <linearGradient id="shadow-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E5799" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1E5799" stop-opacity="0"/>
    </linearGradient>

    <!-- 標籤底色 -->
    <linearGradient id="label-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#F0F4FA" stop-opacity="0.92"/>
    </linearGradient>

    <!-- 底邊標示線漸變 -->
    <linearGradient id="base-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E74C3C" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#E74C3C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E74C3C" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 高標示線漸變 -->
    <linearGradient id="height-line-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27AE60" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#27AE60" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#27AE60" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 公式卡片漸變 -->
    <linearGradient id="formula-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFE"/>
      <stop offset="100%" stop-color="#EEF2F8"/>
    </linearGradient>

    <!-- 三角形邊緣光暈 -->
    <filter id="edge-glow-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#grid-dot)"/>

  <!-- 主卡片背景（圓角） -->
  <rect x="30" y="25" width="540" height="350" rx="16" ry="16" fill="#FFFFFF" filter="url(#card-shadow)"/>

  <!-- 卡片頂部裝飾條 -->
  <rect x="30" y="25" width="540" height="6" rx="3" ry="3" fill="#4A90D9" opacity="0.8"/>

  <!-- 標題 -->
  <text x="300" y="62" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="20" font-weight="700" fill="#2C3E50" letter-spacing="2">三角形面積</text>
  <text x="300" y="82" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13" fill="#7F8C9B" letter-spacing="1">△ 底 × 高 ÷ 2</text>

  <!-- 三角形底部陰影（3D效果） -->
  <polygon points="300,310 140,310 300,120" fill="url(#shadow-grad)" opacity="0.3" transform="translate(4,6)"/>

  <!-- 三角形主體（3D斜面光影） -->
  <polygon points="300,310 140,310 300,120" fill="url(#triangle-face)" stroke="#1E5799" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 三角形放射高光 -->
  <polygon points="300,310 140,310 300,120" fill="url(#triangle-highlight)"/>

  <!-- 三角形邊緣光 -->
  <polygon points="300,310 140,310 300,120" fill="url(#edge-glow)"/>

  <!-- 三角形左邊緣高光線 -->
  <line x1="300" y1="120" x2="140" y2="310" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- 三角形右邊緣反光 -->
  <line x1="300" y1="120" x2="300" y2="310" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- 底邊標示線（紅色） -->
  <line x1="140" y1="310" x2="300" y2="310" stroke="url(#base-line-grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- 底邊兩端圓點 -->
  <circle cx="140" cy="310" r="4" fill="#E74C3C"/>
  <circle cx="300" cy="310" r="4" fill="#E74C3C"/>

  <!-- 高標示線（綠色虛線） -->
  <line x1="300" y1="120" x2="300" y2="310" stroke="url(#height-line-grad)" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round"/>

  <!-- 高標示頂端圓點 -->
  <circle cx="300" cy="120" r="4" fill="#27AE60"/>

  <!-- 直角標示 -->
  <polyline points="300,295 288,295 288,310" fill="none" stroke="#27AE60" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- 底邊標籤 b -->
  <rect x="195" y="318" width="50" height="26" rx="13" ry="13" fill="url(#label-bg)" stroke="#E74C3C" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="220" y="335" text-anchor="middle" font-family="'Times New Roman', 'Georgia', serif" font-size="17" font-weight="700" font-style="italic" fill="#E74C3C">b</text>

  <!-- 高標籤 h -->
  <rect x="308" y="205" width="38" height="26" rx="13" ry="13" fill="url(#label-bg)" stroke="#27AE60" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="327" y="222" text-anchor="middle" font-family="'Times New Roman', 'Georgia', serif" font-size="17" font-weight="700" font-style="italic" fill="#27AE60">h</text>

  <!-- 頂點標示 A -->
  <text x="310" y="114" font-family="'Times New Roman', serif" font-size="16" font-weight="700" fill="#2C3E50">A</text>
  <!-- 底邊左端標示 B -->
  <text x="124" y="318" font-family="'Times New Roman', serif" font-size="16" font-weight="700" fill="#2C3E50">B</text>
  <!-- 底邊右端標示 C -->
  <text x="308" y="318" font-family="'Times New Roman', serif" font-size="16" font-weight="700" fill="#2C3E50">C</text>

  <!-- 公式卡片 -->
  <rect x="365" y="240" width="180" height="80" rx="12" ry="12" fill="url(#formula-card)" stroke="#DCE4EC" stroke-width="1" filter="url(#card-shadow)"/>

  <!-- 公式卡片裝飾條 -->
  <rect x="365" y="240" width="180" height="4" rx="2" ry="2" fill="#4A90D9" opacity="0.6"/>

  <!-- 公式內容 -->
  <text x="455" y="270" text-anchor="middle" font-family="'Times New Roman', 'Georgia', serif" font-size="15" fill="#5A6B7D">面積 = ½ × 底 × 高</text>
  <text x="455" y="295" text-anchor="middle" font-family="'Times New Roman', 'Georgia', serif" font-size="18" font-weight="700" fill="#2C3E50">S = ½ b h</text>

  <!-- 裝飾小三角 -->
  <polygon points="455,305 449,315 461,315" fill="#4A90D9" opacity="0.3"/>

  <!-- 底部裝飾線 -->
  <line x1="50" y1="360" x2="550" y2="360" stroke="#E8ECF0" stroke-width="1"/>
  <text x="300" y="372" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#B0B8C4">香港小學數學 · 三角形面積</text>
</svg>