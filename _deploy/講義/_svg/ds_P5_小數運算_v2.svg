<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#d6e4f0"/>
    </radialGradient>

    <!-- 主卡片漸變 - 加法 -->
    <linearGradient id="addGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#EE5A24"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>

    <!-- 主卡片漸變 - 減法 -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74B9FF"/>
      <stop offset="50%" stop-color="#0984E3"/>
      <stop offset="100%" stop-color="#0652DD"/>
    </linearGradient>

    <!-- 主卡片漸變 - 乘法 -->
    <linearGradient id="mulGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55EFC4"/>
      <stop offset="50%" stop-color="#00B894"/>
      <stop offset="100%" stop-color="#009432"/>
    </linearGradient>

    <!-- 主卡片漸變 - 除法 -->
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDCB6E"/>
      <stop offset="50%" stop-color="#E17055"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>

    <!-- 放射漸變 3D 光影效果 -->
    <radialGradient id="cardShine1" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <radialGradient id="cardShine2" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <filter id="doubleShadowSmall" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.12)"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.06)"/>
    </filter>

    <!-- 小數點發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0984E3"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D63031"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00B894"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E17055"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2d3436">小數運算定位規則流程圖</text>
  <line x1="180" y1="46" x2="420" y2="46" stroke="#2d3436" stroke-width="1.5" opacity="0.3"/>

  <!-- ==================== 加法卡片 ==================== -->
  <g filter="url(#doubleShadow)">
    <rect x="20" y="60" width="270" height="145" rx="16" fill="url(#addGrad)"/>
    <rect x="20" y="60" width="270" height="145" rx="16" fill="url(#cardShine1)"/>
  </g>
  <text x="155" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">加法 · 小數點對齊</text>
  <line x1="40" y1="96" x2="270" y2="96" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- 加法算式 -->
  <text x="55" y="120" font-family="monospace" font-size="18" fill="#fff" opacity="0.9">3.2</text>
  <text x="55" y="142" font-family="monospace" font-size="18" fill="#fff" opacity="0.9">+ 1.8</text>
  <line x1="50" y1="148" x2="130" y2="148" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <text x="55" y="168" font-family="monospace" font-size="20" font-weight="bold" fill="#fff">5.0</text>

  <!-- 小數點標示 -->
  <circle cx="72" cy="118" r="3" fill="#FFEAA7" filter="url(#glow)"/>
  <circle cx="72" cy="140" r="3" fill="#FFEAA7" filter="url(#glow)"/>
  <circle cx="72" cy="166" r="3" fill="#FFEAA7" filter="url(#glow)"/>

  <!-- 對齊箭頭 -->
  <line x1="72" y1="115" x2="72" y2="108" stroke="#FFEAA7" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowOrange)"/>
  <line x1="72" y1="143" x2="72" y2="150" stroke="#FFEAA7" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowOrange)"/>

  <!-- 規則說明 -->
  <text x="50" y="192" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">→ 小數點上下對齊，按位相加</text>

  <!-- ==================== 減法卡片 ==================== -->
  <g filter="url(#doubleShadow)">
    <rect x="310" y="60" width="270" height="145" rx="16" fill="url(#subGrad)"/>
    <rect x="310" y="60" width="270" height="145" rx="16" fill="url(#cardShine2)"/>
  </g>
  <text x="445" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">減法 · 小數點對齊</text>
  <line x1="330" y1="96" x2="560" y2="96" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- 減法算式 -->
  <text x="345" y="120" font-family="monospace" font-size="18" fill="#fff" opacity="0.9">5.7</text>
  <text x="345" y="142" font-family="monospace" font-size="18" fill="#fff" opacity="0.9">- 2.4</text>
  <line x1="340" y1="148" x2="420" y2="148" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <text x="345" y="168" font-family="monospace" font-size="20" font-weight="bold" fill="#fff">3.3</text>

  <!-- 小數點標示 -->
  <circle cx="362" cy="118" r="3" fill="#FFEAA7" filter="url(#glow)"/>
  <circle cx="362" cy="140" r="3" fill="#FFEAA7" filter="url(#glow)"/>
  <circle cx="362" cy="166" r="3" fill="#FFEAA7" filter="url(#glow)"/>

  <!-- 對齊箭頭 -->
  <line x1="362" y1="115" x2="362" y2="108" stroke="#FFEAA7" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowOrange)"/>
  <line x1="362" y1="143" x2="362" y2="150" stroke="#FFEAA7" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowOrange)"/>

  <text x="340" y="192" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">→ 小數點上下對齊，按位相減</text>

  <!-- ==================== 乘法卡片 ==================== -->
  <g filter="url(#doubleShadow)">
    <rect x="20" y="230" width="270" height="145" rx="16" fill="url(#mulGrad)"/>
    <rect x="20" y="230" width="270" height="145" rx="16" fill="url(#cardShine1)"/>
  </g>
  <text x="155" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">乘法 · 右端對齊</text>
  <line x1="40" y1="266" x2="270" y2="266" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- 乘法算式 -->
  <text x="55" y="290" font-family="monospace" font-size="18" fill="#fff" opacity="0.9">2.5</text>
  <text x="55" y="312" font-family="monospace" font-size="18" fill="#fff" opacity="0.9">× 0.4</text>
  <line x1="50" y1="318" x2="130" y2="318" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <text x="55" y="338" font-family="monospace" font-size="20" font-weight="bold" fill="#fff">1.00</text>

  <!-- 右端對齊標示 -->
  <line x1="130" y1="286" x2="130" y2="340" stroke="#FFEAA7" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- 規則說明 -->
  <text x="50" y="362" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">→ 末尾對齊，先乘後點小數點</text>

  <!-- ==================== 除法卡片 ==================== -->
  <g filter="url(#doubleShadow)">
    <rect x="310" y="230" width="270" height="145" rx="16" fill="url(#divGrad)"/>
    <rect x="310" y="230" width="270" height="145" rx="16" fill="url(#cardShine2)"/>
  </g>
  <text x="445" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff">除法 · 移動小數點</text>
  <line x1="330" y1="266" x2="560" y2="266" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- 除法算式 -->
  <text x="345" y="290" font-family="monospace" font-size="18" fill="#fff" opacity="0.9">0.6 ⟌ 1.2</text>
  <text x="345" y="312" font-family="monospace" font-size="16" fill="#fff" opacity="0.8">→ 6 ⟌ 12</text>
  <line x1="340" y1="318" x2="440" y2="318" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <text x="345" y="338" font-family="monospace" font-size="20" font-weight="bold" fill="#fff">2</text>

  <!-- 移動箭頭 -->
  <path d="M380,295 Q410,295 410,308" stroke="#FFEAA7" stroke-width="1.5" fill="none" marker-end="url(#arrowOrange)"/>

  <text x="340" y="362" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">→ 除數變整數，被除數同步移動</text>

  <!-- ==================== 連接線與流程箭頭 ==================== -->
  <!-- 加法 → 減法 -->
  <line x1="290" y1="132" x2="308" y2="132" stroke="#0984E3" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- 加法 → 乘法 -->
  <path d="M155,205 L155,228" stroke="#00B894" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- 減法 → 除法 -->
  <path d="M445,205 L445,228" stroke="#E17055" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- 乘法 → 除法 -->
  <line x1="290" y1="302" x2="308" y2="302" stroke="#D63031" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- ==================== 裝飾元素 ==================== -->
  <!-- 左上角裝飾圓點 -->
  <circle cx="10" cy="10" r="4" fill="#FF6B6B" opacity="0.4"/>
  <circle cx="22" cy="10" r="4" fill="#74B9FF" opacity="0.4"/>
  <circle cx="34" cy="10" r="4" fill="#55EFC4" opacity="0.4"/>

  <!-- 右下角裝飾 -->
  <circle cx="590" cy="390" r="6" fill="#FDCB6E" opacity="0.3"/>
  <circle cx="578" cy="390" r="4" fill="#FF6B6B" opacity="0.3"/>
</svg>