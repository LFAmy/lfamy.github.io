<svg width="100%" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, SimHei, sans-serif">
    <defs>
        <!-- 渐变色定义 -->
        <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4F46E5; stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6D28D9; stop-opacity:1" />
        </linearGradient>
        <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4F46E5; stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4338CA; stop-opacity:1" />
        </linearGradient>
        <!-- 阴影滤镜 -->
        <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
            <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000020"/>
        </filter>
        <!-- 箭头标记 -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5" />
        </marker>
    </defs>

    <!-- 背景 -->
    <rect x="0" y="0" width="600" height="400" rx="15" fill="#F9FAFB"/>

    <!-- 标题栏 -->
    <rect x="30" y="20" width="540" height="55" rx="12" fill="url(#titleGrad)" filter="url(#shadow)"/>
    <text x="300" y="55" text-anchor="middle" font-size="24" font-weight="bold" fill="white">🚀 SSPA應用題滿分衝刺</text>

    <!-- 主解题框架卡 -->
    <rect x="30" y="90" width="360" height="280" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="210" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#4F46E5">解題四步法框架</text>
    
    <!-- 步骤流程 -->
    <rect x="50" y="140" width="70" height="40" rx="8" fill="url(#stepGrad)"/>
    <text x="85" y="165" text-anchor="middle" font-size="14" fill="white">審題</text>
    <text x="85" y="195" text-anchor="middle" font-size="11" fill="#6B7280">圈關鍵詞</text>
    
    <line x1="120" y1="160" x2="150" y2="160" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="155" y="140" width="70" height="40" rx="8" fill="url(#stepGrad)"/>
    <text x="190" y="165" text-anchor="middle" font-size="14" fill="white">列式</text>
    <text x="190" y="195" text-anchor="middle" font-size="11" fill="#6B7280">找關係</text>
    
    <line x1="225" y1="160" x2="255" y2="160" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="260" y="140" width="70" height="40" rx="8" fill="url(#stepGrad)"/>
    <text x="295" y="165" text-anchor="middle" font-size="14" fill="white">計算</text>
    <text x="295" y="195" text-anchor="middle" font-size="11" fill="#6B7280">細心算</text>
    
    <line x1="330" y1="160" x2="360" y2="160" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <rect x="365" y="140" width="70" height="40" rx="8" fill="#10B981"/>
    <text x="400" y="165" text-anchor="middle" font-size="14" fill="white">驗算</text>
    <text x="400" y="195" text-anchor="middle" font-size="11" fill="#6B7280">檢查答</text>

    <!-- 框架说明 -->
    <rect x="50" y="230" width="320" height="120" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="210" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#4F46E5">審題重點示例</text>
    <text x="65" y="280" font-size="13" fill="#374151">• 「總共」→ 加法 / 「剩下」→ 減法</text>
    <text x="65" y="305" font-size="13" fill="#374151">• 「平均分」→ 除法 / 「倍數」→ 乘法</text>
    <text x="65" y="330" font-size="13" fill="#374151">• 檢查單位是否統一</text>

    <!-- 满分策略卡 -->
    <rect x="410" y="90" width="160" height="280" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)"/>
    <text x="490" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#F59E0B">✨ 滿分策略</text>
    
    <!-- 策略点 -->
    <circle cx="430" cy="150" r="6" fill="#F59E0B"/>
    <text x="445" y="155" font-size="13" fill="#374151">圈畫關鍵數字</text>
    
    <circle cx="430" cy="185" r="6" fill="#F59E0B"/>
    <text x="445" y="190" font-size="13" fill="#374151">寫完整算式</text>
    
    <circle cx="430" cy="220" r="6" fill="#F59E0B"/>
    <text x="445" y="225" font-size="13" fill="#374151">分步列式計算</text>
    
    <circle cx="430" cy="255" r="6" fill="#F59E0B"/>
    <text x="445" y="260" font-size="13" fill="#374151">帶單位作答</text>
    
    <circle cx="430" cy="290" r="6" fill="#F59E0B"/>
    <text x="445" y="295" font-size="13" fill="#374151">逆向驗算檢查</text>
    
    <circle cx="430" cy="325" r="6" fill="#F59E0B"/>
    <text x="445" y="330" font-size="13" fill="#374151">字跡清晰工整</text>

    <!-- 底部鼓励语 -->
    <rect x="30" y="385" width="540" height="25" rx="8" fill="#10B981"/>
    <text x="300" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="white">掌握框架 · 運用策略 · 滿分在握！</text>
</svg>