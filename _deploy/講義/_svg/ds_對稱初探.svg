<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="60%" stop-color="#d6e8f7"/>
      <stop offset="100%" stop-color="#b8d4ed"/>
    </radialGradient>

    <!-- 卡片1：蝴蝶 - 多層漸變 -->
    <linearGradient id="butterflyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="50%" stop-color="#c44dff"/>
      <stop offset="100%" stop-color="#6b4dff"/>
    </linearGradient>
    <linearGradient id="butterflyGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9a56"/>
      <stop offset="50%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#c44dff"/>
    </linearGradient>
    <radialGradient id="butterflySpot" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff7a0"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </radialGradient>

    <!-- 卡片2：折紙 - 3D光影 -->
    <linearGradient id="paperGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="paperGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <linearGradient id="paperShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </linearGradient>

    <!-- 卡片3：對稱軸 - 放射漸變 -->
    <radialGradient id="axisGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="70%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="2" flood-color="rgba(255,255,255,0.3)"/>
    </filter>

    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="0"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feFlood flood-color="rgba(255,255,255,0.4)"/>
      <feComposite operator="in" in2="blur"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- 虛線樣式 -->
    <style>
      .dashed-line { stroke-dasharray: 6 4; stroke-width: 2.5; stroke-linecap: round; }
      .label-text { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-weight: bold; fill: #333; }
      .sub-label { font-family: 'Arial', 'Microsoft YaHei', sans-serif; font-size: 11px; fill: #666; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- 標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Arial', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" fill="#2c3e50" filter="url(#cardShadow)">🦋 對稱初探 · 蝴蝶與折紙</text>

  <!-- ============ 卡片1：蝴蝶軸對稱 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="48" width="270" height="160" rx="14" fill="white" opacity="0.95"/>
    <rect x="20" y="48" width="270" height="160" rx="14" fill="url(#butterflyGrad1)" opacity="0.08"/>
  </g>

  <!-- 卡片1 標題 -->
  <text x="155" y="72" text-anchor="middle" class="label-text" font-size="13">🦋 蝴蝶軸對稱</text>

  <!-- 蝴蝶左翅 -->
  <g>
    <!-- 左大翅 -->
    <ellipse cx="120" cy="120" rx="48" ry="36" fill="url(#butterflyGrad1)" opacity="0.85" transform="rotate(-8, 120, 120)"/>
    <ellipse cx="120" cy="120" rx="48" ry="36" fill="url(#paperShadow)" opacity="0.3" transform="rotate(-8, 120, 120)"/>
    <!-- 左小翅 -->
    <ellipse cx="110" cy="160" rx="32" ry="22" fill="url(#butterflyGrad2)" opacity="0.75" transform="rotate(5, 110, 160)"/>
    <!-- 左翅斑點 -->
    <circle cx="105" cy="110" r="6" fill="url(#butterflySpot)" opacity="0.8"/>
    <circle cx="130" cy="118" r="4" fill="url(#butterflySpot)" opacity="0.6"/>
    <circle cx="100" cy="155" r="4" fill="url(#butterflySpot)" opacity="0.7"/>
  </g>

  <!-- 蝴蝶身體 -->
  <ellipse cx="155" cy="138" rx="5" ry="28" fill="#4a3728" opacity="0.8"/>
  <!-- 觸角 -->
  <path d="M155 112 Q148 98 140 92" stroke="#4a3728" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M155 112 Q162 98 170 92" stroke="#4a3728" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="140" cy="92" r="2.5" fill="#4a3728"/>
  <circle cx="170" cy="92" r="2.5" fill="#4a3728"/>

  <!-- 蝴蝶右翅 -->
  <g>
    <ellipse cx="190" cy="120" rx="48" ry="36" fill="url(#butterflyGrad2)" opacity="0.85" transform="rotate(8, 190, 120)"/>
    <ellipse cx="190" cy="120" rx="48" ry="36" fill="url(#paperShadow)" opacity="0.3" transform="rotate(8, 190, 120)"/>
    <ellipse cx="200" cy="160" rx="32" ry="22" fill="url(#butterflyGrad1)" opacity="0.75" transform="rotate(-5, 200, 160)"/>
    <circle cx="205" cy="110" r="6" fill="url(#butterflySpot)" opacity="0.8"/>
    <circle cx="180" cy="118" r="4" fill="url(#butterflySpot)" opacity="0.6"/>
    <circle cx="210" cy="155" r="4" fill="url(#butterflySpot)" opacity="0.7"/>
  </g>

  <!-- 對稱軸虛線 -->
  <line x1="155" y1="80" x2="155" y2="195" class="dashed-line" stroke="#e74c3c" stroke-width="2.5"/>
  <!-- 軸標籤 -->
  <text x="155" y="208" text-anchor="middle" class="sub-label" fill="#e74c3c">對稱軸</text>

  <!-- 左右標註 -->
  <text x="80" y="200" text-anchor="middle" class="sub-label">左</text>
  <text x="230" y="200" text-anchor="middle" class="sub-label">右</text>

  <!-- ============ 卡片2：折紙實驗 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="48" width="270" height="160" rx="14" fill="white" opacity="0.95"/>
    <rect x="310" y="48" width="270" height="160" rx="14" fill="url(#paperGrad1)" opacity="0.06"/>
  </g>

  <text x="445" y="72" text-anchor="middle" class="label-text" font-size="13">📐 折紙實驗</text>

  <!-- 折紙 - 左半 -->
  <g>
    <polygon points="370,100 445,100 445,175 370,175" fill="url(#paperGrad1)" opacity="0.7" stroke="#0288d1" stroke-width="1"/>
    <!-- 折紙紋理 -->
    <line x1="370" y1="115" x2="445" y2="115" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
    <line x1="370" y1="130" x2="445" y2="130" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
    <line x1="370" y1="145" x2="445" y2="145" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
    <line x1="370" y1="160" x2="445" y2="160" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
  </g>

  <!-- 折紙 - 右半（折起效果） -->
  <g>
    <polygon points="445,100 520,100 520,175 445,175" fill="url(#paperGrad2)" opacity="0.85" stroke="#0277bd" stroke-width="1"/>
    <!-- 3D 光影效果 -->
    <polygon points="445,100 520,100 520,175 445,175" fill="url(#paperShadow)" opacity="0.25"/>
    <!-- 折痕高光 -->
    <line x1="445" y1="100" x2="445" y2="175" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  </g>

  <!-- 折疊箭頭 -->
  <path d="M510,115 Q525,115 525,130 Q525,140 515,140" stroke="#e74c3c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="515,136 510,140 515,144" fill="#e74c3c"/>

  <!-- 對稱軸虛線 -->
  <line x1="445" y1="88" x2="445" y2="188" class="dashed-line" stroke="#e74c3c" stroke-width="2.5"/>

  <!-- 標籤 -->
  <text x="408" y="192" text-anchor="middle" class="sub-label">對摺</text>
  <text x="482" y="192" text-anchor="middle" class="sub-label">翻開</text>

  <!-- ============ 卡片3：對稱軸圖示 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="222" width="300" height="160" rx="14" fill="white" opacity="0.95"/>
    <rect x="150" y="222" width="300" height="160" rx="14" fill="url(#axisGrad)" opacity="0.06"/>
  </g>

  <text x="300" y="248" text-anchor="middle" class="label-text" font-size="13">🎯 對稱軸 · 虛線標示</text>

  <!-- 圖形1：左右對稱 -->
  <g>
    <rect x="185" y="265" width="40" height="50" rx="4" fill="#e74c3c" opacity="0.7"/>
    <rect x="225" y="265" width="40" height="50" rx="4" fill="#e74c3c" opacity="0.7"/>
    <line x1="225" y1="260" x2="225" y2="320" class="dashed-line" stroke="#e74c3c" stroke-width="2"/>
    <text x="225" y="338" text-anchor="middle" class="sub-label">左右對稱</text>
  </g>

  <!-- 圖形2：上下對稱 -->
  <g>
    <rect x="290" y="265" width="50" height="25" rx="4" fill="#2196f3" opacity="0.7"/>
    <rect x="290" y="290" width="50" height="25" rx="4" fill="#2196f3" opacity="0.7"/>
    <line x1="285" y1="290" x2="345" y2="290" class="dashed-line" stroke="#2196f3" stroke-width="2"/>
    <text x="315" y="338" text-anchor="middle" class="sub-label">上下對稱</text>
  </g>

  <!-- 圖形3：斜向對稱 -->
  <g>
    <polygon points="390,270 410,310 370,310" fill="#ff9800" opacity="0.7"/>
    <polygon points="410,270 430,310 390,310" fill="#ff9800" opacity="0.7"/>
    <line x1="390" y1="270" x2="430" y2="310" class="dashed-line" stroke="#ff9800" stroke-width="2"/>
    <text x="410" y="338" text-anchor="middle" class="sub-label">斜向對稱</text>
  </g>

  <!-- 底部裝飾線 -->
  <line x1="180" y1="352" x2="420" y2="352" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>

  <!-- 底部提示 -->
  <text x="300" y="372" text-anchor="middle" font-family="'Arial', 'Microsoft YaHei', sans-serif" font-size="10" fill="#999">💡 沿著對稱軸摺疊，兩邊可以完全重合</text>

  <!-- 裝飾小元素 -->
  <circle cx="35" cy="30" r="3" fill="#ff6b9d" opacity="0.4"/>
  <circle cx="565" cy="30" r="3" fill="#4fc3f7" opacity="0.4"/>
  <circle cx="35" cy="375" r="3" fill="#66bb6a" opacity="0.4"/>
  <circle cx="565" cy="375" r="3" fill="#ff9800" opacity="0.4"/>
</svg>