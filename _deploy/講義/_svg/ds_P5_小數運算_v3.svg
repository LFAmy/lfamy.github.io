<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#d6e4ff"/>
    </radialGradient>

    <!-- 卡片1：加法 - 藍色系 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="50%" stop-color="#357abd"/>
      <stop offset="100%" stop-color="#2a6cb5"/>
    </linearGradient>
    <radialGradient id="card1Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片2：減法 - 綠色系 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5cb85c"/>
      <stop offset="50%" stop-color="#4a9e4a"/>
      <stop offset="100%" stop-color="#3d8b3d"/>
    </linearGradient>
    <radialGradient id="card2Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片3：乘法 - 紫色系 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6"/>
      <stop offset="50%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#7d3c98"/>
    </linearGradient>
    <radialGradient id="card3Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片4：除法 - 橙色系 -->
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="50%" stop-color="#d35400"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <radialGradient id="card4Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="rgba(0,0,0,0.25)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="rgba(255,255,255,0.2)"/>
    </filter>

    <!-- 小數點發光 -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="#2c3e50" letter-spacing="2">
    小數運算定位規則
  </text>
  <line x1="180" y1="48" x2="420" y2="48" stroke="#4a90d9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- ==================== 卡片1：加法 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="62" width="270" height="145" rx="14" fill="url(#card1Grad)"/>
    <rect x="20" y="62" width="270" height="145" rx="14" fill="url(#card1Shine)"/>
    <!-- 內光邊 -->
    <rect x="20" y="62" width="270" height="145" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  </g>

  <text x="155" y="90" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#ffffff">加法 · 小數點對齊</text>

  <!-- 加法算式視覺化 -->
  <g transform="translate(45, 105)">
    <!-- 3.25 -->
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">3</text>
    <circle cx="28" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="36" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">2 5</text>

    <!-- 加號 -->
    <text x="80" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffe066">+</text>

    <!-- 1.4 -->
    <text x="110" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">1</text>
    <circle cx="138" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="146" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">4</text>

    <!-- 等號 -->
    <text x="175" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffe066">=</text>

    <!-- 4.65 -->
    <text x="205" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">4</text>
    <circle cx="233" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="241" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">6 5</text>
  </g>

  <!-- 對齊箭頭標示 -->
  <g transform="translate(45, 140)">
    <line x1="26" y1="0" x2="26" y2="18" stroke="#ffe066" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="136" y1="0" x2="136" y2="18" stroke="#ffe066" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="231" y1="0" x2="231" y2="18" stroke="#ffe066" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="26" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#ffe066">小數點</text>
    <text x="26" y="42" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#ffe066">對齊</text>
  </g>

  <!-- ==================== 卡片2：減法 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="62" width="270" height="145" rx="14" fill="url(#card2Grad)"/>
    <rect x="310" y="62" width="270" height="145" rx="14" fill="url(#card2Shine)"/>
    <rect x="310" y="62" width="270" height="145" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  </g>

  <text x="445" y="90" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#ffffff">減法 · 借位對齊</text>

  <g transform="translate(335, 105)">
    <!-- 5.73 -->
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">5</text>
    <circle cx="28" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="36" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">7 3</text>

    <!-- 減號 -->
    <text x="80" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffe066">−</text>

    <!-- 2.18 -->
    <text x="110" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">2</text>
    <circle cx="138" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="146" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">1 8</text>

    <!-- 等號 -->
    <text x="175" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffe066">=</text>

    <!-- 3.55 -->
    <text x="205" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">3</text>
    <circle cx="233" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="241" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">5 5</text>
  </g>

  <!-- 借位標示 -->
  <g transform="translate(335, 140)">
    <text x="55" y="15" font-family="'Courier New',monospace" font-size="13" fill="#ffe066" font-weight="bold">借位</text>
    <path d="M50,20 Q55,28 60,20" stroke="#ffe066" fill="none" stroke-width="1.5"/>
    <text x="160" y="15" font-family="'Courier New',monospace" font-size="13" fill="#ffe066" font-weight="bold">借位</text>
    <path d="M155,20 Q160,28 165,20" stroke="#ffe066" fill="none" stroke-width="1.5"/>
  </g>

  <!-- ==================== 卡片3：乘法 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="222" width="270" height="145" rx="14" fill="url(#card3Grad)"/>
    <rect x="20" y="222" width="270" height="145" rx="14" fill="url(#card3Shine)"/>
    <rect x="20" y="222" width="270" height="145" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  </g>

  <text x="155" y="250" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#ffffff">乘法 · 末位對齊</text>

  <g transform="translate(45, 268)">
    <!-- 2.3 -->
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">2</text>
    <circle cx="28" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="36" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">3</text>

    <text x="80" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffe066">×</text>

    <!-- 1.2 -->
    <text x="110" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">1</text>
    <circle cx="138" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="146" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">2</text>

    <text x="175" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffe066">=</text>

    <!-- 2.76 -->
    <text x="205" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">2</text>
    <circle cx="233" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="241" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">7 6</text>
  </g>

  <!-- 末位對齊標示 -->
  <g transform="translate(45, 300)">
    <line x1="50" y1="0" x2="50" y2="18" stroke="#ffe066" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="160" y1="0" x2="160" y2="18" stroke="#ffe066" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="105" y="30" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#ffe066">末位對齊，小數點</text>
    <text x="105" y="42" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#ffe066">最後再點</text>
  </g>

  <!-- ==================== 卡片4：除法 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="222" width="270" height="145" rx="14" fill="url(#card4Grad)"/>
    <rect x="310" y="222" width="270" height="145" rx="14" fill="url(#card4Shine)"/>
    <rect x="310" y="222" width="270" height="145" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  </g>

  <text x="445" y="250" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="15" font-weight="bold" fill="#ffffff">除法 · 小數點上移</text>

  <g transform="translate(340, 265)">
    <!-- 除法算式：6.4 ÷ 2 = 3.2 -->
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">6</text>
    <circle cx="28" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="36" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">4</text>

    <text x="70" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffe066">÷</text>

    <text x="100" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">2</text>

    <text x="130" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffe066">=</text>

    <text x="160" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">3</text>
    <circle cx="188" cy="-4" r="4" fill="url(#dotGlow)"/>
    <text x="196" y="0" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff">2</text>
  </g>

  <!-- 小數點上移標示 -->
  <g transform="translate(340, 300)">
    <line x1="26" y1="0" x2="26" y2="18" stroke="#ffe066" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="186" y1="0" x2="186" y2="18" stroke="#ffe066" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M26,22 L26,30 L186,30 L186,22" stroke="#ffe066" fill="none" stroke-width="1.5"/>
    <polygon points="186,22 180,26 186,30" fill="#ffe066"/>
    <text x="106" y="42" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="10" fill="#ffe066">小數點直接上移</text>
  </g>

  <!-- 底部裝飾 -->
  <g transform="translate(300, 385)">
    <circle cx="-80" cy="0" r="3" fill="#4a90d9" opacity="0.4"/>
    <circle cx="-40" cy="0" r="2" fill="#5cb85c" opacity="0.4"/>
    <circle cx="0" cy="0" r="3" fill="#9b59b6" opacity="0.4"/>
    <circle cx="40" cy="0" r="2" fill="#e67e22" opacity="0.4"/>
    <circle cx="80" cy="0" r="3" fill="#4a90d9" opacity="0.4"/>
  </g>
</svg>