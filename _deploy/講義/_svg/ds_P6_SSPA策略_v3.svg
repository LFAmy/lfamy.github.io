<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1a2a6c"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>

    <!-- 主卡片漸變 - 時間分配 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ee5a24"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>

    <!-- 主卡片漸變 - 目標階梯 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48dbfb"/>
      <stop offset="50%" stop-color="#0abde3"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </linearGradient>

    <!-- 放射漸變3D光影 - 時間圓環 -->
    <radialGradient id="ringGrad1" cx="35%" cy="30%" r="65%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#ffd32a"/>
      <stop offset="40%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#e84118"/>
    </radialGradient>

    <radialGradient id="ringGrad2" cx="35%" cy="30%" r="65%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#7bed9f"/>
      <stop offset="40%" stop-color="#2ed573"/>
      <stop offset="100%" stop-color="#009432"/>
    </radialGradient>

    <radialGradient id="ringGrad3" cx="35%" cy="30%" r="65%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#eccc68"/>
      <stop offset="40%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#d35400"/>
    </radialGradient>

    <!-- 階梯漸變 -->
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a29bfe"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fd79a8"/>
      <stop offset="100%" stop-color="#e84393"/>
    </linearGradient>

    <!-- 發光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <!-- 內部高光 -->
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="1.5" fill="#fff" opacity="0.15"/>
  <circle cx="150" cy="30" r="1" fill="#fff" opacity="0.1"/>
  <circle cx="550" cy="60" r="1.5" fill="#fff" opacity="0.12"/>
  <circle cx="480" cy="380" r="1" fill="#fff" opacity="0.1"/>
  <circle cx="80" cy="370" r="1.5" fill="#fff" opacity="0.12"/>
  <circle cx="300" cy="20" r="1" fill="#fff" opacity="0.08"/>
  <circle cx="520" cy="200" r="1" fill="#fff" opacity="0.08"/>
  <circle cx="30" cy="200" r="1" fill="#fff" opacity="0.08"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff" filter="url(#glow)">SSPA 策略</text>
  <text x="300" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a0b4d0">香港小學數學 — 時間分配與目標階梯</text>

  <!-- ==================== 左側：時間分配 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="70" width="270" height="310" rx="16" fill="#1e2a4a" opacity="0.9"/>
    <rect x="20" y="70" width="270" height="310" rx="16" fill="url(#innerHighlight)"/>
  </g>

  <text x="155" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ff9f43">⏱ 時間分配</text>

  <!-- 時間圓環 1 - 基礎運算 40% -->
  <g filter="url(#doubleShadow)">
    <circle cx="100" cy="170" r="45" fill="none" stroke="#1a2a4a" stroke-width="10"/>
    <circle cx="100" cy="170" r="45" fill="none" stroke="url(#ringGrad1)" stroke-width="10"
            stroke-dasharray="283 283" stroke-dashoffset="113" stroke-linecap="round"
            transform="rotate(-90 100 170)"/>
    <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffd32a">40%</text>
    <text x="100" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ff9f43">基礎運算</text>
  </g>

  <!-- 時間圓環 2 - 應用題 30% -->
  <g filter="url(#doubleShadow)">
    <circle cx="210" cy="170" r="45" fill="none" stroke="#1a2a4a" stroke-width="10"/>
    <circle cx="210" cy="170" r="45" fill="none" stroke="url(#ringGrad2)" stroke-width="10"
            stroke-dasharray="283 283" stroke-dashoffset="170" stroke-linecap="round"
            transform="rotate(-90 210 170)"/>
    <text x="210" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7bed9f">30%</text>
    <text x="210" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2ed573">應用題</text>
  </g>

  <!-- 時間圓環 3 - 圖形與空間 30% -->
  <g filter="url(#doubleShadow)">
    <circle cx="100" cy="270" r="45" fill="none" stroke="#1a2a4a" stroke-width="10"/>
    <circle cx="100" cy="270" r="45" fill="none" stroke="url(#ringGrad3)" stroke-width="10"
            stroke-dasharray="283 283" stroke-dashoffset="170" stroke-linecap="round"
            transform="rotate(-90 100 270)"/>
    <text x="100" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f1c40f">30%</text>
    <text x="100" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#eccc68">圖形與空間</text>
  </g>

  <!-- 時間圓環 4 - 數據處理 20% (小圓) -->
  <g filter="url(#doubleShadow)">
    <circle cx="210" cy="270" r="35" fill="none" stroke="#1a2a4a" stroke-width="8"/>
    <circle cx="210" cy="270" r="35" fill="none" stroke="#a29bfe" stroke-width="8"
            stroke-dasharray="220 220" stroke-dashoffset="132" stroke-linecap="round"
            transform="rotate(-90 210 270)"/>
    <text x="210" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#a29bfe">20%</text>
    <text x="210" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#a29bfe">數據</text>
  </g>

  <!-- 時間分配提示 -->
  <rect x="40" y="330" width="230" height="36" rx="8" fill="#ff9f43" opacity="0.15"/>
  <text x="155" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffd32a">💡 基礎運算佔比最高，需優先掌握</text>
  <text x="155" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ff9f43" opacity="0.7">每日練習 20 分鐘，持之以恆</text>

  <!-- ==================== 右側：目標階梯 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="310" y="70" width="270" height="310" rx="16" fill="#1e2a4a" opacity="0.9"/>
    <rect x="310" y="70" width="270" height="310" rx="16" fill="url(#innerHighlight)"/>
  </g>

  <text x="445" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#48dbfb">🎯 目標階梯</text>

  <!-- 階梯 1 - 基礎 -->
  <g filter="url(#doubleShadow)">
    <rect x="340" y="310" width="210" height="40" rx="10" fill="url(#stepGrad1)" opacity="0.9"/>
    <rect x="340" y="310" width="210" height="40" rx="10" fill="#fff" opacity="0.05"/>
    <text x="370" y="335" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">第 1 階</text>
    <text x="430" y="335" font-family="Arial, sans-serif" font-size="11" fill="#d4f1ff">掌握基礎運算</text>
    <circle cx="355" cy="330" r="8" fill="#fff" opacity="0.2"/>
    <text x="355" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">1</text>
  </g>

  <!-- 階梯 2 -->
  <g filter="url(#doubleShadow)">
    <rect x="350" y="265" width="190" height="40" rx="10" fill="url(#stepGrad2)" opacity="0.9"/>
    <rect x="350" y="265" width="190" height="40" rx="10" fill="#fff" opacity="0.05"/>
    <text x="380" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">第 2 階</text>
    <text x="440" y="290" font-family="Arial, sans-serif" font-size="11" fill="#e8dfff">解應用題技巧</text>
    <circle cx="365" cy="285" r="8" fill="#fff" opacity="0.2"/>
    <text x="365" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">2</text>
  </g>

  <!-- 階梯 3 -->
  <g filter="url(#doubleShadow)">
    <rect x="360" y="220" width="170" height="40" rx="10" fill="url(#stepGrad3)" opacity="0.9"/>
    <rect x="360" y="220" width="170" height="40" rx="10" fill="#fff" opacity="0.05"/>
    <text x="390" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">第 3 階</text>
    <text x="450" y="245" font-family="Arial, sans-serif" font-size="11" fill="#ffe0ec">圖形與空間概念</text>
    <circle cx="375" cy="240" r="8" fill="#fff" opacity="0.2"/>
    <text x="375" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">3</text>
  </g>

  <!-- 階梯 4 - 頂端 -->
  <g filter="url(#doubleShadow)">
    <rect x="370" y="175" width="150" height="40" rx="10" fill="#f1c40f" opacity="0.9"/>
    <rect x="370" y="175" width="150" height="40" rx="10" fill="#fff" opacity="0.1"/>
    <text x="400" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a2a6c">第 4 階</text>
    <text x="460" y="200" font-family="Arial, sans-serif" font-size="11" fill="#1a2a6c">數據分析能力</text>
    <circle cx="385" cy="195" r="8" fill="#fff" opacity="0.3"/>
    <text x="385" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1a2a6c">4</text>
  </g>

  <!-- 頂點目標 -->
  <g filter="url(#glow)">
    <polygon points="445,130 460,155 430,155" fill="#f1c40f" opacity="0.8"/>
    <text x="445" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#1a2a6c">★</text>
  </g>
  <text x="445" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f1c40f">SSPA 達標</text>

  <!-- 階梯連接線 -->
  <line x1="445" y1="175" x2="445" y2="160" stroke="#f1c40f" stroke-width="1.5" opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="445" y1="220" x2="445" y2="215" stroke="#fd79a8" stroke-width="1.5" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="445" y1="265" x2="445" y2="260" stroke="#a29bfe" stroke-width="1.5" opacity="0.3" stroke-dasharray="3 3"/>
  <line x1="445" y1="310" x2="445" y2="305" stroke="#00d2ff" stroke-width="1.5" opacity="0.3" stroke-dasharray="3 3"/>

  <!-- 階梯提示 -->
  <rect x="330" y="355" width="230" height="25" rx="8" fill="#48dbfb" opacity="0.12"/>
  <text x="445" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#48dbfb">📈 每完成一階，離目標更進一步</text>

</svg>