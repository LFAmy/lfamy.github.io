<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <!-- 半圓主體漸變（多層） -->
    <linearGradient id="semicircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="25%" stop-color="#29B6F6"/>
      <stop offset="50%" stop-color="#039BE5"/>
      <stop offset="75%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>

    <!-- 半圓3D光影（放射漸變） -->
    <radialGradient id="semicircle3D" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#81D4FA" stop-opacity="0.9"/>
      <stop offset="20%" stop-color="#4FC3F7" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#29B6F6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0288D1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#01579B" stop-opacity="0.8"/>
    </radialGradient>

    <!-- 半圓高光 -->
    <radialGradient id="highlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 半徑線漸變 -->
    <linearGradient id="radiusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>

    <!-- 直徑線漸變 -->
    <linearGradient id="diameterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AB47BC"/>
      <stop offset="50%" stop-color="#8E24AA"/>
      <stop offset="100%" stop-color="#6A1B9A"/>
    </linearGradient>

    <!-- 弧長線漸變 -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="50%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>

    <!-- 陰影濾鏡（雙層陰影） -->
    <filter id="shadowDouble" x="-10%" y="-10%" width="130%" height="140%">
      <!-- 第一層陰影（柔和外擴） -->
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A237E" flood-opacity="0.15"/>
      <!-- 第二層陰影（深色集中） -->
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D47A1" flood-opacity="0.25"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1A237E" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A237E" flood-opacity="0.15"/>
    </filter>

    <!-- 標籤陰影 -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- 半圓裁剪路徑 -->
    <clipPath id="semicircleClip">
      <path d="M 120 280 A 180 180 0 0 1 480 280 Z"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" ry="20" fill="url(#bgGrad)"/>

  <!-- 圓角卡片 -->
  <rect x="20" y="20" width="560" height="360" rx="16" ry="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="22" font-weight="700" fill="#1A237E" letter-spacing="2">
    📐 半圓 Semicircle
  </text>
  <line x1="180" y1="70" x2="420" y2="70" stroke="#1A237E" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- 半圓主體（底層） -->
  <path d="M 120 280 A 180 180 0 0 1 480 280 Z" fill="url(#semicircleGrad)" filter="url(#shadowDouble)"/>

  <!-- 半圓3D光影層 -->
  <path d="M 120 280 A 180 180 0 0 1 480 280 Z" fill="url(#semicircle3D)"/>

  <!-- 半圓高光層 -->
  <path d="M 120 280 A 180 180 0 0 1 480 280 Z" fill="url(#highlight)"/>

  <!-- 半圓邊框 -->
  <path d="M 120 280 A 180 180 0 0 1 480 280 Z" fill="none" stroke="#01579B" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- 直徑線（底部） -->
  <line x1="120" y1="280" x2="480" y2="280" stroke="url(#diameterGrad)" stroke-width="2.5" stroke-dasharray="none"/>
  <!-- 直徑線發光 -->
  <line x1="120" y1="280" x2="480" y2="280" stroke="#CE93D8" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 半徑線（從圓心到頂部） -->
  <line x1="300" y1="280" x2="300" y2="100" stroke="url(#radiusGrad)" stroke-width="2.5"/>
  <!-- 半徑線發光 -->
  <line x1="300" y1="280" x2="300" y2="100" stroke="#FFAB91" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 圓心點 -->
  <circle cx="300" cy="280" r="5" fill="#E64A19"/>
  <circle cx="300" cy="280" r="2.5" fill="#FFFFFF"/>

  <!-- 弧長指示（頂部弧線） -->
  <path d="M 160 140 Q 300 80 440 140" fill="none" stroke="url(#arcGrad)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 160 140 Q 300 80 440 140" fill="none" stroke="#A5D6A7" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 弧長箭頭 -->
  <polygon points="155,138 162,135 160,142" fill="#43A047"/>
  <polygon points="445,138 438,135 440,142" fill="#43A047"/>

  <!-- 標籤：半徑 r -->
  <text x="308" y="200" font-family="'Times New Roman', 'Georgia', serif" font-size="20" font-weight="700" font-style="italic" fill="#E64A19" filter="url(#textShadow)">
    r
  </text>

  <!-- 標籤：直徑 d -->
  <text x="290" y="310" font-family="'Times New Roman', 'Georgia', serif" font-size="20" font-weight="700" font-style="italic" fill="#8E24AA" filter="url(#textShadow)">
    d = 2r
  </text>

  <!-- 標籤：弧長 -->
  <text x="310" y="105" font-family="'Times New Roman', 'Georgia', serif" font-size="17" font-weight="700" fill="#43A047" filter="url(#textShadow)">
    πr
  </text>

  <!-- 公式卡片 - 面積 -->
  <rect x="70" y="325" width="210" height="42" rx="10" ry="10" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="80" y="352" font-family="'Times New Roman', 'Georgia', serif" font-size="18" font-weight="700" fill="#1565C0">
    面積 = πr²/2
  </text>

  <!-- 公式卡片 - 周長 -->
  <rect x="320" y="325" width="215" height="42" rx="10" ry="10" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1.5"/>
  <text x="330" y="352" font-family="'Times New Roman', 'Georgia', serif" font-size="18" font-weight="700" fill="#7B1FA2">
    周長 = πr + 2r
  </text>

  <!-- 裝飾小點 -->
  <circle cx="50" cy="50" r="3" fill="#4FC3F7" opacity="0.3"/>
  <circle cx="555" cy="45" r="4" fill="#AB47BC" opacity="0.25"/>
  <circle cx="45" cy="355" r="3.5" fill="#66BB6A" opacity="0.25"/>
  <circle cx="558" cy="358" r="3" fill="#FF7043" opacity="0.25"/>
</svg>