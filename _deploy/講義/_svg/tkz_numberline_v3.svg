<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid-dot" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#D0D6DE"/>
    </pattern>

    <!-- 數線卡片背景漸層（多層漸變） -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F8FAFE"/>
      <stop offset="60%" stop-color="#F0F4FC"/>
      <stop offset="85%" stop-color="#EAF0FA"/>
      <stop offset="100%" stop-color="#E4ECF8"/>
    </linearGradient>

    <!-- 數線主體漸層（3D光影效果） -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7"/>
      <stop offset="25%" stop-color="#6B9AFE"/>
      <stop offset="50%" stop-color="#3D6FE3"/>
      <stop offset="75%" stop-color="#2D5BD1"/>
      <stop offset="100%" stop-color="#1A44B8"/>
    </linearGradient>

    <!-- 數線光澤效果 -->
    <linearGradient id="lineShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 整數點放射漸層（3D球體效果） -->
    <radialGradient id="pointGrad" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#E8F0FE"/>
      <stop offset="50%" stop-color="#7BAAF9"/>
      <stop offset="80%" stop-color="#3D6FE3"/>
      <stop offset="100%" stop-color="#1A44B8"/>
    </radialGradient>

    <!-- 分數點放射漸層 -->
    <radialGradient id="pointGradSmall" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F0F6FF"/>
      <stop offset="55%" stop-color="#9BBDFA"/>
      <stop offset="85%" stop-color="#5A8CF0"/>
      <stop offset="100%" stop-color="#2D5BD1"/>
    </radialGradient>

    <!-- 整數點高光 -->
    <radialGradient id="pointHighlight" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 雙層陰影：數線卡片 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#A0B4D0" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#889AB8" flood-opacity="0.12"/>
    </filter>

    <!-- 雙層陰影：整數點 -->
    <filter id="pointShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#2D5BD1" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A44B8" flood-opacity="0.15"/>
    </filter>

    <!-- 刻度標記漸層 -->
    <linearGradient id="tickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A8CF0"/>
      <stop offset="100%" stop-color="#2D5BD1"/>
    </linearGradient>

    <linearGradient id="tickGradSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89B0F8"/>
      <stop offset="100%" stop-color="#5A8CF0"/>
    </linearGradient>

    <!-- 數字文字漸層 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D4A8A"/>
      <stop offset="100%" stop-color="#1A3568"/>
    </linearGradient>

    <!-- 分數文字漸層 -->
    <linearGradient id="textGradSmall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7CF7"/>
      <stop offset="100%" stop-color="#2D5BD1"/>
    </linearGradient>

    <!-- 箭頭漸層 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A7CF7"/>
      <stop offset="100%" stop-color="#2D5BD1"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#grid-dot)"/>

  <!-- 標題區域 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="18" font-weight="700" fill="url(#textGrad)" letter-spacing="1">📏 數線 0 — 10</text>

  <!-- 數線卡片 -->
  <rect x="40" y="145" width="520" height="130" rx="16" ry="16" fill="url(#cardBg)" filter="url(#cardShadow)" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>

  <!-- 卡片內邊框光澤 -->
  <rect x="40" y="145" width="520" height="130" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>

  <!-- 數線主體 - 粗線 -->
  <rect x="70" y="200" width="460" height="10" rx="5" ry="5" fill="url(#lineGrad)"/>
  <!-- 數線光澤層 -->
  <rect x="70" y="200" width="460" height="5" rx="5" ry="5" fill="url(#lineShine)"/>

  <!-- 左箭頭 -->
  <polygon points="70,205 58,198 58,212" fill="url(#arrowGrad)" opacity="0.6"/>
  <!-- 右箭頭 -->
  <polygon points="530,205 542,198 542,212" fill="url(#arrowGrad)" opacity="0.6"/>

  <!-- 整數刻度標記（0-10） -->
  <g filter="url(#pointShadow)">
    <!-- 整數點 -->
    <circle cx="75" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="75" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="120" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="120" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="165" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="165" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="210" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="210" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="255" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="255" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="300" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="300" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="345" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="345" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="390" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="390" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="435" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="435" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="480" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="480" cy="205" r="10" fill="url(#pointHighlight)"/>
    <circle cx="525" cy="205" r="10" fill="url(#pointGrad)"/>
    <circle cx="525" cy="205" r="10" fill="url(#pointHighlight)"/>
  </g>

  <!-- 整數刻度線 -->
  <g stroke="url(#tickGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="75" y1="195" x2="75" y2="185"/>
    <line x1="120" y1="195" x2="120" y2="185"/>
    <line x1="165" y1="195" x2="165" y2="185"/>
    <line x1="210" y1="195" x2="210" y2="185"/>
    <line x1="255" y1="195" x2="255" y2="185"/>
    <line x1="300" y1="195" x2="300" y2="185"/>
    <line x1="345" y1="195" x2="345" y2="185"/>
    <line x1="390" y1="195" x2="390" y2="185"/>
    <line x1="435" y1="195" x2="435" y2="185"/>
    <line x1="480" y1="195" x2="480" y2="185"/>
    <line x1="525" y1="195" x2="525" y2="185"/>
  </g>

  <!-- 整數數字標籤 -->
  <g font-family="'Arial', 'Helvetica', sans-serif" font-size="14" font-weight="700" fill="url(#textGrad)" text-anchor="middle">
    <text x="75" y="178">0</text>
    <text x="120" y="178">1</text>
    <text x="165" y="178">2</text>
    <text x="210" y="178">3</text>
    <text x="255" y="178">4</text>
    <text x="300" y="178">5</text>
    <text x="345" y="178">6</text>
    <text x="390" y="178">7</text>
    <text x="435" y="178">8</text>
    <text x="480" y="178">9</text>
    <text x="525" y="178">10</text>
  </g>

  <!-- 分數刻度標記（每兩個整數之間3個小點） -->
  <g>
    <!-- 0-1之間 -->
    <circle cx="86.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="97.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="108.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <!-- 1-2之間 -->
    <circle cx="131.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="142.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="153.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <!-- 2-3之間 -->
    <circle cx="176.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="187.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="198.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <!-- 3-4之間 -->
    <circle cx="221.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="232.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="243.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <!-- 4-5之間 -->
    <circle cx="266.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="277.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="288.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <!-- 5-6之間 -->
    <circle cx="311.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="322.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="333.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <!-- 6-7之間 -->
    <circle cx="356.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="367.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="378.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <!-- 7-8之間 -->
    <circle cx="401.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="412.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="423.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <!-- 8-9之間 -->
    <circle cx="446.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="457.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="468.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <!-- 9-10之間 -->
    <circle cx="491.25" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="502.5" cy="205" r="4" fill="url(#pointGradSmall)"/>
    <circle cx="513.75" cy="205" r="4" fill="url(#pointGradSmall)"/>
  </g>

  <!-- 分數刻度線（短線） -->
  <g stroke="url(#tickGradSmall)" stroke-width="1.5" stroke-linecap="round">
    <!-- 0-1之間 -->
    <line x1="86.25" y1="198" x2="86.25" y2="192"/>
    <line x1="97.5" y1="198" x2="97.5" y2="192"/>
    <line x1="108.75" y1="198" x2="108.75" y2="192"/>
    <!-- 1-2之間 -->
    <line x1="131.25" y1="198" x2="131.25" y2="192"/>
    <line x1="142.5" y1="198" x2="142.5" y2="192"/>
    <line x1="153.75" y1="198" x2="153.75" y2="192"/>
    <!-- 2-3之間 -->
    <line x1="176.25" y1="198" x2="176.25" y2="192"/>
    <line x1="187.5" y1="198" x2="187.5" y2="192"/>
    <line x1="198.75" y1="198" x2="198.75" y2="192"/>
    <!-- 3-4之間 -->
    <line x1="221.25" y1="198" x2="221.25" y2="192"/>
    <line x1="232.5" y1="198" x2="232.5" y2="192"/>
    <line x1="243.75" y1="198" x2="243.75" y2="192"/>
    <!-- 4-5之間 -->
    <line x1="266.25" y1="198" x2="266.25" y2="192"/>
    <line x1="277.5" y1="198" x2="277.5" y2="192"/>
    <line x1="288.75" y1="198" x2="288.75" y2="192"/>
    <!-- 5-6之間 -->
    <line x1="311.25" y1="198" x2="311.25" y2="192"/>
    <line x1="322.5" y1="198" x2="322.5" y2="192"/>
    <line x1="333.75" y1="198" x2="333.75" y2="192"/>
    <!-- 6-7之間 -->
    <line x1="356.25" y1="198" x2="356.25" y2="192"/>
    <line x1="367.5" y1="198" x2="367.5" y2="192"/>
    <line x1="378.75" y1="198" x2="378.75" y2="192"/>
    <!-- 7-8之間 -->
    <line x1="401.25" y1="198" x2="401.25" y2="192"/>
    <line x1="412.5" y1="198" x2="412.5" y2="192"/>
    <line x1="423.75" y1="198" x2="423.75" y2="192"/>
    <!-- 8-9之間 -->
    <line x1="446.25" y1="198" x2="446.25" y2="192"/>
    <line x1="457.5" y1="198" x2="457.5" y2="192"/>
    <line x1="468.75" y1="198" x2="468.75" y2="192"/>
    <!-- 9-10之間 -->
    <line x1="491.25" y1="198" x2="491.25" y2="192"/>
    <line x1="502.5" y1="198" x2="502.5" y2="192"/>
    <line x1="513.75" y1="198" x2="513.75" y2="192"/>
  </g>

  <!-- 分數標籤（選取代表性分數：1/4, 1/2, 3/4） -->
  <g font-family="'Arial', 'Helvetica', sans-serif" font-size="9" fill="url(#textGradSmall)" text-anchor="middle">
    <!-- 0-1之間 -->
    <text x="86.25" y="222">¼</text>
    <text x="97.5" y="222">½</text>
    <text x="108.75" y="222">¾</text>
    <!-- 1-2之間 -->
    <text x="131.25" y="222">¼</text>
    <text x="142.5" y="222">½</text>
    <text x="153.75" y="222">¾</text>
    <!-- 2-3之間 -->
    <text x="176.25" y="222">¼</text>
    <text x="187.5" y="222">½</text>
    <text x="198.75" y="222">¾</text>
    <!-- 3-4之間 -->
    <text x="221.25" y="222">¼</text>
    <text x="232.5" y="222">½</text>
    <text x="243.75" y="222">¾</text>
    <!-- 4-5之間 -->
    <text x="266.25" y="222">¼</text>
    <text x="277.5" y="222">½</text>
    <text x="288.75" y="222">¾</text>
    <!-- 5-6之間 -->
    <text x="311.25" y="222">¼</text>
    <text x="322.5" y="222">½</text>
    <text x="333.75" y="222">¾</text>
    <!-- 6-7之間 -->
    <text x="356.25" y="222">¼</text>
    <text x="367.5" y="222">½</text>
    <text x="378.75" y="222">¾</text>
    <!-- 7-8之間 -->
    <text x="401.25" y="222">¼</text>
    <text x="412.5" y="222">½</text>
    <text x="423.75" y="222">¾</text>
    <!-- 8-9之間 -->
    <text x="446.25" y="222">¼</text>
    <text x="457.5" y="222">½</text>
    <text x="468.75" y="222">¾</text>
    <!-- 9-10之間 -->
    <text x="491.25" y="222">¼</text>
    <text x="502.5" y="222">½</text>
    <text x="513.75" y="222">¾</text>
  </g>

  <!-- 底部說明區域 -->
  <text x="300" y="310" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="12" fill="#7A8FAD" letter-spacing="0.5">
    ● 整數點（0-10）  ● 分數點（¼, ½, ¾）
  </text>

  <!-- 底部裝飾線 -->
  <line x1="180" y1="325" x2="420" y2="325" stroke="#DCE3ED" stroke-width="1" stroke-linecap="round"/>

  <!-- 裝飾元素 - 左上角 -->
  <circle cx="55" cy="60" r="3" fill="#D0D6DE" opacity="0.5"/>
  <circle cx="70" cy="55" r="2" fill="#D0D6DE" opacity="0.3"/>
  <circle cx="65" cy="70" r="1.5" fill="#D0D6DE" opacity="0.4"/>

  <!-- 裝飾元素 - 右上角 -->
  <circle cx="545" cy="60" r="3" fill="#D0D6DE" opacity="0.5"/>
  <circle cx="530" cy="55" r="2" fill="#D0D6DE" opacity="0.3"/>
  <circle cx="535" cy="70" r="1.5" fill="#D0D6DE" opacity="0.4"/>
</svg>