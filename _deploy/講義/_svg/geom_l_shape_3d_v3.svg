<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F4F8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <!-- 主體 L 形柱體 - 頂面漸層（5 層） -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A9E"/>
      <stop offset="25%" stop-color="#FAD0C4"/>
      <stop offset="50%" stop-color="#FFD1FF"/>
      <stop offset="75%" stop-color="#A18CD1"/>
      <stop offset="100%" stop-color="#FBC2EB"/>
    </linearGradient>

    <!-- 主體 L 形柱體 - 正面漸層（5 層） -->
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="20%" stop-color="#764ba2"/>
      <stop offset="40%" stop-color="#6B8DD6"/>
      <stop offset="70%" stop-color="#8E37D7"/>
      <stop offset="100%" stop-color="#5B2C8E"/>
    </linearGradient>

    <!-- 主體 L 形柱體 - 右側面漸層（5 層） -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="25%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#43e97b"/>
      <stop offset="75%" stop-color="#38f9d7"/>
      <stop offset="100%" stop-color="#36D1DC"/>
    </linearGradient>

    <!-- 分解長方體 A - 頂面 -->
    <linearGradient id="topA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE985"/>
      <stop offset="30%" stop-color="#FA742B"/>
      <stop offset="60%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>

    <!-- 分解長方體 A - 正面 -->
    <linearGradient id="frontA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A5C"/>
      <stop offset="30%" stop-color="#FF6B35"/>
      <stop offset="60%" stop-color="#E85D3A"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>

    <!-- 分解長方體 A - 右側面 -->
    <linearGradient id="rightA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="30%" stop-color="#FF8C00"/>
      <stop offset="60%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>

    <!-- 分解長方體 B - 頂面 -->
    <linearGradient id="topB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89F7FE"/>
      <stop offset="30%" stop-color="#66A6FF"/>
      <stop offset="60%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#2E6BB5"/>
    </linearGradient>

    <!-- 分解長方體 B - 正面 -->
    <linearGradient id="frontB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="30%" stop-color="#357ABD"/>
      <stop offset="60%" stop-color="#2C689C"/>
      <stop offset="100%" stop-color="#1A4A7A"/>
    </linearGradient>

    <!-- 分解長方體 B - 右側面 -->
    <linearGradient id="rightB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="30%" stop-color="#3498DB"/>
      <stop offset="60%" stop-color="#2980B9"/>
      <stop offset="100%" stop-color="#1F6FA5"/>
    </linearGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="-1" dy="2" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="1" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- 放射漸變 3D 光影 -->
    <radialGradient id="highlight" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
    </radialGradient>

    <!-- 放射漸變 3D 光影 - 分解 -->
    <radialGradient id="highlightA" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </radialGradient>

    <radialGradient id="highlightB" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </radialGradient>

    <!-- 箭頭標記 -->
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#E74C3C"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- 頂部標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50" letter-spacing="1">L 形柱體體積 — 分解計算</text>

  <!-- ==================== 左側：主體 L 形柱體 ==================== -->
  <g transform="translate(55, 55)" filter="url(#shadow)">
    <!-- L 形柱體 - 頂面 -->
    <!-- 水平部分頂面 -->
    <polygon points="0,0 120,0 120,50 0,50" fill="url(#topFace)" stroke="#8E44AD" stroke-width="1.2"/>
    <!-- 垂直部分頂面（後方延伸） -->
    <polygon points="0,50 120,50 120,100 0,100" fill="url(#topFace)" stroke="#8E44AD" stroke-width="1.2" opacity="0.85"/>

    <!-- L 形柱體 - 正面 -->
    <!-- 水平部分正面 -->
    <polygon points="0,50 120,50 120,140 0,140" fill="url(#frontFace)" stroke="#5B2C8E" stroke-width="1.2"/>
    <!-- 垂直部分正面（右側延伸） -->
    <polygon points="120,50 170,50 170,140 120,140" fill="url(#frontFace)" stroke="#5B2C8E" stroke-width="1.2" opacity="0.9"/>

    <!-- L 形柱體 - 右側面 -->
    <!-- 水平部分右側面 -->
    <polygon points="120,0 170,0 170,50 120,50" fill="url(#rightFace)" stroke="#2E86C1" stroke-width="1.2"/>
    <!-- 垂直部分右側面 -->
    <polygon points="170,0 220,0 220,140 170,140" fill="url(#rightFace)" stroke="#2E86C1" stroke-width="1.2"/>

    <!-- 3D 光影疊加 -->
    <polygon points="0,0 120,0 120,50 0,50" fill="url(#highlight)" opacity="0.6"/>
    <polygon points="0,50 120,50 120,140 0,140" fill="url(#highlight)" opacity="0.4"/>
    <polygon points="120,0 170,0 170,50 120,50" fill="url(#highlight)" opacity="0.5"/>

    <!-- 尺寸標註 - 長度 -->
    <line x1="0" y1="155" x2="170" y2="155" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="85" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E74C3C">a</text>

    <!-- 尺寸標註 - 寬度 -->
    <line x1="185" y1="0" x2="185" y2="140" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="200" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E74C3C" transform="rotate(90,200,75)">b</text>

    <!-- 尺寸標註 - 高度 -->
    <line x1="-15" y1="0" x2="-15" y2="140" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="-30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E74C3C" transform="rotate(-90,-30,75)">h</text>

    <!-- 標籤 -->
    <text x="85" y="100" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" opacity="0.9">L 形柱體</text>
  </g>

  <!-- ==================== 右側：分解為兩個長方體 ==================== -->

  <!-- 長方體 A（水平部分） -->
  <g transform="translate(310, 80)" filter="url(#shadowLight)">
    <!-- 頂面 -->
    <polygon points="0,0 100,0 100,40 0,40" fill="url(#topA)" stroke="#D35400" stroke-width="1"/>
    <!-- 正面 -->
    <polygon points="0,40 100,40 100,110 0,110" fill="url(#frontA)" stroke="#C0392B" stroke-width="1"/>
    <!-- 右側面 -->
    <polygon points="100,0 140,0 140,110 100,110" fill="url(#rightA)" stroke="#D35400" stroke-width="1"/>
    <!-- 3D 光影 -->
    <polygon points="0,0 100,0 100,40 0,40" fill="url(#highlightA)" opacity="0.5"/>
    <polygon points="0,40 100,40 100,110 0,110" fill="url(#highlightA)" opacity="0.3"/>

    <!-- 尺寸標註 -->
    <line x1="0" y1="125" x2="100" y2="125" stroke="#E74C3C" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="50" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C">a₁</text>

    <line x1="150" y1="0" x2="150" y2="110" stroke="#E74C3C" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="163" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C" transform="rotate(90,163,58)">b</text>

    <line x1="-12" y1="0" x2="-12" y2="110" stroke="#E74C3C" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="-25" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C" transform="rotate(-90,-25,58)">h</text>

    <text x="50" y="80" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" opacity="0.9">長方體 A</text>
  </g>

  <!-- 長方體 B（垂直部分） -->
  <g transform="translate(430, 50)" filter="url(#shadowLight)">
    <!-- 頂面 -->
    <polygon points="0,0 70,0 70,35 0,35" fill="url(#topB)" stroke="#1F6FA5" stroke-width="1"/>
    <!-- 正面 -->
    <polygon points="0,35 70,35 70,140 0,140" fill="url(#frontB)" stroke="#1A4A7A" stroke-width="1"/>
    <!-- 右側面 -->
    <polygon points="70,0 105,0 105,140 70,140" fill="url(#rightB)" stroke="#1F6FA5" stroke-width="1"/>
    <!-- 3D 光影 -->
    <polygon points="0,0 70,0 70,35 0,35" fill="url(#highlightB)" opacity="0.5"/>
    <polygon points="0,35 70,35 70,140 0,140" fill="url(#highlightB)" opacity="0.3"/>

    <!-- 尺寸標註 -->
    <line x1="0" y1="155" x2="70" y2="155" stroke="#E74C3C" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="35" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C">a₂</text>

    <line x1="115" y1="0" x2="115" y2="140" stroke="#E74C3C" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="128" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C" transform="rotate(90,128,73)">b</text>

    <line x1="-12" y1="0" x2="-12" y2="140" stroke="#E74C3C" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="-25" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#E74C3C" transform="rotate(-90,-25,73)">h</text>

    <text x="35" y="95" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" opacity="0.9">長方體 B</text>
  </g>

  <!-- ==================== 公式區域 ==================== -->
  <g transform="translate(290, 310)">
    <!-- 公式卡片背景 -->
    <rect x="0" y="0" width="290" height="75" rx="12" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1" opacity="0.95" filter="url(#shadowLight)"/>

    <!-- 公式文字 -->
    <text x="20" y="25" font-family="'Microsoft YaHei', 'Noto Sans HK', Arial, sans-serif" font-size="13" font-weight="bold" fill="#2C3E50">
      <tspan x="20" dy="0">體積 = 長方體 A 體積 + 長方體 B 體積</tspan>
      <tspan x="20" dy="22" fill="#E74C3C">V = a₁ × b × h + a₂ × b × h</tspan>
    </text>
  </g>

  <!-- ==================== 連接箭頭（從主體到分解） ==================== -->
  <g>
    <path d="M230,140 C260,140 280,160 300,180" stroke="#E74C3C" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <path d="M240,200 C270,210 290,200 310,190" stroke="#E74C3C" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  </g>

  <!-- ==================== 裝飾元素 ==================== -->
  <!-- 左上角裝飾 -->
  <circle cx="15" cy="15" r="4" fill="#FF6B6B" opacity="0.6"/>
  <circle cx="28" cy="15" r="4" fill="#FFD93D" opacity="0.6"/>
  <circle cx="41" cy="15" r="4" fill="#6BCB77" opacity="0.6"/>

  <!-- 右下角裝飾 -->
  <circle cx="585" cy="385" r="4" fill="#FF6B6B" opacity="0.4"/>
  <circle cx="572" cy="385" r="4" fill="#FFD93D" opacity="0.4"/>
  <circle cx="559" cy="385" r="4" fill="#6BCB77" opacity="0.4"/>
</svg>