<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>

    <!-- 卡片1：設x - 藍色系 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <radialGradient id="card1Shine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 卡片2：列方程 - 紫色系 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a18cd1"/>
      <stop offset="100%" style="stop-color:#fbc2eb"/>
    </linearGradient>
    <radialGradient id="card2Shine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 卡片3：解方程 - 綠色系 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b"/>
      <stop offset="100%" style="stop-color:#38f9d7"/>
    </linearGradient>
    <radialGradient id="card3Shine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 卡片4：驗算 - 橙色系 -->
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a"/>
      <stop offset="100%" style="stop-color:#fee140"/>
    </linearGradient>
    <radialGradient id="card4Shine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.1"/>
    </filter>

    <!-- 輕微陰影 -->
    <filter id="lightShadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- 發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="30" fill="#ffffff" opacity="0.03"/>
  <circle cx="550" cy="350" r="40" fill="#ffffff" opacity="0.03"/>
  <circle cx="520" cy="60" r="20" fill="#ffffff" opacity="0.02"/>
  <circle cx="80" cy="340" r="25" fill="#ffffff" opacity="0.02"/>

  <!-- 標題 -->
  <text x="300" y="42" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#glow)">📐 方程應用四步法</text>
  <line x1="160" y1="52" x2="440" y2="52" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============ 卡片1：設x ============ -->
  <g filter="url(#doubleShadow)">
    <rect x="25" y="72" width="260" height="130" rx="16" fill="url(#card1Grad)"/>
    <rect x="25" y="72" width="260" height="130" rx="16" fill="url(#card1Shine)"/>
  </g>
  <!-- 步驟編號 -->
  <circle cx="45" cy="92" r="14" fill="#ffffff" opacity="0.3"/>
  <text x="45" y="97" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
  <!-- 標題 -->
  <text x="68" y="98" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">設 x</text>
  <!-- 內容 -->
  <text x="45" y="125" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffffff" opacity="0.95">設未知數為 x</text>
  <text x="45" y="148" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffffff" opacity="0.95">例：設小明有 x 個蘋果</text>
  <!-- 裝飾圖標 -->
  <text x="230" y="175" font-size="28" opacity="0.3">❓</text>

  <!-- ============ 卡片2：列方程 ============ -->
  <g filter="url(#doubleShadow)">
    <rect x="315" y="72" width="260" height="130" rx="16" fill="url(#card2Grad)"/>
    <rect x="315" y="72" width="260" height="130" rx="16" fill="url(#card2Shine)"/>
  </g>
  <circle cx="335" cy="92" r="14" fill="#ffffff" opacity="0.3"/>
  <text x="335" y="97" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
  <text x="358" y="98" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">列方程</text>
  <text x="335" y="125" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffffff" opacity="0.95">根據題意列出等式</text>
  <text x="335" y="148" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffffff" opacity="0.95">例：2x + 3 = 11</text>
  <text x="520" y="175" font-size="28" opacity="0.3">📝</text>

  <!-- 箭頭 1→2 -->
  <g filter="url(#lightShadow)">
    <line x1="290" y1="137" x2="308" y2="137" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" marker-end="url(#arrowWhite)"/>
  </g>

  <!-- ============ 卡片3：解方程 ============ -->
  <g filter="url(#doubleShadow)">
    <rect x="25" y="225" width="260" height="130" rx="16" fill="url(#card3Grad)"/>
    <rect x="25" y="225" width="260" height="130" rx="16" fill="url(#card3Shine)"/>
  </g>
  <circle cx="45" cy="245" r="14" fill="#ffffff" opacity="0.3"/>
  <text x="45" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
  <text x="68" y="251" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">解方程</text>
  <text x="45" y="278" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffffff" opacity="0.95">運用運算規則求解</text>
  <text x="45" y="301" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffffff" opacity="0.95">例：x = (11-3)÷2 = 4</text>
  <text x="230" y="328" font-size="28" opacity="0.3">🧮</text>

  <!-- ============ 卡片4：驗算 ============ -->
  <g filter="url(#doubleShadow)">
    <rect x="315" y="225" width="260" height="130" rx="16" fill="url(#card4Grad)"/>
    <rect x="315" y="225" width="260" height="130" rx="16" fill="url(#card4Shine)"/>
  </g>
  <circle cx="335" cy="245" r="14" fill="#ffffff" opacity="0.3"/>
  <text x="335" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>
  <text x="358" y="251" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="bold" fill="#ffffff">驗算</text>
  <text x="335" y="278" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffffff" opacity="0.95">代入結果檢查等式</text>
  <text x="335" y="301" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#ffffff" opacity="0.95">例：2×4+3=11 ✓</text>
  <text x="520" y="328" font-size="28" opacity="0.3">✅</text>

  <!-- 箭頭 2→3 -->
  <g filter="url(#lightShadow)">
    <line x1="435" y1="207" x2="435" y2="218" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="431,218 435,226 439,218" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- 箭頭 3→4 -->
  <g filter="url(#lightShadow)">
    <line x1="290" y1="290" x2="308" y2="290" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="305,286 313,290 305,294" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- 底部提示 -->
  <text x="300" y="385" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#ffffff" opacity="0.3">💡 按順序完成四步，輕鬆解決方程應用題！</text>
</svg>