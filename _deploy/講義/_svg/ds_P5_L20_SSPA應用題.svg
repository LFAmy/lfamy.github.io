<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0F4F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8EDF3;stop-opacity:1" />
    </linearGradient>

    <!-- 讀 - 藍色漸變 -->
    <linearGradient id="gradRead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#5BA0E8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3A7BC8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B6CB0;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radRead" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#7BB8F0;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#4A90D9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2B6CB0;stop-opacity:0" />
    </radialGradient>

    <!-- 列 - 綠色漸變 -->
    <linearGradient id="gradList" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38B2AC;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#4DD1C8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2C9A94;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F7E78;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radList" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#6EE0D8;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#38B2AC;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1F7E78;stop-opacity:0" />
    </radialGradient>

    <!-- 解 - 橙色漸變 -->
    <linearGradient id="gradSolve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ED8936;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#F6A85C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#DD6B20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C05621;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radSolve" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FBC48A;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#ED8936;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#C05621;stop-opacity:0" />
    </radialGradient>

    <!-- 查 - 紫色漸變 -->
    <linearGradient id="gradCheck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9F7AEA;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#B794F4;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#805AD5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B46C1;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radCheck" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#D0B4F8;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#9F7AEA;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6B46C1;stop-opacity:0" />
    </radialGradient>

    <!-- 陰影濾鏡 -->
    <filter id="shadowOuter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#1A202C" flood-opacity="0.25"/>
    </filter>
    <filter id="shadowInner" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#1A202C" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowCard" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#2D3748" flood-opacity="0.2"/>
    </filter>
    <filter id="shadowLight" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.5"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#4A90D9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#38B2AC"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#ED8936"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#9F7AEA"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題區域 -->
  <text x="300" y="42" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK','Noto Sans HK',sans-serif" font-size="22" font-weight="bold" fill="#2D3748" filter="url(#shadowLight)">📐 SSPA 應用衝刺 · 四步解題法</text>
  <line x1="120" y1="54" x2="480" y2="54" stroke="#CBD5E0" stroke-width="1" opacity="0.6"/>

  <!-- ===== 卡片 1：讀 ===== -->
  <g filter="url(#shadowCard)">
    <rect x="30" y="75" width="115" height="130" rx="16" fill="url(#gradRead)"/>
    <rect x="30" y="75" width="115" height="130" rx="16" fill="url(#radRead)"/>
    <!-- 高光邊 -->
    <rect x="30" y="75" width="115" height="130" rx="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <!-- 內陰影 -->
    <rect x="32" y="77" width="111" height="126" rx="14" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  </g>
  <text x="87" y="115" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="32" fill="white" filter="url(#shadowLight)">📖</text>
  <text x="87" y="152" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="20" font-weight="bold" fill="white">讀</text>
  <text x="87" y="176" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">仔細閱讀</text>
  <text x="87" y="192" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">理解題意</text>

  <!-- 箭頭 1→2 -->
  <line x1="150" y1="140" x2="195" y2="140" stroke="#4A90D9" stroke-width="3" marker-end="url(#arrowBlue)" stroke-linecap="round"/>
  <text x="172" y="132" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#4A90D9" font-weight="bold">步驟①</text>

  <!-- ===== 卡片 2：列 ===== -->
  <g filter="url(#shadowCard)">
    <rect x="205" y="75" width="115" height="130" rx="16" fill="url(#gradList)"/>
    <rect x="205" y="75" width="115" height="130" rx="16" fill="url(#radList)"/>
    <rect x="205" y="75" width="115" height="130" rx="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <rect x="207" y="77" width="111" height="126" rx="14" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  </g>
  <text x="262" y="115" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="32" fill="white" filter="url(#shadowLight)">📝</text>
  <text x="262" y="152" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="20" font-weight="bold" fill="white">列</text>
  <text x="262" y="176" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">列出算式</text>
  <text x="262" y="192" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">建立方程</text>

  <!-- 箭頭 2→3 -->
  <line x1="325" y1="140" x2="370" y2="140" stroke="#38B2AC" stroke-width="3" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <text x="347" y="132" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#38B2AC" font-weight="bold">步驟②</text>

  <!-- ===== 卡片 3：解 ===== -->
  <g filter="url(#shadowCard)">
    <rect x="380" y="75" width="115" height="130" rx="16" fill="url(#gradSolve)"/>
    <rect x="380" y="75" width="115" height="130" rx="16" fill="url(#radSolve)"/>
    <rect x="380" y="75" width="115" height="130" rx="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <rect x="382" y="77" width="111" height="126" rx="14" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  </g>
  <text x="437" y="115" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="32" fill="white" filter="url(#shadowLight)">🧮</text>
  <text x="437" y="152" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="20" font-weight="bold" fill="white">解</text>
  <text x="437" y="176" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">計算求解</text>
  <text x="437" y="192" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">得出答案</text>

  <!-- 箭頭 3→4（向下） -->
  <line x1="437" y1="210" x2="437" y2="260" stroke="#ED8936" stroke-width="3" marker-end="url(#arrowOrange)" stroke-linecap="round"/>
  <text x="452" y="238" text-anchor="start" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#ED8936" font-weight="bold">步驟③</text>

  <!-- ===== 卡片 4：查 ===== -->
  <g filter="url(#shadowCard)">
    <rect x="380" y="270" width="115" height="100" rx="16" fill="url(#gradCheck)"/>
    <rect x="380" y="270" width="115" height="100" rx="16" fill="url(#radCheck)"/>
    <rect x="380" y="270" width="115" height="100" rx="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <rect x="382" y="272" width="111" height="96" rx="14" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  </g>
  <text x="437" y="305" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="28" fill="white" filter="url(#shadowLight)">✅</text>
  <text x="437" y="335" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="20" font-weight="bold" fill="white">查</text>
  <text x="437" y="356" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">驗算檢查</text>

  <!-- 箭頭 4→1（循環：向左再向上） -->
  <path d="M 380 320 L 87 320 L 87 210" fill="none" stroke="#9F7AEA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/>
  <text x="233" y="338" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#9F7AEA" font-weight="bold">步驟④ 循環複習</text>

  <!-- 循環標示弧線 -->
  <path d="M 87 210 Q 60 175 87 140" fill="none" stroke="#9F7AEA" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" opacity="0.5"/>

  <!-- 底部提示 -->
  <rect x="130" y="358" width="340" height="30" rx="15" fill="white" opacity="0.7" filter="url(#shadowCard)"/>
  <text x="300" y="378" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="#4A5568">💡 按「讀 → 列 → 解 → 查」順序，穩步解決應用題</text>
</svg>