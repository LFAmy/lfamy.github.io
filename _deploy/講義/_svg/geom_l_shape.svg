<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 長方形A（垂直部分）多層漸變 - 藍色系 -->
    <linearGradient id="rectAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="25%" stop-color="#5B9FE8"/>
      <stop offset="50%" stop-color="#3A7BC8"/>
      <stop offset="75%" stop-color="#2D6BB5"/>
      <stop offset="100%" stop-color="#1E5799"/>
    </linearGradient>

    <!-- 長方形B（水平部分）多層漸變 - 橙色系 -->
    <linearGradient id="rectBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="25%" stop-color="#FFB840"/>
      <stop offset="50%" stop-color="#E8961A"/>
      <stop offset="75%" stop-color="#D4850E"/>
      <stop offset="100%" stop-color="#B86C00"/>
    </linearGradient>

    <!-- 長方形A 3D光影放射漸變 -->
    <radialGradient id="rectAShine" cx="30%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.2)"/>
    </radialGradient>

    <!-- 長方形B 3D光影放射漸變 -->
    <radialGradient id="rectBShine" cx="30%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 - 長方形A -->
    <filter id="shadowA" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="rgba(30,87,153,0.3)"/>
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 雙層陰影濾鏡 - 長方形B -->
    <filter id="shadowB" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="rgba(184,108,0,0.3)"/>
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 卡片陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.08)"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.05)"/>
    </filter>

    <!-- 標籤卡片陰影 -->
    <filter id="labelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.12)"/>
    </filter>

    <!-- 尺寸標註箭頭標記 -->
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
    <marker id="arrowLeft" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#666"/>
    </marker>
    <marker id="arrowDown" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <path d="M0,0 L3,8 L6,0" fill="#666"/>
    </marker>
    <marker id="arrowUp" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
      <path d="M0,8 L3,0 L6,8" fill="#666"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 主卡片容器 -->
  <rect x="20" y="15" width="560" height="370" rx="16" ry="16" fill="#FFFFFF" filter="url(#cardShadow)" stroke="#E8ECF0" stroke-width="1"/>

  <!-- 標題 -->
  <text x="300" y="52" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="20" font-weight="700" fill="#2C3E50">📐 L形面積 — 分割相加法</text>
  <line x1="180" y1="62" x2="420" y2="62" stroke="#4A90D9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- ==================== L形主圖 ==================== -->
  <g transform="translate(85, 95)">

    <!-- 長方形A（垂直部分）— 先畫在底層 -->
    <rect x="0" y="0" width="90" height="170" rx="6" ry="6" fill="url(#rectAGrad)" filter="url(#shadowA)"/>
    <rect x="0" y="0" width="90" height="170" rx="6" ry="6" fill="url(#rectAShine)"/>

    <!-- 長方形B（水平部分）— 後畫在上層 -->
    <rect x="70" y="110" width="180" height="70" rx="6" ry="6" fill="url(#rectBGrad)" filter="url(#shadowB)"/>
    <rect x="70" y="110" width="180" height="70" rx="6" ry="6" fill="url(#rectBShine)"/>

    <!-- 分割虛線 -->
    <line x1="90" y1="0" x2="90" y2="110" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
    <line x1="70" y1="110" x2="70" y2="180" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>

    <!-- 長方形A 標籤 -->
    <g filter="url(#labelShadow)">
      <rect x="18" y="65" width="54" height="36" rx="8" ry="8" fill="rgba(255,255,255,0.92)"/>
      <text x="45" y="82" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" font-weight="700" fill="#1E5799">A</text>
      <text x="45" y="96" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#4A90D9">長方形</text>
    </g>

    <!-- 長方形B 標籤 -->
    <g filter="url(#labelShadow)">
      <rect x="128" y="125" width="54" height="36" rx="8" ry="8" fill="rgba(255,255,255,0.92)"/>
      <text x="155" y="142" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" font-weight="700" fill="#B86C00">B</text>
      <text x="155" y="156" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#F5A623">長方形</text>
    </g>

    <!-- ===== 尺寸標註 ===== -->

    <!-- 長方形A 寬度（頂部） -->
    <line x1="0" y1="-18" x2="90" y2="-18" stroke="#666" stroke-width="1.2" marker-start="url(#arrowLeft)" marker-end="url(#arrowRight)"/>
    <line x1="0" y1="-12" x2="0" y2="-5" stroke="#666" stroke-width="1"/>
    <line x1="90" y1="-12" x2="90" y2="-5" stroke="#666" stroke-width="1"/>
    <text x="45" y="-24" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#666" font-weight="500">a</text>

    <!-- 長方形A 高度（左側） -->
    <line x1="-18" y1="0" x2="-18" y2="170" stroke="#666" stroke-width="1.2" marker-start="url(#arrowUp)" marker-end="url(#arrowDown)"/>
    <line x1="-12" y1="0" x2="-5" y2="0" stroke="#666" stroke-width="1"/>
    <line x1="-12" y1="170" x2="-5" y2="170" stroke="#666" stroke-width="1"/>
    <text x="-24" y="88" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#666" font-weight="500" transform="rotate(-90,-24,88)">b</text>

    <!-- 長方形B 寬度（底部） -->
    <line x1="70" y1="198" x2="250" y2="198" stroke="#666" stroke-width="1.2" marker-start="url(#arrowLeft)" marker-end="url(#arrowRight)"/>
    <line x1="70" y1="192" x2="70" y2="198" stroke="#666" stroke-width="1"/>
    <line x1="250" y1="192" x2="250" y2="198" stroke="#666" stroke-width="1"/>
    <text x="160" y="212" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#666" font-weight="500">c</text>

    <!-- 長方形B 高度（右側） -->
    <line x1="258" y1="110" x2="258" y2="180" stroke="#666" stroke-width="1.2" marker-start="url(#arrowUp)" marker-end="url(#arrowDown)"/>
    <line x1="252" y1="110" x2="258" y2="110" stroke="#666" stroke-width="1"/>
    <line x1="252" y1="180" x2="258" y2="180" stroke="#666" stroke-width="1"/>
    <text x="264" y="148" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#666" font-weight="500" transform="rotate(90,264,148)">d</text>

    <!-- 重疊區域標註 -->
    <text x="80" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" font-weight="500">重疊</text>
  </g>

  <!-- ==================== 公式區域 ==================== -->
  <g transform="translate(380, 100)">
    <!-- 公式卡片背景 -->
    <rect x="0" y="0" width="185" height="150" rx="12" ry="12" fill="#F8FAFE" stroke="#E0E6F0" stroke-width="1"/>

    <text x="92" y="28" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" font-weight="700" fill="#2C3E50">面積公式</text>
    <line x1="25" y1="36" x2="160" y2="36" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- 公式 A -->
    <text x="18" y="62" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" fill="#1E5799" font-weight="600">A = a × b</text>
    <text x="18" y="80" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#4A90D9">= 長 × 寬</text>

    <!-- 公式 B -->
    <text x="18" y="106" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" fill="#B86C00" font-weight="600">B = c × d</text>
    <text x="18" y="124" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#F5A623">= 長 × 寬</text>

    <!-- 總面積 -->
    <line x1="18" y1="134" x2="167" y2="134" stroke="#D0D8E0" stroke-width="0.8" stroke-dasharray="3,3"/>
    <text x="18" y="148" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" fill="#2C3E50" font-weight="700">總面積 = A + B</text>
  </g>

  <!-- ==================== 底部解說 ==================== -->
  <g transform="translate(40, 320)">
    <rect x="0" y="0" width="520" height="50" rx="10" ry="10" fill="#F0F4F8" stroke="#E0E6F0" stroke-width="0.8"/>
    <text x="260" y="22" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="#4A6A8A">💡 將 L 形分割成 2 個長方形，分別計算面積後相加</text>
    <text x="260" y="40" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#7A9AB5">L形面積 = 長方形A面積 + 長方形B面積</text>
  </g>

  <!-- 裝飾小圓點 -->
  <circle cx="35" cy="30" r="3" fill="#4A90D9" opacity="0.3"/>
  <circle cx="565" cy="30" r="3" fill="#F5A623" opacity="0.3"/>
  <circle cx="35" cy="375" r="3" fill="#F5A623" opacity="0.3"/>
  <circle cx="565" cy="375" r="3" fill="#4A90D9" opacity="0.3"/>
</svg>