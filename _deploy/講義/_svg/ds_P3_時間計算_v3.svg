<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="60%" stop-color="#d0eaf8"/>
      <stop offset="100%" stop-color="#b0d4f0"/>
    </radialGradient>

    <!-- 主卡片漸變 - 多層 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fcff"/>
      <stop offset="100%" stop-color="#e6f3ff"/>
    </linearGradient>

    <!-- 時鐘圓形放射漸變 3D -->
    <radialGradient id="clockFace" cx="45%" cy="40%" r="55%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fefefe"/>
      <stop offset="70%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#dce4ec"/>
    </radialGradient>

    <!-- 時鐘邊框 3D -->
    <radialGradient id="clockBorder" cx="40%" cy="35%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#6ab0e6"/>
      <stop offset="50%" stop-color="#3a7cc3"/>
      <stop offset="100%" stop-color="#1a4a7a"/>
    </radialGradient>

    <!-- 時鐘陰影 -->
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#1a4a7a" flood-opacity="0.3"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.5"/>
    </filter>

    <!-- 主卡片雙層陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2a5a8a" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1a4a7a" flood-opacity="0.15"/>
    </filter>

    <!-- 時間線卡片陰影 -->
    <filter id="timelineShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#3a7cc3" flood-opacity="0.2"/>
    </filter>

    <!-- 按鈕漸變 -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ba0e0"/>
      <stop offset="100%" stop-color="#3a7cc3"/>
    </linearGradient>

    <!-- 時間線漸變 -->
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a7cc3"/>
      <stop offset="50%" stop-color="#5ba0e0"/>
      <stop offset="100%" stop-color="#3a7cc3"/>
    </linearGradient>

    <!-- 數字陰影 -->
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- 發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" ry="20" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="30" fill="#ffffff" opacity="0.15"/>
  <circle cx="550" cy="350" r="45" fill="#ffffff" opacity="0.12"/>
  <circle cx="520" cy="60" r="20" fill="#ffffff" opacity="0.1"/>

  <!-- 主卡片 -->
  <rect x="20" y="20" width="560" height="360" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)"/>

  <!-- 標題區域 -->
  <rect x="20" y="20" width="560" height="55" rx="18" ry="18" fill="url(#btnGrad)" opacity="0.9"/>
  <rect x="20" y="55" width="560" height="20" fill="url(#btnGrad)" opacity="0.9"/>

  <!-- 標題文字 -->
  <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#textShadow)">⏰ 時間換算：1小時 = 60分鐘</text>

  <!-- ========== 左側：時鐘 ========== -->
  <!-- 時鐘外框 -->
  <circle cx="165" cy="210" r="105" fill="url(#clockBorder)" filter="url(#clockShadow)"/>
  <circle cx="165" cy="210" r="95" fill="url(#clockFace)"/>

  <!-- 時鐘刻度 - 小時 -->
  <g stroke="#3a5a7a" stroke-width="3" stroke-linecap="round">
    <!-- 12點 -->
    <line x1="165" y1="125" x2="165" y2="140"/>
    <!-- 1點 -->
    <line x1="212" y1="132" x2="206" y2="146"/>
    <!-- 2點 -->
    <line x1="248" y1="163" x2="238" y2="174"/>
    <!-- 3點 -->
    <line x1="260" y1="210" x2="245" y2="210"/>
    <!-- 4點 -->
    <line x1="248" y1="257" x2="238" y2="246"/>
    <!-- 5點 -->
    <line x1="212" y1="288" x2="206" y2="274"/>
    <!-- 6點 -->
    <line x1="165" y1="295" x2="165" y2="280"/>
    <!-- 7點 -->
    <line x1="118" y1="288" x2="124" y2="274"/>
    <!-- 8點 -->
    <line x1="82" y1="257" x2="92" y2="246"/>
    <!-- 9點 -->
    <line x1="70" y1="210" x2="85" y2="210"/>
    <!-- 10點 -->
    <line x1="82" y1="163" x2="92" y2="174"/>
    <!-- 11點 -->
    <line x1="118" y1="132" x2="124" y2="146"/>
  </g>

  <!-- 時鐘刻度 - 分鐘（細線） -->
  <g stroke="#8aaccc" stroke-width="1" opacity="0.6">
    <line x1="165" y1="120" x2="165" y2="128"/>
    <line x1="189" y1="122" x2="186" y2="130"/>
    <line x1="212" y1="128" x2="207" y2="136"/>
    <line x1="233" y1="140" x2="226" y2="146"/>
    <line x1="248" y1="158" x2="240" y2="162"/>
    <line x1="256" y1="180" x2="247" y2="182"/>
    <line x1="260" y1="210" x2="250" y2="210"/>
    <line x1="256" y1="240" x2="247" y2="238"/>
    <line x1="248" y1="262" x2="240" y2="258"/>
    <line x1="233" y1="280" x2="226" y2="274"/>
    <line x1="212" y1="292" x2="207" y2="284"/>
    <line x1="189" y1="298" x2="186" y2="290"/>
    <line x1="165" y1="300" x2="165" y2="292"/>
    <line x1="141" y1="298" x2="144" y2="290"/>
    <line x1="118" y1="292" x2="123" y2="284"/>
    <line x1="97" y1="280" x2="104" y2="274"/>
    <line x1="82" y1="262" x2="90" y2="258"/>
    <line x1="74" y1="240" x2="83" y2="238"/>
    <line x1="70" y1="210" x2="80" y2="210"/>
    <line x1="74" y1="180" x2="83" y2="182"/>
    <line x1="82" y1="158" x2="90" y2="162"/>
    <line x1="97" y1="140" x2="104" y2="146"/>
    <line x1="118" y1="128" x2="123" y2="136"/>
    <line x1="141" y1="122" x2="144" y2="130"/>
  </g>

  <!-- 時鐘數字 -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2a4a6a" text-anchor="middle" dominant-baseline="central">
    <text x="165" y="148">12</text>
    <text x="205" y="153">1</text>
    <text x="238" y="178">2</text>
    <text x="250" y="210">3</text>
    <text x="238" y="242">4</text>
    <text x="205" y="267">5</text>
    <text x="165" y="275">6</text>
    <text x="125" y="267">7</text>
    <text x="92" y="242">8</text>
    <text x="80" y="210">9</text>
    <text x="92" y="178">10</text>
    <text x="125" y="153">11</text>
  </g>

  <!-- 時針（指向 2 點位置） -->
  <g transform="rotate(60, 165, 210)">
    <polygon points="162,210 168,210 165,140" fill="#1a3a5a" opacity="0.9"/>
  </g>

  <!-- 分針（指向 12 點位置） -->
  <g transform="rotate(0, 165, 210)">
    <polygon points="163,210 167,210 165,125" fill="#3a7cc3" opacity="0.85"/>
  </g>

  <!-- 秒針 -->
  <g transform="rotate(180, 165, 210)">
    <line x1="165" y1="215" x2="165" y2="120" stroke="#e04040" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="165" cy="210" r="4" fill="#e04040"/>
  </g>

  <!-- 中心圓點 -->
  <circle cx="165" cy="210" r="5" fill="#2a4a6a"/>
  <circle cx="165" cy="210" r="3" fill="#5ba0e0"/>

  <!-- 時鐘下方標籤 -->
  <rect x="100" y="320" width="130" height="28" rx="14" ry="14" fill="url(#btnGrad)" opacity="0.8"/>
  <text x="165" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">🕐 時鐘</text>

  <!-- ========== 右側：時間線 ========== -->
  <!-- 時間線卡片 -->
  <rect x="300" y="95" width="260" height="250" rx="14" ry="14" fill="#ffffff" filter="url(#timelineShadow)" opacity="0.95"/>

  <!-- 時間線標題 -->
  <text x="430" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2a4a6a">📊 時間線</text>

  <!-- 時間線本體 -->
  <line x1="330" y1="155" x2="530" y2="155" stroke="url(#timelineGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- 時間點 - 0 分鐘 -->
  <circle cx="340" cy="155" r="10" fill="#3a7cc3" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <text x="340" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2a4a6a" font-weight="bold">0 分鐘</text>

  <!-- 時間點 - 15 分鐘 -->
  <circle cx="387" cy="155" r="8" fill="#5ba0e0" stroke="#ffffff" stroke-width="2.5"/>
  <text x="387" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2a4a6a">15</text>

  <!-- 時間點 - 30 分鐘 -->
  <circle cx="430" cy="155" r="8" fill="#5ba0e0" stroke="#ffffff" stroke-width="2.5"/>
  <text x="430" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2a4a6a">30</text>

  <!-- 時間點 - 45 分鐘 -->
  <circle cx="473" cy="155" r="8" fill="#5ba0e0" stroke="#ffffff" stroke-width="2.5"/>
  <text x="473" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2a4a6a">45</text>

  <!-- 時間點 - 60 分鐘 -->
  <circle cx="520" cy="155" r="10" fill="#e04040" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <text x="520" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e04040" font-weight="bold">60 分鐘</text>

  <!-- 等號連接線 -->
  <text x="430" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3a7cc3" font-weight="bold">⟺</text>

  <!-- 換算框 -->
  <rect x="340" y="225" width="180" height="45" rx="10" ry="10" fill="#e8f4fd" stroke="#5ba0e0" stroke-width="1.5"/>
  <text x="430" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2a4a6a" font-weight="bold">1 小時</text>
  <text x="430" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3a7cc3">= 60 分鐘</text>

  <!-- 底部提示 -->
  <rect x="320" y="290" width="220" height="35" rx="8" ry="8" fill="#fff8e0" stroke="#f0d060" stroke-width="1"/>
  <text x="430" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a08020">💡 記住：1 小時 = 60 分鐘</text>

  <!-- 底部裝飾 -->
  <rect x="20" y="360" width="560" height="20" rx="0" ry="0" fill="url(#btnGrad)" opacity="0.6"/>
  <rect x="20" y="360" width="560" height="20" rx="0" ry="10" fill="url(#btnGrad)" opacity="0.6"/>
</svg>