<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </radialGradient>

    <!-- 卡片主體漸變 - 3D立體感 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFE"/>
      <stop offset="100%" stop-color="#E8EDF5"/>
    </linearGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>

    <!-- 格子漸變 - 行1 (紅色系) -->
    <linearGradient id="cellR1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#EE5A24"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </linearGradient>
    <radialGradient id="cellR1G" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF8E8E"/>
      <stop offset="40%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#D63031"/>
    </radialGradient>

    <!-- 格子漸變 - 行2 (橙色系) -->
    <linearGradient id="cellO1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
    <radialGradient id="cellO1G" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="40%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </radialGradient>

    <!-- 格子漸變 - 行3 (藍色系) -->
    <linearGradient id="cellB1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74B9FF"/>
      <stop offset="50%" stop-color="#3498DB"/>
      <stop offset="100%" stop-color="#2980B9"/>
    </linearGradient>
    <radialGradient id="cellB1G" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#A8D8FF"/>
      <stop offset="40%" stop-color="#74B9FF"/>
      <stop offset="100%" stop-color="#2E86DE"/>
    </radialGradient>

    <!-- 格子漸變 - 行4 (紫色系) -->
    <linearGradient id="cellP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A29BFE"/>
      <stop offset="50%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#5B2C6F"/>
    </linearGradient>
    <radialGradient id="cellP1G" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#C8C4FF"/>
      <stop offset="40%" stop-color="#A29BFE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="#1A237E" flood-opacity="0.15"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.5"/>
    </filter>

    <filter id="cellShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.3"/>
    </filter>

    <filter id="cellInnerShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="1" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- 高光 -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 數字漸變 -->
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="80" fill="#E8EDF5" opacity="0.4"/>
  <circle cx="550" cy="350" r="100" fill="#E8EDF5" opacity="0.3"/>
  <circle cx="520" cy="60" r="40" fill="#E8EDF5" opacity="0.3"/>

  <!-- 主卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)"/>

  <!-- 卡片邊框裝飾 -->
  <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <!-- 頂部裝飾條 -->
  <rect x="25" y="20" width="550" height="6" rx="3" fill="url(#titleGrad)" opacity="0.8"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang HK', 'Noto Sans HK', sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" letter-spacing="2">
    ✦ 乘法模型：4 × 6 = 24 ✦
  </text>

  <!-- 分隔線 -->
  <line x1="80" y1="72" x2="520" y2="72" stroke="#E0E5EE" stroke-width="1" opacity="0.6"/>

  <!-- 3D 陣列區域 -->
  <g transform="translate(85, 95)">
    <!-- 行1 (紅色系) -->
    <g>
      <rect x="0" y="0" width="68" height="48" rx="6" fill="url(#cellR1G)" filter="url(#cellShadow)"/>
      <rect x="0" y="0" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="34" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">1</text>

      <rect x="74" y="0" width="68" height="48" rx="6" fill="url(#cellR1G)" filter="url(#cellShadow)"/>
      <rect x="74" y="0" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="108" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">2</text>

      <rect x="148" y="0" width="68" height="48" rx="6" fill="url(#cellR1G)" filter="url(#cellShadow)"/>
      <rect x="148" y="0" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="182" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">3</text>

      <rect x="222" y="0" width="68" height="48" rx="6" fill="url(#cellR1G)" filter="url(#cellShadow)"/>
      <rect x="222" y="0" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="256" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">4</text>

      <rect x="296" y="0" width="68" height="48" rx="6" fill="url(#cellR1G)" filter="url(#cellShadow)"/>
      <rect x="296" y="0" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="330" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">5</text>

      <rect x="370" y="0" width="68" height="48" rx="6" fill="url(#cellR1G)" filter="url(#cellShadow)"/>
      <rect x="370" y="0" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="404" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">6</text>
    </g>

    <!-- 行2 (橙色系) -->
    <g>
      <rect x="0" y="56" width="68" height="48" rx="6" fill="url(#cellO1G)" filter="url(#cellShadow)"/>
      <rect x="0" y="56" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="34" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">7</text>

      <rect x="74" y="56" width="68" height="48" rx="6" fill="url(#cellO1G)" filter="url(#cellShadow)"/>
      <rect x="74" y="56" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="108" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">8</text>

      <rect x="148" y="56" width="68" height="48" rx="6" fill="url(#cellO1G)" filter="url(#cellShadow)"/>
      <rect x="148" y="56" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="182" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">9</text>

      <rect x="222" y="56" width="68" height="48" rx="6" fill="url(#cellO1G)" filter="url(#cellShadow)"/>
      <rect x="222" y="56" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="256" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">10</text>

      <rect x="296" y="56" width="68" height="48" rx="6" fill="url(#cellO1G)" filter="url(#cellShadow)"/>
      <rect x="296" y="56" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="330" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">11</text>

      <rect x="370" y="56" width="68" height="48" rx="6" fill="url(#cellO1G)" filter="url(#cellShadow)"/>
      <rect x="370" y="56" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="404" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">12</text>
    </g>

    <!-- 行3 (藍色系) -->
    <g>
      <rect x="0" y="112" width="68" height="48" rx="6" fill="url(#cellB1G)" filter="url(#cellShadow)"/>
      <rect x="0" y="112" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="34" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">13</text>

      <rect x="74" y="112" width="68" height="48" rx="6" fill="url(#cellB1G)" filter="url(#cellShadow)"/>
      <rect x="74" y="112" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="108" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">14</text>

      <rect x="148" y="112" width="68" height="48" rx="6" fill="url(#cellB1G)" filter="url(#cellShadow)"/>
      <rect x="148" y="112" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="182" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">15</text>

      <rect x="222" y="112" width="68" height="48" rx="6" fill="url(#cellB1G)" filter="url(#cellShadow)"/>
      <rect x="222" y="112" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="256" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">16</text>

      <rect x="296" y="112" width="68" height="48" rx="6" fill="url(#cellB1G)" filter="url(#cellShadow)"/>
      <rect x="296" y="112" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="330" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">17</text>

      <rect x="370" y="112" width="68" height="48" rx="6" fill="url(#cellB1G)" filter="url(#cellShadow)"/>
      <rect x="370" y="112" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="404" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">18</text>
    </g>

    <!-- 行4 (紫色系) -->
    <g>
      <rect x="0" y="168" width="68" height="48" rx="6" fill="url(#cellP1G)" filter="url(#cellShadow)"/>
      <rect x="0" y="168" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="34" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">19</text>

      <rect x="74" y="168" width="68" height="48" rx="6" fill="url(#cellP1G)" filter="url(#cellShadow)"/>
      <rect x="74" y="168" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="108" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">20</text>

      <rect x="148" y="168" width="68" height="48" rx="6" fill="url(#cellP1G)" filter="url(#cellShadow)"/>
      <rect x="148" y="168" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="182" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">21</text>

      <rect x="222" y="168" width="68" height="48" rx="6" fill="url(#cellP1G)" filter="url(#cellShadow)"/>
      <rect x="222" y="168" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="256" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">22</text>

      <rect x="296" y="168" width="68" height="48" rx="6" fill="url(#cellP1G)" filter="url(#cellShadow)"/>
      <rect x="296" y="168" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="330" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">23</text>

      <rect x="370" y="168" width="68" height="48" rx="6" fill="url(#cellP1G)" filter="url(#cellShadow)"/>
      <rect x="370" y="168" width="68" height="48" rx="6" fill="url(#highlight)"/>
      <text x="404" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#numGrad)">24</text>
    </g>
  </g>

  <!-- 圖例區域 -->
  <g transform="translate(85, 290)">
    <!-- 行圖例 -->
    <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#cellR1G)"/>
    <text x="28" y="15" font-family="'Microsoft JhengHei', 'PingFang HK', sans-serif" font-size="12" fill="#555" font-weight="500">第1行</text>

    <rect x="90" y="0" width="20" height="20" rx="4" fill="url(#cellO1G)"/>
    <text x="118" y="15" font-family="'Microsoft JhengHei', 'PingFang HK', sans-serif" font-size="12" fill="#555" font-weight="500">第2行</text>

    <rect x="180" y="0" width="20" height="20" rx="4" fill="url(#cellB1G)"/>
    <text x="208" y="15" font-family="'Microsoft JhengHei', 'PingFang HK', sans-serif" font-size="12" fill="#555" font-weight="500">第3行</text>

    <rect x="270" y="0" width="20" height="20" rx="4" fill="url(#cellP1G)"/>
    <text x="298" y="15" font-family="'Microsoft JhengHei', 'PingFang HK', sans-serif" font-size="12" fill="#555" font-weight="500">第4行</text>

    <!-- 說明文字 -->
    <text x="380" y="15" font-family="'Microsoft JhengHei', 'PingFang HK', sans-serif" font-size="12" fill="#888" font-weight="400">
      4行 × 6列 = 24格
    </text>
  </g>

  <!-- 底部裝飾 -->
  <g transform="translate(85, 330)">
    <line x1="0" y1="0" x2="430" y2="0" stroke="#E0E5EE" stroke-width="1" opacity="0.4"/>
    <text x="215" y="18" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang HK', sans-serif" font-size="11" fill="#AAB" font-weight="400">
      乘法陣列模型 | 4 × 6 = 24
    </text>
  </g>
</svg>