<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8EDF2" stroke-width="0.5"/>
    </pattern>

    <!-- 放射漸變 3D 光影 - 糖果紅 -->
    <radialGradient id="candyRed" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FF6B8A"/>
      <stop offset="30%" stop-color="#FF3366"/>
      <stop offset="60%" stop-color="#E6004C"/>
      <stop offset="85%" stop-color="#B3003B"/>
      <stop offset="100%" stop-color="#80002A"/>
    </radialGradient>

    <!-- 放射漸變 3D 光影 - 糖果橙 -->
    <radialGradient id="candyOrange" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="30%" stop-color="#FF8C00"/>
      <stop offset="60%" stop-color="#E67300"/>
      <stop offset="85%" stop-color="#CC5A00"/>
      <stop offset="100%" stop-color="#994000"/>
    </radialGradient>

    <!-- 放射漸變 3D 光影 - 糖果綠 -->
    <radialGradient id="candyGreen" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#7DDF7D"/>
      <stop offset="30%" stop-color="#4CC94C"/>
      <stop offset="60%" stop-color="#2EB82E"/>
      <stop offset="85%" stop-color="#1F8B1F"/>
      <stop offset="100%" stop-color="#146014"/>
    </radialGradient>

    <!-- 放射漸變 3D 光影 - 糖果紫 -->
    <radialGradient id="candyPurple" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#C47DF0"/>
      <stop offset="30%" stop-color="#A855E0"/>
      <stop offset="60%" stop-color="#8B3FC7"/>
      <stop offset="85%" stop-color="#6B2D9E"/>
      <stop offset="100%" stop-color="#4D1F73"/>
    </radialGradient>

    <!-- 糖果高光 -->
    <radialGradient id="candyShine" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="50%" stop-color="#3949AB"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>

    <!-- 陰影濾鏡 - 雙層陰影 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.1)"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.1)"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#3949AB"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#2EB82E"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#E67300"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 主卡片 -->
  <rect x="15" y="15" width="570" height="370" rx="18" ry="18" fill="url(#cardBg)" filter="url(#cardShadow)"/>
  <rect x="15" y="15" width="570" height="370" rx="18" ry="18" fill="none" stroke="#E0E6ED" stroke-width="1"/>

  <!-- 標題區域 -->
  <rect x="15" y="15" width="570" height="52" rx="18" ry="18" fill="url(#titleGrad)" opacity="0.95"/>
  <rect x="15" y="40" width="570" height="27" fill="url(#titleGrad)" opacity="0.95"/>
  <text x="300" y="48" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" letter-spacing="2">🍬 除法概念：12 顆糖分給 3 人，每人 4 顆</text>

  <!-- 第1組 - 圓圈分組（左） -->
  <circle cx="105" cy="130" r="52" fill="none" stroke="#3949AB" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="105" y="195" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="13" fill="#3949AB" font-weight="bold">👤 朋友 A</text>

  <!-- 第1組糖果 -->
  <g filter="url(#shadow)">
    <ellipse cx="85" cy="110" rx="12" ry="10" fill="url(#candyRed)"/>
    <ellipse cx="85" cy="110" rx="12" ry="10" fill="url(#candyShine)"/>
    <ellipse cx="125" cy="110" rx="12" ry="10" fill="url(#candyOrange)"/>
    <ellipse cx="125" cy="110" rx="12" ry="10" fill="url(#candyShine)"/>
    <ellipse cx="85" cy="145" rx="12" ry="10" fill="url(#candyGreen)"/>
    <ellipse cx="85" cy="145" rx="12" ry="10" fill="url(#candyShine)"/>
    <ellipse cx="125" cy="145" rx="12" ry="10" fill="url(#candyPurple)"/>
    <ellipse cx="125" cy="145" rx="12" ry="10" fill="url(#candyShine)"/>
  </g>

  <!-- 第2組 - 圓圈分組（中） -->
  <circle cx="300" cy="130" r="52" fill="none" stroke="#2EB82E" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="300" y="195" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="13" fill="#2EB82E" font-weight="bold">👤 朋友 B</text>

  <!-- 第2組糖果 -->
  <g filter="url(#shadow)">
    <ellipse cx="280" cy="110" rx="12" ry="10" fill="url(#candyGreen)"/>
    <ellipse cx="280" cy="110" rx="12" ry="10" fill="url(#candyShine)"/>
    <ellipse cx="320" cy="110" rx="12" ry="10" fill="url(#candyRed)"/>
    <ellipse cx="320" cy="110" rx="12" ry="10" fill="url(#candyShine)"/>
    <ellipse cx="280" cy="145" rx="12" ry="10" fill="url(#candyOrange)"/>
    <ellipse cx="280" cy="145" rx="12" ry="10" fill="url(#candyShine)"/>
    <ellipse cx="320" cy="145" rx="12" ry="10" fill="url(#candyPurple)"/>
    <ellipse cx="320" cy="145" rx="12" ry="10" fill="url(#candyShine)"/>
  </g>

  <!-- 第3組 - 圓圈分組（右） -->
  <circle cx="495" cy="130" r="52" fill="none" stroke="#E67300" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.7"/>
  <text x="495" y="195" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="13" fill="#E67300" font-weight="bold">👤 朋友 C</text>

  <!-- 第3組糖果 -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="110" rx="12" ry="10" fill="url(#candyPurple)"/>
    <ellipse cx="475" cy="110" rx="12" ry="10" fill="url(#candyShine)"/>
    <ellipse cx="515" cy="110" rx="12" ry="10" fill="url(#candyOrange)"/>
    <ellipse cx="515" cy="110" rx="12" ry="10" fill="url(#candyShine)"/>
    <ellipse cx="475" cy="145" rx="12" ry="10" fill="url(#candyRed)"/>
    <ellipse cx="475" cy="145" rx="12" ry="10" fill="url(#candyShine)"/>
    <ellipse cx="515" cy="145" rx="12" ry="10" fill="url(#candyGreen)"/>
    <ellipse cx="515" cy="145" rx="12" ry="10" fill="url(#candyShine)"/>
  </g>

  <!-- 箭頭：從上方指向分組 -->
  <path d="M60,80 Q60,65 105,65 Q150,65 150,80" fill="none" stroke="#3949AB" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowBlue)" opacity="0.6"/>
  <path d="M255,80 Q255,65 300,65 Q345,65 345,80" fill="none" stroke="#2EB82E" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)" opacity="0.6"/>
  <path d="M450,80 Q450,65 495,65 Q540,65 540,80" fill="none" stroke="#E67300" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowOrange)" opacity="0.6"/>

  <!-- 上方標籤 -->
  <text x="105" y="75" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="11" fill="#3949AB" opacity="0.8">4 顆</text>
  <text x="300" y="75" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="11" fill="#2EB82E" opacity="0.8">4 顆</text>
  <text x="495" y="75" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="11" fill="#E67300" opacity="0.8">4 顆</text>

  <!-- 下方總結區域 -->
  <rect x="60" y="220" width="480" height="130" rx="14" ry="14" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- 總結內容 -->
  <text x="300" y="252" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="16" fill="#1A237E" font-weight="bold">📊 除法算式</text>

  <text x="300" y="285" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="20" fill="#E6004C" font-weight="bold">12 ÷ 3 = 4</text>

  <text x="300" y="315" text-anchor="middle" font-family="'Microsoft JhengHei', sans-serif" font-size="14" fill="#546E7A">
    <tspan font-weight="bold" fill="#3949AB">12</tspan> 顆糖 ÷ <tspan font-weight="bold" fill="#2EB82E">3</tspan> 人 = 每人 <tspan font-weight="bold" fill="#E67300">4</tspan> 顆
  </text>

  <!-- 裝飾小糖果 -->
  <g opacity="0.3">
    <ellipse cx="85" cy="340" rx="6" ry="5" fill="url(#candyRed)"/>
    <ellipse cx="140" cy="338" rx="5" ry="4" fill="url(#candyOrange)"/>
    <ellipse cx="460" cy="338" rx="5" ry="4" fill="url(#candyGreen)"/>
    <ellipse cx="515" cy="340" rx="6" ry="5" fill="url(#candyPurple)"/>
  </g>
</svg>