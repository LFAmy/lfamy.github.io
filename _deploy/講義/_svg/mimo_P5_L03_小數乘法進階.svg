<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 主卡片背景漸變（多層） -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F8FAFE"/>
      <stop offset="50%" stop-color="#F0F5FF"/>
      <stop offset="75%" stop-color="#EBF3FF"/>
      <stop offset="100%" stop-color="#E6EFFF"/>
    </linearGradient>

    <!-- 卡片邊框漸變 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B0C4DE"/>
      <stop offset="50%" stop-color="#8BA8D0"/>
      <stop offset="100%" stop-color="#6B8EC4"/>
    </linearGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2C5F8A"/>
      <stop offset="50%" stop-color="#4A7FB5"/>
      <stop offset="100%" stop-color="#2C5F8A"/>
    </linearGradient>

    <!-- 10×10 網格背景 -->
    <pattern id="grid10x10" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect width="180" height="180" fill="white" rx="2"/>
      <!-- 垂直線 -->
      <line x1="18" y1="0" x2="18" y2="180" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="36" y1="0" x2="36" y2="180" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="54" y1="0" x2="54" y2="180" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="72" y1="0" x2="72" y2="180" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="90" y1="0" x2="90" y2="180" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="108" y1="0" x2="108" y2="180" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="126" y1="0" x2="126" y2="180" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="144" y1="0" x2="144" y2="180" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="162" y1="0" x2="162" y2="180" stroke="#D0D8E8" stroke-width="0.5"/>
      <!-- 水平線 -->
      <line x1="0" y1="18" x2="180" y2="18" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="0" y1="36" x2="180" y2="36" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="0" y1="54" x2="180" y2="54" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="0" y1="72" x2="180" y2="72" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="0" y1="90" x2="180" y2="90" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="0" y1="108" x2="180" y2="108" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="0" y1="126" x2="180" y2="126" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="0" y1="144" x2="180" y2="144" stroke="#D0D8E8" stroke-width="0.5"/>
      <line x1="0" y1="162" x2="180" y2="162" stroke="#D0D8E8" stroke-width="0.5"/>
    </pattern>

    <!-- 0.3 垂直條（藍色半透明） -->
    <pattern id="vStripes" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="54" height="180" fill="#4A90D9" fill-opacity="0.35"/>
    </pattern>

    <!-- 0.4 水平條（紅色半透明） -->
    <pattern id="hStripes" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="180" height="72" fill="#E8734A" fill-opacity="0.35"/>
    </pattern>

    <!-- 交叉區域（0.12）漸變 -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B68EE" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#9370DB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.5"/>
    </linearGradient>

    <!-- 放射漸變3D光影 -->
    <radialGradient id="glow3d" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>

    <!-- 按鈕漸變 -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="50%" stop-color="#4A8BC4"/>
      <stop offset="100%" stop-color="#3A7AB3"/>
    </linearGradient>

    <!-- 箭頭（在defs中定義） -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#2C5F8A"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#D9534F"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#5CB85C"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 L3,5 Z" fill="#7B68EE"/>
    </marker>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-5%" y="-5%" width="115%" height="115%">
      <!-- 第一層陰影（深色，偏移大） -->
      <feDropShadow dx="3" dy="4" stdDeviation="5" flood-color="#A0B4D0" flood-opacity="0.4"/>
      <!-- 第二層陰影（淺色，偏移小） -->
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#C0D0E8" flood-opacity="0.3"/>
    </filter>

    <!-- 卡片內陰影 -->
    <filter id="innerShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#8899BB" flood-opacity="0.2"/>
    </filter>

    <!-- 小數點移動動畫箭頭（路徑） -->
    <linearGradient id="arrowAnimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B68EE" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7B68EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7B68EE" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 主卡片 - 圓角卡片 -->
  <rect x="15" y="15" width="570" height="370" rx="16" ry="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.5" filter="url(#doubleShadow)"/>

  <!-- 3D光影覆蓋層 -->
  <rect x="15" y="15" width="570" height="370" rx="16" ry="16" fill="url(#glow3d)" pointer-events="none"/>

  <!-- 標題 -->
  <text x="300" y="48" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#titleGrad)">小數乘法 · 面積模型</text>
  <text x="300" y="68" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" font-size="13" fill="#6B8EC4">0.3 × 0.4 = 0.12</text>

  <!-- 分隔線 -->
  <line x1="40" y1="78" x2="560" y2="78" stroke="#D8E2F0" stroke-width="0.8"/>

  <!-- ===== 10×10 方格區域 ===== -->
  <!-- 外框 -->
  <rect x="55" y="95" width="180" height="180" rx="3" fill="url(#grid10x10)" stroke="#8899BB" stroke-width="1.5" filter="url(#innerShadow)"/>

  <!-- 0.3 垂直條覆蓋（左3列） -->
  <rect x="55" y="95" width="54" height="180" fill="#4A90D9" fill-opacity="0.3" rx="3"/>

  <!-- 0.4 水平條覆蓋（上4行） -->
  <rect x="55" y="95" width="180" height="72" fill="#E8734A" fill-opacity="0.3" rx="3"/>

  <!-- 交叉區域（0.12）左上角 3×4 格 -->
  <rect x="55" y="95" width="54" height="72" fill="url(#crossGrad)" rx="2"/>
  <rect x="55" y="95" width="54" height="72" fill="none" stroke="#7B68EE" stroke-width="1.5" rx="2"/>

  <!-- 交叉區域標註文字 -->
  <text x="82" y="138" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">0.12</text>

  <!-- 標籤：0.3 -->
  <text x="82" y="290" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C5F8A">0.3</text>
  <line x1="55" y1="282" x2="109" y2="282" stroke="#2C5F8A" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="109" y1="282" x2="109" y2="275" stroke="#2C5F8A" stroke-width="1" marker-end="url(#arrowBlue)"/>

  <!-- 標籤：0.4 -->
  <text x="248" y="138" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#D9534F">0.4</text>
  <line x1="240" y1="95" x2="240" y2="167" stroke="#D9534F" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="240" y1="167" x2="235" y2="167" stroke="#D9534F" stroke-width="1" marker-end="url(#arrowRed)"/>

  <!-- ===== 小數點移動動畫箭頭 ===== -->
  <!-- 從 0.3 到 3 的箭頭 -->
  <path d="M 130 300 Q 180 320 220 300" fill="none" stroke="#7B68EE" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPurple)" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="175" y="318" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#7B68EE" opacity="0.8">小數點向右移1位</text>

  <!-- 從 0.4 到 4 的箭頭 -->
  <path d="M 270 175 Q 290 210 270 250" fill="none" stroke="#7B68EE" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPurple)" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="298" y="215" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#7B68EE" opacity="0.8">小數點向右移1位</text>

  <!-- ===== 計算步驟區域 ===== -->
  <rect x="270" y="95" width="290" height="180" rx="10" fill="#F5F8FE" stroke="#D0DCF0" stroke-width="1" filter="url(#innerShadow)"/>

  <!-- 步驟標題 -->
  <text x="415" y="118" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#3A6B9F">計算步驟</text>

  <!-- 步驟1 -->
  <text x="290" y="145" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#555">① 先忽略小數點，當作整數計算：</text>
  <text x="290" y="165" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#2C5F8A">3 × 4 = 12</text>

  <!-- 步驟2 -->
  <text x="290" y="195" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#555">② 計算小數位總數：</text>
  <text x="290" y="215" font-family="'Courier New', monospace" font-size="14" fill="#D9534F">0.3（1位） × 0.4（1位）</text>
  <text x="290" y="233" font-family="'Courier New', monospace" font-size="14" fill="#D9534F">小數位總數 = 1 + 1 = 2 位</text>

  <!-- 步驟3 -->
  <text x="290" y="258" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="12" fill="#555">③ 從右向左數2位，加上小數點：</text>
  <text x="290" y="278" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#5CB85C">12 → 0.12</text>

  <!-- ===== 結果卡片 ===== -->
  <rect x="55" y="310" width="505" height="55" rx="10" fill="#E8F0FE" stroke="#B8CCE8" stroke-width="1" filter="url(#innerShadow)"/>

  <!-- 結果文字 -->
  <text x="80" y="342" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="15" fill="#3A6B9F">答案：</text>
  <text x="140" y="342" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#2C5F8A">0.3 × 0.4 = 0.12</text>

  <!-- 小數點移動動畫指示 -->
  <circle cx="148" cy="332" r="3" fill="#7B68EE" opacity="0.6">
    <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="332" r="3" fill="#7B68EE" opacity="0.6">
    <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- 小數點閃爍提示 -->
  <text x="310" y="345" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="11" fill="#7B68EE">
    ✦ 小數點向左移動了 2 位
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- 底部裝飾 -->
  <line x1="55" y1="372" x2="560" y2="372" stroke="#D8E2F0" stroke-width="0.5"/>
</svg>