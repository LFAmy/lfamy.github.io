<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 暖色調背景漸層 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="40%" stop-color="#FFF2E5"/>
      <stop offset="70%" stop-color="#FDE8D8"/>
      <stop offset="100%" stop-color="#F5DCC8"/>
    </radialGradient>

    <!-- 圓角卡片背景 -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFFDFA"/>
      <stop offset="60%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FDF0E0"/>
    </linearGradient>

    <!-- 卡片陰影過濾器（雙層陰影） -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#D4C5B0" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#C4B5A0" flood-opacity="0.2"/>
    </filter>

    <!-- 量杯3D光影 -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#F0F8FF"/>
      <stop offset="50%" stop-color="#D0E8F8"/>
      <stop offset="80%" stop-color="#B0D8F0"/>
      <stop offset="100%" stop-color="#90C8E8"/>
    </linearGradient>

    <!-- 量杯內部液體 -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="30%" stop-color="#FFD633"/>
      <stop offset="60%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>

    <!-- 磅秤金屬光澤 -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="25%" stop-color="#E0E0E0"/>
      <stop offset="50%" stop-color="#D0D0D0"/>
      <stop offset="75%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#B0B0B0"/>
    </linearGradient>

    <!-- 磅秤螢幕 -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="50%" stop-color="#5BB8D4"/>
      <stop offset="100%" stop-color="#3AA8C5"/>
    </linearGradient>

    <!-- 蛋糕食譜卡片 -->
    <linearGradient id="recipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="30%" stop-color="#FFF0E0"/>
      <stop offset="60%" stop-color="#FFE8D0"/>
      <stop offset="100%" stop-color="#FDE0C0"/>
    </linearGradient>

    <!-- 蛋糕插圖漸層 -->
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E6"/>
      <stop offset="40%" stop-color="#F5D4A0"/>
      <stop offset="70%" stop-color="#E8B870"/>
      <stop offset="100%" stop-color="#D4A060"/>
    </linearGradient>

    <!-- 蛋糕奶油 -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F5E8D8"/>
    </linearGradient>

    <!-- 草莓 -->
    <radialGradient id="strawberryGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#E84545"/>
      <stop offset="100%" stop-color="#CC3333"/>
    </radialGradient>

    <!-- 母子互動 - 媽媽圍裙 -->
    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB5B5"/>
      <stop offset="50%" stop-color="#FF9E9E"/>
      <stop offset="100%" stop-color="#E88585"/>
    </linearGradient>

    <!-- 母子互動 - 小孩衣服 -->
    <linearGradient id="kidShirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD699"/>
      <stop offset="50%" stop-color="#FFC966"/>
      <stop offset="100%" stop-color="#FFB833"/>
    </linearGradient>

    <!-- 暖色調光暈 -->
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5E6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFF5E6" stop-opacity="0"/>
    </radialGradient>

    <!-- 頭部膚色 -->
    <radialGradient id="skinGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFE8D0"/>
      <stop offset="100%" stop-color="#F5D4B0"/>
    </radialGradient>

    <!-- 小孩膚色 -->
    <radialGradient id="kidSkinGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFEEDD"/>
      <stop offset="100%" stop-color="#F5DCC8"/>
    </radialGradient>

    <!-- 桌面陰影 -->
    <linearGradient id="tableShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D5C0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8D5C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 暖色調光暈 -->
  <ellipse cx="300" cy="200" rx="280" ry="180" fill="url(#warmGlow)"/>

  <!-- 桌面 -->
  <rect x="0" y="280" width="600" height="120" fill="#E8D5C0" rx="0"/>
  <rect x="0" y="280" width="600" height="3" fill="#DCC4A8" opacity="0.5"/>
  <rect x="0" y="282" width="600" height="118" fill="#DFC8B0" rx="0"/>
  <!-- 桌面木紋 -->
  <line x1="0" y1="310" x2="600" y2="310" stroke="#D4B898" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#D4B898" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="370" x2="600" y2="370" stroke="#D4B898" stroke-width="0.5" opacity="0.3"/>

  <!-- ============ 圓角卡片 - 左側：量杯與磅秤 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="30" width="250" height="230" rx="18" ry="18" fill="url(#cardBg)"/>
    <!-- 卡片邊框 -->
    <rect x="25" y="30" width="250" height="230" rx="18" ry="18" fill="none" stroke="#F0E0D0" stroke-width="1.5"/>
    <!-- 卡片標題 -->
    <text x="150" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C49060">精準量測</text>
    <line x1="60" y1="72" x2="240" y2="72" stroke="#F0E0D0" stroke-width="1"/>

    <!-- 量杯 -->
    <g transform="translate(65, 85)">
      <!-- 量杯本體 -->
      <path d="M 10 0 L 50 0 L 55 100 L 5 100 Z" fill="url(#cupGrad)" stroke="#90C8E8" stroke-width="1.5" opacity="0.9"/>
      <!-- 量杯把手 -->
      <path d="M 55 20 Q 70 20 70 40 Q 70 60 55 60" fill="none" stroke="#B0D8F0" stroke-width="3" stroke-linecap="round"/>
      <!-- 量杯刻度 -->
      <line x1="12" y1="25" x2="25" y2="25" stroke="#90C8E8" stroke-width="1"/>
      <line x1="12" y1="50" x2="25" y2="50" stroke="#90C8E8" stroke-width="1"/>
      <line x1="12" y1="75" x2="25" y2="75" stroke="#90C8E8" stroke-width="1"/>
      <!-- 液體 -->
      <rect x="8" y="55" width="45" height="45" rx="2" fill="url(#liquidGrad)" opacity="0.8"/>
      <!-- 液面反光 -->
      <ellipse cx="30" cy="55" rx="20" ry="3" fill="#FFE880" opacity="0.6"/>
      <!-- 量杯高光 -->
      <rect x="12" y="5" width="4" height="85" rx="2" fill="white" opacity="0.3"/>
    </g>

    <!-- 磅秤 -->
    <g transform="translate(175, 85)">
      <!-- 磅秤底座 -->
      <ellipse cx="30" cy="95" rx="35" ry="8" fill="#A0A0A0" opacity="0.3"/>
      <rect x="5" y="60" width="50" height="35" rx="8" fill="url(#scaleGrad)" stroke="#C0C0C0" stroke-width="1"/>
      <!-- 磅秤螢幕 -->
      <rect x="12" y="68" width="36" height="18" rx="4" fill="url(#screenGrad)"/>
      <text x="30" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">250g</text>
      <!-- 磅秤托盤 -->
      <ellipse cx="30" cy="58" rx="28" ry="6" fill="#E0E0E0" stroke="#C0C0C0" stroke-width="1"/>
      <ellipse cx="30" cy="56" rx="28" ry="6" fill="#F0F0F0" opacity="0.5"/>
      <!-- 托盤上的麵粉 -->
      <ellipse cx="30" cy="54" rx="18" ry="4" fill="#FFF8E8" opacity="0.7"/>
      <!-- 磅秤按鈕 -->
      <circle cx="18" cy="88" r="3" fill="#D0D0D0" stroke="#B0B0B0" stroke-width="0.5"/>
      <circle cx="42" cy="88" r="3" fill="#D0D0D0" stroke="#B0B0B0" stroke-width="0.5"/>
    </g>

    <!-- 標籤文字 -->
    <text x="90" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#B09070">量杯</text>
    <text x="205" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#B09070">電子磅秤</text>
  </g>

  <!-- ============ 圓角卡片 - 中間：蛋糕食譜 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="295" y="30" width="170" height="230" rx="18" ry="18" fill="url(#cardBg)"/>
    <rect x="295" y="30" width="170" height="230" rx="18" ry="18" fill="none" stroke="#F0E0D0" stroke-width="1.5"/>
    <text x="380" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C49060">蛋糕食譜</text>
    <line x1="320" y1="72" x2="440" y2="72" stroke="#F0E0D0" stroke-width="1"/>

    <!-- 蛋糕插圖 -->
    <g transform="translate(330, 85)">
      <!-- 蛋糕底盤 -->
      <ellipse cx="50" cy="90" rx="45" ry="8" fill="#D0B898" opacity="0.4"/>
      <!-- 蛋糕主體 -->
      <rect x="15" y="50" width="70" height="40" rx="5" fill="url(#cakeGrad)"/>
      <!-- 蛋糕奶油層 -->
      <rect x="15" y="50" width="70" height="12" rx="5" fill="url(#creamGrad)"/>
      <!-- 蛋糕頂部裝飾 -->
      <ellipse cx="50" cy="50" rx="35" ry="6" fill="#FFF8F0"/>
      <!-- 草莓 -->
      <ellipse cx="35" cy="48" rx="6" ry="5" fill="url(#strawberryGrad)"/>
      <ellipse cx="50" cy="46" rx="6" ry="5" fill="url(#strawberryGrad)"/>
      <ellipse cx="65" cy="48" rx="6" ry="5" fill="url(#strawberryGrad)"/>
      <!-- 草莓葉 -->
      <path d="M 35 44 L 33 40 L 37 42 L 35 44" fill="#66BB6A"/>
      <path d="M 50 42 L 48 38 L 52 40 L 50 42" fill="#66BB6A"/>
      <path d="M 65 44 L 63 40 L 67 42 L 65 44" fill="#66BB6A"/>
      <!-- 蠟燭 -->
      <rect x="48" y="20" width="4" height="25" rx="2" fill="#FFB5B5"/>
      <ellipse cx="50" cy="20" rx="4" ry="3" fill="#FFD699"/>
      <!-- 火焰 -->
      <ellipse cx="50" cy="16" rx="3" ry="5" fill="#FFAA00" opacity="0.8"/>
      <ellipse cx="50" cy="15" rx="2" ry="3" fill="#FFDD44" opacity="0.9"/>
    </g>

    <!-- 食譜文字 -->
    <text x="380" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#B09070">雞蛋 3顆 · 麵粉 200g</text>
    <text x="380" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#B09070">糖 100g · 奶油 50g</text>
    <text x="380" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#B09070">烤箱 180°C · 30分鐘</text>
  </g>

  <!-- ============ 圓角卡片 - 右側：母子互動 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="485" y="30" width="100" height="230" rx="18" ry="18" fill="url(#cardBg)"/>
    <rect x="485" y="30" width="100" height="230" rx="18" ry="18" fill="none" stroke="#F0E0D0" stroke-width="1.5"/>
    <text x="535" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#C49060">親子時光</text>
    <line x1="505" y1="72" x2="565" y2="72" stroke="#F0E0D0" stroke-width="1"/>

    <!-- 媽媽角色 -->
    <g transform="translate(510, 85)">
      <!-- 媽媽身體（圍裙） -->
      <rect x="8" y="40" width="24" height="35" rx="6" fill="url(#apronGrad)"/>
      <!-- 圍裙帶子 -->
      <path d="M 8 45 L 5 40 L 8 45" fill="#E88585" stroke="#E88585" stroke-width="1"/>
      <path d="M 32 45 L 35 40 L 32 45" fill="#E88585" stroke="#E88585" stroke-width="1"/>
      <!-- 媽媽頭部 -->
      <circle cx="20" cy="28" r="16" fill="url(#skinGrad)"/>
      <!-- 頭髮 -->
      <path d="M 4 28 Q 4 10 20 8 Q 36 10 36 28" fill="#8B5E3C"/>
      <path d="M 4 28 Q 4 20 8 18" fill="#8B5E3C"/>
      <path d="M 36 28 Q 36 20 32 18" fill="#8B5E3C"/>
      <!-- 馬尾 -->
      <path d="M 36 22 Q 44 18 42 28 Q 40 34 36 30" fill="#8B5E3C"/>
      <!-- 眼睛 -->
      <circle cx="15" cy="27" r="2.5" fill="#5D4037"/>
      <circle cx="25" cy="27" r="2.5" fill="#5D4037"/>
      <circle cx="15" cy="26" r="1" fill="white" opacity="0.7"/>
      <circle cx="25" cy="26" r="1" fill="white" opacity="0.7"/>
      <!-- 微笑 -->
      <path d="M 15 33 Q 20 37 25 33" fill="none" stroke="#D4856A" stroke-width="1.2" stroke-linecap="round"/>
      <!-- 腮紅 -->
      <ellipse cx="11" cy="32" rx="3" ry="2" fill="#FFB5B5" opacity="0.4"/>
      <ellipse cx="29" cy="32" rx="3" ry="2" fill="#FFB5B5" opacity="0.4"/>
      <!-- 手臂（張開迎接） -->
      <path d="M 8 50 Q -2 45 -4 38" fill="none" stroke="#FFB5B5" stroke-width="4" stroke-linecap="round"/>
      <path d="M 32 50 Q 42 45 44 38" fill="none" stroke="#FFB5B5" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 小孩角色 -->
    <g transform="translate(525, 145)">
      <!-- 小孩身體 -->
      <rect x="6" y="30" width="18" height="25" rx="5" fill="url(#kidShirtGrad)"/>
      <!-- 小孩頭部 -->
      <circle cx="15" cy="20" r="13" fill="url(#kidSkinGrad)"/>
      <!-- 頭髮 -->
      <path d="M 2 20 Q 2 8 15 6 Q 28 8 28 20" fill="#C4903C"/>
      <path d="M 2 20 Q 2 14 5 12" fill="#C4903C"/>
      <path d="M 28 20 Q 28 14 25 12" fill="#C4903C"/>
      <!-- 眼睛 -->
      <circle cx="11" cy="19" r="2" fill="#5D4037"/>
      <circle cx="19" cy="19" r="2" fill="#5D4037"/>
      <circle cx="11" cy="18" r="0.8" fill="white" opacity="0.7"/>
      <circle cx="19" cy="18" r="0.8" fill="white" opacity="0.7"/>
      <!-- 開心微笑 -->
      <path d="M 11 24 Q 15 28 19 24" fill="none" stroke="#D4856A" stroke-width="1" stroke-linecap="round"/>
      <!-- 腮紅 -->
      <ellipse cx="8" cy="23" rx="2.5" ry="1.5" fill="#FFB5B5" opacity="0.4"/>
      <ellipse cx="22" cy="23" rx="2.5" ry="1.5" fill="#FFB5B5" opacity="0.4"/>
      <!-- 手臂（向上伸向媽媽） -->
      <path d="M 6 38 Q 0 32 -2 28" fill="none" stroke="#FFD699" stroke-width="3" stroke-linecap="round"/>
      <path d="M 24 38 Q 30 32 32 28" fill="none" stroke="#FFD699" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 愛心符號 -->
    <g transform="translate(535, 118)">
      <path d="M 0 5 Q 0 0 5 0 Q 10 0 10 5 Q 10 10 5 15 Q 0 10 0 5 Z" fill="#FF6B6B" opacity="0.7" transform="scale(0.6)"/>
    </g>
    <g transform="translate(518, 130)">
      <path d="M 0 5 Q 0 0 5 0 Q 10 0 10 5 Q 10 10 5 15 Q 0 10 0 5 Z" fill="#FF6B6B" opacity="0.5" transform="scale(0.4)"/>
    </g>

    <!-- 對話泡泡 -->
    <g transform="translate(498, 75)">
      <ellipse cx="20" cy="8" rx="18" ry="8" fill="white" stroke="#F0E0D0" stroke-width="0.8"/>
      <text x="20" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#C49060">一起做</text>
    </g>
  </g>

  <!-- ============ 裝飾元素 ============ -->
  <!-- 左上角裝飾小星星 -->
  <g opacity="0.3">
    <text x="15" y="18" font-size="10" fill="#FFD699">✦</text>
    <text x="580" y="18" font-size="10" fill="#FFD699">✦</text>
    <text x="300" y="18" font-size="8" fill="#FFD699">✦</text>
  </g>

  <!-- 底部裝飾線 -->
  <rect x="200" y="385" width="200" height="2" rx="1" fill="#DCC4A8" opacity="0.3"/>

  <!-- 廚房小工具裝飾 -->
  <g transform="translate(30, 310)" opacity="0.4">
    <!-- 打蛋器 -->
    <line x1="0" y1="0" x2="0" y2="30" stroke="#C0C0C0" stroke-width="2"/>
    <ellipse cx="0" cy="30" rx="6" ry="8" fill="none" stroke="#C0C0C0" stroke-width="1.5"/>
    <line x1="-4" y1="28" x2="4" y2="28" stroke="#C0C0C0" stroke-width="1"/>
    <line x1="-4" y1="32" x2="4" y2="32" stroke="#C0C0C0" stroke-width="1"/>
  </g>

  <g transform="translate(560, 310)" opacity="0.4">
    <!-- 鍋鏟 -->
    <rect x="-2" y="0" width="4" height="25" rx="1" fill="#C0A080"/>
    <rect x="-8" y="25" width="16" height="8" rx="3" fill="#C0A080"/>
  </g>

</svg>