<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F4F8"/>
      <stop offset="50%" stop-color="#FAFBFC"/>
      <stop offset="100%" stop-color="#E8EDF2"/>
    </linearGradient>

    <!-- 大長方形主漸變（多層） -->
    <linearGradient id="bigRectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="25%" stop-color="#5BA0E8"/>
      <stop offset="50%" stop-color="#3A7BC8"/>
      <stop offset="75%" stop-color="#2D6BB5"/>
      <stop offset="100%" stop-color="#1A5A9E"/>
    </linearGradient>

    <!-- 大長方形3D光影（放射漸變） -->
    <radialGradient id="bigRectShine" cx="30%" cy="25%" r="70%" fx="25%" fy="20%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.2)"/>
    </radialGradient>

    <!-- 小長方形主漸變（多層） -->
    <linearGradient id="smallRectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="25%" stop-color="#FFB840"/>
      <stop offset="50%" stop-color="#E8961A"/>
      <stop offset="75%" stop-color="#D4880F"/>
      <stop offset="100%" stop-color="#B8730A"/>
    </linearGradient>

    <!-- 小長方形3D光影（放射漸變） -->
    <radialGradient id="smallRectShine" cx="35%" cy="30%" r="65%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
    </radialGradient>

    <!-- 陰影區域漸變（雙層陰影效果） -->
    <linearGradient id="shadowAreaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EB8F0"/>
      <stop offset="30%" stop-color="#6AA8E0"/>
      <stop offset="60%" stop-color="#5598D0"/>
      <stop offset="100%" stop-color="#4088C0"/>
    </linearGradient>

    <!-- 陰影區域3D光影 -->
    <radialGradient id="shadowAreaShine" cx="40%" cy="35%" r="60%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </radialGradient>

    <!-- 陰影區域第二層陰影（雙層陰影） -->
    <linearGradient id="shadowOverlay" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.12)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0.02)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
    </linearGradient>

    <!-- 卡片陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A2A4A" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A2A4A" flood-opacity="0.1"/>
    </filter>

    <!-- 按鈕陰影 -->
    <filter id="buttonShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2A4A" flood-opacity="0.2"/>
    </filter>

    <!-- 內部陰影 -->
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="rgba(0,0,0,0.15)" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- 減法箭頭漸變 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="50%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 主卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="18" ry="18" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 標題區域 -->
  <rect x="25" y="20" width="550" height="60" rx="18" ry="18" fill="#2C3E50"/>
  <rect x="25" y="50" width="550" height="30" fill="#2C3E50"/>
  <text x="300" y="55" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">📐 面積相減 · 陰影面積 = 大長方形 − 小長方形</text>

  <!-- 大長方形（外框） -->
  <rect x="80" y="100" width="320" height="200" rx="10" ry="10" fill="url(#bigRectGrad)" filter="url(#innerShadow)"/>
  <rect x="80" y="100" width="320" height="200" rx="10" ry="10" fill="url(#bigRectShine)"/>

  <!-- 大長方形邊框 -->
  <rect x="80" y="100" width="320" height="200" rx="10" ry="10" fill="none" stroke="#1A5A9E" stroke-width="2.5"/>

  <!-- 小長方形（內框 - 被減去的部分） -->
  <rect x="155" y="145" width="170" height="110" rx="8" ry="8" fill="url(#smallRectGrad)" filter="url(#innerShadow)"/>
  <rect x="155" y="145" width="170" height="110" rx="8" ry="8" fill="url(#smallRectShine)"/>

  <!-- 小長方形邊框 -->
  <rect x="155" y="145" width="170" height="110" rx="8" ry="8" fill="none" stroke="#B8730A" stroke-width="2.5"/>

  <!-- 陰影區域（大長方形減去小長方形後的剩餘區域） -->
  <!-- 上條 -->
  <path d="M80,100 L400,100 L400,145 L155,145 L155,100 Z" fill="url(#shadowAreaGrad)" opacity="0.85"/>
  <path d="M80,100 L400,100 L400,145 L155,145 L155,100 Z" fill="url(#shadowAreaShine)" opacity="0.6"/>
  <path d="M80,100 L400,100 L400,145 L155,145 L155,100 Z" fill="url(#shadowOverlay)" opacity="0.4"/>

  <!-- 下條 -->
  <path d="M80,255 L400,255 L400,300 L155,300 L155,255 Z" fill="url(#shadowAreaGrad)" opacity="0.85"/>
  <path d="M80,255 L400,255 L400,300 L155,300 L155,255 Z" fill="url(#shadowAreaShine)" opacity="0.6"/>
  <path d="M80,255 L400,255 L400,300 L155,300 L155,255 Z" fill="url(#shadowOverlay)" opacity="0.4"/>

  <!-- 左條 -->
  <path d="M80,145 L155,145 L155,255 L80,255 Z" fill="url(#shadowAreaGrad)" opacity="0.85"/>
  <path d="M80,145 L155,145 L155,255 L80,255 Z" fill="url(#shadowAreaShine)" opacity="0.6"/>
  <path d="M80,145 L155,145 L155,255 L80,255 Z" fill="url(#shadowOverlay)" opacity="0.4"/>

  <!-- 右條 -->
  <path d="M325,145 L400,145 L400,255 L325,255 Z" fill="url(#shadowAreaGrad)" opacity="0.85"/>
  <path d="M325,145 L400,145 L400,255 L325,255 Z" fill="url(#shadowAreaShine)" opacity="0.6"/>
  <path d="M325,145 L400,145 L400,255 L325,255 Z" fill="url(#shadowOverlay)" opacity="0.4"/>

  <!-- 陰影區域邊框 -->
  <path d="M80,100 L400,100 L400,300 L80,300 Z" fill="none" stroke="#2D6BB5" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <path d="M155,145 L325,145 L325,255 L155,255 Z" fill="none" stroke="#B8730A" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- 大長方形標籤 -->
  <text x="240" y="95" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">大長方形</text>
  <text x="240" y="315" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="14" fill="#4A90D9">長 × 闊</text>

  <!-- 小長方形標籤 -->
  <text x="240" y="200" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">小長方形</text>

  <!-- 陰影區域標籤 -->
  <text x="117" y="195" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" transform="rotate(-90,117,195)">陰影</text>
  <text x="362" y="195" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" transform="rotate(90,362,195)">陰影</text>
  <text x="240" y="128" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">陰影</text>
  <text x="240" y="280" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">陰影</text>

  <!-- 減法符號區域 -->
  <line x1="430" y1="170" x2="430" y2="230" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="430,235 424,222 436,222" fill="#E74C3C"/>
  <text x="430" y="260" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="18" font-weight="bold" fill="#E74C3C">−</text>

  <!-- 等號 -->
  <text x="430" y="290" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">=</text>

  <!-- 結果區域 -->
  <rect x="440" y="100" width="120" height="200" rx="10" ry="10" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">陰影面積</text>
  <line x1="455" y1="150" x2="545" y2="150" stroke="#4A90D9" stroke-width="1" opacity="0.5"/>
  <text x="500" y="180" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" fill="#4A90D9">大長方形</text>
  <text x="500" y="200" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="13" fill="#E74C3C">− 小長方形</text>
  <line x1="460" y1="215" x2="540" y2="215" stroke="#2C3E50" stroke-width="1.5"/>
  <text x="500" y="240" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">= 陰影</text>
  <text x="500" y="265" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="12" fill="#7F8C8D">(長×闊) − (長×闊)</text>

  <!-- 裝飾性小點 -->
  <circle cx="60" cy="50" r="4" fill="#4A90D9" opacity="0.3"/>
  <circle cx="540" cy="50" r="4" fill="#4A90D9" opacity="0.3"/>
  <circle cx="60" cy="370" r="4" fill="#4A90D9" opacity="0.3"/>
  <circle cx="540" cy="370" r="4" fill="#4A90D9" opacity="0.3"/>

  <!-- 底部提示 -->
  <rect x="80" y="335" width="320" height="30" rx="15" ry="15" fill="#F0F4F8"/>
  <text x="240" y="355" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang HK', sans-serif" font-size="12" fill="#7F8C8D">💡 陰影部分 = 大長方形面積 − 小長方形面積</text>
</svg>