<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>

    <!-- 卡片主體漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e8e0f0;stop-opacity:0.95"/>
    </linearGradient>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>

    <!-- 3D 光影效果 - 數線 -->
    <linearGradient id="numberLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="50%" style="stop-color:#4834d4"/>
      <stop offset="100%" style="stop-color:#3b2ab0"/>
    </linearGradient>

    <!-- 負數區域漸變 -->
    <linearGradient id="negativeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0"/>
    </linearGradient>

    <!-- 正數區域漸變 -->
    <linearGradient id="positiveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#51cf66;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#51cf66;stop-opacity:0.3"/>
    </linearGradient>

    <!-- 圓點放射漸變 -->
    <radialGradient id="dotGradNeg" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ff8787"/>
      <stop offset="60%" style="stop-color:#e03131"/>
      <stop offset="100%" style="stop-color:#c92a2a"/>
    </radialGradient>

    <radialGradient id="dotGradPos" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#69db7c"/>
      <stop offset="60%" style="stop-color:#2f9e44"/>
      <stop offset="100%" style="stop-color:#1b7a2e"/>
    </radialGradient>

    <radialGradient id="dotGradZero" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffd43b"/>
      <stop offset="60%" style="stop-color:#f59f00"/>
      <stop offset="100%" style="stop-color:#d9480f"/>
    </radialGradient>

    <!-- 圓點陰影 -->
    <filter id="dotShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- 標籤陰影 -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>

    <!-- 箭頭標記 -->
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c63ff"/>
    </marker>

    <!-- 移動箭頭漸變 -->
    <linearGradient id="moveArrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff922b"/>
      <stop offset="100%" style="stop-color:#f76707"/>
    </linearGradient>

    <!-- 移動箭頭陰影 -->
    <filter id="moveArrowShadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fcc419"/>
      <stop offset="50%" style="stop-color:#ff922b"/>
      <stop offset="100%" style="stop-color:#f76707"/>
    </linearGradient>

    <!-- 裝飾光暈 -->
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#7950f2;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7950f2;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#e64980;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#e64980;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 裝飾光暈 -->
  <rect width="600" height="400" fill="url(#glow1)"/>
  <rect width="600" height="400" fill="url(#glow2)"/>

  <!-- 主卡片 -->
  <rect x="20" y="20" width="560" height="360" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#cardShadow)"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" filter="url(#textShadow)">📐 負數加減 · 數線探索</text>

  <!-- 副標題 -->
  <text x="300" y="80" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="#888" letter-spacing="2">香港小學數學</text>

  <!-- 數線背景區域 -->
  <rect x="50" y="100" width="500" height="160" rx="12" fill="#f8f7ff" stroke="#ddd6fe" stroke-width="1.5"/>

  <!-- 負數區域標示 -->
  <rect x="50" y="100" width="200" height="160" rx="12" fill="url(#negativeGrad)"/>
  <rect x="350" y="100" width="200" height="160" rx="12" fill="url(#positiveGrad)"/>

  <!-- 區域標籤 -->
  <text x="150" y="118" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#e03131" font-weight="bold" opacity="0.7">負數</text>
  <text x="300" y="118" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#f59f00" font-weight="bold" opacity="0.7">零</text>
  <text x="450" y="118" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#2f9e44" font-weight="bold" opacity="0.7">正數</text>

  <!-- 數線主線 -->
  <line x1="70" y1="200" x2="530" y2="200" stroke="url(#numberLineGrad)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowHead)"/>

  <!-- 數線刻度 -->
  <!-- -5 -->
  <line x1="95" y1="192" x2="95" y2="208" stroke="#4834d4" stroke-width="2.5"/>
  <text x="95" y="225" text-anchor="middle" font-family="'Arial',sans-serif" font-size="13" fill="#e03131" font-weight="bold">-5</text>

  <!-- -4 -->
  <line x1="145" y1="192" x2="145" y2="208" stroke="#4834d4" stroke-width="2"/>
  <text x="145" y="225" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" fill="#e03131">-4</text>

  <!-- -3 -->
  <line x1="195" y1="192" x2="195" y2="208" stroke="#4834d4" stroke-width="2"/>
  <text x="195" y="225" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" fill="#e03131">-3</text>

  <!-- -2 -->
  <line x1="245" y1="192" x2="245" y2="208" stroke="#4834d4" stroke-width="2"/>
  <text x="245" y="225" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" fill="#e03131">-2</text>

  <!-- -1 -->
  <line x1="295" y1="192" x2="295" y2="208" stroke="#4834d4" stroke-width="2"/>
  <text x="295" y="225" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" fill="#e03131">-1</text>

  <!-- 0 -->
  <line x1="345" y1="188" x2="345" y2="212" stroke="#f59f00" stroke-width="3.5"/>
  <text x="345" y="230" text-anchor="middle" font-family="'Arial',sans-serif" font-size="14" fill="#d9480f" font-weight="bold">0</text>

  <!-- 1 -->
  <line x1="395" y1="192" x2="395" y2="208" stroke="#4834d4" stroke-width="2"/>
  <text x="395" y="225" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" fill="#2f9e44">1</text>

  <!-- 2 -->
  <line x1="445" y1="192" x2="445" y2="208" stroke="#4834d4" stroke-width="2"/>
  <text x="445" y="225" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" fill="#2f9e44">2</text>

  <!-- 3 -->
  <line x1="495" y1="192" x2="495" y2="208" stroke="#4834d4" stroke-width="2"/>
  <text x="495" y="225" text-anchor="middle" font-family="'Arial',sans-serif" font-size="12" fill="#2f9e44">3</text>

  <!-- 運算圓點 - 從 -3 開始 -->
  <!-- 起點 -3 -->
  <circle cx="195" cy="200" r="9" fill="url(#dotGradNeg)" filter="url(#dotShadow)"/>
  <text x="195" y="203" text-anchor="middle" font-family="'Arial',sans-serif" font-size="9" fill="#fff" font-weight="bold">-3</text>

  <!-- 移動箭頭 +5 (從 -3 到 2) -->
  <path d="M 204 200 Q 270 175 386 200" fill="none" stroke="url(#moveArrowGrad)" stroke-width="3" stroke-dasharray="8,4" filter="url(#moveArrowShadow)" marker-end="url(#arrowHead)"/>

  <!-- 終點 2 -->
  <circle cx="445" cy="200" r="9" fill="url(#dotGradPos)" filter="url(#dotShadow)"/>
  <text x="445" y="203" text-anchor="middle" font-family="'Arial',sans-serif" font-size="9" fill="#fff" font-weight="bold">2</text>

  <!-- 運算步驟標籤 -->
  <rect x="160" y="245" width="280" height="50" rx="10" fill="#fff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- 步驟文字 -->
  <text x="300" y="268" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" fill="#333" font-weight="bold">
    計算：<tspan fill="#e03131">(-3)</tspan> <tspan fill="#f76707">+ 5</tspan> <tspan fill="#333">=</tspan> <tspan fill="#2f9e44">2</tspan>
  </text>

  <!-- 步驟說明 -->
  <text x="300" y="288" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#888">
    從 -3 向右移動 5 步，到達 2
  </text>

  <!-- 裝飾小標籤 - 移動方向指示 -->
  <text x="290" y="178" text-anchor="middle" font-family="'Arial',sans-serif" font-size="10" fill="#f76707" font-weight="bold">+5 向右移動</text>

  <!-- 底部提示 -->
  <text x="300" y="355" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#aaa">
    💡 負數加正數 = 向右移動 | 負數減正數 = 向左移動
  </text>

  <!-- 裝飾小圓點 -->
  <circle cx="55" cy="55" r="3" fill="#7950f2" opacity="0.3"/>
  <circle cx="545" cy="55" r="4" fill="#e64980" opacity="0.25"/>
  <circle cx="55" cy="345" r="3" fill="#7950f2" opacity="0.2"/>
  <circle cx="545" cy="345" r="3" fill="#e64980" opacity="0.2"/>
</svg>