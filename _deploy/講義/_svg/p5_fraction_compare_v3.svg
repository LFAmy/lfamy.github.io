<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#d6e0f0"/>
    </radialGradient>

    <!-- 卡片陰影（雙層） -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000030"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000020"/>
    </filter>

    <!-- 1/2 紅色長條漸變（多層） -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="40%" stop-color="#ee3b3b"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="redShine" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ffffff60"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </radialGradient>

    <!-- 2/5 藍色長條漸變 -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="blueShine" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ffffff60"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </radialGradient>

    <!-- 3/4 綠色長條漸變 -->
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="greenShine" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ffffff60"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </radialGradient>

    <!-- 長條陰影 -->
    <filter id="barShadow" x="-2%" y="-2%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#00000040"/>
    </filter>

    <!-- 分數文字陰影 -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000030"/>
    </filter>

    <!-- 放射光暈 -->
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b40"/>
      <stop offset="100%" stop-color="#ff6b6b00"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa40"/>
      <stop offset="100%" stop-color="#60a5fa00"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade8040"/>
      <stop offset="100%" stop-color="#4ade8000"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="#2c3e50" filter="url(#textShadow)">📊 分數比較</text>

  <!-- ===== 1/2 紅色長條 ===== -->
  <g transform="translate(50, 65)">
    <!-- 卡片背景 -->
    <rect x="-5" y="-5" width="510" height="95" rx="12" fill="#ffffff" filter="url(#cardShadow)" opacity="0.9"/>
    <!-- 標籤 -->
    <text x="0" y="22" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#dc2626">1/2</text>
    <text x="45" y="22" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#666">= 0.5</text>
    <!-- 長條背景 -->
    <rect x="0" y="32" width="460" height="28" rx="14" fill="#e5e7eb"/>
    <!-- 長條本體（1/2 = 50%） -->
    <rect x="0" y="32" width="230" height="28" rx="14" fill="url(#redGrad)" filter="url(#barShadow)"/>
    <!-- 光澤 -->
    <rect x="0" y="32" width="230" height="14" rx="14" fill="url(#redShine)"/>
    <!-- 百分比文字 -->
    <text x="230" y="50" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#dc2626">50%</text>
  </g>

  <!-- ===== 2/5 藍色長條 ===== -->
  <g transform="translate(50, 175)">
    <rect x="-5" y="-5" width="510" height="95" rx="12" fill="#ffffff" filter="url(#cardShadow)" opacity="0.9"/>
    <text x="0" y="22" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#2563eb">2/5</text>
    <text x="45" y="22" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#666">= 0.4</text>
    <rect x="0" y="32" width="460" height="28" rx="14" fill="#e5e7eb"/>
    <!-- 2/5 = 40% -->
    <rect x="0" y="32" width="184" height="28" rx="14" fill="url(#blueGrad)" filter="url(#barShadow)"/>
    <rect x="0" y="32" width="184" height="14" rx="14" fill="url(#blueShine)"/>
    <text x="184" y="50" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#2563eb">40%</text>
  </g>

  <!-- ===== 3/4 綠色長條 ===== -->
  <g transform="translate(50, 285)">
    <rect x="-5" y="-5" width="510" height="95" rx="12" fill="#ffffff" filter="url(#cardShadow)" opacity="0.9"/>
    <text x="0" y="22" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="15" font-weight="bold" fill="#16a34a">3/4</text>
    <text x="45" y="22" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#666">= 0.75</text>
    <rect x="0" y="32" width="460" height="28" rx="14" fill="#e5e7eb"/>
    <!-- 3/4 = 75% -->
    <rect x="0" y="32" width="345" height="28" rx="14" fill="url(#greenGrad)" filter="url(#barShadow)"/>
    <rect x="0" y="32" width="345" height="14" rx="14" fill="url(#greenShine)"/>
    <text x="345" y="50" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#16a34a">75%</text>
  </g>

  <!-- 底部比較標記 -->
  <g transform="translate(50, 382)">
    <!-- 比較符號 -->
    <text x="230" y="10" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#888">1/2</text>
    <text x="280" y="10" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#888"> &gt; </text>
    <text x="310" y="10" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#888">2/5</text>
    <text x="360" y="10" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#888"> &lt; </text>
    <text x="390" y="10" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#888">3/4</text>
  </g>
</svg>