<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>
    <pattern id="gridLarge" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#DCE2E8" stroke-width="1"/>
    </pattern>

    <!-- 量杯主體漸層（3D立體玻璃效果） -->
    <linearGradient id="beakerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D0E4F5" stop-opacity="0.9"/>
      <stop offset="15%" stop-color="#F0F8FF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#E8F4FD" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#C8E0F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A8C8E0" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 量杯內部液體漸層（水） -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A9FD8" stop-opacity="0.7"/>
      <stop offset="20%" stop-color="#6BB8E8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#5AADE0" stop-opacity="0.65"/>
      <stop offset="80%" stop-color="#4A9FD8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3A8FC8" stop-opacity="0.75"/>
    </linearGradient>

    <!-- 水面放射漸層 -->
    <radialGradient id="waterSurface" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#A0D8F0" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#80C8E8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#60B0D8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4A9FD8" stop-opacity="0.4"/>
    </radialGradient>

    <!-- 石頭漸層（立體3D） -->
    <radialGradient id="stoneGrad" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#B8A088"/>
      <stop offset="25%" stop-color="#9A8068"/>
      <stop offset="50%" stop-color="#7A6048"/>
      <stop offset="75%" stop-color="#5A4830"/>
      <stop offset="100%" stop-color="#3A2818"/>
    </radialGradient>

    <!-- 石頭表面紋理漸層 -->
    <radialGradient id="stoneTexture" cx="60%" cy="60%" r="40%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#C8B098" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8A7058" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4A3820" stop-opacity="0.3"/>
    </radialGradient>

    <!-- 陰影：量杯底部 -->
    <filter id="shadowBeaker" x="-10%" y="-10%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset dx="3" dy="5" result="offsetBlur"/>
      <feComponentTransfer result="shadow">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 雙層陰影：石頭 -->
    <filter id="shadowStone" x="-20%" y="-20%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur1"/>
      <feOffset dx="2" dy="3" result="offsetBlur1"/>
      <feComponentTransfer result="shadow1">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur2"/>
      <feOffset dx="1" dy="2" result="offsetBlur2"/>
      <feComponentTransfer result="shadow2">
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow2"/>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 圓角卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="2" dy="4" result="offsetBlur"/>
      <feComponentTransfer result="shadow">
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 高光反射 -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 刻度標記漸層 -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A4A6A"/>
      <stop offset="100%" stop-color="#1A3A5A"/>
    </linearGradient>

    <!-- 水位標籤漸層 -->
    <linearGradient id="labelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0F4F8" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#gridLarge)"/>

  <!-- 圓角卡片 -->
  <rect x="20" y="20" width="560" height="360" rx="16" ry="16" fill="#FFFFFF" filter="url(#cardShadow)" opacity="0.95"/>
  <rect x="20" y="20" width="560" height="360" rx="16" ry="16" fill="none" stroke="#E0E6EC" stroke-width="1"/>

  <!-- 標題 -->
  <text x="300" y="55" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang HK','Noto Sans HK',sans-serif" font-size="20" font-weight="bold" fill="#1A3A5A">📐 排水法 — 水位變化</text>
  <text x="300" y="78" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang HK','Noto Sans HK',sans-serif" font-size="13" fill="#5A7A9A">石頭放入後，水位由 10cm³ 升至 15cm³</text>

  <!-- ========== 量杯 3D 立體 ========== -->
  <g filter="url(#shadowBeaker)">
    <!-- 量杯主體（梯形：上寬下窄） -->
    <path d="M 175 100 L 185 320 L 345 320 L 355 100 Z" fill="url(#beakerGrad)" stroke="#8AB0D0" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- 量杯左側高光 -->
    <path d="M 175 100 L 185 320 L 195 320 L 185 100 Z" fill="#FFFFFF" opacity="0.3"/>

    <!-- 量杯右側暗部 -->
    <path d="M 345 320 L 355 100 L 348 100 L 338 320 Z" fill="#6A90B0" opacity="0.25"/>

    <!-- 量杯底部 -->
    <path d="M 185 320 L 345 320 L 340 328 L 190 328 Z" fill="#A0C0D8" stroke="#8AB0D0" stroke-width="1"/>

    <!-- 量杯口 -->
    <path d="M 170 100 L 175 100 L 185 320 L 345 320 L 355 100 L 360 100" fill="none" stroke="#8AB0D0" stroke-width="2"/>
    <!-- 杯口翻邊 -->
    <path d="M 168 100 L 170 100 L 175 100" fill="none" stroke="#B0D0E8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 355 100 L 360 100 L 362 100" fill="none" stroke="#B0D0E8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- ===== 刻度標記 ===== -->
    <!-- 左側刻度線 -->
    <line x1="178" y1="130" x2="188" y2="130" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="178" y1="160" x2="188" y2="160" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="178" y1="190" x2="188" y2="190" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="178" y1="220" x2="188" y2="220" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="178" y1="250" x2="188" y2="250" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="178" y1="280" x2="188" y2="280" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="178" y1="310" x2="188" y2="310" stroke="#2A4A6A" stroke-width="1.2"/>

    <!-- 右側刻度線 -->
    <line x1="342" y1="130" x2="352" y2="130" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="342" y1="160" x2="352" y2="160" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="342" y1="190" x2="352" y2="190" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="342" y1="220" x2="352" y2="220" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="342" y1="250" x2="352" y2="250" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="342" y1="280" x2="352" y2="280" stroke="#2A4A6A" stroke-width="1.2"/>
    <line x1="342" y1="310" x2="352" y2="310" stroke="#2A4A6A" stroke-width="1.2"/>

    <!-- 刻度數字（右側） -->
    <text x="358" y="134" font-family="Arial,sans-serif" font-size="9" fill="#2A4A6A">30</text>
    <text x="358" y="164" font-family="Arial,sans-serif" font-size="9" fill="#2A4A6A">25</text>
    <text x="358" y="194" font-family="Arial,sans-serif" font-size="9" fill="#2A4A6A">20</text>
    <text x="358" y="224" font-family="Arial,sans-serif" font-size="9" fill="#2A4A6A">15</text>
    <text x="358" y="254" font-family="Arial,sans-serif" font-size="9" fill="#2A4A6A">10</text>
    <text x="358" y="284" font-family="Arial,sans-serif" font-size="9" fill="#2A4A6A">5</text>
    <text x="355" y="314" font-family="Arial,sans-serif" font-size="9" fill="#2A4A6A">0</text>

    <!-- 單位標示 -->
    <text x="370" y="200" font-family="Arial,sans-serif" font-size="10" fill="#4A6A8A" transform="rotate(-90,370,200)">cm³</text>

    <!-- ===== 初始水位線（10cm³） ===== -->
    <path d="M 183 255 L 347 255" stroke="#3A8FC8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

    <!-- ===== 初始水位（10cm³ 藍色區域） ===== -->
    <path d="M 185 320 L 345 320 L 347 255 L 183 255 Z" fill="url(#waterGrad)" opacity="0.5"/>

    <!-- ===== 初始水位標籤 ===== -->
    <rect x="130" y="248" width="48" height="18" rx="4" fill="url(#labelBg)" stroke="#3A8FC8" stroke-width="0.8"/>
    <text x="154" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3A8FC8">10cm³</text>

    <!-- ===== 石頭（立體3D） ===== -->
    <g filter="url(#shadowStone)">
      <!-- 石頭主體 -->
      <ellipse cx="265" cy="235" rx="28" ry="22" fill="url(#stoneGrad)"/>
      <!-- 石頭紋理 -->
      <ellipse cx="265" cy="235" rx="28" ry="22" fill="url(#stoneTexture)"/>
      <!-- 石頭高光 -->
      <ellipse cx="255" cy="228" rx="10" ry="6" fill="#D0B8A0" opacity="0.3"/>
      <ellipse cx="252" cy="226" rx="5" ry="3" fill="#E8D0B8" opacity="0.25"/>
      <!-- 石頭邊緣暗部 -->
      <path d="M 240 240 Q 265 258 290 240" fill="none" stroke="#3A2818" stroke-width="1.5" opacity="0.3"/>
      <!-- 石頭底部陰影 -->
      <ellipse cx="265" cy="252" rx="24" ry="6" fill="#2A1A10" opacity="0.15"/>
    </g>

    <!-- ===== 石頭入水後水位（15cm³） ===== -->
    <!-- 水位上升後的藍色區域 -->
    <path d="M 185 320 L 345 320 L 347 224 L 183 224 Z" fill="url(#waterGrad)" opacity="0.45"/>

    <!-- 水面（放射漸層） -->
    <ellipse cx="265" cy="224" rx="82" ry="6" fill="url(#waterSurface)" opacity="0.7"/>

    <!-- 水面高光 -->
    <ellipse cx="250" cy="223" rx="30" ry="3" fill="#C0E8F8" opacity="0.4"/>
    <ellipse cx="240" cy="222" rx="15" ry="2" fill="#E0F4FC" opacity="0.3"/>

    <!-- ===== 新水位標籤 ===== -->
    <rect x="130" y="216" width="48" height="18" rx="4" fill="url(#labelBg)" stroke="#1A7AB8" stroke-width="1.2"/>
    <text x="154" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1A7AB8">15cm³</text>

    <!-- ===== 水位上升箭頭 ===== -->
    <line x1="120" y1="252" x2="120" y2="228" stroke="#E84A2A" stroke-width="2" stroke-linecap="round"/>
    <polygon points="115,232 120,222 125,232" fill="#E84A2A"/>
    <text x="110" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#E84A2A">上升</text>

    <!-- ===== 排水體積標示 ===== -->
    <rect x="390" y="220" width="110" height="50" rx="8" fill="#FFF8F0" stroke="#E84A2A" stroke-width="1.2" opacity="0.9"/>
    <text x="445" y="240" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang HK','Noto Sans HK',sans-serif" font-size="11" font-weight="bold" fill="#E84A2A">排水體積</text>
    <text x="445" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#D04020">15 − 10 = 5cm³</text>

    <!-- 連接線 -->
    <line x1="390" y1="235" x2="352" y2="235" stroke="#E84A2A" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  </g>

  <!-- ===== 底部說明 ===== -->
  <text x="300" y="365" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang HK','Noto Sans HK',sans-serif" font-size="11" fill="#7A9ABA">💡 石頭體積 = 水位上升的體積 = 5cm³</text>

  <!-- 裝飾小圖標 -->
  <circle cx="540" cy="50" r="15" fill="#E8F4FD" stroke="#8AB0D0" stroke-width="1"/>
  <text x="540" y="55" text-anchor="middle" font-size="14">🧪</text>
</svg>