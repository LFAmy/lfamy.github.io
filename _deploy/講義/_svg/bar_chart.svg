<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸層 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </radialGradient>

    <!-- 長條 3D 漸層（四種顏色） -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#EE5A5A"/>
      <stop offset="100%" stop-color="#CC4444"/>
    </linearGradient>
    <linearGradient id="bar1Side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BB3333"/>
      <stop offset="100%" stop-color="#992222"/>
    </linearGradient>
    <linearGradient id="bar1Top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8888"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>

    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="40%" stop-color="#3DBDB4"/>
      <stop offset="100%" stop-color="#2DADA4"/>
    </linearGradient>
    <linearGradient id="bar2Side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D9D94"/>
      <stop offset="100%" stop-color="#0D8D84"/>
    </linearGradient>
    <linearGradient id="bar2Top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EDED6"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>

    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="40%" stop-color="#F0C92E"/>
      <stop offset="100%" stop-color="#DBA920"/>
    </linearGradient>
    <linearGradient id="bar3Side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99918"/>
      <stop offset="100%" stop-color="#B08010"/>
    </linearGradient>
    <linearGradient id="bar3Top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE870"/>
      <stop offset="100%" stop-color="#FFD93D"/>
    </linearGradient>

    <linearGradient id="bar4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="40%" stop-color="#5B4DD6"/>
      <stop offset="100%" stop-color="#4A3DC5"/>
    </linearGradient>
    <linearGradient id="bar4Side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A2DB5"/>
      <stop offset="100%" stop-color="#2A1DA5"/>
    </linearGradient>
    <linearGradient id="bar4Top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C7CF7"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <filter id="barShadow" x="-10%" y="-5%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <filter id="barShadowLight" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="16" ry="16" fill="url(#bgGrad)"/>

  <!-- 圓角卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="14" ry="14" fill="#FFFFFF" filter="url(#cardShadow)" opacity="0.95"/>
  <rect x="20" y="15" width="560" height="370" rx="14" ry="14" fill="none" stroke="#E8ECF0" stroke-width="1"/>

  <!-- 標題 -->
  <text x="300" y="52" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#2D3748" letter-spacing="1">
    四年級各班人數比較
  </text>
  <text x="300" y="72" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="12" fill="#8899AA" letter-spacing="0.5">
    香港仁愛小學 2024-2025 學年
  </text>

  <!-- 圖表區域：左邊界 80，右邊界 540，底部 y=330，頂部 y=90 -->
  <!-- Y 軸刻度線與標籤 -->
  <g font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="11" fill="#8899AA" text-anchor="end">
    <!-- 0 -->
    <line x1="80" y1="330" x2="540" y2="330" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="72" y="334">0</text>
    <!-- 10 -->
    <line x1="80" y1="282" x2="540" y2="282" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="72" y="286">10</text>
    <!-- 20 -->
    <line x1="80" y1="234" x2="540" y2="234" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="72" y="238">20</text>
    <!-- 30 -->
    <line x1="80" y1="186" x2="540" y2="186" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="72" y="190">30</text>
    <!-- 40 -->
    <line x1="80" y1="138" x2="540" y2="138" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="72" y="142">40</text>
    <!-- 50 -->
    <line x1="80" y1="90" x2="540" y2="90" stroke="#E2E8F0" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="72" y="94">50</text>
  </g>

  <!-- Y 軸主線 -->
  <line x1="80" y1="85" x2="80" y2="330" stroke="#CBD5E0" stroke-width="1.5"/>

  <!-- X 軸主線 -->
  <line x1="80" y1="330" x2="540" y2="330" stroke="#CBD5E0" stroke-width="1.5"/>

  <!-- 長條圖數據：四班，每條寬 60，間距 40 -->
  <!-- 一班：人數 45，高度 = 45 * (240/50) = 216，底部 y=330，頂部 y=114 -->
  <!-- 二班：人數 42，高度 = 42 * (240/50) = 201.6，頂部 y=128.4 -->
  <!-- 三班：人數 38，高度 = 38 * (240/50) = 182.4，頂部 y=147.6 -->
  <!-- 四班：人數 48，高度 = 48 * (240/50) = 230.4，頂部 y=99.6 -->

  <!-- 長條 1：四甲（45人） -->
  <g filter="url(#barShadow)">
    <!-- 側面（3D 效果） -->
    <rect x="128" y="114" width="60" height="216" rx="0" fill="url(#bar1Grad)"/>
    <!-- 右側面 -->
    <polygon points="188,114 198,108 198,324 188,330" fill="url(#bar1Side)"/>
    <!-- 頂面 -->
    <polygon points="128,114 138,108 198,108 188,114" fill="url(#bar1Top)"/>
    <!-- 頂面高光 -->
    <polygon points="128,114 138,108 198,108 188,114" fill="#FFFFFF" opacity="0.15"/>
  </g>
  <!-- 數值標籤 -->
  <text x="158" y="106" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#CC4444">45</text>
  <!-- 班級標籤 -->
  <text x="158" y="352" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#4A5568">四甲</text>

  <!-- 長條 2：四乙（42人） -->
  <g filter="url(#barShadowLight)">
    <rect x="228" y="128.4" width="60" height="201.6" rx="0" fill="url(#bar2Grad)"/>
    <polygon points="288,128.4 298,122.4 298,324 288,330" fill="url(#bar2Side)"/>
    <polygon points="228,128.4 238,122.4 298,122.4 288,128.4" fill="url(#bar2Top)"/>
    <polygon points="228,128.4 238,122.4 298,122.4 288,128.4" fill="#FFFFFF" opacity="0.15"/>
  </g>
  <text x="258" y="120.4" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#2DADA4">42</text>
  <text x="258" y="352" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#4A5568">四乙</text>

  <!-- 長條 3：四丙（38人） -->
  <g filter="url(#barShadowLight)">
    <rect x="328" y="147.6" width="60" height="182.4" rx="0" fill="url(#bar3Grad)"/>
    <polygon points="388,147.6 398,141.6 398,324 388,330" fill="url(#bar3Side)"/>
    <polygon points="328,147.6 338,141.6 398,141.6 388,147.6" fill="url(#bar3Top)"/>
    <polygon points="328,147.6 338,141.6 398,141.6 388,147.6" fill="#FFFFFF" opacity="0.15"/>
  </g>
  <text x="358" y="139.6" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#DBA920">38</text>
  <text x="358" y="352" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#4A5568">四丙</text>

  <!-- 長條 4：四丁（48人） -->
  <g filter="url(#barShadow)">
    <rect x="428" y="99.6" width="60" height="230.4" rx="0" fill="url(#bar4Grad)"/>
    <polygon points="488,99.6 498,93.6 498,324 488,330" fill="url(#bar4Side)"/>
    <polygon points="428,99.6 438,93.6 498,93.6 488,99.6" fill="url(#bar4Top)"/>
    <polygon points="428,99.6 438,93.6 498,93.6 488,99.6" fill="#FFFFFF" opacity="0.15"/>
  </g>
  <text x="458" y="91.6" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#4A3DC5">48</text>
  <text x="458" y="352" text-anchor="middle" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="13" font-weight="600" fill="#4A5568">四丁</text>

  <!-- 圖例 -->
  <g transform="translate(180, 368)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#FF6B6B"/>
    <text x="14" y="9" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="10" fill="#8899AA">四甲</text>
    <rect x="60" y="0" width="10" height="10" rx="2" fill="#4ECDC4"/>
    <text x="74" y="9" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="10" fill="#8899AA">四乙</text>
    <rect x="120" y="0" width="10" height="10" rx="2" fill="#FFD93D"/>
    <text x="134" y="9" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="10" fill="#8899AA">四丙</text>
    <rect x="180" y="0" width="10" height="10" rx="2" fill="#6C5CE7"/>
    <text x="194" y="9" font-family="'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="10" fill="#8899AA">四丁</text>
  </g>
</svg>