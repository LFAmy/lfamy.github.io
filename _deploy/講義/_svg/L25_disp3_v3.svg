<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d1ecf1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8dff0;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片主體漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>

    <!-- 水量漸變（藍色） -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.85" />
      <stop offset="30%" style="stop-color:#29b6f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0288d1;stop-opacity:0.95" />
    </linearGradient>

    <!-- 水量漸變2（第二個容器） -->
    <linearGradient id="waterGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81d4fa;stop-opacity:0.8" />
      <stop offset="40%" style="stop-color:#4fc3f7;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0277bd;stop-opacity:0.95" />
    </linearGradient>

    <!-- 水量漸變3（第三個容器） -->
    <linearGradient id="waterGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b3e5fc;stop-opacity:0.75" />
      <stop offset="50%" style="stop-color:#4fc3f7;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#01579b;stop-opacity:0.95" />
    </linearGradient>

    <!-- 金屬物體漸變（金幣） -->
    <radialGradient id="coinGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#fff9c4;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ffd54f;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ffb300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8f00;stop-opacity:1" />
    </radialGradient>

    <!-- 金屬物體漸變（銀幣） -->
    <radialGradient id="silverCoinGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#bdbdbd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9e9e9e;stop-opacity:1" />
    </radialGradient>

    <!-- 銅幣漸變 -->
    <radialGradient id="copperCoinGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffccbc;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#ffab91;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ff7043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e64a19;stop-opacity:1" />
    </radialGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#00000033"/>
    </filter>

    <filter id="innerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- 雙層陰影（物體用） -->
    <filter id="doubleShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000044"/>
      <feDropShadow dx="-1" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>

    <!-- 水面波紋濾鏡 -->
    <filter id="waterRipple">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- 刻度線圖案 -->
    <pattern id="scalePattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="10" x2="10" y2="10" stroke="#90a4ae" stroke-width="0.3" opacity="0.5"/>
    </pattern>

    <!-- 放射漸變高光 -->
    <radialGradient id="highlight" cx="30%" cy="25%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#01579b">📐 體積排水法 3 — 多重物體依次放入</text>
  <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#546e7a">比較放入不同物體後的水位變化</text>

  <!-- ===== 容器 1：初始狀態 ===== -->
  <g transform="translate(30, 70)">
    <!-- 卡片背景 -->
    <rect x="-5" y="-5" width="170" height="290" rx="14" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#cfd8dc" stroke-width="1"/>
    <!-- 卡片標題 -->
    <text x="80" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#37474f">① 初始狀態</text>

    <!-- 量杯 -->
    <rect x="25" y="30" width="110" height="180" rx="4" fill="none" stroke="#78909c" stroke-width="2.5"/>
    <rect x="25" y="30" width="110" height="180" rx="4" fill="url(#waterGrad)" opacity="0.5"/>
    <!-- 刻度 -->
    <rect x="25" y="30" width="110" height="180" rx="4" fill="url(#scalePattern)" opacity="0.3"/>
    <!-- 刻度標記 -->
    <line x1="25" y1="60" x2="35" y2="60" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="63" font-family="Arial" font-size="8" fill="#78909c">200</text>
    <line x1="25" y1="90" x2="35" y2="90" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="93" font-family="Arial" font-size="8" fill="#78909c">150</text>
    <line x1="25" y1="120" x2="35" y2="120" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="123" font-family="Arial" font-size="8" fill="#78909c">100</text>
    <line x1="25" y1="150" x2="35" y2="150" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="153" font-family="Arial" font-size="8" fill="#78909c">50</text>

    <!-- 水量（初始水位在 120 處） -->
    <rect x="27" y="120" width="106" height="88" rx="2" fill="url(#waterGrad)" opacity="0.7"/>
    <!-- 水面高光 -->
    <rect x="27" y="118" width="106" height="4" rx="2" fill="#b3e5fc" opacity="0.6"/>

    <!-- 水位標記 -->
    <line x1="25" y1="120" x2="135" y2="120" stroke="#0288d1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="137" y="123" font-family="Arial" font-size="9" fill="#0288d1" font-weight="bold">100 mL</text>

    <!-- 底部標籤 -->
    <text x="80" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#546e7a">清水</text>
    <text x="80" y="245" text-anchor="middle" font-family="Arial" font-size="9" fill="#90a4ae">水位：100 mL</text>
  </g>

  <!-- ===== 容器 2：放入金幣 ===== -->
  <g transform="translate(215, 70)">
    <rect x="-5" y="-5" width="170" height="290" rx="14" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#cfd8dc" stroke-width="1"/>
    <text x="80" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#37474f">② 放入金幣</text>

    <!-- 量杯 -->
    <rect x="25" y="30" width="110" height="180" rx="4" fill="none" stroke="#78909c" stroke-width="2.5"/>
    <rect x="25" y="30" width="110" height="180" rx="4" fill="url(#waterGrad2)" opacity="0.5"/>
    <rect x="25" y="30" width="110" height="180" rx="4" fill="url(#scalePattern)" opacity="0.3"/>
    <!-- 刻度 -->
    <line x1="25" y1="60" x2="35" y2="60" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="63" font-family="Arial" font-size="8" fill="#78909c">200</text>
    <line x1="25" y1="90" x2="35" y2="90" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="93" font-family="Arial" font-size="8" fill="#78909c">150</text>
    <line x1="25" y1="120" x2="35" y2="120" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="123" font-family="Arial" font-size="8" fill="#78909c">100</text>
    <line x1="25" y1="150" x2="35" y2="150" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="153" font-family="Arial" font-size="8" fill="#78909c">50</text>

    <!-- 水量（水位上升到 90） -->
    <rect x="27" y="90" width="106" height="118" rx="2" fill="url(#waterGrad2)" opacity="0.75"/>
    <rect x="27" y="88" width="106" height="4" rx="2" fill="#b3e5fc" opacity="0.6"/>

    <!-- 金幣（在底部） -->
    <ellipse cx="80" cy="195" rx="22" ry="8" fill="url(#coinGrad)" filter="url(#doubleShadow)"/>
    <ellipse cx="80" cy="193" rx="22" ry="8" fill="url(#coinGrad)"/>
    <ellipse cx="80" cy="193" rx="14" ry="5" fill="none" stroke="#ff8f00" stroke-width="0.8" opacity="0.5"/>
    <text x="80" y="196" text-anchor="middle" font-family="Arial" font-size="7" fill="#e65100" font-weight="bold">金</text>

    <!-- 水位標記 -->
    <line x1="25" y1="90" x2="135" y2="90" stroke="#0288d1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="137" y="93" font-family="Arial" font-size="9" fill="#0288d1" font-weight="bold">130 mL</text>

    <!-- 上升箭頭 -->
    <path d="M 145 120 L 155 110 L 165 120" fill="none" stroke="#e53935" stroke-width="1.5"/>
    <text x="155" y="135" text-anchor="middle" font-family="Arial" font-size="8" fill="#e53935">+30</text>

    <text x="80" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#546e7a">放入金幣</text>
    <text x="80" y="245" text-anchor="middle" font-family="Arial" font-size="9" fill="#90a4ae">水位：130 mL</text>
  </g>

  <!-- ===== 容器 3：再放入銀幣 ===== -->
  <g transform="translate(400, 70)">
    <rect x="-5" y="-5" width="170" height="290" rx="14" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#cfd8dc" stroke-width="1"/>
    <text x="80" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#37474f">③ 再放銀幣</text>

    <!-- 量杯 -->
    <rect x="25" y="30" width="110" height="180" rx="4" fill="none" stroke="#78909c" stroke-width="2.5"/>
    <rect x="25" y="30" width="110" height="180" rx="4" fill="url(#waterGrad3)" opacity="0.5"/>
    <rect x="25" y="30" width="110" height="180" rx="4" fill="url(#scalePattern)" opacity="0.3"/>
    <!-- 刻度 -->
    <line x1="25" y1="60" x2="35" y2="60" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="63" font-family="Arial" font-size="8" fill="#78909c">200</text>
    <line x1="25" y1="90" x2="35" y2="90" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="93" font-family="Arial" font-size="8" fill="#78909c">150</text>
    <line x1="25" y1="120" x2="35" y2="120" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="123" font-family="Arial" font-size="8" fill="#78909c">100</text>
    <line x1="25" y1="150" x2="35" y2="150" stroke="#78909c" stroke-width="1"/>
    <text x="38" y="153" font-family="Arial" font-size="8" fill="#78909c">50</text>

    <!-- 水量（水位上升到 70） -->
    <rect x="27" y="70" width="106" height="138" rx="2" fill="url(#waterGrad3)" opacity="0.8"/>
    <rect x="27" y="68" width="106" height="4" rx="2" fill="#b3e5fc" opacity="0.6"/>

    <!-- 金幣（在底部） -->
    <ellipse cx="72" cy="195" rx="18" ry="6" fill="url(#coinGrad)" filter="url(#doubleShadow)"/>
    <ellipse cx="72" cy="193" rx="18" ry="6" fill="url(#coinGrad)"/>
    <text x="72" y="196" text-anchor="middle" font-family="Arial" font-size="6" fill="#e65100" font-weight="bold">金</text>

    <!-- 銀幣（在金幣上面） -->
    <ellipse cx="92" cy="185" rx="16" ry="5" fill="url(#silverCoinGrad)" filter="url(#doubleShadow)"/>
    <ellipse cx="92" cy="183" rx="16" ry="5" fill="url(#silverCoinGrad)"/>
    <ellipse cx="92" cy="183" rx="10" ry="3" fill="none" stroke="#9e9e9e" stroke-width="0.6" opacity="0.5"/>
    <text x="92" y="185" text-anchor="middle" font-family="Arial" font-size="6" fill="#616161" font-weight="bold">銀</text>

    <!-- 水位標記 -->
    <line x1="25" y1="70" x2="135" y2="70" stroke="#01579b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="137" y="73" font-family="Arial" font-size="9" fill="#01579b" font-weight="bold">150 mL</text>

    <!-- 上升箭頭 -->
    <path d="M 145 90 L 155 80 L 165 90" fill="none" stroke="#e53935" stroke-width="1.5"/>
    <text x="155" y="105" text-anchor="middle" font-family="Arial" font-size="8" fill="#e53935">+20</text>

    <text x="80" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#546e7a">放入銀幣</text>
    <text x="80" y="245" text-anchor="middle" font-family="Arial" font-size="9" fill="#90a4ae">水位：150 mL</text>
  </g>

  <!-- ===== 底部總結卡片 ===== -->
  <g transform="translate(30, 365)">
    <rect x="0" y="0" width="540" height="28" rx="10" fill="#ffffff" filter="url(#cardShadow)" stroke="#b0bec5" stroke-width="0.8"/>
    <text x="270" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#37474f">
      💡 總結：放入物體使水位上升，物體體積 = 水位上升的體積
    </text>
  </g>

  <!-- 裝飾性浮動粒子 -->
  <circle cx="50" cy="350" r="2" fill="#4fc3f7" opacity="0.3"/>
  <circle cx="550" cy="45" r="1.5" fill="#4fc3f7" opacity="0.3"/>
  <circle cx="300" cy="365" r="1.5" fill="#4fc3f7" opacity="0.2"/>
</svg>