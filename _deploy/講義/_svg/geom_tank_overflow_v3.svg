<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景網格圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 水箱主體漸層（金屬質感） -->
    <linearGradient id="tankBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0D9E6"/>
      <stop offset="25%" stop-color="#E8EEF5"/>
      <stop offset="50%" stop-color="#B8C5D6"/>
      <stop offset="75%" stop-color="#E0E8F0"/>
      <stop offset="100%" stop-color="#A0B0C4"/>
    </linearGradient>

    <!-- 水箱玻璃面漸層 -->
    <linearGradient id="tankGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8E6F5" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#E8F4FC" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#A8D4EB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7BB8D4" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 水箱邊框漸層 -->
    <linearGradient id="tankBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8899AA"/>
      <stop offset="50%" stop-color="#6B7D8E"/>
      <stop offset="100%" stop-color="#556677"/>
    </linearGradient>

    <!-- 水體漸層（多層次藍色） -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A9BD9" stop-opacity="0.7"/>
      <stop offset="20%" stop-color="#3A8BC9" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#2A7BB9" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#1A6BA9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F5A99" stop-opacity="0.9"/>
    </linearGradient>

    <!-- 水面波紋漸層 -->
    <linearGradient id="waterSurface" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6BB8F0" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#8ED4F8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A8E0FF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#8ED4F8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6BB8F0" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 溢出水流漸層 -->
    <linearGradient id="overflowWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AB0E8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7CC8F0" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#4AA0D8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3A90C8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 溢出水流漸層2 -->
    <linearGradient id="overflowWater2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BC0F0" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#4AA8E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3A98D0" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 放射漸層：3D光影效果 -->
    <radialGradient id="lightGlow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
    </radialGradient>

    <!-- 陰影濾鏡（雙層陰影） -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
      <feDropShadow dx="-1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- 水花/水滴模糊 -->
    <filter id="waterBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- 波紋動畫 -->
    <style>
      @keyframes ripple {
        0% { transform: translateX(0); }
        100% { transform: translateX(20px); }
      }
      @keyframes drip {
        0% { opacity: 0; transform: translateY(0); }
        30% { opacity: 1; }
        100% { opacity: 0; transform: translateY(30px); }
      }
      @keyframes splash {
        0% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 0.6; }
        100% { opacity: 0; transform: scale(1.2); }
      }
      .ripple-anim { animation: ripple 3s ease-in-out infinite; }
      .drip-anim { animation: drip 1.5s ease-in infinite; }
      .drip-anim-2 { animation: drip 1.8s ease-in 0.5s infinite; }
      .drip-anim-3 { animation: drip 2s ease-in 1s infinite; }
      .splash-anim { animation: splash 2s ease-out infinite; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 主卡片 -->
  <rect x="20" y="15" width="560" height="370" rx="16" ry="16" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- 標題區域 -->
  <rect x="20" y="15" width="560" height="42" rx="16" ry="16" fill="#2C5F8A"/>
  <rect x="20" y="35" width="560" height="22" rx="0" ry="0" fill="#2C5F8A"/>
  <text x="300" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">📐 水箱溢出 — 水位超過高度 → 溢出量計算</text>

  <!-- 水箱底座陰影 -->
  <ellipse cx="310" cy="318" rx="145" ry="12" fill="#000000" opacity="0.15"/>

  <!-- === 水箱主體 === -->
  <g filter="url(#doubleShadow)">
    <!-- 水箱後壁 -->
    <rect x="175" y="80" width="260" height="230" rx="6" ry="6" fill="url(#tankBody)" stroke="url(#tankBorder)" stroke-width="2"/>

    <!-- 水箱內部（透明區域） -->
    <rect x="185" y="90" width="240" height="210" rx="4" ry="4" fill="#F0F6FC" opacity="0.5"/>

    <!-- 水箱內部水體（從底部到水位線） -->
    <rect x="185" y="170" width="240" height="130" rx="4" ry="4" fill="url(#waterGrad)"/>

    <!-- 水面波紋 -->
    <rect x="185" y="168" width="240" height="8" rx="2" ry="2" fill="url(#waterSurface)" class="ripple-anim"/>

    <!-- 水箱玻璃反射 -->
    <rect x="185" y="90" width="240" height="210" rx="4" ry="4" fill="url(#tankGlass)"/>

    <!-- 3D 光影效果 -->
    <rect x="175" y="80" width="260" height="230" rx="6" ry="6" fill="url(#lightGlow)"/>

    <!-- 水箱刻度線 -->
    <line x1="395" y1="120" x2="410" y2="120" stroke="#556677" stroke-width="1.5"/>
    <text x="415" y="124" font-family="Arial, sans-serif" font-size="11" fill="#556677">100ml</text>

    <line x1="395" y1="170" x2="410" y2="170" stroke="#556677" stroke-width="1.5"/>
    <text x="415" y="174" font-family="Arial, sans-serif" font-size="11" fill="#556677">200ml</text>

    <line x1="395" y1="220" x2="410" y2="220" stroke="#556677" stroke-width="1.5"/>
    <text x="415" y="224" font-family="Arial, sans-serif" font-size="11" fill="#556677">300ml</text>

    <line x1="395" y1="270" x2="410" y2="270" stroke="#556677" stroke-width="1.5"/>
    <text x="415" y="274" font-family="Arial, sans-serif" font-size="11" fill="#556677">400ml</text>
  </g>

  <!-- 水箱邊框高光 -->
  <rect x="175" y="80" width="260" height="230" rx="6" ry="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>

  <!-- === 溢出標示 === -->
  <!-- 溢出水線（從水箱頂部流出） -->
  <path d="M 185 90 Q 185 75, 195 70 L 210 65" stroke="#4AA8E0" stroke-width="3" fill="none" stroke-opacity="0.8" stroke-linecap="round"/>
  <path d="M 210 65 Q 220 60, 230 62" stroke="#4AA8E0" stroke-width="2.5" fill="none" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- 溢出水滴 -->
  <ellipse cx="215" cy="72" rx="4" ry="6" fill="#5AB0E8" opacity="0.7" class="drip-anim"/>
  <ellipse cx="228" cy="68" rx="3" ry="5" fill="#5AB0E8" opacity="0.6" class="drip-anim-2"/>
  <ellipse cx="205" cy="78" rx="3" ry="4" fill="#5AB0E8" opacity="0.5" class="drip-anim-3"/>

  <!-- 溢出水流（從水箱頂部流下） -->
  <path d="M 190 90 Q 188 100, 185 120 Q 182 140, 180 160 Q 178 180, 175 200" stroke="url(#overflowWater2)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 192 90 Q 190 105, 188 130 Q 186 155, 183 180" stroke="url(#overflowWater2)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- 水花/濺射效果 -->
  <circle cx="178" cy="195" r="6" fill="#6BC0F0" opacity="0.4" filter="url(#waterBlur)" class="splash-anim"/>
  <circle cx="182" cy="185" r="4" fill="#6BC0F0" opacity="0.3" filter="url(#waterBlur)" class="splash-anim"/>

  <!-- 溢出標示箭頭 -->
  <path d="M 240 60 L 260 60 L 250 50 M 260 60 L 250 70" stroke="#E74C3C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="270" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E74C3C">溢出</text>

  <!-- 水位標示箭頭 -->
  <path d="M 430 170 L 450 170 L 440 160 M 450 170 L 440 180" stroke="#2C5F8A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="455" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2C5F8A">水位</text>

  <!-- 水箱頂部標示 -->
  <path d="M 430 90 L 450 90 L 440 80 M 450 90 L 440 100" stroke="#E74C3C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="455" y="94" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E74C3C">頂部</text>

  <!-- === 資訊卡片（右下） === -->
  <rect x="380" y="240" width="185" height="130" rx="10" ry="10" fill="#F0F6FC" stroke="#D0D9E6" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- 資訊卡片標題 -->
  <rect x="380" y="240" width="185" height="28" rx="10" ry="10" fill="#3A7BB9"/>
  <rect x="380" y="258" width="185" height="10" rx="0" ry="0" fill="#3A7BB9"/>
  <text x="472" y="259" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">📊 溢出量計算</text>

  <text x="392" y="286" font-family="Arial, sans-serif" font-size="12" fill="#2C5F8A">水箱容量：400ml</text>
  <text x="392" y="306" font-family="Arial, sans-serif" font-size="12" fill="#2C5F8A">目前水位：200ml</text>
  <text x="392" y="326" font-family="Arial, sans-serif" font-size="12" fill="#2C5F8A">加入水量：250ml</text>

  <line x1="392" y1="334" x2="555" y2="334" stroke="#D0D9E6" stroke-width="1"/>

  <text x="392" y="352" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E74C3C">溢出量：50ml</text>

  <!-- 裝飾性小水滴（資訊卡旁） -->
  <circle cx="370" cy="280" r="3" fill="#5AB0E8" opacity="0.5"/>
  <circle cx="365" cy="300" r="2" fill="#5AB0E8" opacity="0.4"/>
  <circle cx="368" cy="320" r="2.5" fill="#5AB0E8" opacity="0.3"/>

  <!-- 左上角裝飾圖示 -->
  <circle cx="55" cy="65" r="20" fill="#E8F4FC" stroke="#3A7BB9" stroke-width="1.5" opacity="0.8"/>
  <text x="55" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">💧</text>

  <!-- 右下角裝飾 -->
  <circle cx="555" cy="365" r="12" fill="#E8F4FC" stroke="#3A7BB9" stroke-width="1" opacity="0.5"/>
  <text x="555" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">📝</text>
</svg>