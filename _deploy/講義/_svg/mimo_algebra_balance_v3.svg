<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>

    <!-- 多層漸變：天秤底座 -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="25%" stop-color="#E8C56A"/>
      <stop offset="50%" stop-color="#C99B3E"/>
      <stop offset="75%" stop-color="#B8862E"/>
      <stop offset="100%" stop-color="#A0711F"/>
    </linearGradient>

    <!-- 放射漸變：天秤立柱3D光影 -->
    <radialGradient id="pillarGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F0D888"/>
      <stop offset="30%" stop-color="#D4A853"/>
      <stop offset="60%" stop-color="#B8862E"/>
      <stop offset="85%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#6B4F0A"/>
    </radialGradient>

    <!-- 放射漸變：天秤橫樑3D光影 -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A0"/>
      <stop offset="20%" stop-color="#E8C56A"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="80%" stop-color="#B8862E"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>

    <!-- 多層漸變：X方塊（藍色系） -->
    <linearGradient id="xBlockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6CB4EE"/>
      <stop offset="20%" stop-color="#4A90D9"/>
      <stop offset="50%" stop-color="#2E6DB5"/>
      <stop offset="80%" stop-color="#1A4F8B"/>
      <stop offset="100%" stop-color="#0D3566"/>
    </linearGradient>

    <!-- 放射漸變：X方塊3D光影 -->
    <radialGradient id="xBlockRadial" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8DC8F8"/>
      <stop offset="25%" stop-color="#4A90D9"/>
      <stop offset="55%" stop-color="#2E6DB5"/>
      <stop offset="80%" stop-color="#1A4F8B"/>
      <stop offset="100%" stop-color="#0D3566"/>
    </radialGradient>

    <!-- 多層漸變：數字方塊（橙色系） -->
    <linearGradient id="numBlockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="20%" stop-color="#E8911A"/>
      <stop offset="50%" stop-color="#D47812"/>
      <stop offset="80%" stop-color="#B85E0A"/>
      <stop offset="100%" stop-color="#8C4505"/>
    </linearGradient>

    <!-- 放射漸變：數字方塊3D光影 -->
    <radialGradient id="numBlockRadial" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFC04D"/>
      <stop offset="25%" stop-color="#E8911A"/>
      <stop offset="55%" stop-color="#D47812"/>
      <stop offset="80%" stop-color="#B85E0A"/>
      <stop offset="100%" stop-color="#8C4505"/>
    </radialGradient>

    <!-- 多層漸變：卡片背景 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#EDF0F3"/>
    </linearGradient>

    <!-- 放射漸變：卡片高光 -->
    <radialGradient id="cardHighlight" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡：天秤 -->
    <filter id="shadow3d" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.25)"/>
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="rgba(0,0,0,0.12)"/>
    </filter>

    <!-- 雙層陰影濾鏡：方塊 -->
    <filter id="blockShadow" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 雙層陰影濾鏡：卡片 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.15)"/>
      <feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="rgba(0,0,0,0.08)"/>
    </filter>

    <!-- 箭頭（步驟指示） -->
    <marker id="arrowRight" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 L3,4 Z" fill="#5A6B7C"/>
    </marker>

    <!-- 向下箭頭 -->
    <marker id="arrowDown" markerWidth="8" markerHeight="12" refX="4" refY="10" orient="auto">
      <path d="M0,0 L8,0 L4,12 Z" fill="#5A6B7C"/>
    </marker>

    <!-- 天秤吊繩漸變 -->
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7355"/>
      <stop offset="50%" stop-color="#C4A97D"/>
      <stop offset="100%" stop-color="#8B7355"/>
    </linearGradient>

    <!-- 金色高光 -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D0"/>
      <stop offset="50%" stop-color="#E8C56A"/>
      <stop offset="100%" stop-color="#B8862E"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- ==================== 天秤系統 ==================== -->

  <!-- 天秤底座 -->
  <g filter="url(#shadow3d)">
    <path d="M240,135 L360,135 L370,145 L230,145 Z" fill="url(#baseGrad)" stroke="#8B6914" stroke-width="1"/>
    <!-- 底座高光 -->
    <path d="M245,136 L355,136 L362,143 L238,143 Z" fill="url(#goldHighlight)" opacity="0.3"/>
  </g>

  <!-- 天秤立柱 -->
  <g filter="url(#shadow3d)">
    <rect x="290" y="80" width="20" height="58" rx="2" fill="url(#pillarGrad)" stroke="#8B6914" stroke-width="0.8"/>
    <!-- 立柱頂部裝飾 -->
    <ellipse cx="300" cy="80" rx="14" ry="4" fill="#E8C56A" stroke="#8B6914" stroke-width="0.8"/>
    <ellipse cx="300" cy="80" rx="10" ry="2.5" fill="#F5E0A0" opacity="0.6"/>
  </g>

  <!-- 天秤橫樑 -->
  <g filter="url(#shadow3d)">
    <rect x="170" y="72" width="260" height="10" rx="3" fill="url(#beamGrad)" stroke="#8B6914" stroke-width="0.8"/>
    <!-- 橫樑高光 -->
    <rect x="175" y="73" width="250" height="3" rx="1.5" fill="#F5E0A0" opacity="0.4"/>
    <!-- 橫樑中心裝飾 -->
    <circle cx="300" cy="77" r="5" fill="#D4A853" stroke="#8B6914" stroke-width="0.8"/>
    <circle cx="300" cy="77" r="2.5" fill="#F5E0A0" opacity="0.5"/>
  </g>

  <!-- 左側吊繩 -->
  <g>
    <line x1="195" y1="72" x2="195" y2="100" stroke="url(#ropeGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="225" y1="72" x2="225" y2="100" stroke="url(#ropeGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 吊繩橫桿 -->
    <rect x="190" y="98" width="40" height="4" rx="2" fill="#C4A97D" stroke="#8B7355" stroke-width="0.5"/>
  </g>

  <!-- 右側吊繩 -->
  <g>
    <line x1="375" y1="72" x2="375" y2="100" stroke="url(#ropeGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="405" y1="72" x2="405" y2="100" stroke="url(#ropeGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="370" y="98" width="40" height="4" rx="2" fill="#C4A97D" stroke="#8B7355" stroke-width="0.5"/>
  </g>

  <!-- ==================== 左盤：3個x + 2個方塊 ==================== -->
  <g filter="url(#blockShadow)">
    <!-- 左盤托盤 -->
    <ellipse cx="210" cy="155" rx="55" ry="8" fill="#D4A853" stroke="#8B6914" stroke-width="0.8"/>
    <ellipse cx="210" cy="153" rx="50" ry="5" fill="#E8C56A" opacity="0.4"/>

    <!-- X 方塊 1 -->
    <rect x="175" y="118" width="28" height="28" rx="3" fill="url(#xBlockRadial)" stroke="#1A4F8B" stroke-width="0.8"/>
    <text x="189" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="Arial">x</text>

    <!-- X 方塊 2 -->
    <rect x="207" y="118" width="28" height="28" rx="3" fill="url(#xBlockRadial)" stroke="#1A4F8B" stroke-width="0.8"/>
    <text x="221" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="Arial">x</text>

    <!-- X 方塊 3 -->
    <rect x="239" y="118" width="28" height="28" rx="3" fill="url(#xBlockRadial)" stroke="#1A4F8B" stroke-width="0.8"/>
    <text x="253" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="Arial">x</text>

    <!-- 數字方塊 1 -->
    <rect x="185" y="148" width="22" height="22" rx="3" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.8"/>
    <text x="196" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial">1</text>

    <!-- 數字方塊 2 -->
    <rect x="211" y="148" width="22" height="22" rx="3" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.8"/>
    <text x="222" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial">1</text>
  </g>

  <!-- ==================== 右盤：11個方塊 ==================== -->
  <g filter="url(#blockShadow)">
    <!-- 右盤托盤 -->
    <ellipse cx="390" cy="155" rx="55" ry="8" fill="#D4A853" stroke="#8B6914" stroke-width="0.8"/>
    <ellipse cx="390" cy="153" rx="50" ry="5" fill="#E8C56A" opacity="0.4"/>

    <!-- 11個數字方塊（3行排列） -->
    <!-- 第1行：4個 -->
    <rect x="363" y="118" width="18" height="18" rx="2.5" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.7"/>
    <text x="372" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">1</text>

    <rect x="384" y="118" width="18" height="18" rx="2.5" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.7"/>
    <text x="393" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">1</text>

    <rect x="405" y="118" width="18" height="18" rx="2.5" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.7"/>
    <text x="414" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">1</text>

    <!-- 第2行：4個 -->
    <rect x="363" y="139" width="18" height="18" rx="2.5" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.7"/>
    <text x="372" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">1</text>

    <rect x="384" y="139" width="18" height="18" rx="2.5" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.7"/>
    <text x="393" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">1</text>

    <rect x="405" y="139" width="18" height="18" rx="2.5" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.7"/>
    <text x="414" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">1</text>

    <!-- 第3行：3個 -->
    <rect x="373" y="160" width="18" height="18" rx="2.5" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.7"/>
    <text x="382" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">1</text>

    <rect x="394" y="160" width="18" height="18" rx="2.5" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.7"/>
    <text x="403" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">1</text>

    <rect x="415" y="160" width="18" height="18" rx="2.5" fill="url(#numBlockRadial)" stroke="#8C4505" stroke-width="0.7"/>
    <text x="424" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial">1</text>
  </g>

  <!-- ==================== 步驟卡片 ==================== -->

  <!-- 步驟1卡片：3x+2=11 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="260" width="150" height="55" rx="12" fill="url(#cardGrad)" stroke="#D0D5DD" stroke-width="1"/>
    <rect x="60" y="260" width="150" height="55" rx="12" fill="url(#cardHighlight)"/>
    <!-- 步驟標籤 -->
    <rect x="68" y="268" width="20" height="20" rx="10" fill="#4A90D9"/>
    <text x="78" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="Arial">1</text>
    <!-- 方程式 -->
    <text x="135" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C3E50" font-family="Arial">
      3x + 2 = 11
    </text>
  </g>

  <!-- 箭頭 1→2 -->
  <line x1="215" y1="287" x2="255" y2="287" stroke="#5A6B7C" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- 步驟2卡片：3x=9 -->
  <g filter="url(#cardShadow)">
    <rect x="270" y="260" width="130" height="55" rx="12" fill="url(#cardGrad)" stroke="#D0D5DD" stroke-width="1"/>
    <rect x="270" y="260" width="130" height="55" rx="12" fill="url(#cardHighlight)"/>
    <rect x="278" y="268" width="20" height="20" rx="10" fill="#E8911A"/>
    <text x="288" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="Arial">2</text>
    <text x="335" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C3E50" font-family="Arial">
      3x = 9
    </text>
  </g>

  <!-- 箭頭 2→3 -->
  <line x1="405" y1="287" x2="445" y2="287" stroke="#5A6B7C" stroke-width="2.5" marker-end="url(#arrowRight)"/>

  <!-- 步驟3卡片：x=3 -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="260" width="110" height="55" rx="12" fill="url(#cardGrad)" stroke="#D0D5DD" stroke-width="1"/>
    <rect x="460" y="260" width="110" height="55" rx="12" fill="url(#cardHighlight)"/>
    <rect x="468" y="268" width="20" height="20" rx="10" fill="#27AE60"/>
    <text x="478" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="white" font-family="Arial">3</text>
    <text x="515" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C3E50" font-family="Arial">
      x = 3
    </text>
  </g>

  <!-- ==================== 裝飾元素 ==================== -->

  <!-- 天秤頂部裝飾 -->
  <circle cx="300" cy="68" r="4" fill="#F5E0A0" stroke="#D4A853" stroke-width="0.8"/>
  <circle cx="300" cy="68" r="1.5" fill="#FFF5D0"/>

  <!-- 左盤輕微晃動線條（動態感） -->
  <line x1="160" y1="82" x2="160" y2="92" stroke="#C4A97D" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="82" x2="260" y2="92" stroke="#C4A97D" stroke-width="1" opacity="0.5"/>

  <!-- 右盤輕微晃動線條 -->
  <line x1="340" y1="82" x2="340" y2="92" stroke="#C4A97D" stroke-width="1" opacity="0.5"/>
  <line x1="440" y1="82" x2="440" y2="92" stroke="#C4A97D" stroke-width="1" opacity="0.5"/>

  <!-- 底部裝飾線 -->
  <line x1="180" y1="340" x2="420" y2="340" stroke="#D0D5DD" stroke-width="0.5" opacity="0.5"/>

  <!-- 標題 -->
  <text x="300" y="370" text-anchor="middle" font-size="13" fill="#7A8B9C" font-family="Arial" letter-spacing="2">
    天秤解方程 · 等式性質
  </text>
</svg>