<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#4F46E5" opacity="0.06"/>
    </pattern>

    <!-- 主色多層漸變（3-5 stop） -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- 強調色多層漸變 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- 3D光影放射漸變 - 圓餅1 -->
    <radialGradient id="pie3d_1" cx="35%" cy="30%" r="65%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#4F46E5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3730A3" stop-opacity="0.9"/>
    </radialGradient>

    <!-- 3D光影放射漸變 - 圓餅2 -->
    <radialGradient id="pie3d_2" cx="35%" cy="30%" r="65%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.9"/>
    </radialGradient>

    <!-- 3D光影放射漸變 - 圓餅3 -->
    <radialGradient id="pie3d_3" cx="35%" cy="30%" r="65%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FBBF24" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.9"/>
    </radialGradient>

    <!-- 圓餅底部陰影放射 -->
    <radialGradient id="pieShadow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" blur="4" flood-opacity="0.15" flood-color="#4F46E5"/>
      <feDropShadow dx="0" dy="6" blur="12" flood-opacity="0.08" flood-color="#4F46E5"/>
    </filter>

    <filter id="pieShadowFilter" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" blur="5" flood-opacity="0.2" flood-color="#000"/>
    </filter>

    <!-- 漸層邊框濾鏡 -->
    <filter id="borderGrad" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" blur="2" flood-opacity="0.1" flood-color="#4F46E5"/>
    </filter>

    <!-- 箭頭定義 - 漸層色 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="url(#arrowGrad)"/>
    </marker>

    <!-- 等號漸層 -->
    <linearGradient id="equalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- 卡片漸層邊框 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 主標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937">分數加法：1/4 + 2/4 = 3/4</text>

  <!-- ===== 第一階段卡片：1/4 ===== -->
  <g filter="url(#cardShadow)">
    <!-- 卡片背景 -->
    <rect x="25" y="55" width="160" height="200" rx="14" ry="14" fill="#FFFFFF" stroke="url(#cardBorder)" stroke-width="2"/>
    <!-- 卡片標題 -->
    <rect x="25" y="55" width="160" height="36" rx="14" ry="14" fill="url(#mainGrad)" opacity="0.9"/>
    <rect x="25" y="75" width="160" height="16" fill="url(#mainGrad)" opacity="0.9"/>
    <text x="105" y="78" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">第一步：1/4</text>

    <!-- 圓餅1 - 3D立體 -->
    <g transform="translate(105, 155)">
      <!-- 底部陰影 -->
      <ellipse cx="0" cy="38" rx="52" ry="12" fill="url(#pieShadow)"/>
      <!-- 圓餅底盤（3D厚度） -->
      <ellipse cx="0" cy="5" rx="50" ry="50" fill="#3730A3" opacity="0.3"/>
      <!-- 圓餅本體 -->
      <circle cx="0" cy="0" r="50" fill="url(#pie3d_1)" filter="url(#pieShadowFilter)"/>
      <!-- 1/4 切片（右上象限） -->
      <path d="M0,0 L0,-50 A50,50 0 0,1 50,0 Z" fill="url(#accentGrad)" opacity="0.85"/>
      <!-- 切片邊線 -->
      <path d="M0,0 L0,-50" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <path d="M0,0 L50,0" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <!-- 圓餅邊框 -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#4F46E5" stroke-width="1.5" opacity="0.4"/>
      <!-- 高光 -->
      <ellipse cx="-15" cy="-18" rx="18" ry="12" fill="#FFFFFF" opacity="0.15" transform="rotate(-30)"/>
    </g>

    <!-- 標註 -->
    <text x="105" y="218" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="10" fill="#6B7280">1 份被選取</text>
    <text x="105" y="233" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="10" fill="#9CA3AF">共 4 份</text>
  </g>

  <!-- 箭頭 1→2 -->
  <g>
    <line x1="195" y1="155" x2="225" y2="155" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  </g>

  <!-- ===== 第二階段卡片：2/4 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="235" y="55" width="160" height="200" rx="14" ry="14" fill="#FFFFFF" stroke="url(#cardBorder)" stroke-width="2"/>
    <rect x="235" y="55" width="160" height="36" rx="14" ry="14" fill="url(#mainGrad)" opacity="0.9"/>
    <rect x="235" y="75" width="160" height="16" fill="url(#mainGrad)" opacity="0.9"/>
    <text x="315" y="78" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">第二步：2/4</text>

    <!-- 圓餅2 - 3D立體 -->
    <g transform="translate(315, 155)">
      <ellipse cx="0" cy="38" rx="52" ry="12" fill="url(#pieShadow)"/>
      <ellipse cx="0" cy="5" rx="50" ry="50" fill="#6D28D9" opacity="0.3"/>
      <circle cx="0" cy="0" r="50" fill="url(#pie3d_2)" filter="url(#pieShadowFilter)"/>
      <!-- 2/4 切片（右上+右下象限） -->
      <path d="M0,0 L0,-50 A50,50 0 0,1 50,0 A50,50 0 0,1 0,50 Z" fill="url(#accentGrad)" opacity="0.85"/>
      <!-- 切片邊線 -->
      <path d="M0,0 L0,-50" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <path d="M0,0 L50,0" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <path d="M0,0 L0,50" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="-15" cy="-18" rx="18" ry="12" fill="#FFFFFF" opacity="0.15" transform="rotate(-30)"/>
    </g>

    <text x="315" y="218" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="10" fill="#6B7280">2 份被選取</text>
    <text x="315" y="233" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="10" fill="#9CA3AF">共 4 份</text>
  </g>

  <!-- 箭頭 2→3 -->
  <g>
    <line x1="405" y1="155" x2="435" y2="155" stroke="url(#arrowGrad)" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  </g>

  <!-- ===== 第三階段卡片：3/4 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="445" y="55" width="160" height="200" rx="14" ry="14" fill="#FFFFFF" stroke="url(#cardBorder)" stroke-width="2"/>
    <rect x="445" y="55" width="160" height="36" rx="14" ry="14" fill="url(#accentGrad)" opacity="0.9"/>
    <rect x="445" y="75" width="160" height="16" fill="url(#accentGrad)" opacity="0.9"/>
    <text x="525" y="78" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">答案：3/4</text>

    <!-- 圓餅3 - 3D立體 -->
    <g transform="translate(525, 155)">
      <ellipse cx="0" cy="38" rx="52" ry="12" fill="url(#pieShadow)"/>
      <ellipse cx="0" cy="5" rx="50" ry="50" fill="#B45309" opacity="0.3"/>
      <circle cx="0" cy="0" r="50" fill="url(#pie3d_3)" filter="url(#pieShadowFilter)"/>
      <!-- 3/4 切片（右上+右下+左下象限） -->
      <path d="M0,0 L0,-50 A50,50 0 0,1 50,0 A50,50 0 0,1 0,50 A50,50 0 0,1 -50,0 Z" fill="url(#accentGrad)" opacity="0.85"/>
      <!-- 切片邊線 -->
      <path d="M0,0 L0,-50" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <path d="M0,0 L50,0" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <path d="M0,0 L0,50" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <path d="M0,0 L-50,0" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#D97706" stroke-width="1.5" opacity="0.4"/>
      <ellipse cx="-15" cy="-18" rx="18" ry="12" fill="#FFFFFF" opacity="0.15" transform="rotate(-30)"/>
    </g>

    <text x="525" y="218" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="10" fill="#6B7280">3 份被選取</text>
    <text x="525" y="233" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="10" fill="#9CA3AF">共 4 份</text>
  </g>

  <!-- ===== 等號連接 ===== -->
  <!-- 第一階段與第二階段之間的等號 -->
  <g transform="translate(210, 150)">
    <text x="0" y="0" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#equalGrad)">+</text>
  </g>

  <!-- 第二階段與第三階段之間的等號 -->
  <g transform="translate(420, 150)">
    <text x="0" y="0" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="20" font-weight="bold" fill="url(#equalGrad)">=</text>
  </g>

  <!-- ===== 底部計算式 ===== -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="280" width="300" height="50" rx="12" ry="12" fill="#FFFFFF" stroke="url(#cardBorder)" stroke-width="1.5"/>
    <!-- 計算式背景高亮 -->
    <rect x="150" y="280" width="300" height="50" rx="12" ry="12" fill="url(#mainGrad)" opacity="0.05"/>
    <text x="300" y="312" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2937">
      1/4 + 2/4 = 3/4
    </text>
  </g>

  <!-- 底部說明 -->
  <text x="300" y="360" text-anchor="middle" font-family="'Microsoft JhengHei', 'Noto Sans TC', Arial, sans-serif" font-size="11" fill="#9CA3AF">同分母分數加法：分母不變，分子相加</text>

  <!-- 裝飾性小圓點 -->
  <circle cx="30" cy="375" r="3" fill="#4F46E5" opacity="0.15"/>
  <circle cx="570" cy="375" r="3" fill="#F59E0B" opacity="0.15"/>
  <circle cx="300" cy="385" r="2" fill="#818CF8" opacity="0.1"/>
</svg>