<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#F9FAFB"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="600" height="52" rx="0" fill="url(#grad1)"/>
  <text x="300" y="32" fill="white" font-size="20" font-weight="bold" text-anchor="middle">P5 SSPA 終極跨課題殺手題</text>
  
  <!-- Badge -->
  <rect x="20" y="60" width="120" height="28" rx="14" fill="url(#grad2)" filter="url(#shadow2)"/>
  <text x="80" y="79" fill="white" font-size="12" font-weight="bold" text-anchor="middle">🔥 高難度模擬</text>
  
  <!-- Main Card -->
  <rect x="20" y="96" width="280" height="180" rx="12" fill="white" filter="url(#shadow1)"/>
  <rect x="20" y="96" width="280" height="36" rx="12" fill="url(#grad1)"/>
  <rect x="20" y="120" width="280" height="12" fill="url(#grad1)"/>
  <text x="160" y="120" fill="white" font-size="14" font-weight="bold" text-anchor="middle">📐 綜合應用題</text>
  
  <!-- Problem text -->
  <text x="32" y="158" fill="#1F2937" font-size="13" font-weight="bold">長方形ABCD中，AB = 12cm，</text>
  <text x="32" y="178" fill="#1F2937" font-size="13" font-weight="bold">BC = 8cm。E是BC的中點，</text>
  <text x="32" y="198" fill="#1F2937" font-size="13" font-weight="bold">F是CD上一點且CF = 3cm。</text>
  <text x="32" y="218" fill="#1F2937" font-size="13" font-weight="bold">求三角形AEF的面積。</text>
  
  <!-- Diagram area -->
  <rect x="180" y="150" width="108" height="108" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <!-- Rectangle ABCD -->
  <rect x="195" y="168" width="80" height="56" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <!-- Points -->
  <circle cx="195" cy="168" r="3" fill="#EF4444"/>
  <text x="188" y="164" fill="#EF4444" font-size="11" font-weight="bold">A</text>
  <circle cx="275" cy="168" r="3" fill="#EF4444"/>
  <text x="278" y="164" fill="#EF4444" font-size="11" font-weight="bold">B</text>
  <circle cx="275" cy="224" r="3" fill="#EF4444"/>
  <text x="278" y="232" fill="#EF4444" font-size="11" font-weight="bold">C</text>
  <circle cx="195" cy="224" r="3" fill="#EF4444"/>
  <text x="182" y="232" fill="#EF4444" font-size="11" font-weight="bold">D</text>
  <!-- E midpoint of BC -->
  <circle cx="275" cy="196" r="3" fill="#10B981"/>
  <text x="280" y="200" fill="#10B981" font-size="11" font-weight="bold">E</text>
  <!-- F on CD -->
  <circle cx="262" cy="224" r="3" fill="#F59E0B"/>
  <text x="260" y="240" fill="#F59E0B" font-size="11" font-weight="bold">F</text>
  <!-- Triangle AEF -->
  <polygon points="195,168 275,196 262,224" fill="#4F46E5" fill-opacity="0.15" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Steps Card -->
  <rect x="320" y="96" width="260" height="286" rx="12" fill="white" filter="url(#shadow1)"/>
  <rect x="320" y="96" width="260" height="36" rx="12" fill="url(#grad3)"/>
  <rect x="320" y="120" width="260" height="12" fill="url(#grad3)"/>
  <text x="450" y="120" fill="white" font-size="14" font-weight="bold" text-anchor="middle">✅ 解題步驟</text>
  
  <!-- Step 1 -->
  <rect x="332" y="140" width="24" height="24" rx="12" fill="#4F46E5"/>
  <text x="344" y="157" fill="white" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  <text x="362" y="148" fill="#1F2937" font-size="12">計算ABCD面積</text>
  <text x="362" y="163" fill="#6B7280" font-size="11">12 × 8 = 96 cm²</text>
  
  <!-- Arrow -->
  <line x1="344" y1="168" x2="344" y2="180" stroke="#D1D5DB" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 2 -->
  <rect x="332" y="184" width="24" height="24" rx="12" fill="#4F46E5"/>
  <text x="344" y="201" fill="white" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  <text x="362" y="192" fill="#1F2937" font-size="12">三個三角形面積</text>
  <text x="362" y="207" fill="#6B7280" font-size="11">△ABE + △ECF + △ADF</text>
  
  <!-- Arrow -->
  <line x1="344" y1="212" x2="344" y2="224" stroke="#D1D5DB" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Step 3 -->
  <rect x="332" y="228" width="24" height="24" rx="12" fill="#F59E0B"/>
  <text x="344" y="245" fill="white" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  <text x="362" y="236" fill="#1F2937" font-size="12">相減得答案</text>
  <text x="362" y="251" fill="#6B7280" font-size="11">96 − 24 − 6 − 30 = ?</text>
  
  <!-- Answer Box -->
  <rect x="332" y="264" width="236" height="48" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="450" y="284" fill="#92400E" font-size="13" font-weight="bold" text-anchor="middle">💡 答案：三角形AEF面積</text>
  <text x="450" y="302" fill="#B45309" font-size="16" font-weight="bold" text-anchor="middle">= 36 cm²</text>
  
  <!-- Key Formula Card -->
  <rect x="20" y="290" width="280" height="92" rx="12" fill="white" filter="url(#shadow1)"/>
  <rect x="20" y="290" width="280" height="32" rx="12" fill="#FEF3C7"/>
  <rect x="20" y="312" width="280" height="10" fill="#FEF3C7"/>
  <text x="160" y="311" fill="#92400E" font-size="13" font-weight="bold" text-anchor="middle">⭐ 重點提示</text>
  <text x="32" y="340" fill="#4F46E5" font-size="12">● 跨課題：面積 + 分數 + 代數</text>
  <text x="32" y="360" fill="#F59E0B" font-size="12">● 技巧：總面積 − 外圍三角形</text>
  <text x="32" y="380" fill="#10B981" font-size="12">● 記得找中點、比例關係！</text>
  
  <!-- Decorative elements -->
  <circle cx="560" y="60" r="18" fill="#4F46E5" fill-opacity="0.1"/>
  <text x="560" y="65" fill="#4F46E5" font-size="16" text-anchor="middle">🌟</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="392" width="600" height="8" fill="url(#grad1)"/>
</svg>