<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4F46E5"/>
    </marker>
    <marker id="arrowhead-gold" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="400" rx="15" fill="#F9FAFB"/>
  
  <!-- 主標題 -->
  <rect x="50" y="20" width="500" height="55" rx="12" fill="url(#gradTitle)" filter="url(#shadow)"/>
  <text x="300" y="55" text-anchor="middle" fill="white" font-size="22" font-weight="bold">P5 SSPA計算題滿分衝刺</text>
  <defs>
    <linearGradient id="gradTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- 主圖：計算機與閃電 -->
  <g transform="translate(300, 130)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="white" stroke="#4F46E5" stroke-width="2"/>
    <rect x="-60" y="-20" width="120" height="40" rx="5" fill="#E0E7FF"/>
    <text x="0" y="5" text-anchor="middle" fill="#4F46E5" font-size="16" font-weight="bold">SSPA</text>
    <path d="M-15 -45 L-10 -25 L5 -25 L-5 -5 L-15 -25 L0 -25 Z" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
  </g>

  <!-- 卡片：提速技巧 -->
  <rect x="30" y="180" width="250" height="180" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="30" y="180" width="250" height="40" rx="12" fill="#4F46E5"/>
  <text x="155" y="207" text-anchor="middle" fill="white" font-size="14" font-weight="bold">計算提速技巧</text>
  
  <g transform="translate(45, 235)" font-size="13" fill="#374151">
    <text x="0" y="15" font-weight="bold" fill="#4F46E5">1. 仔細讀題</text>
    <text x="15" y="38">圈出關鍵數字和要求</text>
    
    <text x="0" y="68" font-weight="bold" fill="#4F46E5">2. 分步拆解</text>
    <text x="15" y="91">複雜題目分成小步驟</text>
    
    <text x="0" y="121" font-weight="bold" fill="#4F46E5">3. 工具運用</text>
    <text x="15" y="144">善用草稿紙和計算機驗算</text>
  </g>

  <!-- 卡片：滿分策略 -->
  <rect x="320" y="180" width="250" height="180" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="320" y="180" width="250" height="40" rx="12" fill="#10B981"/>
  <text x="445" y="207" text-anchor="middle" fill="white" font-size="14" font-weight="bold">滿分衝刺策略</text>
  
  <g transform="translate(335, 235)" font-size="13">
    <rect x="0" y="0" width="220" height="115" rx="8" fill="#ECFDF5"/>
    <text x="110" y="25" text-anchor="middle" fill="#065F46" font-weight="bold">答題流程</text>
    
    <text x="30" y="50" text-anchor="middle" fill="#10B981" font-size="12">審題</text>
    <line x1="60" y1="47" x2="90" y2="47" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-gold)"/>
    <text x="110" y="50" text-anchor="middle" fill="#10B981" font-size="12">計算</text>
    <line x1="140" y1="47" x2="170" y2="47" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-gold)"/>
    <text x="190" y="50" text-anchor="middle" fill="#10B981" font-size="12">檢查</text>
    
    <line x1="190" y1="58" x2="190" y2="75" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead-gold)"/>
    <text x="110" y="85" text-anchor="middle" fill="#065F46" font-size="11">最後檢查：單位、符號、計算過程</text>
  </g>

  <!-- 提醒標語 -->
  <rect x="150" y="375" width="300" height="20" rx="10" fill="#FEF3C7"/>
  <text x="300" y="390" text-anchor="middle" fill="#92400E" font-size="11" font-weight="bold">專心、細心、耐心，滿分自然來！</text>

  <!-- 箭頭連接 -->
  <line x1="300" y1="175" x2="155" y2="180" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="175" x2="445" y2="180" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrowhead-gold)"/>
</svg>