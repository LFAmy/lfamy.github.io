<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>

    <!-- 卡片主體漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e8e0f0;stop-opacity:0.95"/>
    </linearGradient>

    <!-- 卡片邊框漸變 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>

    <!-- 3D光影效果 - 左上光 -->
    <radialGradient id="lightEffect" cx="20%" cy="20%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>

    <!-- 3D光影效果 - 右下陰影 -->
    <radialGradient id="shadowEffect" cx="80%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>

    <!-- 去程箭頭漸變 -->
    <linearGradient id="arrowGo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b"/>
      <stop offset="100%" style="stop-color:#38f9d7"/>
    </linearGradient>

    <!-- 回程箭頭漸變 -->
    <linearGradient id="arrowBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fa709a"/>
      <stop offset="100%" style="stop-color:#fee140"/>
    </linearGradient>

    <!-- 平均速率圓圈漸變 -->
    <radialGradient id="avgCircle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a18cd1"/>
      <stop offset="100%" style="stop-color:#fbc2eb"/>
    </radialGradient>

    <!-- 錯誤標記漸變 -->
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>

    <!-- 正確標記漸變 -->
    <linearGradient id="correctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0abde3"/>
      <stop offset="100%" style="stop-color:#48dbfb"/>
    </linearGradient>

    <!-- 雙層陰影過濾器 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#667eea" flood-opacity="0.15"/>
    </filter>

    <!-- 內陰影 -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- 發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- 背景裝飾圓 -->
  <circle cx="100" cy="80" r="60" fill="#667eea" opacity="0.08"/>
  <circle cx="520" cy="320" r="80" fill="#764ba2" opacity="0.08"/>
  <circle cx="500" cy="60" r="40" fill="#43e97b" opacity="0.06"/>

  <!-- 主卡片 - 圓角卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#doubleShadow)"/>

  <!-- 卡片3D光影層 -->
  <rect x="25" y="20" width="550" height="360" rx="20" ry="20" fill="url(#lightEffect)"/>
  <rect x="25" y="20" width="550" height="360" rx="20" ry="20" fill="url(#shadowEffect)"/>

  <!-- 卡片頂部裝飾條 -->
  <rect x="25" y="20" width="550" height="8" rx="4" ry="4" fill="url(#borderGrad)"/>

  <!-- 標題 -->
  <text x="300" y="62" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="22" font-weight="bold" fill="#2d1b69">
    🚗 平均速率 の 秘密
  </text>
  <text x="300" y="82" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" fill="#7c6ba0">
    去程 60 km/h · 回程 40 km/h · 平均 ≠ (60+40)÷2
  </text>

  <!-- 分隔線 -->
  <line x1="50" y1="95" x2="550" y2="95" stroke="#d0c8e0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ============ 去程視覺化 ============ -->
  <text x="60" y="125" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="bold" fill="#2d8a4e">
    ➤ 去程
  </text>

  <!-- 去程箭頭 -->
  <defs>
    <marker id="arrowGoHead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#43e97b"/>
    </marker>
  </defs>
  <line x1="60" y1="145" x2="280" y2="145" stroke="url(#arrowGo)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowGoHead)"/>

  <!-- 去程標籤 -->
  <text x="170" y="138" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="12" fill="#2d8a4e">距離 = D</text>
  <text x="170" y="168" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="bold" fill="#43e97b">60 km/h</text>

  <!-- 去程時間標籤 -->
  <rect x="290" y="132" width="70" height="26" rx="13" ry="13" fill="#43e97b" opacity="0.15"/>
  <text x="325" y="149" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="11" fill="#2d8a4e">時間 = D/60</text>

  <!-- ============ 回程視覺化 ============ -->
  <text x="60" y="205" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="bold" fill="#c0392b">
    ➤ 回程
  </text>

  <!-- 回程箭頭 -->
  <defs>
    <marker id="arrowBackHead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fa709a"/>
    </marker>
  </defs>
  <line x1="280" y1="225" x2="60" y2="225" stroke="url(#arrowBack)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBackHead)"/>

  <!-- 回程標籤 -->
  <text x="170" y="218" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="12" fill="#c0392b">距離 = D</text>
  <text x="170" y="248" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="bold" fill="#fa709a">40 km/h</text>

  <!-- 回程時間標籤 -->
  <rect x="290" y="212" width="70" height="26" rx="13" ry="13" fill="#fa709a" opacity="0.15"/>
  <text x="325" y="229" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="11" fill="#c0392b">時間 = D/40</text>

  <!-- ============ 錯誤算法 ============ -->
  <rect x="380" y="110" width="175" height="55" rx="12" ry="12" fill="#ff6b6b" opacity="0.08" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="467" y="132" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="12" font-weight="bold" fill="#ee5a24">
    ❌ 常見錯誤
  </text>
  <text x="467" y="152" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#ff6b6b">
    (60 + 40) ÷ 2 = 50
  </text>

  <!-- ============ 正確算法 ============ -->
  <rect x="380" y="180" width="175" height="55" rx="12" ry="12" fill="#0abde3" opacity="0.08" stroke="#0abde3" stroke-width="1.5"/>
  <text x="467" y="202" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="12" font-weight="bold" fill="#0abde3">
    ✅ 正確算法
  </text>
  <text x="467" y="222" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#0abde3">
    2D ÷ (D/60 + D/40)
  </text>

  <!-- ============ 平均速率結果圓圈 ============ -->
  <circle cx="300" cy="305" r="55" fill="url(#avgCircle)" opacity="0.2"/>
  <circle cx="300" cy="305" r="45" fill="url(#avgCircle)" opacity="0.3"/>
  <circle cx="300" cy="305" r="35" fill="url(#avgCircle)" opacity="0.5"/>

  <!-- 平均速率文字 -->
  <text x="300" y="298" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="11" fill="#6c3a9e">
    平均速率
  </text>
  <text x="300" y="322" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#5b2c8e" filter="url(#glow)">
    48 km/h
  </text>

  <!-- 計算過程 -->
  <text x="300" y="358" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="12" fill="#7c6ba0">
    加權平均：時間權重不同，較慢速率佔更多時間
  </text>

  <!-- 裝飾小點 -->
  <circle cx="55" cy="370" r="3" fill="#667eea" opacity="0.3"/>
  <circle cx="545" cy="370" r="3" fill="#764ba2" opacity="0.3"/>
  <circle cx="55" cy="30" r="3" fill="#667eea" opacity="0.3"/>
  <circle cx="545" cy="30" r="3" fill="#764ba2" opacity="0.3"/>
</svg>