<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#b3d9f2"/>
    </radialGradient>

    <!-- 卡片1：正方形 - 多層漸變 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#FF8E8E"/>
      <stop offset="100%" stop-color="#CC4444"/>
    </linearGradient>
    <radialGradient id="card1Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片2：長方形 - 多層漸變 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="40%" stop-color="#6EE7DE"/>
      <stop offset="100%" stop-color="#2EA89F"/>
    </linearGradient>
    <radialGradient id="card2Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片3：三角形 - 多層漸變 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="40%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#D4B02A"/>
    </linearGradient>
    <radialGradient id="card3Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片4：圓形 - 多層漸變 -->
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="40%" stop-color="#8B7CF0"/>
      <stop offset="100%" stop-color="#4A3DB5"/>
    </linearGradient>
    <radialGradient id="card4Shine" cx="30%" cy="25%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 雙層陰影過濾器 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <!-- 第一層陰影（深色，偏移較大） -->
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.25)"/>
      <!-- 第二層陰影（淺色，偏移較小） -->
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 3D光影效果過濾器 -->
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="0" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- 放射光暈 -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D3436"/>
      <stop offset="50%" stop-color="#636E72"/>
      <stop offset="100%" stop-color="#2D3436"/>
    </linearGradient>

    <!-- 圖形內部漸變 -->
    <linearGradient id="shape1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8E8E"/>
      <stop offset="100%" stop-color="#CC4444"/>
    </linearGradient>
    <linearGradient id="shape2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7DE"/>
      <stop offset="100%" stop-color="#2EA89F"/>
    </linearGradient>
    <linearGradient id="shape3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#D4B02A"/>
    </linearGradient>
    <linearGradient id="shape4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CF0"/>
      <stop offset="100%" stop-color="#4A3DB5"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="30" fill="rgba(255,255,255,0.15)"/>
  <circle cx="550" cy="350" r="40" fill="rgba(255,255,255,0.12)"/>
  <circle cx="520" cy="60" r="20" fill="rgba(255,255,255,0.1)"/>
  <circle cx="80" cy="340" r="25" fill="rgba(255,255,255,0.1)"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" letter-spacing="3">
    面積公式一覽表
  </text>
  <line x1="180" y1="48" x2="420" y2="48" stroke="rgba(45,52,54,0.2)" stroke-width="1.5"/>

  <!-- ==================== 卡片1：正方形 ==================== -->
  <g filter="url(#doubleShadow)">
    <rect x="20" y="62" width="270" height="150" rx="16" fill="url(#card1Grad)"/>
    <!-- 3D光影層 -->
    <rect x="20" y="62" width="270" height="150" rx="16" fill="url(#card1Shine)"/>
    <!-- 頂部高光線 -->
    <rect x="20" y="62" width="270" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- 正方形圖形 -->
  <rect x="38" y="88" width="60" height="60" rx="3" fill="url(#shape1Grad)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <!-- 邊長標註 -->
  <text x="68" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">邊長 a</text>
  <line x1="38" y1="168" x2="98" y2="168" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- 公式文字 -->
  <text x="115" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="rgba(255,255,255,0.95)">正方形</text>
  <text x="115" y="128" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">面積 = 邊長 × 邊長</text>
  <text x="115" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="rgba(255,255,255,0.95)">S = a × a = a²</text>

  <!-- 範例 -->
  <text x="115" y="175" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.65)">例：a=5cm → S=25cm²</text>

  <!-- ==================== 卡片2：長方形 ==================== -->
  <g filter="url(#doubleShadow)">
    <rect x="310" y="62" width="270" height="150" rx="16" fill="url(#card2Grad)"/>
    <rect x="310" y="62" width="270" height="150" rx="16" fill="url(#card2Shine)"/>
    <rect x="310" y="62" width="270" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- 長方形圖形 -->
  <rect x="328" y="88" width="75" height="45" rx="3" fill="url(#shape2Grad)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <!-- 邊長標註 -->
  <text x="365" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">長 a</text>
  <line x1="328" y1="153" x2="403" y2="153" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="420" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" transform="rotate(-90,420,115)">寬 b</text>

  <!-- 公式文字 -->
  <text x="420" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="rgba(255,255,255,0.95)">長方形</text>
  <text x="420" y="128" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">面積 = 長 × 寬</text>
  <text x="420" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="rgba(255,255,255,0.95)">S = a × b</text>

  <!-- 範例 -->
  <text x="420" y="175" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.65)">例：a=6cm, b=4cm → S=24cm²</text>

  <!-- ==================== 卡片3：三角形 ==================== -->
  <g filter="url(#doubleShadow)">
    <rect x="20" y="228" width="270" height="150" rx="16" fill="url(#card3Grad)"/>
    <rect x="20" y="228" width="270" height="150" rx="16" fill="url(#card3Shine)"/>
    <rect x="20" y="228" width="270" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- 三角形圖形 -->
  <polygon points="98,248 38,288 98,288" fill="url(#shape3Grad)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <!-- 高標註 -->
  <text x="105" y="272" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">高 h</text>
  <line x1="98" y1="248" x2="98" y2="288" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- 底邊標註 -->
  <text x="68" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">底 a</text>
  <line x1="38" y1="308" x2="98" y2="308" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- 公式文字 -->
  <text x="115" y="268" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="rgba(255,255,255,0.95)">三角形</text>
  <text x="115" y="291" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">面積 = 底 × 高 ÷ 2</text>
  <text x="115" y="313" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="rgba(255,255,255,0.95)">S = a × h ÷ 2</text>

  <!-- 範例 -->
  <text x="115" y="340" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.65)">例：a=8cm, h=5cm → S=20cm²</text>

  <!-- ==================== 卡片4：圓形 ==================== -->
  <g filter="url(#doubleShadow)">
    <rect x="310" y="228" width="270" height="150" rx="16" fill="url(#card4Grad)"/>
    <rect x="310" y="228" width="270" height="150" rx="16" fill="url(#card4Shine)"/>
    <rect x="310" y="228" width="270" height="4" rx="2" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- 圓形圖形 -->
  <circle cx="365" cy="275" r="28" fill="url(#shape4Grad)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <!-- 半徑標註 -->
  <line x1="365" y1="275" x2="393" y2="275" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
  <text x="378" y="268" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">r</text>
  <!-- 圓心點 -->
  <circle cx="365" cy="275" r="2.5" fill="rgba(255,255,255,0.8)"/>

  <!-- 公式文字 -->
  <text x="420" y="268" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="rgba(255,255,255,0.95)">圓形</text>
  <text x="420" y="291" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">面積 = 圓周率 × 半徑²</text>
  <text x="420" y="313" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="rgba(255,255,255,0.95)">S = π × r²</text>

  <!-- 範例 -->
  <text x="420" y="340" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.65)">例：r=7cm → S≈153.94cm²</text>

  <!-- 底部裝飾 -->
  <line x1="50" y1="390" x2="550" y2="390" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
</svg>