<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1a2a6c"/>
      <stop offset="50%" stop-color="#2d4373"/>
      <stop offset="100%" stop-color="#0f1a3a"/>
    </radialGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#EE5A24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C0392B" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48DBFB" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0ABDE3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0984E3" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECA57" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FF9F43" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EE5A24" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55EFC4" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00B894" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#006266" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A29BFE" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#6C5CE7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4834D4" stop-opacity="0.95"/>
    </linearGradient>

    <!-- 卡片高光漸變 -->
    <linearGradient id="cardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.1"/>
    </filter>

    <filter id="cardShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.08"/>
    </filter>

    <!-- 文字光暈 -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 放射光點 -->
    <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- 裝飾光點 -->
  <circle cx="80" cy="60" r="40" fill="url(#glowDot)"/>
  <circle cx="520" cy="350" r="50" fill="url(#glowDot)"/>
  <circle cx="550" cy="50" r="25" fill="url(#glowDot)"/>
  <circle cx="50" cy="350" r="30" fill="url(#glowDot)"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="#ffffff" filter="url(#textGlow)">📐 平面圖形面積公式一覽表</text>
  <line x1="140" y1="48" x2="460" y2="48" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- ============ 卡片1：正方形 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="15" y="60" width="170" height="100" rx="14" ry="14" fill="url(#cardGrad1)"/>
    <rect x="15" y="60" width="170" height="100" rx="14" ry="14" fill="url(#cardShine)"/>
    <!-- 圖形：正方形 -->
    <rect x="30" y="78" width="40" height="40" rx="2" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.9"/>
    <text x="50" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff" fill-opacity="0.8">a</text>
    <text x="52" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" fill-opacity="0.6">a</text>
    <!-- 公式 -->
    <text x="90" y="95" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#fff">正方形</text>
    <text x="90" y="118" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#fff" fill-opacity="0.9">S = a × a</text>
    <text x="90" y="140" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#fff" fill-opacity="0.75">= a²</text>
  </g>

  <!-- ============ 卡片2：長方形 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="215" y="60" width="170" height="100" rx="14" ry="14" fill="url(#cardGrad2)"/>
    <rect x="215" y="60" width="170" height="100" rx="14" ry="14" fill="url(#cardShine)"/>
    <!-- 圖形：長方形 -->
    <rect x="230" y="78" width="50" height="35" rx="2" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.9"/>
    <text x="255" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff" fill-opacity="0.8">a</text>
    <text x="242" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" fill-opacity="0.6">b</text>
    <!-- 公式 -->
    <text x="295" y="95" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#fff">長方形</text>
    <text x="295" y="118" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#fff" fill-opacity="0.9">S = a × b</text>
    <text x="295" y="140" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#fff" fill-opacity="0.75">長 × 寬</text>
  </g>

  <!-- ============ 卡片3：三角形 ============ -->
  <g filter="url(#cardShadow)">
    <rect x="415" y="60" width="170" height="100" rx="14" ry="14" fill="url(#cardGrad3)"/>
    <rect x="415" y="60" width="170" height="100" rx="14" ry="14" fill="url(#cardShine)"/>
    <!-- 圖形：三角形 -->
    <polygon points="460,115 430,80 490,80" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.9"/>
    <text x="460" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" fill-opacity="0.6">h</text>
    <text x="460" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" fill-opacity="0.8">a</text>
    <!-- 公式 -->
    <text x="500" y="95" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#fff">三角形</text>
    <text x="500" y="118" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#fff" fill-opacity="0.9">S = ½ × a × h</text>
    <text x="500" y="140" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#fff" fill-opacity="0.75">底 × 高 ÷ 2</text>
  </g>

  <!-- ============ 卡片4：梯形 ============ -->
  <g filter="url(#cardShadow2)">
    <rect x="15" y="180" width="275" height="100" rx="14" ry="14" fill="url(#cardGrad4)"/>
    <rect x="15" y="180" width="275" height="100" rx="14" ry="14" fill="url(#cardShine)"/>
    <!-- 圖形：梯形 -->
    <polygon points="40,215 55,250 120,250 105,215" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.9"/>
    <text x="80" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" fill-opacity="0.6">h</text>
    <text x="72" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" fill-opacity="0.8">b</text>
    <text x="88" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" fill-opacity="0.8">a</text>
    <!-- 公式 -->
    <text x="140" y="215" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#fff">梯形</text>
    <text x="140" y="240" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#fff" fill-opacity="0.9">S = ½ × (a + b) × h</text>
    <text x="140" y="262" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#fff" fill-opacity="0.75">(上底 + 下底) × 高 ÷ 2</text>
  </g>

  <!-- ============ 卡片5：平行四邊形 ============ -->
  <g filter="url(#cardShadow2)">
    <rect x="310" y="180" width="275" height="100" rx="14" ry="14" fill="url(#cardGrad5)"/>
    <rect x="310" y="180" width="275" height="100" rx="14" ry="14" fill="url(#cardShine)"/>
    <!-- 圖形：平行四邊形 -->
    <polygon points="335,215 350,250 415,250 400,215" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.9"/>
    <text x="375" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" fill-opacity="0.6">h</text>
    <text x="375" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" fill-opacity="0.8">a</text>
    <!-- 公式 -->
    <text x="435" y="215" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#fff">平行四邊形</text>
    <text x="435" y="240" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#fff" fill-opacity="0.9">S = a × h</text>
    <text x="435" y="262" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#fff" fill-opacity="0.75">底 × 高</text>
  </g>

  <!-- ============ 底部裝飾文字 ============ -->
  <text x="300" y="320" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.35">💡 小提示：三角形面積 = 底 × 高 ÷ 2 ・ 梯形面積 = (上底 + 下底) × 高 ÷ 2</text>

  <!-- 底部裝飾線 -->
  <line x1="180" y1="335" x2="420" y2="335" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- 裝飾小圖標 -->
  <g transform="translate(280, 348)" fill="#ffffff" fill-opacity="0.2">
    <rect x="-30" y="0" width="8" height="8" rx="1"/>
    <rect x="-15" y="0" width="12" height="8" rx="1"/>
    <polygon points="5,8 0,0 10,0"/>
    <polygon points="20,8 15,0 25,0"/>
    <rect x="30" y="0" width="10" height="8" rx="1" transform="skewX(-10)"/>
  </g>

  <!-- 角落裝飾 -->
  <rect x="0" y="0" width="600" height="400" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" rx="8"/>
</svg>