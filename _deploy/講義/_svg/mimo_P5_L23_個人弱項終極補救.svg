<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#F9FAFB" rx="8"/>

  <!-- Title Banner -->
  <rect x="20" y="15" width="560" height="50" rx="10" fill="url(#titleGrad)" filter="url(#shadow)"/>
  <text x="300" y="48" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">P5 數學 · 個人弱項終極補救</text>

  <!-- Main Card 1: Error Analysis -->
  <rect x="20" y="80" width="180" height="150" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="20" y="80" width="180" height="35" rx="12" fill="#EF4444"/>
  <rect x="20" y="100" width="180" height="15" fill="#EF4444"/>
  <text x="110" y="105" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">錯題分析</text>
  <text x="40" y="130" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#374151">1. 審題不清，忽略單位</text>
  <text x="40" y="152" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#374151">2. 計算過程跳步</text>
  <text x="40" y="174" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#374151">3. 應用題關係混淆</text>
  <text x="40" y="196" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#374151">4. 圖形公式記憶錯誤</text>
  <circle cx="170" cy="195" r="15" fill="#EF4444" opacity="0.2"/>
  <text x="170" y="200" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="bold">4題</text>

  <!-- Arrow from Card1 to Card2 -->
  <line x1="200" y1="155" x2="240" y2="155" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Main Card 2: Diagnosis -->
  <rect x="240" y="80" width="140" height="150" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="240" y="80" width="140" height="35" rx="12" fill="#F59E0B"/>
  <rect x="240" y="100" width="140" height="15" fill="#F59E0B"/>
  <text x="310" y="105" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">弱項診斷</text>
  <circle cx="270" cy="145" r="12" fill="#F59E0B20"/>
  <text x="270" y="149" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#D97706" text-anchor="middle">步驟1</text>
  <text x="290" y="149" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#374151">找出錯誤模式</text>
  <line x1="270" y1="160" x2="270" y2="170" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <circle cx="270" cy="180" r="12" fill="#F59E0B20"/>
  <text x="270" y="184" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#D97706" text-anchor="middle">步驟2</text>
  <text x="290" y="184" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#374151">歸類知識點缺失</text>
  <line x1="270" y1="195" x2="270" y2="205" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <circle cx="270" cy="215" r="12" fill="#F59E0B20"/>
  <text x="270" y="219" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#D97706" text-anchor="middle">步驟3</text>
  <text x="290" y="219" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#374151">制定針對性計劃</text>

  <!-- Arrow from Card2 to Card3 -->
  <line x1="380" y1="155" x2="420" y2="155" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Main Card 3: Targeted Practice -->
  <rect x="420" y="80" width="160" height="150" rx="12" fill="white" filter="url(#shadow)"/>
  <rect x="420" y="80" width="160" height="35" rx="12" fill="#10B981"/>
  <rect x="420" y="100" width="160" height="15" fill="#10B981"/>
  <text x="500" y="105" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">針對練習</text>
  <rect x="440" y="125" width="120" height="30" rx="6" fill="#10B98110" stroke="#10B98130"/>
  <text x="500" y="144" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#059669" text-anchor="middle">每日3題精練</text>
  <rect x="440" y="165" width="120" height="30" rx="6" fill="#10B98110" stroke="#10B98130"/>
  <text x="500" y="184" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#059669" text-anchor="middle">錯題本記錄</text>
  <rect x="440" y="205" width="120" height="15" rx="4" fill="#10B981" opacity="0.8"/>
  <text x="500" y="216" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="white" text-anchor="middle">本週目標：掌握面積計算</text>

  <!-- Progress Section -->
  <rect x="20" y="250" width="560" height="80" rx="12" fill="white" filter="url(#shadow)"/>
  <text x="40" y="280" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#4F46E5" font-weight="bold">學習進度追蹤</text>
  <text x="40" y="315" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#6B7280">強項：</text>
  <rect x="90" y="305" width="120" height="20" rx="10" fill="#10B98120"/>
  <rect x="90" y="305" width="85" height="20" rx="10" fill="#10B981"/>
  <text x="130" y="319" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="white" text-anchor="middle">四則運算</text>
  <text x="230" y="315" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#6B7280">弱項：</text>
  <rect x="280" y="305" width="120" height="20" rx="10" fill="#EF444420"/>
  <rect x="280" y="305" width="40" height="20" rx="10" fill="#EF4444"/>
  <text x="300" y="319" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="white" text-anchor="middle">面積</text>
  <rect x="410" y="300" width="150" height="30" rx="8" fill="url(#titleGrad)"/>
  <text x="485" y="320" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">開始今日練習</text>

  <!-- Motivational Quote -->
  <rect x="20" y="345" width="560" height="40" rx="10" fill="#4F46E508" stroke="#4F46E520"/>
  <text x="300" y="370" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#4F46E5" text-anchor="middle">💡 每天進步一點點，弱項也能變強項！</text>

  <!-- Decorative Elements -->
  <circle cx="50" cy="380" r="5" fill="#4F46E5" opacity="0.1"/>
  <circle cx="580" cy="30" r="8" fill="#F59E0B" opacity="0.1"/>
  <circle cx="550" cy="390" r="6" fill="#10B981" opacity="0.1"/>
</svg>