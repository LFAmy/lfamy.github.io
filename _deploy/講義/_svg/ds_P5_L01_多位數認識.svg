<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F4F8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FAFBFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8EEF4;stop-opacity:1" />
    </linearGradient>

    <!-- 位值卡片漸變：個位（藍色） -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#764BA2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B3B8C;stop-opacity:1" />
    </linearGradient>

    <!-- 位值卡片漸變：十位（綠色） -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38B2AC;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#319795;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C7A7B;stop-opacity:1" />
    </linearGradient>

    <!-- 位值卡片漸變：百位（橙色） -->
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F6AD55;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ED8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DD6B20;stop-opacity:1" />
    </linearGradient>

    <!-- 位值卡片漸變：千位（紅色） -->
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FC8181;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#E53E3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C53030;stop-opacity:1" />
    </linearGradient>

    <!-- 位值卡片漸變：萬位（紫色） -->
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B794F4;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#9F7AEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#805AD5;stop-opacity:1" />
    </linearGradient>

    <!-- 位值卡片漸變：十萬位（青色） -->
    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FD1C5;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#38B2AC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C7A7B;stop-opacity:1" />
    </linearGradient>

    <!-- 位值卡片漸變：百萬位（粉色） -->
    <linearGradient id="cardGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBB6CE;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F687B3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D53F8C;stop-opacity:1" />
    </linearGradient>

    <!-- 位值卡片漸變：千萬位（黃色） -->
    <linearGradient id="cardGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F6E05E;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ECC94B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D69E2E;stop-opacity:1" />
    </linearGradient>

    <!-- 位值卡片漸變：億位（藍綠色） -->
    <linearGradient id="cardGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#68D391;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#48BB78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2F855A;stop-opacity:1" />
    </linearGradient>

    <!-- 3D 光影放射漸變 -->
    <radialGradient id="shineGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>

    <!-- 雙層陰影過濾器 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="140%">
      <!-- 第一層陰影：較深較大 -->
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
      <!-- 第二層陰影：較淺較小 -->
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 輕微陰影 -->
    <filter id="lightShadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- 文字陰影 -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- 分節標記漸變 -->
    <linearGradient id="sepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="20" font-weight="bold" fill="#2D3748" filter="url(#textShadow)">📊 多位數位值表</text>
  <text x="300" y="50" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#718096">從個位到億位 · 每三位分一節</text>

  <!-- 位值卡片陣列：從左到右（億到個） -->
  <!-- 每個卡片：x, y, 寬, 高, 漸變ID, 標籤, 位值 -->

  <!-- 第1組：億位（最左） -->
  <g filter="url(#doubleShadow)">
    <rect x="15" y="68" width="58" height="85" rx="10" fill="url(#cardGrad9)"/>
    <rect x="15" y="68" width="58" height="85" rx="10" fill="url(#shineGrad)"/>
    <text x="44" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">億</text>
    <text x="44" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#E2E8F0">100,000,000</text>
  </g>

  <!-- 第2組：千萬位 -->
  <g filter="url(#doubleShadow)">
    <rect x="78" y="68" width="58" height="85" rx="10" fill="url(#cardGrad8)"/>
    <rect x="78" y="68" width="58" height="85" rx="10" fill="url(#shineGrad)"/>
    <text x="107" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">千萬</text>
    <text x="107" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#E2E8F0">10,000,000</text>
  </g>

  <!-- 第3組：百萬位 -->
  <g filter="url(#doubleShadow)">
    <rect x="141" y="68" width="58" height="85" rx="10" fill="url(#cardGrad7)"/>
    <rect x="141" y="68" width="58" height="85" rx="10" fill="url(#shineGrad)"/>
    <text x="170" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">百萬</text>
    <text x="170" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#E2E8F0">1,000,000</text>
  </g>

  <!-- 分節標記 1 -->
  <rect x="202" y="68" width="3" height="85" rx="1.5" fill="url(#sepGrad)"/>

  <!-- 第4組：十萬位 -->
  <g filter="url(#doubleShadow)">
    <rect x="208" y="68" width="58" height="85" rx="10" fill="url(#cardGrad6)"/>
    <rect x="208" y="68" width="58" height="85" rx="10" fill="url(#shineGrad)"/>
    <text x="237" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">十萬</text>
    <text x="237" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#E2E8F0">100,000</text>
  </g>

  <!-- 第5組：萬位 -->
  <g filter="url(#doubleShadow)">
    <rect x="271" y="68" width="58" height="85" rx="10" fill="url(#cardGrad5)"/>
    <rect x="271" y="68" width="58" height="85" rx="10" fill="url(#shineGrad)"/>
    <text x="300" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">萬</text>
    <text x="300" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#E2E8F0">10,000</text>
  </g>

  <!-- 第6組：千位 -->
  <g filter="url(#doubleShadow)">
    <rect x="334" y="68" width="58" height="85" rx="10" fill="url(#cardGrad4)"/>
    <rect x="334" y="68" width="58" height="85" rx="10" fill="url(#shineGrad)"/>
    <text x="363" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">千</text>
    <text x="363" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#E2E8F0">1,000</text>
  </g>

  <!-- 分節標記 2 -->
  <rect x="395" y="68" width="3" height="85" rx="1.5" fill="url(#sepGrad)"/>

  <!-- 第7組：百位 -->
  <g filter="url(#doubleShadow)">
    <rect x="401" y="68" width="58" height="85" rx="10" fill="url(#cardGrad3)"/>
    <rect x="401" y="68" width="58" height="85" rx="10" fill="url(#shineGrad)"/>
    <text x="430" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">百</text>
    <text x="430" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#E2E8F0">100</text>
  </g>

  <!-- 第8組：十位 -->
  <g filter="url(#doubleShadow)">
    <rect x="464" y="68" width="58" height="85" rx="10" fill="url(#cardGrad2)"/>
    <rect x="464" y="68" width="58" height="85" rx="10" fill="url(#shineGrad)"/>
    <text x="493" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">十</text>
    <text x="493" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#E2E8F0">10</text>
  </g>

  <!-- 第9組：個位（最右） -->
  <g filter="url(#doubleShadow)">
    <rect x="527" y="68" width="58" height="85" rx="10" fill="url(#cardGrad1)"/>
    <rect x="527" y="68" width="58" height="85" rx="10" fill="url(#shineGrad)"/>
    <text x="556" y="108" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">個</text>
    <text x="556" y="128" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#E2E8F0">1</text>
  </g>

  <!-- 3D 數字塔（層疊效果） -->
  <!-- 底層：個位 -->
  <g filter="url(#lightShadow)">
    <rect x="527" y="168" width="58" height="14" rx="4" fill="#5B3B8C" opacity="0.6"/>
  </g>
  <!-- 十位 -->
  <g filter="url(#lightShadow)">
    <rect x="464" y="168" width="58" height="14" rx="4" fill="#2C7A7B" opacity="0.6"/>
  </g>
  <!-- 百位 -->
  <g filter="url(#lightShadow)">
    <rect x="401" y="168" width="58" height="14" rx="4" fill="#DD6B20" opacity="0.6"/>
  </g>
  <!-- 千位 -->
  <g filter="url(#lightShadow)">
    <rect x="334" y="168" width="58" height="14" rx="4" fill="#C53030" opacity="0.6"/>
  </g>
  <!-- 萬位 -->
  <g filter="url(#lightShadow)">
    <rect x="271" y="168" width="58" height="14" rx="4" fill="#805AD5" opacity="0.6"/>
  </g>
  <!-- 十萬位 -->
  <g filter="url(#lightShadow)">
    <rect x="208" y="168" width="58" height="14" rx="4" fill="#2C7A7B" opacity="0.6"/>
  </g>
  <!-- 百萬位 -->
  <g filter="url(#lightShadow)">
    <rect x="141" y="168" width="58" height="14" rx="4" fill="#D53F8C" opacity="0.6"/>
  </g>
  <!-- 千萬位 -->
  <g filter="url(#lightShadow)">
    <rect x="78" y="168" width="58" height="14" rx="4" fill="#D69E2E" opacity="0.6"/>
  </g>
  <!-- 億位 -->
  <g filter="url(#lightShadow)">
    <rect x="15" y="168" width="58" height="14" rx="4" fill="#2F855A" opacity="0.6"/>
  </g>

  <!-- 塔頂數字示例 -->
  <g filter="url(#doubleShadow)">
    <rect x="250" y="200" width="100" height="40" rx="12" fill="#FFFFFF" opacity="0.95"/>
    <rect x="250" y="200" width="100" height="40" rx="12" fill="url(#shineGrad)"/>
    <text x="300" y="226" text-anchor="middle" font-family="'Courier New',monospace" font-size="20" font-weight="bold" fill="#2D3748">123,456,789</text>
  </g>

  <!-- 分節說明 -->
  <g>
    <rect x="30" y="260" width="540" height="55" rx="10" fill="#FFFFFF" opacity="0.85" filter="url(#lightShadow)"/>
    <text x="300" y="282" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" font-weight="bold" fill="#4A5568">📌 每三位分一節：從右向左，每三位數為一節</text>
    <text x="300" y="302" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#718096">個位、十位、百位 → 千位、十萬位、百萬位 → 億位</text>
  </g>

  <!-- 底部裝飾 -->
  <g>
    <rect x="30" y="330" width="540" height="50" rx="10" fill="#FFFFFF" opacity="0.7" filter="url(#lightShadow)"/>
    <text x="300" y="352" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#4A5568">💡 數字塔從下往上層層疊加，每一位都是前一位的10倍</text>
    <text x="300" y="370" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#A0AEC0">×10 ×10 ×10 ×10 ×10 ×10 ×10 ×10</text>
  </g>

  <!-- 箭頭指示（從右到左） -->
  <g opacity="0.6">
    <line x1="556" y1="155" x2="44" y2="155" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrowHead)"/>
    <defs>
      <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4A5568"/>
      </marker>
    </defs>
  </g>
  <text x="300" y="148" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#4A5568" opacity="0.7">位值遞增方向 →</text>

</svg>