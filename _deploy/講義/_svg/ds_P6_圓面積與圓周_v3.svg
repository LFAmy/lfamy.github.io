<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E8ECF0" stroke-width="0.5"/>
    </pattern>
    <pattern id="gridDot" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#D0D6DD"/>
    </pattern>

    <!-- 圓面放射漸變（3D光影效果） -->
    <radialGradient id="circleGrad" cx="38%" cy="35%" r="60%" fx="30%" fy="28%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="15%" stop-color="#FFE066"/>
      <stop offset="40%" stop-color="#FFB300"/>
      <stop offset="70%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>

    <!-- 圓面外層光暈 -->
    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FFB300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>

    <!-- 卡片1漸變（半徑與直徑） -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F0F8FF"/>
      <stop offset="60%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>

    <!-- 卡片2漸變（圓周公式） -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F3E5F5"/>
      <stop offset="60%" stop-color="#E1BEE7"/>
      <stop offset="100%" stop-color="#CE93D8"/>
    </linearGradient>

    <!-- 卡片3漸變（面積公式） -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E8F5E9"/>
      <stop offset="60%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>
  <rect width="600" height="400" fill="url(#gridDot)"/>

  <!-- 頂部標題 -->
  <text x="300" y="32" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="18" font-weight="bold" fill="#1A237E" letter-spacing="2">圓面積與圓周 · P6</text>
  <line x1="180" y1="42" x2="420" y2="42" stroke="#1A237E" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- ===== 圓形區域 ===== -->
  <g transform="translate(160, 220)">
    <!-- 外層光暈 -->
    <circle cx="0" cy="0" r="105" fill="url(#circleGlow)"/>

    <!-- 圓面（放射漸變3D光影） -->
    <circle cx="0" cy="0" r="90" fill="url(#circleGrad)" filter="url(#softGlow)"/>

    <!-- 圓周 -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#BF360C" stroke-width="2.5" stroke-opacity="0.6"/>

    <!-- 半徑 r -->
    <line x1="0" y1="0" x2="70" y2="-55" stroke="#D32F2F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#D32F2F"/>
    <circle cx="70" cy="-55" r="4" fill="#D32F2F"/>
    <text x="38" y="-22" font-family="'Times New Roman',serif" font-size="18" font-weight="bold" fill="#D32F2F" font-style="italic">r</text>

    <!-- 直徑 d -->
    <line x1="-78" y1="45" x2="78" y2="-45" stroke="#1565C0" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>
    <text x="5" y="8" font-family="'Times New Roman',serif" font-size="18" font-weight="bold" fill="#1565C0" font-style="italic">d = 2r</text>

    <!-- 圓周標示 2πr -->
    <path d="M 85 30 A 90 90 0 0 1 30 85" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="60" y="75" font-family="'Times New Roman',serif" font-size="16" font-weight="bold" fill="#2E7D32" font-style="italic">2πr</text>

    <!-- 面積標示 πr² -->
    <text x="-5" y="-5" text-anchor="middle" font-family="'Times New Roman',serif" font-size="20" font-weight="bold" fill="#FFFFFF" font-style="italic" opacity="0.9">πr²</text>
  </g>

  <!-- ===== 公式卡片1：半徑與直徑 ===== -->
  <g transform="translate(370, 70)">
    <rect x="0" y="0" width="210" height="72" rx="12" ry="12" fill="url(#card1Grad)" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="210" height="72" rx="12" ry="12" fill="none" stroke="#90CAF9" stroke-width="1"/>
    <text x="105" y="22" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#1565C0" font-weight="bold">半徑與直徑</text>
    <text x="105" y="46" text-anchor="middle" font-family="'Times New Roman',serif" font-size="22" fill="#0D47A1" font-weight="bold" font-style="italic">d = 2r</text>
    <text x="105" y="63" text-anchor="middle" font-family="'Times New Roman',serif" font-size="13" fill="#1565C0" font-style="italic">r = d ÷ 2</text>
  </g>

  <!-- ===== 公式卡片2：圓周 ===== -->
  <g transform="translate(370, 155)">
    <rect x="0" y="0" width="210" height="72" rx="12" ry="12" fill="url(#card2Grad)" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="210" height="72" rx="12" ry="12" fill="none" stroke="#CE93D8" stroke-width="1"/>
    <text x="105" y="22" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#7B1FA2" font-weight="bold">圓周公式</text>
    <text x="105" y="46" text-anchor="middle" font-family="'Times New Roman',serif" font-size="22" fill="#6A1B9A" font-weight="bold" font-style="italic">C = 2πr</text>
    <text x="105" y="63" text-anchor="middle" font-family="'Times New Roman',serif" font-size="13" fill="#7B1FA2" font-style="italic">C = πd</text>
  </g>

  <!-- ===== 公式卡片3：圓面積 ===== -->
  <g transform="translate(370, 240)">
    <rect x="0" y="0" width="210" height="72" rx="12" ry="12" fill="url(#card3Grad)" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="210" height="72" rx="12" ry="12" fill="none" stroke="#A5D6A7" stroke-width="1"/>
    <text x="105" y="22" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#2E7D32" font-weight="bold">圓面積公式</text>
    <text x="105" y="46" text-anchor="middle" font-family="'Times New Roman',serif" font-size="22" fill="#1B5E20" font-weight="bold" font-style="italic">A = πr²</text>
    <text x="105" y="63" text-anchor="middle" font-family="'Times New Roman',serif" font-size="13" fill="#2E7D32" font-style="italic">π ≈ 3.14 或 22/7</text>
  </g>

  <!-- ===== π值小提示 ===== -->
  <g transform="translate(370, 325)">
    <rect x="0" y="0" width="210" height="36" rx="10" ry="10" fill="#FFF8E1" filter="url(#cardShadow)" stroke="#FFE082" stroke-width="1"/>
    <text x="105" y="23" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="#F57F17" font-weight="bold">π ≈ 3.14159… 圓周率</text>
  </g>

  <!-- ===== 圓周率小圖標 ===== -->
  <g transform="translate(30, 340)">
    <circle cx="20" cy="15" r="18" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1.5"/>
    <text x="20" y="21" text-anchor="middle" font-family="'Times New Roman',serif" font-size="22" fill="#E65100" font-weight="bold" font-style="italic">π</text>
    <text x="50" y="20" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="#BF360C">圓周率</text>
  </g>

  <!-- ===== 底部裝飾線 ===== -->
  <line x1="30" y1="380" x2="570" y2="380" stroke="#E0E0E0" stroke-width="0.5"/>
  <text x="300" y="393" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="#B0B0B0">圓面積與圓周 · 小學六年級數學</text>
</svg>