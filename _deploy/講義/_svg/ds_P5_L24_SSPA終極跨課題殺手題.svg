<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </radialGradient>

    <!-- 卡片1：識別題型 - 藍色系 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="50%" stop-color="#357ABD"/>
      <stop offset="100%" stop-color="#2A5F9E"/>
    </linearGradient>
    <radialGradient id="card1Shine" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片2：拆解 - 綠色系 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CB85C"/>
      <stop offset="50%" stop-color="#4CAE4C"/>
      <stop offset="100%" stop-color="#3D8B3D"/>
    </linearGradient>
    <radialGradient id="card2Shine" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片3：逐一擊破 - 橙色系 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0AD4E"/>
      <stop offset="50%" stop-color="#EC971F"/>
      <stop offset="100%" stop-color="#D58512"/>
    </linearGradient>
    <radialGradient id="card3Shine" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片4：整合答案 - 紫色系 -->
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="50%" stop-color="#8E44AD"/>
      <stop offset="100%" stop-color="#7D3C98"/>
    </linearGradient>
    <radialGradient id="card4Shine" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 箭頭漸變 -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8898AA"/>
      <stop offset="100%" stop-color="#A0B0C0"/>
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.20)"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.12)"/>
    </filter>

    <filter id="cardShadowDeep" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.25)"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.15)"/>
    </filter>

    <!-- 光暈濾鏡 -->
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 放射狀光暈 -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,215,0,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,215,0,0)"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- 中央放射光暈 -->
  <circle cx="300" cy="200" r="200" fill="url(#centerGlow)" opacity="0.6"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#2C3E50" letter-spacing="2">
    殺手題策略 · 組合題分解
  </text>
  <line x1="180" y1="48" x2="420" y2="48" stroke="#E0E6ED" stroke-width="1" opacity="0.6"/>

  <!-- ==================== 卡片1：識別題型 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="65" width="120" height="140" rx="14" fill="url(#card1Grad)"/>
    <rect x="25" y="65" width="120" height="140" rx="14" fill="url(#card1Shine)"/>
    <!-- 圖標：放大鏡 -->
    <circle cx="85" cy="105" r="16" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.5"/>
    <line x1="96" y1="116" x2="106" y2="126" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 文字 -->
    <text x="85" y="150" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="700" fill="white">識別題型</text>
    <text x="85" y="170" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">找出題目模式</text>
    <text x="85" y="186" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">分類組合結構</text>
  </g>

  <!-- 箭頭 1→2 -->
  <g>
    <line x1="150" y1="135" x2="190" y2="135" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6,3"/>
    <polygon points="190,130 200,135 190,140" fill="#8898AA"/>
  </g>

  <!-- ==================== 卡片2：拆解 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="205" y="65" width="120" height="140" rx="14" fill="url(#card2Grad)"/>
    <rect x="205" y="65" width="120" height="140" rx="14" fill="url(#card2Shine)"/>
    <!-- 圖標：拼圖 -->
    <rect x="73" y="93" width="12" height="12" rx="2" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" transform="translate(140,0)"/>
    <rect x="87" y="93" width="12" height="12" rx="2" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" transform="translate(140,0)"/>
    <rect x="73" y="107" width="12" height="12" rx="2" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" transform="translate(140,0)"/>
    <rect x="87" y="107" width="12" height="12" rx="2" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" transform="translate(140,0)"/>
    <!-- 文字 -->
    <text x="265" y="150" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="700" fill="white">拆解</text>
    <text x="265" y="170" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">分拆成小部分</text>
    <text x="265" y="186" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">簡化複雜問題</text>
  </g>

  <!-- 箭頭 2→3 -->
  <g>
    <line x1="330" y1="135" x2="370" y2="135" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6,3"/>
    <polygon points="370,130 380,135 370,140" fill="#8898AA"/>
  </g>

  <!-- ==================== 卡片3：逐一擊破 ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="385" y="65" width="120" height="140" rx="14" fill="url(#card3Grad)"/>
    <rect x="385" y="65" width="120" height="140" rx="14" fill="url(#card3Shine)"/>
    <!-- 圖標：目標/靶心 -->
    <circle cx="445" cy="103" r="16" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    <circle cx="445" cy="103" r="10" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.8"/>
    <circle cx="445" cy="103" r="4" fill="rgba(255,255,255,0.9)"/>
    <!-- 文字 -->
    <text x="445" y="150" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="700" fill="white">逐一擊破</text>
    <text x="445" y="170" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">逐步解決每部分</text>
    <text x="445" y="186" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">應用合適策略</text>
  </g>

  <!-- 箭頭 3→4（向下） -->
  <g>
    <line x1="505" y1="205" x2="505" y2="250" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="6,3"/>
    <polygon points="500,250 505,260 510,250" fill="#8898AA"/>
  </g>

  <!-- ==================== 卡片4：整合答案（大卡片，置中下方） ==================== -->
  <g filter="url(#cardShadowDeep)">
    <rect x="175" y="265" width="250" height="110" rx="16" fill="url(#card4Grad)"/>
    <rect x="175" y="265" width="250" height="110" rx="16" fill="url(#card4Shine)"/>
    <!-- 圖標：星星 -->
    <g transform="translate(300,295)">
      <polygon points="0,-12 3,-4 12,-4 5,2 7,11 0,6 -7,11 -5,2 -12,-4 -3,-4" fill="rgba(255,215,0,0.95)" stroke="rgba(255,200,0,0.5)" stroke-width="0.5"/>
    </g>
    <!-- 文字 -->
    <text x="300" y="322" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="white">整合答案</text>
    <text x="300" y="344" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">匯總各步結果，得出最終答案</text>
    <text x="300" y="362" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="rgba(255,255,255,0.65)">檢查邏輯一致性</text>
  </g>

  <!-- 從卡片1、2、3到卡片4的匯聚線 -->
  <g opacity="0.3">
    <line x1="85" y1="205" x2="250" y2="265" stroke="#8898AA" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="265" y1="205" x2="285" y2="265" stroke="#8898AA" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="445" y1="205" x2="340" y2="265" stroke="#8898AA" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 底部裝飾文字 -->
  <text x="300" y="392" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#B0BEC5" letter-spacing="1">
    殺手題策略 · 組合題分解法
  </text>
</svg>