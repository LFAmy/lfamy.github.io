<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0fafd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4edf5;stop-opacity:1" />
    </linearGradient>

    <!-- 梯形1 主漸變（橙黃色） -->
    <linearGradient id="trap1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B2C;stop-opacity:1" />
    </linearGradient>

    <!-- 梯形1 光影漸變（放射） -->
    <radialGradient id="trap1Shine" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35" />
      <stop offset="60%" style="stop-color:#FFFFFF;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>

    <!-- 梯形2 主漸變（藍綠色） -->
    <linearGradient id="trap2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#6EDDD6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2DBDB5;stop-opacity:1" />
    </linearGradient>

    <!-- 梯形2 光影漸變（放射） -->
    <radialGradient id="trap2Shine" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35" />
      <stop offset="60%" style="stop-color:#FFFFFF;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </radialGradient>

    <!-- 平行四邊形邊框漸變 -->
    <linearGradient id="paraBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#34495E;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2C3E50;stop-opacity:0.6" />
    </linearGradient>

    <!-- 陰影濾鏡（雙層） -->
    <filter id="shadowDouble" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="-1" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#2C3E50" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- 文字陰影 -->
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A5276;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C3E50;stop-opacity:1" />
    </linearGradient>

    <!-- 箭頭標記 -->
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50" opacity="0.7"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#2C3E50" opacity="0.7"/>
    </marker>

    <!-- 閃光效果 -->
    <linearGradient id="glint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="600" height="400" rx="16" ry="16" fill="url(#bgGrad)" />

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="30" fill="#FFFFFF" opacity="0.15" />
  <circle cx="550" cy="350" r="40" fill="#FFFFFF" opacity="0.12" />
  <circle cx="520" cy="60" r="20" fill="#FFFFFF" opacity="0.1" />
  <circle cx="80" cy="340" r="25" fill="#FFFFFF" opacity="0.1" />

  <!-- 標題卡片 -->
  <rect x="120" y="12" width="360" height="42" rx="21" ry="21" fill="#FFFFFF" opacity="0.85" filter="url(#cardShadow)"/>
  <text x="300" y="40" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="bold" fill="url(#titleGrad)" filter="url(#textShadow)">📐 梯形面積推導 — 拼合平行四邊形法</text>

  <!-- ==================== 上方：兩個梯形拼合 ==================== -->

  <!-- 梯形1（橙色，倒置） -->
  <g filter="url(#shadowDouble)">
    <polygon points="100,95 280,95 320,175 60,175" fill="url(#trap1Grad)" stroke="none" />
    <polygon points="100,95 280,95 320,175 60,175" fill="url(#trap1Shine)" stroke="none" />
    <polygon points="100,95 280,95 320,175 60,175" fill="none" stroke="#D35400" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- 梯形2（藍綠，正放） -->
  <g filter="url(#shadowDouble)">
    <polygon points="280,95 460,95 540,175 320,175" fill="url(#trap2Grad)" stroke="none" />
    <polygon points="280,95 460,95 540,175 320,175" fill="url(#trap2Shine)" stroke="none" />
    <polygon points="280,95 460,95 540,175 320,175" fill="none" stroke="#1A8A7D" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- 拼合後的平行四邊形外框（虛線） -->
  <polygon points="60,175 100,95 460,95 540,175" fill="none" stroke="url(#paraBorder)" stroke-width="2.5" stroke-dasharray="8,4" stroke-linejoin="round" />

  <!-- 拼合中線（垂直虛線，標示兩個梯形交界） -->
  <line x1="280" y1="95" x2="320" y2="175" stroke="#2C3E50" stroke-width="1.8" stroke-dasharray="5,4" opacity="0.5" />

  <!-- 標籤：梯形1 -->
  <text x="190" y="148" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">梯形 1</text>

  <!-- 標籤：梯形2 -->
  <text x="410" y="148" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" filter="url(#textShadow)">梯形 2</text>

  <!-- 上底標註（梯形1） -->
  <line x1="100" y1="82" x2="280" y2="82" stroke="#E74C3C" stroke-width="1.5" marker-start="url(#arrowLeft)" marker-end="url(#arrowRight)" opacity="0.8"/>
  <text x="190" y="76" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#E74C3C">上底 (a)</text>

  <!-- 下底標註（梯形1） -->
  <line x1="60" y1="188" x2="320" y2="188" stroke="#E74C3C" stroke-width="1.5" marker-start="url(#arrowLeft)" marker-end="url(#arrowRight)" opacity="0.8"/>
  <text x="190" y="204" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#E74C3C">下底 (b)</text>

  <!-- 上底標註（梯形2） -->
  <line x1="280" y1="82" x2="460" y2="82" stroke="#2980B9" stroke-width="1.5" marker-start="url(#arrowLeft)" marker-end="url(#arrowRight)" opacity="0.8"/>
  <text x="370" y="76" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#2980B9">上底 (a)</text>

  <!-- 下底標註（梯形2） -->
  <line x1="320" y1="188" x2="540" y2="188" stroke="#2980B9" stroke-width="1.5" marker-start="url(#arrowLeft)" marker-end="url(#arrowRight)" opacity="0.8"/>
  <text x="430" y="204" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#2980B9">下底 (b)</text>

  <!-- 高度標註（左側） -->
  <line x1="45" y1="95" x2="45" y2="175" stroke="#8E44AD" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="40" y1="95" x2="50" y2="95" stroke="#8E44AD" stroke-width="1.2" opacity="0.7"/>
  <line x1="40" y1="175" x2="50" y2="175" stroke="#8E44AD" stroke-width="1.2" opacity="0.7"/>
  <text x="38" y="140" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#8E44AD" transform="rotate(-90,38,140)">高 (h)</text>

  <!-- ==================== 下方：推導公式 ==================== -->

  <!-- 推導卡片背景 -->
  <rect x="50" y="230" width="500" height="150" rx="16" ry="16" fill="#FFFFFF" opacity="0.85" filter="url(#cardShadow)" />

  <!-- 推導步驟 -->
  <text x="80" y="262" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#2C3E50">📝 推導步驟：</text>

  <!-- 步驟1 -->
  <text x="80" y="288" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#34495E">
    <tspan font-weight="bold" fill="#E67E22">①</tspan> 兩個 <tspan font-weight="bold" fill="#E67E22">完全相同</tspan> 的梯形拼合
  </text>

  <!-- 步驟2 -->
  <text x="80" y="312" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#34495E">
    <tspan font-weight="bold" fill="#2980B9">②</tspan> 拼成一個 <tspan font-weight="bold" fill="#2980B9">平行四邊形</tspan>
  </text>

  <!-- 步驟3 -->
  <text x="80" y="336" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#34495E">
    <tspan font-weight="bold" fill="#8E44AD">③</tspan> 平行四邊形面積 = (a + b) × h
  </text>

  <!-- 步驟4 -->
  <text x="80" y="360" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" fill="#34495E">
    <tspan font-weight="bold" fill="#E74C3C">④</tspan> 梯形面積 = 平行四邊形面積 ÷ 2 = (a + b) × h ÷ 2
  </text>

  <!-- 公式框 -->
  <rect x="330" y="248" width="200" height="55" rx="12" ry="12" fill="#FFF8E1" stroke="#F39C12" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="430" y="272" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14" font-weight="bold" fill="#E67E22">梯形面積公式</text>
  <text x="430" y="294" text-anchor="middle" font-family="'Times New Roman','Georgia',serif" font-size="18" font-weight="bold" fill="#C0392B">S = (a + b) × h ÷ 2</text>

  <!-- 連接箭頭（從上方圖形指向下方推導） -->
  <path d="M 300,195 Q 300,215 300,230" fill="none" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,3" opacity="0.4" marker-end="url(#arrowRight)"/>

  <!-- 裝飾小標籤：÷2 -->
  <circle cx="540" cy="135" r="18" fill="#E74C3C" opacity="0.15"/>
  <text x="540" y="141" text-anchor="middle" font-family="'Times New Roman',serif" font-size="16" font-weight="bold" fill="#E74C3C" opacity="0.7">÷2</text>

</svg>