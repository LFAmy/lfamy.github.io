<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>

    <!-- 卡片主體漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8eaf6"/>
    </linearGradient>

    <!-- 卡片3D光影 -->
    <linearGradient id="cardShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="40%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- 數線漸變 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>

    <!-- 箭頭漸變（89→90） -->
    <linearGradient id="arrowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>

    <!-- 箭頭漸變（123→120） -->
    <linearGradient id="arrowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>

    <!-- 放射漸變3D光影（圓點） -->
    <radialGradient id="dotGlow1" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#fff5f5"/>
      <stop offset="30%" style="stop-color:#f5576c"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </radialGradient>

    <radialGradient id="dotGlow2" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#f0fff4"/>
      <stop offset="30%" style="stop-color:#00f2fe"/>
      <stop offset="100%" style="stop-color:#0984e3"/>
    </radialGradient>

    <radialGradient id="dotGlow3" cx="40%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#fff9e6"/>
      <stop offset="30%" style="stop-color:#f6d365"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </radialGradient>

    <!-- 雙層陰影過濾器 -->
    <filter id="doubleShadow" x="-10%" y="-10%" width="130%" height="140%">
      <!-- 第一層陰影（深色外擴） -->
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.3)"/>
      <!-- 第二層陰影（彩色光暈） -->
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(102,126,234,0.2)"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.35)"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="rgba(102,126,234,0.15)"/>
    </filter>

    <!-- 發光過濾器 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="0"/>

  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="30" fill="rgba(255,255,255,0.03)"/>
  <circle cx="550" cy="350" r="40" fill="rgba(255,255,255,0.03)"/>
  <circle cx="520" cy="60" r="20" fill="rgba(255,255,255,0.02)"/>
  <circle cx="80" cy="340" r="25" fill="rgba(255,255,255,0.02)"/>

  <!-- 主卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="30" y="25" width="540" height="350" rx="20" ry="20" fill="url(#cardGrad)"/>
    <!-- 卡片3D光影層 -->
    <rect x="30" y="25" width="540" height="350" rx="20" ry="20" fill="url(#cardShine)"/>
    <!-- 卡片邊框 -->
    <rect x="30" y="25" width="540" height="350" rx="20" ry="20" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>

  <!-- 標題 -->
  <text x="300" y="65" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="#2d3436" letter-spacing="2">估算數線</text>
  <line x1="180" y1="78" x2="420" y2="78" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- 數線主體 -->
  <g>
    <!-- 數線背景條 -->
    <rect x="70" y="160" width="460" height="8" rx="4" fill="rgba(0,0,0,0.08)"/>
    <!-- 數線漸變條 -->
    <rect x="70" y="160" width="460" height="8" rx="4" fill="url(#lineGrad)" opacity="0.85"/>

    <!-- 刻度標記 -->
    <!-- 80 -->
    <line x1="90" y1="155" x2="90" y2="173" stroke="#636e72" stroke-width="2"/>
    <text x="90" y="192" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#636e72" font-weight="bold">80</text>

    <!-- 90（目標1） -->
    <line x1="170" y1="155" x2="170" y2="173" stroke="#e17055" stroke-width="2.5"/>
    <text x="170" y="192" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#e17055" font-weight="bold">90</text>

    <!-- 100 -->
    <line x1="250" y1="155" x2="250" y2="173" stroke="#636e72" stroke-width="2"/>
    <text x="250" y="192" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#636e72" font-weight="bold">100</text>

    <!-- 110 -->
    <line x1="330" y1="155" x2="330" y2="173" stroke="#636e72" stroke-width="2"/>
    <text x="330" y="192" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#636e72" font-weight="bold">110</text>

    <!-- 120（目標2） -->
    <line x1="410" y1="155" x2="410" y2="173" stroke="#0984e3" stroke-width="2.5"/>
    <text x="410" y="192" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#0984e3" font-weight="bold">120</text>

    <!-- 130 -->
    <line x1="490" y1="155" x2="490" y2="173" stroke="#636e72" stroke-width="2"/>
    <text x="490" y="192" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="13" fill="#636e72" font-weight="bold">130</text>
  </g>

  <!-- 89 標記（帶放射漸變3D圓點） -->
  <g filter="url(#doubleShadow)">
    <circle cx="158" cy="164" r="12" fill="url(#dotGlow1)"/>
    <circle cx="158" cy="164" r="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- 高光 -->
    <ellipse cx="154" cy="159" rx="4" ry="3" fill="rgba(255,255,255,0.5)"/>
  </g>
  <text x="158" y="220" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" fill="#e17055" font-weight="bold">89</text>
  <text x="158" y="238" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#b2bec3">原始值</text>

  <!-- 123 標記（帶放射漸變3D圓點） -->
  <g filter="url(#doubleShadow)">
    <circle cx="422" cy="164" r="12" fill="url(#dotGlow2)"/>
    <circle cx="422" cy="164" r="12" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- 高光 -->
    <ellipse cx="418" cy="159" rx="4" ry="3" fill="rgba(255,255,255,0.5)"/>
  </g>
  <text x="422" y="220" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="16" fill="#0984e3" font-weight="bold">123</text>
  <text x="422" y="238" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#b2bec3">原始值</text>

  <!-- 箭頭 89→90（帶發光效果） -->
  <g filter="url(#glow)">
    <!-- 箭頭弧線 -->
    <path d="M 158 200 Q 164 175 170 185" fill="none" stroke="url(#arrowGrad1)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead1)"/>
    <!-- 箭頭標籤 -->
    <text x="164" y="270" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#f5576c" font-weight="bold">≈</text>
  </g>

  <!-- 箭頭 123→120（帶發光效果） -->
  <g filter="url(#glow)">
    <!-- 箭頭弧線 -->
    <path d="M 422 200 Q 416 175 410 185" fill="none" stroke="url(#arrowGrad2)" stroke-width="3" stroke-linecap="round"/>
    <!-- 箭頭標籤 -->
    <text x="416" y="270" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#00f2fe" font-weight="bold">≈</text>
  </g>

  <!-- 箭頭標記 -->
  <defs>
    <marker id="arrowhead1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f5576c"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00f2fe"/>
    </marker>
  </defs>

  <!-- 估算結果標籤 -->
  <!-- 89≈90 結果框 -->
  <g>
    <rect x="120" y="290" width="76" height="30" rx="15" fill="rgba(245,87,108,0.12)"/>
    <rect x="120" y="290" width="76" height="30" rx="15" fill="none" stroke="rgba(245,87,108,0.3)" stroke-width="1"/>
    <text x="158" y="310" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#e17055" font-weight="bold">89 ≈ 90</text>
  </g>

  <!-- 123≈120 結果框 -->
  <g>
    <rect x="380" y="290" width="82" height="30" rx="15" fill="rgba(0,242,254,0.12)"/>
    <rect x="380" y="290" width="82" height="30" rx="15" fill="none" stroke="rgba(0,242,254,0.3)" stroke-width="1"/>
    <text x="421" y="310" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="14" fill="#0984e3" font-weight="bold">123 ≈ 120</text>
  </g>

  <!-- 裝飾性小標籤 -->
  <text x="300" y="345" text-anchor="middle" font-family="'Microsoft YaHei',sans-serif" font-size="11" fill="#b2bec3" opacity="0.7">四捨五入至十位</text>

  <!-- 左上角裝飾 -->
  <circle cx="50" cy="50" r="3" fill="rgba(102,126,234,0.3)"/>
  <circle cx="60" cy="45" r="2" fill="rgba(102,126,234,0.2)"/>

  <!-- 右下角裝飾 -->
  <circle cx="555" cy="355" r="3" fill="rgba(102,126,234,0.3)"/>
  <circle cx="545" cy="360" r="2" fill="rgba(102,126,234,0.2)"/>
</svg>