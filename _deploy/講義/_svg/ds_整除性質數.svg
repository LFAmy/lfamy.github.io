<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#b8d4e8"/>
    </radialGradient>

    <!-- 卡片1：2的倍數 - 藍色系 -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <radialGradient id="card1Shine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow1">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#2a7ab0" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1a5a80" flood-opacity="0.3"/>
    </filter>

    <!-- 卡片2：3的倍數 - 綠色系 -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <radialGradient id="card2Shine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow2">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1a8a4a" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0a6a3a" flood-opacity="0.3"/>
    </filter>

    <!-- 卡片3：5的倍數 - 紫色系 -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1"/>
      <stop offset="100%" stop-color="#fbc2eb"/>
    </linearGradient>
    <radialGradient id="card3Shine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow3">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#7a5aaa" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#5a3a8a" flood-opacity="0.3"/>
    </filter>

    <!-- 質數合數卡片 - 橙色系 -->
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
    <radialGradient id="card4Shine" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow4">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#c04060" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#902040" flood-opacity="0.3"/>
    </filter>

    <!-- 標題漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="50%" stop-color="#2a5a8c"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>

    <!-- 數字標籤發光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- 背景裝飾圓點 -->
  <circle cx="50" cy="50" r="30" fill="rgba(255,255,255,0.15)"/>
  <circle cx="550" cy="60" r="25" fill="rgba(255,255,255,0.12)"/>
  <circle cx="30" cy="350" r="20" fill="rgba(255,255,255,0.1)"/>
  <circle cx="570" cy="340" r="28" fill="rgba(255,255,255,0.13)"/>
  <circle cx="300" cy="380" r="22" fill="rgba(255,255,255,0.08)"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)" filter="url(#glow)">🔢 整除性質 · 質數與合數</text>
  
  <line x1="120" y1="48" x2="480" y2="48" stroke="rgba(42,90,140,0.3)" stroke-width="1.5"/>

  <!-- ============ 卡片1：2的倍數 ============ -->
  <g filter="url(#shadow1)">
    <rect x="20" y="62" width="175" height="145" rx="14" fill="url(#card1Grad)"/>
    <rect x="20" y="62" width="175" height="145" rx="14" fill="url(#card1Shine)"/>
    <!-- 卡片頂部高光條 -->
    <rect x="20" y="62" width="175" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  </g>
  <text x="107" y="92" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="16" font-weight="bold" fill="white">2 的倍數</text>
  <text x="107" y="112" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">個位數字是</text>
  <text x="107" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="bold" fill="white" filter="url(#glow)">0,2,4,6,8</text>
  <text x="107" y="158" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">例：24、138、2076</text>
  <!-- 範例數字裝飾 -->
  <rect x="35" y="168" width="30" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="50" y="183" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="white">24</text>
  <rect x="75" y="168" width="30" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="90" y="183" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="white">138</text>
  <rect x="115" y="168" width="30" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="130" y="183" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="white">76</text>

  <!-- ============ 卡片2：3的倍數 ============ -->
  <g filter="url(#shadow2)">
    <rect x="212" y="62" width="175" height="145" rx="14" fill="url(#card2Grad)"/>
    <rect x="212" y="62" width="175" height="145" rx="14" fill="url(#card2Shine)"/>
    <rect x="212" y="62" width="175" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  </g>
  <text x="299" y="92" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="16" font-weight="bold" fill="white">3 的倍數</text>
  <text x="299" y="112" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">數字和可被 3 整除</text>
  <text x="299" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-size="24" font-weight="bold" fill="white" filter="url(#glow)">÷3 整除</text>
  <text x="299" y="158" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">例：42、153、2001</text>
  <!-- 範例數字裝飾 -->
  <rect x="227" y="168" width="30" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="242" y="183" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="white">42</text>
  <rect x="267" y="168" width="30" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="282" y="183" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="white">153</text>
  <rect x="307" y="168" width="30" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="322" y="183" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="white">201</text>

  <!-- ============ 卡片3：5的倍數 ============ -->
  <g filter="url(#shadow3)">
    <rect x="405" y="62" width="175" height="145" rx="14" fill="url(#card3Grad)"/>
    <rect x="405" y="62" width="175" height="145" rx="14" fill="url(#card3Shine)"/>
    <rect x="405" y="62" width="175" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  </g>
  <text x="492" y="92" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="16" font-weight="bold" fill="white">5 的倍數</text>
  <text x="492" y="112" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">個位數字是</text>
  <text x="492" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-size="28" font-weight="bold" fill="white" filter="url(#glow)">0 或 5</text>
  <text x="492" y="158" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">例：35、170、2005</text>
  <!-- 範例數字裝飾 -->
  <rect x="420" y="168" width="30" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="435" y="183" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="white">35</text>
  <rect x="460" y="168" width="30" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="475" y="183" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="white">170</text>
  <rect x="500" y="168" width="30" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="515" y="183" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="white">95</text>

  <!-- ============ 分隔線 ============ -->
  <line x1="40" y1="222" x2="560" y2="222" stroke="rgba(42,90,140,0.2)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ============ 卡片4：質數 vs 合數 ============ -->
  <g filter="url(#shadow4)">
    <rect x="20" y="235" width="560" height="148" rx="14" fill="url(#card4Grad)"/>
    <rect x="20" y="235" width="560" height="148" rx="14" fill="url(#card4Shine)"/>
    <rect x="20" y="235" width="560" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  </g>

  <text x="300" y="268" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="18" font-weight="bold" fill="white">質數 vs 合數</text>

  <!-- 質數區 -->
  <rect x="45" y="282" width="240" height="85" rx="10" fill="rgba(255,255,255,0.2)"/>
  <text x="165" y="302" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" font-weight="bold" fill="white">🌟 質數</text>
  <text x="165" y="320" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">只有 1 和本身兩個因數</text>
  <text x="165" y="340" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="bold" fill="white">2, 3, 5, 7, 11, 13, 17, 19</text>
  <text x="165" y="358" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="rgba(255,255,255,0.75)">⋯⋯ 還有更多！</text>

  <!-- 合數區 -->
  <rect x="315" y="282" width="240" height="85" rx="10" fill="rgba(255,255,255,0.2)"/>
  <text x="435" y="302" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="14" font-weight="bold" fill="white">📦 合數</text>
  <text x="435" y="320" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">超過兩個因數</text>
  <text x="435" y="340" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="bold" fill="white">4, 6, 8, 9, 10, 12, 14, 15</text>
  <text x="435" y="358" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="10" fill="rgba(255,255,255,0.75)">⋯⋯ 還有更多！</text>

  <!-- 底部裝飾文字 -->
  <text x="300" y="395" text-anchor="middle" font-family="'Microsoft YaHei','PingFang HK',sans-serif" font-size="9" fill="rgba(42,90,140,0.4)">香港小學數學 · 整除性質與質數</text>
</svg>