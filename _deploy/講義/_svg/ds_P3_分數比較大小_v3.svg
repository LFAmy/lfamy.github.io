<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 網格背景圖案 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#E2E8F0" opacity="0.5"/>
    </pattern>

    <!-- 1/5 紅色漸層（多層） -->
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="35%" stop-color="#F87171"/>
      <stop offset="70%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>

    <!-- 2/5 藍色漸層（多層） -->
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="33%" stop-color="#6366F1"/>
      <stop offset="66%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <!-- 4/5 綠色漸層（多層） -->
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="30%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#34D399"/>
      <stop offset="85%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <!-- 強調色漸層（箭頭用） -->
    <linearGradient id="gradArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- 放射漸層 3D光影效果 -->
    <radialGradient id="shineRed" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="shineBlue" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="shineGreen" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- 卡片漸層邊框 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- 雙層陰影濾鏡 -->
    <filter id="shadowCard" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>

    <!-- 箭頭定義 -->
    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="url(#gradArrow)"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="#FAFBFC"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- 主卡片 -->
  <rect x="25" y="20" width="550" height="360" rx="16" ry="16" fill="#FFFFFF" stroke="url(#cardBorder)" stroke-width="2" filter="url(#shadowCard)"/>

  <!-- 標題 -->
  <text x="300" y="58" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="20" font-weight="bold" fill="#1E293B">分數比較大小</text>
  <line x1="180" y1="68" x2="420" y2="68" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ===== 第一條：1/5 ===== -->
  <g transform="translate(60, 95)">
    <!-- 標籤 -->
    <text x="0" y="0" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="500">1/5</text>

    <!-- 長條背景 -->
    <rect x="0" y="10" width="460" height="36" rx="14" ry="14" fill="#F1F5F9"/>

    <!-- 長條本體（1/5） -->
    <rect x="0" y="10" width="92" height="36" rx="14" ry="14" fill="url(#gradRed)"/>
    <rect x="0" y="10" width="92" height="36" rx="14" ry="14" fill="url(#shineRed)"/>

    <!-- 百分比標註 -->
    <text x="46" y="32" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">20%</text>
  </g>

  <!-- ===== 第二條：2/5 ===== -->
  <g transform="translate(60, 165)">
    <!-- 標籤 -->
    <text x="0" y="0" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="500">2/5</text>

    <!-- 長條背景 -->
    <rect x="0" y="10" width="460" height="36" rx="14" ry="14" fill="#F1F5F9"/>

    <!-- 長條本體（2/5） -->
    <rect x="0" y="10" width="184" height="36" rx="14" ry="14" fill="url(#gradBlue)"/>
    <rect x="0" y="10" width="184" height="36" rx="14" ry="14" fill="url(#shineBlue)"/>

    <!-- 百分比標註 -->
    <text x="92" y="32" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">40%</text>
  </g>

  <!-- ===== 第三條：4/5 ===== -->
  <g transform="translate(60, 235)">
    <!-- 標籤 -->
    <text x="0" y="0" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="13" fill="#475569" font-weight="500">4/5</text>

    <!-- 長條背景 -->
    <rect x="0" y="10" width="460" height="36" rx="14" ry="14" fill="#F1F5F9"/>

    <!-- 長條本體（4/5） -->
    <rect x="0" y="10" width="368" height="36" rx="14" ry="14" fill="url(#gradGreen)"/>
    <rect x="0" y="10" width="368" height="36" rx="14" ry="14" fill="url(#shineGreen)"/>

    <!-- 百分比標註 -->
    <text x="184" y="32" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">80%</text>
  </g>

  <!-- ===== 刻度尺 ===== -->
  <g transform="translate(60, 305)">
    <!-- 尺身 -->
    <rect x="0" y="0" width="460" height="8" rx="4" ry="4" fill="#E2E8F0"/>

    <!-- 刻度標記 -->
    <line x1="0" y1="0" x2="0" y2="12" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#64748B">0</text>

    <line x1="92" y1="0" x2="92" y2="10" stroke="#94A3B8" stroke-width="1"/>
    <text x="92" y="22" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="9" fill="#94A3B8">1/5</text>

    <line x1="184" y1="0" x2="184" y2="10" stroke="#94A3B8" stroke-width="1"/>
    <text x="184" y="22" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="9" fill="#94A3B8">2/5</text>

    <line x1="276" y1="0" x2="276" y2="10" stroke="#94A3B8" stroke-width="1"/>
    <text x="276" y="22" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="9" fill="#94A3B8">3/5</text>

    <line x1="368" y1="0" x2="368" y2="10" stroke="#94A3B8" stroke-width="1"/>
    <text x="368" y="22" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="9" fill="#94A3B8">4/5</text>

    <line x1="460" y1="0" x2="460" y2="12" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="460" y="24" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#64748B">1</text>
  </g>

  <!-- ===== 比較箭頭 ===== -->
  <!-- 1/5 → 2/5 -->
  <g transform="translate(60, 135)">
    <line x1="92" y1="0" x2="184" y2="0" stroke="url(#gradArrow)" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  </g>

  <!-- 2/5 → 4/5 -->
  <g transform="translate(60, 205)">
    <line x1="184" y1="0" x2="368" y2="0" stroke="url(#gradArrow)" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  </g>

  <!-- 比較符號標註 -->
  <text x="300" y="345" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="13" fill="#64748B">
    1/5 <tspan fill="#EF4444" font-weight="bold">&lt;</tspan> 2/5 <tspan fill="#4F46E5" font-weight="bold">&lt;</tspan> 4/5
  </text>

  <!-- 底部提示 -->
  <text x="300" y="370" text-anchor="middle" font-family="'Noto Sans HK','PingFang HK','Microsoft YaHei',sans-serif" font-size="10" fill="#94A3B8">
    分母相同時，分子越大，分數越大
  </text>
</svg>