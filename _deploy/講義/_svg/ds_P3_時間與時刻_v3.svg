<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <!-- 背景漸變 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d1ecf1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8dff0;stop-opacity:1" />
    </linearGradient>

    <!-- 卡片背景漸變 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>

    <!-- 時鐘外圈金屬漸變 -->
    <linearGradient id="clockOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5" />
      <stop offset="25%" style="stop-color:#e0e0e0" />
      <stop offset="50%" style="stop-color:#c0c0c0" />
      <stop offset="75%" style="stop-color:#e0e0e0" />
      <stop offset="100%" style="stop-color:#f5f5f5" />
    </linearGradient>

    <!-- 時鐘內圈漸變 -->
    <radialGradient id="clockFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="85%" style="stop-color:#fafafa" />
      <stop offset="100%" style="stop-color:#e8e8e8" />
    </radialGradient>

    <!-- 時鐘3D陰影 -->
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#00000040"/>
    </filter>

    <!-- 卡片陰影 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="#00000030"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="3" flood-color="#00000015"/>
    </filter>

    <!-- 時間線漸變 -->
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe" />
      <stop offset="50%" style="stop-color:#00f2fe" />
      <stop offset="100%" style="stop-color:#43e97b" />
    </linearGradient>

    <!-- 時間線陰影 -->
    <filter id="timelineShadow" x="-5%" y="-50%" width="110%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000025"/>
    </filter>

    <!-- 標籤圓點漸變 -->
    <radialGradient id="dotGradStart" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ff6b6b" />
      <stop offset="100%" style="stop-color:#ee5a24" />
    </radialGradient>
    <radialGradient id="dotGradMid" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#ffd93d" />
      <stop offset="100%" style="stop-color:#f6b93b" />
    </radialGradient>
    <radialGradient id="dotGradEnd" cx="40%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#6bcb77" />
      <stop offset="100%" style="stop-color:#38a169" />
    </radialGradient>

    <!-- 時針漸變 -->
    <linearGradient id="hourHandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436" />
      <stop offset="100%" style="stop-color:#636e72" />
    </linearGradient>

    <!-- 分針漸變 -->
    <linearGradient id="minHandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436" />
      <stop offset="100%" style="stop-color:#636e72" />
    </linearGradient>

    <!-- 秒針漸變 -->
    <linearGradient id="secHandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c" />
      <stop offset="100%" style="stop-color:#c0392b" />
    </linearGradient>

    <!-- 標題文字漸變 -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50" />
      <stop offset="100%" style="stop-color:#3498db" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" rx="20" ry="20" fill="url(#bgGrad)"/>

  <!-- 裝飾背景圓點 -->
  <circle cx="50" cy="50" r="3" fill="#ffffff80"/>
  <circle cx="550" cy="60" r="4" fill="#ffffff60"/>
  <circle cx="30" cy="350" r="2" fill="#ffffff70"/>
  <circle cx="570" cy="340" r="3" fill="#ffffff50"/>
  <circle cx="100" cy="380" r="2" fill="#ffffff40"/>
  <circle cx="500" cy="30" r="2" fill="#ffffff60"/>

  <!-- 標題 -->
  <text x="300" y="38" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="bold" fill="url(#titleGrad)">時間與時刻</text>

  <!-- 左側時鐘卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="55" width="260" height="320" rx="18" ry="18" fill="url(#cardGrad)" stroke="#d0d0d0" stroke-width="1"/>
  </g>

  <!-- 時鐘3D -->
  <g filter="url(#clockShadow)">
    <!-- 時鐘外圈 -->
    <circle cx="150" cy="175" r="105" fill="url(#clockOuter)" stroke="#b0b0b0" stroke-width="1.5"/>

    <!-- 時鐘內圈 -->
    <circle cx="150" cy="175" r="95" fill="url(#clockFace)" stroke="#d0d0d0" stroke-width="0.5"/>

    <!-- 時鐘刻度 - 小時 -->
    <g stroke="#333" stroke-width="2.5" stroke-linecap="round">
      <line x1="150" y1="90" x2="150" y2="100"/>
      <line x1="150" y1="250" x2="150" y2="260"/>
      <line x1="65" y1="175" x2="75" y2="175"/>
      <line x1="225" y1="175" x2="235" y2="175"/>
    </g>

    <!-- 時鐘刻度 - 其他小時標記 -->
    <g stroke="#555" stroke-width="1.8" stroke-linecap="round">
      <!-- 1點 -->
      <line x1="195.5" y1="98" x2="191" y2="107"/>
      <!-- 2點 -->
      <line x1="228" y1="130" x2="220" y2="136"/>
      <!-- 4點 -->
      <line x1="228" y1="220" x2="220" y2="214"/>
      <!-- 5點 -->
      <line x1="195.5" y1="252" x2="191" y2="243"/>
      <!-- 7點 -->
      <line x1="104.5" y1="252" x2="109" y2="243"/>
      <!-- 8點 -->
      <line x1="72" y1="220" x2="80" y2="214"/>
      <!-- 10點 -->
      <line x1="72" y1="130" x2="80" y2="136"/>
      <!-- 11點 -->
      <line x1="104.5" y1="98" x2="109" y2="107"/>
    </g>

    <!-- 數字時標 -->
    <g font-family="'Arial', sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle" dominant-baseline="central">
      <text x="150" y="105">12</text>
      <text x="195" y="115">1</text>
      <text x="222" y="142">2</text>
      <text x="235" y="175">3</text>
      <text x="222" y="208">4</text>
      <text x="195" y="235">5</text>
      <text x="150" y="248">6</text>
      <text x="105" y="235">7</text>
      <text x="78" y="208">8</text>
      <text x="65" y="175">9</text>
      <text x="78" y="142">10</text>
      <text x="105" y="115">11</text>
    </g>

    <!-- 時針（指向10點方向） -->
    <g transform="rotate(-60, 150, 175)">
      <polygon points="148,175 152,175 151,120 149,120" fill="url(#hourHandGrad)" stroke="#222" stroke-width="0.5"/>
      <!-- 時針高光 -->
      <polygon points="149,175 150,175 150,120 149,120" fill="#ffffff20"/>
    </g>

    <!-- 分針（指向2點方向） -->
    <g transform="rotate(60, 150, 175)">
      <polygon points="148.5,175 151.5,175 151,95 149,95" fill="url(#minHandGrad)" stroke="#222" stroke-width="0.5"/>
      <!-- 分針高光 -->
      <polygon points="149.5,175 150.5,175 150.5,95 149.5,95" fill="#ffffff20"/>
    </g>

    <!-- 秒針（指向7點方向） -->
    <g transform="rotate(-150, 150, 175)">
      <line x1="150" y1="200" x2="150" y2="88" stroke="url(#secHandGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 秒針尾 -->
      <line x1="150" y1="200" x2="150" y2="210" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- 中心點 -->
    <circle cx="150" cy="175" r="5" fill="#2d3436"/>
    <circle cx="150" cy="175" r="2.5" fill="#e74c3c"/>
    <!-- 中心高光 -->
    <circle cx="148" cy="173" r="1" fill="#ffffff80"/>
  </g>

  <!-- 時鐘下方標籤 -->
  <text x="150" y="310" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#555">時鐘顯示 10:10</text>
  <text x="150" y="335" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#888">上午 10 時 10 分</text>

  <!-- 右側時間線卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="300" y="55" width="280" height="320" rx="18" ry="18" fill="url(#cardGrad)" stroke="#d0d0d0" stroke-width="1"/>
  </g>

  <!-- 時間線標題 -->
  <text x="440" y="95" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">時間線</text>

  <!-- 時間線 -->
  <g filter="url(#timelineShadow)">
    <!-- 時間線主體 -->
    <rect x="330" y="130" width="220" height="8" rx="4" ry="4" fill="url(#timelineGrad)"/>
  </g>

  <!-- 時間線刻度 -->
  <g stroke="#aaa" stroke-width="1">
    <line x1="330" y1="130" x2="330" y2="145"/>
    <line x1="385" y1="130" x2="385" y2="145"/>
    <line x1="440" y1="130" x2="440" y2="145"/>
    <line x1="495" y1="130" x2="495" y2="145"/>
    <line x1="550" y1="130" x2="550" y2="145"/>
  </g>

  <!-- 時間線標籤 -->
  <g font-family="'Arial', sans-serif" font-size="11" fill="#666" text-anchor="middle">
    <text x="330" y="158">0分</text>
    <text x="385" y="158">15分</text>
    <text x="440" y="158">30分</text>
    <text x="495" y="158">45分</text>
    <text x="550" y="158">60分</text>
  </g>

  <!-- 開始點 -->
  <g filter="url(#clockShadow)">
    <circle cx="340" cy="134" r="10" fill="url(#dotGradStart)"/>
    <circle cx="338" cy="132" r="3" fill="#ffffff50"/>
  </g>
  <text x="340" y="185" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="bold" fill="#ee5a24">開始</text>
  <text x="340" y="203" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" fill="#888">上午 9:00</text>

  <!-- 經過點 -->
  <g filter="url(#clockShadow)">
    <circle cx="440" cy="134" r="10" fill="url(#dotGradMid)"/>
    <circle cx="438" cy="132" r="3" fill="#ffffff50"/>
  </g>
  <text x="440" y="185" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="bold" fill="#f6b93b">經過</text>
  <text x="440" y="203" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" fill="#888">30分鐘</text>

  <!-- 結束點 -->
  <g filter="url(#clockShadow)">
    <circle cx="540" cy="134" r="10" fill="url(#dotGradEnd)"/>
    <circle cx="538" cy="132" r="3" fill="#ffffff50"/>
  </g>
  <text x="540" y="185" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="bold" fill="#38a169">結束</text>
  <text x="540" y="203" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" fill="#888">上午 9:30</text>

  <!-- 時間線說明區域 -->
  <rect x="330" y="225" width="220" height="120" rx="12" ry="12" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>

  <!-- 說明圖標和文字 -->
  <g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#444">
    <!-- 開始 -->
    <circle cx="355" cy="250" r="6" fill="#ee5a24"/>
    <text x="370" y="254" font-size="12">開始時刻：活動起點</text>

    <!-- 經過 -->
    <circle cx="355" cy="278" r="6" fill="#f6b93b"/>
    <text x="370" y="282" font-size="12">經過時間：持續長度</text>

    <!-- 結束 -->
    <circle cx="355" cy="306" r="6" fill="#38a169"/>
    <text x="370" y="310" font-size="12">結束時刻：活動終點</text>
  </g>

  <!-- 公式區域 -->
  <rect x="330" y="355" width="220" height="15" rx="3" ry="3" fill="none"/>
  <text x="440" y="368" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" fill="#999">結束時刻 = 開始時刻 + 經過時間</text>

</svg>