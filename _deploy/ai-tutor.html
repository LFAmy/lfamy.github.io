﻿<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="霖楓AI導師">
<meta name="theme-color" content="#1A3C6D">
<meta property="og:title" content="霖楓學苑 · AI 數學導師 v3.0">
<meta property="og:description" content="AI智能數學導師，離線可用，內置150+題庫。P3-P6香港小學數學。">

<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<link rel="stylesheet" href="/lf-academy-v8.css">
<style>
body{background:linear-gradient(170deg,#091524,#0F2440,#1A3C6D,#1E4D8C);min-height:100vh;display:flex;align-items:center;justify-content:center;padding-top:var(--nav-height)}
.tutor-container{width:100%;max-width:780px;height:calc(100vh - var(--nav-height) - 20px);background:var(--surface);border-radius:var(--radius-lg);box-shadow:0 25px 80px rgba(0,0,0,0.4);display:flex;flex-direction:column;overflow:hidden;margin:10px}
.tutor-header{background:linear-gradient(135deg,var(--blue-dark),var(--blue),var(--blue-light));color:white;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.tutor-header h1{font-size:1em;font-weight:700;color:white;margin:0}
.tutor-header .status{font-size:0.7em;margin-left:auto;display:flex;align-items:center;gap:6px}
.tutor-header .dot{width:7px;height:7px;border-radius:50%}
.dot-online{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,0.4)}
.dot-offline{background:#fbbf24}
.mode-tabs{display:flex;gap:4px;padding:4px;margin:10px 16px;background:var(--bg);border-radius:var(--radius-sm);flex-shrink:0}
.mode-tab{flex:1;padding:10px;text-align:center;border-radius:var(--radius-xs);cursor:pointer;font-size:0.82em;font-weight:600;color:var(--text-muted);transition:all .15s;border:none;background:transparent}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}
#topicView{flex:1;overflow-y:auto;padding:14px 18px;display:none}
#topicView h2{font-size:0.9em;margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--purple)}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.topic-card{background:var(--surface-alt);border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:all .15s}
.topic-card:hover{border-color:var(--blue);background:#EFF6FF;transform:translateY(-2px);box-shadow:var(--shadow)}
.topic-card .tname{font-weight:600;color:var(--text);font-size:0.9em;margin-bottom:4px}
.topic-card .tmeta{font-size:0.72em;color:var(--text-muted)}
#qArea{background:linear-gradient(135deg,#EFF6FF,#DBEAFE);padding:16px 20px;border-bottom:2px solid #BFDBFE;flex-shrink:0;display:none}
#qArea .topic-tag{display:inline-block;background:var(--blue);color:white;padding:2px 10px;border-radius:12px;font-size:0.7em;margin-bottom:8px}
#qArea .qtext{font-size:1.05em;line-height:1.7;color:var(--text)}
#qArea .meta{color:var(--text-muted);font-size:0.72em;margin-top:6px}
.chat-area{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-alt)}
.msg{max-width:85%;padding:10px 16px;border-radius:16px;line-height:1.6;font-size:0.9em;word-wrap:break-word;animation:fadeUp .3s ease-out}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:var(--blue);color:white;border-bottom-right-radius:4px}
.msg.system{align-self:center;background:var(--bg);color:var(--text-muted);font-size:0.75em;padding:6px 16px;border-radius:10px}
.msg.correct{background:#D1FAE5;color:#065F46;font-weight:600;padding:10px 20px;border-radius:999px;align-self:center}
.msg.wrong{background:#FEE2E2;color:#991B1B;padding:10px 20px;border-radius:999px;align-self:center}
.input-area{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.input-area input{flex:1;padding:8px 14px;border:2px solid var(--border);border-radius:999px;font-size:0.9em;background:var(--bg);color:var(--text)}
.input-area input:focus{outline:none;border-color:var(--blue)}
.input-area button{padding:8px 18px;border:none;border-radius:999px;font-weight:600;cursor:pointer;font-size:0.85em}
.stats-bar{display:flex;gap:16px;padding:4px 16px;font-size:0.7em;color:var(--text-muted);flex-shrink:0;flex-wrap:wrap}
.stats-bar span{display:flex;align-items:center;gap:4px}
.offline-banner{position:fixed;top:60px;left:0;right:0;z-index:999;background:#FEF3C7;color:#92400E;padding:6px 16px;text-align:center;font-size:13px;font-weight:600;display:none}
@media(max-width:768px){.tutor-container{margin:0;height:100vh;border-radius:0}}
</style>
</head>
<body>
<div id="offlineBanner" class="offline-banner">&#x1F534; 後端伺服器離線 — 使用內置題庫 (150+主題)</div>
<div class="tutor-container">
  <div class="tutor-header">
    <div style="font-size:1.4em">&#x1F9E0;</div>
    <div><h1>AI 數學導師</h1><div style="font-size:0.65em;opacity:.75">霖楓學苑 · v3.0</div></div>
    <div class="status"><span class="dot dot-online" id="statusDot"></span><span id="statusText">連線中</span></div>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="switchMode('practice')"><span style="display:block;font-size:1.2em;margin-bottom:2px">&#x1F4DD;</span>練習模式</button>
    <button class="mode-tab" onclick="switchMode('free')"><span style="display:block;font-size:1.2em;margin-bottom:2px">&#x1F4AC;</span>自由問答</button>
  </div>
  <div class="mode-tabs" style="margin-top:0;margin-bottom:4px">
    <button class="mode-tab active" style="font-size:0.75em;padding:6px" onclick="switchRole('teacher',this)">&#x1F9D1;&#x200D;&#x1F3EB; 老師教學</button>
    <button class="mode-tab" style="font-size:0.75em;padding:6px" onclick="switchRole('friend',this)">&#x1F91D; 朋友引導</button>
    <button class="mode-tab" style="font-size:0.75em;padding:6px" onclick="switchRole('coach',this)">&#x1F3C6; 考試教練</button>
  </div>
  <div class="stats-bar">
    <span>&#x2705; 正確: <b id="correctCount">0</b></span>
    <span>&#x1F4A1; 提示: <b id="hintCount">0</b></span>
    <span>&#x1F4CA; 題數: <b id="qCount">0</b></span>
    <span>&#x1F525; 連續: <b id="gamiStreak">0</b></span>
    <span>&#x2B50; 積分: <b id="gamiPoints">0</b></span>
  </div>
  <div id="topicView"><div id="topicContent"></div></div>
  <div id="qArea">
    <div><span class="topic-tag" id="topicTag">選擇主題</span></div>
    <div class="qtext" id="qText">揀一個主題開始練習</div>
    <div class="meta" id="qMeta"></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button onclick="getHint()" style="background:#FEF3C7;color:#D97706;padding:6px 16px;border:none;border-radius:999px;font-weight:600;cursor:pointer;font-size:0.75em">&#x1F4A1; 提示</button>
      <button onclick="solveIt()" style="background:#1A3C6D;color:white;padding:6px 16px;border:none;border-radius:999px;font-weight:600;cursor:pointer;font-size:0.75em">&#x1F9E9; 答案</button>
      <button onclick="skipQuestion()" style="background:#E5E7EB;color:#6B7280;padding:6px 16px;border:none;border-radius:999px;font-weight:600;cursor:pointer;font-size:0.75em">&#x23ED; 跳過</button>
      <button onclick="showTopics()" style="background:#EDE9FE;color:#7C3AED;padding:6px 16px;border:none;border-radius:999px;font-weight:600;cursor:pointer;font-size:0.75em">&#x1F4DA; 換主題</button>
    </div>
  </div>
  <div id="freeChat" class="chat-area" style="display:none">
    <div class="msg ai">你好！我是霖楓學苑嘅AI數學導師。你可以問我任何數學問題，例如：「點樣做分數加法？」、「解釋咩係質數」、「點樣計面積」。</div>
  </div>
  <div id="practiceChat" class="chat-area">
    <div class="msg ai">&#x1F44B; 歡迎！揀一個題目開始練習啦！</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="輸入答案或問題..." autocomplete="off">
    <button onclick="handleSend()" style="background:#1A3C6D;color:white;padding:8px 20px">&#x25B6;</button>
  </div>
</div>
<script src="/data/tutor-data.js"></script>
<script>

let currentMode = 'practice';
let currentRole = 'teacher'; // teacher / friend / coach
let currentTopic = null;
let currentQ = null;
let stats = { correct: 0, hints: 0, total: 0 };
let gami = { points: 0, streak: 0 };
const API = 'https://lf-api-f80h.onrender.com';

async function init() {
  updateStats();
  await checkBackend();
  showTopics();
}
document.addEventListener('DOMContentLoaded', init);

async function checkBackend() {
  try {
    const r = await fetch(API + '/api/health', { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      document.getElementById('statusText').textContent = '連線中';
      document.getElementById('statusDot').className = 'dot dot-online';
      return;
    }
  } catch(e) {}
  document.getElementById('statusText').textContent = '離線題庫';
  document.getElementById('statusDot').className = 'dot dot-offline';
  document.getElementById('offlineBanner').style.display = 'block';
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');
function switchRole(role, btn) {
  currentRole = role;
  var roleNames = {'teacher': '\uD83E\uDDD1\u200D\uD83C\uDFEB \u8001\u5E2B\u6559\u5B78', 'friend': '\uD83E\uDD1D \u670B\u53CB\u5F15\u5C0E', 'coach': '\uD83C\uDFC6 \u8003\u8A66\u6559\u7DF4'};
  document.querySelectorAll('.mode-tabs:nth-of-type(2) .mode-tab').forEach(function(t) { t.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  addMsg('\uD83D\uDD04 \u5DF2\u5207\u63DB\u5230\uFF1A' + roleNames[role], 'system');
}
  document.getElementById('topicView').style.display = 'none';
  document.getElementById('qArea').style.display = 'none';
  document.getElementById('freeChat').style.display = 'none';
  document.getElementById('practiceChat').style.display = 'none';
  if (mode === 'practice') {
    document.getElementById('practiceChat').style.display = 'flex';
    if (!currentTopic) showTopics();
  } else {
    document.getElementById('freeChat').style.display = 'flex';
  }
}

function showTopics() {
  document.getElementById('topicView').style.display = 'block';
  document.getElementById('topicContent').innerHTML = '';
  document.getElementById('qArea').style.display = 'none';
  document.getElementById('practiceChat').style.display = 'flex';
  var grades = {};
  TUTOR_TOPICS.forEach(function(t) {
    if (!grades[t.g]) grades[t.g] = [];
    grades[t.g].push(t);
  });
  var gn = { P3:'小三', P4:'小四', P5:'小五', P6:'小六' };
  var html = '';
  Object.keys(grades).sort().forEach(function(g) {
    html += '<h2>📚 ' + (gn[g]||g) + ' (' + grades[g].length + ' 主題)</h2><div class="topic-grid">';
    grades[g].forEach(function(t) {
      html += '<div class="topic-card" onclick="selectTopic(\'' + t.t.replace(/'/g,"\\'") + '\',\'' + t.g + '\')">'
        + '<div class="tname">' + t.t + '</div>'
        + '<div class="tmeta">' + g + ' · ' + t.q.length + ' 題</div></div>';
    });
    html += '</div>';
  });
  document.getElementById('topicContent').innerHTML = html;
}

function selectTopic(topicName, grade) {
  currentTopic = { topic: topicName, grade: grade };
  document.getElementById('topicView').style.display = 'none';
  var found = null;
  for (var i = 0; i < TUTOR_TOPICS.length; i++) {
    if (TUTOR_TOPICS[i].t === topicName && TUTOR_TOPICS[i].g === grade) {
      found = TUTOR_TOPICS[i];
      break;
    }
  }
  if (found && found.q.length > 0) {
    var qi = Math.floor(Math.random() * found.q.length);
    var qd = found.q[qi];
    currentQ = { q: qd.q, opts: qd.o || [], ans: qd.a, trap: qd.t || '' };
    document.getElementById('qArea').style.display = 'block';
    document.getElementById('topicTag').textContent = grade + ' · ' + topicName;
    document.getElementById('qText').textContent = qd.q;
    var meta = '';
    if (qd.o && qd.o.length > 0) meta += '選項: ' + qd.o.join(', ');
    if (qd.t) meta += ' | ⚠ ' + qd.t;
    document.getElementById('qMeta').textContent = meta;
    addMsg('📝 <strong>' + qd.q + '</strong>', 'ai');
    stats.total++;
    updateStats();
    saveSession();
  } else {
    addMsg('⚠️ 暫時無題目', 'system');
  }
}

function handleSend() {
  var input = document.getElementById('userInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  if (currentMode === 'free') {
    addMsg(text, 'user');
    freeAsk(text);
  } else {
    addMsg(text, 'user');
    checkAnswer(text);
  }
}

function checkAnswer(userAns) {
  if (!currentQ) return;
  var correct = String(currentQ.ans);
  var normalized = userAns.replace(/[^0-9-]/g, '');
  if (normalized === correct || userAns.toLowerCase() === correct.toLowerCase()) {
    addMsg('✅ 啱咗！🎉', 'correct');
    stats.correct++;
    gami.points += 10;
    gami.streak++;
    if (currentQ.trap) addMsg('💡 ' + currentQ.trap, 'ai');
    updateGami();
    setTimeout(function() { fetchNext(); }, 800);
  } else {
    addMsg('❌ 唔啱喎，再試下！', 'wrong');
    gami.streak = 0;
    if (currentQ.opts && currentQ.opts.length > 0) {
      addMsg('💡 選項: ' + currentQ.opts.join(', '), 'ai');
    }
    updateGami();
  }
}

function fetchNext() {
  currentQ = null;
  if (currentTopic) selectTopic(currentTopic.topic, currentTopic.grade);
  else showTopics();
}

function getHint() {
  if (!currentQ) return;
  stats.hints++;
  var isOnline = document.getElementById('statusDot').className.indexOf('dot-online') >= 0;
  if (isOnline && currentQ.q) {
    fetch(API + '/api/ai/tutor/hint', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: currentQ.q, difficulty: 'medium'})
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data && data.hint) { addMsg('\uD83D\uDCA1 <strong>\u63D0\u793A\uFF1A</strong>' + data.hint, 'ai'); }
      else if (currentQ.trap) { addMsg('\uD83D\uDCA1 <strong>\u9677\u9631\u63D0\u793A\uFF1A</strong>' + currentQ.trap, 'ai'); }
      else { addMsg('\uD83D\uDCA1 \u8A66\u4E0B\u7528\u9010\u6B65\u63A8\u7406', 'ai'); }
    }).catch(function() {
      if (currentQ.trap) addMsg('\uD83D\uDCA1 <strong>\u9677\u9631\u63D0\u793A\uFF1A</strong>' + currentQ.trap, 'ai');
      else addMsg('\uD83D\uDCA1 \u8A66\u4E0B\u7528\u9010\u6B65\u63A8\u7406', 'ai');
    });
  } else {
    if (currentQ.trap) addMsg('\uD83D\uDCA1 <strong>\u9677\u9631\u63D0\u793A\uFF1A</strong>' + currentQ.trap, 'ai');
    else addMsg('\uD83D\uDCA1 \u8A66\u4E0B\u7528\u9010\u6B65\u63A8\u7406', 'ai');
  }
  updateStats();
}

function solveIt() {
  if (!currentQ) return;
  addMsg('🧩 答案係：<strong>' + currentQ.ans + '</strong>', 'system');
  if (currentQ.trap) addMsg('⚠️ ' + currentQ.trap, 'system');
}

function skipQuestion() {
  if (!currentQ) return;
  addMsg('⏭ 跳過。答案：<strong>' + currentQ.ans + '</strong>', 'system');
  if (currentQ.trap) addMsg('⚠️ ' + currentQ.trap, 'system');
  currentQ = null;
  setTimeout(function() { fetchNext(); }, 600);
}

function freeAsk(question) {
  var isOnline = document.getElementById('statusDot').className.indexOf('dot-online') >= 0;
  addMsg('\uD83E\uDD16 *\u6B63\u5728\u601D\u8003...*', 'ai');
  
  // Try client-side math solver first
  var solved = MATH_SOLVER.solve(question);
  if (solved) {
    setTimeout(function() {
      var msgs = document.querySelectorAll('.msg:last-child');
      var lastMsg = msgs[msgs.length - 1];
      if (lastMsg && lastMsg.textContent.includes('\u601D\u8003')) lastMsg.remove();
      addMsg(MATH_SOLVER.teach(question, solved), 'ai');
    }, 600);
    return;
  }
  
  if (isOnline) {
    // Call Render chat API with mode parameter
    var grade = currentTopic ? currentTopic.grade : 'P4';
    var topic = currentTopic ? currentTopic.topic : 'general';
    fetch(API + '/api/ai/tutor/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: question, session_id: 'web_' + Date.now(), grade: grade, topic: topic, mode: currentRole})
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var msgs = document.querySelectorAll('.msg:last-child');
      var lastMsg = msgs[msgs.length - 1];
      if (lastMsg && lastMsg.textContent.includes('思考')) lastMsg.remove();
      if (data && data.response) {
        addMsg(data.response, 'ai');
      } else {
        addMsg('抱歉，暫時無法回應。請再試一次。', 'ai');
      }
    })
    .catch(function() {
      // Fallback to offline
      freeAskOffline(question);
    });
  } else {
    freeAskOffline(question);
  }
}

function freeAskOffline(question) {
  setTimeout(function() {
    var msgs = document.querySelectorAll('.msg:last-child');
    var lastMsg = msgs[msgs.length - 1];
    if (lastMsg && lastMsg.textContent.includes('\u601D\u8003')) lastMsg.remove();
    var q = question.toLowerCase();

    // Try to extract numbers and compute
    var nums = q.match(/\d+/g);
    var response = '';

    if (q.includes('+') && nums && nums.length >= 2) {
      var a = parseInt(nums[0]), b = parseInt(nums[1]);
      response = '\uD83D\uDCA1 <strong>\u8A08\u7B97\u6B65\u9A5F\uFF1A</strong>\n' + a + ' + ' + b + ' = ?\n' +
        '\u2460\uFE0F \u500B\u4F4D\uFF1A' + (a%10) + ' + ' + (b%10) + ' = ' + ((a%10)+(b%10)) + '\n' +
        '\u2461\uFE0F \u5341\u4F4D\uFF1A' + Math.floor(a/10) + ' + ' + Math.floor(b/10) + ' = ' + (Math.floor(a/10)+Math.floor(b/10)) + '\n' +
        '\u2705 \u7B54\u6848\uFF1A' + a + ' + ' + b + ' = ' + (a+b);
    } else if ((q.includes('-') || q.includes('\u6E1B')) && nums && nums.length >= 2) {
      var a = parseInt(nums[0]), b = parseInt(nums[1]);
      response = '\uD83D\uDCA1 <strong>\u8A08\u7B97\u6B65\u9A5F\uFF1A</strong>\n' + a + ' - ' + b + ' = ?\n' +
        '\u2460\uFE0F \u500B\u4F4D\uFF1A' + (a%10) + ' - ' + (b%10) + ' = ' + ((a%10)-(b%10)) + '\n' +
        '\u2461\uFE0F \u5341\u4F4D\uFF1A' + Math.floor(a/10) + ' - ' + Math.floor(b/10) + ' = ' + (Math.floor(a/10)-Math.floor(b/10)) + '\n' +
        '\u2705 \u7B54\u6848\uFF1A' + a + ' - ' + b + ' = ' + (a-b);
    } else if (q.includes('\u00D7') || q.includes('x') || q.includes('*') || q.includes('\u4E58')) {
      // Multiplication with smaller numbers
      var mulNums = q.match(/\d+/g);
      if (mulNums && mulNums.length >= 2) {
        var a = parseInt(mulNums[0]), b = parseInt(mulNums[1]);
        if (a > 100 && b > 100) { a = Math.min(a,b); b = Math.max(a,b) < 100 ? Math.max(a,b) : 7; }
        response = '\uD83D\uDCA1 <strong>\u4E58\u6CD5\u6B65\u9A5F\uFF1A</strong>\n' + a + ' \u00D7 ' + b + ' = ?\n' +
          '\u2705 \u7B54\u6848\uFF1A' + a + ' \u00D7 ' + b + ' = ' + (a*b) + '\n' +
          '\uD83D\uDCD6 \u9A57\u7B97\uFF1A' + (a*b) + ' \u00F7 ' + b + ' = ' + ((a*b)/b);
      }
    } else if (q.includes('\u5206\u6578') || q.includes('/')) {
      response = '\uD83D\uDCD6 <strong>\u5206\u6578\u6559\u5B78\uFF1A</strong>\n' +
        '\u5206\u6578 = \u5206\u5B50(\u4E0A) / \u5206\u6BCD(\u4E0B)\n\n' +
        '\u4F8B\uFF1A1/2 + 1/3 = ?\n' +
        '\u2460\uFE0F \u901A\u5206\uFF1A\u516C\u5206\u6BCD = 6\n' +
        '\u2461\uFE0F 1/2 = 3/6\uFF0C1/3 = 2/6\n' +
        '\u2462\uFE0F 3/6 + 2/6 = 5/6\n\n' +
        '\uD83D\uDCAC \u6253\u689D\u5177\u9AD4\u5206\u6578\u984C\u76EE\uFF0C\u6211\u5E6B\u4F60\u9010\u6B65\u8A08!';
    } else if (q.includes('\u767E\u5206') || q.includes('percent') || q.includes('%')) {
      response = '\uD83D\uDCA1 <strong>\u767E\u5206\u6578\uFF1A</strong>\n' +
        '\u767E\u5206\u6578 = \u6BCF100\u4EFD\u6709\u5E7E\u591A\u4EFD\n\n' +
        '\u4F8B\uFF1A\u539F\u50F9$200\uFF0C\u7B54\u68488\u6298 = ?\n' +
        '\u2460\uFE0F 8\u6298 = 80%\n' +
        '\u2461\uFE0F 80% = 80/100 = 0.8\n' +
        '\u2462\uFE0F $200 \u00D7 0.8 = $160\n' +
        '\u2705 \u7B54\u6848\uFF1A$160';
    } else {
      response = '\uD83D\uDCD6 <strong>\u6578\u5B78\u6559\u5B78\uFF1A</strong>\n\u8ACB\u6253\u689D\u5177\u9AD4\u6578\u5B78\u984C\u76EE\uFF0C\u4F8B\u5982\uFF1A\n' +
        '\u2022 "58+27=\u5E7E\u591A"\n\u2022 "100-45=\u5E7E\u591A"\n\u2022 "12\u00D78=\u5E7E\u591A"\n\u2022 "1/2+1/3\u9EDE\u6A23\u8A08"\n\n' +
        '\u6211\u6703\u5E6B\u4F60\u9010\u6B65\u8A08\u7B97\u548C\u89E3\u91CB\uFF01';
    }
    addMsg(response, 'ai');
  }, 500);
}

function addMsg(text, role) {
  var chatId = currentMode === 'free' ? 'freeChat' : 'practiceChat';
  var chat = document.getElementById(chatId);
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var formatted = escaped.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  var withBreaks = formatted.replace(/\\n/g,'<br>');
  div.innerHTML = withBreaks;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function updateStats() {
  document.getElementById('correctCount').textContent = stats.correct;
  document.getElementById('hintCount').textContent = stats.hints;
  document.getElementById('qCount').textContent = stats.total;
}

function updateGami() {
  document.getElementById('gamiPoints').textContent = gami.points;
  document.getElementById('gamiStreak').textContent = gami.streak;
  saveSession();
}

function saveSession() {
  try { localStorage.setItem('lf_tutor_session', JSON.stringify({stats:stats,gami:gami,topic:currentTopic})); } catch(e) {}
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement === document.getElementById('userInput')) {
    handleSend();
  }
});

</script>
