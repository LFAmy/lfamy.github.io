<style>
body{background:linear-gradient(170deg,#091524,#0F2440,#1A3C6D);min-height:100vh;padding-top:var(--nav-height)}
.practice-container{max-width:900px;margin:0 auto;padding:20px 24px}

/* Header */
.practice-header{text-align:center;padding:30px 0 20px}
.practice-header h1{color:white;margin-bottom:6px}
.practice-header p{color:rgba(255,255,255,0.6);font-size:0.9em}

/* Setup Panel */
.setup-panel{background:var(--surface);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-lg);margin-bottom:20px}
.setup-panel h2{font-size:1.1em;margin-bottom:20px}
.grade-select{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.grade-btn{flex:1;min-width:80px;padding:14px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;text-align:center;font-weight:600;transition:all var(--duration-fast);font-family:var(--font-sans)}
.grade-btn:hover{border-color:var(--blue);background:#EFF6FF}
.grade-btn.active{background:var(--blue);color:white;border-color:var(--blue)}
.grade-btn .grade-name{font-size:1em}
.grade-btn .grade-desc{font-size:0.7em;opacity:0.7;margin-top:2px}

.topic-select{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:16px}
.topic-chip{padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;text-align:center;font-size:0.85em;font-weight:500;transition:all var(--duration-fast);background:var(--surface)}
.topic-chip:hover{border-color:var(--gold);background:var(--gold-glass)}
.topic-chip.selected{border-color:var(--gold);background:var(--gold-glass);font-weight:700}

.mode-select{display:flex;gap:10px;margin-bottom:20px}
.mode-btn{flex:1;padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;text-align:center;transition:all var(--duration-fast);font-family:var(--font-sans)}
.mode-btn:hover{border-color:var(--purple)}
.mode-btn.active{border-color:var(--purple);background:var(--purple-light);color:var(--purple);font-weight:700}
.mode-btn .mode-icon{display:block;font-size:1.3em;margin-bottom:4px}
.mode-btn .mode-name{font-weight:600;font-size:0.85em}
.mode-btn .mode-desc{font-size:0.7em;color:var(--text-muted)}

/* Quiz Panel */
.quiz-panel{display:none}
.quiz-card{background:var(--surface);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-lg);margin-bottom:16px}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.quiz-progress{font-size:0.82em;color:var(--text-muted)}
.quiz-timer{font-size:1.1em;font-weight:700;color:var(--blue);font-family:var(--font-mono)}
.quiz-timer.warning{color:var(--red);animation:pulse-glow 1s infinite}
.quiz-question{font-size:1.1em;line-height:1.8;color:var(--text);margin-bottom:20px;padding:16px;background:var(--surface-alt);border-radius:var(--radius-sm);border-left:4px solid var(--blue)}

.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-option{padding:14px 18px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all var(--duration-fast);font-size:0.95em;display:flex;align-items:center;gap:10px}
.quiz-option:hover{border-color:var(--blue);background:#EFF6FF}
.quiz-option.selected{border-color:var(--blue);background:#EFF6FF;font-weight:600}
.quiz-option.correct{border-color:var(--green);background:var(--green-light)}
.quiz-option.wrong{border-color:var(--red);background:var(--red-light)}

.quiz-input{width:100%;padding:14px 18px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:1.1em;outline:none;transition:border var(--duration-fast)}
.quiz-input:focus{border-color:var(--blue)}

.quiz-submit{width:100%;padding:14px;margin-top:14px;background:var(--blue);color:white;border:none;border-radius:var(--radius-full);font-size:1em;font-weight:700;cursor:pointer;transition:all var(--duration-fast)}
.quiz-submit:hover{background:var(--blue-light);transform:translateY(-1px);box-shadow:var(--shadow-blue)}
.quiz-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* Feedback */
.feedback-panel{display:none;padding:20px;border-radius:var(--radius);margin-top:14px;animation:slideUp 0.3s var(--ease-out)}
.feedback-correct{background:var(--green-light);border:2px solid var(--green);color:var(--green)}
.feedback-wrong{background:var(--red-light);border:2px solid var(--red);color:var(--red)}
.feedback-trap{margin-top:10px;padding:12px;background:var(--amber-light);border-radius:var(--radius-sm);font-size:0.88em;color:#92400e}

/* Results */
.results-panel{display:none}
.results-card{background:var(--surface);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-lg);text-align:center}
.results-score{font-family:var(--font-display);font-size:3em;font-weight:900;color:var(--blue);margin:10px 0}
.results-grade{display:inline-block;padding:6px 24px;border-radius:var(--radius-full);font-weight:700;font-size:0.9em;margin:8px 0}
.grade-a{background:var(--green-light);color:var(--green)}
.grade-b{background:#EFF6FF;color:var(--blue)}
.grade-c{background:var(--amber-light);color:#92400e}
.grade-d{background:var(--red-light);color:var(--red)}

.results-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0;text-align:center}
.results-stat{padding:14px;background:var(--surface-alt);border-radius:var(--radius-sm)}
.results-stat .num{font-size:1.4em;font-weight:900;color:var(--blue)}
.results-stat .lbl{font-size:0.72em;color:var(--text-muted);margin-top:2px}

/* SRS Review */
.srs-panel{background:var(--amber-light);border:2px solid var(--amber);border-radius:var(--radius);padding:16px;margin:16px 0}
.srs-panel h3{color:#92400e;margin-bottom:8px;font-size:0.9em}
.srs-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(146,64,14,0.1);font-size:0.82em}
.srs-item .urgency{font-weight:700}
.srs-critical{color:var(--red)}
.srs-warning{color:var(--amber)}
.srs-ok{color:var(--green)}

/* Back button */
.back-btn{padding:8px 20px;background:transparent;border:1px solid rgba(255,255,255,0.2);color:white;border-radius:var(--radius-full);cursor:pointer;font-size:0.82em;transition:all var(--duration-fast)}
.back-btn:hover{background:rgba(255,255,255,0.1)}

@media(max-width:500px){
  .grade-select{gap:6px}
  .grade-btn{padding:10px 6px;min-width:60px}
  .topic-select{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}

/* Celebration animation for correct answers */
@keyframes celebrate {
  0% { transform: scale(0.8); opacity: 0; }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes confetti-fall {
  0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(60px) rotate(720deg); opacity: 0; }
}
.celebration {
  animation: celebrate 0.5s ease-out;
}
.confetti {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  animation: confetti-fall 1.5s ease-out forwards;
  font-size: 1.5em;
}
</style>

<div class="practice-container">
  <!-- Header -->
  <div class="practice-header">
    <h1>📝 做題練習系統</h1>
    <p>P3-P6 · 自適應難度 · AI批改 · 陷阱分析 · SRS複習</p>
  </div>

  <!-- ═══ SETUP ═══ -->
  <div class="setup-panel" id="setupPanel">
    <h2>🎯 選擇練習設定</h2>

    <!-- Grade -->
    <div style="font-size:0.82em;color:var(--text-muted);margin-bottom:8px">年級</div>
    <div class="grade-select" id="gradeSelect">
      <button class="grade-btn" data-grade="P3"><span class="grade-name">P3</span><span class="grade-desc">小三</span></button>
      <button class="grade-btn" data-grade="P4"><span class="grade-name">P4</span><span class="grade-desc">小四</span></button>
      <button class="grade-btn active" data-grade="P5"><span class="grade-name">P5</span><span class="grade-desc">小五</span></button>
      <button class="grade-btn" data-grade="P6"><span class="grade-name">P6</span><span class="grade-desc">小六</span></button>
    </div>

    <!-- Topics -->
    <div style="font-size:0.82em;color:var(--text-muted);margin-bottom:8px">課題（可選多個）</div>
    <div class="topic-select" id="topicSelect"></div>

    <!-- Mode -->
    <div style="font-size:0.82em;color:var(--text-muted);margin-bottom:8px">模式</div>
    <div class="mode-select">
      <button class="mode-btn active" data-mode="casual">
        <span class="mode-icon">🎮</span>
        <span class="mode-name">休閒模式</span>
        <span class="mode-desc">不限時 · 可查提示</span>
      </button>
      <button class="mode-btn" data-mode="timed">
        <span class="mode-icon">⏱️</span>
        <span class="mode-name">限時挑戰</span>
        <span class="mode-desc">每題2分鐘</span>
      </button>
      <button class="mode-btn" data-mode="exam">
        <span class="mode-icon">📋</span>
        <span class="mode-name">模擬測驗</span>
        <span class="mode-desc">10題 · 30分鐘</span>
      </button>
    </div>

    <!-- Question Count -->
    <div style="font-size:0.82em;color:var(--text-muted);margin-bottom:8px">題數</div>
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <button class="grade-btn active" data-count="5">5題</button>
      <button class="grade-btn" data-count="10">10題</button>
      <button class="grade-btn" data-count="20">20題</button>
    </div>

    <button class="quiz-submit" onclick="startPractice()" style="width:auto;padding:14px 40px;display:inline-flex;align-items:center;gap:8px;">
      🚀 開始練習
    </button>

    <!-- SRS Review Reminders -->
    <div class="srs-panel" id="srsReminders" style="display:none;margin-top:20px"></div>
  </div>

  <!-- ═══ QUIZ ═══ -->
  <div class="quiz-panel" id="quizPanel">
    <div class="quiz-card">
      <div class="quiz-header">
        <span class="quiz-progress" id="quizProgress">第 1/5 題</span>
        <span class="quiz-timer" id="quizTimer" style="display:none">02:00</span>
        <button class="back-btn" onclick="endPractice()">✕ 結束</button>
      </div>
      <div class="quiz-question" id="quizQuestion"></div>
      <div id="quizOptions"></div>
      <input type="text" class="quiz-input" id="quizInput" placeholder="輸入你的答案..." style="display:none">
      <button class="quiz-submit" id="quizSubmit" onclick="submitAnswer()">✅ 提交答案</button>
      <div class="feedback-panel" id="feedbackPanel"></div>
    </div>
  </div>

  <!-- ═══ RESULTS ═══ -->
  <div class="results-panel" id="resultsPanel">
    <div class="results-card">
      <h2>📊 練習結果</h2>
      <div class="results-score" id="resultsScore">0%</div>
      <div class="results-grade" id="resultsGrade">--</div>
      <div class="results-breakdown">
        <div class="results-stat"><div class="num" id="resultCorrect">0</div><div class="lbl">✅ 正確</div></div>
        <div class="results-stat"><div class="num" id="resultWrong">0</div><div class="lbl">❌ 錯誤</div></div>
        <div class="results-stat"><div class="num" id="resultTime">0s</div><div class="lbl">⏱️ 用時</div></div>
        <div class="results-stat"><div class="num" id="resultTraps">0</div><div class="lbl">⚠️ 陷阱</div></div>
      </div>
      <div id="resultTrapsList" style="text-align:left;margin:16px 0;font-size:0.85em"></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
        <button class="lf-btn lf-btn-primary" onclick="startPractice()">🔄 再做一次</button>
        <button class="lf-btn lf-btn-outline" onclick="showSetup()">📚 換課題</button>
        <a href="/ai-tutor.html" class="lf-btn lf-btn-gold">🤖 問 AI 導師</a>
      </div>
    </div>
  </div>
</div>

/* ── State ── */
let state = {
  grade: 'P5',
  topics: [],
  mode: 'casual',
  count: 5,
  questions: [],
  currentIndex: 0,
  answers: [],
  startTime: null,
  timerInterval: null,
  questionStart: null
};

/* ── Init ── */
(function init() {
  state.startTime = Date.now();

  // Grade selection
  document.querySelectorAll('#gradeSelect .grade-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#gradeSelect .grade-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      state.grade = this.dataset.grade;
      renderTopics();
    });
  });

  // Mode selection
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      state.mode = this.dataset.mode;

      // Auto-set count for exam mode
      if (state.mode === 'exam') {
        document.querySelectorAll('[data-count]').forEach(b => {
          b.classList.remove('active');
          if (b.dataset.count === '10') b.classList.add('active');
        });
        state.count = 10;
      }
    });
  });

  // Count selection
  document.querySelectorAll('[data-count]').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('[data-count]').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      state.count = parseInt(this.dataset.count);
    });
  });

  renderTopics();
  loadSRS();
})();

/* ── Topics ── */
function renderTopics() {
  const container = document.getElementById('topicSelect');
  const bank = QUESTION_BANK[state.grade];
  if (!bank) { container.innerHTML = '<p>暫無此年級題目</p>'; return; }

  let html = '';
  for (const [topic, questions] of Object.entries(bank)) {
    const selected = state.topics.includes(topic);
    html += '<div class="topic-chip' + (selected ? ' selected' : '') + '" data-topic="' + topic + '">' + topic + ' (' + questions.length + '題)</div>';
  }
  // Select all button
  html += '<div class="topic-chip" data-topic="__all__" style="background:var(--blue-glass);border-color:var(--blue);color:var(--blue);font-weight:700">✅ 全部課題</div>';

  container.innerHTML = html;

  container.querySelectorAll('.topic-chip').forEach(chip => {
    chip.addEventListener('click', function() {
      const topic = this.dataset.topic;
      if (topic === '__all__') {
        state.topics = Object.keys(bank);
        container.querySelectorAll('.topic-chip').forEach(c => c.classList.add('selected'));
      } else {
        this.classList.toggle('selected');
        if (this.classList.contains('selected')) {
          if (!state.topics.includes(topic)) state.topics.push(topic);
        } else {
          state.topics = state.topics.filter(t => t !== topic);
        }
      }
    });
  });
}

/* ── SRS ── */
function loadSRS() {
  try {
    const srs = JSON.parse(localStorage.getItem('lf_srs_schedule') || '{}');
    const dueTopics = [];
    for (const [id, s] of Object.entries(srs)) {
      if (Date.now() >= s.nextReview) {
        let urgency = 'ok';
        if (s.correctRate < 0.5) urgency = 'critical';
        else if (s.correctRate < 0.7) urgency = 'warning';
        dueTopics.push({ id, ...s, urgency });
      }
    }

    if (dueTopics.length > 0) {
      dueTopics.sort((a, b) => a.correctRate - b.correctRate);
      const panel = document.getElementById('srsReminders');
      panel.style.display = 'block';
      let html = '<h3>🔄 建議複習嘅課題</h3>';
      for (const t of dueTopics.slice(0, 4)) {
        const cls = t.urgency === 'critical' ? 'srs-critical' : t.urgency === 'warning' ? 'srs-warning' : 'srs-ok';
        html += '<div class="srs-item"><span>' + t.id + ' (' + Math.round(t.correctRate * 100) + '%正確率)</span><span class="urgency ' + cls + '">' + (t.urgency === 'critical' ? '🔴 急需' : t.urgency === 'warning' ? '🟡 關注' : '🟢 可複習') + '</span></div>';
      }
      panel.innerHTML = html;
    }
  } catch(e) {}
}

/* ── Start Practice ── */
function startPractice() {
  const bank = QUESTION_BANK[state.grade];
  if (!bank) { alert('請先選擇年級和課題'); showSetup(); return; }

  // topics already defined above
  if (topics.length === 0) { alert('此年級暫無題目，請選擇其他年級'); return; }


  // topics already defined above
  let pool = [];
  for (const t of topics) {
    if (bank[t]) pool = pool.concat(bank[t]);
  }

  if (pool.length === 0) {
    // Fallback: use all topics
    for (const t of Object.keys(bank)) pool = pool.concat(bank[t]);
  }

    // BKT adaptive: filter questions by difficulty based on mastery
  let adaptivePool = pool;
  for (const topic of topics) {
    if (typeof BKT !== 'undefined') {
      const mastery = BKT.getMastery(state.grade + '-' + topic);
      if (mastery > 0.8) {
        // Student mastered this topic — prefer harder questions
        const hard = pool.filter(q => q.diff === '★★★' || q.diff === '★★');
        if (hard.length > 0) adaptivePool = adaptivePool.concat(hard.filter(q => !adaptivePool.includes(q)));
      } else if (mastery < 0.4) {
        // Student struggling — prefer easier questions
        const easy = pool.filter(q => q.diff === '★');
        if (easy.length > 0) adaptivePool = adaptivePool.concat(easy.filter(q => !adaptivePool.includes(q)));
      }
    }
  }
  if (adaptivePool.length < state.count) adaptivePool = pool; // fallback

  // Shuffle and pick
  pool = adaptivePool.sort(() => Math.random() - 0.5);
  state.questions = adaptivePool.slice(0, Math.min(state.count, adaptivePool.length));
  state.currentIndex = 0;
  state.answers = [];
  state.startTime = Date.now();

  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('resultsPanel').style.display = 'none';
  document.getElementById('quizPanel').style.display = 'block';

  showQuestion();
}

function showQuestion() {
  if (state.currentIndex >= state.questions.length) {
    showResults();
    return;
  }

  const q = state.questions[state.currentIndex];
  state.questionStart = Date.now();

  document.getElementById('quizProgress').textContent = '第 ' + (state.currentIndex + 1) + '/' + state.questions.length + ' 題';
  document.getElementById('quizQuestion').textContent = q.q;
  document.getElementById('feedbackPanel').style.display = 'none';
  document.getElementById('quizSubmit').disabled = false;
  document.getElementById('quizSubmit').textContent = '✅ 提交答案';

  // Options or input
  const optsContainer = document.getElementById('quizOptions');
  const inputEl = document.getElementById('quizInput');

  if (q.opts && q.opts.length > 0) {
    optsContainer.style.display = 'flex';
    inputEl.style.display = 'none';
    let html = '';
    for (const opt of q.opts) {
      html += '<div class="quiz-option" data-value="' + opt + '">' + opt + '</div>';
    }
    optsContainer.innerHTML = html;
    optsContainer.querySelectorAll('.quiz-option').forEach(opt => {
      opt.addEventListener('click', function() {
        optsContainer.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
        this.classList.add('selected');
      });
    });
  } else {
    optsContainer.style.display = 'none';
    inputEl.style.display = 'block';
    inputEl.value = '';
    inputEl.focus();
  }

  // Timer
  clearInterval(state.timerInterval);
  if (state.mode === 'timed') {
    let timeLeft = 120;
    document.getElementById('quizTimer').style.display = 'inline';
    document.getElementById('quizTimer').textContent = '02:00';
    document.getElementById('quizTimer').classList.remove('warning');
    state.timerInterval = setInterval(() => {
      timeLeft--;
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      document.getElementById('quizTimer').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      if (timeLeft <= 30) document.getElementById('quizTimer').classList.add('warning');
      if (timeLeft <= 0) {
        clearInterval(state.timerInterval);
        submitAnswer();
      }
    }, 1000);
  } else if (state.mode === 'exam') {
    let timeLeft = 1800;
    document.getElementById('quizTimer').style.display = 'inline';
    document.getElementById('quizTimer').textContent = '30:00';
    state.timerInterval = setInterval(() => {
      timeLeft--;
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      document.getElementById('quizTimer').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      if (timeLeft <= 300) document.getElementById('quizTimer').classList.add('warning');
      if (timeLeft <= 0) { clearInterval(state.timerInterval); showResults(); }
    }, 1000);
  } else {
    document.getElementById('quizTimer').style.display = 'none';
  }
}

function submitAnswer() {
  // Double-submit guard
  const btn = document.getElementById('quizSubmit');
  if (btn.disabled) return;
  btn.disabled = true;
  const q = state.questions[state.currentIndex];
  let userAnswer = '';

  if (q.opts && q.opts.length > 0) {
    const selected = document.querySelector('#quizOptions .quiz-option.selected');
    if (!selected) return;
    userAnswer = selected.dataset.value;
    // Show correct/wrong
    document.querySelectorAll('#quizOptions .quiz-option').forEach(opt => {
      if (opt.dataset.value === q.ans) opt.classList.add('correct');
      if (opt.dataset.value === userAnswer && userAnswer !== q.ans) opt.classList.add('wrong');
    });
  } else {
    userAnswer = document.getElementById('quizInput').value.trim();
    if (!userAnswer) return;
  }

  const elapsed = Math.round((Date.now() - state.questionStart) / 1000);
  const isCorrect = userAnswer === q.ans;

  state.answers.push({
    question: q.q,
    userAnswer,
    correctAnswer: q.ans,
    isCorrect,
    trap: q.trap,
    time: elapsed,
    diff: q.diff
  });

  // Show feedback
  const fb = document.getElementById('feedbackPanel');
  fb.style.display = 'block';
  fb.className = 'feedback-panel ' + (isCorrect ? 'feedback-correct' : 'feedback-wrong');
  fb.innerHTML = isCorrect
    ? '✅ **正確！** 答得好！用時 ' + elapsed + ' 秒'
    : '❌ **答錯咗！** 正確答案係：**' + q.ans + '**';

  if (q.trap) {
    fb.innerHTML += '<div class="feedback-trap">⚠️ 陷阱分析：**' + q.trap + '** — ' + (isCorrect ? '你成功避開咗呢個陷阱！' : '記住呢個陷阱，下次唔好再中！') + '</div>';
  }

  document.getElementById('quizSubmit').textContent = '下一題 ➡️';
  document.getElementById('quizSubmit').disabled = false;

  // Override submit to go next
  document.getElementById('quizSubmit').onclick = function() {
    state.currentIndex++;
    document.getElementById('quizSubmit').onclick = submitAnswer;
    document.getElementById('quizSubmit').textContent = '✅ 提交答案';
    showQuestion();
  };

    // Track BKT mastery
  if (typeof BKT !== 'undefined') {
    const topicKey = state.grade + '-' + (q.trap || 'general');
    BKT.record(topicKey, isCorrect);
  }

  // Cross-page: update student profile weak topics
  try {
    const profile = JSON.parse(localStorage.getItem('lf_student_profile') || '{}');
    if (!profile.weakTopics) profile.weakTopics = [];
    if (!profile.strongTopics) profile.strongTopics = [];
    if (isCorrect) {
      profile.weakTopics = profile.weakTopics.filter(t => t !== (q.trap || 'general'));
      if (!profile.strongTopics.includes(q.trap || 'general')) profile.strongTopics.push(q.trap || 'general');
    } else {
      if (!profile.weakTopics.includes(q.trap || 'general')) profile.weakTopics.push(q.trap || 'general');
    }
    profile.totalQuestions = (profile.totalQuestions || 0) + 1;
    profile.correctCount = (profile.correctCount || 0) + (isCorrect ? 1 : 0);
    localStorage.setItem('lf_student_profile', JSON.stringify(profile));
  } catch(e) {}

  // Track
  if (typeof GAMIFICATION !== 'undefined') GAMIFICATION.recordAnswer(isCorrect);
  if (typeof incrementUsage === 'function') incrementUsage('practice');

  // Save SRS
  try {
    const srs = JSON.parse(localStorage.getItem('lf_srs_schedule') || '{}');
    const topicKey = state.grade + '-' + (q.trap || 'general');
    if (!srs[topicKey]) srs[topicKey] = { correct: 0, total: 0 };
    srs[topicKey].total++;
    if (isCorrect) srs[topicKey].correct++;
    srs[topicKey].correctRate = srs[topicKey].correct / srs[topicKey].total;
    const intervals = srs[topicKey].correctRate < 0.5 ? 86400000 : srs[topicKey].correctRate < 0.7 ? 259200000 : srs[topicKey].correctRate < 0.85 ? 604800000 : 1209600000;
    srs[topicKey].nextReview = Date.now() + intervals;
    srs[topicKey].lastReviewed = Date.now();
    localStorage.setItem('lf_srs_schedule', JSON.stringify(srs));
  } catch(e) {}
}

function showResults() {
  clearInterval(state.timerInterval);
  document.getElementById('quizPanel').style.display = 'none';
  document.getElementById('resultsPanel').style.display = 'block';

  const correct = state.answers.filter(a => a.isCorrect).length;
  const total = state.answers.length;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const totalTime = Math.round((Date.now() - state.startTime) / 1000);
  const traps = [...new Set(state.answers.filter(a => !a.isCorrect && a.trap).map(a => a.trap))];

  document.getElementById('resultsScore').textContent = pct + '%';
  const gradeEl = document.getElementById('resultsGrade');
  if (pct >= 90) { gradeEl.textContent = '🏆 A 級 · 優秀！'; gradeEl.className = 'results-grade grade-a'; }
  else if (pct >= 75) { gradeEl.textContent = '🎯 B 級 · 不錯！'; gradeEl.className = 'results-grade grade-b'; }
  else if (pct >= 50) { gradeEl.textContent = '📚 C 級 · 仍需努力'; gradeEl.className = 'results-grade grade-c'; }
  else { gradeEl.textContent = '🔴 D 級 · 需要加強基礎'; gradeEl.className = 'results-grade grade-d'; }

  document.getElementById('resultCorrect').textContent = correct;
  document.getElementById('resultWrong').textContent = total - correct;
  document.getElementById('resultTime').textContent = Math.floor(totalTime / 60) + 'm ' + (totalTime % 60) + 's';
  document.getElementById('resultTraps').textContent = traps.length;

  let trapsHtml = '';
  if (traps.length > 0) {
    trapsHtml = '<h3 style="margin-bottom:8px">⚠️ 中咗嘅陷阱：</h3>';
    for (const t of traps) {
      trapsHtml += '<div style="padding:8px 12px;background:var(--amber-light);border-radius:var(--radius-sm);margin:4px 0;font-size:0.85em">🔸 ' + t + '</div>';
    }
  }
  document.getElementById('resultTrapsList').innerHTML = trapsHtml;
}

function endPractice() {
  clearInterval(state.timerInterval);
  showResults();
}

function showSetup() {
  clearInterval(state.timerInterval);
  document.getElementById('quizPanel').style.display = 'none';
  document.getElementById('resultsPanel').style.display = 'none';
  document.getElementById('setupPanel').style.display = 'block';
  renderTopics();
  loadSRS();
}

/* ── Keyboard ── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('quizInput').style.display !== 'none' && document.activeElement === document.getElementById('quizInput')) {
    submitAnswer();
  }
});

function spawnConfetti() {
  var emojis = ['🎉','⭐','🌟','✨','💫','🎯','🏆','💪'];
  for (var i = 0; i < 10; i++) {
    setTimeout(function() {
      var el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 80 + 10 + '%';
      el.style.top = Math.random() * 40 + 10 + '%';
      el.style.animationDelay = Math.random() * 0.3 + 's';
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 1800);
    }, i * 80);
  }
}
