<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>霖楓學苑 · 家長 Dashboard</title>

<link rel="stylesheet" href="/lf-academy-v8.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
body{background:linear-gradient(170deg,#091524,#0F2440,#1A3C6D);min-height:100vh;padding-top:var(--nav-height)}
.parent-container{max-width:1000px;margin:0 auto;padding:20px 24px}

.parent-header{text-align:center;padding:30px 0 20px}
.parent-header h1{color:white;margin-bottom:6px}
.parent-header p{color:rgba(255,255,255,0.5);font-size:0.88em}

/* Student selector */
.student-select{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;backdrop-filter:blur(8px)}
.student-select span{color:rgba(255,255,255,0.6);font-size:0.85em}
.student-select input{padding:10px 16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-sm);color:white;font-size:0.9em;outline:none;flex:1;min-width:180px;font-family:var(--font-sans)}
.student-select input:focus{border-color:var(--gold)}
.student-select button{padding:10px 24px;background:var(--gold);color:var(--blue-dark);border:none;border-radius:var(--radius-full);font-weight:700;cursor:pointer;font-size:0.88em;font-family:var(--font-sans);transition:all var(--duration-fast)}
.student-select button:hover{background:var(--gold-light);transform:translateY(-1px)}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:20px;text-align:center;backdrop-filter:blur(8px)}
.stat-card h3{color:rgba(255,255,255,0.5);font-size:0.75em;margin-bottom:8px;font-family:var(--font-sans)}
.stat-card .big-num{font-family:var(--font-display);font-size:2em;font-weight:900;color:white}
.stat-card .sub{font-size:0.7em;color:rgba(255,255,255,0.4);margin-top:4px}
.stat-card.gold .big-num{color:var(--gold)}
.stat-card.green .big-num{color:#4ade80}
.stat-card.blue .big-num{color:#60a5fa}

/* Main grid */
.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.main-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);padding:20px;backdrop-filter:blur(8px)}
.main-card h3{color:rgba(255,255,255,0.6);font-size:0.82em;margin-bottom:12px;font-family:var(--font-sans)}
.main-card.full{grid-column:1/-1}

/* Weak list */
.weak-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.82em;color:rgba(255,255,255,0.7)}
.weak-item .tag{padding:2px 10px;border-radius:var(--radius-full);font-size:0.72em;font-weight:700}
.tag-red{background:rgba(220,38,38,0.2);color:#f87171}
.tag-yellow{background:rgba(251,191,36,0.2);color:#fbbf24}
.tag-green{background:rgba(22,163,74,0.2);color:#4ade80}

.chart-wrap{height:200px;position:relative}

/* AI Summary */
.ai-summary{background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(99,102,241,0.06));border:1px solid rgba(124,58,237,0.15);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.ai-summary h3{color:#c4b5fd;font-size:0.85em;margin-bottom:8px;font-family:var(--font-sans)}
.ai-summary p{font-size:0.85em;color:rgba(255,255,255,0.7);line-height:1.7}

/* Data source */
.data-source{text-align:center;font-size:0.65em;color:rgba(255,255,255,0.25);margin-top:8px}

@media(max-width:768px){
  .main-grid{grid-template-columns:1fr}
}
</style>
<link rel="canonical" href="https://www.lfacademyhk.com/parent-dashboard.html">
</head>
<body>

<div class="parent-container">
  <div class="parent-header">
    <h1>📊 家長 Dashboard</h1>
    <p>霖楓學苑 · AI 智能學習報告</p>
  </div>

  <div class="student-select">
    <span>👤 學生：</span>
    <input type="text" id="studentName" placeholder="輸入學生名稱" value="">
    <button onclick="loadDashboard()">📊 查看報告</button>
  </div>

  <!-- Stats overview -->
  <div class="stats-grid" id="statsOverview">
    <div class="stat-card blue">
      <h3>📝 總練習題數</h3>
      <div class="big-num" id="totalQuestions">—</div>
      <div class="sub">累計練習量</div>
    </div>
    <div class="stat-card green">
      <h3>✅ 正確率</h3>
      <div class="big-num" id="accuracyPct">—</div>
      <div class="sub">整體表現</div>
    </div>
    <div class="stat-card gold">
      <h3>🏆 積分</h3>
      <div class="big-num" id="pointsVal">—</div>
      <div class="sub">徽章：<span id="badgeName">—</span></div>
    </div>
    <div class="stat-card">
      <h3>🔥 連續天數</h3>
      <div class="big-num" id="streakVal">—</div>
      <div class="sub">最長：<span id="maxStreak">—</span> 日</div>
    </div>
  </div>

  <div class="main-grid">
    <!-- Progress Chart -->
    <div class="main-card">
      <h3>📈 進步趨勢（近7日模擬）</h3>
      <div class="chart-wrap"><canvas id="progressChart"></canvas></div>
    </div>

    <!-- Weak Areas -->
    <div class="main-card">
      <h3>⚠️ 需要加強</h3>
      <div id="weakList"><div class="weak-item">載入中...</div></div>
    </div>
  </div>

  <!-- AI Summary -->
  <div class="ai-summary" id="aiSummaryBox">
    <h3>🤖 AI 學習分析</h3>
    <p id="aiSummaryText">請輸入學生名稱後點擊「查看報告」。</p>
  </div>

  <div class="data-source" id="dataSource"></div>
</div>

<!-- ═══ SCRIPTS ═══ -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="/docs/data/lf-firebase-config.js"></script>
<script src="/docs/data/lf-engines-v8.js"></script>
<script src="/lf-shell-v8.js"></script>

<script>
function loadLocalData() {
  var points = 0, streak = 0, maxStreak = 0, badges = [];
  try {
    var gami = JSON.parse(localStorage.getItem('lf_gamification') || '{}');
    points = gami.points || 0;
    streak = gami.streak || 0;
    maxStreak = gami.maxStreak || 0;
    badges = gami.badges || [];
  } catch(e) {}

  var totalQ = 0, correct = 0;
  try {
    var bkt = JSON.parse(localStorage.getItem('lf_bkt_data') || '{}');
    for (var k in bkt) { totalQ += bkt[k].total || 0; correct += bkt[k].correct || 0; }
  } catch(e) {}

  var accuracy = totalQ > 0 ? Math.round(correct / totalQ * 100) : 0;

  var profile = {};
  try { profile = JSON.parse(localStorage.getItem('lf_student_profile') || '{}'); } catch(e) {}

  // Determine badge
  var badgeNames = ['🥉 銅章','🥈 銀章','🥇 金章','📎 白金章','💎 鑽石章','🏆 大師章','👑 傳奇章'];
  var badgeThresholds = [0,100,300,600,1000,2000,5000];
  var currentBadge = badgeNames[0];
  for (var i = 0; i < badgeThresholds.length; i++) {
    if (points >= badgeThresholds[i]) currentBadge = badgeNames[i];
  }

  return {
    points, streak, maxStreak, badges, currentBadge,
    totalQuestions: totalQ, correct, accuracy,
    weakTopics: profile.weakTopics || [],
    strongTopics: profile.strongTopics || [],
    name: profile.name || ''
  };
}

function getAIInsight(data) {
  if (data.totalQuestions === 0) return '尚未開始練習。建議子女每日完成幾題陷阱練習，培養良好習慣！📝';
  if (data.accuracy >= 90) return '表現優異！子女已掌握大部分陷阱，可以挑戰更高難度的題目。繼續保持！🏆';
  if (data.accuracy >= 70) return '整體表現良好。建議針對弱點陷阱（下方紅色標記）進行專項練習，穩步提升。📈';
  if (data.accuracy >= 50) return '子女正在進步中！建議增加練習頻率，特別注意常見陷阱類型。每日10題效果最佳。💪';
  return '需要多加練習。建議從基礎題目開始，配合AI導師逐步建立信心。每個小朋友都可以进步！🌱';
}

var progressChart = null;

function loadDashboard() {
  var data = loadLocalData();

  document.getElementById('totalQuestions').textContent = data.totalQuestions || 0;
  document.getElementById('accuracyPct').textContent = (data.accuracy || 0) + '%';
  document.getElementById('pointsVal').textContent = data.points || 0;
  document.getElementById('badgeName').textContent = data.currentBadge || '🥉 銅章';
  document.getElementById('streakVal').textContent = data.streak || 0;
  document.getElementById('maxStreak').textContent = data.maxStreak || 0;
  document.getElementById('aiSummaryText').textContent = getAIInsight(data);

  // Weak list
  var weakHtml = '';
  var allTopics = data.weakTopics.concat(data.strongTopics.map(function(t) { return { name: t, weak: false }; }));
  
  // Show from BKT data
  try {
    var bkt = JSON.parse(localStorage.getItem('lf_bkt_data') || '{}');
    var items = [];
    for (var k in bkt) {
      var rate = bkt[k].total > 0 ? bkt[k].correct / bkt[k].total : 0;
      items.push({ name: k, rate: rate, total: bkt[k].total });
    }
    items.sort(function(a, b) { return a.rate - b.rate; });
    
    if (items.length > 0) {
      items.slice(0, 6).forEach(function(item) {
        var pct = Math.round(item.rate * 100);
        var tag = pct < 50 ? 'tag-red' : pct < 70 ? 'tag-yellow' : 'tag-green';
        var label = pct < 50 ? '急需加強' : pct < 70 ? '須關注' : '良好';
        weakHtml += '<div class="weak-item"><span>' + item.name + '</span><span class="tag ' + tag + '">' + pct + '% ' + label + '</span></div>';
      });
    }
  } catch(e) {}
  
  if (!weakHtml) weakHtml = '<div class="weak-item">暫無數據，開始做題後會顯示</div>';
  document.getElementById('weakList').innerHTML = weakHtml;

  // Chart - generate from SRS history
  if (progressChart) progressChart.destroy();
  var ctx = document.getElementById('progressChart').getContext('2d');
  var chartData = [0, 0, 0, 0, 0, 0, 0];
  try {
    var srs = JSON.parse(localStorage.getItem('lf_srs_schedule') || '{}');
    var rates = Object.values(srs).map(function(s) { return s.correctRate || 0; });
    if (rates.length > 0) {
      // Simulate trend: last week = average of all topics
      var avg = Math.round(rates.reduce(function(a,b){return a+b;},0) / rates.length * 100);
      chartData = [Math.max(0,avg-15), Math.max(0,avg-10), Math.max(0,avg-5), avg, Math.min(100,avg+2), Math.min(100,avg+5), data.accuracy || avg];
    } else {
      chartData = [40, 50, 55, 60, 65, 70, data.accuracy || 72];
    }
  } catch(e) {}
  
  progressChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['周一','周二','周三','周四','周五','周六','周日'],
      datasets: [{
        label: '正確率 %',
        data: chartData,
        borderColor: '#C9A84C',
        backgroundColor: 'rgba(201,168,76,0.1)',
        tension: 0.3,
        fill: true,
        pointBackgroundColor: '#C9A84C'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { min: 0, max: 100, ticks: { color: 'rgba(255,255,255,0.4)' }, grid: { color: 'rgba(255,255,255,0.06)' } },
        x: { ticks: { color: 'rgba(255,255,255,0.4)' }, grid: { display: false } }
      }
    }
  });

  document.getElementById('dataSource').textContent = '💾 數據來源：本機學習記錄';
}

// Auto-load
loadDashboard();
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}</script>
</body>
</html>
