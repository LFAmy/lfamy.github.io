<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霖楓學苑 · AI智能診斷報告</title>
<meta property="og:title" content="霖楓學苑 · AI陷阱診斷報告">
<meta property="og:description" content="AI自動分析學生數學陷阱指紋，生成個人化改善建議。免費體驗。">
<meta property="og:image" content="https://www.lfacademyhk.com/logo.png">
<link rel="canonical" href="https://www.lfacademyhk.com/docs/ai-diagnostic.html">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#f1f5f9;min-height:100vh}
.nav-top{position:sticky;top:0;background:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nav-top a{color:#1A3C6D;text-decoration:none;font-weight:600;font-size:.9em}
.container{max-width:800px;margin:0 auto;padding:24px 20px}
.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card h2{color:#1A3C6D;font-size:1.2em;margin-bottom:16px}
.card h3{color:#1e293b;font-size:1em;margin:16px 0 8px}
.input-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.input-group input,.input-group select{flex:1;min-width:120px;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:.9em}
.btn{padding:10px 24px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:.9em;transition:all .2s}
.btn-primary{background:#1A3C6D;color:#fff}
.btn-primary:hover{background:#0F2440}
.btn-outline{background:#fff;color:#1A3C6D;border:2px solid #1A3C6D}
.btn-success{background:#16A34A;color:#fff}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75em;font-weight:600;margin:2px}
.tag-danger{background:#fef2f2;color:#dc2626}
.tag-warning{background:#fffbeb;color:#d97706}
.tag-success{background:#f0fdf4;color:#16a34a}
.tag-info{background:#eff6ff;color:#2563eb}
.report-section{margin:16px 0;padding:16px;background:#f8fafc;border-radius:12px;border-left:4px solid #1A3C6D}
.trap-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e2e8f0}
.bar{flex:1;height:8px;background:#e2e8f0;border-radius:4px;margin:0 12px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s}
.score{font-size:2em;font-weight:700;color:#1A3C6D}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-card{text-align:center;padding:16px;background:#f8fafc;border-radius:12px}
.stat-card .num{font-size:1.6em;font-weight:700;color:#1A3C6D}
.stat-card .label{font-size:.75em;color:#64748b;margin-top:4px}
.loading{text-align:center;padding:40px;color:#64748b}
.spinner{width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#1A3C6D;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.cta-banner{background:linear-gradient(135deg,#1A3C6D,#1E4D8C);color:#fff;border-radius:16px;padding:24px;text-align:center;margin-top:20px}
.cta-banner h3{color:#fff;margin-bottom:8px}
.cta-banner p{opacity:.85;margin-bottom:16px;font-size:.9em}
.cta-banner .btn{background:#fff;color:#1A3C6D;font-size:1em}
.hidden{display:none}
@media(max-width:600px){.container{padding:12px}.card{padding:18px}}
</style>
</head>
<body>

<div class="nav-top">
  <a href="/"><img src="/logo.png" alt="霖楓學苑" style="height:24px">霖楓學苑</a>
  <a href="/ai-tutor.html">🤖 AI導師</a>
</div>

<div class="container">

<div class="card" id="inputCard">
  <h2>🧬 AI陷阱診斷報告</h2>
  <p style="color:#64748b;margin-bottom:16px;font-size:.9em">輸入你小朋友嘅資料，AI會分析常見陷阱模式，生成個人化診斷報告。</p>
  
  <div class="input-group">
    <select id="gradeSelect">
      <option value="">選擇年級</option>
      <option value="P3">P3</option>
      <option value="P4">P4</option>
      <option value="P5" selected>P5</option>
      <option value="P6">P6</option>
    </select>
    <input type="text" id="nameInput" placeholder="學生名稱 (選填)">
  </div>

  <p style="font-size:.85em;color:#64748b;margin-bottom:12px">選擇你小朋友成日錯嘅題型（可多選）：</p>
  <div class="input-group" id="trapCheckboxes" style="display:flex;flex-wrap:wrap;gap:6px">
  </div>
  
  <div class="input-group" style="margin-top:8px">
    <input type="text" id="customInput" placeholder="或者直接形容你小朋友嘅情況… (例：成日計錯分數加法、文字題睇唔明)">
  </div>

  <button class="btn btn-primary" onclick="generateReport()" style="width:100%;padding:14px;font-size:1em">
    🔍 開始AI診斷
  </button>
</div>

<div class="card hidden" id="loadingCard">
  <div class="loading">
    <div class="spinner"></div>
    <p>AI正在分析陷阱指紋…</p>
  </div>
</div>

<div class="card hidden" id="reportCard"></div>

<div class="cta-banner hidden" id="ctaBanner">
  <h3>🎯 想徹底解決呢啲陷阱？</h3>
  <p>30分鐘免費試堂，AI導師親自幫你小朋友做完整陷阱診斷，制定個人化改善計劃。</p>
  <button class="btn" onclick="location.href='/docs/enroll.html'">免費預約試堂 →</button>
  <p style="font-size:.75em;opacity:.7;margin-top:8px">📱 ClassIn平台 · 唔使接送 · 全港適用</p>
</div>

</div>

<script src="/docs/data/lf-firebase-config.js"></script>
<script>
// Trap topics
const TRAPS = [
  {id:"T1",name:"分數加減",topics:["分數","通分","約分"],grades:["P3","P4","P5","P6"]},
  {id:"T2",name:"圖形旋轉/對稱",topics:["旋轉","對稱","反射"],grades:["P3","P4","P5","P6"]},
  {id:"T3",name:"概率基礎",topics:["概率","機會","可能性"],grades:["P5","P6"]},
  {id:"T4",name:"除數漏寫0",topics:["除法","進位","商"],grades:["P4","P5"]},
  {id:"T5",name:"試商不調整",topics:["除法","試商","餘數"],grades:["P4","P5"]},
  {id:"T6",name:"周界面積混淆",topics:["周界","面積","單位"],grades:["P4","P5","P6"]},
  {id:"T7",name:"時間計算",topics:["時間","60進制","換算"],grades:["P3","P4","P5","P6"]},
  {id:"T8",name:"百分數應用",topics:["百分數","折扣","連續變化"],grades:["P5","P6"]},
  {id:"T9",name:"體積vs容量",topics:["體積","容量","單位換算"],grades:["P5","P6"]},
  {id:"T10",name:"應用題理解偏差",topics:["文字題","關鍵詞","理解"],grades:["P3","P4","P5","P6"]},
  {id:"T11",name:"速率陷阱",topics:["速率","來回平均","距離"],grades:["P5","P6"]},
  {id:"T12",name:"代數基礎",topics:["方程","移項","未知數"],grades:["P5","P6"]},
  {id:"T13",name:"平均數誤解",topics:["平均數","中位數","眾數"],grades:["P5","P6"]},
  {id:"T14",name:"LCM/HCF混淆",topics:["LCM","HCF","因數","倍數"],grades:["P4","P5","P6"]},
  {id:"T15",name:"單位換算陷阱",topics:["單位","m²/cm²","換算"],grades:["P4","P5","P6"]}
];

// Render trap checkboxes
(function(){
  const container = document.getElementById("trapCheckboxes");
  TRAPS.forEach(function(t){
    const label = document.createElement("label");
    label.style.cssText = "display:flex;align-items:center;gap:4px;padding:5px 10px;background:#f1f5f9;border-radius:8px;font-size:.8em;cursor:pointer";
    label.innerHTML = '<input type="checkbox" value="'+t.id+'" style="margin:0"> '+t.name;
    container.appendChild(label);
  });
})();

const TUNNEL = "https://bali-situated-tag-onion.trycloudflare.com/v1";
const TKEY = "freellmapi-bd1dc3c008a33b0b53260ee8183e13b4ebb7d9f15e975d91";

async function generateReport(){
  const grade = document.getElementById("gradeSelect").value;
  const name = document.getElementById("nameInput").value || "同學";
  const custom = document.getElementById("customInput").value.trim();
  const checked = Array.from(document.querySelectorAll("#trapCheckboxes input:checked")).map(function(cb){return cb.value});
  
  if (!grade && !custom && checked.length === 0) {
    alert("請至少選擇年級、陷阱或描述情況");
    return;
  }

  document.getElementById("inputCard").classList.add("hidden");
  document.getElementById("loadingCard").classList.remove("hidden");

  const trapNames = checked.map(function(id){
    const t = TRAPS.find(function(tr){return tr.id===id});
    return t ? t.name : id;
  });

  const prompt = "你係霖楓學苑AI數學診斷師。根據以下學生資料，生成一份詳細嘅「陷阱診斷報告」。\n\n" +
    "學生：" + name + (grade ? " · " + grade : "") + "\n" +
    (trapNames.length > 0 ? "常犯陷阱：" + trapNames.join("、") + "\n" : "") +
    (custom ? "家長描述：" + custom + "\n" : "") +
    "\n請按以下格式生成報告（用繁體中文+廣東話口語，300-500字）：\n" +
    "1. 【陷阱指紋分析】分析學生嘅錯誤模式\n" +
    "2. 【弱項診斷】指出最需要改善嘅3個方面\n" +
    "3. 【改善建議】具體可行嘅練習方法\n" +
    "4. 【預測】如果唔處理，對呈分試嘅影響\n" +
    "5. 【下一步】建議嘅行動方案\n\n語氣要親切鼓勵，針對香港小學數學。";

  try {
    const resp = await fetch(TUNNEL + "/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+TKEY},
      body:JSON.stringify({
        model:"auto",
        messages:[{role:"user",content:prompt}],
        max_tokens:800, temperature:0.7
      })
    });
    const data = await resp.json();
    const report = data.choices[0].message.content;
    renderReport(report, name, grade, trapNames);
  } catch(e){
    // Fallback: local report
    const localReport = generateLocalReport(name, grade, trapNames, custom);
    renderReport(localReport, name, grade, trapNames);
  }
}

function generateLocalReport(name, grade, traps, custom){
  const trapList = traps.length > 0 ? traps.join("、") : (custom || "多個數學概念");
  return "【陷阱指紋分析】\n根據" + name + "嘅情況，主要陷阱集中喺「" + trapList + "」。呢啲陷阱反映出學生可能喺基礎概念理解同運算習慣上有改善空間。\n\n" +
    "【弱項診斷】\n1. 概念理解唔夠深入——識計但唔明點解\n2. 單位/格式經常出錯——做完唔檢查\n3. 應用題解讀能力有待提升\n\n" +
    "【改善建議】\n• 每日做5題針對性練習，做完要解釋每一步點解\n• 用「陷阱筆記本」記錄每次錯咩，搵出規律\n• 文字題要先highlight關鍵數字同詞語，再列式\n\n" +
    "【呈分試預測】\n如果唔處理，呢啲陷阱喺呈分試會重複出現，預計影響10-20分。早啲處理，升Band 1機會大好多！\n\n" +
    "【下一步】\n建議做一次完整AI陷阱診斷（30分鐘免費），等我哋幫" + name + "搵出全部隱藏陷阱，制定針對性改善方案。";
}

function renderReport(report, name, grade, traps){
  document.getElementById("loadingCard").classList.add("hidden");
  
  // Parse sections
  const sections = report.split(/【(.+?)】/);
  let html = '<h2>🧬 陷阱診斷報告</h2>';
  html += '<p style="color:#64748b;margin-bottom:16px">學生：'+name+(grade?' · '+grade:'')+' | 生成時間：'+new Date().toLocaleString("zh-HK")+'</p>';
  
  if (traps.length > 0) {
    html += '<div style="margin-bottom:12px">';
    traps.forEach(function(t){
      html += '<span class="tag tag-danger">'+t+'</span> ';
    });
    html += '</div>';
  }
  
  html += '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="num">'+traps.length+'</div><div class="label">已識別陷阱</div></div>';
  html += '<div class="stat-card"><div class="num" style="color:#d97706">中</div><div class="label">風險等級</div></div>';
  html += '<div class="stat-card"><div class="num">'+Math.min(95,60+traps.length*5)+'%</div><div class="label">改善潛力</div></div>';
  html += '</div>';
  
  for (let i = 1; i < sections.length; i += 2) {
    const title = sections[i];
    const content = sections[i+1] || "";
    html += '<div class="report-section"><h3>📋 '+title+'</h3><p style="line-height:1.7;white-space:pre-wrap">'+content.trim()+'</p></div>';
  }
  
  document.getElementById("reportCard").innerHTML = html;
  document.getElementById("reportCard").classList.remove("hidden");
  document.getElementById("ctaBanner").classList.remove("hidden");
}
</script>
</body>
</html>
